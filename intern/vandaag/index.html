<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Vandaag · Bedrijfsgeheugen</title>
<style>:root{--papier:#FBFAF7;--inkt:#14171A;--blauw:#2742D6;--oranje:#FF4F17;--geel:#FFE86B;--grijs:#5C646E;--lijn:#DCDFE6}
*{box-sizing:border-box}body{margin:0;background:var(--papier);color:var(--inkt);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:28px 18px 80px}nav{font-size:.9rem;margin:0 0 18px}nav a{color:var(--blauw)}
h1{font-size:1.6rem;margin:0 0 4px}h2{font-size:1.12rem;margin:28px 0 10px}.sub{color:var(--grijs);margin:0 0 24px}.mark{background:linear-gradient(transparent 55%,var(--geel) 55%)}
.kaart{border:1px solid var(--lijn);border-radius:12px;background:#fff;padding:16px;margin-bottom:14px}.kop{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.naam{font-weight:650}.bedrijf{color:var(--grijs);font-size:.92rem}.prio,.status{font-variant-numeric:tabular-nums;font-size:.78rem;color:#fff;background:var(--blauw);border-radius:99px;padding:3px 9px;white-space:nowrap}
.status.live{background:#177245}.status.blok{background:#A63A2B}.status.plan{background:#5C646E}.kanaal{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--oranje);margin:10px 0 4px}.reden{font-size:.85rem;color:var(--grijs);margin:0 0 6px}
textarea{width:100%;min-height:140px;border:1px solid var(--lijn);border-radius:8px;padding:10px;font:inherit;font-size:.94rem;resize:vertical;background:var(--papier)}
.rij{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}button{font:inherit;font-size:.88rem;border:1px solid var(--lijn);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}button:hover{border-color:var(--inkt)}
.pri{background:var(--blauw);border-color:var(--blauw);color:#fff}.link{margin-left:auto;font-size:.85rem;color:var(--blauw)}.leeg{color:var(--grijs);padding:24px 0;text-align:center}.klaar{opacity:.45}
#slot{display:flex;gap:8px;margin-bottom:20px}#slot input{flex:1;padding:9px 11px;border:1px solid var(--lijn);border-radius:8px;font:inherit}.melding{font-size:.85rem;color:var(--grijs);margin-top:6px;min-height:18px}
.content-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dmkaart{border:2px solid #bfd0ff;box-shadow:0 10px 28px rgba(39,66,214,.08)}.dmkop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.dmactie{font-weight:800;color:var(--blauw)}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.meta span{font-size:.78rem;border:1px solid var(--lijn);border-radius:99px;padding:4px 8px;background:#fff}.waarde{font-weight:750}.trigger{background:#f5f7ff;border-left:3px solid var(--blauw);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:.9rem}.instructie{font-weight:800;margin:10px 0 6px}.bijlage{font-size:.85rem;color:var(--grijs);margin-top:8px}.btnpdf{border-color:#bfd0ff;color:var(--blauw)}.content-grid .kaart{margin:0}.content-samenvatting{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.pill{border:1px solid var(--lijn);background:#fff;border-radius:99px;padding:5px 10px;font-size:.82rem}.next{font-size:.82rem;color:var(--grijs);margin-top:8px}.url{font-size:.82rem;color:var(--blauw);word-break:break-all}@media(max-width:650px){.content-grid{grid-template-columns:1fr}}</style></head><body><div class="wrap">
<nav><strong>Vandaag</strong> · <a href="https://www.bedrijfsgeheugen.nl/intern/meetoverzicht/">Meetoverzicht</a></nav>
<h1>Wat er <span class="mark">vandaag</span> gebeurt</h1><p class="sub">Content, publicatie, live bewijs, resultaten én commerciële opvolging op één plek.</p>
<form id="slot"><input id="tok" type="password" placeholder="Toegangscode" autocomplete="current-password"><button class="pri">Openen</button></form>
<section id="contentblok" hidden><h2>Content & publicatie</h2><div id="content"></div></section>
<section id="actiesblok" hidden><h2>Arthur acties</h2><p class="sub">Alleen handelingen die Powerhouse technisch niet zelf kan uitvoeren. De rest wordt automatisch afgehandeld.</p><div id="lijst"></div></section></div>
<script>
var API='https://adhjwmvyoixzjtmiroln.supabase.co/functions/v1/bg-dagoverzicht',SLEUTEL='bg_overzicht_code';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function statusNaam(s){return {PLANNED:'Gepland',GENERATED:'Gemaakt',APPROVED:'Goedgekeurd',DISPATCHED:'Verzonden',PUBLISHED:'Gepubliceerd',LIVE_PROVEN:'Live bewezen',MEASURED:'Gemeten',LEARNED:'Verwerkt in learning',BLOCKED:'Geblokkeerd',FAILED:'Mislukt'}[s]||s;}
function kanaalNaam(s){return {linkedin_personal:'LinkedIn persoonlijk',linkedin_company:'LinkedIn bedrijf',instagram:'Instagram',blog:'Blog'}[s]||s;}
function statusClass(s){if(['LIVE_PROVEN','MEASURED','LEARNED'].includes(s))return 'live';if(['BLOCKED','FAILED'].includes(s))return 'blok';return 'plan';}
async function api(p){var r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-bg-token':sessionStorage.getItem(SLEUTEL)||''},body:JSON.stringify(p)});var d=await r.json().catch(function(){return {};});if(r.status===401){sessionStorage.removeItem(SLEUTEL);document.getElementById('slot').style.display='';}if(!r.ok)throw new Error(d.error||r.status);return d;}
function renderContent(d){var doel=document.getElementById('content');var items=d.items||[];var live=items.filter(function(i){return ['LIVE_PROVEN','MEASURED','LEARNED'].includes(i.status);}).length;
 var blog=items.find(function(i){return i.channel==='blog';});var summary='<div class="content-samenvatting"><span class="pill">'+esc(live)+' / '+esc(items.length)+' live bewezen</span><span class="pill">Blog: '+esc(blog?statusNaam(blog.status):'geen slot')+'</span>'+(d.overdue?'<span class="pill">'+esc(d.overdue)+' achterstallig</span>':'')+'</div>';
 if(!items.length){doel.innerHTML=summary+'<p class="leeg">Geen contentverplichtingen voor deze dag gevonden.</p>';return;}
 doel.innerHTML=summary+'<div class="content-grid">'+items.map(function(i){var link=(i.canonical_url&&/^https:\/\//.test(i.canonical_url))?'<a class="url" href="'+esc(i.canonical_url)+'" target="_blank" rel="noopener">Bekijk live publicatie</a>':'';
   return '<div class="kaart"><div class="kop"><div class="naam">'+esc(kanaalNaam(i.channel))+'</div><span class="status '+statusClass(i.status)+'">'+esc(statusNaam(i.status))+'</span></div>'+
   (i.slug?'<div class="bedrijf">'+esc(i.slug)+'</div>':'')+(i.last_error?'<p class="reden">Fout: '+esc(i.last_error)+'</p>':'')+(i.next_action?'<div class="next">Volgende stap: '+esc(i.next_action)+'</div>':'')+link+'</div>';}).join('')+'</div>';}
async function laden(){if(!sessionStorage.getItem(SLEUTEL))return;var doel=document.getElementById('lijst'),content=document.getElementById('content');doel.innerHTML='<p class="leeg">Bezig…</p>';content.innerHTML='<p class="leeg">Contentstatus laden…</p>';
 try{var resultaten=await Promise.all([api({actie:'lijst'}),api({actie:'content'})]);var d=resultaten[0],c=resultaten[1];document.getElementById('slot').style.display='none';document.getElementById('contentblok').hidden=false;document.getElementById('actiesblok').hidden=false;renderContent(c);
 var handmatig=(d.items||[]).filter(function(i){return i.handmatig_nodig===true;});
 if(!handmatig.length){doel.innerHTML='<p class="leeg">Geen handmatige salesacties. Powerhouse handelt de overige acties zelf af.</p>';return;}
 doel.innerHTML=handmatig.map(function(i){var id=esc(i.action_id);var tekst=(i.tekst_om_te_versturen||'');var waarde=Number(i.verwachte_waarde_eur||0);var euro=waarde?new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(waarde):'Nog niet gekwantificeerd';
  var pdf=i.pdf_nodig===true?'<button class="btnpdf" data-pdf="'+id+'">Maak / download PDF</button><div class="bijlage">Bijlage nodig: '+esc((i.asset_type||'persoonlijke one-pager').replaceAll('_',' '))+'</div>':'';
  return '<div class="kaart dmkaart" id="k-'+id+'"><div class="kop"><div><div class="naam">'+esc(i.persoon)+'</div><div class="bedrijf">'+esc(i.rol)+(i.rol&&i.bedrijf?' – ':'')+esc(i.bedrijf)+'</div></div><span class="prio">NU · '+esc(i.prioriteit)+'</span></div>'+
  '<div class="dmkop"><span class="dmactie">LinkedIn DM handmatig versturen</span></div>'+
  '<div class="meta"><span>'+esc(i.connectie_status||'Connectie niet geverifieerd')+'</span><span class="waarde">Potentie: '+esc(euro)+'</span>'+(Number(i.relatie_score||0)>0?'<span>Relatie '+Math.round(Number(i.relatie_score)*100)+'%</span>':'')+'</div>'+
  (i.trigger_kort?'<div class="trigger"><strong>Waarom nu</strong><br>'+esc(i.trigger_kort)+'</div>':'')+
  '<div class="instructie">STUUR DEZE DM</div><textarea id="t-'+id+'">'+esc(tekst)+'</textarea>'+pdf+
  '<div class="rij">'+
  (i.link?'<a class="link" href="'+esc(i.link)+'" target="_blank" rel="noopener">Open LinkedIn-profiel</a>':'')+
  '<button data-kopieer="'+id+'">Kopieer DM</button><button class="pri" data-meld="'+id+'" data-fase="lead" data-soort="executed">✓ Verstuurd</button><button data-meld="'+id+'" data-fase="lead" data-soort="defer">Later</button><button data-meld="'+id+'" data-fase="lead" data-soort="not_relevant">Niet doen</button></div><div class="melding" id="m-'+id+'"></div></div>';}).join('');
 }catch(e){document.getElementById('contentblok').hidden=false;content.innerHTML='<p class="leeg">Contentstatus niet beschikbaar: '+esc(e.message)+'</p>';doel.innerHTML='<p class="leeg">Niet gelukt: '+esc(e.message)+'</p>';}}
document.getElementById('lijst').addEventListener('click',async function(ev){var b=ev.target.closest('button');if(!b)return;
 if(b.dataset.kopieer){var id=b.dataset.kopieer,t=document.getElementById('t-'+id);try{await navigator.clipboard.writeText(t.value);}catch(x){t.select();document.execCommand('copy');}document.getElementById('m-'+id).textContent='DM gekopieerd.';return;}
 if(b.dataset.pdf){var pid=b.dataset.pdf,pm=document.getElementById('m-'+pid);b.disabled=true;pm.textContent='PDF wordt door Powerhouse gemaakt…';try{var p=await api({actie:'pdf',action_id:pid});var raw=atob(p.base64),arr=new Uint8Array(raw.length);for(var z=0;z<raw.length;z++)arr[z]=raw.charCodeAt(z);var blob=new Blob([arr],{type:p.mime_type||'application/pdf'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=p.filename||'bedrijfsgeheugen-one-pager.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1500);pm.textContent='PDF gemaakt en gedownload. Voeg deze toe aan de DM.';}catch(e){pm.textContent='PDF maken niet gelukt: '+e.message;}finally{b.disabled=false;}return;}
 if(b.dataset.meld){var id2=b.dataset.meld,m=document.getElementById('m-'+id2);m.textContent='Bezig…';try{await api({actie:'uitkomst',action_id:id2,fase:b.dataset.fase,uitkomstsoort:b.dataset.soort});m.textContent=b.dataset.soort==='executed'?'Verstuurd vastgelegd. Powerhouse neemt de opvolging over.':'Keuze vastgelegd.';document.getElementById('k-'+id2).classList.add('klaar');}catch(e){m.textContent='Niet gelukt: '+e.message;}}});
document.getElementById('slot').onsubmit=function(ev){ev.preventDefault();var c=document.getElementById('tok').value.trim();if(c){sessionStorage.setItem(SLEUTEL,c);laden();}};
laden();
</script></body></html>
