<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Vandaag · Bedrijfsgeheugen</title>
<style>:root{--papier:#FBFAF7;--inkt:#14171A;--blauw:#2742D6;--oranje:#FF4F17;--geel:#FFE86B;--grijs:#5C646E;--lijn:#DCDFE6}
*{box-sizing:border-box}body{margin:0;background:var(--papier);color:var(--inkt);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 80px}nav{font-size:.9rem;margin:0 0 18px}nav a{color:var(--blauw)}
h1{font-size:1.6rem;margin:0 0 4px}.sub{color:var(--grijs);margin:0 0 24px}.mark{background:linear-gradient(transparent 55%,var(--geel) 55%)}
.kaart{border:1px solid var(--lijn);border-radius:12px;background:#fff;padding:16px;margin-bottom:14px}.kop{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.naam{font-weight:650}.bedrijf{color:var(--grijs);font-size:.92rem}.prio{font-variant-numeric:tabular-nums;font-size:.8rem;color:#fff;background:var(--blauw);border-radius:99px;padding:2px 9px}
.kanaal{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--oranje);margin:10px 0 4px}.reden{font-size:.85rem;color:var(--grijs);margin:0 0 6px}
textarea{width:100%;min-height:140px;border:1px solid var(--lijn);border-radius:8px;padding:10px;font:inherit;font-size:.94rem;resize:vertical;background:var(--papier)}
.rij{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}button{font:inherit;font-size:.88rem;border:1px solid var(--lijn);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}button:hover{border-color:var(--inkt)}
.pri{background:var(--blauw);border-color:var(--blauw);color:#fff}.link{margin-left:auto;font-size:.85rem;color:var(--blauw)}.leeg{color:var(--grijs);padding:40px 0;text-align:center}.klaar{opacity:.45}
#slot{display:flex;gap:8px;margin-bottom:20px}#slot input{flex:1;padding:9px 11px;border:1px solid var(--lijn);border-radius:8px;font:inherit}.melding{font-size:.85rem;color:var(--grijs);margin-top:6px;min-height:18px}</style></head><body><div class="wrap">
<nav><strong>Vandaag</strong> · <a href="/intern/meetoverzicht/">Meetoverzicht</a></nav>
<h1>Wat er <span class="mark">vandaag</span> klaarstaat</h1><p class="sub">Verstuur, meld de uitkomst, en de rangschikking van morgen verschuift mee.</p>
<form id="slot"><input id="tok" type="password" placeholder="Toegangscode" autocomplete="current-password"><button class="pri">Openen</button></form><div id="lijst"></div></div>
<script>
var API='https://adhjwmvyoixzjtmiroln.supabase.co/functions/v1/bg-dagoverzicht',SLEUTEL='bg_overzicht_code';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
async function api(p){var r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-bg-token':sessionStorage.getItem(SLEUTEL)||''},body:JSON.stringify(p)});var d=await r.json().catch(function(){return {};});if(r.status===401){sessionStorage.removeItem(SLEUTEL);document.getElementById('slot').style.display='';}if(!r.ok)throw new Error(d.error||r.status);return d;}
async function laden(){if(!sessionStorage.getItem(SLEUTEL))return;var doel=document.getElementById('lijst');doel.innerHTML='<p class="leeg">Bezig…</p>';
 try{var d=await api({actie:'lijst'});document.getElementById('slot').style.display='none';
 if(!d.items.length){doel.innerHTML='<p class="leeg">Niets klaar. De selectie draait elke werkdag om 05:45.</p>';return;}
 doel.innerHTML=d.items.map(function(i){var id=esc(i.action_id);var tekst=(i.tekst_om_te_versturen||'');if(i.persoonlijke_link){tekst=tekst+'\n\n'+i.persoonlijke_link;}
  return '<div class="kaart" id="k-'+id+'"><div class="kop"><div><div class="naam">'+esc(i.persoon)+'</div><div class="bedrijf">'+esc(i.rol)+(i.rol&&i.bedrijf?' – ':'')+esc(i.bedrijf)+'</div></div><span class="prio">'+esc(i.prioriteit)+'</span></div>'+
  '<div class="kanaal">'+esc(i.kanaal)+'</div>'+(i.waarom?'<p class="reden">'+esc(i.waarom)+'</p>':'')+'<textarea id="t-'+id+'">'+esc(tekst)+'</textarea>'+
  '<div class="rij"><button data-kopieer="'+id+'">Kopieer</button><button class="pri" data-meld="'+id+'" data-fase="appointment" data-soort="meeting">Gesprek</button><button data-meld="'+id+'" data-fase="lead" data-soort="reply">Reactie</button><button data-meld="'+id+'" data-fase="lead" data-soort="no_response">Geen reactie</button>'+
  (i.link?'<a class="link" href="'+esc(i.link)+'" target="_blank" rel="noopener">Profiel</a>':'')+'</div><div class="melding" id="m-'+id+'"></div></div>';}).join('');
 }catch(e){doel.innerHTML='<p class="leeg">Niet gelukt: '+esc(e.message)+'</p>';}}
document.getElementById('lijst').addEventListener('click',async function(ev){var b=ev.target.closest('button');if(!b)return;
 if(b.dataset.kopieer){var id=b.dataset.kopieer,t=document.getElementById('t-'+id);try{await navigator.clipboard.writeText(t.value);}catch(x){t.select();document.execCommand('copy');}document.getElementById('m-'+id).textContent='Gekopieerd, link inbegrepen.';return;}
 if(b.dataset.meld){var id2=b.dataset.meld,m=document.getElementById('m-'+id2);m.textContent='Bezig…';try{await api({actie:'uitkomst',action_id:id2,fase:b.dataset.fase,uitkomstsoort:b.dataset.soort});m.textContent='Gemeld. Het brein rekent dit mee.';document.getElementById('k-'+id2).classList.add('klaar');}catch(e){m.textContent='Niet gelukt: '+e.message;}}});
document.getElementById('slot').onsubmit=function(ev){ev.preventDefault();var c=document.getElementById('tok').value.trim();if(c){sessionStorage.setItem(SLEUTEL,c);laden();}};
laden();
</script></body></html>
