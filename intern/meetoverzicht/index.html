<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Meetoverzicht · Bedrijfsgeheugen</title>
<style>:root{--papier:#FBFAF7;--inkt:#14171A;--blauw:#2742D6;--oranje:#FF4F17;--geel:#FFE86B;--grijs:#5C646E;--lijn:#DCDFE6}
*{box-sizing:border-box}body{margin:0;background:var(--papier);color:var(--inkt);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:28px 18px 60px}h1{font-size:1.6rem;margin:0 0 4px}h2{font-size:1.1rem;margin:34px 0 10px}.sub{color:var(--grijs);margin:0 0 18px}nav{font-size:.9rem;margin:0 0 18px}nav a{color:var(--blauw)}
.kaarten{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kaart{background:#fff;border:1px solid var(--lijn);border-radius:12px;padding:12px 14px}.kaart b{display:block;font-size:1.5rem}.kaart span{color:var(--grijs);font-size:.85rem}
.tabel{overflow-x:auto}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--lijn);border-radius:12px;font-size:.9rem}th,td{padding:8px 10px;border-bottom:1px solid var(--lijn);text-align:left;vertical-align:middle;white-space:nowrap}th{background:#F3F4F7;font-weight:600;font-size:.82rem;color:var(--grijs)}td.n{text-align:right;font-variant-numeric:tabular-nums}td.w{white-space:normal;min-width:180px}
.balk{display:inline-block;height:8px;background:var(--blauw);border-radius:4px;vertical-align:middle}.slecht{color:#B42318;font-weight:700}.leeg{background:#fff;border:1px dashed var(--lijn);border-radius:12px;padding:18px;color:var(--grijs)}
form,.balkje{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--lijn);border-radius:8px;background:#fff}button{background:var(--blauw);color:#fff;border-color:var(--blauw);font-weight:600;cursor:pointer}#code{min-width:min(320px,100%)}
.uitleg{font-size:.82rem;color:var(--grijs);margin:6px 0 0}code{font-size:.85em}
.trechter{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.stap{background:#fff;border:1px solid var(--lijn);border-radius:12px;padding:10px 12px}.stap b{display:block;font-size:1.35rem}.stap span{font-size:.8rem;color:var(--grijs)}.stap em{font-style:normal;font-size:.78rem;color:var(--blauw)}
.exp{background:#fff;border:1px solid var(--lijn);border-radius:12px;padding:14px;margin-bottom:10px}.exp h3{font-size:1rem;margin:0 0 6px}.label{display:inline-block;font-size:.75rem;border-radius:99px;padding:1px 8px;background:#EEF1FB;color:var(--blauw);margin-right:6px}.exp .knoppen{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.exp button.zacht{background:#fff;color:var(--inkt);border-color:var(--lijn)}.melding{font-size:.85rem;color:var(--grijs)}</style></head><body><main>
<nav><a href="/intern/vandaag/">Vandaag</a> · <strong>Meetoverzicht</strong></nav>
<h1>Meetoverzicht</h1><p class="sub">De cyclus van meten, leren, experimenteren en verbeteren: van bezoek tot omzet, per bron en pagina, met de experimenten die lopen. Daaronder wat bezoekers per pagina doen. Alleen menselijke bezoekers; robots zijn eruit gefilterd.</p>
<form id="inlog"><input id="code" type="password" placeholder="Toegangscode (dezelfde als Vandaag)" autocomplete="current-password"><button>Openen</button></form>
<div id="cyclus"></div><div id="inhoud"></div></main>
<script>
var API='https://adhjwmvyoixzjtmiroln.supabase.co/functions/v1/bg-meetoverzicht',SLEUTEL='bg_overzicht_code',dagen=30;
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pct(v){return v==null?'–':v+'%';}
function balk(v){v=v||0;return '<span class="balk" style="width:'+Math.max(2,Math.round(0.6*v))+'px"></span> '+v+'%';}
function sec(v){if(v==null)return '–';v=Math.round(v);return v<60?v+' s':Math.floor(v/60)+' min '+(v%60)+' s';}
async function laad(){var code=sessionStorage.getItem(SLEUTEL)||'';if(!code)return;var el=document.getElementById('inhoud');el.innerHTML='<p class="sub">Laden…</p>';
 var r;try{r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:code,dagen:dagen})});}catch(x){el.innerHTML='<div class="leeg">Geen verbinding met het brein.</div>';return;}
 if(r.status===401){sessionStorage.removeItem(SLEUTEL);document.getElementById('inlog').style.display='';el.innerHTML='<div class="leeg">Deze code klopt niet.</div>';return;}
 if(!r.ok){el.innerHTML='<div class="leeg">Kon het overzicht niet laden ('+r.status+').</div>';return;}
 document.getElementById('inlog').style.display='none';toon(await r.json());laadCyclus();}
async function post(b){var code=sessionStorage.getItem(SLEUTEL)||'';var r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({token:code,dagen:dagen},b))});var d=await r.json().catch(function(){return {};});if(!r.ok)throw new Error(d.error||r.status);return d;}
async function laadCyclus(){var el=document.getElementById('cyclus');try{tekenCyclus(await post({actie:'cyclus'}));}catch(x){el.innerHTML='<div class="leeg">Salescyclus niet geladen: '+e(x.message)+'</div>';}}
function tabel(koppen,rijen){return '<div class="tabel"><table><tr>'+koppen.map(function(k){return '<th'+(k.n?' class="n"':'')+'>'+k.t+'</th>';}).join('')+'</tr>'+rijen.join('')+'</table></div>';}
function toon(d){var t=d.totaal||{},h='';
 h+='<div class="balkje"><label>Periode <select id="periode">'+[7,30,90,365].map(function(x){return '<option value="'+x+'"'+(x==d.periode_dagen?' selected':'')+'>laatste '+x+' dagen</option>';}).join('')+'</select></label></div><br>';
 h+='<div class="kaarten">'+[['bezoekers','Bezoekers'],['paginaweergaven','Paginaweergaven'],['kliks','Kliks'],['formulieren_gestart','Formulieren gestart'],['formulieren_verzonden','Formulieren verzonden']].map(function(k){return '<div class="kaart"><b>'+(t[k[0]]||0)+'</b><span>'+k[1]+'</span></div>';}).join('')+'<div class="kaart"><b>'+pct(t.toestemming_pct)+'</b><span>gaf toestemming (GA4)</span></div><div class="kaart"><b>'+(t.robots_uitgefilterd||0)+'</b><span>robotgebeurtenissen uitgefilterd</span></div></div>';
 if(!t.bezoekers){h+='<br><div class="leeg">Nog geen menselijke bezoeken gemeten in deze periode. De meting staat sinds 11 september 2026 op elke publieke pagina; zodra er bezoekers zijn, verschijnen hier de cijfers.</div>';document.getElementById('inhoud').innerHTML=h;koppel();return;}
 var P=d.paginas||[];h+='<h2>Per pagina</h2>'+tabel([{t:'Pagina'},{t:'Bezoeken',n:1},{t:'Actieve tijd',n:1},{t:'Scrolt tot 50%'},{t:'tot 75%'},{t:'tot 100%'},{t:'Kliks',n:1},{t:'Vertrekt hier',n:1}],P.map(function(p){var s=p.scroll_pct||{};return '<tr><td><code>'+e(p.pad)+'</code></td><td class="n">'+p.bezoeken+'</td><td class="n">'+sec(p.mediaan_sec)+'</td><td>'+balk(s['50'])+'</td><td>'+balk(s['75'])+'</td><td>'+balk(s['100'])+'</td><td class="n">'+p.kliks+'</td><td class="n'+(p.vertrek_pct>=70?' slecht':'')+'">'+pct(p.vertrek_pct)+'</td></tr>';}))+'<p class="uitleg">Scrolt tot X%: deel van de bezoekers dat minstens zo ver kwam. Vertrekt hier: deel van de bezoeken waarin dit de laatste pagina was.</p>';
 var paden=[...new Set((d.knoppen||[]).map(function(k){return k.pad;}))];h+='<h2>Knoppen en links</h2><div class="balkje"><label>Pagina <select id="knopfilter"><option value="">alle pagina\'s</option>'+paden.map(function(p){return '<option>'+e(p)+'</option>';}).join('')+'</select></label></div><br><div id="knoppen"></div>';
 var F=d.formulieren||[];h+='<h2>Formulieren</h2>'+(F.length?tabel([{t:'Pagina'},{t:'Formulier'},{t:'Gestart',n:1},{t:'Verzonden',n:1},{t:'Gestrand',n:1}],F.map(function(f){return '<tr><td><code>'+e(f.pad)+'</code></td><td>'+e(f.formulier)+'</td><td class="n">'+f.gestart+'</td><td class="n">'+f.verzonden+'</td><td class="n'+(f.gestrand_pct>=50?' slecht':'')+'">'+f.gestrand+' ('+pct(f.gestrand_pct)+')</td></tr>';}))+'<p class="uitleg">Gestart: iemand klikte in het formulier. Gestrand: gestart maar niet verzonden. Ingevulde waarden worden nooit gemeten.</p>':'<div class="leeg">Nog geen formuliergebruik gemeten.</div>');
 var B=t.bronnen||[],A=t.apparaten||{};h+='<h2>Waar ze vandaan komen</h2>'+tabel([{t:'Bron'},{t:'Bezoekers',n:1}],B.map(function(b){return '<tr><td>'+e(b.bron)+'</td><td class="n">'+b.bezoekers+'</td></tr>';}))+'<p class="uitleg">Apparaten: '+Object.keys(A).map(function(k){return e(k)+' '+A[k];}).join(' · ')+'</p>';
 document.getElementById('inhoud').innerHTML=h;window.__knoppen=d.knoppen||[];tekenKnoppen('');koppel();}
function tekenKnoppen(pad){var K=window.__knoppen.filter(function(k){return !pad||k.pad===pad;}).slice(0,150);var koppen=[{t:'Knop of link'},{t:'Blok'},{t:'Gaat naar'}].concat(pad?[]:[{t:'Pagina'}]).concat([{t:'Door % bezoekers'},{t:'Kliks',n:1}]);document.getElementById('knoppen').innerHTML=K.length?tabel(koppen,K.map(function(k){return '<tr><td class="w">'+e(k.tekst)+'</td><td>'+e(k.onderdeel||'–')+'</td><td><code>'+e(k.doel||'–')+'</code></td>'+(pad?'':'<td><code>'+e(k.pad)+'</code></td>')+'<td>'+balk(k.pct_bezoekers)+'</td><td class="n">'+k.kliks+'</td></tr>';})):'<div class="leeg">Nog geen kliks gemeten.</div>';}
function koppel(){var p=document.getElementById('periode');if(p)p.onchange=function(){dagen=+p.value;laad();};var f=document.getElementById('knopfilter');if(f)f.onchange=function(){tekenKnoppen(f.value);};}

function stap(n,label,van){var p=(van&&van>0)?Math.round(100*n/van)+'% van vorige':'';return '<div class="stap"><b>'+(n||0)+'</b><span>'+label+'</span>'+(p?'<br><em>'+p+'</em>':'')+'</div>';}
function eur(v){return '€ '+Math.round(Number(v||0)).toLocaleString('nl-NL');}
function tekenCyclus(c){var t=c.trechter_totaal||{},h='<h2>Van bezoek tot omzet</h2>';
 h+='<div class="trechter">'+stap(t.bezoekers,'bezoekers')+stap(t.intentie,'contactintentie',t.bezoekers)+stap(t.leads,'leads',t.intentie)+stap(t.gesprekken,'gesprekken',t.leads)+stap(t.offertes,'offertes',t.gesprekken)+stap(t.orders,'orders',t.offertes)+'<div class="stap"><b>'+eur(t.omzet)+'</b><span>omzet</span></div></div>';
 h+='<p class="uitleg">Contactintentie: klik naar Calendly, mail, telefoon, offerte, scan of aanmelden. Leads, gesprekken, offertes en orders komen uit Calendly, Vandaag, offertes, scans en aanmeldingen, gekoppeld aan het bezoek.</p>';
 ['herkomst','landing'].forEach(function(dim){var R=(c.trechter||[]).filter(function(x){return x.dimensie===dim;});if(!R.length)return;h+='<h2>'+(dim==='herkomst'?'Per bron':'Per landingspagina')+'</h2>'+tabel([{t:dim==='herkomst'?'Bron':'Landingspagina'},{t:'Bezoekers',n:1},{t:'Intentie',n:1},{t:'Leads',n:1},{t:'Gesprekken',n:1},{t:'Offertes',n:1},{t:'Orders',n:1},{t:'Omzet',n:1}],R.map(function(x){return '<tr><td>'+(dim==='landing'?'<code>'+e(x.waarde)+'</code>':e(x.waarde))+'</td><td class="n">'+x.bezoekers+'</td><td class="n">'+x.intentie+'</td><td class="n">'+x.leads+'</td><td class="n">'+x.gesprekken+'</td><td class="n">'+x.offertes+'</td><td class="n">'+x.orders+'</td><td class="n">'+eur(x.omzet)+'</td></tr>';}));});
 var U=c.uitkomsten_zonder_sessie||[];if(U.length)h+='<h2>Uitkomsten zonder bezoek</h2>'+tabel([{t:'Bron'},{t:'Fase'},{t:'Aantal',n:1},{t:'Omzet',n:1}],U.map(function(u){return '<tr><td>'+e(u.bron)+'</td><td>'+e(u.fase)+'</td><td class="n">'+u.aantal+'</td><td class="n">'+eur(u.omzet)+'</td></tr>';}))+'<p class="uitleg">Uitkomsten die niet aan een websitebezoek te koppelen zijn, zoals een gesprek via een DM in Vandaag.</p>';
 var X=c.experimenten||[];h+='<h2>Experimenten</h2>';
 if(!X.length)h+='<div class="leeg">Nog geen experiment. Elke maandag stelt het brein er één voor, zodra er genoeg bezoekers zijn (150 per 30 dagen).</div>';
 X.forEach(function(x){var r=x.resultaat||{},st=x.status==='PLANNED'?(x.besluit==='goedgekeurd'?'Goedgekeurd: variant nog invoeren':'Voorgesteld'):x.status==='ACTIVE'?(x.advies?'Klaar om te beslissen':'Loopt'):x.status==='COMPLETE'?'Behouden':x.status==='ROLLED_BACK'?(x.besluit==='afgewezen'?'Afgewezen':'Verworpen'):x.status==='INSUFFICIENT_EVIDENCE'?'Te weinig bewijs':x.status;
  var kn='';if(x.status==='PLANNED'&&!x.besluit)kn='<button data-exp="'+e(x.id)+'" data-stap="goedkeuren">Goedkeuren</button><button class="zacht" data-exp="'+e(x.id)+'" data-stap="afwijzen">Afwijzen</button>';
  else if(x.status==='PLANNED'&&x.besluit==='goedgekeurd')kn='<button data-exp="'+e(x.id)+'" data-stap="ingevoerd">Variant staat live: start de meting</button>';
  else if(x.status==='ACTIVE')kn='<button data-exp="'+e(x.id)+'" data-stap="besluiten" data-besluit="behouden">Behouden</button><button class="zacht" data-exp="'+e(x.id)+'" data-stap="besluiten" data-besluit="verwerpen">Verwerpen</button><button class="zacht" data-exp="'+e(x.id)+'" data-stap="besluiten" data-besluit="verlengen">Verlengen</button>';
  var meting=r.tijdens?'<p class="uitleg">Vóór: '+(r.basislijn&&r.basislijn.ratio!=null?Math.round(r.basislijn.ratio*1000)/10+'% ('+r.basislijn.sessies+' bezoekers)':'–')+' · Tijdens: '+(r.tijdens.ratio!=null?Math.round(r.tijdens.ratio*1000)/10+'% ('+r.tijdens.sessies+' bezoekers)':'–')+(r.uplift_relatief!=null?' · verschil '+Math.round(r.uplift_relatief*100)+'%':'')+(r.p_waarde!=null?' · p = '+r.p_waarde:'')+(x.advies?' · <strong>advies: '+e(x.advies)+'</strong>':'')+'</p>':'';
  h+='<div class="exp"><span class="label">'+e(st)+'</span><span class="label">'+e(x.onderdeel||'')+'</span><code>'+e(x.pagina||'')+'</code><h3>'+e(x.hypothese)+'</h3><p class="uitleg"><strong>Nu:</strong> '+e(x.controle||'–')+'<br><strong>Variant:</strong> '+e(x.variant||'–')+'<br><strong>Meetpunt:</strong> <code>'+e(x.meetpunt)+'</code> · minimaal '+e(x.min_steekproef)+' bezoekers · '+e(x.looptijd_dagen)+' dagen'+(x.beslisdatum?' · beslisdatum '+e(x.beslisdatum):'')+'</p>'+(x.onderbouwing?'<p class="uitleg">'+e(x.onderbouwing)+'</p>':'')+meting+(kn?'<div class="knoppen">'+kn+'</div>':'')+'<div class="melding" id="m-'+e(x.id)+'"></div></div>';});
 var C=c.contentexperimenten||{},cn=Object.keys(C).reduce(function(a,k){return a+C[k];},0);if(cn)h+='<p class="uitleg">Daarnaast plant de contentmotor '+cn+' contentexperimenten ('+Object.keys(C).map(function(k){return e(k)+' '+C[k];}).join(', ')+'); die lopen via de mediakalender.</p>';
 var L=c.lessen||[];if(L.length)h+='<h2>Lessen</h2>'+tabel([{t:'Les'},{t:'Status'},{t:'Effect',n:1},{t:'Steekproef',n:1},{t:'Betrouwbaarheid',n:1}],L.map(function(l){return '<tr><td class="w">'+e(l.claim)+'</td><td>'+e(l.status)+'</td><td class="n">'+(l.effect!=null?Math.round(l.effect*100)+'%':'–')+'</td><td class="n">'+(l.steekproef==null?'–':l.steekproef)+'</td><td class="n">'+(l.betrouwbaarheid!=null?Math.round(l.betrouwbaarheid*100)+'%':'–')+'</td></tr>';}));
 document.getElementById('cyclus').innerHTML=h;}
document.getElementById('cyclus').addEventListener('click',async function(ev){var b=ev.target.closest('button[data-exp]');if(!b)return;var id=b.dataset.exp,m=document.getElementById('m-'+id);if(m)m.textContent='Bezig…';try{await post({actie:'experiment',id:id,stap:b.dataset.stap,besluit:b.dataset.besluit||null});laadCyclus();}catch(x){if(m)m.textContent='Niet gelukt: '+x.message;}});
document.getElementById('inlog').onsubmit=function(ev){ev.preventDefault();var c=document.getElementById('code').value.trim();if(c){sessionStorage.setItem(SLEUTEL,c);laad();}};
laad();
</script></body></html>
