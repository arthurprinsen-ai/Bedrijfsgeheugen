<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Portaal · Bedrijfsgeheugen</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --inkt:#141B2E; --blauw:#2742D6; --blauw-l:#EDF0FD; --blauw-2:#5B7CFA;
  --groen:#17936B; --groen-l:#E6F5EF; --amber:#B4780B; --amber-l:#FDF3E0;
  --rood:#C0392B; --rood-l:#FBEDEB; --paars:#6C4BD6; --paars-l:#F0EBFC;
  --geel:#FFE86B; --grijs:#69707D; --lijn:#E6E8EE; --vlak:#F6F7FA; --wit:#fff;
  --zij:256px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--vlak);color:var(--inkt);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;line-height:1.15}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blauw);outline-offset:2px;border-radius:6px}
svg{display:block}

/* ── raamwerk ── */
.app{display:grid;grid-template-columns:var(--zij) 1fr;min-height:100vh}
.zij{background:var(--wit);border-right:1px solid var(--lijn);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.merk{display:flex;align-items:center;gap:.6rem;padding:1.05rem 1.2rem;border-bottom:1px solid var(--lijn);text-decoration:none}
.merk img{width:30px;height:30px}
.merk b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.92rem;letter-spacing:-.01em;display:block;line-height:1.1}
.merk small{font-size:.66rem;letter-spacing:.16em;color:var(--grijs);font-weight:600}
.menu{padding:.7rem .7rem;flex:1}
.mkop{font-size:.63rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A2A8B4;padding:.85rem .6rem .3rem}
.mlink{display:flex;align-items:center;gap:.6rem;padding:.47rem .6rem;border-radius:9px;text-decoration:none;font-size:.86rem;font-weight:500;color:#3B4252;margin-bottom:1px}
.mlink:hover{background:var(--vlak)}
.mlink.aan{background:var(--blauw);color:#fff;font-weight:600}
.mlink svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mlink .telp{margin-left:auto;background:var(--vlak);border-radius:99px;font-size:.68rem;font-weight:700;padding:.02rem .4rem;color:var(--grijs)}
.mlink.aan .telp{background:rgba(255,255,255,.2);color:#fff}
.zijvoet{padding:.8rem .9rem;border-top:1px solid var(--lijn)}
.zijgebr{display:flex;align-items:center;gap:.6rem;padding:.5rem;border-radius:11px;border:1px solid var(--lijn);margin-bottom:.6rem}
.zijgebr .naam{font-size:.82rem;font-weight:700;line-height:1.2}
.zijgebr .rol{font-size:.72rem;color:var(--grijs)}
.zijbedrijf{width:100%;display:flex;align-items:center;gap:.5rem;border:1px solid var(--lijn);border-radius:10px;padding:.45rem .6rem;font-size:.8rem;color:var(--grijs)}
.zijbedrijf b{color:var(--inkt);font-weight:600}
.zijbedrijf svg{margin-left:auto;width:12px;height:12px;stroke:var(--grijs);fill:none;stroke-width:2}

.hoofd{min-width:0;display:flex;flex-direction:column}
.balk{background:var(--wit);border-bottom:1px solid var(--lijn);display:flex;align-items:center;gap:.8rem;padding:.6rem 1.4rem;position:sticky;top:0;z-index:30}
.zoekdoos{flex:1;max-width:420px;margin-left:auto;position:relative}
.zoekdoos input{width:100%;border:1px solid var(--lijn);background:var(--vlak);border-radius:9px;padding:.45rem 2.6rem .45rem 2.1rem;font-size:.85rem}
.zoekdoos input:focus{outline:none;border-color:var(--blauw);background:#fff}
.zoekdoos>svg.loep{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--grijs);fill:none;stroke-width:1.8}
.zoekdoos .snel{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);font-size:.68rem;color:var(--grijs);border:1px solid var(--lijn);border-radius:5px;padding:.02rem .28rem;background:#fff}
.zoeklijst{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--lijn);border-radius:12px;box-shadow:0 14px 34px rgba(20,27,46,.13);padding:.35rem;max-height:340px;overflow:auto;z-index:40}
.zoeklijst button{display:block;width:100%;text-align:left;padding:.45rem .55rem;border-radius:8px;font-size:.84rem}
.zoeklijst button:hover{background:var(--vlak)}
.zoeklijst .leeg{padding:.6rem;color:var(--grijs);font-size:.84rem}
.balk-rechts{display:flex;align-items:center;gap:.35rem;position:relative}
.rond{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;position:relative}
.rond:hover{background:var(--vlak)}
.rond svg{width:18px;height:18px;stroke:#3B4252;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stip{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:99px;background:var(--rood);color:#fff;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
.paneel{position:absolute;top:calc(100% + 8px);right:0;width:310px;background:#fff;border:1px solid var(--lijn);border-radius:13px;box-shadow:0 16px 40px rgba(20,27,46,.15);z-index:50;overflow:hidden}
.paneel h4{font-size:.86rem;padding:.75rem .9rem;border-bottom:1px solid var(--lijn)}
.paneel .item{display:block;width:100%;text-align:left;padding:.62rem .9rem;border-bottom:1px solid var(--lijn);font-size:.83rem;text-decoration:none}
.paneel .item:last-child{border-bottom:0}
.paneel .item:hover{background:var(--vlak)}
.paneel .tijd{font-size:.72rem;color:var(--grijs)}
.inhoud{padding:1.4rem;max-width:1320px;width:100%}

/* ── koppen en knoppen ── */
.kop-rij{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
h1.titel{font-size:clamp(1.35rem,2.4vw,1.75rem);font-weight:800}
h1.titel span{color:var(--blauw)}
.sub{color:var(--grijs);font-size:.87rem}
.kopknoppen{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap}
.knop{display:inline-flex;align-items:center;gap:.4rem;background:var(--blauw);color:#fff;border-radius:9px;padding:.45rem .85rem;font-size:.83rem;font-weight:600;text-decoration:none;white-space:nowrap}
.knop:hover{filter:brightness(1.08)}
.knop.stil{background:#fff;color:#3B4252;border:1px solid var(--lijn)}
.knop.stil:hover{border-color:var(--blauw);color:var(--blauw);filter:none}
.knop.groen{background:var(--groen)}
.knop svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.knop.klein{padding:.28rem .6rem;font-size:.76rem}

/* ── kaarten en raster ── */
.kaart{background:var(--wit);border:1px solid var(--lijn);border-radius:14px;padding:1rem 1.1rem}
.kaart>h3,.kaartkop h3{font-size:.95rem;font-weight:800}
.kaartkop{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem}
.kaartkop .rechts{margin-left:auto;display:flex;gap:.4rem;align-items:center}
.raster{display:grid;gap:1rem;margin-bottom:1rem}
.r2{grid-template-columns:1fr 1fr}
.r3{grid-template-columns:repeat(3,1fr)}
.r4{grid-template-columns:repeat(4,1fr)}
.r23{grid-template-columns:1.5fr 1fr}
@media(max-width:1100px){.r4{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.r2,.r3,.r4,.r23{grid-template-columns:1fr}}
.muur{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem;align-items:start}
.widget{grid-column:span 12}
.w3{grid-column:span 3}.w4{grid-column:span 4}.w5{grid-column:span 5}.w6{grid-column:span 6}.w7{grid-column:span 7}.w8{grid-column:span 8}.w12{grid-column:span 12}
@media(max-width:1200px){.w3{grid-column:span 6}.w4,.w5{grid-column:span 6}.w7,.w8{grid-column:span 12}}
@media(max-width:760px){.muur .widget{grid-column:span 12!important}}
.widget .kaart{height:100%}
.greep{display:flex;align-items:center;gap:.45rem;cursor:grab;color:#B3B9C6;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-left:auto}
.greep svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.widget.sleept{opacity:.4}
.widget.doel .kaart{outline:2px dashed var(--blauw);outline-offset:3px}

/* ── kleine bouwstenen ── */
.rij{display:flex;gap:.65rem;align-items:flex-start;padding:.6rem 0;border-top:1px solid var(--lijn)}
.rij:first-of-type{border-top:0}
.rij .bol{width:9px;height:9px;border-radius:50%;flex:none;margin-top:.42rem}
.rij .mid{flex:1;min-width:0}
.rij b{font-size:.88rem;font-weight:700;display:block}
.rij .fijn{font-size:.79rem;color:var(--grijs)}
.rij .rechts{text-align:right;white-space:nowrap}
.pil{display:inline-block;border-radius:99px;padding:.08rem .5rem;font-size:.7rem;font-weight:700}
.balkje{height:7px;border-radius:99px;background:var(--lijn);margin:.4rem 0 .25rem;overflow:hidden}
.balkje div{height:100%;background:var(--blauw);border-radius:99px}
.cijfergroot{font-family:'Bricolage Grotesque',sans-serif;font-size:2rem;font-weight:800;line-height:1}
.label{display:flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:700;color:var(--grijs);margin-bottom:.45rem}
.label svg{width:15px;height:15px;stroke:var(--blauw);fill:none;stroke-width:1.8}
.meer{display:block;text-align:center;padding-top:.7rem;margin-top:.4rem;border-top:1px solid var(--lijn);color:var(--blauw);font-weight:600;font-size:.82rem;text-decoration:none;width:100%}
.let{padding:.8rem .95rem;border-left:4px solid var(--geel);background:#FFFCF0;border-radius:0 8px 8px 0;font-size:.84rem;margin-bottom:1rem}
.mel{padding:.8rem .95rem;border-left:4px solid var(--blauw);background:var(--blauw-l);border-radius:0 8px 8px 0;font-size:.84rem;margin-bottom:1rem;display:flex;gap:.65rem}
.mel svg{width:17px;height:17px;flex:none;margin-top:2px;stroke:var(--blauw);fill:none;stroke-width:1.8}
select.filter,input.filter{border:1px solid var(--lijn);border-radius:8px;padding:.28rem .5rem;font-size:.78rem;background:#fff}
.leegstand{text-align:center;padding:1.8rem 1rem;color:var(--grijs);font-size:.86rem}
table.tab{width:100%;border-collapse:collapse;font-size:.84rem}
table.tab th{text-align:left;font-weight:700;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--grijs);padding:.45rem .55rem;border-bottom:1px solid var(--lijn)}
table.tab td{padding:.55rem;border-bottom:1px solid var(--lijn);vertical-align:top}
table.tab tr:last-child td{border-bottom:0}
table.tab td.num{text-align:right;white-space:nowrap}
.tijdlijn{position:relative;padding-left:1.3rem}
.tijdlijn::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--lijn)}
.gebeurt{position:relative;padding:.45rem 0}
.gebeurt::before{content:"";position:absolute;left:-1.3rem;top:.8rem;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--blauw)}
.veld{display:block;margin-bottom:.8rem}
.veld span{display:block;font-size:.78rem;font-weight:600;margin-bottom:.22rem}
.veld input,.veld select,.veld textarea{width:100%;border:1px solid var(--lijn);border-radius:9px;padding:.45rem .65rem;font-size:.86rem;background:#fff}
.veld input:focus,.veld textarea:focus{outline:none;border-color:var(--blauw)}
.schakel{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-top:1px solid var(--lijn);font-size:.86rem}
.schakel:first-of-type{border-top:0}
.schakel input{margin-left:auto;width:18px;height:18px;accent-color:var(--blauw)}
.klikbaar{cursor:pointer}
.klikhint{font-size:.72rem;color:var(--grijs);display:flex;align-items:center;gap:.3rem;margin-top:.5rem}
.klikhint svg{width:13px;height:13px;stroke:var(--grijs);fill:none;stroke-width:1.8}

/* ── scan ── */
.scan{display:grid;grid-template-columns:230px 1fr;gap:1rem}
@media(max-width:860px){.scan{grid-template-columns:1fr}}
.scanrail .them{display:flex;align-items:center;gap:.5rem;padding:.42rem .5rem;border-radius:8px;font-size:.82rem;width:100%;text-align:left}
.scanrail .them:hover{background:var(--vlak)}
.scanrail .them.aan{background:var(--blauw-l);color:var(--blauw);font-weight:700}
.scanrail .them i{font-style:normal;width:19px;height:19px;border-radius:50%;background:var(--vlak);font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--grijs);flex:none}
.scanrail .them.klaar i{background:var(--groen);color:#fff}
.keuze{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;margin:.9rem 0}
@media(max-width:760px){.keuze{grid-template-columns:1fr 1fr}}
.keuze button{border:1.5px solid var(--lijn);border-radius:11px;padding:.75rem .6rem;text-align:left;background:#fff}
.keuze button:hover{border-color:var(--blauw-2)}
.keuze button.aan{border-color:var(--groen);background:var(--groen-l)}
.keuze b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:1rem;margin-bottom:.2rem}
.keuze span{font-size:.76rem;color:var(--grijs);line-height:1.35}

/* ── roadmap ── */
.borden{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
@media(max-width:900px){.borden{grid-template-columns:1fr}}
.kolom{background:var(--vlak);border:1px solid var(--lijn);border-radius:13px;padding:.7rem;min-height:130px}
.kolom h4{font-size:.82rem;margin-bottom:.55rem;display:flex;align-items:center;gap:.4rem}
.kolom.doel{outline:2px dashed var(--blauw);outline-offset:2px}
.kaartje{background:#fff;border:1px solid var(--lijn);border-radius:10px;padding:.6rem .7rem;margin-bottom:.5rem;cursor:grab;font-size:.84rem}
.kaartje b{display:block;font-size:.85rem}
.kaartje .fijn{font-size:.74rem;color:var(--grijs)}
.kaartje.sleept{opacity:.4}

/* ── overlay ── */
.overlay{position:fixed;inset:0;background:rgba(20,27,46,.5);display:flex;align-items:center;justify-content:center;padding:1.2rem;z-index:90}
.venster{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:1.3rem 1.4rem;max-height:88vh;overflow:auto}
.venster h3{font-size:1.05rem;margin-bottom:.4rem}
.venster p.sub{margin-bottom:.9rem}
.vknoppen{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
.mobknop{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .zij{position:fixed;left:0;top:0;bottom:0;width:var(--zij);z-index:70;transform:translateX(-100%);transition:transform .22s ease}
  .zij.open{transform:none}
  .mobknop{display:flex}
  .inhoud{padding:.9rem}
  .balk{padding:.5rem .7rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="zij" id="zij">
    <a class="merk" href="/">
      <img src="/assets/merk/logo-merk.png" alt="" width="30" height="30">
      <span><b>BEDRIJFSGEHEUGEN.NL</b><small>PORTAAL</small></span>
    </a>
    <nav class="menu" id="menu"></nav>
    <div class="zijvoet">
      <div class="zijgebr">
        <span class="avatar" id="avatar" style="width:32px;height:32px;border-radius:9px;background:var(--blauw);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem">?</span>
        <span><span class="naam" id="gebrNaam">—</span><span class="rol" id="gebrRol">—</span></span>
      </div>
      <button class="zijbedrijf" id="bedrijfKnop">Bedrijf: <b id="bedrijfNaam">—</b>
        <svg viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </aside>

  <div class="hoofd">
    <header class="balk">
      <button class="rond mobknop" id="mobKnop" aria-label="Menu openen"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="zoekdoos">
        <svg class="loep" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <input type="search" id="zoek" placeholder="Zoek in portaal…" autocomplete="off" aria-label="Zoeken">
        <span class="snel">⌘K</span>
        <div class="zoeklijst" id="zoeklijst" hidden></div>
      </div>
      <div class="balk-rechts">
        <button class="rond" id="hulpKnop" aria-label="Hulp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.8 9.6a2.3 2.3 0 114 1.6c-.9.8-1.8 1.2-1.8 2.4M12 16.6v.3"/></svg></button>
        <button class="rond" id="belKnop" aria-label="Meldingen">
          <svg viewBox="0 0 24 24"><path d="M18 8.5a6 6 0 10-12 0c0 6-2 7.5-2 7.5h16s-2-1.5-2-7.5z"/><path d="M13.7 20a2 2 0 01-3.4 0"/></svg>
          <span class="stip" id="belTal" hidden>0</span>
        </button>
        <div class="paneel" id="belPaneel" hidden></div>
        <button class="rond" id="gebrKnop" aria-label="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-4 3.4-6 7.5-6s7.5 2 7.5 6"/></svg></button>
        <div class="paneel" id="gebrPaneel" hidden></div>
      </div>
    </header>
    <main class="inhoud" id="scherm"></main>
  </div>
</div>

<script>
/* ════════════════ opzet ════════════════ */
const HOOK='https://hook.eu1.make.com/q2xq2fbi6tfw9o86obq47j223ho42qh2';
const params=new URLSearchParams(location.search);
const klantParam=params.get('klant');
const isDemo=klantParam==='demo'||params.get('demo')!==null;

const THEMAS=['Strategie','Mensen','Processen','Systemen','Data & Informatie','Klanten','Financiën','Innovatie'];

const VRAGEN=[
 ['Strategie','Is de koers van de organisatie voor iedereen helder?'],
 ['Strategie','Weet elk team hoe hun werk bijdraagt aan die koers?'],
 ['Strategie','Worden keuzes onderbouwd met cijfers in plaats van gevoel?'],
 ['Mensen','Is kennis van sleutelmedewerkers vastgelegd en overdraagbaar?'],
 ['Mensen','Draaien nieuwe collega\'s binnen een maand zelfstandig mee?'],
 ['Mensen','Weet iedereen waar hij of zij het antwoord kan vinden?'],
 ['Processen','In hoeverre zijn de belangrijkste processen vastgelegd en actueel?'],
 ['Processen','Worden processen gevolgd zoals ze bedoeld zijn?'],
 ['Processen','Zijn handmatige, repeterende stappen eruit gehaald?'],
 ['Systemen','Praten je systemen onderling zonder overtypen?'],
 ['Systemen','Is duidelijk welk systeem de bron is van welke gegevens?'],
 ['Systemen','Kun je een systeem vervangen zonder dat alles stilvalt?'],
 ['Data & Informatie','Zijn de cijfers waarop je stuurt betrouwbaar?'],
 ['Data & Informatie','Zijn cijfers op tijd beschikbaar, niet pas weken later?'],
 ['Data & Informatie','Werkt iedereen met dezelfde definities en dezelfde bron?'],
 ['Klanten','Heb je één beeld van de klant over alle systemen heen?'],
 ['Klanten','Wordt elke aanvraag en offerte bewaakt tot het einde?'],
 ['Klanten','Weet je waarom klanten blijven of juist weglopen?'],
 ['Financiën','Weet je per opdracht of dienst wat je eraan verdient?'],
 ['Financiën','Sluit de administratie aan op wat er op de werkvloer gebeurt?'],
 ['Financiën','Kun je een prognose maken die uitkomt?'],
 ['Innovatie','Is er ruimte om verbeteringen op te pakken naast het werk?'],
 ['Innovatie','Worden goede ideeën vastgelegd in plaats van vergeten?'],
 ['Innovatie','Wordt AI ingezet waar het echt werk scheelt?']
].map((v,i)=>({id:'v'+(i+1),thema:v[0],tekst:v[1],antwoord:null,toelichting:''}));

const SCHAAL=[
 {n:1,kop:'Niet vastgelegd',uit:'Zit in hoofden of losse bestanden.'},

/* ════════════════ opslag ════════════════ */
function sleutel(deel){return 'bg_portaal_'+deel+'_'+(klantParam||'onbekend');}
function laad(deel,standaard){try{const o=JSON.parse(localStorage.getItem(sleutel(deel))||'null');return o==null?standaard:o;}catch(e){return standaard;}}
function bewaar(deel,waarde){try{localStorage.setItem(sleutel(deel),JSON.stringify(waarde));}catch(e){}}

/* ════════════════ rekenwerk ════════════════ */
function cijfers(){
 const K=D.koppelingen||[];
 const draait=K.filter(k=>k.status==='Draait'), bouw=K.filter(k=>k.status==='In aanbouw');
 const uren=K.reduce((a,k)=>a+(+k.uren||0),0);
 const besparing=draait.reduce((a,k)=>a+(+k.besparing||0),0);
 const tarief=+D.tarief||200;
 const gefactureerd=K.reduce((a,k)=>a+(+k.gefactureerd||0),0);
 const gewerkt=uren*tarief;
 return {K,draait,bouw,uren,besparing,tarief,gefactureerd,gewerkt,open:Math.max(gewerkt-gefactureerd,0)};
}
function onbeantwoord(){return (D&&D.vragen? D.vragen.filter(v=>v.antwoord==null).length:0);}
function themaScores(){
 const uit={};
 THEMAS.forEach(t=>{
   const v=(D.vragen||[]).filter(x=>x.thema===t&&x.antwoord!=null);
   uit[t]= v.length? v.reduce((a,x)=>a+x.antwoord,0)/v.length : 0;
 });
 return uit;
}
function gezondheid(){
 const s=themaScores(), waarden=THEMAS.map(t=>s[t]).filter(v=>v>0);
 if(!waarden.length) return {score:0,ingevuld:0};
 const gem=waarden.reduce((a,b)=>a+b,0)/waarden.length;
 return {score:Math.round(gem/5*100), ingevuld:Math.round(((D.vragen||[]).filter(v=>v.antwoord!=null).length/(D.vragen||[1]).length)*100)};
}
function kansen(){
 const s=themaScores();
 const laag=THEMAS.filter(t=>s[t]>0).sort((a,b)=>s[a]-s[b]);
 const teksten={
  'Data & Informatie':['Data is versnipperd en niet betrouwbaar','Hoge impact','Gem. effort'],
  'Mensen':['Kennis is niet vastgelegd en moeilijk vindbaar','Hoge impact','Lagere effort'],
  'Processen':['Processen onvoldoende gestandaardiseerd','Middel impact','Gem. effort'],
  'Systemen':['Systemen praten niet met elkaar','Hoge impact','Gem. effort'],
  'Strategie':['Koers is niet vertaald naar de werkvloer','Middel impact','Lagere effort'],
  'Klanten':['Geen één beeld van de klant','Middel impact','Gem. effort'],
  'Financiën':['Rapportages niet stuurend en niet actueel','Middel impact','Lagere effort'],
  'Innovatie':['AI-kansen nog niet concreet benut','Middel impact','Hoge effort']
 };
 return laag.slice(0,5).map((t,i)=>({nr:i+1,thema:t,tekst:(teksten[t]||[t])[0],impact:(teksten[t]||[])[1]||'Middel impact',effort:(teksten[t]||[])[2]||'Gem. effort',score:s[t]}));
}

/* ════════════════ grafieken ════════════════ */
function meter(score){
 const r=62, midX=90, midY=88, hoek=Math.PI*(score/100);
 const x=midX-r*Math.cos(hoek), y=midY-r*Math.sin(hoek);
 const groot=score>50?1:0;
 const kleur=score>=70?'var(--groen)':score>=45?'var(--amber)':'var(--rood)';
 return '<svg viewBox="0 0 180 108" width="100%" style="max-width:190px" role="img" aria-label="Gezondheidsscore '+score+' van 100">'
  +'<path d="M28 88a62 62 0 01124 0" fill="none" stroke="var(--lijn)" stroke-width="15" stroke-linecap="round"/>'
  +(score>0?'<path d="M28 88A62 62 0 01'+x.toFixed(1)+' '+y.toFixed(1)+'" fill="none" stroke="'+kleur+'" stroke-width="15" stroke-linecap="round" data-groot="'+groot+'"/>':'')
  +'<text x="90" y="80" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-size="34" font-weight="800" fill="#141B2E">'+score+'</text>'
  +'<text x="90" y="99" text-anchor="middle" font-family="Instrument Sans,sans-serif" font-size="12" fill="#69707D">/100</text></svg>';
}
function radar(klikbaar){
 const s=themaScores(), bm=D.benchmark||{}, n=THEMAS.length, cx=190, cy=145, R=100;
 const punt=(i,v)=>{const a=(Math.PI*2*i/n)-Math.PI/2, r=R*(v/5);return [cx+r*Math.cos(a), cy+r*Math.sin(a)];};
 let ringen='', assen='', labels='';
 for(let k=1;k<=5;k++){
   const p=THEMAS.map((_,i)=>punt(i,k).map(x=>x.toFixed(1)).join(',')).join(' ');
   ringen+='<polygon points="'+p+'" fill="none" stroke="var(--lijn)" stroke-width="1"/>';
 }
 THEMAS.forEach((t,i)=>{
   const p=punt(i,5), l=punt(i,5.75);
   assen+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="var(--lijn)"/>';
   const anker = l[0]>cx+6?'start':l[0]<cx-6?'end':'middle';
   labels+='<text x="'+l[0].toFixed(1)+'" y="'+(l[1]+4).toFixed(1)+'" text-anchor="'+anker+'" font-family="Instrument Sans,sans-serif" font-size="10.5" fill="#69707D">'+esc(t)+'</text>';
 });
 const eigen=THEMAS.map((t,i)=>punt(i,s[t]||0).map(x=>x.toFixed(1)).join(',')).join(' ');
 const bench=THEMAS.map((t,i)=>punt(i,bm[t]||0).map(x=>x.toFixed(1)).join(',')).join(' ');
 const stippen=THEMAS.map((t,i)=>{const p=punt(i,s[t]||0);
   return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="var(--blauw)"/>';}).join('');
 return '<svg id="radar" viewBox="0 0 380 300" width="100%" style="max-width:420px;margin:0 auto'+(klikbaar?';cursor:crosshair':'')+'" role="img" aria-label="Radar met je score per thema">'
  +ringen+assen+labels
  +'<polygon points="'+bench+'" fill="none" stroke="#B3B9C6" stroke-width="1.6" stroke-dasharray="4 4"/>'
  +'<polygon points="'+eigen+'" fill="rgba(39,66,214,.16)" stroke="var(--blauw)" stroke-width="2"/>'+stippen
  +'</svg>'
  +'<div style="display:flex;gap:1rem;justify-content:center;font-size:.76rem;color:var(--grijs);margin-top:.3rem">'
  +'<span style="display:flex;gap:.3rem;align-items:center"><span style="width:9px;height:9px;border-radius:50%;background:var(--blauw)"></span>Jouw score</span>'
  +'<span style="display:flex;gap:.3rem;align-items:center"><span style="width:14px;height:0;border-top:2px dashed #B3B9C6"></span>Benchmark</span></div>';
}
function lijn(reeks,kleur,hoogte,labels){
 kleur=kleur||'var(--blauw)'; hoogte=hoogte||70;
 const w=280,h=hoogte,max=Math.max.apply(null,reeks.concat([1])),min=Math.min.apply(null,reeks.concat([0]));
 const p=reeks.map((v,i)=>[(i/(reeks.length-1||1))*w,h-((v-min)/((max-min)||1))*(h-12)-6]);
 const pad=p.map(x=>x[0].toFixed(1)+','+x[1].toFixed(1)).join(' ');
 const vlak='0,'+h+' '+pad+' '+w+','+h;
 return '<svg viewBox="0 0 '+w+' '+(h+(labels?16:0))+'" width="100%" aria-hidden="true">'
  +'<polygon points="'+vlak+'" fill="'+kleur+'" opacity=".10"/>'
  +'<polyline points="'+pad+'" fill="none" stroke="'+kleur+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'
  +p.map(x=>'<circle cx="'+x[0].toFixed(1)+'" cy="'+x[1].toFixed(1)+'" r="2.6" fill="'+kleur+'"/>').join('')
  +(labels? labels.map((l,i)=>'<text x="'+((i/(labels.length-1||1))*w).toFixed(1)+'" y="'+(h+12)+'" text-anchor="'+(i===0?'start':i===labels.length-1?'end':'middle')+'" font-size="9.5" fill="#69707D" font-family="Instrument Sans,sans-serif">'+esc(l)+'</text>').join(''):'')
  +'</svg>';
}
function staven(reeks,kleur){
 const max=Math.max.apply(null,reeks.map(r=>r.v).concat([1]));
 return '<div style="display:flex;align-items:flex-end;gap:.5rem;height:150px;padding:.4rem 0">'
  + reeks.map(r=>'<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.3rem;height:100%">'
    +'<span style="font-size:.72rem;font-weight:700">'+esc(r.tekst!=null?r.tekst:r.v)+'</span>'
    +'<div style="width:100%;max-width:46px;height:'+Math.max(3,(r.v/max)*100)+'%;background:'+(kleur||'var(--blauw)')+';border-radius:6px 6px 0 0"></div>'
    +'<span style="font-size:.72rem;color:var(--grijs)">'+esc(r.m)+'</span></div>').join('')
  +'</div>';
}
function ring(delen){
 const tot=delen.reduce((a,d)=>a+d.deel,0)||1, r=48, omtrek=2*Math.PI*r;
 const kleuren=['var(--blauw)','var(--blauw-2)','var(--paars)','var(--groen)','var(--amber)','var(--grijs)'];
 let start=0,seg='';
 delen.forEach((d,i)=>{const deel=d.deel/tot*omtrek;
  seg+='<circle cx="66" cy="66" r="'+r+'" fill="none" stroke="'+kleuren[i%kleuren.length]+'" stroke-width="17" stroke-dasharray="'+(deel-2.5)+' '+(omtrek-deel+2.5)+'" stroke-dashoffset="'+(-start)+'" transform="rotate(-90 66 66)"/>';
  start+=deel;});
 return '<div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">'
  +'<svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">'+seg+'</svg>'
  +'<div style="display:grid;gap:.35rem;font-size:.8rem">'
  + delen.map((d,i)=>'<div style="display:flex;gap:.45rem;align-items:center"><span style="width:9px;height:9px;border-radius:50%;background:'+kleuren[i%kleuren.length]+'"></span>'+esc(d.naam)+' <b style="margin-left:auto">'+d.deel+'%</b></div>').join('')
  +'</div></div>';
}
function leeg(t){return '<div class="leegstand">'+esc(t)+'</div>';}

V.scan=function(){

 if(!v) return leeg('Er staan geen scanvragen klaar.');

 return '<div class="scan">'

    const vt=vragen.filter(x=>x.thema===t), klaar=vt.every(x=>x.antwoord!=null);
    return '<button class="them'+(t===v.thema?' aan':'')+(klaar?' klaar':'')+'" data-thema="'+esc(t)+'"><i>'+(klaar?'✓':(i+1))+'</i>'+esc(t)
     +(s[t]?'<span style="margin-left:auto;font-size:.74rem;color:var(--grijs)">'+s[t].toFixed(1)+'</span>':'')+'</button>';
   }).join('')
 +'</div>'

/* ════════════════ vensters ════════════════ */
function venster(titel,binnen,opSluiten){
 const el=document.createElement('div'); el.className='overlay';
 el.innerHTML='<div class="venster"><h3>'+esc(titel)+'</h3>'+binnen+'</div>';
 function sluit(){el.remove();document.removeEventListener('keydown',toets);if(opSluiten)opSluiten();}
 function toets(e){if(e.key==='Escape')sluit();}
 el.addEventListener('click',e=>{if(e.target===el||e.target.hasAttribute('data-sluit'))sluit();});
 document.addEventListener('keydown',toets);
 document.body.appendChild(el);
 return {el,sluit};
}
function melding(titel,tekst){
 venster(titel,'<p class="sub">'+esc(tekst)+'</p><div class="vknoppen"><button class="knop" data-sluit>Sluiten</button></div>');
}

function route(){const h=(location.hash||'').replace(/^#\/?/,'').split('?')[0];return V[h]?h:'dashboard';}

 const r=route();
 $('#menu').innerHTML=MENU.map(m=>{

  let t=null; try{t=m.tel&&D? m.tel(D):null;}catch(e){}
  return '<a class="mlink'+(m.id===r?' aan':'')+'" href="#/'+m.id+'"'+(m.id===r?' aria-current="page"':'')+'>'
   +ico(m.ico)+'<span>'+esc(m.naam)+'</span>'+(t?'<span class="telp">'+t+'</span>':'')+'</a>';
 }).join('');
}
function teken(){
 if(!D) return;
 const r=route();
 tekenMenu();
 const eersteNaam=((D.contact&&D.contact.naam)||'').split(' ')[0]||'daar';
 const kop = r==='dashboard'
  ? '<p class="sub">Goedemorgen '+esc(eersteNaam)+',</p><h1 class="titel">Wat er draait voor '+esc(D.klant.replace(' (voorbeeld)',''))+(isDemo?' <span>(voorbeeld)</span>':'')+'</h1>'

  ? '<div class="kopknoppen"><button class="knop stil" id="walkthrough">Bekijk walkthrough</button>'
    +'<button class="knop" data-melding="Rapport delen|We zetten een deelbare samenvatting klaar met je score, kansen en actieplan. In dit voorbeeld gebeurt dat niet echt.">Deel rapport</button></div>'
  : (r==='scan'? '<div class="kopknoppen"><button class="knop stil" id="scanHerstel">Scan opnieuw</button></div>':'');
 $('#scherm').innerHTML='<div class="kop-rij"><div>'+kop
  +'<p class="sub">'+esc(ONDER[r]||('Bijgewerkt: '+(D.opgehaald||'—')))+'</p></div>'+knoppen+'</div>'+V[r]();
 window.scrollTo(0,0);
 koppel();
}

function koppel(){
 /* dashboard: widgets slepen */
 const muur=$('#muur');
 if(muur){
  let bron=null;
  $$('#muur .widget').forEach(w=>{
   w.addEventListener('dragstart',e=>{bron=w;w.classList.add('sleept');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',w.dataset.widget);}catch(x){}});
   w.addEventListener('dragend',()=>{bron=null;$$('#muur .widget').forEach(x=>x.classList.remove('sleept','doel'));bewaarOrde();});
   w.addEventListener('dragover',e=>{e.preventDefault();if(bron&&bron!==w)w.classList.add('doel');});
   w.addEventListener('dragleave',()=>w.classList.remove('doel'));
   w.addEventListener('drop',e=>{
     e.preventDefault(); w.classList.remove('doel');
     if(!bron||bron===w) return;
     const alle=$$('#muur .widget');
     if(alle.indexOf(bron)<alle.indexOf(w)) w.after(bron); else w.before(bron);
     bewaarOrde();
   });
  });
 }
 function bewaarOrde(){ if($('#muur')) bewaar('widgets',$$('#muur .widget').map(w=>w.dataset.widget)); }

 /* radar: klikken om een thema bij te stellen */
 const rd=$('#radar');
 if(rd) rd.addEventListener('click',e=>{
   const b=rd.getBoundingClientRect();
   const x=(e.clientX-b.left)/b.width*380, y=(e.clientY-b.top)/b.height*300;
   const dx=x-190, dy=y-145, afstand=Math.sqrt(dx*dx+dy*dy);
   if(afstand<8) return;
   let hoek=Math.atan2(dy,dx)+Math.PI/2; if(hoek<0) hoek+=Math.PI*2;
   const i=Math.round(hoek/(Math.PI*2/THEMAS.length))%THEMAS.length;
   const score=Math.max(1,Math.min(5,Math.round(afstand/100*5)));
   zetThema(THEMAS[i],score);
 });

 /* scan */
 $$('[data-antwoord]').forEach(b=>b.addEventListener('click',()=>{
   const v=D.vragen[scanIndex]; v.antwoord=+b.dataset.antwoord;
   const toe=$('#scanToe'); if(toe) v.toelichting=toe.value;
   bewaarScan();
   if(scanIndex<D.vragen.length-1) scanIndex++;
   teken();
 }));

 if(vol) vol.addEventListener('click',()=>{
   const toe=$('#scanToe'); if(toe) D.vragen[scanIndex].toelichting=toe.value;
   bewaarScan();
   if(scanIndex<D.vragen.length-1){scanIndex++;teken();}
   else {melding('Scan afgerond','Je score en je radar zijn bijgewerkt. Op het dashboard zie je meteen wat dat betekent.');location.hash='#/dashboard';}
 });

 if(vor) vor.addEventListener('click',()=>{const toe=$('#scanToe');if(toe)D.vragen[scanIndex].toelichting=toe.value;bewaarScan();if(scanIndex>0){scanIndex--;teken();}});
 const sl=$('#scanSluit');
 if(sl) sl.addEventListener('click',()=>{const toe=$('#scanToe');if(toe)D.vragen[scanIndex].toelichting=toe.value;bewaarScan();location.hash='#/dashboard';});
 $$('[data-thema]').forEach(b=>b.addEventListener('click',()=>{
   const i=D.vragen.findIndex(v=>v.thema===b.dataset.thema);
   if(i>=0){scanIndex=i;teken();}
 }));
 const herstel=$('#scanHerstel');
 if(herstel) herstel.addEventListener('click',()=>{
   const v=venster('Scan opnieuw invullen','<p class="sub">Al je antwoorden worden gewist. Weet je het zeker?</p>'
    +'<div class="vknoppen"><button class="knop stil" data-sluit>Annuleren</button><button class="knop" id="jaHerstel">Ja, opnieuw</button></div>');
   v.el.querySelector('#jaHerstel').addEventListener('click',()=>{
     D.vragen.forEach(x=>{x.antwoord=null;x.toelichting='';});
     bewaarScan(); scanIndex=0; v.sluit(); teken();
   });
 });

 /* KPI aanpassen */
 $$('[data-kpi]').forEach(el=>el.addEventListener('click',()=>bewerkKpi(+el.dataset.kpi)));
 const kn=$('#kpiNieuw');
 if(kn) kn.addEventListener('click',()=>bewerkKpi(-1));

 /* KTO-thema aanpassen */
 $$('[data-kto]').forEach(el=>el.addEventListener('click',()=>{
   const i=+el.dataset.kto, t=D.kto.themas[i];
   const v=venster('Score aanpassen: '+t.naam,
     '<label class="veld"><span>Score (0 tot 10)</span><input type="number" id="ktoWaarde" min="0" max="10" step="0.1" value="'+t.score+'"></label>'
    +'<div class="vknoppen"><button class="knop stil" data-sluit>Annuleren</button><button class="knop" id="ktoOk">Opslaan</button></div>');
   v.el.querySelector('#ktoOk').addEventListener('click',()=>{
     const w=parseFloat(v.el.querySelector('#ktoWaarde').value);
     if(!isNaN(w)){t.score=Math.max(0,Math.min(10,w));
      D.kto.score=+(D.kto.themas.reduce((a,x)=>a+x.score,0)/D.kto.themas.length).toFixed(1);
      bewaar('kto',D.kto);}
     v.sluit(); teken();
   });
 }));

 /* roadmap slepen */
 const borden=$('#borden');
 if(borden){
  let sleep=null;
  $$('#borden .kaartje').forEach(k=>{
   k.addEventListener('dragstart',e=>{sleep=k.dataset.actie;k.classList.add('sleept');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',sleep);}catch(x){}});
   k.addEventListener('dragend',()=>{sleep=null;$$('#borden .kaartje').forEach(x=>x.classList.remove('sleept'));$$('#borden .kolom').forEach(x=>x.classList.remove('doel'));});
   k.addEventListener('click',()=>bewerkActie(k.dataset.actie));

  $$('#borden .kolom').forEach(kol=>{

     e.preventDefault(); kol.classList.remove('doel');

     const a=(D.roadmap||[]).find(x=>x.titel===titel);
     if(a){a.status=kol.dataset.kolom;bewaar('roadmap',D.roadmap);teken();}
   });
  });
 }
 const fs2=$('#fSpoor'); if(fs2) fs2.addEventListener('change',e=>{roadmapFilter=e.target.value;teken();});
 const an=$('#actieNieuw'); if(an) an.addEventListener('click',()=>bewerkActie(null));
 $$('[data-naarroadmap]').forEach(b=>b.addEventListener('click',()=>{
   const a=D.aiAdvies[+b.dataset.naarroadmap];
   if((D.roadmap||[]).some(x=>x.titel===a.titel)){melding('Staat er al in','“'+a.titel+'” staat al op je roadmap.');return;}
   D.roadmap=(D.roadmap||[]).concat([{titel:a.titel,spoor:'AI-advies',kwartaal:'Q4 2026',status:'Niet gestart'}]);
   bewaar('roadmap',D.roadmap);
   melding('Toegevoegd','“'+a.titel+'” staat nu op je roadmap onder Niet gestart.');
   tekenMenu();
 }));

 /* filters en overige knoppen */
 const fs=$('#fStatus'); if(fs) fs.addEventListener('change',e=>{filterStatus=e.target.value;teken();});
 $$('[data-doccat]').forEach(b=>b.addEventListener('click',()=>{docFilter=b.dataset.doccat;teken();}));
 const fd=$('#fDoc'); if(fd) fd.addEventListener('input',e=>{
   const t=e.target.value.toLowerCase();
   $$('#docLijst tr').forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().includes(t)?'':'none';});
 });
 $$('[data-melding]').forEach(b=>b.addEventListener('click',()=>{
   const d=b.dataset.melding.split('|'); melding(d[0],d[1]||'');
 }));
 $$('[data-voorkeur]').forEach(el=>el.addEventListener('change',e=>{

 const nb=$('#nBewaar'); if(nb) nb.addEventListener('click',()=>{

function bewerkKpi(i){
 const nieuw = i<0;
 const k = nieuw? {naam:'',waarde:0,doel:0,eenheid:'',reeks:[0,0,0,0,0,0],omhoogGoed:true} : D.kpis[i];
 const v=venster(nieuw?'KPI toevoegen':'KPI aanpassen: '+k.naam,
  (nieuw?'<label class="veld"><span>Naam</span><input id="kNaam" value="'+esc(k.naam)+'"></label>':'')
  +'<label class="veld"><span>Huidige waarde</span><input type="number" step="0.1" id="kWaarde" value="'+k.waarde+'"></label>'
  +'<label class="veld"><span>Doel</span><input type="number" step="0.1" id="kDoel" value="'+k.doel+'"></label>'
  +(nieuw?'<label class="veld"><span>Eenheid</span><input id="kEenheid" placeholder="bijv. % of dagen" value="'+esc(k.eenheid)+'"></label>':'')
  +'<div class="vknoppen">'+(nieuw?'':'<button class="knop stil" id="kWeg" style="margin-right:auto">Verwijderen</button>')
  +'<button class="knop stil" data-sluit>Annuleren</button><button class="knop" id="kOk">Opslaan</button></div>');
 v.el.querySelector('#kOk').addEventListener('click',()=>{
   const w=parseFloat(v.el.querySelector('#kWaarde').value), d=parseFloat(v.el.querySelector('#kDoel').value);
   if(!isNaN(w)) k.waarde=w; if(!isNaN(d)) k.doel=d;
   if(nieuw){
     k.naam=(v.el.querySelector('#kNaam').value||'Nieuwe KPI').trim();
     k.eenheid=v.el.querySelector('#kEenheid').value||'';
     k.reeks=[k.waarde,k.waarde,k.waarde,k.waarde,k.waarde,k.waarde];
     D.kpis=(D.kpis||[]).concat([k]);
   }else{
     k.reeks=(k.reeks||[]).slice(0,-1).concat([k.waarde]);
   }
   bewaar('kpis',D.kpis); v.sluit(); teken();
 });
 const weg=v.el.querySelector('#kWeg');
 if(weg) weg.addEventListener('click',()=>{D.kpis.splice(i,1);bewaar('kpis',D.kpis);v.sluit();teken();});
}

 const nieuw=!titel;
 const a = nieuw? {titel:'',spoor:'Processen',kwartaal:'Q4 2026',status:'Niet gestart'} : (D.roadmap||[]).find(x=>x.titel===titel);
 if(!a) return;
 const v=venster(nieuw?'Actie toevoegen':'Actie aanpassen',
  '<label class="veld"><span>Titel</span><input id="aTitel" value="'+esc(a.titel)+'"></label>'
 +'<label class="veld"><span>Spoor</span><input id="aSpoor" value="'+esc(a.spoor)+'"></label>'
 +'<label class="veld"><span>Kwartaal</span><input id="aKwartaal" value="'+esc(a.kwartaal)+'"></label>'
 +'<label class="veld"><span>Status</span><select id="aStatus">'
 + ['Niet gestart','In uitvoering','Afgerond'].map(s=>'<option'+(s===a.status?' selected':'')+'>'+s+'</option>').join('')+'</select></label>'
 +'<div class="vknoppen">'+(nieuw?'':'<button class="knop stil" id="aWeg" style="margin-right:auto">Verwijderen</button>')
 +'<button class="knop stil" data-sluit>Annuleren</button><button class="knop" id="aOk">Opslaan</button></div>');
 v.el.querySelector('#aOk').addEventListener('click',()=>{
   a.titel=(v.el.querySelector('#aTitel').value||'Nieuwe actie').trim();
   a.spoor=v.el.querySelector('#aSpoor').value||'Overig';
   a.kwartaal=v.el.querySelector('#aKwartaal').value||'';
   a.status=v.el.querySelector('#aStatus').value;
   if(nieuw) D.roadmap=(D.roadmap||[]).concat([a]);
   bewaar('roadmap',D.roadmap); v.sluit(); teken();
 });
 const weg=v.el.querySelector('#aWeg');
 if(weg) weg.addEventListener('click',()=>{D.roadmap=D.roadmap.filter(x=>x!==a);bewaar('roadmap',D.roadmap);v.sluit();teken();});
}

/* ════════════════ balk ════════════════ */
function zoekResultaten(t){
 t=t.toLowerCase().trim(); if(!t) return [];
 const uit=[];
 (D.koppelingen||[]).forEach(k=>{if((k.titel+' '+(k.van||'')+' '+(k.naar||'')+' '+(k.middel||'')+' '+(k.notitie||'')).toLowerCase().includes(t))
   uit.push({tekst:k.titel,bij:'Koppeling · '+k.status,naar:'#/koppelingen'});});
 (D.roadmap||[]).forEach(r=>{if((r.titel+' '+(r.spoor||'')+' '+(r.kwartaal||'')).toLowerCase().includes(t)) uit.push({tekst:r.titel,bij:'Actie · '+r.status,naar:'#/roadmap'});});
 (D.documenten||[]).forEach(d=>{if((d.naam+' '+(d.soort||'')+' '+(d.bij||'')).toLowerCase().includes(t)) uit.push({tekst:d.naam,bij:'Document · '+(d.soort||''),naar:'#/documenten'});});
 (D.bronnen||[]).forEach(b=>{if((b.naam+' '+(b.categorie||'')).toLowerCase().includes(t)) uit.push({tekst:b.naam,bij:'Bron · '+b.status,naar:'#/bronnen'});});
 (D.kpis||[]).forEach(k=>{if(k.naam.toLowerCase().includes(t)) uit.push({tekst:k.naam,bij:'KPI',naar:'#/kpi'});});
 THEMAS.forEach(x=>{if(x.toLowerCase().includes(t)) uit.push({tekst:x,bij:'Scanthema · score '+((themaScores()[x]||0).toFixed(1)),naar:'#/scan'});});
 (D.vragen||[]).forEach(v=>{if((v.tekst+' '+v.thema).toLowerCase().includes(t)) uit.push({tekst:v.tekst,bij:'Scanvraag · '+v.thema,naar:'#/scan'});});
 (D.aiAdvies||[]).forEach(a=>{if((a.titel+' '+a.beschrijving).toLowerCase().includes(t)) uit.push({tekst:a.titel,bij:'AI-advies',naar:'#/ai'});});
 (D.team||[]).forEach(p=>{if(p.naam.toLowerCase().includes(t)) uit.push({tekst:p.naam,bij:'Gebruiker · '+p.rol,naar:'#/team'});});
 (D.notities||[]).forEach(n=>{if(n.tekst.toLowerCase().includes(t)) uit.push({tekst:n.tekst.slice(0,70),bij:'Notitie',naar:'#/notities'});});
 (D.urenregels||[]).forEach(r=>{if((r.wat+' '+r.koppeling).toLowerCase().includes(t)) uit.push({tekst:r.wat,bij:'Urenregel',naar:'#/uren'});});
 MENU.filter(m=>m.id).forEach(m=>{if(m.naam.toLowerCase().includes(t)) uit.push({tekst:m.naam,bij:'Pagina',naar:'#/'+m.id});});
 return uit.slice(0,8);
}
function tekenZoek(){
 const l=$('#zoeklijst');
 if(!zoekterm){l.hidden=true;return;}
 const res=zoekResultaten(zoekterm); l.hidden=false;
 l.innerHTML=res.length? res.map(r=>'<button data-naar="'+r.naar+'"><b>'+esc(r.tekst)+'</b>'
   +'<div style="font-size:.74rem;color:var(--grijs)">'+esc(r.bij)+'</div></button>').join('')
  : '<div class="leeg">Niets gevonden voor “'+esc(zoekterm)+'”.</div>';
 $$('#zoeklijst [data-naar]').forEach(b=>b.addEventListener('click',()=>{
   location.hash=b.dataset.naar; $('#zoek').value=''; zoekterm=''; l.hidden=true;
 }));
}
function tekenMeldingen(){
 const m=D.meldingen||[];
 $('#belTal').textContent=m.length; $('#belTal').hidden=m.length===0;
 $('#belPaneel').innerHTML='<h4>Meldingen</h4>'
  +(m.length? m.map(x=>'<button class="item"><b>'+esc(x.tekst)+'</b><div class="tijd">'+esc(x.tijd)+'</div></button>').join('')
   :'<div class="item">Geen meldingen.</div>');
 $$('#belPaneel .item').forEach(b=>b.addEventListener('click',()=>{location.hash='#/activiteit';$('#belPaneel').hidden=true;}));
}
function tekenGebruiker(){
 const naam=(D.contact&&D.contact.naam)||'Gast', rol=(D.contact&&D.contact.rol)||'Meekijken';
 $('#avatar').textContent=String(naam).split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
 $('#gebrNaam').textContent=naam; $('#gebrRol').textContent=rol;
 $('#bedrijfNaam').textContent=D.klant;
 $('#gebrPaneel').innerHTML='<h4>'+esc(naam)+'</h4>'
  +'<a class="item" href="#/instellingen">Instellingen</a>'
  +'<a class="item" href="#/team">Team &amp; toegang</a>'
  +'<a class="item" href="#/feedback">Feedback geven</a>'
  +'<a class="item" href="/contact">Contact met Arthur</a>'
  +'<a class="item" href="/">Terug naar de website</a>';
 $$('#gebrPaneel .item').forEach(a=>a.addEventListener('click',()=>{$('#gebrPaneel').hidden=true;}));
}

/* ════════════════ opstarten ════════════════ */
function start(g){
 D=g;
 D.opgehaald=D.opgehaald||new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'})+' · '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
 D.koppelingen=D.koppelingen||[];
 D.vragen=D.vragen||VRAGEN.map(v=>Object.assign({},v));
 if(D.scanAntwoorden) D.vragen.forEach((v,i)=>{if(D.scanAntwoorden[i]!=null) v.antwoord=D.scanAntwoorden[i];});
 const opgeslagen=laad('scan',null);
 if(opgeslagen) opgeslagen.forEach(o=>{const v=D.vragen.find(x=>x.id===o.id);if(v){v.antwoord=o.antwoord;v.toelichting=o.toelichting||'';}});
 D.kpis=laad('kpis',D.kpis||[]);
 D.roadmap=laad('roadmap',D.roadmap||[]);
 if(D.kto) D.kto=laad('kto',D.kto);
 D.notities=(D.notities||[]).concat(laad('notities',[]));
 tekenMeldingen(); tekenGebruiker(); teken();
}
function mislukt(t){
 $('#scherm').innerHTML='<div class="kaart"><h3>Even niet bereikbaar</h3><p class="sub">'+esc(t)+'</p>'
  +'<div style="display:flex;gap:.5rem;margin-top:.8rem;flex-wrap:wrap"><button class="knop" onclick="location.reload()">Opnieuw proberen</button>'
  +'<a class="knop stil" href="/contact">Laat het ons weten</a></div></div>';
}
function kiesScherm(){
 $('#scherm').innerHTML='<div class="kaart" style="max-width:520px"><h3>Voor welk bedrijf</h3>'
  +'<p class="sub">Vul de bedrijfsnaam in zoals wij die gebruiken, of open de link die je van ons hebt gekregen.</p>'
  +'<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem">'
  +'<input type="text" id="fKlant" placeholder="bedrijfsnaam" style="flex:1;min-width:200px;border:1px solid var(--lijn);border-radius:9px;padding:.45rem .65rem">'
  +'<button class="knop" id="bOk">Bekijken</button></div>'
  +'<p class="sub" style="margin-top:.7rem">Benieuwd hoe het eruitziet? <a href="?klant=demo" style="color:var(--blauw);font-weight:600">Bekijk een voorbeeld</a>.</p></div>';
 $('#bOk').addEventListener('click',()=>{const v=$('#fKlant').value.trim();if(v)location.search='?klant='+encodeURIComponent(v);});
 $('#fKlant').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bOk').click();});
}

$('#zoek').addEventListener('input',e=>{zoekterm=e.target.value;tekenZoek();});
$('#zoek').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';zoekterm='';tekenZoek();}});
$('#belKnop').addEventListener('click',e=>{e.stopPropagation();$('#gebrPaneel').hidden=true;$('#belPaneel').hidden=!$('#belPaneel').hidden;});
$('#gebrKnop').addEventListener('click',e=>{e.stopPropagation();$('#belPaneel').hidden=true;$('#gebrPaneel').hidden=!$('#gebrPaneel').hidden;});
$('#hulpKnop').addEventListener('click',()=>melding('Hulp nodig?','Links kies je een onderdeel. Sleep de blokken op het dashboard, klik in de radar om een thema bij te stellen, klik op een KPI om die aan te passen en sleep roadmapkaartjes tussen de kolommen. Kom je er niet uit? App Arthur.'));
$('#bedrijfKnop').addEventListener('click',()=>melding('Ander bedrijf','Je portaal opent met de link die je van ons hebt gekregen. Werk je voor meerdere bedrijven? Laat het weten, dan zetten we een keuze klaar.'));
$('#mobKnop').addEventListener('click',e=>{e.stopPropagation();$('#zij').classList.toggle('open');});
document.addEventListener('click',e=>{
 if(!e.target.closest('.balk-rechts')){$('#belPaneel').hidden=true;$('#gebrPaneel').hidden=true;}
 if(!e.target.closest('.zoekdoos')) $('#zoeklijst').hidden=true;
 if($('#zij').classList.contains('open')&&!e.target.closest('.zij')&&!e.target.closest('#mobKnop')) $('#zij').classList.remove('open');
});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#zoek').focus();}});
addEventListener('hashchange',()=>{$('#zij').classList.remove('open');if(D)teken();});

tekenMenu();
if(isDemo){ start(JSON.parse(JSON.stringify(DEMO))); }
else if(klantParam){
 $('#scherm').innerHTML='<div class="kaart"><p class="sub">Ophalen…</p></div>';
 fetch(HOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({klant:klantParam})})
  .then(r=>r.json())
  .then(d=>{
    if(!d||!d.koppelingen||!d.koppelingen.length){
      start(Object.assign({klant:klantParam,koppelingen:[]},d||{}));
      $('#scherm').insertAdjacentHTML('beforeend','<div class="kaart"><h3>Nog niets vastgelegd</h3><p class="sub">Er staat nog geen koppeling op deze naam. Klopt dat niet? Laat het ons weten, dan kijken we mee.</p></div>');
      return;
    }
    start(d);
  })
  .catch(()=>mislukt('We konden de gegevens nu niet ophalen. Probeer het zo nog eens.'));
}else{ kiesScherm(); }
</script>
</body>
</html>
