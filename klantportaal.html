<style>
:root{

  --oranje:#FF4F17; --amber:#C77700; --amber-l:#FFF6E3;
  --groen:#178A4C; --groen-l:#E8F5EC; --rood:#C0392B; --rood-l:#FDECE8;
  --geel:#FFE86B; --grijs:#5C646E; --lijn:#E4E6EB; --vlak:#F5F6F9;
  --zij:252px;

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--vlak);color:var(--inkt);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;line-height:1.15}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blauw);outline-offset:2px;border-radius:6px}

/* ── raamwerk ── */
.app{display:grid;grid-template-columns:var(--zij) 1fr;min-height:100vh}
.zij{background:#fff;border-right:1px solid var(--lijn);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.merk{display:flex;align-items:center;gap:.6rem;padding:1.15rem 1.25rem;border-bottom:1px solid var(--lijn);text-decoration:none}
.merk img{width:30px;height:30px}
.merk b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.02rem;letter-spacing:-.02em}
.menu{padding:.9rem .75rem;flex:1}
.mkop{font-size:.66rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#9AA1AB;padding:.9rem .6rem .4rem}
.mlink{display:flex;align-items:center;gap:.65rem;padding:.5rem .6rem;border-radius:9px;text-decoration:none;font-size:.9rem;font-weight:500;color:#3C424A;margin-bottom:1px;width:100%;text-align:left}
.mlink:hover{background:var(--vlak)}
.mlink.aan{background:var(--blauw-l);color:var(--blauw);font-weight:600}
.mlink svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mlink .telp{margin-left:auto;background:var(--vlak);border-radius:99px;font-size:.7rem;font-weight:700;padding:.05rem .42rem;color:var(--grijs)}
.mlink.aan .telp{background:#fff;color:var(--blauw)}
.zijvoet{padding:.9rem 1rem;border-top:1px solid var(--lijn);font-size:.78rem;color:var(--grijs)}
.zijvoet .knop{width:100%;justify-content:center;margin-bottom:.7rem}

.hoofd{min-width:0;display:flex;flex-direction:column}
.balk{background:#fff;border-bottom:1px solid var(--lijn);display:flex;align-items:center;gap:1rem;padding:.7rem 1.6rem;position:sticky;top:0;z-index:30}
.zoekdoos{flex:1;max-width:440px;margin:0 auto;position:relative}
.zoekdoos input{width:100%;border:1px solid var(--lijn);background:var(--vlak);border-radius:10px;padding:.5rem .8rem .5rem 2.2rem;font-size:.88rem}
.zoekdoos input:focus{outline:none;border-color:var(--blauw);background:#fff}
.zoekdoos>svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--grijs);fill:none;stroke-width:1.8}
.zoeklijst{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--lijn);border-radius:12px;box-shadow:0 12px 30px rgba(20,23,26,.12);padding:.4rem;max-height:340px;overflow:auto;z-index:40}
.zoeklijst button{display:block;width:100%;text-align:left;padding:.5rem .6rem;border-radius:8px;font-size:.86rem}
.zoeklijst button:hover,.zoeklijst button.aan{background:var(--vlak)}
.zoeklijst .leeg{padding:.6rem;color:var(--grijs);font-size:.86rem}
.balk-rechts{display:flex;align-items:center;gap:.5rem;margin-left:auto;position:relative}
.rond{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative}
.rond:hover{background:var(--vlak)}
.rond svg{width:19px;height:19px;stroke:#3C424A;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stip{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:99px;background:var(--oranje);color:#fff;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
.gebruiker{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem .3rem .3rem;border-radius:10px}
.gebruiker:hover{background:var(--vlak)}
.avatar{width:32px;height:32px;border-radius:9px;background:var(--blauw);color:#fff;font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex:none}
.gebruiker .naam{font-size:.85rem;font-weight:600;line-height:1.2;text-align:left}
.gebruiker .rol{font-size:.72rem;color:var(--grijs)}
.paneel{position:absolute;top:calc(100% + 8px);right:0;width:320px;background:#fff;border:1px solid var(--lijn);border-radius:14px;box-shadow:0 16px 40px rgba(20,23,26,.14);z-index:50;overflow:hidden}
.paneel h4{font-size:.9rem;padding:.85rem 1rem;border-bottom:1px solid var(--lijn)}
.paneel .item{display:block;width:100%;text-align:left;padding:.7rem 1rem;border-bottom:1px solid var(--lijn);font-size:.85rem}
.paneel .item:last-child{border-bottom:0}
.paneel .item:hover{background:var(--vlak)}
.paneel .item .tijd{font-size:.74rem;color:var(--grijs)}
.inhoud{padding:1.6rem;max-width:1180px;width:100%}

/* ── bouwstenen ── */
.kop-rij{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
.welkom{font-size:.85rem;color:var(--grijs)}
.welkom b{color:var(--blauw)}
h1.titel{font-size:clamp(1.5rem,3vw,2rem);font-weight:800;margin:.15rem 0 .3rem}
h1.titel span{color:var(--blauw)}
.sub{color:var(--grijs);font-size:.9rem}
.bijgewerkt{margin-left:auto;font-size:.8rem;color:var(--grijs);white-space:nowrap}
.kaart{background:#fff;border:1px solid var(--lijn);border-radius:14px;padding:1.1rem 1.2rem;margin-bottom:1rem}
.kaart>h3{font-size:1rem;font-weight:800;margin-bottom:.2rem}
.kaartkop{display:flex;align-items:center;gap:.8rem;margin-bottom:.7rem}
.kaartkop h3{font-size:1rem;font-weight:800}
.kaartkop .rechts{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.raster{display:grid;gap:1rem;margin-bottom:1rem}
.r3{grid-template-columns:repeat(3,1fr)}
.r2{grid-template-columns:1fr 1fr}
.r23{grid-template-columns:1.55fr 1fr}
@media(max-width:1000px){.r3,.r2,.r23{grid-template-columns:1fr}}
.kpi{background:#fff;border:1px solid var(--lijn);border-radius:14px;padding:1rem 1.1rem}
.kpi .label{display:flex;align-items:center;gap:.5rem;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grijs);margin-bottom:.5rem}
.kpi .label svg{width:15px;height:15px;stroke:var(--blauw);fill:none;stroke-width:1.8}
.kpi .cijfer{font-family:'Bricolage Grotesque',sans-serif;font-size:1.9rem;font-weight:800;line-height:1}
.kpi .bij{font-size:.82rem;color:var(--grijs);margin-top:.15rem}
.kpi .onder{display:flex;align-items:flex-end;justify-content:space-between;gap:.6rem;margin-top:.6rem}
.trend{font-size:.75rem;color:var(--groen);display:flex;align-items:center;gap:.25rem;white-space:nowrap}
.rij{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem 0;border-top:1px solid var(--lijn)}
.rij:first-of-type{border-top:0}
.rij .bol{width:9px;height:9px;border-radius:50%;flex:none;margin-top:.45rem}
.rij .mid{flex:1;min-width:0}
.rij b{font-size:.92rem;font-weight:700;display:block}
.rij .fijn{font-size:.8rem;color:var(--grijs)}
.rij .rechts{text-align:right;white-space:nowrap}
.pil{display:inline-block;border-radius:99px;padding:.1rem .55rem;font-size:.72rem;font-weight:700}
.balkje{height:7px;border-radius:99px;background:var(--lijn);margin:.45rem 0 .3rem;overflow:hidden}
.balkje div{height:100%;background:var(--blauw);border-radius:99px}
.knop{display:inline-flex;align-items:center;gap:.4rem;background:var(--blauw);color:#fff;border-radius:9px;padding:.45rem .85rem;font-size:.85rem;font-weight:600;text-decoration:none}
.knop:hover{filter:brightness(1.08)}
.knop.stil{background:#fff;color:#3C424A;border:1px solid var(--lijn)}
.knop.stil:hover{border-color:var(--blauw);color:var(--blauw);filter:none}
.knop svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.meer{display:block;text-align:center;padding-top:.8rem;margin-top:.4rem;border-top:1px solid var(--lijn);color:var(--blauw);font-weight:600;font-size:.85rem;text-decoration:none;width:100%}
.let{padding:.85rem 1rem;border-left:4px solid var(--geel);background:#FFFCF0;border-radius:0 8px 8px 0;font-size:.86rem;margin-bottom:1rem}
.mel{padding:.85rem 1rem;border-left:4px solid var(--blauw);background:var(--blauw-l);border-radius:0 8px 8px 0;font-size:.86rem;margin-bottom:1rem;display:flex;gap:.7rem}
.mel svg{width:18px;height:18px;flex:none;margin-top:2px;stroke:var(--blauw);fill:none;stroke-width:1.8}
select.filter{border:1px solid var(--lijn);border-radius:8px;padding:.32rem .55rem;font-size:.8rem;background:#fff}
.leegstand{text-align:center;padding:2.2rem 1rem;color:var(--grijs)}
.leegstand svg{width:34px;height:34px;stroke:var(--lijn);fill:none;stroke-width:1.6;margin-bottom:.6rem}
table.tab{width:100%;border-collapse:collapse;font-size:.86rem}
table.tab th{text-align:left;font-weight:700;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--grijs);padding:.5rem .6rem;border-bottom:1px solid var(--lijn)}
table.tab td{padding:.6rem;border-bottom:1px solid var(--lijn);vertical-align:top}
table.tab tr:last-child td{border-bottom:0}
table.tab td.num{text-align:right;white-space:nowrap}
.tijdlijn{position:relative;padding-left:1.4rem}
.tijdlijn::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--lijn)}
.tijdlijn .gebeurt{position:relative;padding:.5rem 0}
.tijdlijn .gebeurt::before{content:"";position:absolute;left:-1.4rem;top:.85rem;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--blauw)}
.veld{display:block;margin-bottom:.9rem}
.veld span{display:block;font-size:.8rem;font-weight:600;margin-bottom:.25rem}
.veld input,.veld select,.veld textarea{width:100%;border:1px solid var(--lijn);border-radius:9px;padding:.5rem .7rem;font-size:.88rem;background:#fff}
.veld input:focus,.veld textarea:focus{outline:none;border-color:var(--blauw)}
.schakel{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1px solid var(--lijn);font-size:.88rem}
.schakel:first-of-type{border-top:0}
.schakel input{margin-left:auto;width:18px;height:18px;accent-color:var(--blauw)}
.mobknop{display:none}
.overlay{position:fixed;inset:0;background:rgba(20,23,26,.45);display:flex;align-items:center;justify-content:center;padding:1.2rem;z-index:80}
.venster{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:1.4rem 1.5rem}
.venster h3{font-size:1.1rem;margin-bottom:.5rem}
.venster p{font-size:.9rem;color:#3C424A;margin-bottom:1rem}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .zij{position:fixed;left:0;top:0;bottom:0;width:var(--zij);z-index:70;transform:translateX(-100%);transition:transform .22s ease;height:100vh}
  .zij.open{transform:none}
  .mobknop{display:flex}
  .inhoud{padding:1rem}
  .balk{padding:.6rem .8rem}
  .gebruiker .naam,.gebruiker .rol{display:none}
  .zijscherm{position:fixed;inset:0;background:rgba(20,23,26,.4);z-index:60}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function cijfers(){
 const K=D.koppelingen||[];
 const draait=K.filter(k=>k.status==='Draait');
 const bouw=K.filter(k=>k.status==='In aanbouw');
 const uren=K.reduce((a,k)=>a+(+k.uren||0),0);
 const besparing=draait.reduce((a,k)=>a+(+k.besparing||0),0);
 const tarief=+D.tarief||200;
 const gefactureerd=K.reduce((a,k)=>a+(+k.gefactureerd||0),0);
 const gewerkt=uren*tarief;
 return {K,draait,bouw,uren,besparing,tarief,gefactureerd,gewerkt,open:Math.max(gewerkt-gefactureerd,0)};
}
function sparkline(reeks,kleur){
 const w=90,h=30,max=Math.max.apply(null,reeks.concat([1])),min=0;
 const pts=reeks.map((v,i)=>[(i/(reeks.length-1||1))*w, h-((v-min)/(max-min||1))*(h-4)-2]);
 return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'
  +'<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="'+kleur+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function donut(){
 const K=D.koppelingen||[];
 const volg=['Draait','In aanbouw','Voorgesteld','Idee','Gestopt'];
 const telling=volg.map(s=>({s,n:K.filter(k=>k.status===s).length})).filter(x=>x.n>0);
 const tot=K.length||1, r=52, omtrek=2*Math.PI*r;
 let start=0, segmenten='';
 telling.forEach(t=>{
   const deel=t.n/tot*omtrek;
   segmenten+='<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+KL[t.s][0]+'" stroke-width="18"'
     +' stroke-dasharray="'+(deel-3)+' '+(omtrek-deel+3)+'" stroke-dashoffset="'+(-start)+'" transform="rotate(-90 70 70)"/>';
   start+=deel;
 });
 return '<div style="display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap">'
  +'<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Verdeling van de statussen">'+segmenten
  +'<text x="70" y="68" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-size="26" font-weight="800" fill="#14171A">'+K.length+'</text>'
  +'<text x="70" y="86" text-anchor="middle" font-family="Instrument Sans,sans-serif" font-size="12" fill="#5C646E">Totaal</text></svg>'
  +'<div style="display:grid;gap:.5rem">'+telling.map(t=>'<div style="display:flex;gap:.5rem;align-items:center;font-size:.85rem">'
     +'<span style="width:9px;height:9px;border-radius:50%;background:'+KL[t.s][0]+'"></span><b>'+t.n+'</b> '+esc(t.s)+'</div>').join('')
  +'</div></div>';
}
function leeg(tekst){
 return '<div class="leegstand">'+ico(I.leeg)+'<p>'+esc(tekst)+'</p></div>';
}

/* ═══════════════ voorkeuren en notities (deze browser) ═══════════════ */
function sleutel(deel){return 'bg_portaal_'+deel+'_'+(klantParam||'onbekend');}
function voorkeuren(){
 let v={storing:true,week:true,factuur:true,mijlpaal:false};
 try{const o=JSON.parse(localStorage.getItem(sleutel('voorkeur'))||'null'); if(o) v=Object.assign(v,o);}catch(e){}
 return v;
}
function bewaarVoorkeur(id,aan){
 const v=voorkeuren(); v[id]=aan;
 try{localStorage.setItem(sleutel('voorkeur'),JSON.stringify(v));}catch(e){}
}
function eigenNotities(){
 try{return JSON.parse(localStorage.getItem(sleutel('notities'))||'[]');}catch(e){return [];}
}
function bewaarNotities(lijst){
 try{localStorage.setItem(sleutel('notities'),JSON.stringify(lijst));}catch(e){}
}

/* ═══════════════ tekenen ═══════════════ */
function route(){
 const h=(location.hash||'').replace(/^#\/?/,'').split('?')[0];
 return V[h]? h : 'dashboard';
}
function tekenMenu(){
 const r=route();
 $('#menu').innerHTML=MENU.map(m=>{
   if(m.kop) return '<div class="mkop">'+esc(m.kop)+'</div>';
   const t=m.tel&&D? m.tel(D):null;
   return '<a class="mlink'+(m.id===r?' aan':'')+'" href="#/'+m.id+'"'+(m.id===r?' aria-current="page"':'')+'>'
     +ico(m.ico)+'<span>'+esc(m.naam)+'</span>'+(t? '<span class="telp">'+t+'</span>':'')+'</a>';
 }).join('');
}
function teken(){
 if(!D) return;
 const r=route();
 tekenMenu();
 const c=cijfers();
 const kop = r==='dashboard'
   ? '<h1 class="titel">Wat er draait voor '+esc(D.klant.replace(' (voorbeeld)',''))+(isDemo?' <span>(voorbeeld)</span>':'')+'</h1>'
     +'<p class="sub">Alles wat we voor je gebouwd hebben, wat er nu loopt, en hoeveel uur eraan besteed is.</p>'
   : '<h1 class="titel">'+esc(TITELS[r]||'')+'</h1><p class="sub">'+esc(D.klant)+'</p>';
 $('#scherm').innerHTML=''
  +'<div class="kop-rij"><div>'
  +(r==='dashboard'? '<div class="welkom">Welkom terug, <b>'+esc((D.contact&&D.contact.naam||'').split(' ')[0]||'daar')+'</b> 👋</div>':'')
  +kop+'</div>'
  +'<div class="bijgewerkt">Bijgewerkt: '+esc(D.opgehaald||'—')+'</div></div>'
  +V[r]();
 window.scrollTo(0,0);
 koppelSchermknoppen();
}

/* ═══════════════ knoppen binnen een scherm ═══════════════ */
function koppelSchermknoppen(){
 const fs=$('#fStatus');
 if(fs) fs.addEventListener('change',e=>{filterStatus=e.target.value;teken();});

 document.querySelectorAll('[data-voorkeur]').forEach(el=>{
   el.addEventListener('change',e=>{bewaarVoorkeur(e.target.dataset.voorkeur,e.target.checked);melding('Voorkeur opgeslagen','Je krijgt hierover '+(e.target.checked?'wel':'geen')+' bericht meer.');});
 });

 document.querySelectorAll('[data-doc]').forEach(el=>{
   el.addEventListener('click',()=>{
     const d=(D.documenten||[])[+el.dataset.doc];
     melding(d? d.naam : 'Document', isDemo
       ? 'Dit is een voorbeeld, dus er hangt geen echt bestand aan. In jouw portaal opent hier het document zelf.'
       : 'Dit document staat klaar bij Bedrijfsgeheugen. Vraag het op via de contactpagina, dan sturen we het door.');
   });
 });

 const nb=$('#nBewaar');
 if(nb) nb.addEventListener('click',()=>{
   const t=$('#nTekst').value.trim();
   if(!t){melding('Lege notitie','Schrijf eerst even op wat je wilt vastleggen.');return;}
   const eigen=eigenNotities();
   const nieuw={datum:new Date().toISOString().slice(0,10),tekst:t};
   eigen.push(nieuw); bewaarNotities(eigen);
   D.notities=(D.notities||[]).concat([nieuw]);
   teken();
 });

 document.querySelectorAll('[data-notitie]').forEach(el=>{
   el.addEventListener('click',()=>{
     const [datum,...rest]=el.dataset.notitie.split('|');
     const tekst=rest.join('|');
     D.notities=(D.notities||[]).filter(n=>!(n.datum===datum&&n.tekst===tekst));
     bewaarNotities(eigenNotities().filter(n=>!(n.datum===datum&&n.tekst===tekst)));
     teken();
   });
 });

 const fb=$('#fbStuur');
 if(fb) fb.addEventListener('click',()=>{
   const t=($('#fbTekst').value||'').trim();
   if(!t){melding('Nog niets ingevuld','Schrijf eerst op wat er beter kan.');return;}
   melding('Dank je',"We hebben je bericht klaargezet. Wil je meteen antwoord? App Arthur, dan pakken we het direct op.");
   $('#fbTekst').value='';
 });
}

function melding(titel,tekst){
 const el=document.createElement('div');
 el.className='overlay';
 el.innerHTML='<div class="venster"><h3>'+esc(titel)+'</h3><p>'+esc(tekst)+'</p>'
   +'<button class="knop" data-sluit>Sluiten</button></div>';
 el.addEventListener('click',e=>{ if(e.target===el||e.target.hasAttribute('data-sluit')) el.remove(); });
 document.addEventListener('keydown',function ontsnap(e){ if(e.key==='Escape'){el.remove();document.removeEventListener('keydown',ontsnap);} });
 document.body.appendChild(el);
 el.querySelector('[data-sluit]').focus();
}

/* ═══════════════ balk: zoeken, meldingen, gebruiker ═══════════════ */
function zoekResultaten(t){
 t=t.toLowerCase().trim();
 if(!t) return [];
 const uit=[];
 (D.koppelingen||[]).forEach(k=>{
   if((k.titel+' '+(k.van||'')+' '+(k.naar||'')+' '+(k.middel||'')+' '+(k.notitie||'')).toLowerCase().includes(t))
     uit.push({tekst:k.titel,bij:'Koppeling · '+k.status,naar:'#/koppelingen'});
 });
 (D.documenten||[]).forEach(d=>{ if(d.naam.toLowerCase().includes(t)) uit.push({tekst:d.naam,bij:'Document',naar:'#/documenten'}); });
 (D.notities||[]).forEach(n=>{ if(n.tekst.toLowerCase().includes(t)) uit.push({tekst:n.tekst.slice(0,70),bij:'Notitie',naar:'#/notities'}); });
 (D.urenregels||[]).forEach(r=>{ if((r.wat+' '+r.koppeling).toLowerCase().includes(t)) uit.push({tekst:r.wat,bij:'Urenregel · '+datumNL(r.datum),naar:'#/uren'}); });
 MENU.filter(m=>m.id).forEach(m=>{ if(m.naam.toLowerCase().includes(t)) uit.push({tekst:m.naam,bij:'Pagina',naar:'#/'+m.id}); });
 return uit.slice(0,8);
}

 if(zij.classList.contains('open')&&!e.target.closest('.zij')&&!e.target.closest('#mobKnop')) zij.classList.remove('open');
});
$('#mobKnop').addEventListener('click',e=>{e.stopPropagation();$('#zij').classList.toggle('open');});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#zoek').focus();}
});
addEventListener('hashchange',()=>{ $('#zij').classList.remove('open'); if(D) teken(); });

tekenMenu();
if(isDemo){
 start(JSON.parse(JSON.stringify(DEMO)));
}else if(klantParam){
 $('#scherm').innerHTML='<div class="kaart"><p class="sub">Ophalen…</p></div>';
 fetch(HOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({klant:klantParam})})
  .then(r=>r.json())
  .then(d=>{
    if(!d||!d.koppelingen||!d.koppelingen.length){
      D=Object.assign({klant:klantParam,koppelingen:[]},d||{});
      start(D);
      $('#scherm').insertAdjacentHTML('beforeend','<div class="kaart"><h3>Nog niets vastgelegd</h3><p class="sub" style="margin-top:.3rem">Er staat nog geen koppeling op deze naam. Klopt dat niet? Laat het ons weten, dan kijken we mee.</p></div>');
      return;
    }
    start(d);
  })
  .catch(()=>mislukt('We konden de gegevens nu niet ophalen. Probeer het zo nog eens.'));
}else{
 kiesScherm();
}
</script>
</body>
</html>
