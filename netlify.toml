# Blog zonder slash → met slash
[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Acceptatie-preview: altijd de HTML van de huidige deploy, geen oude browsercache.
[[headers]]
  for = "/prototype-v18-stable.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

# Versioned hero media mag lang cachen: een inhoudswijziging krijgt een nieuw versienummer.
[[headers]]
  for = "/assets/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Stijl en scripts korter cachen. Ze hebben een versienummer in de URL, dus een
# nieuwe versie krijgt vanzelf een nieuw adres; deze regel is de vangnetlaag
# voor bestanden die zonder versienummer worden opgevraagd.
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Slot op de interne map. De edge function vraagt om inloggegevens; die staan
# als INTERN_GEBRUIKER en INTERN_WACHTWOORD in de Netlify-omgevingsvariabelen.
[[edge_functions]]
  function = "intern-slot"
  path = "/intern/*"

