# LET OP: dit bestand is TOML. Regels in _redirects-vorm (/van /naar 301)
# horen hier NIET in - die horen in het bestand _redirects. Staat er zo'n regel
# tussen, dan kan Netlify de configuratie niet lezen en faalt elke build met
# 'Failed during stage: Reading and parsing configuration files'. Dat gebeurde
# op 20 augustus 2026: de hele inhoud van _redirects was hier twee keer
# ingeplakt door een workflow.

# Bedrijfsgeheugen — routing, headers en caching
#
# OMGEVINGSVARIABELEN (Site configuration → Environment variables)
#   ANTHROPIC_API_KEY  — nodig voor /api/vraag, de zoekbalk in de kennisbank
#   NOTION_TOKEN       — nodig voor /api/monitor, de Digitaliseringsmonitor
#                        De Notion-database moet ook met die integratie gedeeld zijn,
#                        anders geeft Notion een 404 terwijl het token klopt.
# Let op: een gewijzigde variabele werkt pas vanaf de eerstvolgende build.

[build]
  publish = "."
  command = "node tools/bouw-sitemap.mjs && node tools/bouw-kennisindex.mjs && node tools/bouw-v18-production.mjs"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".github/workflows/*,netlify/functions/*,netlify.toml"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

