# Bedrijfsgeheugen — routing, headers en caching

[build]
  publish = "."

# .html-varianten netjes doorsturen naar de schone URL (voorkomt duplicate content)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/product.html"
  to = "/product"
  status = 301
  force = true

[[redirects]]
