<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07111f"><title>Data & AI Passport · EU AI Act Assurance · Bedrijfsgeheugen</title><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><style>:root{font-family:Inter,ui-sans-serif,system-ui;color:#142034;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#dce9ff 0,transparent 34%),#f4f7fb}.shell{max-width:1320px;margin:auto;padding:34px 22px 72px}.passport-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}.passport-head h1{font-size:clamp(42px,6vw,78px);line-height:.92;letter-spacing:-.065em}.passport-head h1 em{font-style:normal;color:#66758d}.passport-head p{max-width:820px;color:#596579;line-height:1.7}.passport-back{color:#5a6578;text-decoration:none}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.16em;color:#61708b}.passport-score{min-width:230px;padding:27px;border-radius:28px;background:#07111f;color:#fff}.passport-score strong{display:block;font-size:48px}.passport-score span,.passport-score small{display:block;color:#cbd5e1}.passport-mode-switch{display:flex;gap:8px;align-items:center;margin:24px 0}.passport-mode-switch button,.primary-btn{border:1px solid #ccd7e5;border-radius:999px;padding:11px 16px;background:#fff;color:#172033;font-weight:800;text-decoration:none;cursor:pointer}.passport-mode-switch button[aria-selected=true],.primary-btn{background:#07111f;color:#fff}.primary-btn{margin-left:auto}.passport-livebar{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#dfe6ef;border-radius:22px;overflow:hidden}.passport-fact{background:#fff;padding:16px}.passport-fact span{display:block;font-size:9px;color:#718096;text-transform:uppercase}.passport-fact strong{display:block;margin-top:6px;font-size:12px}.passport-orbit{padding:28px;border-radius:32px;background:radial-gradient(circle at 50% 0,rgba(85,132,201,.22),transparent 38%),#07111f;color:#fff;margin:24px 0;box-shadow:0 30px 70px rgba(7,17,31,.18)}.orbit-head{display:flex;justify-content:space-between;gap:28px}.orbit-head h2{font-size:clamp(28px,4vw,48px);margin:5px 0}.orbit-head p{max-width:540px;color:#9fb0c7}.passport-flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:30px 0}.passport-flow-node,.ai-act-node{border:1px solid rgba(255,255,255,.13);border-radius:20px;background:rgba(255,255,255,.055);color:#fff;padding:16px;text-align:left;cursor:pointer}.passport-flow-node strong,.ai-act-node strong{display:block}.passport-flow-node small,.ai-act-node small,.ai-act-node em{display:block;color:#9fb0c7;font-size:10px;margin-top:6px}.flow-hidden,.flow-link{display:none}.flow-inspector,.ai-act-inspector{padding:20px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(255,255,255,.055)}.trust-boundary{display:flex;gap:12px;align-items:center;margin-top:16px;font-size:10px}.trust-boundary i{flex:1;height:1px;background:linear-gradient(90deg,#51d98a,#f2b54b)}.ai-act-radar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0}.ai-act-node.status-effective{border-color:#51d98a}.ai-act-node.status-evidence_missing,.ai-act-node.status-remediation_required{border-color:#ff6575}.ai-act-node.status-future_readiness{border-color:#8dbbff}.ai-act-node:focus-visible,.passport-flow-node:focus-visible{outline:2px solid #8dbbff;outline-offset:3px}.passport-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.passport-summary div,.passport-card{background:#fff;border:1px solid #e1e7ef;border-radius:20px;padding:18px}.passport-summary strong{font-size:28px;display:block}.passport-disclaimer{padding:15px 17px;border-radius:14px;background:#e9efff;color:#40506a}.passport-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.passport-card{border-left:5px solid #cbd5e1}.passport-card.status-verified{border-left-color:#12a150}.passport-card.status-action_required{border-left-color:#dc3848}.passport-card dl div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:8px 0;border-top:1px solid #eef2f7}.passport-card dd{margin:0}.empty{max-width:680px;margin:15vh auto;background:#fff;border-radius:20px;padding:30px}@media(max-width:850px){.passport-head{grid-template-columns:1fr}.passport-livebar,.passport-flow,.ai-act-radar,.passport-grid{grid-template-columns:1fr}.passport-summary{grid-template-columns:repeat(2,1fr)}.passport-mode-switch{flex-wrap:wrap}.primary-btn{margin-left:0}.orbit-head{display:block}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}</style></head><body><main class="shell" id="passport-root"><div class="empty">Data & AI Passport laden…</div></main><script type="module">import{renderDataAiPassport}from'./data-ai-passport-view.mjs';const root=document.querySelector('#passport-root');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function authHeaders(user){try{const token=await user?.jwt?.();return token?{authorization:`Bearer ${token}`}:{}}catch{return{}}}function bind(){const modes=[...root.querySelectorAll('[data-passport-mode]')],panels=[...root.querySelectorAll('[data-mode-panel]')];modes.forEach(b=>b.addEventListener('click',()=>{modes.forEach(x=>x.setAttribute('aria-selected',String(x===b)));panels.forEach(p=>p.hidden=p.dataset.modePanel!==b.dataset.passportMode)}));const nodes=[...root.querySelectorAll('[data-flow-step]')],title=root.querySelector('#flow-detail-title'),copy=root.querySelector('#flow-detail-copy');nodes.forEach(n=>n.addEventListener('click',()=>{nodes.forEach(x=>x.setAttribute('aria-pressed','false'));n.setAttribute('aria-pressed','true');if(title)title.textContent=n.querySelector('strong')?.textContent||'';if(copy)copy.textContent=n.querySelector('[data-flow-detail]')?.textContent||''}));root.querySelectorAll('[data-ai-act-control]').forEach(n=>n.addEventListener('click',()=>{const inspector=root.querySelector('.ai-act-inspector');if(inspector)inspector.innerHTML=`<p class="eyebrow">EVIDENCE INSPECTOR</p><h3>${esc(n.querySelector('strong')?.textContent)}</h3><p>${esc(n.querySelector('small')?.textContent)}</p><strong>${esc(n.querySelector('span')?.textContent)}</strong>`}))}async function load(user){if(!user){root.innerHTML='<div class="empty"><h1>Inloggen vereist</h1><button id="login">Inloggen</button></div>';root.querySelector('#login')?.addEventListener('click',()=>window.netlifyIdentity?.open?.());return}try{const headers=await authHeaders(user),r=await fetch('/api/portal-state',{headers:{accept:'application/json',...headers},credentials:'same-origin'});if(!r.ok)throw new Error(`HTTP ${r.status}`);root.innerHTML=renderDataAiPassport(await r.json());bind()}catch(e){root.innerHTML=`<div class="empty"><h1>Passport niet beschikbaar</h1><p>Geen geverifieerde servercontext; daarom geen complianceclaims.</p><small>${esc(e?.message)}</small></div>`}}window.netlifyIdentity?.on?.('init',load);window.netlifyIdentity?.on?.('login',u=>{window.netlifyIdentity?.close?.();load(u)});window.netlifyIdentity?.init?.();</script></body></html>
