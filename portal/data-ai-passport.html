<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07111f">
  <title>Data & AI Passport · Bedrijfsgeheugen</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142034;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#dce9ff 0,transparent 34%),#f4f7fb}.shell{max-width:1280px;margin:0 auto;padding:34px 22px 72px}.passport-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:24px}.passport-back{display:inline-flex;margin-bottom:28px;color:#5a6578;text-decoration:none}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.14em;color:#61708b}.passport-head h1{font-size:clamp(38px,5.5vw,72px);line-height:.98;margin:8px 0 16px;letter-spacing:-.055em}.passport-head p{max-width:800px;color:#596579;line-height:1.7}.passport-score{min-width:210px;padding:24px;border-radius:24px;background:#07111f;color:white;box-shadow:0 22px 50px rgba(16,32,55,.2)}.passport-score strong{display:block;font-size:46px}.passport-score span,.passport-score small{display:block;color:#cbd5e1}.passport-score small{font-size:11px;margin-top:7px}.passport-livebar{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#dfe6ef;border:1px solid #dfe6ef;border-radius:22px;overflow:hidden;margin:20px 0}.passport-fact{background:rgba(255,255,255,.92);padding:18px}.passport-fact span{display:block;color:#718096;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.passport-fact strong{display:block;margin-top:7px;font-size:13px;line-height:1.35}.passport-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr auto 1fr auto 1fr;align-items:stretch;gap:9px;padding:18px;border-radius:24px;background:#07111f;color:white;margin:22px 0}.passport-flow>div{padding:16px 13px;border-radius:17px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);min-width:0}.passport-flow b{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#d9e8ff;color:#07111f;font-size:11px;margin-bottom:15px}.passport-flow span{display:block;font-weight:750;font-size:13px}.passport-flow small{display:block;color:#aebbd0;font-size:10px;margin-top:6px;line-height:1.4}.passport-flow i{align-self:center;color:#7587a0;font-style:normal}.passport-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.passport-summary div,.passport-card{background:white;border:1px solid #e1e7ef;border-radius:20px}.passport-summary div{padding:18px}.passport-summary strong{font-size:28px;display:block}.passport-summary span{font-size:13px;color:#697386}.passport-disclaimer{margin:18px 0 28px;padding:15px 17px;border-radius:14px;background:#e9efff;color:#40506a;font-size:13px;line-height:1.55}.passport-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.passport-card{padding:23px;border-left:5px solid #cbd5e1;box-shadow:0 8px 24px rgba(34,52,76,.035)}.passport-card.status-verified{border-left-color:#12a150}.passport-card.status-partially_verified{border-left-color:#d88a0b}.passport-card.status-action_required{border-left-color:#dc3848}.passport-card-head{display:flex;justify-content:space-between;gap:16px;font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.04em}.passport-card-head b{color:#334155}.passport-card h2{margin:13px 0 8px;font-size:22px;letter-spacing:-.02em}.passport-card p{color:#64748b;line-height:1.55}.passport-card dl{margin:18px 0 0}.passport-card dl div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:9px 0;border-top:1px solid #eef2f7}.passport-card dt{font-size:11px;color:#64748b}.passport-card dd{margin:0;font-size:13px;line-height:1.45}.passport-card details{margin-top:15px;border-top:1px solid #eef2f7;padding-top:13px}.passport-card summary{font-size:12px;font-weight:700;cursor:pointer}.passport-card ul{padding:0;list-style:none}.passport-card li{font-size:12px;padding:8px 0;border-top:1px dashed #e8edf3;line-height:1.4}.passport-card li small{display:block;margin-left:18px;color:#7a8798}.empty{max-width:680px;margin:15vh auto;background:white;border:1px solid #e5eaf1;border-radius:20px;padding:30px}.empty button{border:0;border-radius:10px;background:#172033;color:white;padding:12px 16px;font-weight:700}@media(max-width:1050px){.passport-livebar{grid-template-columns:repeat(2,1fr)}.passport-flow{grid-template-columns:repeat(2,1fr)}.passport-flow i{display:none}}@media(max-width:760px){.passport-head{grid-template-columns:1fr}.passport-score{min-width:0}.passport-summary{grid-template-columns:repeat(2,1fr)}.passport-grid{grid-template-columns:1fr}.passport-livebar{grid-template-columns:1fr}.passport-flow{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="shell" id="passport-root"><div class="empty">Data & AI Passport laden…</div></main>
<script type="module">
  import { renderDataAiPassport } from './data-ai-passport-view.mjs';
  const root=document.querySelector('#passport-root');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function authHeaders(user){try{const token=await user?.jwt?.();return token?{authorization:`Bearer ${token}`}:{}}catch{return{}}}
  async function load(user){if(!user){root.innerHTML='<div class="empty"><h1>Inloggen vereist</h1><p>Het passport gebruikt alleen de beveiligde bedrijfscontext van de ingelogde tenant.</p><button id="login">Inloggen</button></div>';document.querySelector('#login')?.addEventListener('click',()=>window.netlifyIdentity?.open?.());return}root.innerHTML='<div class="empty">Live platform- en tenantbewijs laden…</div>';try{const headers=await authHeaders(user);const response=await fetch('/api/portal-state',{headers:{accept:'application/json',...headers},credentials:'same-origin'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const state=await response.json();root.innerHTML=renderDataAiPassport(state)}catch(error){root.innerHTML=`<div class="empty"><h1>Passport niet beschikbaar</h1><p>Er is geen geverifieerde servercontext geladen. Er worden daarom geen complianceclaims getoond.</p><small>${esc(error?.message||'onbekende fout')}</small></div>`}}
  window.netlifyIdentity?.on?.('init',load);window.netlifyIdentity?.on?.('login',user=>{window.netlifyIdentity?.close?.();load(user)});window.netlifyIdentity?.init?.();
</script>
</body>
</html>
