  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142034;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#dce9ff 0,transparent 34%),#f4f7fb}.shell{max-width:1320px;margin:0 auto;padding:34px 22px 72px}.passport-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:24px}.passport-back{display:inline-flex;margin-bottom:28px;color:#5a6578;text-decoration:none}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.16em;color:#61708b}.passport-head h1{font-size:clamp(42px,6vw,78px);line-height:.92;margin:8px 0 18px;letter-spacing:-.065em}.passport-head h1 em{font-style:normal;color:#66758d}.passport-head p{max-width:800px;color:#596579;line-height:1.7}.passport-score{position:relative;overflow:hidden;min-width:230px;padding:27px;border-radius:28px;background:#07111f;color:white;box-shadow:0 22px 50px rgba(16,32,55,.2)}.passport-score strong{display:block;font-size:50px;letter-spacing:-.05em}.passport-score span,.passport-score small{display:block;color:#cbd5e1}.passport-score small{font-size:11px;margin-top:7px}.score-orbit{position:absolute!important;width:150px;height:150px;border:1px solid rgba(255,255,255,.16);border-radius:50%;right:-55px;top:-62px}.score-orbit:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#8dbbff;left:18px;bottom:23px;box-shadow:0 0 20px #8dbbff}.passport-livebar{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#dfe6ef;border:1px solid #dfe6ef;border-radius:22px;overflow:hidden;margin:20px 0}.passport-fact{background:rgba(255,255,255,.92);padding:18px}.passport-fact span{display:block;color:#718096;font-size:10px;text-transform:uppercase;letter-spacing:.07em}.passport-fact strong{display:block;margin-top:7px;font-size:13px;line-height:1.35}
    .passport-orbit{position:relative;overflow:hidden;padding:28px;border-radius:32px;background:radial-gradient(circle at 50% 0,rgba(85,132,201,.22),transparent 38%),#07111f;color:white;margin:24px 0 18px;box-shadow:0 30px 70px rgba(7,17,31,.18)}.passport-orbit:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}.orbit-head{position:relative;display:flex;justify-content:space-between;gap:30px;align-items:end}.orbit-head h2{font-size:clamp(28px,4vw,48px);margin:5px 0;letter-spacing:-.04em}.orbit-head p:last-child{max-width:480px;color:#9fb0c7;font-size:12px;line-height:1.55}.passport-flow{position:relative;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));align-items:center;gap:7px;margin:35px 0 26px}.passport-flow-node{appearance:none;position:relative;z-index:2;min-width:0;min-height:164px;padding:16px 12px;border:1px solid rgba(255,255,255,.11);border-radius:21px;background:rgba(255,255,255,.055);color:white;text-align:left;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .35s,border-color .35s,box-shadow .35s}.passport-flow-node:hover,.passport-flow-node:focus-visible{transform:translateY(-6px);border-color:rgba(150,190,255,.5);outline:none}.passport-flow-node[aria-pressed="true"]{transform:translateY(-9px);background:rgba(126,170,235,.15);border-color:#91b9f2;box-shadow:0 18px 45px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.06)}.flow-index{font-size:10px;color:#7f91aa;letter-spacing:.12em}.flow-pulse{display:block;width:11px;height:11px;margin:19px 0 14px;border-radius:50%;background:#7f91aa;box-shadow:0 0 0 5px rgba(127,145,170,.08)}.status-verified .flow-pulse{background:#51d98a;box-shadow:0 0 0 5px rgba(81,217,138,.08),0 0 22px rgba(81,217,138,.35)}.status-partially_verified .flow-pulse{background:#f2b54b}.status-action_required .flow-pulse{background:#ff6575}.passport-flow-node strong{display:block;font-size:14px}.passport-flow-node small{display:block;color:#93a5bd;font-size:10px;line-height:1.4;margin-top:6px}.flow-status{display:block;margin-top:13px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#b8c6d8}.flow-hidden{display:none}.flow-link{position:relative;height:2px;background:rgba(143,167,199,.28);overflow:visible}.flow-link i{position:absolute;width:34%;height:2px;background:#8dbbff;left:0;top:0;box-shadow:0 0 13px #8dbbff;animation:signal 2.6s ease-in-out infinite}.flow-inspector{position:relative;display:grid;grid-template-columns:minmax(180px,.65fr) 1.35fr auto;gap:24px;align-items:center;padding:20px 22px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(255,255,255,.055);backdrop-filter:blur(16px)}.flow-inspector h3{margin:5px 0 0;font-size:23px}.inspector-kicker{font-size:9px;letter-spacing:.12em;color:#8dbbff}.flow-inspector p{margin:0;color:#c7d3e2;font-size:12px;line-height:1.6}.inspector-hint{font-size:9px;color:#788aa3;text-align:right}.trust-boundary{position:relative;display:grid;grid-template-columns:auto 1fr auto auto 1.4fr;gap:12px;align-items:center;margin-top:18px;padding:12px 4px 0;color:#899bb2;font-size:9px;letter-spacing:.08em}.trust-boundary strong{color:#c8d4e2;font-size:10px;letter-spacing:0}.trust-boundary i{height:1px;background:linear-gradient(90deg,#51d98a,#f2b54b);min-width:42px}@keyframes signal{0%{left:-20%;opacity:0}20%{opacity:1}80%{opacity:1}100%{left:86%;opacity:0}}
    .passport-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.passport-summary div,.passport-card{background:white;border:1px solid #e1e7ef;border-radius:20px}.passport-summary div{padding:18px}.passport-summary strong{font-size:28px;display:block}.passport-summary span{font-size:13px;color:#697386}.passport-disclaimer{margin:18px 0 28px;padding:15px 17px;border-radius:14px;background:#e9efff;color:#40506a;font-size:13px;line-height:1.55}.passport-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.passport-card{padding:23px;border-left:5px solid #cbd5e1;box-shadow:0 8px 24px rgba(34,52,76,.035)}.passport-card.status-verified{border-left-color:#12a150}.passport-card.status-partially_verified{border-left-color:#d88a0b}.passport-card.status-action_required{border-left-color:#dc3848}.passport-card-head{display:flex;justify-content:space-between;gap:16px;font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.04em}.passport-card-head b{color:#334155}.passport-card h2{margin:13px 0 8px;font-size:22px}.passport-card p{color:#64748b;line-height:1.55}.passport-card dl{margin:18px 0 0}.passport-card dl div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:9px 0;border-top:1px solid #eef2f7}.passport-card dt{font-size:11px;color:#64748b}.passport-card dd{margin:0;font-size:13px;line-height:1.45}.passport-card details{margin-top:15px;border-top:1px solid #eef2f7;padding-top:13px}.passport-card summary{font-size:12px;font-weight:700;cursor:pointer}.passport-card ul{padding:0;list-style:none}.passport-card li{font-size:12px;padding:8px 0;border-top:1px dashed #e8edf3;line-height:1.4}.passport-card li small{display:block;margin-left:18px;color:#7a8798}.empty{max-width:680px;margin:15vh auto;background:white;border:1px solid #e5eaf1;border-radius:20px;padding:30px}.empty button{border:0;border-radius:10px;background:#172033;color:white;padding:12px 16px;font-weight:700}@media(max-width:1050px){.passport-livebar{grid-template-columns:repeat(2,1fr)}.passport-flow{grid-template-columns:repeat(3,1fr)}.flow-link{display:none}.flow-inspector{grid-template-columns:1fr 1.5fr}.inspector-hint{display:none}.trust-boundary{grid-template-columns:1fr 1.5fr}.trust-boundary i{display:none}}@media(max-width:760px){.passport-head{grid-template-columns:1fr}.passport-score{min-width:0}.passport-summary{grid-template-columns:repeat(2,1fr)}.passport-grid{grid-template-columns:1fr}.passport-livebar{grid-template-columns:1fr}.passport-orbit{padding:20px;border-radius:25px}.orbit-head{display:block}.passport-flow{grid-template-columns:repeat(2,1fr);gap:9px}.passport-flow-node{min-height:145px}.flow-inspector{grid-template-columns:1fr;gap:10px}.trust-boundary{grid-template-columns:1fr;gap:6px}}@media(prefers-reduced-motion:reduce){.flow-link i{animation:none}.passport-flow-node{transition:none}}
  </style>
</head>
<body><main class="shell" id="passport-root"><div class="empty">Data & AI Passport laden…</div></main>
<script type="module">
  import { renderDataAiPassport } from './data-ai-passport-view.mjs';
  const root=document.querySelector('#passport-root');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function authHeaders(user){try{const token=await user?.jwt?.();return token?{authorization:`Bearer ${token}`}:{}}catch{return{}}}
  function bindJourney(){const nodes=[...root.querySelectorAll('[data-flow-step]')];const title=root.querySelector('#flow-detail-title');const copy=root.querySelector('#flow-detail-copy');const kicker=root.querySelector('.inspector-kicker');nodes.forEach((node,index)=>node.addEventListener('click',()=>{nodes.forEach(n=>n.setAttribute('aria-pressed','false'));node.setAttribute('aria-pressed','true');if(title)title.textContent=node.querySelector('strong')?.textContent||'';if(copy)copy.textContent=node.querySelector('[data-flow-detail]')?.textContent||'';if(kicker)kicker.textContent=`0${index+1} · ${(node.querySelector('strong')?.textContent||'').toUpperCase()}`}))}
  async function load(user){if(!user){root.innerHTML='<div class="empty"><h1>Inloggen vereist</h1><p>Het passport gebruikt alleen de beveiligde bedrijfscontext van de ingelogde tenant.</p><button id="login">Inloggen</button></div>';document.querySelector('#login')?.addEventListener('click',()=>window.netlifyIdentity?.open?.());return}root.innerHTML='<div class="empty">Live platform- en tenantbewijs laden…</div>';try{const headers=await authHeaders(user);const response=await fetch('/api/portal-state',{headers:{accept:'application/json',...headers},credentials:'same-origin'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const state=await response.json();root.innerHTML=renderDataAiPassport(state);bindJourney()}catch(error){root.innerHTML=`<div class="empty"><h1>Passport niet beschikbaar</h1><p>Er is geen geverifieerde servercontext geladen. Er worden daarom geen complianceclaims getoond.</p><small>${esc(error?.message||'onbekende fout')}</small></div>`}}
  window.netlifyIdentity?.on?.('init',load);window.netlifyIdentity?.on?.('login',user=>{window.netlifyIdentity?.close?.();load(user)});window.netlifyIdentity?.init?.();
</script></body></html>
