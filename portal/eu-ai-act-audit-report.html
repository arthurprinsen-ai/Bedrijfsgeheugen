<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EU AI Act Audit Report · Bedrijfsgeheugen</title><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><style>body{font-family:Inter,system-ui;margin:0;background:#f4f7fb;color:#172033}.page{max-width:1100px;margin:auto;padding:40px 24px}.hero,.card{background:#fff;border:1px solid #dfe6ef;border-radius:22px;padding:24px;margin:14px 0}.hero{background:#07111f;color:#fff}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metrics div{background:#eef3f9;padding:14px;border-radius:14px}.control{border-left:4px solid #8dbbff}.effective{border-left-color:#19a45b}.evidence_missing,.remediation_required{border-left-color:#dc3848}.future_readiness{border-left-color:#3977c5}button,a{display:inline-block;border:0;border-radius:999px;background:#172033;color:#fff;padding:11px 15px;text-decoration:none;font-weight:700;cursor:pointer}@media print{body{background:#fff}.actions{display:none}.hero,.card{break-inside:avoid}}</style></head><body><main class="page" id="report"><div class="card">Auditrapport laden…</div></main><script type="module">import{buildPassportFromState}from'./data-ai-passport.mjs';import{buildEuAiActAuditReport}from'./eu-ai-act-audit-report.mjs';const root=document.querySelector('#report'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function headers(u){try{const t=await u?.jwt?.();return t?{authorization:`Bearer ${t}`}:{}}catch{return{}}}function render(r){root.innerHTML=`<section class="hero"><p class="eyebrow">EU AI ACT · EVIDENCE ASSURANCE</p><h1>Audit Report</h1><p>${esc(r.conclusion)}</p><small>${esc(r.disclaimer)}</small></section><div class="actions"><a href="/portal/data-ai-passport.html">← Passport</a> <button id="print">Print / PDF</button> <button id="json">JSON export</button></div><section class="metrics"><div><strong>${r.scope.systems}</strong><br>AI-systemen</div><div><strong>${r.controls.length}</strong><br>Controls</div><div><strong>${r.findings.length}</strong><br>Findings</div><div><strong>${esc(r.baseline?.asOf||'—')}</strong><br>Baseline</div></section><section class="card"><h2>Scope & inventory</h2>${r.inventory.map(x=>`<p><b>${esc(x.name||x.useCaseId)}</b> · ${esc(x.provider)} · ${esc(x.model)} · risk ${esc(x.riskClass)} · role ${esc(x.role)}</p>`).join('')}</section><section class="card"><h2>Applicable controls</h2>${r.controls.map(c=>`<article class="card control ${esc(c.status)}"><b>${esc(c.article)} · ${esc(c.title)}</b><p>${esc(c.name||c.useCaseId)} · ${esc(c.status)} · effective ${esc(c.effectiveFrom)}</p><small>Evidence refs: ${esc((c.evidenceRefs||[]).join(', ')||'geen')}</small></article>`).join('')}</section><section class="card"><h2>Findings & remediation</h2>${r.findings.length?r.findings.map(f=>`<article><b>${esc(f.article)} · ${esc(f.title)}</b><p>Owner: ${esc(f.owner)} · ${esc(f.remediation)}</p></article>`).join(''):'<p>Geen open derived findings voor de beoordeelde huidige scope.</p>'}</section><section class="card"><h2>Evidence index</h2>${r.evidenceIndex.map(e=>`<p>${esc(e.article)} · ${esc(e.useCaseId)} · ${esc(e.ref)}</p>`).join('')||'<p>Geen evidence-referenties.</p>'}</section>`;root.querySelector('#print')?.addEventListener('click',()=>print());root.querySelector('#json')?.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(r,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eu-ai-act-audit-report.json';a.click();URL.revokeObjectURL(a.href)})}async function load(u){if(!u){root.innerHTML='<div class="card"><h1>Inloggen vereist</h1><button id="login">Inloggen</button></div>';root.querySelector('#login')?.addEventListener('click',()=>netlifyIdentity.open());return}const res=await fetch('/api/portal-state',{headers:{accept:'application/json',...await headers(u)},credentials:'same-origin'});if(!res.ok)throw new Error(`HTTP ${res.status}`);render(buildEuAiActAuditReport(buildPassportFromState(await res.json())))}window.netlifyIdentity?.on?.('init',u=>load(u).catch(e=>root.innerHTML=`<div class="card"><h1>Rapport niet beschikbaar</h1><p>${esc(e.message)}</p></div>`));window.netlifyIdentity?.on?.('login',u=>{netlifyIdentity.close();load(u)});window.netlifyIdentity?.init?.();</script></body></html>
