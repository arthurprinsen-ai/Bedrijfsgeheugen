<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Klantportaal — wijzigingen, klikbare demo | Bedrijfsgeheugen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=optional" rel="stylesheet">
<style>
:root{--vel:#F5F6F8;--wit:#fff;--inkt:#14171A;--blauw:#2742D6;--oranje:#FF4F17;--geel:#FFE86B;
 --grijs:#5C646E;--zacht:#8A93A0;--lijn:#E4E7EC;--groen:#1F9D55;--amber:#E8A200;
 --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--vel);color:var(--inkt);font-family:var(--body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.015em;margin:0}
button{font:inherit}

/* ---- kop ---- */
.kop{background:var(--wit);border-bottom:1px solid var(--lijn);position:sticky;top:0;z-index:40}
.koprij{display:flex;align-items:center;gap:14px;padding:11px 22px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:16px}
.logo .geeltje{width:26px;height:26px;border-radius:6px;background:var(--geel);position:relative}
.logo .geeltje::after{content:"";position:absolute;right:0;bottom:0;width:9px;height:9px;background:linear-gradient(135deg,rgba(0,0,0,.14) 0 50%,var(--wit) 50%)}
.kop .titel{font-family:var(--display);font-weight:800;font-size:16px;border-left:1px solid var(--lijn);padding-left:14px}
.kop .re{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--grijs)}
.kop select{font-size:13px;padding:5px 9px;border:1px solid var(--lijn);border-radius:7px;background:var(--wit)}
.kop .re img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#EEF1FE}

.groeprij{display:flex;gap:0;padding:0 22px;overflow-x:auto;scrollbar-width:none}
.groeprij::-webkit-scrollbar{display:none}
.nvgroep{padding:6px 18px 0;border-left:1px solid var(--lijn)}
.nvgroep:first-child{border-left:0;padding-left:0}
.nvgroep .kopje{font-size:11.5px;color:var(--zacht);text-align:center;margin-bottom:2px}
.nvgroep .items{display:flex;gap:2px}
.nv{background:none;border:0;border-bottom:2px solid transparent;padding:7px 11px;font-size:13px;color:var(--grijs);cursor:pointer;white-space:nowrap}
.nv:hover{color:var(--inkt)}
.nv[aria-selected="true"]{color:var(--blauw);font-weight:600;border-bottom-color:var(--blauw)}

.lint{background:var(--geel);color:#4A3800;font-size:12.5px;padding:7px 22px;display:flex;gap:10px;align-items:center}
.lint b{font-weight:600}
.lint button{margin-left:auto;font-size:12.5px;font-weight:600;background:var(--wit);border:1px solid #E4D48A;border-radius:6px;padding:3px 10px;cursor:pointer}

/* ---- indeling ---- */
.romp{display:grid;grid-template-columns:236px minmax(0,1fr);gap:0;align-items:start;max-width:1440px;margin:0 auto}
.zij{padding:18px 14px 40px;position:sticky;top:112px}
.zgroep{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--zacht);margin:16px 0 5px;padding-left:11px}
.zgroep:first-child{margin-top:0}
.zij button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 11px;border-radius:8px;font-size:13.5px;color:#39414A;cursor:pointer}
.zij button:hover{background:#ECEEF2}
.zij button[aria-selected="true"]{background:#E9EDFD;color:var(--blauw);font-weight:600}
.zij .bel{float:right;font-size:11px;font-weight:600;background:var(--oranje);color:#fff;border-radius:20px;padding:0 6px;margin-top:3px}
.inhoud{padding:18px 22px 90px;min-width:0}
.paneel{display:none}.paneel.aan{display:block}

.kaart{background:var(--wit);border:1px solid var(--lijn);border-radius:11px;padding:16px 17px;margin-bottom:14px}
.kk{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.kk h3{font-size:15px}.kk .re{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sub{font-size:13px;color:var(--grijs)}
h1.pk{font-size:22px;margin-bottom:2px}
p.uitleg{color:var(--grijs);margin:0 0 14px;font-size:13.5px;max-width:78ch}

.pil{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid var(--lijn);color:var(--grijs);background:var(--wit);white-space:nowrap}
.pil.open{color:var(--blauw);border-color:#C3CCF6;background:#EEF1FE}
.pil.goed{color:var(--groen);border-color:#BEE3CF;background:#EDF8F1}
.pil.klaar{color:var(--grijs)}
.pil.terug{color:var(--oranje);border-color:#F3C4B2;background:#FFF3EE}

.knop{font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:8px;border:1px solid var(--lijn);background:var(--wit);color:var(--inkt);cursor:pointer}
.knop.klein{font-size:12.5px;padding:5px 11px}
.knop.blauw{background:var(--blauw);border-color:var(--blauw);color:#fff}
.knop.groen{background:var(--groen);border-color:var(--groen);color:#fff}
.knop.terug{border-color:#F3C4B2;color:var(--oranje)}
.knop:disabled{opacity:.45;cursor:default}
.knop:focus-visible,.nv:focus-visible,.zij button:focus-visible{outline:2px solid var(--blauw);outline-offset:2px}
.knoppen{display:flex;gap:9px;flex-wrap:wrap}

/* dashboard */
.tegels4{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px}
.tegels4 .kaart{margin:0}
.tegels4 .getal{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15}
.tegels4 .kaart.let{border-color:#F3C4B2;background:#FFF7F4}
.tegels4 .kaart.let .getal{color:var(--oranje)}

.rij{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--lijn);font-size:13.5px}
.rij:last-child{border-bottom:0}
.rij .afd{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--blauw);background:#EEF1FE;border-radius:5px;padding:2px 8px;white-space:nowrap}
.rij .wie{font-size:12px;color:var(--grijs)}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#EEF1FE;flex:0 0 30px}
.persoon{display:flex;align-items:center;gap:9px}
.persoon .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.persoon .rl{font-size:11.5px;color:var(--grijs);line-height:1.25}

/* wijzigingen: lijst + detail */
.tweeluik{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:14px;align-items:start}
.vlijst{display:grid;gap:9px}
.vkaart{width:100%;text-align:left;background:var(--wit);border:1px solid var(--lijn);border-radius:10px;padding:12px 13px;cursor:pointer}
.vkaart:hover{border-color:#C3CCF6}
.vkaart[aria-current="true"]{border-color:var(--blauw);background:#F7F9FF}
.vkaart .vt{font-weight:600;font-size:14px;margin:6px 0 2px}
.vkaart .vm{font-size:12.5px;color:var(--grijs)}
.subtabs{display:flex;gap:14px;border-bottom:1px solid var(--lijn);margin-bottom:11px}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 0;font-size:13px;color:var(--grijs);cursor:pointer}
.subtabs button[aria-selected="true"]{color:var(--blauw);font-weight:600;border-bottom-color:var(--blauw)}
.subtabs .n{font-size:11px;color:var(--zacht)}

.vn{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--lijn);border-radius:9px;overflow:hidden}
.vn>div{padding:11px 13px}
.vn>div+div{border-left:1px solid var(--lijn);background:#F7FBF8}
.vn .lb{font-size:11px;color:var(--grijs);margin-bottom:3px}
.vn .wd{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.vn>div+div .wd{color:var(--groen)}
.waaromvak{margin-top:11px;border:1px solid var(--lijn);border-radius:9px;padding:11px 13px;background:#FCFCFB;font-size:13.5px}
.waaromvak .lb{font-size:11px;color:var(--grijs);margin-bottom:3px}
.waaromvak textarea{width:100%;font:inherit;font-size:13.5px;border:1px dashed #E4D48A;background:#FFFDF2;border-radius:7px;padding:7px 9px}

.impact{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.itegel{border:1px solid var(--lijn);border-radius:10px;padding:12px 10px;text-align:center;background:var(--wit)}
.itegel .ic{width:30px;height:30px;border-radius:8px;background:#EEF1FE;display:grid;place-items:center;margin:0 auto 7px;font-size:14px}
.itegel .g{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.itegel .l{font-size:11.5px;color:var(--grijs);margin-top:3px}

table.acties{width:100%;border-collapse:collapse;font-size:13px}
table.acties th{text-align:left;font-size:11.5px;color:var(--grijs);font-weight:600;padding:0 8px 7px 0;border-bottom:1px solid var(--lijn)}
table.acties td{padding:9px 8px 9px 0;border-bottom:1px solid var(--lijn);vertical-align:middle}
table.acties tr:last-child td{border-bottom:0}
table.acties input{accent-color:var(--blauw);width:15px;height:15px}
.oudw{color:var(--zacht);text-decoration:line-through}
.nieuww{color:var(--groen);font-weight:600}

.voetmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
.voetmeta .mv{border:1px solid var(--lijn);border-radius:10px;padding:10px 12px;background:var(--wit)}
.voetmeta .lb{font-size:11px;color:var(--grijs);margin-bottom:5px}

/* klad-balk */
.kladbalk{position:fixed;left:0;right:0;bottom:0;background:var(--wit);border-top:1px solid var(--lijn);
 box-shadow:0 -8px 26px -20px rgba(0,0,0,.35);z-index:45;padding:9px 20px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.kladbalk .punt{width:9px;height:9px;border-radius:50%;background:var(--zacht)}
.kladbalk.actief .punt{background:var(--blauw)}
.kladbalk .aand{display:inline-flex;align-items:center;gap:8px;font-size:13.5px}
.kladbalk input.naam{font:inherit;font-size:13.5px;border:1px solid var(--lijn);border-radius:7px;padding:5px 9px;max-width:230px}
.kladbalk .knoppen{margin-left:auto}
body{padding-bottom:64px}

/* rechten */
.rmatrix{width:100%;border-collapse:collapse;font-size:13px}
.rmatrix th{text-align:left;font-size:11.5px;color:var(--grijs);font-weight:600;padding:0 8px 7px 0;border-bottom:1px solid var(--lijn)}
.rmatrix td{padding:7px 8px 7px 0;border-bottom:1px solid var(--lijn)}
.rmatrix tr:last-child td{border-bottom:0}
.vink{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--grijs)}
.vink input{accent-color:var(--blauw);width:15px;height:15px}
.eigen{font-size:11.5px;color:var(--zacht)}

.melding{display:flex;gap:9px;align-items:flex-start;border-radius:9px;padding:11px 12px;font-size:13px;margin-top:11px}
.melding.let{border:1px solid #F0DCA8;background:#FDF7E7;color:#6B5200}
.melding.bezig{border:1px solid #C3CCF6;background:#EEF1FE;color:#1B2E9B}
.melding.goed{border:1px solid #BEE3CF;background:#EDF8F1;color:#0F5C34}
.melding.rust{border:1px solid var(--lijn);background:#FAFBFC;color:var(--grijs)}

.tl{list-style:none;margin:0;padding:0 0 0 18px;position:relative;font-size:13.5px}
.tl::before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:2px;background:var(--lijn)}
.tl li{position:relative;padding-bottom:14px}
.tl li::before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--wit);border:2px solid var(--lijn)}
.tl li.nw::before{border-color:var(--blauw);background:var(--blauw)}
.tl .wn{font-size:12px;color:var(--grijs)}.tl .wt{font-weight:600}
.tl .rdn{font-size:12.5px;background:#FAFBFC;border:1px dashed var(--lijn);border-radius:7px;padding:6px 8px;margin-top:4px}

.dimrij{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(100px,1fr) auto;gap:12px;align-items:center;
 padding:9px 0 9px 9px;border-bottom:1px solid var(--lijn);border-left:3px solid transparent;margin-left:-12px}
.dimrij:last-child{border-bottom:0}
.dimrij.klad{border-left-color:var(--blauw);background:#F7F9FF}
.balkje{display:flex;gap:3px}
.blok{height:8px;flex:1;border-radius:2px;background:#E9ECF0}
.blok.aan{background:var(--blauw)}.blok.kladaan{background:#93A3EC}
select.niv{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--lijn);border-radius:7px;background:var(--wit);max-width:175px}
select.niv:disabled{background:#F2F4F6;color:var(--zacht)}
.was{font-size:11.5px;color:var(--grijs)}.was s{color:var(--zacht)}
.slotje{font-size:11.5px;color:var(--zacht)}

.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(18px);opacity:0;pointer-events:none;
 background:var(--inkt);color:#fff;border-radius:9px;padding:11px 15px;font-size:13.5px;display:flex;gap:14px;align-items:center;transition:.24s;z-index:60;max-width:calc(100% - 26px)}
.toast.aan{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{font-size:13px;font-weight:600;color:var(--geel);background:none;border:0;cursor:pointer;padding:0;white-space:nowrap}

@media(max-width:1040px){.tweeluik{grid-template-columns:1fr}}
@media(max-width:900px){.romp{grid-template-columns:1fr}.zij{position:static;padding-bottom:6px}
 .zgroep{margin-top:10px}.vn{grid-template-columns:1fr}.vn>div+div{border-left:0;border-top:1px solid var(--lijn)}
 .dimrij{grid-template-columns:1fr;gap:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

<div class="kladbalk" id="kladbalk"></div>

/* ---------- hulpjes ---------- */
function naam(w){return MENSEN[w]?MENSEN[w].naam:w;}
function vnaam(w){return naam(w).split(' ')[0];}
function dimNaam(k){return k==='__thema'?'Focusthema':DIM.filter(function(d){return d.k===k;})[0].n;}
function eigenaarVan(k){for(var w in MENSEN){if(MENSEN[w].bezit.indexOf(k)>=0)return w;}return 'sanne';}
function magWijzigen(w,k){ if(MENSEN[w].beheerder) return true;
 if(MENSEN[w].bezit.indexOf(k)>=0) return true;
 return (S.rechten[w]||[]).indexOf(k)>=0; }
function versies(k){ if(k==='__thema')return S.themaVersies;
 if(!S.versies[k])S.versies[k]=[v(NIV[S.niveaus[k]],'sanne','7 januari 2026','Uit de Frisse blik')];return S.versies[k];}
function klad(){return S.kladden[IK]||null;}
function inKlad(){return !!klad();}
function kladW(k){var kl=klad();if(!kl)return null;var r=kl.w.filter(function(x){return x.k===k;})[0];return r?r.naar:null;}
function toonNiveau(k){var w=kladW(k);return w!==null?NIV.indexOf(w):S.niveaus[k];}
function toonThema(){var w=kladW('__thema');if(w){for(var t in THEMA){if(THEMA[t].n===w)return t;}}return S.thema;}
function opSlot(k){return S.voorstellen.some(function(p){return p.status==='open'&&p.w.some(function(x){return x.k===k;});});}
function doorwerking(tk){var caps=THEMA[tk].caps,afd={},taken=[],kpi={},proc={},sys={};
 caps.forEach(function(ck){var c=CAP[ck];if(!c)return;
  (c.kpi||[]).forEach(function(x){kpi[x]=true;});(c.proc||[]).forEach(function(x){proc[x]=true;});(c.sys||[]).forEach(function(x){sys[x]=true;});
  c.afd.forEach(function(a){afd[a]=true;(c.proj||[]).forEach(function(p){
   if(!taken.some(function(t){return t.afd===a&&t.wat===p;}))taken.push({afd:a,wat:p,wie:AFD_EIG[a]||'lisa',klaar:false});});});});
 var mensen={};Object.keys(afd).forEach(function(a){mensen[AFD_EIG[a]||'lisa']=true;});
 return{caps:caps,afd:Object.keys(afd),taken:taken,kpi:Object.keys(kpi),proc:Object.keys(proc),sys:Object.keys(sys),mensen:Object.keys(mensen)};}

 var teBeoordelen=S.voorstellen.filter(function(p){return p.status==='open'&&p.raakt[IK]&&!p.akkoord[IK];});
 var vanMij=S.voorstellen.filter(function(p){return p.status==='open'&&p.door===IK;});
 var verzoeken=MENSEN[IK].beheerder?S.verzoeken.filter(function(x){return !x.af;}):[];
 return{taken:mijnTaken,beoordelen:teBeoordelen,vanMij:vanMij,verzoeken:verzoeken};
}

function geefRecht(i,ja){
  var open=S.verzoeken.filter(function(x){return !x.af;}), x=open[i];

  if(ja){ S.rechten[x.wie]=(S.rechten[x.wie]||[]).concat([x.k]);

    melden(vnaam(x.wie)+' mag '+dimNaam(x.k)+' nu wijzigen.','Sluiten',null); }
  else { S.log.unshift({op:'zojuist',wat:'Rechtenverzoek van '+naam(x.wie)+' afgewezen',wie:IK,rdn:''});
    melden('Afgewezen.','Sluiten',null); }
  alles();
}
function vraagRecht(k){
  if(S.verzoeken.some(function(x){return !x.af&&x.wie===IK&&x.k===k;}))return;
  S.verzoeken.push({wie:IK,k:k,af:false});
  S.log.unshift({op:'zojuist',wat:naam(IK)+' vraagt rechten op '+dimNaam(k),wie:IK,rdn:''});
  document.getElementById('lintTekst').innerHTML='Verzoek verstuurd. Wissel rechtsboven naar <b>Arthur Prinsen</b> — hij ziet het op zijn dashboard.';
  melden('Verzoek naar de beheerder gestuurd.','Sluiten',null); alles();
}

/* ---------- klad ---------- */
function startKlad(){S.kladden[IK]={naam:'Wijzigingen van '+vnaam(IK),w:[],waarom:''};
 document.getElementById('lintTekst').innerHTML='U werkt nu in een <b>klad</b>. Alleen u ziet dit, tot u het indient.';alles();}
function gooiWeg(){delete S.kladden[IK];melden('Klad weggegooid. Er is niets veranderd.','Sluiten',null);alles();}
function zetInKlad(k,naar){var kl=klad();if(!kl)return;
 var van=k==='__thema'?THEMA[S.thema].n:NIV[S.niveaus[k]];
 var i=-1;kl.w.forEach(function(x,j){if(x.k===k)i=j;});
 if(naar===van){if(i>=0)kl.w.splice(i,1);}else if(i>=0)kl.w[i].naar=naar;else kl.w.push({k:k,van:van,naar:naar,mee:true});
 alles();}
function dien(){var kl=klad(),mee=kl.w.filter(function(x){return x.mee!==false;});if(!mee.length)return;
 var raakt={};mee.forEach(function(x){var e=eigenaarVan(x.k);if(e!==IK)raakt[e]=(raakt[e]||0)+1;
  if(x.k==='__thema'){var tk=null;for(var t in THEMA){if(THEMA[t].n===x.naar)tk=t;}
   doorwerking(tk).afd.forEach(function(a){var w=AFD_EIG[a]||'lisa';if(w!==IK)raakt[w]=(raakt[w]||0)+1;});}});
 var p={id:Date.now(),door:IK,titel:kl.naam,waarom:kl.waarom,w:mee,status:'open',akkoord:{},raakt:raakt,op:'zojuist'};
 p.akkoord[IK]=true;S.voorstellen.unshift(p);delete S.kladden[IK];gekozen=p.id;
 S.log.unshift({op:'zojuist',wat:'Ingediend: '+p.titel+' ('+mee.length+' wijzigingen)',wie:IK,rdn:p.waarom});
 document.getElementById('lintTekst').innerHTML='Ingediend. Wissel rechtsboven van persoon om te zien wat <b>Mark of Lisa</b> op hun dashboard zien.';
 melden('Ingediend. '+(Object.keys(raakt).length?Object.keys(raakt).map(vnaam).join(' en ')+' moet'+(Object.keys(raakt).length>1?'en':'')+' er nog naar kijken.':'Alles is van uzelf.'),'Sluiten',null);
 ganaar('wijzigingen');}
function voerDoor(p){
 p.w.forEach(function(x){
  if(x.k==='__thema'){var tk=null;for(var t in THEMA){if(THEMA[t].n===x.naar)tk=t;}
   S.themaVersies.unshift(v(x.naar,p.door,'zojuist',p.waarom||'Geen reden ingevuld'));S.thema=tk;S.taken=doorwerking(tk).taken;}
  else{S.niveaus[x.k]=NIV.indexOf(x.naar);versies(x.k).unshift(v(x.naar,p.door,'zojuist',p.waarom||'Geen reden ingevuld'));}});
 p.status='door';
 S.log.unshift({op:'zojuist',wat:'Doorgevoerd: '+p.titel+' — '+p.w.length+' wijzigingen in één keer',wie:IK,rdn:p.waarom});
 document.getElementById('lintTekst').innerHTML='Doorgevoerd. Kijk op het <b>Dashboard</b>: de acties van iedereen zijn meeveranderd.';
 melden('Doorgevoerd: '+p.w.length+' wijzigingen tegelijk.','Sluiten',null);alles();}
function draaiTerug(p){
 p.w.forEach(function(x){
  if(x.k==='__thema'){var tk=null;for(var t in THEMA){if(THEMA[t].n===x.van)tk=t;}
   S.themaVersies.unshift(v(x.van,IK,'zojuist','Teruggedraaid'));S.thema=tk;S.taken=doorwerking(tk).taken;}
  else{S.niveaus[x.k]=NIV.indexOf(x.van);versies(x.k).unshift(v(x.van,IK,'zojuist','Teruggedraaid'));}});
 p.status='terug';
 S.log.unshift({op:'zojuist',wat:'Teruggedraaid: '+p.titel,wie:IK,rdn:''});
 melden('Teruggedraaid. Ook dat staat in de geschiedenis.','Sluiten',null);alles();}

  b.querySelector('#kStart').addEventListener('click',startKlad);return;}
 b.innerHTML='<span class="aand"><span class="punt"></span>Klad van '+vnaam(IK)+':</span>'

 b.querySelector('#kBek').addEventListener('click',function(){gekozen='klad';ganaar('wijzigingen');});
 b.querySelector('#kDien').addEventListener('click',function(){gekozen='klad';ganaar('wijzigingen');});}

/* ---------- wijzigingen: lijst + detail ---------- */
function tekenWijzigingen(){
  var kl=klad();
  var alle=S.voorstellen.slice();
  var setjes={open:alle.filter(function(p){return p.status==='open';}),
              door:alle.filter(function(p){return p.status==='door';}),
              af:alle.filter(function(p){return p.status==='terug';}),
              alles:alle};
  var lijst=setjes[subtab]||alle;
  if(gekozen===null&&kl&&kl.w.length)gekozen='klad';
  if(gekozen===null&&lijst.length)gekozen=lijst[0].id;

  var links='<div class="kaart" style="margin-bottom:0"><div class="kk"><div><h3>Wijzigingen</h3><div class="sub">Voorstellen die uw organisatie en uitvoering raken.</div></div>'
   +'<div class="re">'+(inKlad()?'':'<button class="knop klein blauw" id="nieuwV">+ Nieuw voorstel</button>')+'</div></div>'
   +'<div class="subtabs">'
   + [['open','Openstaand',setjes.open.length],['door','Doorgevoerd',setjes.door.length],['af','Teruggedraaid',setjes.af.length],['alles','Alles',alle.length]]
     .map(function(t){return '<button data-s="'+t[0]+'" aria-selected="'+(subtab===t[0]?'true':'false')+'">'+t[1]+' <span class="n">'+t[2]+'</span></button>';}).join('')
   +'</div><div class="vlijst">'
   + (kl&&kl.w.length?'<button class="vkaart" data-id="klad" aria-current="'+(gekozen==='klad')+'"><span class="pil">Uw klad</span>'
       +'<div class="vt">'+kl.naam+'</div><div class="vm">'+kl.w.length+' wijzigingen · nog niet ingediend</div></button>':'')
   + (lijst.length?lijst.map(function(p){
        var pil={open:['open','Openstaand'],door:['goed','Doorgevoerd'],terug:['terug','Teruggedraaid']}[p.status];
        return '<button class="vkaart" data-id="'+p.id+'" aria-current="'+(gekozen===p.id)+'"><span class="pil '+pil[0]+'">'+pil[1]+'</span>'
         +'<div class="vt">'+p.titel+'</div><div class="vm">'+p.w.length+' wijzigingen · '+naam(p.door)+'</div></button>';}).join('')
      :'<div class="sub" style="padding:8px 0">Niets in deze categorie.</div>')
   +'</div></div>';

  document.getElementById('p-wijzigingen').innerHTML='<div class="tweeluik"><div>'+links+'</div><div id="detail"></div></div>';
  var el=document.getElementById('p-wijzigingen');
  Array.prototype.forEach.call(el.querySelectorAll('[data-s]'),function(b){
    b.addEventListener('click',function(){subtab=b.dataset.s;gekozen=null;tekenWijzigingen();});});
  Array.prototype.forEach.call(el.querySelectorAll('[data-id]'),function(b){
    b.addEventListener('click',function(){gekozen=b.dataset.id==='klad'?'klad':parseInt(b.dataset.id,10);tekenWijzigingen();});});
  var nv=el.querySelector('#nieuwV');
  if(nv)nv.addEventListener('click',function(){startKlad();gekozen='klad';
    melden('Klad geopend. Ga naar een scherm en pas iets aan.','Sluiten',null);});
  tekenDetail();
}

function tekenDetail(){
  var d=document.getElementById('detail'); if(!d)return;
  var kl=klad();
  if(gekozen==='klad'&&kl){
    d.innerHTML='<div class="kaart"><div class="kk"><div><span class="pil">Uw klad</span><h3 style="font-size:19px;margin-top:7px">'+kl.naam+'</h3>'
     +'<div class="sub">Alleen u ziet dit. U kunt weglopen en morgen verdergaan.</div></div></div>'
     +'<table class="acties"><thead><tr><th></th><th>Onderdeel</th><th>Van (huidig)</th><th>Naar (nieuw)</th><th>Eigenaar</th><th></th></tr></thead><tbody>'
     + kl.w.map(function(x,i){var e=eigenaarVan(x.k);
        return '<tr><td><input type="checkbox" data-w="'+i+'"'+(x.mee!==false?' checked':'')+'></td>'
         +'<td>'+dimNaam(x.k)+'</td><td class="oudw">'+x.van+'</td><td class="nieuww">'+x.naar+'</td>'
         +'<td><span class="persoon"><img class="avatar" src="'+MENSEN[e].foto+'" alt="" onerror="this.style.visibility=\'hidden\'"><span><span class="nm">'+naam(e)+'</span><span class="rl">'+(e===IK?'u zelf':'moet akkoord geven')+'</span></span></span></td>'
         +'<td><button class="knop klein" data-weg="'+i+'">Ongedaan</button></td></tr>';}).join('')
     +'</tbody></table>'
     +'<div class="waaromvak"><div class="lb">Waarom deze wijziging?</div>'
     +'<textarea id="waarom" rows="2" placeholder="Eén zin. Dit is het enige wat het portaal niet voor u kan bedenken.">'+kl.waarom+'</textarea></div>'
     +'<div class="knoppen" style="margin-top:12px"><button class="knop blauw" id="dienIn">Indienen ter goedkeuring</button><button class="knop" id="weg2">Klad weggooien</button></div></div>';
    Array.prototype.forEach.call(d.querySelectorAll('[data-w]'),function(c){
      c.addEventListener('change',function(){kl.w[parseInt(c.dataset.w,10)].mee=c.checked;});});
    Array.prototype.forEach.call(d.querySelectorAll('[data-weg]'),function(b){
      b.addEventListener('click',function(){kl.w.splice(parseInt(b.dataset.weg,10),1);alles();});});
    d.querySelector('#waarom').addEventListener('input',function(){kl.waarom=this.value;});
    d.querySelector('#dienIn').addEventListener('click',dien);
    d.querySelector('#weg2').addEventListener('click',gooiWeg);
    return;
  }
  var p=S.voorstellen.filter(function(x){return x.id===gekozen;})[0];
  if(!p){d.innerHTML='<div class="kaart"><div class="sub">Kies links een wijziging, of klik onderaan op "Wijzigingen maken".</div></div>';return;}

  var tw=p.w.filter(function(x){return x.k==='__thema';})[0];
  var imp=tw?doorwerking((function(){for(var t in THEMA){if(THEMA[t].n===tw.naar)return t;}return S.thema;})()):null;
  var lijst=Object.keys(p.raakt), ja=lijst.filter(function(w){return p.akkoord[w];}).length, klaar=ja===lijst.length;
  var pil={open:['open','Openstaand'],door:['goed','Doorgevoerd'],terug:['terug','Teruggedraaid']}[p.status];

  d.innerHTML='<div class="kaart"><div class="kk"><div><span class="pil '+pil[0]+'">'+pil[1]+'</span>'
   +'<h3 style="font-size:19px;margin-top:7px">'+p.titel+'</h3>'
   +'<div class="sub">Voorstel door '+naam(p.door)+' · '+p.op+'</div></div></div>'
   + (tw?'<div class="vn"><div><div class="lb">Van</div><div class="wd">Focusthema: '+tw.van+'</div></div>'
        +'<div><div class="lb">Naar</div><div class="wd">Focusthema: '+tw.naar+'</div></div></div>':'')
   +'<div class="waaromvak"><div class="lb">Waarom deze wijziging?</div><div>'+(p.waarom||'<i class="sub">niet ingevuld</i>')+'</div></div></div>'

   + (imp?'<div class="kaart"><div class="kk"><h3>Impact op de organisatie</h3></div><div class="impact">'
      +[['&#128101;',imp.afd.length,'Afdelingen geraakt'],['&#127919;',imp.kpi.length,'KPI\'s beïnvloed'],
        ['&#128279;',imp.proc.length,'Processen beïnvloed'],['&#128196;',imp.taken.length,'Acties beïnvloed'],
        ['&#128230;',imp.sys.length,'Systemen beïnvloed'],['&#128100;',imp.mensen.length,'Mensen betrokken']]
        .map(function(t){return '<div class="itegel"><div class="ic">'+t[0]+'</div><div class="g">'+t[1]+'</div><div class="l">'+t[2]+'</div></div>';}).join('')
      +'</div></div>':'')

   +'<div class="kaart"><div class="kk"><h3>Wat er verandert — '+p.w.length+'</h3></div>'
   +'<table class="acties"><thead><tr><th>Onderdeel</th><th>Van (huidig)</th><th>Naar (nieuw)</th><th>Eigenaar</th></tr></thead><tbody>'
   + p.w.map(function(x){var e=eigenaarVan(x.k);
      return '<tr><td>'+dimNaam(x.k)+'</td><td class="oudw">'+x.van+'</td><td class="nieuww">'+x.naar+'</td>'
       +'<td><span class="persoon"><img class="avatar" src="'+MENSEN[e].foto+'" alt="" onerror="this.style.visibility=\'hidden\'"><span><span class="nm">'+naam(e)+'</span><span class="rl">'+MENSEN[e].rol+'</span></span></span></td></tr>';}).join('')
   +'</tbody></table></div>'

   +'<div class="kaart"><div class="kk"><h3>Goedkeuring</h3><div class="re"><span class="sub">'+ja+' van '+lijst.length+'</span></div></div>'
   + (lijst.length?lijst.map(function(w){
       return '<div class="rij"><span class="persoon"><img class="avatar" src="'+MENSEN[w].foto+'" alt="" onerror="this.style.visibility=\'hidden\'"><span><span class="nm">'+naam(w)+'</span><span class="rl">'+MENSEN[w].rol+' — '+p.raakt[w]+' onderdeel'+(p.raakt[w]===1?'':'en')+' van hem of haar</span></span></span><span></span>'
        +'<span>'+(p.akkoord[w]?'<span class="pil goed">Akkoord</span>'
           :(p.status==='open'?(w===IK?'<button class="knop klein blauw" data-ok="1">Ik ga akkoord</button>':'<span class="sub">wacht op '+vnaam(w)+'</span>'):'<span class="sub">niet beoordeeld</span>'))+'</span></div>';}).join('')
      :'<div class="melding rust"><span>&#10003;</span><span>Alles is van de indiener zelf. Niemand hoeft mee te kijken.</span></div>')
   +'</div>'

   +'<div class="voetmeta">'
   +'<div class="mv"><div class="lb">Gemaakt door</div><span class="persoon"><img class="avatar" src="'+MENSEN[p.door].foto+'" alt="" onerror="this.style.visibility=\'hidden\'"><span class="nm">'+naam(p.door)+'</span></span></div>'
   +'<div class="mv"><div class="lb">Status</div><span class="pil '+pil[0]+'">'+pil[1]+'</span></div>'
   +'<div class="mv"><div class="lb">Moet goedgekeurd worden door</div>'+(lijst.length?lijst.map(vnaam).join(', '):'niemand')+'</div></div>'

   +'<div class="kaart" style="margin-top:14px"><div class="knoppen">'
   + (p.status==='open'&&p.door===IK?'<button class="knop groen" id="kDoor"'+(klaar?'':' disabled')+'>Voer wijziging door</button>':'')
   + (p.status==='door'?'<button class="knop terug" id="kTerug">Draai wijziging terug</button>':'')
   + (p.status==='open'&&p.door!==IK?'<span class="sub">'+naam(p.door)+' voert dit door zodra iedereen akkoord is.</span>':'')
   +'</div>'
   + (p.status==='open'&&p.door===IK&&!klaar?'<div class="sub" style="margin-top:9px">Zolang niet iedereen gekeken heeft, verandert er niets. Wissel rechtsboven van persoon om te zien wat zij zien.</div>':'')
   +'</div>';

  var ok=d.querySelector('[data-ok]');
  if(ok)ok.addEventListener('click',function(){p.akkoord[IK]=true;
    S.log.unshift({op:'zojuist',wat:'Akkoord op "'+p.titel+'"',wie:IK,rdn:''});alles();});
  var kd=d.querySelector('#kDoor'); if(kd)kd.addEventListener('click',function(){voerDoor(p);});
  var kt=d.querySelector('#kTerug'); if(kt)kt.addEventListener('click',function(){draaiTerug(p);});
}

/* ---------- acties ---------- */
function tekenActies(){
  var per={};
  S.taken.forEach(function(t){per[t.wie]=per[t.wie]||[];per[t.wie].push(t);});
  document.getElementById('p-acties').innerHTML=
   '<h1 class="pk">Acties</h1><p class="uitleg">Deze lijst komt uit het focusthema. Verandert dat thema, dan verandert deze lijst mee — daarom gaat zo\'n wijziging eerst langs de eigenaren.</p>'
   + Object.keys(per).map(function(w){
      return '<div class="kaart"><div class="kk"><span class="persoon"><img class="avatar" src="'+MENSEN[w].foto+'" alt="" onerror="this.style.visibility=\'hidden\'"><span><span class="nm">'+naam(w)+'</span><span class="rl">'+MENSEN[w].rol+'</span></span></span>'
       +'<div class="re"><span class="sub">'+per[w].filter(function(t){return !t.klaar;}).length+' open</span></div></div>'
       + per[w].map(function(t){return '<div class="rij"><span class="afd">'+t.afd+'</span><span'+(t.klaar?' style="color:var(--zacht);text-decoration:line-through"':'')+'>'+t.wat+'</span>'
          +(t.klaar?'<span class="pil goed">Klaar</span>':(w===IK?'<button class="knop klein" data-k2="'+S.taken.indexOf(t)+'">Afvinken</button>':'<span class="sub">open</span>'))+'</div>';}).join('')
       +'</div>';}).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-k2]'),function(b){
    b.addEventListener('click',function(){S.taken[parseInt(b.dataset.k2,10)].klaar=true;
      S.log.unshift({op:'zojuist',wat:'Actie afgevinkt',wie:IK,rdn:''});alles();});});
}

/* ---------- versies ---------- */
function tekenVersies(){
  document.getElementById('p-versies').innerHTML=
   '<h1 class="pk">Versies</h1><p class="uitleg">Alles wat er ooit veranderd is, met wie het deed en waarom. Ook het terugdraaien staat erin.</p>'
   +'<div class="kaart"><div class="kk"><h3>Per onderdeel</h3></div>'
   + DIM.map(function(d){var vs=versies(d.k);
      return '<div class="dimrij"><div><b>'+d.n+'</b><div class="slotje">eigenaar '+naam(eigenaarVan(d.k))+'</div></div>'
       +'<div class="balkje">'+[1,2,3,4,5].map(function(i){return '<span class="blok'+(i<=S.niveaus[d.k]?' aan':'')+'"></span>';}).join('')+'</div>'
       +'<div class="sub">'+NIV[S.niveaus[d.k]]+' · '+vs.length+' versie'+(vs.length===1?'':'s')+'</div></div>';}).join('')
   +'</div>'
   +'<div class="kaart"><div class="kk"><h3>Tijdlijn</h3></div><ul class="tl">'
   + S.log.map(function(g){return '<li'+(g.op==='zojuist'?' class="nw"':'')+'><div class="wn">'+g.op+' · '+naam(g.wie)+'</div><div class="wt">'+g.wat+'</div>'
      +(g.rdn?'<div class="rdn">'+g.rdn+'</div>':'')+'</li>';}).join('')+'</ul></div>';
}

/* ---------- instellingen: rechten ---------- */
function tekenInstellingen(){
  var mag=MENSEN[IK].beheerder;
  var open=S.verzoeken.filter(function(x){return !x.af;});
  document.getElementById('p-instellingen').innerHTML=
   '<h1 class="pk">Instellingen</h1><p class="uitleg">Wie mag wat wijzigen. Iedereen mag altijd zijn eigen onderdelen aanpassen; voor die van een ander geeft de beheerder rechten. Zonder recht kun je het niet eens in je klad zetten — je kunt het wel aanvragen.</p>'
   + (open.length&&mag?'<div class="kaart"><div class="kk"><h3>Openstaande verzoeken</h3></div>'
      + open.map(function(x,i){return '<div class="rij"><span class="pil">Verzoek</span><span><b>'+naam(x.wie)+'</b> wil '+dimNaam(x.k)+' kunnen wijzigen</span>'
        +'<span class="knoppen"><button class="knop klein blauw" data-geef="'+i+'">Rechten geven</button><button class="knop klein" data-weiger="'+i+'">Afwijzen</button></span></div>';}).join('')+'</div>':'')
   +'<div class="kaart"><div class="kk"><h3>Wie mag wat wijzigen</h3><div class="re"><span class="sub">'+(mag?'u bent beheerder':'alleen '+naam('arthur')+' kan dit aanpassen')+'</span></div></div>'
   +'<table class="rmatrix"><thead><tr><th>Onderdeel</th><th>Eigenaar</th>'
   + ['sanne','mark','lisa'].map(function(w){return '<th>'+vnaam(w)+'</th>';}).join('')+'</tr></thead><tbody>'
   + DIM.concat([{k:'__thema',n:'Focusthema'}]).map(function(d){
      return '<tr><td>'+d.n+'</td><td class="eigen">'+vnaam(eigenaarVan(d.k))+'</td>'
       + ['sanne','mark','lisa'].map(function(w){
          var eigen=MENSEN[w].bezit.indexOf(d.k)>=0;
          if(eigen)return '<td><span class="eigen">eigenaar</span></td>';
          var aan=(S.rechten[w]||[]).indexOf(d.k)>=0;
          return '<td><label class="vink"><input type="checkbox" data-r="'+w+'|'+d.k+'"'+(aan?' checked':'')+(mag?'':' disabled')+'>mag wijzigen</label></td>';}).join('')
       +'</tr>';}).join('')
   +'</tbody></table></div>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-r]'),function(c){
    c.addEventListener('change',function(){var p=c.dataset.r.split('|'),w=p[0],k=p[1];
      S.rechten[w]=S.rechten[w]||[];
      if(c.checked){if(S.rechten[w].indexOf(k)<0)S.rechten[w].push(k);
        S.log.unshift({op:'zojuist',wat:naam(w)+' mag voortaan '+dimNaam(k)+' wijzigen',wie:IK,rdn:'Recht gegeven door de beheerder'});}
      else{S.rechten[w]=S.rechten[w].filter(function(x){return x!==k;});
        S.log.unshift({op:'zojuist',wat:naam(w)+' mag '+dimNaam(k)+' niet meer wijzigen',wie:IK,rdn:''});}
      alles();});});
  Array.prototype.forEach.call(document.querySelectorAll('#p-instellingen [data-geef]'),function(b){
    b.addEventListener('click',function(){geefRecht(parseInt(b.dataset.geef,10),true);});});
  Array.prototype.forEach.call(document.querySelectorAll('#p-instellingen [data-weiger]'),function(b){
    b.addEventListener('click',function(){geefRecht(parseInt(b.dataset.weiger,10),false);});});
}

/* ---------- overige tabbladen: onveranderd ---------- */
function tekenRest(){
  var titels={omgeving:'Omgeving',vraagstukken:'Vraagstukken',strategie:'Strategie',modellen:'Modellen',canvas:'Canvas',bronnen:'Bronnen'};
  var t=titels[actief]||'Onderdeel';
  var isNiv=(actief==='omgeving');
  document.getElementById('p-rest').innerHTML=
   '<h1 class="pk">'+t+'</h1>'
   + (isNiv
     ? '<p class="uitleg">Dit scherm bestond al. Het enige verschil: als u in een klad werkt, kunt u hier gewoon aanpassen wat u mag aanpassen. De blauwe randjes zijn uw eigen, nog niet ingediende wijzigingen.</p><div class="kaart">'
       + DIM.map(function(d){
          var n=toonNiveau(d.k),kw=kladW(d.k),slot=opSlot(d.k),mag=magWijzigen(IK,d.k);
          return '<div class="dimrij'+(kw!==null?' klad':'')+'"><div><b>'+d.n+'</b>'
           +'<div class="slotje">'+(mag?'u mag dit wijzigen':'van '+naam(eigenaarVan(d.k))+' — u mag alleen kijken')+'</div></div>'
           +'<div class="balkje">'+[1,2,3,4,5].map(function(i){return '<span class="blok'+(i<=n?(kw!==null?' kladaan':' aan'):'')+'"></span>';}).join('')+'</div>'
           +'<div>'+(slot?'<span class="slotje">ligt bij de eigenaren</span>'
             :(mag?'<select class="niv" data-k="'+d.k+'"'+(inKlad()?'':' disabled')+'>'
                 +[1,2,3,4,5].map(function(i){return '<option value="'+i+'"'+(i===n?' selected':'')+'>'+i+' — '+NIV[i]+'</option>';}).join('')+'</select>'
                 +(kw!==null?'<div class="was">was <s>'+NIV[S.niveaus[d.k]]+'</s></div>':'')
               :'<button class="knop klein" data-vraag="'+d.k+'">Vraag rechten aan</button>'))
           +'</div></div>';}).join('')
       + (inKlad()?'':'<div class="melding rust"><span>&#9998;</span><span>Klik onderaan op "Wijzigingen maken" om hier iets aan te passen.</span></div>')
       +'</div>'
     : '<div class="kaart"><div class="melding rust"><span>&#9432;</span><span>Dit deel van het portaal blijft precies zoals het nu is. De wijzigingsmodule is eromheen gebouwd, niet erin — alles wat u hier gewend bent verandert niet.</span></div></div>');
  Array.prototype.forEach.call(document.querySelectorAll('#p-rest .niv'),function(s){
    s.addEventListener('change',function(){zetInKlad(s.dataset.k,NIV[parseInt(s.value,10)]);});});
  Array.prototype.forEach.call(document.querySelectorAll('#p-rest [data-vraag]'),function(b){
    b.addEventListener('click',function(){vraagRecht(b.dataset.vraag);});});
}

/* ---------- toast ---------- */
var toast=document.getElementById('toast'),tt=null;
function melden(tekst,knop,actie){document.getElementById('toastTekst').textContent=tekst;
 var k=document.getElementById('toastKnop');k.textContent=knop;
 k.onclick=function(){if(actie)actie();toast.classList.remove('aan');};
 toast.classList.add('aan');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('aan');},8000);}
document.getElementById('knopReset').addEventListener('click',function(){
 S=JSON.parse(JSON.stringify(START));IK='sanne';gekozen=null;subtab='open';
 document.getElementById('lintTekst').innerHTML='Begin op het <b>Dashboard</b>: daar staat wat er voor u klaarligt. Klik daarna onderaan op "Wijzigingen maken".';
 ganaar('dashboard');});
ganaar('dashboard');
</script>
</body>
