<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Evidence-first Compliance Command Center voor EU AI Act, NIS2/Cyberbeveiligingswet, data, privacy, risico, remediation en audit.">
<title>Compliance Command Center · Bedrijfsgeheugen</title>
<link rel="canonical" href="https://www.bedrijfsgeheugen.nl/portal-next/compliance.html">
<link rel="icon" href="https://www.bedrijfsgeheugen.nl/favicon.png">
<link rel="stylesheet" href="https://www.bedrijfsgeheugen.nl/portal-next/compliance-command-center.css">
<style>
.cc-contextbar{max-width:1560px;margin:0 auto;padding:18px 28px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 13px/1.4 Inter,system-ui,sans-serif}.cc-contextbar nav{display:flex;gap:7px;flex-wrap:wrap}.cc-contextbar a{color:#173f35;text-decoration:none;border:1px solid #dce3e0;background:#fff;border-radius:999px;padding:8px 11px}.cc-contextbar strong{display:block}.cc-contextbar small{display:block;color:#65716d;font-weight:500}.cc-trust-context{max-width:1504px;margin:0 auto 10px;padding:0 28px;display:flex;gap:7px;flex-wrap:wrap;font:700 11px/1.4 Inter,system-ui,sans-serif}.cc-trust-context a{color:#44514c;text-decoration:none;border-bottom:1px solid #b9c5c0;padding:7px 2px}@media(max-width:700px){.cc-contextbar{padding:12px 14px 0;align-items:flex-start;flex-direction:column}.cc-trust-context{padding:0 14px}}
</style>
</head>
<body>
<header class="cc-contextbar">
  <div><strong>Bedrijfsgeheugen · Business OS · Trust & Governance</strong><small id="ccCustomerContext">Compliance-context laden…</small></div>
  <nav aria-label="Portaalcontext"><a id="ccBackPortal" href="https://www.bedrijfsgeheugen.nl/klantportaal">← Portaal</a><a href="https://www.bedrijfsgeheugen.nl/portal-next/">Business OS</a></nav>
</header>
<nav class="cc-trust-context" aria-label="Gerelateerde trust informatie">
  <a href="https://www.bedrijfsgeheugen.nl/ai-act">EU AI Act</a>
  <a href="https://www.bedrijfsgeheugen.nl/ai-governance">AI Governance</a>
  <a href="https://www.bedrijfsgeheugen.nl/data-soevereiniteit">Data-soevereiniteit</a>
  <a href="https://www.bedrijfsgeheugen.nl/privacy">Privacy</a>
  <a href="https://www.bedrijfsgeheugen.nl/due-diligence">Due diligence</a>
</nav>
<bg-compliance-command-center scope="customer"></bg-compliance-command-center>
<script>
(function(){
  const params=new URLSearchParams(window.location.search);const klant=params.get('klant');
  const context=document.getElementById('ccCustomerContext');const back=document.getElementById('ccBackPortal');
  if(klant){context.textContent='Klantcontext: '+klant+' · status uitsluitend op basis van beschikbare invoer en evidence';back.href='https://www.bedrijfsgeheugen.nl/klantportaal?klant='+encodeURIComponent(klant);}
  else context.textContent='Geen specifieke klantcontext · kies Bedrijfsgeheugen of vul klantinformatie/evidence in';
  window.BG_COMPLIANCE_CONTEXT={customerSlug:klant||null};
})();
</script>
<script type="module" src="https://www.bedrijfsgeheugen.nl/portal-next/compliance-command-center.js"></script>
</body>
</html>
