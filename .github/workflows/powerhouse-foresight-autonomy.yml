name: Powerhouse Foresight Autonomy

on:
  schedule:
    - cron: '12 5 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'config/powerhouse-foresight-autonomy.json'
      - 'scripts/brain/foresight-autonomy.mjs'
      - 'portal-v2/foresight-intelligence.js'
      - 'tests/powerhouse-foresight-autonomy.test.mjs'
      - '.github/workflows/powerhouse-foresight-autonomy.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: powerhouse-foresight-autonomy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Chat learning preflight
        run: node scripts/brain/chat-learning-preflight.mjs
      - name: Verify foresight autonomy contract
        run: node --test tests/powerhouse-foresight-autonomy.test.mjs
      - name: Verify technology discovery remains benchmark-first
        run: |
          grep -q "benchmark_required: true" scripts/brain/continuous-improvement/technology-discovery.mjs
          grep -q "auto_adopt: false" scripts/brain/continuous-improvement/technology-discovery.mjs
      - name: Verify canonical security and delivery controls
        run: |
          test -f .github/workflows/shared-agent-memory-tests.yml
          test -f .github/workflows/engineering-os-learning.yml
          test -f config/powerhouse-daily-self-evolution.json
      - name: Build foresight packet
        run: node scripts/brain/foresight-autonomy.mjs > /tmp/foresight.json
