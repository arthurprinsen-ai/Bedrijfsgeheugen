name: Build repository writeback hardening candidate

on:
  push:
    branches: [automation/repo-writeback-hardening-green]
    paths: ['.github/workflows/repo-writeback-hardening-builder.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply hardening transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exact block once, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1. Every workflow that can write main shares one non-cancelling writer lock.
          replace_exact(
              '.github/workflows/paginacontrole.yml',
              '''# PR-controles mogen niet meer door een gelijktijdige main-run worden geannuleerd.\n# Runs voor dezelfde PR/ref vervangen elkaar nog steeds om verspilling te voorkomen.\nconcurrency:\n  group: paginacontrole-${{ github.event.pull_request.number || github.ref }}\n  cancel-in-progress: true''',
              '''# GEDEELD SCHRIJVERSLOT. Deze workflow kan bronherstel en afgeleide status naar\n# main schrijven. Daarom mag hij niet parallel lopen met andere repo-schrijvers en\n# mag een actieve writeback nooit halverwege door een nieuwere run worden geannuleerd.\nconcurrency:\n  group: repo-schrijven\n  cancel-in-progress: false''',
          )

          # 2. Content agents may edit content but may never own repository mutation.
          replace_exact(
              '.github/workflows/weekblog.yml',
              'claude_args: "--model claude-sonnet-5 --max-turns 60 --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch"',
              'claude_args: "--model claude-sonnet-5 --max-turns 60 --allowedTools Read,Write,Edit,Glob,Grep,WebSearch"',
          )
          replace_exact(
              '.github/workflows/weekblog.yml',
              '      - name: Artikel schrijven en publiceren',
              '      - name: Artikel schrijven',
          )
          replace_exact(
              '.github/workflows/weekblog.yml',
              '''            PUBLICEREN: git add -A, commit met bericht "blog: ${{ steps.kalender.outputs.slug }}"\n            en push naar main.\n            Wordt de push geweigerd omdat er ondertussen een andere commit binnenkwam,\n            doe dan: git pull --rebase origin main en push opnieuw. Hooguit drie pogingen.\n            Meld het in je samenvatting als het na drie keer nog niet lukt. Forceer nooit\n            met --force: dan gooi je werk van een andere workflow weg.''',
              '''            PUBLICATIEGRENS\n            Wijzig uitsluitend de inhoudelijke bestanden die hierboven zijn toegestaan.\n            Voer zelf geen versiebeheer- of publicatiehandelingen uit. Een deterministische\n            vervolgstap controleert exact welke bestanden zijn gewijzigd en publiceert pas\n            daarna. Meld in je samenvatting alleen welke inhoud je hebt aangepast.''',
          )

          week_insert = '''\n      - name: Deterministic publication contract checks\n        if: steps.kalender.outputs.gevonden == 'true'\n        env:\n          SLUG: ${{ steps.kalender.outputs.slug }}\n          FOCUS_KEYWORD: ${{ steps.kalender.outputs.zoekwoord }}\n        run: python3 scripts/ci/validate_blog_writeback.py publish "$SLUG" "$FOCUS_KEYWORD"\n\n      - name: Commit and push validated changes\n        if: steps.kalender.outputs.gevonden == 'true'\n        env:\n          COMMIT_MESSAGE: 'blog: ${{ steps.kalender.outputs.slug }}'\n        run: bash scripts/ci/commit_validated_main.sh "$COMMIT_MESSAGE"\n\n'''
          replace_exact(
              '.github/workflows/weekblog.yml',
              '\n      - name: Notion bijwerken\n',
              week_insert + '      - name: Notion bijwerken\n',
          )

          replace_exact(
              '.github/workflows/blog-bijwerken.yml',
              'claude_args: "--model claude-sonnet-5 --max-turns 40 --allowedTools Bash,Read,Write,Edit,Glob,Grep"',
              'claude_args: "--model claude-sonnet-5 --max-turns 40 --allowedTools Read,Write,Edit,Glob,Grep"',
          )
          replace_exact(
              '.github/workflows/blog-bijwerken.yml',
              '''            PUBLICEREN: git add -A, commit met bericht\n            "blog bijgewerkt: ${{ steps.kalender.outputs.slug }}" en push naar main.\n            Wordt de push geweigerd omdat er ondertussen een andere commit binnenkwam,\n            doe dan: git pull --rebase origin main en push opnieuw. Hooguit drie pogingen.\n            Meld het in je samenvatting als het na drie keer nog niet lukt. Forceer nooit\n            met --force: dan gooi je werk van een andere workflow weg.\n            Meld in je samenvatting welke regels je hebt gewijzigd en wat je hebt laten staan.''',
              '''            PUBLICATIEGRENS\n            Wijzig uitsluitend het doelartikel, sitemap.xml en hooguit de relevante\n            pijlerpagina die hierboven is toegestaan. Voer zelf geen versiebeheer- of\n            publicatiehandelingen uit. Een deterministische vervolgstap controleert exact\n            welke bestanden zijn gewijzigd en publiceert pas daarna. Meld in je samenvatting\n            welke regels je hebt gewijzigd en wat je hebt laten staan.''',
          )

          update_insert = '''\n      - name: Deterministic update contract checks\n        if: steps.kalender.outputs.gevonden == 'true'\n        env:\n          SLUG: ${{ steps.kalender.outputs.slug }}\n          FOCUS_KEYWORD: ${{ steps.kalender.outputs.zoekwoord }}\n        run: python3 scripts/ci/validate_blog_writeback.py update "$SLUG" "$FOCUS_KEYWORD"\n\n      - name: Commit and push validated changes\n        if: steps.kalender.outputs.gevonden == 'true'\n        env:\n          COMMIT_MESSAGE: 'blog bijgewerkt: ${{ steps.kalender.outputs.slug }}'\n        run: bash scripts/ci/commit_validated_main.sh "$COMMIT_MESSAGE"\n\n'''
          replace_exact(
              '.github/workflows/blog-bijwerken.yml',
              '\n      - name: Notion op Goedgekeurd zetten\n',
              update_insert + '      - name: Notion op Goedgekeurd zetten\n',
          )

          # 3. Shared validator: allowlist, no deletion/rename, semantic article checks, manifest.
          Path('scripts/ci').mkdir(parents=True, exist_ok=True)
          Path('scripts/ci/validate_blog_writeback.py').write_text(r'''#!/usr/bin/env python3
import json
import re
import subprocess
import sys
from pathlib import Path

MANIFEST = Path('/tmp/validated-writeback-files.txt')

def git(*args):
    return subprocess.check_output(['git', *args], text=True).splitlines()

def fail(message):
    raise SystemExit(f'WRITEBACK_CONTRACT_VIOLATION: {message}')

def changed_paths():
    tracked = git('diff', '--name-only')
    untracked = git('ls-files', '--others', '--exclude-standard')
    return sorted(set(p for p in tracked + untracked if p))

def validate_article(path, slug, focus_keyword):
    text = Path(path).read_text(encoding='utf-8')
    if len(re.findall(r'<h1(?:\\s|>)', text, re.I)) != 1:
        fail(f'{path}: exact één h1 vereist')
    canonical = re.search(r'<link\\s+rel=["\\']canonical["\\']\\s+href=["\\']([^"\\']+)["\\']', text, re.I)
    expected = f'https://www.bedrijfsgeheugen.nl/blog/{slug}/'
    if not canonical or canonical.group(1) != expected or '.html' in canonical.group(1):
        fail(f'{path}: canonical moet exact {expected} zijn')
    blocks = re.findall(r'<script\\s+type=["\\']application/ld\\+json["\\']>(.*?)</script>', text, re.I | re.S)
    if not blocks:
        fail(f'{path}: JSON-LD ontbreekt')
    for block in blocks:
        try:
            json.loads(block)
        except json.JSONDecodeError as exc:
            fail(f'{path}: ongeldige JSON-LD: {exc}')
    if focus_keyword:
        marker = re.search(r'<meta\\s+name=["\\']bg-zoekwoord["\\']\\s+content=["\\']([^"\\']*)["\\']', text, re.I)
        if not marker or marker.group(1).strip() != focus_keyword.strip():
            fail(f'{path}: bg-zoekwoord wijkt af van de kalender')
    if re.search(r'href=["\\']/[^"\\']+\\.html(?:[?#][^"\\']*)?["\\']', text, re.I):
        fail(f'{path}: interne .html-link gevonden')

def main():
    if len(sys.argv) < 3 or sys.argv[1] not in {'publish', 'update'}:
        fail('gebruik: validate_blog_writeback.py publish|update SLUG [FOCUS_KEYWORD]')
    mode, slug = sys.argv[1], sys.argv[2]
    focus = sys.argv[3] if len(sys.argv) > 3 else ''
    target = f'blog/{slug}/index.html'
    changed = changed_paths()
    if not changed:
        fail('geen wijzigingen gevonden')

    status = git('diff', '--name-status')
    if any(line.startswith(('D', 'R', 'C')) for line in status):
        fail(f'verwijderen/hernoemen/kopiëren niet toegestaan: {status}')

    if mode == 'publish':
        required = {target, 'blog/index.html', 'blog/rss.xml', 'sitemap.xml'}
        missing = sorted(required - set(changed))
        if missing:
            fail(f'verplichte publicatiebestanden ontbreken: {missing}')
        extras = [p for p in changed if p not in required]
    else:
        if target not in changed:
            fail(f'doelartikel niet gewijzigd: {target}')
        allowed_base = {target, 'sitemap.xml'}
        extras = [p for p in changed if p not in allowed_base]

    article_extra = [p for p in extras if re.fullmatch(r'blog/[a-z0-9-]+/index\\.html', p) and p != target]
    unexpected = [p for p in extras if p not in article_extra]
    if unexpected:
        fail(f'onverwachte bestanden gewijzigd: {unexpected}')
    if len(article_extra) > 1:
        fail(f'hooguit één pijler/backlink-artikel toegestaan: {article_extra}')

    validate_article(target, slug, focus)
    MANIFEST.write_text(''.join(f'{p}\\n' for p in changed), encoding='utf-8')
    print('WRITEBACK_CONTRACT_OK', mode, changed)

if __name__ == '__main__':
    main()
''', encoding='utf-8')

          # 4. Shared publisher: manifest must still equal worktree, exact staging, bounded rebase, no force.
          Path('scripts/ci/commit_validated_main.sh').write_text(r'''#!/usr/bin/env bash
set -euo pipefail

manifest=/tmp/validated-writeback-files.txt
message=${1:-}
if [[ -z "$message" || ! -s "$manifest" ]]; then
  echo "::error::Validated manifest of commitbericht ontbreekt"
  exit 1
fi

mapfile -t expected < <(sort -u "$manifest")
mapfile -t actual < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sed '/^$/d' | sort -u)
if [[ "${expected[*]}" != "${actual[*]}" ]]; then
  echo "::error::Worktree wijzigde na validatie; publication fail-closed"
  printf 'expected: %s\\n' "${expected[*]}"
  printf 'actual:   %s\\n' "${actual[*]}"
  exit 1
fi

git config user.name "Bedrijfsgeheugen Publisher"
git config user.email "actions@users.noreply.github.com"
for file in "${expected[@]}"; do
  git add -- "$file"
done

mapfile -t staged < <(git diff --cached --name-only | sort -u)
if [[ "${expected[*]}" != "${staged[*]}" ]]; then
  echo "::error::Staged set wijkt af van validated manifest"
  exit 1
fi

git commit -m "$message"
for attempt in 1 2 3; do
  if git push origin HEAD:main; then
    echo "WRITEBACK_PUBLISHED attempt=$attempt"
    exit 0
  fi
  echo "Push geweigerd; rebase op actuele main, poging $attempt/3"
  if ! git pull --rebase origin main; then
    git rebase --abort || true
    echo "::error::Rebaseconflict; fail-closed zonder force push"
    exit 1
  fi
done

echo "::error::Push faalde na drie begrensde pogingen"
exit 1
''', encoding='utf-8')

          # 5. Repository-wide regression contract, including every currently known main writer.
          Path('tests/repo-writeback-safety.test.mjs').write_text(r'''import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';
import test from 'node:test';

const writerWorkflows = [
  '.github/workflows/paginacontrole.yml',
  '.github/workflows/seo-controle.yml',
  '.github/workflows/approved-central-blog.yml',
  '.github/workflows/weekblog.yml',
  '.github/workflows/blog-bijwerken.yml',
];
const contents = Object.fromEntries(await Promise.all(writerWorkflows.map(async (path) => [path, await readFile(path, 'utf8')])));
const validator = await readFile('scripts/ci/validate_blog_writeback.py', 'utf8');
const publisher = await readFile('scripts/ci/commit_validated_main.sh', 'utf8');

test('all known main-writing workflows share one non-cancelling repository writer lock', () => {
  for (const [path, workflow] of Object.entries(contents)) {
    assert.match(workflow, /concurrency:\\s*[\\s\\S]*?group:\\s*repo-schrijven\\s*[\\s\\S]*?cancel-in-progress:\\s*false/, `${path} must use repo-schrijven without cancellation`);
  }
});

test('AI content prompts cannot own repository mutation', () => {
  for (const path of ['.github/workflows/weekblog.yml', '.github/workflows/blog-bijwerken.yml']) {
    const workflow = contents[path];
    const start = workflow.indexOf('uses: anthropics/claude-code-action@v1');
    const end = workflow.indexOf('\\n      - name:', start);
    const block = workflow.slice(start, end > start ? end : workflow.length);
    assert.doesNotMatch(block, /--allowedTools[^\\n]*\\bBash\\b/, `${path} content agent may not receive Bash`);
    assert.doesNotMatch(block, /\\bgit\\s+(?:add|commit|pull|push|reset|checkout)\\b/i, `${path} agent prompt may not control git mutation`);
  }
});

test('content workflows validate then publish through the shared deterministic primitive', () => {
  const week = contents['.github/workflows/weekblog.yml'];
  const update = contents['.github/workflows/blog-bijwerken.yml'];
  assert.match(week, /name: Deterministic publication contract checks/);
  assert.match(update, /name: Deterministic update contract checks/);
  for (const workflow of [week, update]) {
    assert.match(workflow, /scripts\\/ci\\/validate_blog_writeback\\.py/);
    assert.match(workflow, /name: Commit and push validated changes/);
    assert.match(workflow, /scripts\\/ci\\/commit_validated_main\\.sh/);
    assert.doesNotMatch(workflow, /git add -A/);
    assert.doesNotMatch(workflow, /git push --force|git push -f/);
  }
});

test('shared validator fail-closes on unexpected change sets and emits an exact manifest', () => {
  assert.match(validator, /git', 'diff', '--name-only/);
  assert.match(validator, /git', 'ls-files', '--others', '--exclude-standard/);
  assert.match(validator, /unexpected/);
  assert.match(validator, /len\(article_extra\) > 1/);
  assert.match(validator, /MANIFEST\.write_text/);
  assert.match(validator, /WRITEBACK_CONTRACT_OK/);
});

test('shared publisher stages only validated paths, retries boundedly and never force-pushes', () => {
  assert.match(publisher, /git add -- "\\$file"/);
  assert.match(publisher, /git diff --cached --name-only/);
  assert.match(publisher, /for attempt in 1 2 3/);
  assert.match(publisher, /git pull --rebase origin main/);
  assert.match(publisher, /git rebase --abort/);
  assert.doesNotMatch(publisher, /git push --force|git push -f/);
});
''', encoding='utf-8')

          # 6. Make the invariant part of the permanent shared-agent gate.
          tests = Path('.github/workflows/shared-agent-memory-tests.yml')
          text = tests.read_text(encoding='utf-8')
          needle = 'tests/paginacontrole-concurrent-push.test.mjs'
          if 'tests/repo-writeback-safety.test.mjs' not in text:
              if needle not in text:
                  raise SystemExit('shared test insertion anchor missing')
              text = text.replace(needle, needle + ' tests/repo-writeback-safety.test.mjs', 1)
              tests.write_text(text, encoding='utf-8')

          # Builder is disposable and must never survive into the candidate.
          Path('.github/workflows/repo-writeback-hardening-builder.yml').unlink()
          PY

      - name: Self-check transformed candidate
        run: |
          set -euo pipefail
          node --test tests/repo-writeback-safety.test.mjs tests/paginacontrole-concurrent-push.test.mjs

      - name: Commit candidate
        run: |
          set -euo pipefail
          git config user.name "Bedrijfsgeheugen Hardening"
          git config user.email "actions@users.noreply.github.com"
          git add -- .github/workflows/paginacontrole.yml .github/workflows/weekblog.yml .github/workflows/blog-bijwerken.yml .github/workflows/shared-agent-memory-tests.yml scripts/ci/validate_blog_writeback.py scripts/ci/commit_validated_main.sh tests/repo-writeback-safety.test.mjs .github/workflows/repo-writeback-hardening-builder.yml
          git commit -m "fix: enforce deterministic repository writebacks"
          git push origin HEAD:automation/repo-writeback-hardening-green
