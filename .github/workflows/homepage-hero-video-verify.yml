name: Homepage Hero Video Verify
on:
  push:
    branches: [main, automation/openart-hero-homepage-integration]
    paths: ['index.html','assets/openart-hero-iphone-safe-v1.mp4','assets/openart-hero-production.json','tests/homepage-hero-video.test.mjs','.github/workflows/homepage-hero-video-verify.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/homepage-hero-video.test.mjs
