name: Learning Contract Delivery Classifier Tests

on:
  push:
    branches:
      - 'automation/classify-learning-contract-tests-v2-20260830'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-contract-classifier-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/brain-learning-contract-delivery-classification.test.mjs
