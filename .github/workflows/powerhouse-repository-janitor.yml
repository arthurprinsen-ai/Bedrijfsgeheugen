name: Powerhouse Repository Janitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run emits evidence only; apply-safe closes/removes/cancels only deterministic safe debris'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply-safe
          - provider-ghost-only

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: powerhouse-repository-janitor
  cancel-in-progress: false

jobs:
  janitor:
    # GitHub 2026 cache-token least privilege: this privileged Janitor never uses Actions caches.
    cache-mode: none
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Classify repository delivery hygiene
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          mode="${REQUESTED_MODE:-dry-run}"
          if [ "$EVENT_NAME" = schedule ]; then mode=apply-safe; fi
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" | jq 'add' > .artifacts/open-prs.json
          MODE="$mode" node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, writeFile } from 'node:fs/promises';
          import { parseDeliveryMetadata } from './tools/delivery/delivery-hygiene.mjs';
          import { planRepositoryCleanup } from './tools/delivery/repository-janitor.mjs';
          const policy=JSON.parse(await readFile('config/powerhouse-delivery-hygiene-v1.json','utf8'));
          const raw=JSON.parse(await readFile('.artifacts/open-prs.json','utf8'));
          const ghJson=path=>JSON.parse(execFileSync('gh',['api',path],{encoding:'utf8'}));
          const candidates=[];
          for (const pr of raw) {
            let uniqueCommits=true;
            let compareEvidence={status:'UNPROVEN'};
            try {
              const compare=ghJson(`repos/${process.env.GITHUB_REPOSITORY}/compare/${process.env.GITHUB_SHA}...${pr.head.sha}`);
              uniqueCommits=Number(compare.ahead_by || 0) > 0;
              compareEvidence={status:compare.status,ahead_by:Number(compare.ahead_by||0),behind_by:Number(compare.behind_by||0),total_commits:Number(compare.total_commits||0)};
            } catch (error) {
              compareEvidence={status:'UNPROVEN',error:String(error?.message||error)};
            }
            candidates.push({
              number:pr.number,
              state:pr.state,
              title:pr.title,
              body:pr.body||'',
              baseSha:parseDeliveryMetadata(pr.body||'').baseSha || pr.base?.sha || '',
              headSha:pr.head?.sha||'',
              uniqueCommits,
              compareEvidence,
            });
          }
          const plan=planRepositoryCleanup({candidates,policy,mode:process.env.MODE||'dry-run'});
          const evidence={
            observed_at:new Date().toISOString(),
            repository:process.env.GITHUB_REPOSITORY,
            main_epoch_sha:process.env.GITHUB_SHA,
            open_pr_count:candidates.length,
            candidates:candidates.map(({number,headSha,uniqueCommits,compareEvidence})=>({number,headSha,uniqueCommits,compareEvidence})),
            ...plan,
          };
          await writeFile('.artifacts/powerhouse-repository-janitor.json',`${JSON.stringify(evidence,null,2)}\n`);
          console.log(JSON.stringify(evidence,null,2));
          NODE
      - name: Advise owner-safe current-main reconstruction from Janitor snapshot
        if: always()
        continue-on-error: true
        run: |
          node --input-type=module - <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {planCurrentMainReconstruction} from './tools/delivery/current-main-reconstruction.mjs';
          const snapshot=JSON.parse(await readFile('.artifacts/powerhouse-repository-janitor.json','utf8'));
          const raw=JSON.parse(await readFile('.artifacts/open-prs.json','utf8'));
          const indexed=new Map(snapshot.candidates.map(p=>[p.number,p]));
          const pulls=raw.map(pr=>{
            const evidence=indexed.get(pr.number)?.compareEvidence||{};
            const body=pr.body||'';
            const lease=/^Writer-Lease-Owner:\s*\S+/m.test(body) && !/^Writer-Lease-State:\s*(?:RETIRED|CLOSED)/m.test(body);
            return {number:pr.number,behind_by:evidence.status==='UNPROVEN'?null:evidence.behind_by,
              sameRepository:pr.head?.repo?.full_name===process.env.GITHUB_REPOSITORY,
              optedIn:(pr.labels||[]).some(label=>label.name==='autonomous-sync'),
              writerLeaseOwned:lease,
              draft:pr.draft===true,
              changedFiles:[]};
          });
          const plan=planCurrentMainReconstruction({pulls,mainSha:snapshot.main_epoch_sha});
          await writeFile('.artifacts/powerhouse-current-main-reconstruction.json',JSON.stringify({source:'repository-janitor',mainSha:snapshot.main_epoch_sha,advisoryOnly:true,plan},null,2)+'\n');
          console.log(JSON.stringify({advisoryOnly:true,plans:plan.length,ownerHandoffs:plan.filter(p=>p.action==='OWNER_HANDOFF').length}));
          NODE
      - name: Diagnose read-only merge freshness from existing Janitor snapshot
        if: always()
        continue-on-error: true
        run: node tools/delivery/ci-merge-freshness.mjs
      - name: Apply deterministic safe PR cleanup
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'apply-safe') || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A successor PR is necessarily newer than its predecessor. Apply cleanup oldest-first so
          # a transitive chain A -> B -> C never closes B before A has validated B as its successor.
          jq -c '[.actions[] | select(.perform == true)] | sort_by(.prNumber)[]' .artifacts/powerhouse-repository-janitor.json | while read -r action; do
            pr="$(jq -r '.prNumber' <<<"$action")"
            reason="$(jq -r '.reason' <<<"$action")"
            successor="$(jq -r '.successorNumber // empty' <<<"$action")"
            current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
            [ "$(jq -r '.state' <<<"$current")" = open ] || continue
            current_head="$(jq -r '.head.sha' <<<"$current")"
            planned_head="$(jq -r --argjson pr "$pr" '.candidates[] | select(.number == $pr) | .headSha' .artifacts/powerhouse-repository-janitor.json)"
            [ "$current_head" = "$planned_head" ] || { echo "::error::JANITOR_HEAD_DRIFT:#${pr}:${planned_head}:${current_head}"; exit 78; }
            if [ "$reason" = ALREADY_CONTAINED_IN_MAIN ]; then
              ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${current_head}" --jq '.ahead_by')"
              [ "$ahead" = 0 ] || { echo "::error::JANITOR_MAIN_CONTAINMENT_DRIFT:#${pr}:ahead_by=${ahead}"; exit 78; }
            fi
            if [ -n "$successor" ]; then
              successor_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${successor}")"
              [ "$(jq -r '.state' <<<"$successor_state")" = open ] || { echo "::error::Successor #${successor} is no longer open"; exit 78; }
            fi
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f state=closed >/dev/null
            printf 'closed_pr=%s reason=%s successor=%s\n' "$pr" "$reason" "${successor:-none}"
          done
      - name: Reconcile stale Actions and merged branch debris
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'apply-safe') || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" | jq 'add' > .artifacts/open-prs-after.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&sort=updated&direction=desc&per_page=100" > .artifacts/closed-prs-recent.json
          : > .artifacts/janitor-runtime-actions.ndjson

          # Active TERMINAL_DELIVERY lease may not remain closed without merge.
          jq -c '.[] | select((.merged_at == null) and ((.body // "") | contains("Writer-Lease-State: TERMINAL_DELIVERY")))' .artifacts/closed-prs-recent.json | while read -r closed_pr; do
            pr="$(jq -r '.number' <<<"$closed_pr")"
            body="$(jq -r '.body // ""' <<<"$closed_pr")"
            obligation="$(printf '%s\n' "$body" | sed -n 's/^Obligation-ID:[[:space:]]*//p' | head -n1)"
            [ -n "$obligation" ] || { echo "::error::TERMINAL_LEASE_CLOSED_WITHOUT_OBLIGATION:#${pr}"; exit 78; }

            # Only non-retired open PRs can be active successors. Retired PRs may stay visible
            # for provenance but must never create a false multi-writer ambiguity.
            successor_count="$(jq -r --arg obligation "$obligation" '[.[] |
              select(.state=="open") |
              select((.body // "") | contains("Obligation-ID: " + $obligation)) |
              select((((.title // "") | startswith("RETIRED")) | not)) |
              select((((.body // "") | contains("Retirement-State: RETIRED_DO_NOT_MERGE")) | not)) |
              select((((.body // "") | contains("\nRETIRED:")) | not))
            ] | length' .artifacts/open-prs-after.json)"
            merged_successor_count="$(jq -r --arg obligation "$obligation" --argjson pr "$pr" '[.[] |
              select(.number != $pr) |
              select(.merged_at != null) |
              select((.body // "") | contains("Obligation-ID: " + $obligation))
            ] | length' .artifacts/closed-prs-recent.json)"
            if [ "$successor_count" -eq 0 ]; then
              if [ "$merged_successor_count" -gt 0 ]; then
                jq -cn --arg type TERMINAL_LEASE_SATISFIED_BY_MERGED_SUCCESSOR --argjson pr "$pr" --arg obligation "$obligation" --argjson merged_successors "$merged_successor_count" '{type:$type,pr_number:$pr,obligation_id:$obligation,merged_successor_count:$merged_successors}' >> .artifacts/janitor-runtime-actions.ndjson
              else
                current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
                [ "$(jq -r '.state' <<<"$current")" = closed ] || continue
                [ "$(jq -r '.merged' <<<"$current")" = false ] || continue
                gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f state=open >/dev/null
                jq -cn --arg type AUTO_REOPEN_TERMINAL_LEASE --argjson pr "$pr" --arg obligation "$obligation" '{type:$type,pr_number:$pr,obligation_id:$obligation,reason:"TERMINAL_DELIVERY_CLOSED_UNMERGED_NO_SUCCESSOR"}' >> .artifacts/janitor-runtime-actions.ndjson
              fi
            elif [ "$successor_count" -eq 1 ]; then
              successor="$(jq -r --arg obligation "$obligation" '[.[] |
                select(.state=="open") |
                select((.body // "") | contains("Obligation-ID: " + $obligation)) |
                select((((.title // "") | startswith("RETIRED")) | not)) |
                select((((.body // "") | contains("Retirement-State: RETIRED_DO_NOT_MERGE")) | not)) |
                select((((.body // "") | contains("\nRETIRED:")) | not))
              ][0].number' .artifacts/open-prs-after.json)"
              jq -cn --arg type TERMINAL_LEASE_SUCCESSOR_EXISTS --argjson pr "$pr" --argjson successor "$successor" --arg obligation "$obligation" '{type:$type,pr_number:$pr,successor_number:$successor,obligation_id:$obligation}' >> .artifacts/janitor-runtime-actions.ndjson
            else
              echo "::error::TERMINAL_LEASE_SUCCESSOR_AMBIGUOUS:#${pr}:obligation=${obligation}:count=${successor_count}"
              exit 78
            fi
          done

          # Cancel only stale candidate executions. Never touch main and never cancel the current head of an open PR.
          for status in queued in_progress; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" --jq '.workflow_runs[] | {id,head_branch,head_sha,status,created_at} | @json' | while read -r run_json; do
              run_id="$(jq -r '.id' <<<"$run_json")"
              branch="$(jq -r '.head_branch // ""' <<<"$run_json")"
              run_sha="$(jq -r '.head_sha // ""' <<<"$run_json")"
              run_status="$(jq -r '.status // ""' <<<"$run_json")"
              created_at="$(jq -r '.created_at // ""' <<<"$run_json")"
              [ -n "$branch" ] || continue
              [ "$branch" != main ] || continue
              current_pr_head="$(jq -r --arg branch "$branch" '[.[] | select(.head.ref == $branch and .state == "open") | .head.sha][0] // empty' .artifacts/open-prs-after.json)"
              safe_cancel=false
              reason=''
              if [ -n "$current_pr_head" ] && [ "$current_pr_head" != "$run_sha" ]; then
                safe_cancel=true
                reason=STALE_PR_HEAD
              elif [ -z "$current_pr_head" ]; then
                # Queued runs without an open PR have no current delivery authority.
                # TTL cleanup never applies to in-progress runs.
                if [ "$run_status" = queued ] && [ -n "$created_at" ]; then
                  created_epoch="$(date -u -d "$created_at" +%s 2>/dev/null || echo 0)"
                  now_epoch="$(date -u +%s)"
                  stale_after_seconds=21600
                  if [ "$created_epoch" -gt 0 ] && [ $((now_epoch-created_epoch)) -ge "$stale_after_seconds" ]; then
                    safe_cancel=true
                    reason=STALE_QUEUED_NO_OPEN_PR
                  fi
                fi
                if [ "$safe_cancel" != true ]; then
                  encoded_branch="$(jq -rn --arg v "$branch" '$v|@uri')"
                  branch_json="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" 2>/dev/null || true)"
                  if [ -n "$branch_json" ] && [ "$(jq -r '.protected // true' <<<"$branch_json")" = false ]; then
                    ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${encoded_branch}" --jq '.ahead_by' 2>/dev/null || echo UNPROVEN)"
                    if [ "$ahead" = 0 ]; then
                      safe_cancel=true
                      reason=MERGED_OR_CONTAINED_BRANCH
                    fi
                  fi
                fi
              fi
              [ "$safe_cancel" = true ] || continue
              latest_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo unknown)"
              case "$latest_status" in queued|in_progress) ;; *) continue ;; esac
              # Long-stuck zero-job runs can be GitHub provider ghosts. The bounded provider
              # reconciler below owns cancel/force/delete and deduplicated escalation;
              # never send the same 409/403 trio on every hourly janitor sweep.
              if [ "$latest_status" = queued ] && [ -n "$created_at" ]; then
                run_epoch="$(date -u -d "$created_at" +%s 2>/dev/null || echo 0)"
                now_epoch="$(date -u +%s)"
                if [ "$run_epoch" -gt 0 ] && [ $((now_epoch-run_epoch)) -ge 86400 ]; then
                  run_details="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" 2>/dev/null || echo '{}')"
                  updated_at="$(jq -r '.updated_at // ""' <<<"$run_details")"
                  if [ "$updated_at" = "$created_at" ]; then
                    jobs_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo UNPROVEN)"
                    if [ "$jobs_count" = 0 ]; then
                      jq -cn --arg type GITHUB_PROVIDER_GHOST_OBSERVED --argjson id "$run_id" --arg branch "$branch" --arg sha "$run_sha" '{type:$type,run_id:$id,branch:$branch,head_sha:$sha,owner:"github-actions-ghost-reconcile"}' >> .artifacts/janitor-runtime-actions.ndjson
                      continue
                    fi
                  fi
                fi
              fi
              cancel_mode=""
              if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1; then
                cancel_mode=normal-cancel
              elif gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null 2>&1; then
                cancel_mode=force-cancel
              else
                latest_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo unknown)"
                case "$latest_status" in completed|cancelled) continue ;; esac
                if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null 2>&1; then
                  cancel_mode=delete-fallback
                else
                  latest_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo unknown)"
                  case "$latest_status" in
                    queued|in_progress|pending|waiting|requested)
                      # GitHub can retain legacy/zombie runs that reject cancel, force-cancel and delete.
                      # Do not abort the janitor: record the blocked run and continue so stale merged refs
                      # can still be deleted below. The next sweep will re-read the run state.
                      jq -cn --arg type CANCEL_RUN_BLOCKED --argjson id "$run_id" --arg branch "$branch" --arg sha "$run_sha" --arg reason "$reason" --arg status "$latest_status" '{type:$type,run_id:$id,branch:$branch,head_sha:$sha,reason:$reason,status:$status,blocker:"GITHUB_API_UNCANCELLABLE"}' >> .artifacts/janitor-runtime-actions.ndjson
                      continue
                      ;;
                    *) continue ;;
                  esac
                fi
              fi
              jq -cn --arg type CANCEL_RUN --argjson id "$run_id" --arg branch "$branch" --arg sha "$run_sha" --arg reason "$reason" --arg mode "$cancel_mode" '{type:$type,run_id:$id,branch:$branch,head_sha:$sha,reason:$reason,mode:$mode}' >> .artifacts/janitor-runtime-actions.ndjson
            done
          done

          # Delete only unprotected non-main refs with no open PR and zero commits ahead of main.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            [ "$branch" != main ] || continue
            open_pr_count="$(jq -r --arg branch "$branch" '[.[] | select(.head.ref == $branch and .state == "open")] | length' .artifacts/open-prs-after.json)"
            [ "$open_pr_count" = 0 ] || continue
            encoded_branch="$(jq -rn --arg v "$branch" '$v|@uri')"
            branch_json="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" 2>/dev/null || true)"
            [ -n "$branch_json" ] || continue
            [ "$(jq -r '.protected // true' <<<"$branch_json")" = false ] || continue
            head_sha="$(jq -r '.commit.sha' <<<"$branch_json")"
            ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${encoded_branch}" --jq '.ahead_by' 2>/dev/null || echo UNPROVEN)"
            [ "$ahead" = 0 ] || continue
            # Re-read branch immediately before deletion: exact-head drift makes deletion fail closed.
            latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" --jq '.commit.sha' 2>/dev/null || echo MISSING)"
            [ "$latest_sha" = "$head_sha" ] || { echo "::error::JANITOR_BRANCH_HEAD_DRIFT:${branch}:${head_sha}:${latest_sha}"; exit 78; }
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}" >/dev/null
            jq -cn --arg type DELETE_BRANCH --arg branch "$branch" --arg sha "$head_sha" --arg reason ALREADY_CONTAINED_IN_MAIN '{type:$type,branch:$branch,head_sha:$sha,reason:$reason}' >> .artifacts/janitor-runtime-actions.ndjson
          done

          jq -s '.' .artifacts/janitor-runtime-actions.ndjson > .artifacts/janitor-runtime-actions.json
          cat .artifacts/janitor-runtime-actions.json
      - name: Read back applied cleanup
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'apply-safe') || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '.actions[] | select(.perform == true)' .artifacts/powerhouse-repository-janitor.json | while read -r action; do
            pr="$(jq -r '.prNumber' <<<"$action")"
            state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.state')"
            [ "$state" = closed ] || { echo "::error::JANITOR_READBACK_FAILED:#${pr}:${state}"; exit 1; }
          done
          if [ -f .artifacts/janitor-runtime-actions.json ]; then
            jq -c '.[] | select(.type == "AUTO_REOPEN_TERMINAL_LEASE")' .artifacts/janitor-runtime-actions.json | while read -r action; do
              pr="$(jq -r '.pr_number' <<<"$action")"
              state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.state')"
              merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.merged')"
              [ "$state" = open ] && [ "$merged" = false ] || { echo "::error::JANITOR_TERMINAL_LEASE_REOPEN_READBACK_FAILED:#${pr}:${state}:${merged}"; exit 78; }
            done
            jq -c '.[] | select(.type == "DELETE_BRANCH")' .artifacts/janitor-runtime-actions.json | while read -r action; do
              branch="$(jq -r '.branch' <<<"$action")"
              encoded_branch="$(jq -rn --arg v "$branch" '$v|@uri')"
              if gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" >/dev/null 2>&1; then
                echo "::error::JANITOR_BRANCH_DELETE_READBACK_FAILED:${branch}"
                exit 1
              fi
            done
          fi
      - name: Reconcile provider-owned GitHub Actions zero-job ghosts
        if: (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'apply-safe' || github.event.inputs.mode == 'provider-ghost-only')) || github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/github-actions-ghost-reconcile.mjs
      - name: Observe bounded CI throughput on existing hourly Janitor
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/delivery/ci-throughput-telemetry.mjs
      - name: Observe actual Recovery Supervisor runs and repeated drift in existing Janitor
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/delivery/recovery-supervisor-telemetry.mjs
      - name: Derive read-only repeated CI job priorities for existing agents
        if: always()
        continue-on-error: true
        run: node tools/delivery/ci-agent-priorities.mjs
      - name: Recover missed daily self-evolution using existing hourly Janitor
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'apply-safe')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
        run: node tools/delivery/daily-learning-liveness-recovery.mjs
      - name: Upload janitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerhouse-repository-janitor-${{ github.run_id }}
          path: |
            .artifacts/powerhouse-repository-janitor.json
            .artifacts/janitor-runtime-actions.json
            .artifacts/github-actions-ghost-reconcile.json
            .artifacts/powerhouse-ci-throughput.json
            .artifacts/powerhouse-ci-agent-priorities.json
            .artifacts/powerhouse-supervisor-execution-evidence.json
            .artifacts/powerhouse-merge-freshness.json
            .artifacts/powerhouse-daily-learning-liveness.json
          if-no-files-found: error
