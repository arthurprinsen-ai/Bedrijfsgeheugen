name: Powerhouse Repository Janitor

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run emits evidence only; apply-safe closes/removes/cancels only deterministic safe debris'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply-safe

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: powerhouse-repository-janitor
  cancel-in-progress: false

jobs:
  janitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Classify repository delivery hygiene
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          mode="${REQUESTED_MODE:-dry-run}"
          if [ "$EVENT_NAME" = schedule ]; then mode=apply-safe; fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > .artifacts/open-prs.json
          MODE="$mode" node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, writeFile } from 'node:fs/promises';
          import { parseDeliveryMetadata } from './tools/delivery/delivery-hygiene.mjs';
          import { planRepositoryCleanup } from './tools/delivery/repository-janitor.mjs';
          const policy=JSON.parse(await readFile('config/powerhouse-delivery-hygiene-v1.json','utf8'));
          const raw=JSON.parse(await readFile('.artifacts/open-prs.json','utf8'));
          const ghJson=path=>JSON.parse(execFileSync('gh',['api',path],{encoding:'utf8'}));
          const candidates=[];
          for (const pr of raw) {
            let uniqueCommits=true;
            let compareEvidence={status:'UNPROVEN'};
            try {
              const compare=ghJson(`repos/${process.env.GITHUB_REPOSITORY}/compare/main...${pr.head.sha}`);
              uniqueCommits=Number(compare.ahead_by || 0) > 0;
              compareEvidence={status:compare.status,ahead_by:Number(compare.ahead_by||0),behind_by:Number(compare.behind_by||0),total_commits:Number(compare.total_commits||0)};
            } catch (error) {
              compareEvidence={status:'UNPROVEN',error:String(error?.message||error)};
            }
            candidates.push({
              number:pr.number,
              state:pr.state,
              title:pr.title,
              body:pr.body||'',
              baseSha:parseDeliveryMetadata(pr.body||'').baseSha || pr.base?.sha || '',
              headSha:pr.head?.sha||'',
              uniqueCommits,
              compareEvidence,
            });
          }
          const plan=planRepositoryCleanup({candidates,policy,mode:process.env.MODE||'dry-run'});
          const evidence={
            observed_at:new Date().toISOString(),
            repository:process.env.GITHUB_REPOSITORY,
            open_pr_count:candidates.length,
            candidates:candidates.map(({number,headSha,uniqueCommits,compareEvidence})=>({number,headSha,uniqueCommits,compareEvidence})),
            ...plan,
          };
          await writeFile('.artifacts/powerhouse-repository-janitor.json',`${JSON.stringify(evidence,null,2)}\n`);
          console.log(JSON.stringify(evidence,null,2));
          NODE
      - name: Apply deterministic safe PR cleanup
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'apply-safe') || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '.actions[] | select(.perform == true)' .artifacts/powerhouse-repository-janitor.json | while read -r action; do
            pr="$(jq -r '.prNumber' <<<"$action")"
            reason="$(jq -r '.reason' <<<"$action")"
            successor="$(jq -r '.successorNumber // empty' <<<"$action")"
            current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
            [ "$(jq -r '.state' <<<"$current")" = open ] || continue
            current_head="$(jq -r '.head.sha' <<<"$current")"
            planned_head="$(jq -r --argjson pr "$pr" '.candidates[] | select(.number == $pr) | .headSha' .artifacts/powerhouse-repository-janitor.json)"
            [ "$current_head" = "$planned_head" ] || { echo "::error::JANITOR_HEAD_DRIFT:#${pr}:${planned_head}:${current_head}"; exit 78; }
            if [ "$reason" = ALREADY_CONTAINED_IN_MAIN ]; then
              ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${current_head}" --jq '.ahead_by')"
              [ "$ahead" = 0 ] || { echo "::error::JANITOR_MAIN_CONTAINMENT_DRIFT:#${pr}:ahead_by=${ahead}"; exit 78; }
            fi
            if [ -n "$successor" ]; then
              successor_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${successor}")"
              [ "$(jq -r '.state' <<<"$successor_state")" = open ] || { echo "::error::Successor #${successor} is no longer open"; exit 78; }
            fi
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f state=closed >/dev/null
            printf 'closed_pr=%s reason=%s successor=%s\n' "$pr" "$reason" "${successor:-none}"
          done
      - name: Reconcile stale Actions and merged branch debris
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'apply-safe') || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > .artifacts/open-prs-after.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&sort=updated&direction=desc&per_page=100" > .artifacts/closed-prs-recent.json
          : > .artifacts/janitor-runtime-actions.ndjson

          # Active TERMINAL_DELIVERY lease may not remain closed without merge.
          jq -c '.[] | select((.merged_at == null) and ((.body // "") | contains("Writer-Lease-State: TERMINAL_DELIVERY")))' .artifacts/closed-prs-recent.json | while read -r closed_pr; do
            pr="$(jq -r '.number' <<<"$closed_pr")"
            body="$(jq -r '.body // ""' <<<"$closed_pr")"
            obligation="$(printf '%s\n' "$body" | sed -n 's/^Obligation-ID:[[:space:]]*//p' | head -n1)"
            [ -n "$obligation" ] || { echo "::error::TERMINAL_LEASE_CLOSED_WITHOUT_OBLIGATION:#${pr}"; exit 78; }

            successor_count="$(jq -r --arg obligation "$obligation" '[.[] | select(.state=="open") | select((.body // "") | contains("Obligation-ID: " + $obligation))] | length' .artifacts/open-prs-after.json)"
            if [ "$successor_count" -eq 0 ]; then
              current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
              [ "$(jq -r '.state' <<<"$current")" = closed ] || continue
              [ "$(jq -r '.merged' <<<"$current")" = false ] || continue
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f state=open >/dev/null
              jq -cn --arg type AUTO_REOPEN_TERMINAL_LEASE --argjson pr "$pr" --arg obligation "$obligation" '{type:$type,pr_number:$pr,obligation_id:$obligation,reason:"TERMINAL_DELIVERY_CLOSED_UNMERGED_NO_SUCCESSOR"}' >> .artifacts/janitor-runtime-actions.ndjson
            elif [ "$successor_count" -eq 1 ]; then
              successor="$(jq -r --arg obligation "$obligation" '[.[] | select(.state=="open") | select((.body // "") | contains("Obligation-ID: " + $obligation))][0].number' .artifacts/open-prs-after.json)"
              jq -cn --arg type TERMINAL_LEASE_SUCCESSOR_EXISTS --argjson pr "$pr" --argjson successor "$successor" --arg obligation "$obligation" '{type:$type,pr_number:$pr,successor_number:$successor,obligation_id:$obligation}' >> .artifacts/janitor-runtime-actions.ndjson
            else
              echo "::error::TERMINAL_LEASE_SUCCESSOR_AMBIGUOUS:#${pr}:obligation=${obligation}:count=${successor_count}"
              exit 78
            fi
          done

          # Cancel only stale candidate executions. Never touch main and never cancel the current head of an open PR.
          for status in queued in_progress; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" --jq '.workflow_runs[] | [.id,.head_branch,.head_sha,.status] | @tsv' | while IFS=$'\t' read -r run_id branch run_sha run_status; do
              [ -n "$branch" ] || continue
              [ "$branch" != main ] || continue
              current_pr_head="$(jq -r --arg branch "$branch" '[.[] | select(.head.ref == $branch and .state == "open") | .head.sha][0] // empty' .artifacts/open-prs-after.json)"
              safe_cancel=false
              reason=''
              if [ -n "$current_pr_head" ] && [ "$current_pr_head" != "$run_sha" ]; then
                safe_cancel=true
                reason=STALE_PR_HEAD
              elif [ -z "$current_pr_head" ]; then
                encoded_branch="$(jq -rn --arg v "$branch" '$v|@uri')"
                branch_json="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" 2>/dev/null || true)"
                if [ -n "$branch_json" ] && [ "$(jq -r '.protected // true' <<<"$branch_json")" = false ]; then
                  ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${encoded_branch}" --jq '.ahead_by' 2>/dev/null || echo UNPROVEN)"
                  if [ "$ahead" = 0 ]; then
                    safe_cancel=true
                    reason=MERGED_OR_CONTAINED_BRANCH
                  fi
                fi
              fi
              [ "$safe_cancel" = true ] || continue
              latest_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo unknown)"
              case "$latest_status" in queued|in_progress) ;; *) continue ;; esac
              if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1; then
                jq -cn --arg type CANCEL_RUN --argjson id "$run_id" --arg branch "$branch" --arg sha "$run_sha" --arg reason "$reason" '{type:$type,run_id:$id,branch:$branch,head_sha:$sha,reason:$reason}' >> .artifacts/janitor-runtime-actions.ndjson
              else
                latest_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo unknown)"
                case "$latest_status" in completed) continue ;; *) echo "::error::JANITOR_CANCEL_FAILED:${run_id}:${latest_status}"; exit 78 ;; esac
              fi
            done
          done

          # Delete only unprotected non-main refs with no open PR and zero commits ahead of main.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            [ "$branch" != main ] || continue
            open_pr_count="$(jq -r --arg branch "$branch" '[.[] | select(.head.ref == $branch and .state == "open")] | length' .artifacts/open-prs-after.json)"
            [ "$open_pr_count" = 0 ] || continue
            encoded_branch="$(jq -rn --arg v "$branch" '$v|@uri')"
            branch_json="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" 2>/dev/null || true)"
            [ -n "$branch_json" ] || continue
            [ "$(jq -r '.protected // true' <<<"$branch_json")" = false ] || continue
            head_sha="$(jq -r '.commit.sha' <<<"$branch_json")"
            ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${encoded_branch}" --jq '.ahead_by' 2>/dev/null || echo UNPROVEN)"
            [ "$ahead" = 0 ] || continue
            # Re-read branch immediately before deletion: exact-head drift makes deletion fail closed.
            latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" --jq '.commit.sha' 2>/dev/null || echo MISSING)"
            [ "$latest_sha" = "$head_sha" ] || { echo "::error::JANITOR_BRANCH_HEAD_DRIFT:${branch}:${head_sha}:${latest_sha}"; exit 78; }
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}" >/dev/null
            jq -cn --arg type DELETE_BRANCH --arg branch "$branch" --arg sha "$head_sha" --arg reason ALREADY_CONTAINED_IN_MAIN '{type:$type,branch:$branch,head_sha:$sha,reason:$reason}' >> .artifacts/janitor-runtime-actions.ndjson
          done

          jq -s '.' .artifacts/janitor-runtime-actions.ndjson > .artifacts/janitor-runtime-actions.json
          cat .artifacts/janitor-runtime-actions.json
      - name: Read back applied cleanup
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'apply-safe') || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '.actions[] | select(.perform == true)' .artifacts/powerhouse-repository-janitor.json | while read -r action; do
            pr="$(jq -r '.prNumber' <<<"$action")"
            state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.state')"
            [ "$state" = closed ] || { echo "::error::JANITOR_READBACK_FAILED:#${pr}:${state}"; exit 1; }
          done
          if [ -f .artifacts/janitor-runtime-actions.json ]; then
            jq -c '.[] | select(.type == "AUTO_REOPEN_TERMINAL_LEASE")' .artifacts/janitor-runtime-actions.json | while read -r action; do
              pr="$(jq -r '.pr_number' <<<"$action")"
              state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.state')"
              merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.merged')"
              [ "$state" = open ] && [ "$merged" = false ] || { echo "::error::JANITOR_TERMINAL_LEASE_REOPEN_READBACK_FAILED:#${pr}:${state}:${merged}"; exit 78; }
            done
            jq -c '.[] | select(.type == "DELETE_BRANCH")' .artifacts/janitor-runtime-actions.json | while read -r action; do
              branch="$(jq -r '.branch' <<<"$action")"
              encoded_branch="$(jq -rn --arg v "$branch" '$v|@uri')"
              if gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" >/dev/null 2>&1; then
                echo "::error::JANITOR_BRANCH_DELETE_READBACK_FAILED:${branch}"
                exit 1
              fi
            done
          fi
      - name: Upload janitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerhouse-repository-janitor-${{ github.run_id }}
          path: |
            .artifacts/powerhouse-repository-janitor.json
            .artifacts/janitor-runtime-actions.json
          if-no-files-found: error
