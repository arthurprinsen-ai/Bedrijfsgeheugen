name: Powerhouse Supabase Security Contract

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/brain/check_powerhouse_supabase_security.py'
      - '.github/workflows/powerhouse-supabase-security-contract.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/brain/check_powerhouse_supabase_security.py'
      - '.github/workflows/powerhouse-supabase-security-contract.yml'

concurrency:
  group: powerhouse-supabase-security-contract-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supabase-security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove the gate blocks known unsafe patterns
        run: python3 scripts/brain/check_powerhouse_supabase_security.py --self-test

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce fail-closed Supabase migration security contract
        run: python3 scripts/brain/check_powerhouse_supabase_security.py "${{ steps.base.outputs.base }}" "${{ steps.base.outputs.head }}"
