name: Canonical brand shell live readback

on:
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'assets/**'
      - 'pages/**'
      - 'site/**'
      - 'blog/**'
      - 'kennis/**'
      - '*.html'
      - 'styles.css'
      - 'script.js'
      - 'seo-status.json'
      - 'sitemap.xml'
      - 'netlify.toml'
      - 'tools/site-shell/**'
      - 'tools/seo-order-engine/**'
      - 'netlify/functions/growth-event.mjs'
      - 'tests/site-shell-*.test.mjs'
      - 'tests/seo-*.test.mjs'
      - '.github/workflows/canonical-brand-shell-live-readback.yml'
  workflow_dispatch:

concurrency:
  group: canonical-brand-shell-live-readback-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test live shell contract
        run: node tools/site-shell/test-live-contract.mjs
      - name: Test live SEO order contract
        run: node --test tests/seo-order-live-readback.test.mjs

  production-readback:
    if: github.event_name != 'pull_request'
    timeout-minutes: 25
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: runtime
        name: Resolve runtime-applicable production commit
        env:
          HEAD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          accepted="$HEAD_COMMIT"
          mode="exact-head"
          live_release="$(curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/release.json?runtime_scope=${HEAD_COMMIT}-$(date +%s)" || true)"
          observed="$(node -e 'try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.commit_ref||""))}catch{}' "$live_release")"
          if [[ "$observed" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch origin main --quiet || true
            if git cat-file -e "$observed^{commit}" 2>/dev/null && git merge-base --is-ancestor "$observed" "$HEAD_COMMIT"; then
              delta="$(git diff --name-only "$observed...$HEAD_COMMIT")"
              safe="$(printf '%s\n' "$delta" | node --input-type=module -e '
                import fs from "node:fs";
                const paths=fs.readFileSync(0,"utf8").split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);
                const prefixes=["docs/","tests/",".github/","brain/learning/"];
                const exact=new Set([
                  "brain/contracts/production-readback-v1.json",
                  "tools/site-shell/contracts.mjs",
                  "tools/site-shell/test-shell-components.mjs",
                  "tools/site-shell/live-contract.mjs",
                  "tools/site-shell/test-live-contract.mjs",
                  "tools/site-shell/production-supersession.mjs"
                ]);
                const ok=paths.every(p=>exact.has(p)||prefixes.some(prefix=>p.startsWith(prefix)));
                process.stdout.write(String(ok));
              ')"
              if [ "$safe" = "true" ]; then
                accepted="$observed"
                mode="control-plane-ancestor"
              fi
            fi
          fi
          echo "accepted_runtime_commit=$accepted" >> "$GITHUB_OUTPUT"
          echo "runtime_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "RUNTIME_APPLICABILITY mode=$mode head=$HEAD_COMMIT live=${observed:-none} accepted=$accepted"
      - name: Wait for exact Netlify production commit and verify canonical shell + SEO order engine
        env:
          EXPECTED_COMMIT: ${{ steps.runtime.outputs.accepted_runtime_commit }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 16); do
            nonce="${EXPECTED_COMMIT}-${attempt}-$(date +%s)"
            growth_status="fetch-failed"
            if curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/?bg_readback=${nonce}" -o live-home.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/prijzen?bg_readback=${nonce}" -o live-prijzen.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/over-ons?bg_readback=${nonce}" -o live-over-ons.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/afas-koppeling?bg_readback=${nonce}" -o live-afas.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/blog/?bg_readback=${nonce}" -o live-blog-index.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/blog/afas-api/?bg_readback=${nonce}" -o live-blog-afas-api.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/blog/kennis-borgen-in-je-bedrijf/?bg_readback=${nonce}" -o live-blog-kennis-borgen.html; then
              growth_status="$(curl -sS -o /tmp/growth-health.txt -w '%{http_code}' -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/api/growth-event?bg_readback=${nonce}" || true)"
              observed_commit="$(node --input-type=module -e 'import {readFile} from "node:fs/promises"; import {readReleaseMarker} from "./tools/site-shell/release-marker.mjs"; process.stdout.write(String(readReleaseMarker(await readFile("live-home.html","utf8"))||""))')"
              git fetch origin main --quiet || true
              supersession_json="$(node tools/site-shell/production-supersession.mjs --expected "$EXPECTED_COMMIT" --observed "$observed_commit" 2>/dev/null || true)"
              supersession_ok="$(node -e 'try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.ok===true))}catch{process.stdout.write("false")}' "$supersession_json")"
              if [ "$supersession_ok" = "true" ]                 && EXPECTED_COMMIT="$observed_commit" node tools/site-shell/check-live-production.mjs                 && node tools/seo-order-engine/live-readback.mjs                 && [ "$growth_status" = "405" ]; then
                echo "Production shell + SEO order + growth endpoint readback green; expected=${EXPECTED_COMMIT} observed=${observed_commit} supersession=${supersession_json}"
                exit 0
              fi
            fi
            echo "Production is not on ${EXPECTED_COMMIT} with all contracts yet; growth endpoint status=${growth_status}; retry ${attempt}/16"
            sleep 15
          done
          echo "Production never satisfied the exact shell + SEO order + growth endpoint contract for ${EXPECTED_COMMIT}" >&2
          observed_commit="$(node --input-type=module -e 'import {readFile} from "node:fs/promises"; import {readReleaseMarker} from "./tools/site-shell/release-marker.mjs"; process.stdout.write(String(readReleaseMarker(await readFile("live-home.html","utf8"))||""))')"
          git fetch origin main --quiet || true
          node tools/site-shell/production-supersession.mjs --expected "$EXPECTED_COMMIT" --observed "$observed_commit"
          EXPECTED_COMMIT="$observed_commit" node tools/site-shell/check-live-production.mjs
          node tools/seo-order-engine/live-readback.mjs
          test "$(curl -sS -o /tmp/growth-health.txt -w '%{http_code}' https://www.bedrijfsgeheugen.nl/api/growth-event || true)" = "405"
      - name: Install production visual readback browser
        run: |
          PLAYWRIGHT_PACKAGE=playwright@1.55.0 bash tools/ci/install-chromium.sh
      - name: Verify every public production page is visibly rendered
        env:
          UI_VR_BASE_URL: https://www.bedrijfsgeheugen.nl
          UI_VR_ROUTE_CONCURRENCY: '8'
          UI_VR_VIEWPORT_CONCURRENCY: '3'
        run: timeout --signal=TERM --kill-after=30s 10m node tools/site-shell/standalone-visibility-check.mjs
      - name: Production UI visual regression readback
        env:
          EXPECTED_COMMIT: ${{ steps.runtime.outputs.accepted_runtime_commit }}
          UI_VR_BASE_URL: https://www.bedrijfsgeheugen.nl
        run: node tools/site-shell/ui-visual-regression/browser-check.mjs
      - name: Upload production visual regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ui-visual-regression
          path: artifacts/ui-visual-regression/
          if-no-files-found: ignore
