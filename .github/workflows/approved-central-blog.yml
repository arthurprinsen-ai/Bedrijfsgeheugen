name: Approved central blog publisher

on:
  schedule:
    - cron: '15 7,10,14,18 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optioneel: publiceer exact deze goedgekeurde centrale slug'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: repo-schrijven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Render exact approved central article
        id: render
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FORCE_SLUG: ${{ github.event.inputs.slug }}
        run: |
          set -euo pipefail
          python3 scripts/publish_approved_blog.py "$FORCE_SLUG" | tee /tmp/publish-result.txt
          if grep -q '^NO_ACTION:' /tmp/publish-result.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deterministic contract checks
        if: steps.render.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          allowed_exact = {'blog/index.html','blog/rss.xml','sitemap.xml'}
          article = [p for p in changed if re.fullmatch(r'blog/[a-z0-9-]+/index\.html', p)]
          unexpected = [p for p in changed if p not in allowed_exact and p not in article]
          assert len(article) == 1, f'exact één artikelbestand vereist, gevonden={article}'
          assert not unexpected, f'onverwachte bestanden gewijzigd: {unexpected}'
          text = pathlib.Path(article[0]).read_text(encoding='utf-8')
          assert len(re.findall(r'<h1(?:\s|>)', text)) == 1, 'exact één h1 vereist'
          m = re.search(r'<link rel="canonical" href="([^"]+)">', text)
          assert m and m.group(1).endswith('/'), 'geldige canonical vereist'
          assert '.html' not in m.group(1), 'canonical mag geen .html bevatten'
          ld = re.search(r'<script type="application/ld\+json">(.*?)</script>', text, re.S)
          assert ld, 'JSON-LD ontbreekt'
          json.loads(ld.group(1))
          print('CONTRACT_OK', article[0], m.group(1))
          PY

      - name: Commit and push
        if: steps.render.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "Bedrijfsgeheugen Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add blog/ sitemap.xml
          git commit -m "blog: publish approved central article"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "::error::Push faalde na drie begrensde pogingen"
          exit 1
