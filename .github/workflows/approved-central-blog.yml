name: Approved central blog publisher

on:
  schedule:
    # 07:20 UTC: after native content generation and the Powerhouse daily intelligence run.
    - cron: '20 7 * * *'
  push:
    branches:
      - main
    paths:
      - 'automation/contracts/approved-blog-trigger.json'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optioneel: verwerk exact deze goedgekeurde centrale slug'
        required: false
        default: ''
      delivery_mode:
        description: 'BRAIN v2 staat alleen gecontroleerde candidate PR delivery toe'
        type: choice
        required: true
        default: candidate-pr
        options:
          - candidate-pr
      verification_mode:
        description: 'Gebruik uitsluitend de lokale operationele verificatie-fixture; nooit productiecontent'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: repo-schrijven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Exacte basis vastleggen
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve exact approved due slug
        id: resolve
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          REQUESTED_SLUG: ${{ github.event.inputs.slug || '' }}
          EVENT_NAME: ${{ github.event_name }}
          VERIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || false }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          if [ "$VERIFICATION_MODE" = "true" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "slug=" >> "$GITHUB_OUTPUT"
            echo "RESOLVED_SLUG=verification-fixture"
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            RESOLVED_SLUG="$(python3 - <<'PY'
          import json, pathlib, re
          path = pathlib.Path('automation/contracts/approved-blog-trigger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          slug = str(data.get('slug') or '').strip()
          if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', slug):
              raise SystemExit('invalid approved-blog recovery trigger slug')
          print(slug)
          PY
          )"
          elif [ -n "$REQUESTED_SLUG" ]; then
            RESOLVED_SLUG="$REQUESTED_SLUG"
          else
            RESOLVED_SLUG="$(python3 -B scripts/publish_approved_blog_v2.py --select-due-slug)"
          fi

          if [ "$RESOLVED_SLUG" = "NO_DUE_BLOG" ] || [ -z "$RESOLVED_SLUG" ]; then
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "slug=" >> "$GITHUB_OUTPUT"
            echo "NO_DUE_BLOG"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "slug=$RESOLVED_SLUG" >> "$GITHUB_OUTPUT"
            echo "RESOLVED_SLUG=$RESOLVED_SLUG"
          fi

      - name: Fail closed when scheduled daily blog is missing
        if: github.event_name == 'schedule' && steps.resolve.outputs.due != 'true'
        run: |
          echo "::error::NO_DUE_BLOG: daily blog obligation has no eligible approved article"
          exit 1

      - name: Seal or render exact approved article
        id: render
        if: steps.resolve.outputs.due == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FORCE_SLUG: ${{ steps.resolve.outputs.slug }}
          VERIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || false }}
          DELIVERY_MODE: candidate-pr
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          if [ "$VERIFICATION_MODE" = "true" ]; then
            target="blog/writer-verification-approved-central/index.html"
            mkdir -p "$(dirname "$target")"
            cat > "$target" <<'HTML'
          <!doctype html>
          <html lang="nl">
          <head>
            <meta charset="utf-8">
            <title>Writer verification</title>
            <link rel="canonical" href="https://www.bedrijfsgeheugen.nl/blog/writer-verification-approved-central/">
            <script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"Writer verification"}</script>
          </head>
          <body><h1>Writer verification</h1><p>Lokale operationele verificatie; nooit publiceren.</p></body>
          </html>
          HTML
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "queue_page=" >> "$GITHUB_OUTPUT"
            echo "dispatch_attempt=0" >> "$GITHUB_OUTPUT"
          else
            python3 -B scripts/publish_approved_blog_v2.py "$FORCE_SLUG" | tee /tmp/publish-result.txt
            if grep -Eq '^(NO_ACTION:|SEALED:)' /tmp/publish-result.txt; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              python3 - <<'PY'
          import json, os, pathlib
          lines=[x for x in pathlib.Path('/tmp/publish-result.txt').read_text().splitlines() if x.strip()]
          data=json.loads(lines[-1])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"queue_page={data['queue_page']}\n")
              f.write(f"dispatch_attempt={data['dispatch_attempt']}\n")
          PY
            fi
          fi

      - name: Preserve source-bound Brain candidate closure
        if: steps.render.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.verification_mode)
        env:
          SOURCE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import re
          lines = [line for line in pathlib.Path('/tmp/publish-result.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          q = json.loads(lines[-1])
          slug = str(q.get('slug') or '')
          source = str(q.get('content_id') or '')
          page = str(q.get('queue_page') or '')
          source_hash = str(q.get('source_hash') or '')
          run_id = str(os.environ.get('GITHUB_RUN_ID') or '')
          base_sha = str(os.environ.get('SOURCE_SHA') or '')
          assert re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', slug), 'approved source slug invalid'
          assert source and re.fullmatch(r'[0-9a-f-]{36}', page), 'approved source identity missing'
          assert re.fullmatch(r'[a-f0-9]{64}', source_hash), 'approved immutable source hash missing'
          assert run_id.isdigit() and re.fullmatch(r'[a-f0-9]{40}', base_sha), 'immutable writer identity missing'
          key = f'approved-central-blog-{slug}-{run_id}-v1'
          url = f'https://www.bedrijfsgeheugen.nl/blog/{slug}/'
          lesson = {
            'fingerprint': f'{source}|{slug}|candidate-delivery|{run_id}',
            'observed_at': dt.datetime.now(dt.timezone.utc).date().isoformat(),
            'obligation_id': f'approved-central-blog|{source}|{page}',
            'source': {'content_id': source, 'queue_page': page, 'source_hash': source_hash, 'writer_run_id': run_id, 'source_base_sha': base_sha, 'slug': slug},
            'root_causes': ['An approved queue article is only a source candidate; creation of HTML, PR, and CI do not constitute public publication.'],
            'prevention': ['Preserve the exact approved source, queue page, immutable hash and producer run across the original candidate, protected BG169 release and public readback.', 'Keep the original queue Pending until independently verified exact production URL and release SHA, then reconcile ONE BRAIN and Heartbeat.', 'Never duplicate canonical or redirected pages.'],
            'evidence': {'candidate_url': url, 'writer_source_base_sha': base_sha, 'provider_readback': 'NOT_YET_PROVEN'},
            'compiler': {'failure_class': 'GITHUB_DELIVERY', 'scope': 'GITHUB', 'machine_enforceable': True, 'repeat_count': 1, 'security_sensitive': False},
            'evaluation': {'historical_replay': ['tests/brain-approved-central-blog-candidate-contract-20261123.test.mjs']},
            'current_state': 'CANDIDATE_NOT_LIVE'
          }
          files = {
            f'brain/learning/{key}.json': json.dumps(lesson, ensure_ascii=False, indent=2) + '\\n',
            f'docs/changes/{key}.md': f'# Protected central blog kandidaat — {slug}\\n\\nBron: \\u0060{source}\\u0060, Notion pagina \\u0060{page}\\u0060, source hash \\u0060{source_hash}\\u0060. Originele writer-run: {run_id}, source base SHA: {base_sha}.\\n\\nDe HTML, blogindex, RSS en sitemap zijn alleen een kandidaat. Required, CodeQL, BG169, Netlify en onafhankelijke live-URL-readback blijven verplicht. Een groen runresultaat is niet hetzelfde als gepubliceerd.\\n',
            f'docs/development-ledger-events/{key}.md': f'# Development ledger — protected approved central blog\\n\\n- Original producer: approved-central-blog, run {run_id}\\n- Source page: {page}\\n- Source content: {source}\\n- Approved hash: {source_hash}\\n- Candidate URL (not yet published): {url}\\n- Status: CANDIDATE_NOT_LIVE; existing protected BG169 owner controls merge and public proof\\n- Delivery rule: one source-bound candidate, one writer; no main-push, no duplicate canonical page and no green until Heartbeat/ONE BRAIN readback\\n'
          }
          for filename, content in files.items():
              dest = pathlib.Path(filename)
              assert not dest.exists(), f'closure file already exists: {filename}'
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(content, encoding='utf-8')
          print('SOURCE_BOUND_CLOSURE_OK', source, page, slug, run_id)
          PY

      - name: Deterministic contract checks
        if: steps.render.outputs.changed == 'true'
        env:
          FORCE_SLUG: ${{ steps.resolve.outputs.slug }}
          VERIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || false }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          tracked = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          untracked = subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
          changed = sorted(set(tracked + untracked))
          slug = os.environ.get('FORCE_SLUG','').strip()
          run_id = os.environ.get('GITHUB_RUN_ID','').strip()
          closure_key = f'approved-central-blog-{slug}-{run_id}-v1'
          required_closure = {
            f'brain/learning/{closure_key}.json',
            f'docs/changes/{closure_key}.md',
            f'docs/development-ledger-events/{closure_key}.md',
          }
          verification_mode = os.environ.get('VERIFICATION_MODE','false').lower() == 'true'
          allowed_exact = {'blog/index.html','blog/rss.xml','sitemap.xml'} | (set() if verification_mode else required_closure)
          if not verification_mode:
              assert required_closure.issubset(changed), f'source-bound closure missing: {sorted(required_closure-set(changed))}'
          article_changes = [p for p in changed if re.fullmatch(r'blog/[a-z0-9-]+/index\.html', p)]
          unexpected = [p for p in changed if p not in allowed_exact and p not in article_changes]
          assert len(article_changes) <= 1, f'maximaal één artikelbestand toegestaan, gevonden={article_changes}; changed={changed}'
          assert not unexpected, f'onverwachte bestanden gewijzigd: {unexpected}'
          slug = os.environ.get('FORCE_SLUG','').strip()
          article_path = article_changes[0] if article_changes else f'blog/{slug}/index.html'
          assert slug or article_changes, 'slug of gewijzigd artikelbestand vereist'
          assert pathlib.Path(article_path).is_file(), f'artikelbestand ontbreekt: {article_path}'
          text = pathlib.Path(article_path).read_text(encoding='utf-8')
          assert len(re.findall(r'<h1(?:\s|>)', text)) == 1, 'exact één h1 vereist'
          m = re.search(r'<link rel="canonical" href="([^"]+)">', text)
          assert m and m.group(1).endswith('/'), 'geldige canonical vereist'
          assert '.html' not in m.group(1), 'canonical mag geen .html bevatten'
          ld = re.search(r'<script type="application/ld\+json">(.*?)</script>', text, re.S)
          assert ld, 'JSON-LD ontbreekt'
          json.loads(ld.group(1))
          pathlib.Path('/tmp/validated-approved-blog-files').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print('CONTRACT_OK', article_path, m.group(1), changed)
          PY

      - name: Commit validated candidate
        id: commit
        if: steps.render.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < /tmp/validated-approved-blog-files
          git config user.name "Bedrijfsgeheugen Publisher"
          git config user.email "actions@users.noreply.github.com"
          for path in "${changed[@]}"; do
            [ -n "$path" ] && git add -- "$path"
          done
          git commit -m "blog: publish approved central article"
          export CHANGED_FILES="$(printf '%s\n' "${changed[@]}")"
          CANDIDATE_BRANCH=$(node --input-type=module - <<'NODE'
          import { createWriterCandidate, validateWriterCandidate } from './scripts/ci/repo-writer-candidate.mjs';
          const files = String(process.env.CHANGED_FILES || '').split('\n').filter(Boolean).sort();
          const candidate = createWriterCandidate({
            writer: 'approved-central-blog',
            baseSha: process.env.BASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            changedFiles: files,
            allowedFiles: files,
            rollbackSha: process.env.BASE_SHA,
          });
          validateWriterCandidate(candidate);
          console.log(candidate.branch);
          NODE
          )
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Candidate branch publiceren
        if: steps.render.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.verification_mode)
        env:
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          remote_ref="$(git ls-remote --heads origin "$CANDIDATE_BRANCH" | awk '{print $1}')"
          if [ -z "$remote_ref" ]; then
            git push origin "HEAD:$CANDIDATE_BRANCH"
            exit 0
          fi

          git fetch --no-tags origin "refs/heads/$CANDIDATE_BRANCH:refs/remotes/origin/$CANDIDATE_BRANCH"
          remote_parent="$(git rev-parse "refs/remotes/origin/$CANDIDATE_BRANCH^")"
          if [ "$remote_parent" != "$BASE_SHA" ]; then
            echo "::error::REMOTE_PARENT_DRIFT:$CANDIDATE_BRANCH:$remote_parent:$BASE_SHA"
            exit 1
          fi
          git push \
            --force-with-lease=refs/heads/$CANDIDATE_BRANCH:$remote_ref \
            origin "HEAD:$CANDIDATE_BRANCH"

      - name: Candidate PR openen
        id: pr
        if: steps.render.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.verification_mode)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          SOURCE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          PR_BODY="$(python3 - <<'PY'
          import json, os, pathlib, re
          lines=[line for line in pathlib.Path('/tmp/publish-result.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          q=json.loads(lines[-1])
          source=str(q.get('content_id') or '').strip()
          page=str(q.get('queue_page') or '').strip()
          source_hash=str(q.get('source_hash') or '').strip()
          base=str(os.environ.get('SOURCE_SHA') or '')
          paths=[p for p in pathlib.Path('/tmp/validated-approved-blog-files').read_text().splitlines() if p.strip()]
          if not (source and re.fullmatch(r'[0-9a-f-]{36}',page) and re.fullmatch(r'[a-f0-9]{64}',source_hash) and re.fullmatch(r'[a-f0-9]{40}',base) and len(paths) == 7):
              raise SystemExit('CANONICAL_PR_BODY_SOURCE_OR_CLOSURE_INVALID')
          print('Obligation-ID: approved-central-blog|'+source+'|'+page)
          print('Delivery-Lane: website')
          print('Candidate-Type: implementation')
          print('Base-SHA: '+base)
          print('Change-Scope: '+', '.join(paths))
          print('Scope-Budget: '+str(len(paths)))
          print('Supersedes: none')
          print()
          print('Original BRAIN-DELIVERY-v2 approved-central-blog writer. Source ID: '+source)
          print('Queue page: '+page+', approved hash: '+source_hash)
          print('No direct main push, self-merge, or queue Published before BG169, Netlify, external URL readback and ONE BRAIN/Heartbeat.')
          PY
          )"
          number=$(gh pr list --head "$CANDIDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            url=$(gh pr create \
              --base main \
              --head "$CANDIDATE_BRANCH" \
              --title "Approved blog candidate $GITHUB_RUN_ID" \
              --body "$PR_BODY")
            number=${url##*/}
          else
            existing_body="$(gh pr view "$number" --json body --jq '.body')"
            if ! grep -q '^Obligation-ID:' <<< "$existing_body"; then
              gh pr edit "$number" --body "$PR_BODY"
            else
              expected_obligation="$(printf '%s\\n' "$PR_BODY" | sed -n 's/^Obligation-ID: //p')"
              grep -Fqx "Obligation-ID: $expected_obligation" <<< "$existing_body" || { echo "::error::ORIGINAL_SOURCE_PR_IDENTITY_DRIFT"; exit 1; }
            fi
            echo "Candidate PR bestaat al: #$number"
          fi
          pr_base_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.base.sha')
          pr_head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.head.sha')
          pr_head_ref=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.head.ref')
          [ "$pr_head_ref" = "$CANDIDATE_BRANCH" ] || { echo "::error::PR_HEAD_REF_DRIFT:$CANDIDATE_BRANCH:$pr_head_ref"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "base_sha=$pr_base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$pr_head_sha" >> "$GITHUB_OUTPUT"
          echo "Candidate PR identity: #$number base=$pr_base_sha head=$pr_head_sha ref=$pr_head_ref"

      - name: Dispatch read-only shadow verification
        if: steps.render.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.verification_mode)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh workflow run repo-writer-candidate-shadow.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f base_sha="$BASE_SHA" \
            -f head_sha="$HEAD_SHA" \
            -f candidate_branch="$CANDIDATE_BRANCH"

      - name: BRAIN v2 handoff evidence
        if: steps.render.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.verification_mode)
        run: |
          echo "candidate_sha=${{ steps.pr.outputs.head_sha }}"
          echo "candidate_branch=${{ steps.commit.outputs.candidate_branch }}"
          echo "candidate_pr=${{ steps.pr.outputs.number }}"
          echo "candidate_pr_base_sha=${{ steps.pr.outputs.base_sha }}"
          echo "production_authority=BG169"
          echo "queue_dispatch_state=pending_until_production_proof"
          echo "direct_main_push=false"
