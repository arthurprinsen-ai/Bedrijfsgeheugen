name: Approved central blog publisher

on:
  schedule:
    - cron: '15 7,10,14,18 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optioneel: verwerk exact deze goedgekeurde centrale slug'
        required: false
        default: ''
      delivery_mode:
        description: 'BRAIN v2 staat alleen gecontroleerde candidate PR delivery toe'
        type: choice
        required: true
        default: candidate-pr
        options:
          - candidate-pr
      verification_mode:
        description: 'Gebruik uitsluitend de lokale operationele verificatie-fixture; nooit productiecontent'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-schrijven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Exacte basis vastleggen
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Seal or render exact approved article
        id: render
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FORCE_SLUG: ${{ github.event.inputs.slug }}
          VERIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || false }}
          DELIVERY_MODE: candidate-pr
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          if [ "$VERIFICATION_MODE" = "true" ]; then
            target="blog/writer-verification-approved-central/index.html"
            mkdir -p "$(dirname "$target")"
            cat > "$target" <<'HTML'
          <!doctype html>
          <html lang="nl">
          <head>
            <meta charset="utf-8">
            <title>Writer verification</title>
            <link rel="canonical" href="https://www.bedrijfsgeheugen.nl/blog/writer-verification-approved-central/">
            <script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"Writer verification"}</script>
          </head>
          <body><h1>Writer verification</h1><p>Lokale operationele verificatie; nooit publiceren.</p></body>
          </html>
          HTML
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "queue_page=" >> "$GITHUB_OUTPUT"
            echo "dispatch_attempt=0" >> "$GITHUB_OUTPUT"
          else
            python3 -B scripts/publish_approved_blog_v2.py "$FORCE_SLUG" | tee /tmp/publish-result.txt
            if grep -Eq '^(NO_ACTION:|SEALED:)' /tmp/publish-result.txt; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              python3 - <<'PY'
          import json, os, pathlib
          lines=[x for x in pathlib.Path('/tmp/publish-result.txt').read_text().splitlines() if x.strip()]
          data=json.loads(lines[-1])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"queue_page={data['queue_page']}\n")
              f.write(f"dispatch_attempt={data['dispatch_attempt']}\n")
          PY
            fi
          fi

      - name: Deterministic contract checks
        if: steps.render.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          tracked = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          untracked = subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
          changed = sorted(set(tracked + untracked))
          allowed_exact = {'blog/index.html','blog/rss.xml','sitemap.xml'}
          article = [p for p in changed if re.fullmatch(r'blog/[a-z0-9-]+/index\.html', p)]
          unexpected = [p for p in changed if p not in allowed_exact and p not in article]
          assert len(article) == 1, f'exact één artikelbestand vereist, gevonden={article}; changed={changed}'
          assert not unexpected, f'onverwachte bestanden gewijzigd: {unexpected}'
          text = pathlib.Path(article[0]).read_text(encoding='utf-8')
          assert len(re.findall(r'<h1(?:\s|>)', text)) == 1, 'exact één h1 vereist'
          m = re.search(r'<link rel="canonical" href="([^"]+)">', text)
          assert m and m.group(1).endswith('/'), 'geldige canonical vereist'
          assert '.html' not in m.group(1), 'canonical mag geen .html bevatten'
          ld = re.search(r'<script type="application/ld\+json">(.*?)</script>', text, re.S)
          assert ld, 'JSON-LD ontbreekt'
          json.loads(ld.group(1))
          pathlib.Path('/tmp/validated-approved-blog-files').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print('CONTRACT_OK', article[0], m.group(1), changed)
          PY

      - name: Commit validated candidate
        id: commit
        if: steps.render.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < /tmp/validated-approved-blog-files
          git config user.name "Bedrijfsgeheugen Publisher"
          git config user.email "actions@users.noreply.github.com"
          for path in "${changed[@]}"; do
            [ -n "$path" ] && git add -- "$path"
          done
          git commit -m "blog: publish approved central article"
          export CHANGED_FILES="$(printf '%s\n' "${changed[@]}")"
          CANDIDATE_BRANCH=$(node --input-type=module - <<'NODE'
          import { createWriterCandidate, validateWriterCandidate } from './scripts/ci/repo-writer-candidate.mjs';
          const files = String(process.env.CHANGED_FILES || '').split('\n').filter(Boolean).sort();
          const candidate = createWriterCandidate({
            writer: 'approved-central-blog',
            baseSha: process.env.BASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            changedFiles: files,
            allowedFiles: files,
            rollbackSha: process.env.BASE_SHA,
          });
          validateWriterCandidate(candidate);
          console.log(candidate.branch);
          NODE
          )
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Candidate branch publiceren
        if: steps.render.outputs.changed == 'true'
        env:
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$CANDIDATE_BRANCH"

      - name: Candidate PR openen
        id: pr
        if: steps.render.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$CANDIDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Candidate PR bestaat al: #$existing"
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url=$(gh pr create \
            --base main \
            --head "$CANDIDATE_BRANCH" \
            --title "Approved blog candidate $GITHUB_RUN_ID" \
            --body "BRAIN-DELIVERY-v2 candidate uit approved-central-blog. Base SHA: $BASE_SHA. Deze workflow pusht of merge't nooit rechtstreeks naar main. Unified Brain Delivery valideert de lane; BG169 is de productieautoriteit; Netlify en public proof moeten daarna exact groen zijn.")
          number=${url##*/}
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Candidate PR geopend: $url"

      - name: Mark queue dispatched after candidate PR handoff
        if: steps.render.outputs.changed == 'true' && steps.render.outputs.queue_page != ''
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          QUEUE_PAGE: ${{ steps.render.outputs.queue_page }}
          DISPATCH_ATTEMPT: ${{ steps.render.outputs.dispatch_attempt }}
          RUN_ID: ${{ github.run_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -B scripts/publish_approved_blog_v2.py --mark-dispatched "$QUEUE_PAGE" "$DISPATCH_ATTEMPT" "$RUN_ID"

      - name: BRAIN v2 handoff evidence
        if: steps.render.outputs.changed == 'true'
        run: |
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_branch=${{ steps.commit.outputs.candidate_branch }}"
          echo "candidate_pr=${{ steps.pr.outputs.number }}"
          echo "production_authority=BG169"
          echo "direct_main_push=false"
