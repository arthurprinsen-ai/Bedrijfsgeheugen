name: Social Delivery Guarantee

on:
  pull_request:
    paths:
      - 'platform/social-delivery-guarantee.mjs'
      - 'netlify/functions/social-publication-delivery.mjs'
      - 'supabase/functions/content-operations/**'
      - 'tests/social-delivery-guarantee.test.mjs'
      - '.github/workflows/social-delivery-guarantee.yml'
  push:
    branches: [main]
    paths:
      - 'platform/social-delivery-guarantee.mjs'
      - 'netlify/functions/social-publication-delivery.mjs'
      - 'supabase/functions/content-operations/**'
      - 'tests/social-delivery-guarantee.test.mjs'
      - '.github/workflows/social-delivery-guarantee.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Social delivery guarantee contract
        run: node --test tests/social-delivery-guarantee.test.mjs
      - name: Netlify delivery function syntax
        run: node --check netlify/functions/social-publication-delivery.mjs
