name: Repository Writer Operational Verification

on:
  workflow_dispatch:
    inputs:
      writer:
        description: 'Repository writer to verify'
        required: true
        type: choice
        options:
          - menu-balk-fix
          - regelgeving-bijwerken
          - seo-controle
          - paginacontrole
          - approved-central-blog
          - blog-bijwerken
          - weekblog
      base_sha:
        description: 'Expected protected-main SHA used as comparison base'
        required: true
        type: string
      verify_ref:
        description: 'Exact ref to execute; main or verify/<writer>-*'
        required: true
        type: string
      verify_sha:
        description: 'Exact commit SHA expected at verify_ref'
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: repo-writer-operational-${{ inputs.writer }}-${{ inputs.verify_sha }}
  cancel-in-progress: true

jobs:
  dispatch-writer-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      WRITER: ${{ inputs.writer }}
      EXPECTED_MAIN_SHA: ${{ inputs.base_sha }}
      VERIFY_REF: ${{ inputs.verify_ref }}
      VERIFY_SHA: ${{ inputs.verify_sha }}
    steps:
      - name: Validate exact execution ref identity
        shell: bash
        run: |
          set -euo pipefail
          case "$VERIFY_REF" in
            main) ;;
            verify/"$WRITER"-*) ;;
            *) echo "::error::UNSUPPORTED_VERIFY_REF:$WRITER:$VERIFY_REF"; exit 1 ;;
          esac

          actual_verify_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$VERIFY_REF" --jq '.object.sha')"
          [ "$actual_verify_sha" = "$VERIFY_SHA" ] || {
            echo "::error::VERIFY_SHA_DRIFT:$VERIFY_REF:$VERIFY_SHA:$actual_verify_sha"
            exit 1
          }
          echo "VERIFY_IDENTITY_EXACT:$WRITER:$VERIFY_REF:$VERIFY_SHA"

      - name: Resolve writer contract
        id: writer
        shell: bash
        run: |
          set -euo pipefail
          case "$WRITER" in
            menu-balk-fix)
              WORKFLOW='menu-balk-fix.yml'; EXTRA='none' ;;
            regelgeving-bijwerken)
              WORKFLOW='regelgeving-bijwerken.yml'; EXTRA='none' ;;
            seo-controle)
              WORKFLOW='seo-controle.yml'; EXTRA='seo-all' ;;
            paginacontrole)
              WORKFLOW='paginacontrole.yml'; EXTRA='none' ;;
            approved-central-blog)
              WORKFLOW='approved-central-blog.yml'; EXTRA='verification' ;;
            blog-bijwerken)
              WORKFLOW='blog-bijwerken.yml'; EXTRA='verification' ;;
            weekblog)
              WORKFLOW='weekblog.yml'; EXTRA='none' ;;
            *) echo "::error::UNSUPPORTED_WRITER:$WRITER"; exit 1 ;;
          esac
          echo "workflow=$WORKFLOW" >> "$GITHUB_OUTPUT"
          echo "extra=$EXTRA" >> "$GITHUB_OUTPUT"

      - name: Verify current-main scope compatibility
        shell: bash
        run: |
          set -euo pipefail
          actual_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$actual_main_sha" = "$EXPECTED_MAIN_SHA" ]; then
            echo "CURRENT_MAIN_EXACT:$actual_main_sha"
            exit 0
          fi

          verify_files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_MAIN_SHA}...${VERIFY_SHA}" --jq '.files[].filename' | sort -u)"
          main_files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_MAIN_SHA}...${actual_main_sha}" --jq '.files[].filename' | sort -u)"
          overlap="$(comm -12 <(printf '%s\n' "$verify_files" | sed '/^$/d') <(printf '%s\n' "$main_files" | sed '/^$/d') || true)"

          if [ -n "$overlap" ]; then
            echo "::error::CURRENT_MAIN_SCOPE_OVERLAP:$EXPECTED_MAIN_SHA:$actual_main_sha"
            printf '%s\n' "$overlap"
            exit 1
          fi

          echo "CURRENT_MAIN_ZERO_OVERLAP:$EXPECTED_MAIN_SHA:$actual_main_sha"

      - name: Dispatch real writer in candidate mode only
        shell: bash
        env:
          WORKFLOW: ${{ steps.writer.outputs.workflow }}
          EXTRA: ${{ steps.writer.outputs.extra }}
        run: |
          set -euo pipefail
          args=(workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$VERIFY_REF" -f delivery_mode=candidate-pr)
          case "$EXTRA" in
            none) ;;
            seo-all) args+=(-f alles=true) ;;
            verification) args+=(-f verification_mode=true) ;;
            *) echo "::error::UNSUPPORTED_WRITER_EXTRA:$EXTRA"; exit 1 ;;
          esac
          gh "${args[@]}"
          echo "WRITER_OPERATIONAL_DISPATCHED:$WRITER:$VERIFY_REF:$VERIFY_SHA"
          echo "Candidate creation and immutable Shadow verification continue event-driven in the writer workflow."
