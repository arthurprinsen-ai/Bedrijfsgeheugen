name: SEO growth intelligence
on:
  push:
    branches: [main, feat/seo-to-order-intelligence-loop-final-20260905]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test tests/seo-growth-*.test.mjs tests/seo-order-money-v2.test.mjs tests/seo-order-blog-v2.test.mjs tests/seo-order-measurement.test.mjs
