name: Predictive First-Mover v1

on:
  pull_request:
    paths:
      - 'supabase/migrations/*predictive_first_mover_intelligence_v1.sql'
      - 'supabase/functions/powerhouse-predictive-engine/**'
      - 'supabase/functions/powerhouse-forecast-calibrator/**'
      - 'tests/predictive-first-mover-contract.test.mjs'
      - '.github/workflows/predictive-first-mover-v1.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*predictive_first_mover_intelligence_v1.sql'
      - 'supabase/functions/powerhouse-predictive-engine/**'
      - 'supabase/functions/powerhouse-forecast-calibrator/**'
      - 'tests/predictive-first-mover-contract.test.mjs'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Predictive v1 contract tests
        run: node --test tests/predictive-first-mover-contract.test.mjs
