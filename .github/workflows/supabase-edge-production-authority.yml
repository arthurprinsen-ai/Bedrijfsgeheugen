name: Supabase Edge Production Authority

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-edge-production-authority.yml'
      - 'tools/supabase/publish-edge-provider-readback.mjs'
      - 'tools/supabase/publish-migration-provider-readback.mjs'
      - 'brain/contracts/production-readback-v1.json'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Comma-separated function slugs to attest from exact current main; blank derives from the current main commit'
        required: false
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: supabase-edge-production-authority
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PROJECT_REF: adhjwmvyoixzjtmiroln
    steps:
      - name: Checkout exact protected-main candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove trusted protected-main lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::SUPABASE_EDGE_PRODUCTION_NON_MAIN_FORBIDDEN"
            exit 78
          }
          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$GITHUB_SHA" "$CURRENT_MAIN" || {
            echo "::error::SUPABASE_EDGE_PRODUCTION_NON_ANCESTOR_MAIN current=$CURRENT_MAIN candidate=$GITHUB_SHA"
            exit 78
          }
          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            git diff --quiet "$GITHUB_SHA" "$CURRENT_MAIN" -- supabase/functions supabase/config.toml || {
              echo "::error::SUPABASE_EDGE_PRODUCTION_RUNTIME_ADVANCED current=$CURRENT_MAIN candidate=$GITHUB_SHA"
              exit 78
            }
          fi
          echo "OBSERVED_MAIN=$CURRENT_MAIN" >> "$GITHUB_ENV"

      - name: Resolve exact function set
        id: scope
        shell: bash
        env:
          REQUESTED_FUNCTIONS: ${{ inputs.functions || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/functions.txt
          target_pr=""
          target_merge_sha=""
          if [ -n "${REQUESTED_FUNCTIONS// /}" ]; then
            tr ',' '\n' <<<"$REQUESTED_FUNCTIONS" | sed 's/^ *//;s/ *$//' | grep -E '^[a-z0-9][a-z0-9-]*$' | sort -u > /tmp/functions.txt
          else
            base="$BEFORE_SHA"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="${GITHUB_SHA}^"
            fi
            git diff --name-only "$base" "$GITHUB_SHA" > /tmp/changed-paths.txt
            node tools/supabase/edge-runtime-scope.mjs /tmp/changed-paths.txt > /tmp/functions.txt

            if [ ! -s /tmp/functions.txt ] && [ "$GITHUB_EVENT_NAME" = push ]; then
              current_pr_body="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .body // ""' 2>/dev/null || true)"
              target_pr="$(printf '%s\n' "$current_pr_body" | sed -nE 's/^Terminal-Replay-PR:[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' | tail -n1)"
              if [ -n "$target_pr" ]; then
                target_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$target_pr")"
                target_merge_sha="$(jq -r '.merge_commit_sha // ""' <<<"$target_json")"
                target_merged="$(jq -r '.merged // false' <<<"$target_json")"
                [ "$target_merged" = true ] && [[ "$target_merge_sha" =~ ^[0-9a-f]{40}$ ]] || {
                  echo "::error::SUPABASE_REPLAY_TARGET_NOT_MERGED:$target_pr"
                  exit 78
                }
                git fetch --no-tags origin "$target_merge_sha" >/dev/null 2>&1 || true
                git diff --quiet "$target_merge_sha" "$GITHUB_SHA" -- supabase/functions supabase/config.toml || {
                  echo "::error::SUPABASE_REPLAY_RUNTIME_SUPERSEDED:target_pr=$target_pr target_merge=$target_merge_sha current=$GITHUB_SHA"
                  exit 78
                }
                gh api "repos/${GITHUB_REPOSITORY}/pulls/$target_pr/files?per_page=100" --paginate --jq '.[].filename' > /tmp/changed-paths.txt
                node tools/supabase/edge-runtime-scope.mjs /tmp/changed-paths.txt > /tmp/functions.txt
              fi
            fi
          fi
          echo "target_pr=$target_pr" >> "$GITHUB_OUTPUT"
          echo "target_merge_sha=$target_merge_sha" >> "$GITHUB_OUTPUT"
          while IFS= read -r fn; do
            [ -d "supabase/functions/$fn" ] || {
              echo "::error::SUPABASE_EDGE_FUNCTION_NOT_IN_CURRENT_MAIN:$fn"
              exit 78
            }
            grep -Fqx "[functions.$fn]" supabase/config.toml || {
              echo "::error::SUPABASE_EDGE_FUNCTION_NOT_DECLARED_IN_CONFIG:$fn"
              exit 78
            }
          done < /tmp/functions.txt
          if [ ! -s /tmp/functions.txt ]; then
            echo "No Supabase Edge function source changed; provider attestation not applicable."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "applicable=true" >> "$GITHUB_OUTPUT"
          echo "Protected-main function set:"
          cat /tmp/functions.txt

      - id: migration_scope
        name: Resolve exact migration set
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/migrations.txt
          base="$BEFORE_SHA"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="${GITHUB_SHA}^"
          fi
          git diff --name-only "$base" "$GITHUB_SHA" \
            | grep -E '^supabase/migrations/[0-9]{14}_[A-Za-z0-9_]+\.sql$' \
            | sort -u > /tmp/migrations.txt || true

          if [ ! -s /tmp/migrations.txt ]; then
            echo "No Supabase migration changed; migration provider attestation not applicable."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target_pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .number // empty')"
          [ -n "$target_pr" ] || {
            echo "::error::SUPABASE_MIGRATION_TARGET_PR_MISSING:${GITHUB_SHA}"
            exit 78
          }

          while IFS= read -r migration_path; do
            [ -f "$migration_path" ] || {
              echo "::error::SUPABASE_MIGRATION_NOT_IN_CURRENT_MAIN:$migration_path"
              exit 78
            }
          done < /tmp/migrations.txt

          echo "target_pr=$target_pr" >> "$GITHUB_OUTPUT"
          echo "applicable=true" >> "$GITHUB_OUTPUT"
          echo "Protected-main migration set:"
          cat /tmp/migrations.txt

      - name: Publish exact migration provider readback evidence to merged PR
        if: steps.migration_scope.outputs.applicable == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PR_NUMBER: ${{ steps.migration_scope.outputs.target_pr }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/supabase/publish-migration-provider-readback.mjs

      - name: Capture immutable protected-main source identity
        if: steps.scope.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/supabase-edge-production-readback
          PROJECT_REF="$PROJECT_REF" GITHUB_SHA="$GITHUB_SHA" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const functions=fs.readFileSync('/tmp/functions.txt','utf8').split(/\r?\n/).filter(Boolean);
          const walk=(root,dir=root,out=[])=>{
            for(const name of fs.readdirSync(dir).sort()){
              const full=path.join(dir,name);
              const stat=fs.statSync(full);
              if(stat.isDirectory()) walk(root,full,out);
              else if(stat.isFile()) out.push([path.relative(root,full).replaceAll('\\','/'),full]);
            }
            return out;
          };
          const rows=[];
          for(const fn of functions){
            const root=path.join('supabase','functions',fn);
            const hash=crypto.createHash('sha256');
            for(const [relative,full] of walk(root)){
              hash.update(relative); hash.update('\0'); hash.update(fs.readFileSync(full)); hash.update('\0');
            }
            rows.push({function:fn,source_tree_sha256:hash.digest('hex')});
          }
          fs.writeFileSync('.artifacts/supabase-edge-production-readback/source-tree-sha256.json',JSON.stringify({
            project_ref:process.env.PROJECT_REF,
            protected_main_sha:process.env.GITHUB_SHA,
            functions:rows
          },null,2)+'\n');
          NODE
          printf 'candidate_sha=%s\nobserved_main=%s\nproject_ref=%s\nprovider_deployer=SUPABASE_GITHUB_INTEGRATION\ngithub_actions_role=ATTESTATION_ONLY\n' \
            "$GITHUB_SHA" "$OBSERVED_MAIN" "$PROJECT_REF" > .artifacts/supabase-edge-production-readback/authority.txt

      - name: Observe Supabase GitHub deployment check
        id: provider
        if: steps.scope.outputs.applicable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const repo=process.env.GITHUB_REPOSITORY;
          const sha=process.env.GITHUB_SHA;
          const token=process.env.GH_TOKEN;
          const headers={
            authorization:`Bearer ${token}`,
            accept:'application/vnd.github+json',
            'x-github-api-version':'2022-11-28'
          };
          const response=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers});
          if(!response.ok) throw new Error(`GITHUB_CHECKS_READ_FAILED:${response.status}:${sha}`);
          const payload=await response.json();
          const checks=(payload.check_runs||[])
            .filter(check=>check?.app?.slug==='supabase' && check?.name==='Supabase Preview')
            .sort((a,b)=>Number(b.id||0)-Number(a.id||0));
          const selected=checks[0]||null;
          const evidence={
            contract:'supabase-edge-production-authority-v4',
            provider_signal:'supabase-github-integration',
            protected_main_sha:sha,
            check_run_id:selected?.id||null,
            status:selected?.status||'missing',
            conclusion:selected?.conclusion||null,
            details_url:selected?.details_url||null,
            blocking:false,
            authority:'provider-source-parity',
            observed_at:new Date().toISOString()
          };
          fs.writeFileSync('.artifacts/supabase-edge-production-readback/provider-check.json',JSON.stringify(evidence,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`check_run_id=${selected?.id||'none'}\nanchor_sha=${sha}\n`);
          console.log(JSON.stringify(evidence));
          NODE

      - name: Install pinned Supabase CLI for read-only provider parity
        if: steps.scope.outputs.applicable == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Prove byte-for-byte provider source parity
        if: steps.scope.outputs.applicable == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::SUPABASE_ACCESS_TOKEN_REQUIRED_FOR_READ_ONLY_PROVIDER_PARITY"
            exit 78
          }
          mkdir -p .artifacts/supabase-edge-production-readback/provider
          converged=false
          for attempt in $(seq 1 24); do
            : > .artifacts/supabase-edge-production-readback/provider/source-sha256.txt
            attempt_ok=true
            while IFS= read -r fn; do
              root="/tmp/supabase-readback/$fn"
              rm -rf "$root"
              mkdir -p "$root"
              if ! (
                cd "$root"
                supabase functions download "$fn" --project-ref "$PROJECT_REF" --use-api
              ); then
                attempt_ok=false
                break
              fi
              source_root="supabase/functions/$fn"
              provider_root="$root/supabase/functions/$fn"
              if [ ! -d "$provider_root" ]; then
                attempt_ok=false
                break
              fi
              # Supabase provider readback returns deployable runtime source, not local function metadata
              # such as deno.json. Immutable source identity above still hashes every Git file.
              find "$source_root" -type f ! -name 'deno.json' -printf '%P\n' | sort > "/tmp/$fn-source-files.txt"
              find "$provider_root" -type f ! -name 'deno.json' -printf '%P\n' | sort > "/tmp/$fn-provider-files.txt"
              if ! cmp -s "/tmp/$fn-source-files.txt" "/tmp/$fn-provider-files.txt"; then
                attempt_ok=false
                break
              fi
              while IFS= read -r rel; do
                if ! cmp -s "$source_root/$rel" "$provider_root/$rel"; then
                  attempt_ok=false
                  break
                fi
              done < "/tmp/$fn-source-files.txt"
              [ "$attempt_ok" = true ] || break
              cp "/tmp/$fn-source-files.txt" ".artifacts/supabase-edge-production-readback/provider/$fn-files.txt"
              while IFS= read -r rel; do
                sha256sum "$source_root/$rel" | awk -v fn="$fn" -v rel="$rel" -v rev="$GITHUB_SHA" '{print fn" "rel" "$1" "rev}' \
                  >> .artifacts/supabase-edge-production-readback/provider/source-sha256.txt
              done < "/tmp/$fn-source-files.txt"
            done < /tmp/functions.txt
            if [ "$attempt_ok" = true ]; then
              converged=true
              echo "SUPABASE_EDGE_PROVIDER_SOURCE_PARITY_CONVERGED:attempt=$attempt"
              break
            fi
            echo "Provider source not converged yet: attempt=$attempt/24"
            sleep 5
          done
          [ "$converged" = true ] || {
            echo "::error::SUPABASE_EDGE_PROVIDER_SOURCE_PARITY_TIMEOUT"
            exit 78
          }
          printf 'provider_source_parity=BYTE_FOR_BYTE\nprovider_source_scope=RUNTIME_FILES_EXCLUDING_DENO_METADATA\nprovider_convergence=BOUNDED\nreadback_auth=SUPABASE_ACCESS_TOKEN_READ_ONLY\n' \
            >> .artifacts/supabase-edge-production-readback/authority.txt

      - name: Publish exact provider readback evidence to merged PR
        if: steps.scope.outputs.applicable == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PR_NUMBER: ${{ steps.scope.outputs.target_pr }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/supabase/publish-edge-provider-readback.mjs

      - name: Prove no newer Supabase runtime superseded the attested SHA
        if: steps.scope.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$GITHUB_SHA" "$CURRENT_MAIN" || {
            echo "::error::SUPABASE_EDGE_ATTESTED_SHA_NOT_MAIN_ANCESTOR current=$CURRENT_MAIN candidate=$GITHUB_SHA"
            exit 78
          }
          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            git diff --quiet "$GITHUB_SHA" "$CURRENT_MAIN" -- supabase/functions supabase/config.toml || {
              echo "::error::SUPABASE_EDGE_ATTESTATION_SUPERSEDED_BY_RUNTIME_CHANGE current=$CURRENT_MAIN candidate=$GITHUB_SHA"
              exit 78
            }
          fi
          printf 'attested_main=%s\nprovider_check_run_id=%s\ndeployment_anchor_sha=%s\n' "$CURRENT_MAIN" "${{ steps.provider.outputs.check_run_id }}" "${{ steps.provider.outputs.anchor_sha }}" >> .artifacts/supabase-edge-production-readback/authority.txt

      - name: Record non-applicable authority state
        if: steps.scope.outputs.applicable != 'true'
        shell: bash
        run: |
          mkdir -p .artifacts/supabase-edge-production-readback
          printf 'candidate_sha=%s\nproject_ref=%s\nstate=NOT_APPLICABLE\n' "$GITHUB_SHA" "$PROJECT_REF" > .artifacts/supabase-edge-production-readback/authority.txt

      - name: Upload immutable production authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-edge-production-authority-${{ github.sha }}
          path: .artifacts/supabase-edge-production-readback/
          if-no-files-found: error
          retention-days: 90
