name: Supabase Edge Production Authority

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Comma-separated function slugs to attest from exact current main; blank derives from the current main commit'
        required: false
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: supabase-edge-production-authority
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PROJECT_REF: adhjwmvyoixzjtmiroln
    steps:
      - name: Checkout exact protected-main candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove trusted protected-main lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::SUPABASE_EDGE_PRODUCTION_NON_MAIN_FORBIDDEN"
            exit 78
          }
          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$GITHUB_SHA" "$CURRENT_MAIN" || {
            echo "::error::SUPABASE_EDGE_PRODUCTION_NON_ANCESTOR_MAIN current=$CURRENT_MAIN candidate=$GITHUB_SHA"
            exit 78
          }
          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            git diff --quiet "$GITHUB_SHA" "$CURRENT_MAIN" -- supabase/functions supabase/config.toml || {
              echo "::error::SUPABASE_EDGE_PRODUCTION_RUNTIME_ADVANCED current=$CURRENT_MAIN candidate=$GITHUB_SHA"
              exit 78
            }
          fi
          echo "OBSERVED_MAIN=$CURRENT_MAIN" >> "$GITHUB_ENV"

      - name: Resolve exact function set
        id: scope
        shell: bash
        env:
          REQUESTED_FUNCTIONS: ${{ inputs.functions || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          : > /tmp/functions.txt
          if [ -n "${REQUESTED_FUNCTIONS// /}" ]; then
            tr ',' '\n' <<<"$REQUESTED_FUNCTIONS" | sed 's/^ *//;s/ *$//' | grep -E '^[a-z0-9][a-z0-9-]*$' | sort -u > /tmp/functions.txt
          else
            base="$BEFORE_SHA"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="${GITHUB_SHA}^"
            fi
            git diff --name-only "$base" "$GITHUB_SHA" > /tmp/changed-paths.txt
            node tools/supabase/edge-runtime-scope.mjs /tmp/changed-paths.txt > /tmp/functions.txt
          fi
          while IFS= read -r fn; do
            [ -d "supabase/functions/$fn" ] || {
              echo "::error::SUPABASE_EDGE_FUNCTION_NOT_IN_CURRENT_MAIN:$fn"
              exit 78
            }
            grep -Fqx "[functions.$fn]" supabase/config.toml || {
              echo "::error::SUPABASE_EDGE_FUNCTION_NOT_DECLARED_IN_CONFIG:$fn"
              exit 78
            }
          done < /tmp/functions.txt
          if [ ! -s /tmp/functions.txt ]; then
            echo "No Supabase Edge function source changed; provider attestation not applicable."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "applicable=true" >> "$GITHUB_OUTPUT"
          echo "Protected-main function set:"
          cat /tmp/functions.txt

      - name: Capture immutable protected-main source identity
        if: steps.scope.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/supabase-edge-production-readback
          PROJECT_REF="$PROJECT_REF" GITHUB_SHA="$GITHUB_SHA" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const functions=fs.readFileSync('/tmp/functions.txt','utf8').split(/\r?\n/).filter(Boolean);
          const walk=(root,dir=root,out=[])=>{
            for(const name of fs.readdirSync(dir).sort()){
              const full=path.join(dir,name);
              const stat=fs.statSync(full);
              if(stat.isDirectory()) walk(root,full,out);
              else if(stat.isFile()) out.push([path.relative(root,full).replaceAll('\\','/'),full]);
            }
            return out;
          };
          const rows=[];
          for(const fn of functions){
            const root=path.join('supabase','functions',fn);
            const hash=crypto.createHash('sha256');
            for(const [relative,full] of walk(root)){
              hash.update(relative); hash.update('\0'); hash.update(fs.readFileSync(full)); hash.update('\0');
            }
            rows.push({function:fn,source_tree_sha256:hash.digest('hex')});
          }
          fs.writeFileSync('.artifacts/supabase-edge-production-readback/source-tree-sha256.json',JSON.stringify({
            project_ref:process.env.PROJECT_REF,
            protected_main_sha:process.env.GITHUB_SHA,
            functions:rows
          },null,2)+'\n');
          NODE
          printf 'candidate_sha=%s\nobserved_main=%s\nproject_ref=%s\nprovider_deployer=SUPABASE_GITHUB_INTEGRATION\ngithub_actions_role=ATTESTATION_ONLY\n' \
            "$GITHUB_SHA" "$OBSERVED_MAIN" "$PROJECT_REF" > .artifacts/supabase-edge-production-readback/authority.txt

      - name: Attest stable Supabase GitHub production deployment
        id: provider
        if: steps.scope.outputs.applicable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --deepen=300 origin main
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          const repo=process.env.GITHUB_REPOSITORY;
          const sha=process.env.GITHUB_SHA;
          const token=process.env.GH_TOKEN;
          const project=process.env.PROJECT_REF;
          const productionUrl=`https://supabase.com/dashboard/project/${project}`;
          const functions=fs.readFileSync('/tmp/functions.txt','utf8').split(/\r?\n/).filter(Boolean);
          const runtimePaths=['supabase/config.toml',...functions.map(fn=>`supabase/functions/${fn}`)];
          const headers={
            authorization:`Bearer ${token}`,
            accept:'application/vnd.github+json',
            'x-github-api-version':'2022-11-28'
          };
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function checksFor(commit){
            const api=`https://api.github.com/repos/${repo}/commits/${commit}/check-runs?per_page=100`;
            const response=await fetch(api,{headers});
            if(!response.ok) throw new Error(`GITHUB_CHECKS_READ_FAILED:${response.status}:${commit}`);
            const payload=await response.json();
            return (payload.check_runs||[])
              .filter(check=>check?.app?.slug==='supabase' && check?.name==='Supabase Preview')
              .filter(check=>String(check?.details_url||'')===productionUrl)
              .sort((a,b)=>Number(b.id||0)-Number(a.id||0));
          }
          function runtimeEqual(anchor){
            const result=spawnSync('git',['diff','--quiet',anchor,sha,'--',...runtimePaths],{stdio:'ignore'});
            if(result.status===0) return true;
            if(result.status===1) return false;
            throw new Error(`SUPABASE_PRODUCTION_ANCHOR_DIFF_FAILED:${anchor}:status=${result.status}`);
          }

          const currentChecks=await checksFor(sha);
          const current=currentChecks[0]||null;
          if(current?.status==='completed' && current?.conclusion && current.conclusion!=='success'){
            throw new Error(`SUPABASE_PRODUCTION_CHECK_TERMINAL_${String(current.conclusion).toUpperCase()}:id=${current.id}:sha=${sha}`);
          }

          let anchorSha=null;
          let selected=null;
          if(current?.status==='completed' && current?.conclusion==='success'){
            anchorSha=sha;
            selected=current;
          } else {
            const log=execFileSync('git',['log','--format=%H','-n','80','--',...runtimePaths],{encoding:'utf8'});
            const candidates=[...new Set(log.split(/\r?\n/).filter(Boolean))];
            for(const candidate of candidates){
              if(!runtimeEqual(candidate)) continue;
              const checks=await checksFor(candidate);
              const success=checks.find(check=>check.status==='completed' && check.conclusion==='success');
              if(success){
                anchorSha=candidate;
                selected=success;
                break;
              }
            }
          }
          if(!anchorSha || !selected){
            throw new Error(`SUPABASE_PRODUCTION_DEPLOYMENT_ANCHOR_NOT_FOUND:sha=${sha}:paths=${runtimePaths.join(',')}`);
          }

          await sleep(3000);
          const confirm=(await checksFor(anchorSha)).find(check=>String(check.id)===String(selected.id))||null;
          if(!confirm || confirm.status!=='completed' || confirm.conclusion!=='success'){
            throw new Error(`SUPABASE_PRODUCTION_ANCHOR_NOT_STABLE:anchor=${anchorSha}:id=${selected.id}`);
          }
          if(!runtimeEqual(anchorSha)){
            throw new Error(`SUPABASE_PRODUCTION_ANCHOR_RUNTIME_DRIFT:anchor=${anchorSha}:sha=${sha}`);
          }

          const evidence={
            contract:'supabase-edge-production-authority-v3',
            provider:'supabase-github-integration',
            app_slug:selected.app.slug,
            check_name:selected.name,
            check_run_id:selected.id,
            status:selected.status,
            conclusion:selected.conclusion,
            details_url:selected.details_url,
            started_at:selected.started_at,
            completed_at:selected.completed_at,
            deployment_anchor_sha:anchorSha,
            protected_main_sha:sha,
            runtime_paths:runtimePaths,
            source_equivalent_to_anchor:true,
            stable_success_observations:2,
            observed_at:new Date().toISOString()
          };
          fs.writeFileSync('.artifacts/supabase-edge-production-readback/provider-check.json',JSON.stringify(evidence,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`check_run_id=${selected.id}\nanchor_sha=${anchorSha}\n`);
          NODE

      - name: Install pinned Supabase CLI for read-only provider parity
        if: steps.scope.outputs.applicable == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Prove byte-for-byte provider source parity
        if: steps.scope.outputs.applicable == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::SUPABASE_ACCESS_TOKEN_REQUIRED_FOR_READ_ONLY_PROVIDER_PARITY"
            exit 78
          }
          mkdir -p .artifacts/supabase-edge-production-readback/provider
          while IFS= read -r fn; do
            root="/tmp/supabase-readback/$fn"
            rm -rf "$root"
            mkdir -p "$root"
            (
              cd "$root"
              supabase functions download "$fn" --project-ref "$PROJECT_REF" --use-api
            )
            source_root="supabase/functions/$fn"
            provider_root="$root/supabase/functions/$fn"
            test -d "$provider_root" || {
              echo "::error::SUPABASE_EDGE_PROVIDER_SOURCE_READBACK_MISSING:$fn"
              exit 78
            }
            find "$source_root" -type f -printf '%P\n' | sort > "/tmp/$fn-source-files.txt"
            find "$provider_root" -type f -printf '%P\n' | sort > "/tmp/$fn-provider-files.txt"
            cmp "/tmp/$fn-source-files.txt" "/tmp/$fn-provider-files.txt" || {
              echo "::error::SUPABASE_EDGE_PROVIDER_FILESET_DRIFT:$fn"
              exit 78
            }
            while IFS= read -r rel; do
              cmp "$source_root/$rel" "$provider_root/$rel" || {
                echo "::error::SUPABASE_EDGE_PROVIDER_SOURCE_DRIFT:$fn:$rel"
                exit 78
              }
            done < "/tmp/$fn-source-files.txt"
            sha256sum "$source_root"/** 2>/dev/null || true
            cp "/tmp/$fn-source-files.txt" ".artifacts/supabase-edge-production-readback/provider/$fn-files.txt"
            while IFS= read -r rel; do
              sha256sum "$source_root/$rel" | awk -v fn="$fn" -v rel="$rel" -v rev="$GITHUB_SHA" '{print fn" "rel" "$1" "rev}' \
                >> .artifacts/supabase-edge-production-readback/provider/source-sha256.txt
            done < "/tmp/$fn-source-files.txt"
          done < /tmp/functions.txt
          printf 'provider_source_parity=BYTE_FOR_BYTE\nreadback_auth=SUPABASE_ACCESS_TOKEN_READ_ONLY\n' \
            >> .artifacts/supabase-edge-production-readback/authority.txt

      - name: Publish exact provider readback evidence to merged PR
        if: steps.scope.outputs.applicable == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/supabase/publish-edge-provider-readback.mjs

      - name: Prove no newer Supabase runtime superseded the attested SHA
        if: steps.scope.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$GITHUB_SHA" "$CURRENT_MAIN" || {
            echo "::error::SUPABASE_EDGE_ATTESTED_SHA_NOT_MAIN_ANCESTOR current=$CURRENT_MAIN candidate=$GITHUB_SHA"
            exit 78
          }
          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            git diff --quiet "$GITHUB_SHA" "$CURRENT_MAIN" -- supabase/functions supabase/config.toml || {
              echo "::error::SUPABASE_EDGE_ATTESTATION_SUPERSEDED_BY_RUNTIME_CHANGE current=$CURRENT_MAIN candidate=$GITHUB_SHA"
              exit 78
            }
          fi
          printf 'attested_main=%s\nprovider_check_run_id=%s\ndeployment_anchor_sha=%s\n' "$CURRENT_MAIN" "${{ steps.provider.outputs.check_run_id }}" "${{ steps.provider.outputs.anchor_sha }}" >> .artifacts/supabase-edge-production-readback/authority.txt

      - name: Record non-applicable authority state
        if: steps.scope.outputs.applicable != 'true'
        shell: bash
        run: |
          mkdir -p .artifacts/supabase-edge-production-readback
          printf 'candidate_sha=%s\nproject_ref=%s\nstate=NOT_APPLICABLE\n' "$GITHUB_SHA" "$PROJECT_REF" > .artifacts/supabase-edge-production-readback/authority.txt

      - name: Upload immutable production authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-edge-production-authority-${{ github.sha }}
          path: .artifacts/supabase-edge-production-readback/
          if-no-files-found: error
          retention-days: 90
