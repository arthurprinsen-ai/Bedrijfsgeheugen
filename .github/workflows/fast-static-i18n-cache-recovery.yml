name: Fast Static I18N Cache Recovery
on:
  push:
    branches:
      - diag/netlify-i18n-cache-fast
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm install --no-audit --no-fund
      - name: Reproduce pre-i18n source
        run: |
          set -euxo pipefail
          node tools/site-shell/pricing-build-integrity.mjs capture
          node tools/bouw-powerhouse-auth.mjs
          node tools/bouw-kennisindex.mjs
          node tools/bouw-v18-production.mjs
          node tools/apply-tabbladen.mjs
          node tools/bouw-v18-views.mjs
          node tools/bouw-v18-chrome-alles.mjs
          node tools/prijzen-uit-de-homepage.mjs
          node tools/site-shell/pricing-build-integrity.mjs restore
          node tools/site-shell/apply-i18n.mjs
      - name: Generate cache fast
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STATIC_I18N_NETWORK: '1'
          STATIC_I18N_REQUIRE_CACHE: '0'
          STATIC_I18N_CONCURRENCY: '8'
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY Actions secret missing"; exit 78; }
          node tools/site-shell/build-localized-routes.mjs
      - name: Verify offline completeness
        env:
          STATIC_I18N_NETWORK: '0'
          STATIC_I18N_REQUIRE_CACHE: '1'
        run: node tools/site-shell/build-localized-routes.mjs --validate-cache
      - name: Persist only cache
        run: |
          git checkout -- tools/site-shell/build-localized-routes.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/bg-static-i18n-en.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(i18n): complete immutable production translation cache"
          git push origin HEAD:diag/netlify-i18n-cache-fast
