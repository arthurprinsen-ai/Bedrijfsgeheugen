name: Migrate remaining writers to BRAIN v2

on:
  push:
    branches:
      - fix/brain-v2-migrate-remaining-writers
    paths:
      - scripts/ci/migrate-remaining-writers-v2.mjs
      - .github/workflows/migrate-remaining-writers-v2.yml

permissions:
  contents: write

concurrency:
  group: brain-v2-writer-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: fix/brain-v2-migrate-remaining-writers
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply deterministic migration
        run: node scripts/ci/migrate-remaining-writers-v2.mjs
      - name: Verify all seven writers before commit
        run: |
          node --test \
            tests/blog-update-writer-candidate-mode.test.mjs \
            tests/weekblog-writer-candidate-mode.test.mjs \
            tests/paginacontrole-writer-candidate-mode.test.mjs \
            tests/repository-writer-structural-parity.test.mjs \
            tests/repo-writer-v2-no-direct-main.test.mjs
      - name: Commit migrated workflows and tests
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Migration already applied.'
            echo "MIGRATION_COMMIT=$(git rev-parse HEAD)"
            exit 0
          fi
          git config user.name 'BRAIN v2 Migration'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            .github/workflows/blog-bijwerken.yml \
            .github/workflows/paginacontrole.yml \
            .github/workflows/weekblog.yml \
            .github/workflows/shared-agent-memory-tests.yml \
            tests/blog-update-writer-candidate-mode.test.mjs \
            tests/weekblog-writer-candidate-mode.test.mjs \
            tests/paginacontrole-writer-candidate-mode.test.mjs \
            tests/repository-writer-structural-parity.test.mjs
          git commit -m 'fix: migrate remaining repository writers to BRAIN v2'
          echo "MIGRATION_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:fix/brain-v2-migrate-remaining-writers
