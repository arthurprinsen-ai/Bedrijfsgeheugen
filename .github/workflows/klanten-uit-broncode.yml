name: Klantgegevens uit de broncode

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  aanpassen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Blok inkorten tot alleen de demo
        run: |
          python3 - <<'PY'
          import re, json, sys
          p = 'klantportaal.html'
          h = open(p, encoding='utf-8').read()
          m = re.search(r'<script>window\.__KLANTEN__ = (\{.*?\});</script>', h, re.S)
          if not m:
              print('Blok niet gevonden - is het al aangepast?')
              sys.exit(1)
          d = json.loads(m.group(1))
          if 'demo' not in d:
              print('Geen demo in het blok, gestopt voor de zekerheid')
              sys.exit(1)
          weg = [k for k in d if k != 'demo']
          nieuw = ('<script>window.__KLANTEN__ = '
                   + json.dumps({'demo': d['demo']}, ensure_ascii=False) + ';\n'
                   'try{var s=new URLSearchParams(location.search).get("klant");'
                   'if(s){var v=sessionStorage.getItem("bg_klant_"+s);'
                   'if(v)window.__KLANTEN__[s]=JSON.parse(v);}}catch(e){}</script>')
          open(p, 'w', encoding='utf-8').write(h[:m.start()] + nieuw + h[m.end():])
          print('Uit de broncode gehaald:', ', '.join(weg))
          print('Bestand was', len(h), 'tekens, nu', len(open(p, encoding='utf-8').read()))
          PY

      - name: Controleren dat er geen prijzen meer in staan
        run: |
          if grep -q '"emails": \["' klantportaal.html; then
            echo 'Er staan nog e-mailadressen van klanten in de broncode'; exit 1
          fi
          echo 'Geen klantgegevens meer in de broncode'

      - name: Pull request aanmaken
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git checkout -b klantgegevens-eruit
          git commit -am 'Klantgegevens uit de broncode; offerte komt na inloggen uit Supabase'
          git push -u origin klantgegevens-eruit --force
          gh pr create --base main --head klantgegevens-eruit \
            --title 'Klantgegevens uit de broncode halen' \
            --body 'Laat alleen de demo in window.__KLANTEN__ staan. De offerte van een echte klant komt voortaan uit Supabase, nadat portaalslot.js die persoon heeft ingelogd. Zonder inloggen geeft de database niets terug.'
