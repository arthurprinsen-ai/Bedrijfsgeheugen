name: Live Preview Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'v18-full/**'
      - 'tools/**'
      - 'assets/kop.css'
      - 'assets/js/menu.js'
      - 'assets/shared-mobile-drilldown.css'
      - 'assets/v18-mobile-drilldown.css'
      - 'assets/js/v18-mobile-drilldown.js'
      - 'tests/integration/v18-live-runtime.spec.js'
      - 'tests/live-preview-exact-head.test.mjs'
      - 'netlify.toml'
      - '.github/workflows/live-preview-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify checkout matches pull request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$HEAD_SHA" ]; then
            echo "::error::checkout head mismatch: expected $HEAD_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "Exact preview checkout verified: $ACTUAL_SHA"

      - name: Wait for Netlify status on current head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 36); do
            json=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status")
            state=$(printf '%s' "$json" | jq -r '.statuses[] | select(.context == "netlify/bedrijfsgeheugen/deploy-preview") | .state' | head -n1)
            if [ "$state" = "success" ]; then exit 0; fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "::error::Netlify preview failed for $HEAD_SHA: $state"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Netlify preview status for $HEAD_SHA"
          exit 1

      - name: Fetch current Netlify preview
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: curl -fsS --max-time 20 "$PREVIEW_URL/" -o /tmp/index.html

      - name: Verify V18.8 production HTML contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/index.html', 'utf8');
          const head = (html.match(/<head[\s\S]*?<\/head>/i) || [''])[0].toLowerCase();
          if (!html.includes("window.__BG_PRODUCTION_VERSION__='V18.8'")) throw new Error('V18.8 production marker missing');
          if (!html.includes('id="heroBackgroundVideo"')) throw new Error('V18 hero video element missing');
          if (!html.includes('/assets/openart-hero-iphone-safe-v1.mp4')) throw new Error('accepted local hero media missing');
          if (head.includes('noindex') || head.includes('nofollow')) throw new Error('crawler-blocking preview metadata leaked into production candidate');
          if (!head.includes('https://bedrijfsgeheugen.nl/')) throw new Error('production canonical missing');
          console.log('Live preview V18.8 HTML contract OK');
          NODE

      - name: Verify local hero video asset
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: |
          curl -fsS --max-time 20 --range 0-1023 \
            "$PREVIEW_URL/assets/openart-hero-iphone-safe-v1.mp4" \
            -o /tmp/hero-video.bin
          test -s /tmp/hero-video.bin

      - name: Install Playwright runtime and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify V18.8 browser runtime and inspect navigation
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: npx playwright test tests/integration/v18-live-runtime.spec.js --workers=1

      - name: Capture V18.8 desktop and mobile preview
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: |
          mkdir -p visual-review
          npx playwright screenshot --wait-for-timeout 2000 --full-page --viewport-size="1440,1200" "$PREVIEW_URL/" visual-review/v18-desktop.png
          npx playwright screenshot --wait-for-timeout 2000 --full-page --viewport-size="390,844" "$PREVIEW_URL/" visual-review/v18-mobile.png

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-production-preview-visual-review
          path: visual-review/*.png
          if-no-files-found: warn
