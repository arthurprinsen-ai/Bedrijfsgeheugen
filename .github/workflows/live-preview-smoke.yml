name: Live Preview Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'v18-full/**'
      - 'tools/bouw-v18-production-core.mjs'
      - 'tools/bouw-v18-production.mjs'
      - 'site/seo-baseline.json'
      - 'assets/kop.css'
      - 'assets/js/menu.js'
      - 'assets/shared-mobile-drilldown.css'
      - 'assets/v18-mobile-drilldown.css'
      - 'assets/js/v18-mobile-drilldown.js'
      - 'tests/integration/v18-live-runtime.spec.js'
      - 'netlify.toml'
      - '.github/workflows/live-preview-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Wait for Netlify status on current head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 36); do
            json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status")
            state=$(printf '%s' "$json" | jq -r '.statuses[] | select(.context == "netlify/bedrijfsgeheugen/deploy-preview") | .state' | head -n1)
            if [ "$state" = "success" ]; then exit 0; fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "::error::Netlify preview failed for $HEAD_SHA: $state"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Netlify preview status for $HEAD_SHA"
          exit 1

      - name: Fetch current Netlify preview
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: curl -fsS --max-time 20 "$PREVIEW_URL/" -o /tmp/index.html

      - name: Detect accepted historical V18 restore
        id: mode
        shell: bash
        run: |
          if grep -Fq 'be938e95870994b89773d141a400318a1be3eac4829d69aac6bac48942bd230b' tools/bouw-v18-production-core.mjs \
             && ! grep -Fq 'apply-site-baseline.mjs' tools/bouw-v18-production.mjs; then
            echo 'legacy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'legacy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify accepted historical V18 and persistent SEO contract
        if: steps.mode.outputs.legacy == 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/index.html', 'utf8');
          const head = (html.match(/<head\b[^>]*>[\s\S]*?<\/head>/i) || [''])[0];
          const cfg = JSON.parse(fs.readFileSync('site/seo-baseline.json', 'utf8')).home;
          if (!html.includes('id="heroBackgroundVideo"')) throw new Error('historical V18 hero video element missing');
          if (!html.includes('13761469-uhd_3840_2160_30fps.mp4')) throw new Error('historical V18 Pexels hero source missing');
          if (!html.includes('view-home') || !html.includes('view-product')) throw new Error('historical V18 identity markers missing');
          if (html.includes('__BG_PRODUCTION_VERSION__') || html.includes('bgMobileNav')) throw new Error('later V18.8 overlay leaked into historical restore');
          if (!head.includes('BG_PERSISTENT_SEO_V1')) throw new Error('persistent SEO marker missing');
          if (!head.includes(`<title>${cfg.title}</title>`)) throw new Error('SEO title mismatch');
          if (!head.includes(`<meta name="description" content="${cfg.description}">`)) throw new Error('SEO description mismatch');
          if (!head.includes(`<meta name="bg-zoekwoord" content="${cfg.primaryKeyword}">`)) throw new Error('SEO keyword mismatch');
          if (!head.includes(`<link rel="canonical" href="${cfg.canonical}">`)) throw new Error('canonical mismatch');
          if (!head.includes(`<meta name="robots" content="${cfg.robots}">`)) throw new Error('robots meta mismatch');
          if (/noindex|nofollow/i.test(head)) throw new Error('crawler-blocking metadata leaked into production candidate');
          for (const marker of ['property="og:title"','property="og:description"','property="og:url"','property="og:image"','name="twitter:card" content="summary_large_image"','id="bg-seo-schema"']) {
            if (!head.includes(marker)) throw new Error(`SEO marker missing: ${marker}`);
          }
          if ((head.match(/<title>/g) || []).length !== 1) throw new Error('title must be unique');
          if ((head.match(/rel="canonical"/g) || []).length !== 1) throw new Error('canonical must be unique');
          console.log('Historical V18 + persistent SEO live preview contract OK');
          NODE

      - name: Verify V18.8 production HTML contract
        if: steps.mode.outputs.legacy != 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/index.html', 'utf8');
          const head = (html.match(/<head[\s\S]*?<\/head>/i) || [''])[0].toLowerCase();
          if (!html.includes("window.__BG_PRODUCTION_VERSION__='V18.8'")) throw new Error('V18.8 production marker missing');
          if (!html.includes('id="heroBackgroundVideo"')) throw new Error('V18 hero video element missing');
          if (!html.includes('/assets/openart-hero-iphone-safe-v1.mp4')) throw new Error('accepted local hero media missing');
          if (head.includes('noindex') || head.includes('nofollow')) throw new Error('crawler-blocking preview metadata leaked into production candidate');
          if (!head.includes('https://bedrijfsgeheugen.nl/')) throw new Error('production canonical missing');
          console.log('Live preview V18.8 HTML contract OK');
          NODE

      - name: Verify local hero video asset
        if: steps.mode.outputs.legacy != 'true'
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: |
          curl -fsS --max-time 20 --range 0-1023 "$PREVIEW_URL/assets/openart-hero-iphone-safe-v1.mp4" -o /tmp/hero-video.bin
          test -s /tmp/hero-video.bin

      - name: Install Playwright runtime and Chromium
        if: steps.mode.outputs.legacy != 'true'
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify V18.8 browser runtime and inspect navigation
        if: steps.mode.outputs.legacy != 'true'
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: npx playwright test tests/integration/v18-live-runtime.spec.js --workers=1

      - name: Capture desktop and mobile preview
        if: steps.mode.outputs.legacy != 'true'
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: |
          mkdir -p visual-review
          npx playwright screenshot --wait-for-timeout 2000 --full-page --viewport-size="1440,1200" "$PREVIEW_URL/" visual-review/v18-desktop.png
          npx playwright screenshot --wait-for-timeout 2000 --full-page --viewport-size="390,844" "$PREVIEW_URL/" visual-review/v18-mobile.png

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-production-preview-visual-review
          path: visual-review/*.png
          if-no-files-found: warn
