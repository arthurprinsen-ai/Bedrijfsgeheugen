name: Powerhouse Autonomous Engineering Optimizer

on:
  schedule:
    - cron: '27 5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: powerhouse-autonomous-engineering-optimizer
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify autonomous engineering fabric
        run: |
          node --test tests/brain-autonomous-engineering-fabric-v3.test.mjs tests/brain-engineering-tuning-candidate.test.mjs
          node scripts/brain/autonomous-engineering-fabric-v3.mjs --check
      - name: Measure current CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/brain/powerhouse-ci-intelligence.mjs
      - name: Compute bounded daily tuning
        run: node scripts/brain/autonomous-engineering-fabric-v3.mjs --optimize artifacts/ci-intelligence/latest.json
      - name: Persist safe tuning through protected PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          proposed="artifacts/engineering-optimizer/proposed-tuning.json"
          cmp -s "$proposed" config/powerhouse-engineering-tuning.json && {
            echo "No bounded tuning change needed today."
            exit 0
          }

          # A stale, invalid bot-owned tuning PR must not block the organism forever.
          # Never retire a valid candidate or any unrelated/human-owned branch.
          existing_json="$(gh pr list --state open --search 'in:title "Powerhouse: daily engineering tuning"' --limit 100 --json number,title,body,createdAt,headRefName)"
          while IFS= read -r row; do
            number="$(jq -r '.number' <<<"$row")"
            branch_name="$(jq -r '.headRefName // ""' <<<"$row")"
            body="$(jq -r '.body // ""' <<<"$row")"
            created_at="$(jq -r '.createdAt // ""' <<<"$row")"
            if [[ "$branch_name" != automation/engineering-tuning-* ]]; then
              echo "::warning::Non-optimizer PR #$number uses daily tuning title; safe automatic retirement forbidden."
              exit 1
            fi
            if grep -Eq '^Base-SHA: [0-9a-f]{40}$' <<<"$body" &&
               grep -Eq '^Change-Scope: .+' <<<"$body" &&
               grep -Eq '^Scope-Budget: [1-9][0-9]*$' <<<"$body" &&
               grep -Eq '^Obligation-ID: powerhouse-daily-engineering-tuning-' <<<"$body"; then
              echo "::notice::Existing valid tuning PR #$number remains authoritative; no duplicate."
              exit 0
            fi
            created_epoch="$(date -u -d "$created_at" +%s 2>/dev/null || echo 0)"
            now_epoch="$(date -u +%s)"
            if [ "$created_epoch" -le 0 ] || [ "$((now_epoch-created_epoch))" -lt 172800 ]; then
              echo "::warning::Recent/unknown invalid PR #$number requires evidence before retirement."
              exit 1
            fi
            gh pr comment "$number" --body "Automated retirement: >48h old bot-owned daily tuning PR lacks the mandatory protected delivery contract. Retained unmerged for audit; no gates bypassed. New tuning requires exact main, learning, change documentation and append-only development ledger."
            gh pr close "$number"
            echo "::notice::Retired stale inadmissible optimizer PR #$number; existing branch and history retained."
          done < <(printf '%s\n' "$existing_json" | jq -c '.[] | select(.title=="Powerhouse: daily engineering tuning")')

          base_sha="$(git rev-parse HEAD)"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$base_sha" != "$current_main" ]; then
            echo "::error::MAIN_EPOCH_DRIFT: checked-out $base_sha != current main $current_main; refuse stale tuning candidate."
            exit 1
          fi

          node tools/delivery/daily-engineering-tuning-candidate.mjs --write "$GITHUB_RUN_ID" "$base_sha"
          cp "$proposed" config/powerhouse-engineering-tuning.json
          slug="$(date -u +%F)-engineering-tuning-$GITHUB_RUN_ID"
          branch="automation/engineering-tuning-$GITHUB_RUN_ID"
          git config user.name "Powerhouse Engineering Optimizer"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add config/powerhouse-engineering-tuning.json \
            "brain/learning/$slug.json" \
            "docs/changes/$slug.md" \
            "docs/development-ledger-events/$slug.md"
          git commit -m "engineering: protected daily tuning with evidence closure"
          git push origin "$branch"
          url="$(gh pr create --base main --head "$branch" --title "Powerhouse: daily engineering tuning" --body-file artifacts/engineering-optimizer/pull-request-body.md)"
          # PRs created by GITHUB_TOKEN may yield action_required, not real tests.
          # GitHub permits explicit workflow_dispatch from this token. Reuse the
          # exact existing Required and CodeQL gates on the new immutable PR head.
          pr_number="$(gh pr view "$url" --json number --jq '.number')"
          head_sha="$(git rev-parse HEAD)"
          provider_head="$(gh pr view "$url" --json headRefOid --jq '.headRefOid')"
          if [ "$head_sha" != "$provider_head" ]; then
            echo "::error::EXACT_HEAD_MISMATCH: candidate $head_sha provider $provider_head"
            exit 1
          fi
          gh workflow run required-test.yml --ref "$branch" \
            -f pr_number="$pr_number" \
            -f base_sha="$base_sha" \
            -f head_sha="$head_sha" \
            -f candidate_branch="$branch"
          gh workflow run codeql.yml --ref "$branch"
          echo "::notice::EXACT_HEAD_REQUIRED_AND_CODEQL_DISPATCHED:$pr_number $head_sha; tests are pending, not green."
          if ! gh pr merge "$url" --auto --squash; then
            echo "::error::PROTECTED_AUTO_MERGE_REGISTRATION_FAILED: $url"
            exit 1
          fi
          echo "::notice::TUNING_CANDIDATE_SUBMITTED:$url -- merge, provider readback and real outcome still pending."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomous-engineering-optimizer-${{ github.run_id }}
          path: |
            artifacts/ci-intelligence/latest.json
            artifacts/engineering-optimizer/latest.json
            artifacts/engineering-optimizer/proposed-tuning.json
          if-no-files-found: warn
          retention-days: 30
