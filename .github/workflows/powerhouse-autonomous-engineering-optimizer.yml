name: Powerhouse Autonomous Engineering Optimizer

on:
  schedule:
    - cron: '27 5 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: powerhouse-autonomous-engineering-optimizer
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify autonomous engineering fabric
        run: |
          node --test tests/brain-autonomous-engineering-fabric-v3.test.mjs
          node scripts/brain/autonomous-engineering-fabric-v3.mjs --check
      - name: Measure current CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/brain/powerhouse-ci-intelligence.mjs
      - name: Compute bounded daily tuning
        run: node scripts/brain/autonomous-engineering-fabric-v3.mjs --optimize artifacts/ci-intelligence/latest.json
      - name: Persist safe tuning through protected PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          proposed="artifacts/engineering-optimizer/proposed-tuning.json"
          cp "$proposed" config/powerhouse-engineering-tuning.json

          # At most one proof-backed PR authority is retired per cycle.
          node scripts/brain/pr-authority-ratchet.mjs --apply-next
          node scripts/brain/pr-authority-ratchet.mjs --check

          if git diff --quiet -- config/powerhouse-engineering-tuning.json config/pr-authority-ratchet.json .github/workflows; then
            echo "No bounded tuning or proven PR-authority retirement needed today."
            exit 0
          fi

          existing="$(gh pr list --state open --search 'in:title "Powerhouse: daily engineering tuning"' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Existing tuning PR #$existing is still authoritative; no duplicate created."
            exit 0
          fi

          branch="automation/engineering-tuning-$GITHUB_RUN_ID"
          git config user.name "Powerhouse Engineering Optimizer"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add config/powerhouse-engineering-tuning.json config/pr-authority-ratchet.json .github/workflows
          git commit -m "Engineering: daily bounded tuning and PR authority ratchet"
          git push origin "$branch"

          base_sha="$(git rev-parse main)"
          change_scope="$(git show --pretty='' --name-only HEAD | sed '/^$/d' | paste -sd ',' -)"
          scope_budget="$(git show --pretty='' --name-only HEAD | sed '/^$/d' | wc -l | tr -d ' ')"
          body="$(cat <<EOF
Obligation-ID: powerhouse-daily-engineering-tuning-$GITHUB_RUN_ID
Delivery-Lane: automation
Candidate-Type: implementation
Base-SHA: $base_sha
Supersedes: none
Change-Scope: $change_scope
Scope-Budget: $scope_budget

Bounded autonomous tuning plus at most one proof-backed direct-PR authority retirement. Direct-PR and workflow budgets may only ratchet downward. Safety gates, exact-SHA identity, protected merge and production readback cannot be weakened by this optimizer.
EOF
)"
          url="$(gh pr create --base main --head "$branch" --title "Powerhouse: daily engineering tuning + PR authority ratchet" --body "$body")"
          gh pr merge "$url" --auto --squash || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomous-engineering-optimizer-${{ github.run_id }}
          path: |
            artifacts/ci-intelligence/latest.json
            artifacts/engineering-optimizer/latest.json
            artifacts/engineering-optimizer/proposed-tuning.json
          if-no-files-found: warn
          retention-days: 30
