name: TEMP i18n cache harvest

on:
  push:
    branches:
      - fix/netlify-i18n-cache-build-parity-20260925

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download generated preview cache
        run: |
          set -euo pipefail
          url="https://deploy-preview-3006--bedrijfsgeheugen.netlify.app/config/bg-static-i18n-en.json"
          for attempt in $(seq 1 30); do
            if curl -fsSL --max-time 20 "$url" -o bg-static-i18n-en-generated.json; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("bg-static-i18n-en-generated.json","utf8"));if(!x||Array.isArray(x)||Object.keys(x).length<9000) process.exit(2); console.log("HARVEST_CACHE_ENTRIES",Object.keys(x).length);'
              break
            fi
            sleep 5
          done
          test -s bg-static-i18n-en-generated.json
      - uses: actions/upload-artifact@v4
        with:
          name: generated-static-i18n-cache
          path: bg-static-i18n-en-generated.json
          retention-days: 1
