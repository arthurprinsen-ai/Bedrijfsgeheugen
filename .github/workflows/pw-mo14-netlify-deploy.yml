name: Deploy PW MO14-1 to Netlify
on:
  push:
    branches: [pw-mo14-1-live]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check pw-mo14-1/data.js
          node --check pw-mo14-1/player.js
          node --check pw-mo14-1/team.js
          node --check pw-mo14-1/sync.js
      - name: Test provisional team advice
        run: node pw-mo14-1/tests/partial-team.test.js
      - name: Deploy with official Netlify MCP client
        working-directory: pw-mo14-1
        run: >-
          npx -y @netlify/mcp@latest
          --site-id 1c4fa5ce-45ae-45dc-b3e2-11f90587c474
