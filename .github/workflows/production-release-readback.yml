name: Production Release Readback

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-release-readback
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  production-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - id: scope
        name: Derive affected production routes and deployment applicability
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, appendFile } from 'node:fs/promises';
          import { createDeliveryPlan } from './tools/brain-delivery-system.mjs';
          import { deriveRequiredTestSuites } from './tools/delivery-required-test-suites.mjs';
          import { classifyWebsiteRelease } from './tools/site-shell/website-release-risk.mjs';

          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changedPaths=execFileSync('git',['diff','--name-only',`${parent}...HEAD`],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean);
          const policy=JSON.parse(await readFile('config/brain-delivery-system.json','utf8'));
          const plan=changedPaths.length ? createDeliveryPlan({changedPaths,headSha:process.env.GITHUB_SHA,policy}) : {lanes:[]};
          const suites=deriveRequiredTestSuites({lanes:plan.lanes.map(lane => lane.id)});

          const readbackControlPlanePaths=new Set([
            '.github/workflows/production-release-readback.yml',
            'brain/contracts/production-readback-v1.json',
            'tests/brain-production-release-readback-scope.test.mjs',
            'tests/brain-production-promotion-observability.test.mjs',
            'tools/site-shell/verify-production-release.mjs',
          ]);
          const readbackControlPlaneOnly=changedPaths.length>0 && changedPaths.every(path => readbackControlPlanePaths.has(path));
          const readbackWorkflowChanged=changedPaths.includes('.github/workflows/production-release-readback.yml');
          const manualReadback=process.env.EVENT_NAME === 'workflow_dispatch';
          const websiteRequired=readbackControlPlaneOnly ? false : suites.website === true;
          const portalRequired=readbackControlPlaneOnly ? false : suites.portal === true;
          const browserRequired=websiteRequired || portalRequired || readbackWorkflowChanged || manualReadback;
          const netlifyRuntimePrefixes=[
            'netlify/functions/',
            'platform/api/',
            'platform/saas/',
            'platform/connectors/',
            'platform/read-models/',
          ];
          const netlifyRuntimeRequired=!readbackControlPlaneOnly && changedPaths.some(path => netlifyRuntimePrefixes.some(prefix => path.startsWith(prefix)));
          const deploymentRequired=browserRequired || netlifyRuntimeRequired;

          let routes=[];
          let riskLane='not-applicable';
          if(websiteRequired){
            const riskConfig=JSON.parse(await readFile('site/website-release-risk.json','utf8'));
            const acceptedBaseline=JSON.parse(await readFile('site/accepted-baseline.json','utf8'));
            const risk=changedPaths.length ? classifyWebsiteRelease({changedPaths,riskConfig,acceptedBaseline}) : {lane:'no-op',affected_routes:[]};
            routes=[...risk.affected_routes];
            if(routes.length===0) routes=risk.lane==='high-risk'?['/','/ai-act','/benchmark']:['/'];
            riskLane=risk.lane;
          }
          if(portalRequired && !routes.includes('/portal-v2/')) routes.push('/portal-v2/');
          if((readbackWorkflowChanged || manualReadback) && !routes.includes('/prijzen')) routes.push('/prijzen');

          await appendFile(process.env.GITHUB_OUTPUT,`routes=${JSON.stringify(routes)}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`website_required=${websiteRequired}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`portal_required=${portalRequired}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`browser_required=${browserRequired}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`deployment_required=${deploymentRequired}\n`);
          console.log(JSON.stringify({changedPaths,delivery_lanes:plan.lanes.map(lane=>lane.id),required_suites:suites,readbackControlPlaneOnly,readbackWorkflowChanged,manualReadback,website_required:websiteRequired,portal_required:portalRequired,browser_required:browserRequired,netlify_runtime_required:netlifyRuntimeRequired,deployment_required:deploymentRequired,risk_lane:riskLane,routes},null,2));
          NODE
      - name: Persist promotion-required state before waiting
        if: steps.scope.outputs.deployment_required == 'true'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p .artifacts
          node --input-type=module - <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const state={
            promotion_state:'promotion_required',
            provider:'netlify',
            expected_sha:process.env.EXPECTED_COMMIT,
            deployed_sha:null,
            netlify_deploy_id:null,
            deployment_required:true,
            observed_at:new Date().toISOString(),
          };
          await writeFile('.artifacts/production-promotion-state.json',`${JSON.stringify(state,null,2)}\n`);
          console.log(JSON.stringify(state));
          NODE
      - id: deploy
        name: Wait for exact live release marker and deploy identity
        if: steps.scope.outputs.deployment_required == 'true'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            nonce="${EXPECTED_COMMIT}-${attempt}-$(date +%s)"
            if curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/?bg_release_readback=${nonce}" -o live-home.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/prijzen?bg_release_readback=${nonce}" -o live-prijzen.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/over-ons?bg_release_readback=${nonce}" -o live-over-ons.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/release.json?bg_release_readback=${nonce}" -o live-release.json; then
              if EXPECTED_COMMIT="${EXPECTED_COMMIT}" node tools/site-shell/check-live-production.mjs; then
                if EXPECTED_COMMIT="${EXPECTED_COMMIT}" node --input-type=module - <<'NODE'
          import { appendFile, readFile, writeFile } from 'node:fs/promises';
          const release=JSON.parse(await readFile('live-release.json','utf8'));
          if(release.commit_ref !== process.env.EXPECTED_COMMIT) throw new Error(`release.json commit_ref mismatch: ${release.commit_ref}`);
          if(release.context !== 'production') throw new Error(`release.json context is not production: ${release.context}`);
          const deployId=String(release.deploy_id||'').trim();
          if(!deployId) throw new Error('release.json deploy_id is missing');
          await appendFile(process.env.GITHUB_OUTPUT,`deploy_id=${deployId}\n`);
          const state={
            promotion_state:'observed_exact_deploy',
            provider:'netlify',
            expected_sha:process.env.EXPECTED_COMMIT,
            deployed_sha:release.commit_ref,
            netlify_deploy_id:deployId,
            deployment_required:true,
            release_context:release.context,
            observed_at:new Date().toISOString(),
          };
          await writeFile('.artifacts/production-promotion-state.json',`${JSON.stringify(state,null,2)}\n`);
          console.log(JSON.stringify(state));
          NODE
                then
                  echo "deployed_sha=${EXPECTED_COMMIT}" >> "$GITHUB_OUTPUT"
                  echo "status=ready" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi
            echo "Production is not ready with exact deploy identity for ${EXPECTED_COMMIT}; retry ${attempt}/40"
            sleep 15
          done
          echo "Production never exposed exact release marker + deploy identity for ${EXPECTED_COMMIT}" >&2
          exit 1
      - name: Record exact deployment not applicable
        if: steps.scope.outputs.deployment_required != 'true'
        run: |
          mkdir -p .artifacts
          echo 'No Netlify-hosted production delivery is affected; exact SHA deployment is not applicable.'
          node --input-type=module - <<'NODE'
          import { writeFile } from 'node:fs/promises';
          await writeFile('.artifacts/production-promotion-state.json',`${JSON.stringify({promotion_state:'not_applicable',provider:'netlify',expected_sha:process.env.GITHUB_SHA,deployment_required:false,observed_at:new Date().toISOString()},null,2)}\n`);
          NODE
      - name: Verify live connector readiness contract
        run: |
          set -euo pipefail
          readiness_url="https://www.bedrijfsgeheugen.nl/api/connectors/readiness?bg_release_readback=${{ github.sha }}"
          for attempt in $(seq 1 8); do
            nonce="${{ github.sha }}-${attempt}-$(date +%s)"
            if curl -fsSL \
              --connect-timeout 10 \
              --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${readiness_url}&attempt=${nonce}" \
              -o live-connector-readiness.json; then
              if node --input-type=module - <<'NODE'
          import {readFile} from 'node:fs/promises';
          const text=await readFile('live-connector-readiness.json','utf8');
          const body=JSON.parse(text);
          if(!body || typeof body!=='object' || !body.sources || !body.targets || !body.extractor){
            throw new Error('Live connector readiness response misses capability-state sections');
          }
          if(body.extractor.configured !== true || body.extractor.state !== 'server-safe-test'){
            throw new Error(`Live document extractor is not server-configured: ${JSON.stringify(body.extractor)}`);
          }
          if(/SECRET|TOKEN|PASSWORD|API_KEY/i.test(text)){
            throw new Error('Live connector readiness response exposes a secret-like key');
          }
          console.log(JSON.stringify(body));
          NODE
              then
                echo "Connector readiness verified on attempt ${attempt}/8"
                exit 0
              fi
            fi
            echo "Connector readiness not yet healthy; retry ${attempt}/8"
            sleep 10
          done
          echo "Connector readiness stayed unhealthy after 8 attempts" >&2
          exit 1
      - name: Install production browser verifier
        if: steps.scope.outputs.browser_required == 'true'
        run: PLAYWRIGHT_PACKAGE=playwright@1.55.0 bash tools/ci/install-chromium.sh
      - id: routes
        name: Verify affected production routes
        if: steps.scope.outputs.browser_required == 'true'
        env:
          BASE_URL: https://www.bedrijfsgeheugen.nl
          ROUTES_JSON: ${{ steps.scope.outputs.routes }}
          ALLOW_EXISTING_PAGE_ERRORS: 'true'
        run: node tools/site-shell/verify-targeted-website-routes.mjs --output .artifacts/production-route-verification.json
      - name: Verify pricing interactions and English route in production
        if: steps.scope.outputs.browser_required == 'true' && steps.deploy.outcome == 'success'
        env:
          BASE_URL: https://www.bedrijfsgeheugen.nl
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/site-shell/verify-pricing-i18n-production.mjs
      - name: Evaluate immutable website production truth
        if: steps.scope.outputs.browser_required == 'true' && steps.deploy.outcome == 'success'
        run: >-
          node tools/site-shell/verify-production-release.mjs
          --merge-sha '${{ github.sha }}'
          --deployed-sha '${{ steps.deploy.outputs.deployed_sha }}'
          --deploy-status '${{ steps.deploy.outputs.status }}'
          --deploy-id '${{ steps.deploy.outputs.deploy_id }}'
          --deployment-required 'true'
          --routes-json '${{ steps.scope.outputs.routes }}'
          --routes-ok '${{ steps.routes.outcome == 'success' }}'
          --output .artifacts/production-release-readback.json
      - name: Evaluate immutable Netlify backend production truth
        if: steps.scope.outputs.deployment_required == 'true' && steps.scope.outputs.browser_required != 'true' && steps.deploy.outcome == 'success'
        run: >-
          node tools/site-shell/verify-production-release.mjs
          --merge-sha '${{ github.sha }}'
          --deployed-sha '${{ steps.deploy.outputs.deployed_sha }}'
          --deploy-status '${{ steps.deploy.outputs.status }}'
          --deploy-id '${{ steps.deploy.outputs.deploy_id }}'
          --deployment-required 'true'
          --routes-json '[]'
          --routes-ok 'true'
          --output .artifacts/production-release-readback.json
      - name: Evaluate immutable non-deployment production truth
        if: steps.scope.outputs.deployment_required != 'true'
        run: >-
          node tools/site-shell/verify-production-release.mjs
          --merge-sha '${{ github.sha }}'
          --deployment-required 'false'
          --routes-json '[]'
          --routes-ok 'true'
          --output .artifacts/production-release-readback.json
      - name: Capture production readback failure as Brain learning evidence
        if: failure()
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .artifacts
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createObservedFailure, routeObservedFailureToLearning } from './tools/delivery-learning.mjs';
          let knownLessons=[];
          try {
            const lessonsDoc=JSON.parse(await readFile('docs/brain/delivery-failure-lessons.json','utf8'));
            knownLessons=Array.isArray(lessonsDoc)?lessonsDoc:(Array.isArray(lessonsDoc.lessons)?lessonsDoc.lessons:[]);
          } catch {}
          const reason='Production release readback failed after bounded verification; contract fingerprint production-readback-http-5xx-v1. Inspect exact failed step before root-cause classification.';
          const observedFailure=createObservedFailure({
            stage: 'PRODUCTION',
            reason,
            component: 'production-readback',
            headSha: process.env.HEAD_SHA,
            evidenceRef: `github-run:${process.env.RUN_ID}`,
          });
          const route=routeObservedFailureToLearning({observedFailure,knownLessons,existingCandidates:[]});
          const evidence={
            contractFingerprint:'production-readback-http-5xx-v1',
            rootCausePolicy:'evidence-before-hypothesis',
            preventionRule:'bounded-retry-then-fail-closed',
            regressionTest:'tests/brain-production-release-readback-scope.test.mjs',
            observedFailure,
          };
          await writeFile('.artifacts/delivery-failure-production-readback.json',`${JSON.stringify(evidence,null,2)}\n`);
          await writeFile('.artifacts/delivery-learning-route-production-readback.json',`${JSON.stringify(route,null,2)}\n`);
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-readback-${{ github.sha }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Explain production readback failure
        if: failure()
        run: echo "::error::Production release readback failed for ${{ github.sha }}; inspect the failed step and uploaded readback learning artifact before retrying or promoting."
