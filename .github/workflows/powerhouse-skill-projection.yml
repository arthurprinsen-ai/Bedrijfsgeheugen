name: Powerhouse Skill Projection
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Skill projection replay PR #{0} {1}', inputs.pr_number, inputs.merge_sha) || 'Powerhouse Skill Projection' }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged same-repository PR
        required: true
        type: string
      merge_sha:
        description: Exact protected-main merge SHA
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "brain/learning/**"
      - "brain/skills/**"
      - "brain/policies/powerhouse-universal-agent-learning-writeback-v1.json"
      - ".agents/skills/**"
      - "scripts/brain/powerhouse-skill-projection.mjs"
      - "scripts/brain/learning-canonicalization-gate.mjs"
      - "scripts/brain/chat-learning-preflight.mjs"
      - "tests/brain-powerhouse-universal-agent-learning-writeback.test.mjs"
      - "tests/brain-learning-canonicalization-gate-v1.test.mjs"
      - ".github/workflows/powerhouse-skill-projection.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Supersede stale projection work for the same PR/ref.
  group: powerhouse-skill-projection-${{ github.event_name == 'workflow_dispatch' && format('replay-{0}-{1}', inputs.pr_number, inputs.merge_sha) || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  skill-projection-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Pin authorized merged learning replay
        id: replay
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$MERGE_SHA" '.merged == true and .base.ref == "main" and .head.repo.full_name == $repo and .merge_commit_sha == $sha' <<<"$pr" >/dev/null
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow origin main --no-tags
          else
            git fetch origin main --no-tags
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git merge-base --is-ancestor "$MERGE_SHA" "$GITHUB_SHA"
          parent="$(git rev-parse "$MERGE_SHA^1")"
          mapfile -t learning < <(git diff --name-only --diff-filter=AM "$parent" "$MERGE_SHA" -- brain/learning/ | grep -E '^brain/learning/.+[.]json$')
          [ "${#learning[@]}" -gt 0 ]
          git diff --quiet "$MERGE_SHA" "$GITHUB_SHA" -- "${learning[@]}"
          git checkout --detach "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          printf 'base_sha=%s\nhead_sha=%s\n' "$parent" "$MERGE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install projection-test dependencies
        run: |
          set -euo pipefail
          install_log="$(mktemp)"
          trap 'rm -f "$install_log"' EXIT
          if npm install --ignore-scripts --prefer-offline --no-audit --no-fund --loglevel=error >"$install_log" 2>&1; then
            echo "NPM_INSTALL_SUCCEEDED"
          else
            install_status=$?
            # An observed ETARGET can be caused by stale cached registry metadata.
            # Retry once with revalidation; no changed pins, registry, or lifecycle policy.
            if grep -Eq '^(npm error|npm ERR!) code ETARGET[[:space:]]*$' "$install_log"; then
              echo "NPM_INSTALL_ETARGET_REVALIDATE_ONCE"
              if npm install --ignore-scripts --prefer-online --no-audit --no-fund --loglevel=error >"$install_log" 2>&1; then
                echo "NPM_INSTALL_SUCCEEDED_AFTER_REVALIDATION"
                exit 0
              else
                install_status=$?
              fi
            fi
            # Never print raw npm output: only allowlisted, bounded error codes.
            node --input-type=module - "$install_log" <<'NODE'
          import { readFileSync } from 'node:fs';
          const log=readFileSync(process.argv[2],'utf8').slice(0,262144);
          const allowed=new Set(['EAI_AGAIN','ENOTFOUND','ECONNRESET','ECONNREFUSED','ETIMEDOUT','E401','E403','E404','E429','E500','E502','E503','E504','ETARGET','ERESOLVE','EINTEGRITY','EBADENGINE','EACCES','EPERM','ENOSPC','ELOCKVERIFY','EJSONPARSE','ENOTEMPTY','ENOENT','EEXIST','ERR_INVALID_URL','ERR_INVALID_ARG_TYPE']);
          const codes=[...new Set(Array.from(log.matchAll(/^(?:npm error|npm ERR!) code ([A-Z][A-Z0-9_]{1,31})\s*$/gm),m=>m[1]).filter(code=>allowed.has(code)))].slice(0,5);
          console.log('NPM_INSTALL_ERROR_CODES:'+(codes.join(',')||'UNCLASSIFIED'));
          NODE
            exit "$install_status"
          fi

      - name: Evaluate changed learning before canonicalization
        env:
          POWERHOUSE_BASE_SHA: ${{ steps.replay.outputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          POWERHOUSE_HEAD_SHA: ${{ steps.replay.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: node scripts/brain/learning-canonicalization-gate.mjs

      - name: Publish learning canonicalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-canonicalization-evidence-${{ github.run_id }}
          path: .artifacts/learning-canonicalization-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify learning canonicalization gate contract
        run: node --test tests/brain-learning-canonicalization-gate-v1.test.mjs

      - name: Reconcile all canonical learning into skill projection
        run: node scripts/brain/powerhouse-skill-projection.mjs
      - name: Verify learning to skill projection contract
        run: node --test tests/brain-powerhouse-universal-agent-learning-writeback.test.mjs
