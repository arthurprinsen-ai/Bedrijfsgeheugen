name: Portal V2 Live Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'portal-v2/**'
      - 'tests/integration/portal-v2-live.spec.js'
      - 'tests/integration/portal-v2-mobile-shell.spec.js'
      - 'tests/integration/portal-v2-functional-parity.spec.js'
      - 'tests/integration/portal-v2-legacy-algorithm-parity.spec.js'
      - '.github/workflows/portal-v2-live-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checked-out head SHA
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$HEAD_SHA" || { echo "::error::Checked-out SHA $actual does not match PR head $HEAD_SHA"; exit 1; }

      - name: Wait for exact Netlify preview SHA
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status")
            state=$(printf '%s' "$json" | jq -r '.statuses[] | select(.context == "netlify/bedrijfsgeheugen/deploy-preview") | .state' | head -n1)
            target=$(printf '%s' "$json" | jq -r '.statuses[] | select(.context == "netlify/bedrijfsgeheugen/deploy-preview") | .target_url' | head -n1)
            if [ "$state" = "success" ]; then
              echo "PREVIEW_URL=$target" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "::error::Netlify preview failed for $HEAD_SHA: $state"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Netlify preview on exact head SHA"
          exit 1

      - name: Wait for the preview to actually serve Portal V2
        run: bash tools/ci/wait-for-url.sh "$PREVIEW_URL/portal-v2/app.js"

      - name: Verify exact Netlify V2 assets are served
        run: |
          set -euo pipefail
          fetch_asset() {
            local path="$1" output="$2"
            if ! curl -fsS --max-time 30 "$PREVIEW_URL$path" -o "$output"; then
              echo "::error::Preview asset unavailable: $path"
              return 1
            fi
          }
          require_marker() {
            local file="$1" marker="$2" label="$3"
            if ! grep -q -- "$marker" "$file"; then
              echo "::error::Preview asset contract missing marker '$marker' in $label"
              return 1
            fi
          }

          fetch_asset /portal-v2/ /tmp/portal-v2.html
          fetch_asset /portal-v2/app.css /tmp/portal-v2.css
          fetch_asset /portal-v2/saas-theme.css /tmp/portal-v2-saas.css
          fetch_asset /portal-v2/csrd-mobile-saas.css /tmp/portal-v2-csrd-saas.css
          fetch_asset /portal-v2/mobile-responsive.css /tmp/portal-v2-mobile.css
          fetch_asset /portal-v2/functional-suite.css /tmp/portal-v2-functional.css
          fetch_asset /portal-v2/app.js /tmp/portal-v2.js
          fetch_asset /portal-v2/legacy-parity-engine.js /tmp/portal-v2-parity-engine.js

          node --check /tmp/portal-v2.js || { echo "::error::Served portal-v2/app.js is not valid JavaScript"; exit 1; }
          node --check /tmp/portal-v2-parity-engine.js || { echo "::error::Served portal-v2/legacy-parity-engine.js is not valid JavaScript"; exit 1; }

          require_marker /tmp/portal-v2.html 'Welkom terug, Arthur' portal-v2/index.html
          require_marker /tmp/portal-v2.html 'Het brein van je bedrijf' portal-v2/index.html
          require_marker /tmp/portal-v2.html 'AI Management Summary' portal-v2/index.html
          require_marker /tmp/portal-v2.html 'Powerhouse' portal-v2/index.html
          require_marker /tmp/portal-v2.html 'Alle portalpagina’s' portal-v2/index.html
          require_marker /tmp/portal-v2.html 'mobile-responsive.css' portal-v2/index.html
          require_marker /tmp/portal-v2-saas.css '--saas-accent:' portal-v2/saas-theme.css
          require_marker /tmp/portal-v2-saas.css 'brainflow' portal-v2/saas-theme.css
          require_marker /tmp/portal-v2-mobile.css 'v2utilities' portal-v2/mobile-responsive.css
          require_marker /tmp/portal-v2-csrd-saas.css 'csrd-mobile-summary' portal-v2/csrd-mobile-saas.css
          require_marker /tmp/portal-v2-csrd-saas.css 'csrd-mobile-domain' portal-v2/csrd-mobile-saas.css
          require_marker /tmp/portal-v2-functional.css 'v2repeatrow' portal-v2/functional-suite.css
          require_marker /tmp/portal-v2-parity-engine.js 'calculateLegacyEquivalent' portal-v2/legacy-parity-engine.js

      - name: Install Playwright runtime
        run: |
          PLAYWRIGHT_PACKAGE=@playwright/test@1.55.0 bash tools/ci/install-chromium.sh

      - name: Verify exact demoAI mobile rewrite on Netlify preview
        run: |
          set -euo pipefail
          PREVIEW_URL="$PREVIEW_URL" npx playwright test tests/integration/portal-v2-mobile-shell.spec.js --workers=1

      - name: Verify approved deterministic browser parity on exact head
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/portal-v2-local.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173/portal-v2/" | grep -q 'Welkom terug, Arthur'; then
              break
            fi
            if [ "$i" = "30" ]; then
              cat /tmp/portal-v2-local.log
              exit 1
            fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:4173 npx playwright test tests/integration/portal-v2-live.spec.js tests/integration/portal-v2-functional-parity.spec.js tests/integration/portal-v2-legacy-algorithm-parity.spec.js --workers=1

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-v2-visual-evidence
          path: artifacts/portal-v2-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Report exact preview evidence
        run: |
          echo "Verified head SHA: ${{ github.event.pull_request.head.sha }}"
          echo "Verified Netlify preview assets: $PREVIEW_URL/portal-v2/"
          echo "Exact demoAI mobile rewrite plus desktop, mobile CSRD, full functional parity and executable legacy algorithm browser checks passed."
