name: Portal V2 Live Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'portal-v2/**'
      - 'tests/integration/portal-v2-live.spec.js'
      - 'tests/integration/portal-v2-mobile-shell.spec.js'
      - 'tests/integration/portal-v2-functional-parity.spec.js'
      - 'tests/integration/portal-v2-bcg-parity.spec.js'
      - 'tests/integration/portal-v2-legacy-algorithm-parity.spec.js'
      - '.github/workflows/portal-v2-live-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checked-out head SHA
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$HEAD_SHA" || { echo "::error::Checked-out SHA $actual does not match PR head $HEAD_SHA"; exit 1; }

      - name: Wait for exact Netlify preview SHA and pin immutable deploy
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status")
            state=$(printf '%s' "$json" | jq -r '.statuses[] | select(.context == "netlify/bedrijfsgeheugen/deploy-preview") | .state' | head -n1)
            target=$(printf '%s' "$json" | jq -r '.statuses[] | select(.context == "netlify/bedrijfsgeheugen/deploy-preview") | .target_url' | head -n1)
            if [ "$state" = "success" ] && [ -n "$target" ] && [ "$target" != "null" ]; then
              release=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$target/release.json?sha=$HEAD_SHA&attempt=$i" || true)
              deployed_sha=$(node -e 'try { const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.commit_ref||"")); } catch {}' "$release")
              deploy_id=$(node -e 'try { const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.deploy_id||"")); } catch {}' "$release")
              if [ "$deployed_sha" = "$HEAD_SHA" ] && [ -n "$deploy_id" ]; then
                immutable="https://${deploy_id}--bedrijfsgeheugen.netlify.app"
                immutable_release=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$immutable/release.json?sha=$HEAD_SHA" || true)
                immutable_sha=$(node -e 'try { const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.commit_ref||"")); } catch {}' "$immutable_release")
                if [ "$immutable_sha" = "$HEAD_SHA" ]; then
                  echo "PREVIEW_URL=$immutable" >> "$GITHUB_ENV"
                  echo "NETLIFY_DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
                  echo "Pinned exact deploy $deploy_id for $HEAD_SHA"
                  exit 0
                fi
              fi
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "::error::Netlify preview failed for $HEAD_SHA: $state"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for immutable Netlify preview on exact head SHA"
          exit 1

      - name: Wait for the immutable preview to actually serve Portal V2
        run: bash tools/ci/wait-for-url.sh "$PREVIEW_URL/portal-v2/app.js"

      - name: Verify exact Netlify V2 assets are served
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$PREVIEW_URL/portal-v2/" -o /tmp/portal-v2.html
          curl -fsS --max-time 30 "$PREVIEW_URL/portal-v2/app.css" -o /tmp/portal-v2.css
          curl -fsS --max-time 30 "$PREVIEW_URL/portal-v2/saas-theme.css" -o /tmp/portal-v2-saas.css
          curl -fsS --max-time 30 "$PREVIEW_URL/portal-v2/csrd-mobile-saas.css" -o /tmp/portal-v2-csrd-saas.css
          curl -fsS --max-time 30 "$PREVIEW_URL/portal-v2/mobile-responsive.css" -o /tmp/portal-v2-mobile.css
          curl -fsS --max-time 30 "$PREVIEW_URL/portal-v2/functional-suite.css" -o /tmp/portal-v2-functional.css
          curl -fsS --max-time 30 "$PREVIEW_URL/portal-v2/app.js" -o /tmp/portal-v2.js
          curl -fsS --max-time 30 "$PREVIEW_URL/portal-v2/legacy-parity-engine.js" -o /tmp/portal-v2-parity-engine.js
          node --check /tmp/portal-v2.js
          node --check /tmp/portal-v2-parity-engine.js
          grep -q 'Welkom terug, Arthur' /tmp/portal-v2.html
          grep -q 'Het brein van je bedrijf' /tmp/portal-v2.html
          grep -q 'AI Management Summary' /tmp/portal-v2.html
          grep -q 'Powerhouse' /tmp/portal-v2.html
          grep -q 'Alle portalpagina’s' /tmp/portal-v2.html
          grep -q 'mobile-responsive.css' /tmp/portal-v2.html
          grep -q -- '--saas-accent:' /tmp/portal-v2-saas.css
          grep -q 'brainflow' /tmp/portal-v2-saas.css
          grep -q 'v2utilities' /tmp/portal-v2-mobile.css
          grep -q 'csrd-mobile-summary' /tmp/portal-v2-csrd-saas.css
          grep -q 'csrd-mobile-domain' /tmp/portal-v2-csrd-saas.css
          grep -q 'v2repeatrow' /tmp/portal-v2-functional.css
          grep -q 'calculateLegacyEquivalent' /tmp/portal-v2-parity-engine.js

      - name: Install Playwright runtime
        run: |
          PLAYWRIGHT_PACKAGE=@playwright/test@1.55.0 bash tools/ci/install-chromium.sh

      - name: Verify exact demoAI mobile rewrite on immutable Netlify preview
        run: |
          set -euo pipefail
          PREVIEW_URL="$PREVIEW_URL" npx playwright test tests/integration/portal-v2-mobile-shell.spec.js --workers=1

      - name: Verify approved deterministic browser parity on exact head
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/portal-v2-local.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173/portal-v2/" | grep -q 'Welkom terug, Arthur'; then
              break
            fi
            if [ "$i" = "30" ]; then
              cat /tmp/portal-v2-local.log
              exit 1
            fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:4173 npx playwright test tests/integration/portal-v2-live.spec.js tests/integration/portal-v2-functional-parity.spec.js tests/integration/portal-v2-bcg-parity.spec.js tests/integration/portal-v2-legacy-algorithm-parity.spec.js --workers=1

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-v2-visual-evidence
          path: artifacts/portal-v2-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Report exact preview evidence
        run: |
          echo "Verified head SHA: ${{ github.event.pull_request.head.sha }}"
          echo "Verified immutable Netlify deploy: $NETLIFY_DEPLOY_ID"
          echo "Verified Netlify preview assets: $PREVIEW_URL/portal-v2/"
          echo "Exact demoAI mobile rewrite plus desktop, mobile CSRD, full functional parity, BCG parity and executable legacy algorithm browser checks passed."
