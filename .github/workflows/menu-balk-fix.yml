name: Menu-balk fix
on:
  workflow_dispatch:
    inputs:
      delivery_mode:
        description: 'BRAIN v2 staat alleen gecontroleerde candidate PR delivery toe'
        type: choice
        required: true
        default: candidate-pr
        options:
          - candidate-pr
permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: repo-schrijven
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exacte basis vastleggen
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Balk aanpassen op alle paginas
        run: |
          python3 - <<'PY'
          import glob
          MERK_F="background:rgba(251,250,247,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--inkt)"
          MERK_R="background:#FBFAF7;border-bottom:2px solid var(--inkt)"
          NAV_F=".navpill{position:fixed;top:auto;bottom:16px;height:auto;left:50%;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:.35rem;background:rgba(20,23,26,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.45rem .5rem .45rem .55rem;box-shadow:0 14px 40px rgba(20,23,26,.35)}"
          NAV_R=".navpill{position:fixed;top:auto;bottom:16px;height:auto;left:50%;transform:translateX(-50%) translateY(160%);opacity:0;pointer-events:none;transition:opacity .3s ease,transform .4s cubic-bezier(.16,1,.3,1);z-index:80;display:flex;align-items:center;justify-content:center;gap:.4rem;background:#14171A;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.45rem .5rem .45rem .55rem;box-shadow:0 14px 40px rgba(20,23,26,.35)}\n.navpill.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}"
          CTA_F=".np-cta{display:flex;align-items:center;gap:.5rem;background:#fff;"
          CTA_R=".np-cta{display:flex;align-items:center;justify-content:center;gap:.5rem;white-space:nowrap;background:#fff;"
          SCR_F="nav.scrolled{box-shadow:0 6px 22px rgba(20,23,26,.10)}"
          SCR_R="nav.scrolled{}"
          SHOW='<script>(function(){var n=document.querySelector(".navpill");if(n){var s=function(){n.classList.toggle("show",(window.scrollY||0)>200)};addEventListener("scroll",s,{passive:true});s()}})();</script>'
          for f in glob.glob("**/*.html", recursive=True):
              h=open(f,encoding="utf-8").read()
              if 'class="navpill"' not in h:
                  print("skip (geen navpill):",f); continue
              o=h
              h=h.replace(MERK_F,MERK_R).replace(NAV_F,NAV_R).replace(CTA_F,CTA_R).replace(SCR_F,SCR_R)
              if "toggle('show'" not in h and 'toggle("show"' not in h and ".navpill.show" in h:
                  i=h.rfind("</body>")
                  if i!=-1: h=h[:i]+SHOW+"\n"+h[i:]
              if h!=o:
                  open(f,"w",encoding="utf-8").write(h); print("gefixt:",f)
              else:
                  print("al goed:",f)
          PY

      - name: Wijzigingen valideren en committen
        id: commit
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Geen menu-wijzigingen nodig."
            exit 0
          fi

          for f in "${changed[@]}"; do
            case "$f" in
              *.html) ;;
              *) echo "::error::NON_HTML_CHANGE:$f"; exit 1 ;;
            esac
          done

          printf '%s\n' "${changed[@]}" > /tmp/menu-writer-files.txt
          git config user.name "site-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${changed[@]}"
          git commit -m "menu-balk: een kleur, verschijnt bij scrollen, mobiel uitgelijnd"

          export CHANGED_FILES="$(cat /tmp/menu-writer-files.txt)"
          CANDIDATE_BRANCH=$(node --input-type=module - <<'NODE'
          import { createWriterCandidate, validateWriterCandidate } from './scripts/ci/repo-writer-candidate.mjs';
          const files = String(process.env.CHANGED_FILES || '').split('\n').filter(Boolean);
          const candidate = createWriterCandidate({
            writer: 'menu-balk-fix',
            baseSha: process.env.BASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            changedFiles: files,
            allowedFiles: files,
            rollbackSha: process.env.BASE_SHA,
          });
          validateWriterCandidate(candidate);
          console.log(candidate.branch);
          NODE
          )
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Candidate branch publiceren
        if: steps.commit.outputs.changed == 'true'
        env:
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$CANDIDATE_BRANCH"

      - name: Candidate PR openen
        id: candidate_pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          SOURCE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --head "$CANDIDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            pr_url=$(gh pr create \
              --base main \
              --head "$CANDIDATE_BRANCH" \
              --title "Menu-balk candidate $GITHUB_RUN_ID" \
              --body "BRAIN-DELIVERY-v2 candidate uit menu-balk-fix. Source SHA: $SOURCE_SHA. Deze workflow pusht of merge't nooit rechtstreeks naar main; BG169 is productieautoriteit.")
            pr_number="${pr_url##*/}"
          else
            echo "Candidate PR bestaat al: #$pr_number"
          fi
          pr_base_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.base.sha')
          pr_head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')
          pr_head_ref=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.ref')
          [ "$pr_head_ref" = "$CANDIDATE_BRANCH" ] || { echo "::error::PR_HEAD_REF_DRIFT:$CANDIDATE_BRANCH:$pr_head_ref"; exit 1; }
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "base_sha=$pr_base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$pr_head_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch read-only shadow verification
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          PR_NUMBER: ${{ steps.candidate_pr.outputs.pr_number }}
          BASE_SHA: ${{ steps.candidate_pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.candidate_pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh workflow run repo-writer-candidate-shadow.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f base_sha="$BASE_SHA" \
            -f head_sha="$HEAD_SHA" \
            -f candidate_branch="$CANDIDATE_BRANCH"

      - name: BRAIN v2 handoff evidence
        if: steps.commit.outputs.changed == 'true'
        run: |
          echo "production_authority=BG169"
          echo "direct_main_push=false"
