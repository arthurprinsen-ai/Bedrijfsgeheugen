name: Hero Media Production Verify
on:
  push:
    branches: [main, automation/openart-hero-production-promotion]
    paths: ['assets/openart-hero-iphone-safe-v1.mp4','assets/openart-hero-production.json','.github/workflows/hero-media-production-verify.yml','docs/openart-hero-production-foundation.md','docs/openart-hero-production-foundation-acceptance.md']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/homepage-hero-video.test.mjs tests/hero-media-normalizer.test.mjs tests/hero-media-executor.test.mjs
