name: Pagina- en SEO-diagnose

on:
  pull_request:
  push:
    branches:
      - feature/klantenportaal-brain-powerhouse-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: SEO-controle met evidence
        shell: bash
        run: |
          set +e
          python .github/scripts/seocontrole.py
          code=$?
          echo "$code" > seo-exit-code.txt
          exit 0
      - name: SEO evidence uploaden
        uses: actions/upload-artifact@v4
        with:
          name: seo-diagnose
          path: |
            seo-rapport.md
            seo-exit-code.txt
          if-no-files-found: warn

  pagina-diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Playwright installeren
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium
      - name: Paginacontrole met evidence
        shell: bash
        run: |
          set +e
          python .github/scripts/paginacontrole.py
          code=$?
          echo "$code" > pagina-exit-code.txt
          exit 0
      - name: Pagina evidence uploaden
        uses: actions/upload-artifact@v4
        with:
          name: pagina-diagnose
          path: |
            rapport.md
            pagina-exit-code.txt
          if-no-files-found: warn
