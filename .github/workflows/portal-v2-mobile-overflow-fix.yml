name: Apply Portal V2 Mobile Overflow Fix

on:
  push:
    branches:
      - feature/klantenportaal-brain-powerhouse-v1
    paths:
      - '.github/workflows/portal-v2-mobile-overflow-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/klantenportaal-brain-powerhouse-v1
          fetch-depth: 0
      - name: Apply root overflow containment and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('portal-v2/app.css')
          s = p.read_text(encoding='utf-8')
          old = 'html,body{margin:0;background:var(--bg);'
          new = 'html,body{margin:0;max-width:100%;overflow-x:clip;background:var(--bg);'
          if old not in s:
              raise SystemExit('expected portal-v2 root CSS contract not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/portal-v2-mobile-overflow-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal-v2/app.css
          git commit -m 'fix(portal-v2): contain mobile page overflow'
          git push origin HEAD:feature/klantenportaal-brain-powerhouse-v1