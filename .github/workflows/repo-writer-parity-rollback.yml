name: Repository Writer Parity Rollback
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: node --test tests/repository-writer-structural-parity.test.mjs tests/repo-writer-shadow.test.mjs
