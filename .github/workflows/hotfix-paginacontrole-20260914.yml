name: Hotfix paginacontrole 2026-09-14

on:
  push:
    branches:
      - fix/post-merge-paginacontrole-20260914
    paths:
      - '.github/workflows/hotfix-paginacontrole-20260914.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/post-merge-paginacontrole-20260914
          fetch-depth: 0
      - name: Repair canonical header and SEO title source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          canonical = Path('.github/canoniek/kop.html').read_text(encoding='utf-8').strip()

          page = Path('wijzigingen-uitgelegd.html')
          text = page.read_text(encoding='utf-8')
          text, count = re.subn(r'<nav class="bgkop"[\s\S]*?</nav>', lambda _: canonical, text, count=1)
          if count != 1:
              raise RuntimeError(f'canonical nav replacement count={count}')
          page.write_text(text, encoding='utf-8')

          title = 'Data-soevereiniteit: ChatGPT en bedrijfsdata | Bedrijfsgeheugen'
          page = Path('data-soevereiniteit.html')
          text = page.read_text(encoding='utf-8')
          text, count = re.subn(r'<title>.*?</title>', f'<title>{title}</title>', text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('data-soevereiniteit title not found exactly once')
          page.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/paginacontrole.yml')
          text = workflow.read_text(encoding='utf-8')
          old = "title = 'Data-soevereiniteit: ChatGPT, bedrijfsgegevens en beleid | Bedrijfsgeheugen'"
          new = f"title = '{title}'"
          if old not in text:
              raise RuntimeError('paginacontrole self-heal title contract not found')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 .github/scripts/seocontrole.py
          git diff --check
          git config user.name 'Bedrijfsgeheugen Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add wijzigingen-uitgelegd.html data-soevereiniteit.html .github/workflows/paginacontrole.yml
          git commit -m 'fix: repair paginacontrole source regressions'
          git push origin HEAD:fix/post-merge-paginacontrole-20260914
