name: SEO Guardian

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - '_redirects'
      - '_headers'
      - 'scripts/ci/seo_guardian.py'
      - '.github/workflows/seo-guardian.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - '_redirects'
      - '_headers'
      - 'scripts/ci/seo_guardian.py'
      - '.github/workflows/seo-guardian.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: seo-guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  technical-seo:
    name: Technical SEO contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sitemap, indexability, metadata, schema and orphan pages
        id: seo
        shell: bash
        run: |
          set +e
          python scripts/ci/seo_guardian.py > seo-report.txt 2>&1
          code=$?
          cat seo-report.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish SEO diagnostics to pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '## SEO Guardian'
            echo
            echo '```text'
            sed -n '1,220p' seo-report.txt
            echo '```'
            echo
            echo "Validated commit: \`${GITHUB_SHA}\`"
          } > seo-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file seo-comment.md
      - name: Enforce SEO gate
        if: steps.seo.outputs.exit_code != '0'
        run: exit 1
