name: Regulatory Source Watch

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      retire_predecessor:
        description: Exact original regulatory source PR to retire after terminal successor proof; blank runs normal observation
        type: string
        required: false
      terminal_successor:
        description: Exact direct merged terminal successor PR
        type: string
        required: false
      terminal_run:
        description: Successful canonical obligation terminal closure run ID
        type: string
        required: false
      expected_head:
        description: Expected original source PR head SHA
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: regulatory-source-watch
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.retire_predecessor == '' && inputs.terminal_successor == '' && inputs.terminal_run == '' && inputs.expected_head == '')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Capture base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch authoritative regulatory sources
        run: python3 tools/regulatory-source-monitor.py
      - name: Persist source heartbeat and immutable raw observations in Powerhouse Brain
        env:
          BG_PORTAL_EU_SUPABASE_URL: ${{ secrets.BG_PORTAL_EU_SUPABASE_URL }}
          BG_PORTAL_EU_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BG_PORTAL_EU_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tools/regulatory-brain-ingest.py
      - name: Preserve raw run evidence
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-source-raw-${{ github.run_id }}
          path: artifacts/regulatory
          if-no-files-found: ignore
          retention-days: 90
      - name: Open governed source-state candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/regulatory-source-state.json; then
            echo "No authoritative content change."
            exit 0
          fi
          BRANCH="writer/regulatory-source-watch/${GITHUB_RUN_ID}"
          git config user.name "bedrijfsgeheugen-bot"
          git config user.email "arthur@bedrijfsgeheugen.nl"
          git add data/regulatory-source-state.json
          git commit -m "Regulatory source baseline observed"
          HEAD_SHA=$(git rev-parse HEAD)
          git push origin "HEAD:$BRANCH"
          # Preserve the existing candidate branch when repository Actions PR creation is denied.
          # Do not weaken repository settings or claim source delivery from a pushed branch.
          set +e
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "Regulatory source candidate ${GITHUB_RUN_ID}" --body "$(cat <<EOF
          Obligation-ID: regulatory-source-watch-${GITHUB_RUN_ID}
          Delivery-Lane: automation
          Candidate-Type: implementation
          Regulatory-Candidate-Type: source-observation
          Base-SHA: $BASE_SHA

          Writer-Lease-State: TERMINAL_DELIVERY
          Writer-Lease-Owner: regulatory-source-watch-${GITHUB_RUN_ID}
          Writer-Lease-Scope: data/regulatory-source-state.json
          Writer-Lease-Head: $HEAD_SHA
          Writer-Lease-Main-Epoch: $BASE_SHA
          Writer-Lease-Obligation: regulatory-source-watch-${GITHUB_RUN_ID}
          Writer-Lease-NonOwner-Action: DEFER
          Writer-Lease-Release: MERGED_AND_PRODUCTION_READBACK_AND_LEARNING_WRITEBACK

          Raw official-source evidence was persisted before this projection candidate.
          EOF
          )" 2> /tmp/regulatory-pr-attempt.err)
          pr_status=$?
          set -e
          if [ "$pr_status" -ne 0 ]; then
            if grep -Fq "GitHub Actions is not permitted to create or approve pull requests" /tmp/regulatory-pr-attempt.err; then
              echo "::error::CANONICAL_REGULATORY_PR_PERMISSION_DENIED:branch=$BRANCH:authorized_repository_owner_action_required"
            else
              cat /tmp/regulatory-pr-attempt.err >&2
            fi
            echo "UNMERGED_REGULATORY_CANDIDATE_HELD:$BRANCH"
            exit "$pr_status"
          fi
          gh pr merge --auto --squash "$PR_URL"

  retire-terminal-predecessor:
    if: github.event_name == 'workflow_dispatch' && (inputs.retire_predecessor != '' || inputs.terminal_successor != '' || inputs.terminal_run != '' || inputs.expected_head != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify and retire exact original source owner lineage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREDECESSOR: ${{ inputs.retire_predecessor }}
          SUCCESSOR: ${{ inputs.terminal_successor }}
          TERMINAL_RUN: ${{ inputs.terminal_run }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: node tools/delivery/regulatory-owner-terminal-retirement.mjs
      - name: Preserve owner retirement receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-owner-retirement-${{ github.run_id }}
          path: .artifacts/regulatory-owner-retirement.json
          if-no-files-found: error
          retention-days: 90
