name: LinkedIn Revenue Cockpit

on:
  pull_request:
    branches: [main]
    paths:
      - 'intern/linkedin-revenue/**'
      - 'platform/linkedin-revenue-cockpit.mjs'
      - 'netlify/functions/linkedin-revenue-cockpit.mjs'
      - 'supabase/functions/powerhouse-runtime/**'
      - 'supabase/migrations/*powerhouse_v96_supabase_native_runtime.sql'
      - 'tests/linkedin-revenue-cockpit.test.mjs'
      - 'tests/linkedin-revenue-runtime.test.mjs'
      - 'tests/powerhouse-v96-supabase-native.test.mjs'
      - '.github/workflows/linkedin-revenue-cockpit-tests.yml'
      - '_redirects'

permissions:
  contents: read

jobs:
  cockpit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify revenue cockpit contract
        run: node --test tests/linkedin-revenue-cockpit.test.mjs tests/linkedin-revenue-runtime.test.mjs tests/powerhouse-v96-supabase-native.test.mjs
