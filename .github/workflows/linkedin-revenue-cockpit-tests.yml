name: LinkedIn Revenue Cockpit

on:
  pull_request:
    branches: [main]
    paths:
      - 'portal-v2/linkedin-revenue.*'
      - 'tests/linkedin-revenue-cockpit.test.mjs'
      - '.github/workflows/linkedin-revenue-cockpit-tests.yml'

permissions:
  contents: read

jobs:
  cockpit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify revenue cockpit contract
        run: node --test tests/linkedin-revenue-cockpit.test.mjs
