name: LinkedIn Revenue Cockpit

on:
  pull_request:
    branches: [main]
    paths:
      - 'intern/linkedin-revenue/**'
      - 'platform/linkedin-revenue-cockpit.mjs'
      - 'netlify/functions/linkedin-revenue-cockpit.mjs'
      - 'supabase/functions/powerhouse-runtime/**'
      - 'supabase/migrations/*linkedin*.sql'
      - 'supabase/migrations/*revenue*.sql'
      - 'tests/linkedin-revenue-cockpit.test.mjs'
      - 'tests/linkedin-revenue-runtime.test.mjs'
      - 'tests/linkedin-revenue-engagement-cockpit.test.mjs'
      - '.github/workflows/linkedin-revenue-cockpit-tests.yml'
      - '_redirects'

concurrency:
  group: linkedin-revenue-cockpit-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cockpit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify revenue cockpit contract
        run: node --test tests/linkedin-revenue-cockpit.test.mjs tests/linkedin-revenue-runtime.test.mjs tests/linkedin-revenue-engagement-cockpit.test.mjs
