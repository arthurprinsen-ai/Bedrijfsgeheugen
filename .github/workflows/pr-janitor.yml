name: PR Janitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-janitor
  cancel-in-progress: true

jobs:
  janitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Close same-obligation superseded and long-stale generated PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-janitor.mjs
