name: Business OS Foundation
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: node --test tests/canonical-*.test.mjs tests/source-adapters.test.mjs tests/read-models.test.mjs tests/foundation-registry-eventstore.test.mjs tests/monitor-brain-ingest.test.mjs
      - run: python3 .github/scripts/portal_parity.py
