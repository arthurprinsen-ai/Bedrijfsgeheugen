name: Portal Native Regression Tests

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'platform/read-models/portal-server-state.mjs'
      - 'tests/portal-native-legacy-batch-*.test.mjs'
      - '.github/workflows/portal-native-regression-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-portal-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run native portal migration regressions
        run: node --test tests/portal-native-legacy-batch-*.test.mjs
