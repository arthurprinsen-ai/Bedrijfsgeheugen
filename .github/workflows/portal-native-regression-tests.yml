name: Portal Native Regression Tests
on:
  push:
    branches: [main]
    paths: ['portal/**','platform/**','tests/portal-native-legacy-batch-*.test.mjs','.github/workflows/portal-native-regression-tests.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-portal-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test tests/portal-native-legacy-batch-*.test.mjs
