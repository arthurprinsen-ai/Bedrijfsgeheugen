name: Website release lane

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      change_head_sha:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: string

permissions:
  contents: read
  statuses: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      risk_lane: ${{ steps.risk.outputs.risk_lane }}
      routes: ${{ steps.risk.outputs.routes }}
      requires_preview: ${{ steps.risk.outputs.requires_preview }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - id: risk
        name: Classify website blast radius
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CHANGE_HEAD_SHA: ${{ inputs.change_head_sha }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, appendFile } from 'node:fs/promises';
          import { classifyWebsiteRelease } from './tools/site-shell/website-release-risk.mjs';
          const changedPaths=execFileSync('git',['diff','--name-only',`${process.env.BASE_SHA}...${process.env.CHANGE_HEAD_SHA}`],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean);
          const riskConfig=JSON.parse(await readFile('site/website-release-risk.json','utf8'));
          const acceptedBaseline=JSON.parse(await readFile('site/accepted-baseline.json','utf8'));
          let result=classifyWebsiteRelease({changedPaths,riskConfig,acceptedBaseline});
          // A netlify.toml change that only appends canonical 301 redirect blocks has a
          // bounded blast radius. Closure evidence and regression files are already
          // classified as non-artifact. Keep real build/header/security config edits
          // high-risk, but avoid a full-site browser sweep for redirect-only work.
          if(changedPaths.includes('netlify.toml')){
            const diff=execFileSync('git',['diff','--unified=0',`${process.env.BASE_SHA}...${process.env.CHANGE_HEAD_SHA}`,'--','netlify.toml'],{encoding:'utf8'});
            const changed=diff.split(/\r?\n/).filter(line=>line && !line.startsWith('diff ') && !line.startsWith('index ') && !line.startsWith('@@') && !line.startsWith('+++') && !line.startsWith('---'));
            const removed=changed.filter(line=>line.startsWith('-'));
            const added=changed.filter(line=>line.startsWith('+')).map(line=>line.slice(1).trim());
            const allowed=/^(|\[\[redirects\]\]|from\s*=\s*"\/[^"]+"|to\s*=\s*"\/[^"]+"|status\s*=\s*301|force\s*=\s*true)$/;
            const artifactPaths=result.artifact_changed_files||[];
            const redirectOnly=artifactPaths.length===1 && artifactPaths[0]==='netlify.toml' && removed.length===0 && added.length>0 && added.every(line=>allowed.test(line));
            if(redirectOnly){
              const routes=[...new Set(added.filter(line=>/^to\s*=/.test(line)).map(line=>line.match(/"([^"]+)"/)?.[1]).filter(Boolean))];
              result={
                ...result,
                lane:'fast-fix',
                affected_routes:routes.length?routes:['/'],
                risk_reasons:[...result.non_artifact_files.map(path=>`non-artifact:${path}`),'redirect-only:netlify.toml'],
                required_test_sets:[...(riskConfig.fastFixRequiredTestSets||[])],
                escalated:false,
                requires_preview:true
              };
            }
          }
          let routes=[...result.affected_routes];
          if(result.requires_preview && routes.length===0) routes=result.lane==='high-risk'?['/','/ai-act','/benchmark']:['/'];
          await appendFile(process.env.GITHUB_OUTPUT,`risk_lane=${result.lane}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`routes=${JSON.stringify(routes)}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`requires_preview=${result.requires_preview}\n`);
          console.log(JSON.stringify({...result,affected_routes:routes},null,2));
          NODE

  syntax-preflight:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fail fast on broken inline JavaScript
        run: node tools/site-shell/website-static-syntax-preflight.mjs

  baseline:
    needs: [classify, syntax-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify mandatory website baseline and release-risk contracts
        run: node --test tests/site-baseline-guardian.test.mjs tests/site-shell-public-route-inventory.test.mjs tests/site-shell-website-release-risk.test.mjs tests/targeted-website-route-regression.test.mjs tests/website-static-syntax-preflight.test.mjs tests/branche-applicaties-integraties.test.mjs

  static:
    needs: [classify, syntax-preflight]
    if: needs.classify.outputs.requires_preview == 'true' && needs.classify.outputs.risk_lane != 'fast-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify normal and high-risk website static contracts
        run: >-
          node --test
          tests/v18-vergelijker.test.mjs
          tests/site-shell-v18-view-integrity.test.mjs
          tests/site-shell-stijlblokken.test.mjs
          tests/site-shell-schema-integriteit.test.mjs
          tests/site-shell-analytics-na-toestemming.test.mjs
          tests/site-shell-cta-conversie.test.mjs
          tests/site-shell-asset-cache.test.mjs
          tests/site-shell-analytics-sitebreed.test.mjs
          tests/site-shell-money-prerender.test.mjs
          tests/site-shell-lettertype-terugval.test.mjs
          tests/site-shell-eigen-meting.test.mjs
          tests/site-shell-knoppen-en-leesbreedte.test.mjs
          tests/site-shell-scoop-commentaar.test.mjs
          tests/v18-mobiel-binnenruimte.test.mjs
          tests/site-shell-oude-stylesheets.test.mjs
          tests/homepage-automation-layout.test.mjs
          tests/homepage-hero-video.test.mjs
          tests/seo-native-money-presentation.test.mjs
          tests/seo-homepage-platform-expertise-toggle.test.mjs
          tests/standalone-content-page-router-isolation.test.mjs
          tests/v18-megamenu-heading-contract.test.mjs
          tests/seo-homepage-context-slider-readability.test.mjs

  preview-ready:
    needs: [classify, syntax-preflight]
    if: needs.classify.outputs.requires_preview == 'true'
    runs-on: ubuntu-latest
    outputs:
      preview_mode: ${{ steps.preview.outputs.preview_mode }}
      base_url: ${{ steps.preview.outputs.base_url }}
    steps:
      - id: preview
        name: Resolve exact candidate browser target
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.change_head_sha }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ROUTES_JSON: ${{ needs.classify.outputs.routes }}
        run: |
          node --input-type=module - <<'NODE'
          import { appendFile } from 'node:fs/promises';
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const endpoint=`https://api.github.com/repos/${process.env.REPOSITORY}/commits/${process.env.HEAD_SHA}/status`;
          const previewBase=`https://deploy-preview-${process.env.PR_NUMBER}--bedrijfsgeheugen.netlify.app`;
          const routes=JSON.parse(process.env.ROUTES_JSON||'[]');
          const deadline=Date.now()+30*1000;
          async function routeReady(route){
            const target=`${previewBase}${route==='/'?'/':route}`;
            try {
              const response=await fetch(target,{redirect:'follow',signal:AbortSignal.timeout(8000),headers:{'user-agent':'bedrijfsgeheugen-preview-readiness/1.0'}});
              return response.ok;
            } catch (error) {
              console.log(`Preview route not ready: ${target} (${error?.name||'error'}: ${error?.message||error})`);
              return false;
            }
          }
          while(Date.now()<deadline){
            const response=await fetch(endpoint,{headers});
            if(!response.ok) throw new Error(`GitHub status API ${response.status}`);
            const body=await response.json();
            const status=(body.statuses||[]).find(item=>item.context==='netlify/bedrijfsgeheugen/deploy-preview');
            if(status?.state==='success'){
              const readiness=await Promise.all(routes.map(route=>routeReady(route)));
              if(readiness.every(Boolean)){
                await appendFile(process.env.GITHUB_OUTPUT,`preview_mode=netlify-exact-preview\nbase_url=${previewBase}\n`);
                console.log(`Exact Netlify preview and all targeted routes ready for ${process.env.HEAD_SHA}`);
                process.exit(0);
              }
              console.log(`Netlify status is green but targeted routes are not all ready yet for ${process.env.HEAD_SHA}; retrying before exact-local fallback.`);
            }
            if(['failure','error'].includes(status?.state)){
              console.log(`Netlify preview ${status.state}: ${status.description||''}; switching to exact local candidate fallback.`);
              break;
            }
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          await appendFile(process.env.GITHUB_OUTPUT,'preview_mode=local-exact-candidate\nbase_url=http://127.0.0.1:4173\n');
          console.log(`Netlify preview was absent, failed, or was not route-ready for ${process.env.HEAD_SHA}; browser verification will use the exact checked-out candidate locally.`);
          NODE

  page-seo:
    needs: [classify, syntax-preflight]
    if: needs.classify.outputs.requires_preview == 'true' && needs.classify.outputs.risk_lane != 'fast-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Netlify build dependencies
        run: npm install
      - name: Build and verify exact Netlify website artifact
        env:
          COMMIT_REF: ${{ inputs.candidate_sha }}
          CONTEXT: deploy-preview
          DEPLOY_ID: required-page-seo-local
        run: |
          node tools/bouw-powerhouse-auth.mjs
          node tools/bouw-kennisindex.mjs
          node tools/bouw-v18-production.mjs
          node tools/apply-tabbladen.mjs
          node tools/bouw-v18-views.mjs
          node tools/bouw-v18-chrome-alles.mjs
          node tools/prijzen-uit-de-homepage.mjs
          node tools/bouw-release-evidence.mjs
      - name: Verify built artifact contracts
        run: node --test tests/tabbladen.test.mjs

  browser:
    needs: [classify, syntax-preflight, preview-ready]
    timeout-minutes: 25
    if: needs.classify.outputs.requires_preview == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build and serve exact local candidate when Netlify preview is unavailable
        if: needs.preview-ready.outputs.preview_mode == 'local-exact-candidate'
        env:
          COMMIT_REF: ${{ inputs.candidate_sha }}
          CONTEXT: deploy-preview
          DEPLOY_ID: required-browser-local
        run: |
          npm install --no-audit --no-fund --silent
          node tools/bouw-powerhouse-auth.mjs
          node tools/bouw-kennisindex.mjs
          node tools/bouw-v18-production.mjs
          node tools/apply-tabbladen.mjs
          node tools/bouw-v18-views.mjs
          node tools/bouw-v18-chrome-alles.mjs
          node tools/prijzen-uit-de-homepage.mjs
          node tools/bouw-release-evidence.mjs
          nohup python3 tools/ci/serve-clean-urls.py --port 4173 --bind 127.0.0.1 >/tmp/bg-local-site.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4173/ai-act >/dev/null && curl -fsS http://127.0.0.1:4173/benchmark >/dev/null; then
              echo 'Exact local candidate clean URLs are reachable.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bg-local-site.log || true
          echo "::error::Exact local website candidate did not become reachable on /, /ai-act and /benchmark within 20 seconds. See /tmp/bg-local-site.log output above."
          exit 1
      - name: Install shared website browser runtime
        run: |
          PLAYWRIGHT_PACKAGE=playwright@1.55.0 bash tools/ci/install-chromium.sh
      - name: Verify high-risk full website regression contracts
        if: needs.classify.outputs.risk_lane == 'high-risk'
        run: >-
          node --test
          tests/seo-ui-visual-regression-contract.test.mjs
          tests/seo-ui-visual-regression-geometry.test.mjs
          tests/seo-ui-visual-regression-browser.test.mjs
      - name: Verify affected routes on desktop and mobile
        env:
          BASE_URL: ${{ needs.preview-ready.outputs.base_url }}
          BASELINE_URL: https://www.bedrijfsgeheugen.nl
          ROUTES_JSON: ${{ needs.classify.outputs.routes }}
        run: node tools/site-shell/verify-targeted-website-routes.mjs
      - name: Verify all public pages are visibly rendered
        env:
          UI_VR_BASE_URL: ${{ needs.preview-ready.outputs.base_url }}
        run: node tools/site-shell/standalone-visibility-check.mjs
      - name: Verify every header menu panel is readable
        if: needs.classify.outputs.risk_lane == 'high-risk'
        env:
          UI_VR_BASE_URL: ${{ needs.preview-ready.outputs.base_url }}
        run: node tools/site-shell/v18-header-menu-contrast-check.mjs
      - name: Verify broad high-risk browser contracts
        if: needs.classify.outputs.risk_lane == 'high-risk'
        env:
          UI_VR_BASE_URL: ${{ needs.preview-ready.outputs.base_url }}
          EXPECTED_COMMIT: ${{ inputs.change_head_sha }}
        run: |
          node tools/site-shell/v18-megamenu-browser-check.mjs
          node tools/site-shell/ui-visual-regression/browser-check.mjs
          node tools/site-shell/homepage-context-slider-browser-check.mjs
          node tools/site-shell/homepage-toggle-browser-check.mjs
