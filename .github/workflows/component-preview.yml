name: Component Preview
on:
  push:
    branches: ['automation/component-*']
    paths: ['components/**','assets/hero/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: node --test tests/components/*.test.mjs tests/component-preview-composition.test.mjs tests/component-preview-workflow-contract.test.mjs
