name: Component Preview

on:
  push:
    branches:
      - 'automation/component-*'
    paths:
      - 'components/**'
      - 'assets/hero/**'
  pull_request:
    branches:
      - main
    paths:
      - 'components/**'
      - 'assets/hero/**'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.changed.outputs.components }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - id: changed
        name: Detect independently changed components
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          mapfile -t CHANGED < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          COMPONENTS="$(node tools/detect-changed-components.mjs "${CHANGED[@]}")"
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"

  component:
    needs: detect
    if: ${{ needs.detect.outputs.components != '[]' }}
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.components) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test owned component
        run: node --test tests/components/${{ matrix.component }}.test.mjs
      - name: Compose isolated preview
        run: node tools/compose-component-preview.mjs "${{ matrix.component }}" "preview/components/${{ matrix.component }}.html"
      - uses: actions/upload-artifact@v4
        with:
          name: component-preview-${{ matrix.component }}
          path: preview/components/${{ matrix.component }}.html
          if-no-files-found: error
