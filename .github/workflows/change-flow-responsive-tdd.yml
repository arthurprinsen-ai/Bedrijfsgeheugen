name: Change flow responsive TDD

on:
  pull_request:
    paths:
      - 'assets/compare-slider-runtime.js'
      - 'tools/site-shell/fix-homepage-context-slider.mjs'
      - 'tools/site-shell/homepage-context-slider-browser-check.mjs'
      - 'tests/mobile-change-flow-responsive-layout.test.mjs'
      - '.github/workflows/change-flow-responsive-tdd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Responsive change-flow contract
        run: node --test tests/mobile-change-flow-responsive-layout.test.mjs
