name: Portal V2 Tests
on:
  push:
    branches: [main, feature/klantenportaal-brain-powerhouse-v1]
    paths: ['portal-v2/**','portal-next/portal-content-map.js','.github/workflows/portal-v2-tests.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm --prefix portal-v2 test
