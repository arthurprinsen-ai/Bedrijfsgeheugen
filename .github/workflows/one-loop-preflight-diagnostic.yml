name: One Loop preflight diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-loop-preflight-diagnostic.yml'
      - '.github/workflows/required-test.yml'
      - 'tests/**'
      - 'tools/**'
      - 'config/**'

permissions:
  contents: read

concurrency:
  group: one-loop-preflight-diagnostic-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --silent
      - name: brain-fast-development-protocol-v2
        run: node --test tests/brain-fast-development-protocol-v2.test.mjs
      - name: brain-fast-execution
        run: node --test tests/brain-fast-execution.test.mjs
      - name: brain-powerhouse-engineering-os-contract
        run: node --test tests/brain-powerhouse-engineering-os-contract.test.mjs
      - name: brain-powerhouse-autonomous-completion-authority
        run: node --test tests/brain-powerhouse-autonomous-completion-authority.test.mjs
      - name: brain-autonomous-improvement-runtime
        run: node --test tests/brain-autonomous-improvement-runtime.test.mjs
      - name: completion-supervisor
        run: node --test tests/completion-supervisor.test.mjs
      - name: completion-supervisor-evidence
        run: node --test tests/completion-supervisor-evidence.test.mjs
      - name: completion-supervisor-backfill
        run: node --test tests/completion-supervisor-backfill.test.mjs
      - name: brain-parallel-engineering-fabric
        run: node --test tests/brain-parallel-engineering-fabric.test.mjs
      - name: delivery-github-event-context
        run: node --test tests/delivery-github-event-context.test.mjs
      - name: delivery-driftless-merge-candidate
        run: node --test tests/delivery-driftless-merge-candidate.test.mjs
      - name: delivery-branch-hygiene-guard
        run: node --test tests/delivery-branch-hygiene-guard.test.mjs
      - name: delivery-required-branch-hygiene-wiring
        run: node --test tests/delivery-required-branch-hygiene-wiring.test.mjs
      - name: delivery-hygiene-policy
        run: node --test tests/delivery-hygiene-policy.test.mjs
      - name: brain-change-scoped-release-lanes
        run: node --test tests/brain-change-scoped-release-lanes.test.mjs
      - name: brain-moving-main-successor-guard
        run: node --test tests/brain-moving-main-successor-guard.test.mjs
      - name: brain-composable-release-control-plane
        run: node --test tests/brain-composable-release-control-plane.test.mjs
      - name: brain-agents-delivery-contract
        run: node --test tests/brain-agents-delivery-contract.test.mjs
      - name: portal-v2-release-identity-invariant
        run: node --test tests/portal-v2-release-identity-invariant.test.mjs
      - name: website-static-syntax-preflight
        run: node --test tests/website-static-syntax-preflight.test.mjs
