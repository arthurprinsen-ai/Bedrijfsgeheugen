name: Error learning contract

on:
  pull_request:
    paths:
      - 'scripts/brain/error-learning-policy.mjs'
      - 'tests/brain-error-learning-contract.test.mjs'
      - 'config/delivery-prevention-rules.json'
      - 'docs/brain/delivery-failure-lessons.json'
      - 'AGENTS.md'
      - '.github/workflows/error-learning-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/brain/error-learning-policy.mjs'
      - 'tests/brain-error-learning-contract.test.mjs'
      - 'config/delivery-prevention-rules.json'
      - 'docs/brain/delivery-failure-lessons.json'
      - 'AGENTS.md'
      - '.github/workflows/error-learning-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Fail-closed release + learning loop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify error-learning contract
        run: node tests/brain-error-learning-contract.test.mjs
