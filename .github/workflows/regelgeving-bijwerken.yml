name: Regelgeving bijwerken

# De compliance-datums op /frisse-blik moeten altijd kloppen. Deze workflow zoekt
# elke maandag de actuele stand op en commit die naar data/regelgeving.json, dat de
# pagina bij het laden inleest. Faalt de run, dan mailt GitHub dat naar de eigenaar.

on:
  schedule:
    - cron: '30 4 * * 1'   # elke maandag 04:30 UTC
  workflow_dispatch:
    inputs:
      delivery_mode:
        description: 'Publiceer direct of maak alleen een gecontroleerde candidate PR'
        type: choice
        required: true
        default: direct
        options:
          - direct
          - candidate-pr

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-schrijven
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exacte basis vastleggen
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Actuele regelgeving ophalen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/regelgeving-bijwerken.py

      - name: Wijziging valideren en committen
        id: commit
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          DELIVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_mode || 'direct' }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Geen wijziging."
            exit 0
          fi

          if [ "$changed" != "data/regelgeving.json" ]; then
            echo "::error::UNAPPROVED_CHANGED_FILE:$changed"
            exit 1
          fi

          git config user.name "bedrijfsgeheugen-bot"
          git config user.email "arthur@bedrijfsgeheugen.nl"
          git add data/regelgeving.json
          git commit -m "Regelgeving bijgewerkt (AI Act, NIS2, GPAI)"

          if [ "$DELIVERY_MODE" = "candidate-pr" ]; then
            CANDIDATE_BRANCH=$(node --input-type=module - <<'NODE'
          import { createWriterCandidate, validateWriterCandidate } from './scripts/ci/repo-writer-candidate.mjs';
          const candidate = createWriterCandidate({
            writer: 'regelgeving-bijwerken',
            baseSha: process.env.BASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            changedFiles: ['data/regelgeving.json'],
            allowedFiles: ['data/regelgeving.json'],
            rollbackSha: process.env.BASE_SHA,
          });
          validateWriterCandidate(candidate);
          console.log(candidate.branch);
          NODE
            )
            echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "delivery=candidate-pr" >> "$GITHUB_OUTPUT"
          else
            echo "delivery=direct" >> "$GITHUB_OUTPUT"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Direct publiceren op huidige veilige pad
        if: steps.commit.outputs.changed == 'true' && steps.commit.outputs.delivery == 'direct'
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Candidate branch publiceren
        if: steps.commit.outputs.changed == 'true' && steps.commit.outputs.delivery == 'candidate-pr'
        env:
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$CANDIDATE_BRANCH"

      - name: Candidate PR openen
        if: steps.commit.outputs.changed == 'true' && steps.commit.outputs.delivery == 'candidate-pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$CANDIDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Candidate PR bestaat al: #$existing"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$CANDIDATE_BRANCH" \
            --title "Regelgeving candidate $GITHUB_RUN_ID" \
            --body "Gecontroleerde candidate uit regelgeving-bijwerken. Base SHA: $BASE_SHA. Deze workflow merge't zichzelf niet; normale repositorygates beslissen over promotie."

      - name: Ouderdom bewaken
        run: |
          PEIL=$(python3 -c "import json;print(json.load(open('data/regelgeving.json'))['peildatumISO'])")
          DAGEN=$(( ( $(date +%s) - $(date -d "$PEIL" +%s) ) / 86400 ))
          echo "Peildatum $PEIL, $DAGEN dagen oud."
          if [ "$DAGEN" -gt 45 ]; then
            echo "::error::De regelgeving op /frisse-blik is $DAGEN dagen niet gecontroleerd."
            exit 1
          fi
