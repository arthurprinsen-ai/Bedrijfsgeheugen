name: Regelgeving bijwerken

# De compliance-datums op /frisse-blik moeten altijd kloppen. Deze workflow zoekt
# elke maandag de actuele stand op en levert onder BRAIN v2 uitsluitend een candidate PR.

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:
    inputs:
      delivery_mode:
        description: 'BRAIN v2 staat alleen gecontroleerde candidate PR delivery toe'
        type: choice
        required: true
        default: candidate-pr
        options:
          - candidate-pr

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: repo-schrijven
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exacte basis vastleggen
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Actuele regelgeving ophalen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/regelgeving-bijwerken.py

      - name: Wijziging valideren en committen
        id: commit
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Geen wijziging."
            exit 0
          fi

          if [ "$changed" != "data/regelgeving.json" ]; then
            echo "::error::UNAPPROVED_CHANGED_FILE:$changed"
            exit 1
          fi

          git config user.name "bedrijfsgeheugen-bot"
          git config user.email "arthur@bedrijfsgeheugen.nl"
          git add data/regelgeving.json
          git commit -m "Regelgeving bijgewerkt (AI Act, NIS2, GPAI)"

          CANDIDATE_BRANCH=$(node --input-type=module - <<'NODE'
          import { createWriterCandidate, validateWriterCandidate } from './scripts/ci/repo-writer-candidate.mjs';
          const candidate = createWriterCandidate({
            writer: 'regelgeving-bijwerken',
            baseSha: process.env.BASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            changedFiles: ['data/regelgeving.json'],
            allowedFiles: ['data/regelgeving.json'],
            rollbackSha: process.env.BASE_SHA,
          });
          validateWriterCandidate(candidate);
          console.log(candidate.branch);
          NODE
          )
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Candidate branch publiceren
        if: steps.commit.outputs.changed == 'true'
        env:
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$CANDIDATE_BRANCH"

      - name: Candidate PR openen
        id: candidate
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --head "$CANDIDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            pr_url=$(gh pr create \
              --base main \
              --head "$CANDIDATE_BRANCH" \
              --title "Regelgeving candidate $GITHUB_RUN_ID" \
              --body "BRAIN-DELIVERY-v2 candidate uit regelgeving-bijwerken. Base SHA: $BASE_SHA. Deze workflow pusht of merge't nooit rechtstreeks naar main; BG169 is productieautoriteit.")
            pr_number="${pr_url##*/}"
          else
            echo "Candidate PR bestaat al: #$pr_number"
          fi
          pr_base_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.base.sha')
          pr_head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')
          pr_head_ref=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.ref')
          [ "$pr_head_ref" = "$CANDIDATE_BRANCH" ] || { echo "::error::PR_HEAD_REF_DRIFT:$CANDIDATE_BRANCH:$pr_head_ref"; exit 1; }
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "base_sha=$pr_base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$pr_head_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Dispatch read-only shadow verification
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          gh workflow run repo-writer-candidate-shadow.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f base_sha="$BASE_SHA" \
            -f head_sha="$HEAD_SHA" \
            -f candidate_branch="$CANDIDATE_BRANCH"

      - name: Ouderdom bewaken
        run: |
          PEIL=$(python3 -c "import json;print(json.load(open('data/regelgeving.json'))['peildatumISO'])")
          DAGEN=$(( ( $(date +%s) - $(date -d "$PEIL" +%s) ) / 86400 ))
          echo "Peildatum $PEIL, $DAGEN dagen oud."
          if [ "$DAGEN" -gt 45 ]; then
            echo "::error::De regelgeving op /frisse-blik is $DAGEN dagen niet gecontroleerd."
            exit 1
          fi

      - name: BRAIN v2 handoff evidence
        if: steps.commit.outputs.changed == 'true'
        run: |
          echo "production_authority=BG169"
          echo "direct_main_push=false"
