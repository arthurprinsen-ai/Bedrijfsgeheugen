name: Regelgeving bijwerken

# De compliance-datums op /frisse-blik moeten altijd kloppen. Deze workflow zoekt
# wordt alleen gestart na een gewijzigde officiële bronstate of handmatig en levert uitsluitend een candidate PR.

on:
  push:
    branches:
      - main
    paths:
      - 'data/regulatory-source-state.json'
  workflow_dispatch:
    inputs:
      delivery_mode:
        description: 'BRAIN v2 staat alleen gecontroleerde candidate PR delivery toe'
        type: choice
        required: true
        default: candidate-pr
        options:
          - candidate-pr

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-schrijven
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exacte basis vastleggen
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Actuele regelgeving ophalen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/regelgeving-bijwerken.py

      - name: Wijziging valideren en committen
        id: commit
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Geen wijziging."
            exit 0
          fi

          if [ "$changed" != "data/regelgeving.json" ]; then
            echo "::error::UNAPPROVED_CHANGED_FILE:$changed"
            exit 1
          fi

          git config user.name "bedrijfsgeheugen-bot"
          git config user.email "arthur@bedrijfsgeheugen.nl"
          git add data/regelgeving.json
          git commit -m "Regelgeving bijgewerkt (AI Act, NIS2, GPAI)"

          CANDIDATE_BRANCH=$(node --input-type=module - <<'NODE'
          import { createWriterCandidate, validateWriterCandidate } from './scripts/ci/repo-writer-candidate.mjs';
          const candidate = createWriterCandidate({
            writer: 'regelgeving-bijwerken',
            baseSha: process.env.BASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            changedFiles: ['data/regelgeving.json'],
            allowedFiles: ['data/regelgeving.json'],
            rollbackSha: process.env.BASE_SHA,
          });
          validateWriterCandidate(candidate);
          console.log(candidate.branch);
          NODE
          )
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Candidate branch publiceren
        if: steps.commit.outputs.changed == 'true'
        env:
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$CANDIDATE_BRANCH"

      - name: Candidate PR openen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$CANDIDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Candidate PR bestaat al: #$existing"
            exit 0
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          SOURCE_STATE_SHA=$(sha256sum data/regulatory-source-state.json | awk '{print $1}')
          gh pr create \
            --base main \
            --head "$CANDIDATE_BRANCH" \
            --title "Regelgeving interpretatie candidate $GITHUB_RUN_ID" \
            --body "$(cat <<EOF
          Obligation-ID: regulatory-interpretation-$GITHUB_RUN_ID
          Delivery-Lane: automation
          Candidate-Type: implementation
          Regulatory-Candidate-Type: interpretation-review
          Base-SHA: $BASE_SHA
          Source-State-SHA: $SOURCE_STATE_SHA
          Candidate-Head: $HEAD_SHA

          Dit is een afgeleide interpretatiekandidaat. De officiële source observations en hashes zijn de autoriteit; deze kandidaat mag alleen worden gepromoveerd na evidence-validatie tegen die baseline.
          EOF
          )"

      - name: Ouderdom bewaken
        run: |
          PEIL=$(python3 -c "import json;print(json.load(open('data/regelgeving.json'))['peildatumISO'])")
          DAGEN=$(( ( $(date +%s) - $(date -d "$PEIL" +%s) ) / 86400 ))
          echo "Peildatum $PEIL, $DAGEN dagen oud."
          if [ "$DAGEN" -gt 45 ]; then
            echo "::error::De regelgeving op /frisse-blik is $DAGEN dagen niet gecontroleerd."
            exit 1
          fi

      - name: BRAIN v2 handoff evidence
        if: steps.commit.outputs.changed == 'true'
        run: |
          echo "production_authority=BG169"
          echo "direct_main_push=false"
