name: Diagnose Netlify Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-netlify-build.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATIC_I18N_NETWORK: "0"
      STATIC_I18N_REQUIRE_CACHE: "1"
      NODE_OPTIONS: "--max-old-space-size=2048"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
      - run: npm install --prefer-offline --ignore-scripts --no-audit --no-fund
      - name: pricing integrity capture
        run: node tools/site-shell/pricing-build-integrity.mjs capture
      - name: bedrijfslek integrity capture
        run: node tools/site-shell/bedrijfslek-build-integrity.mjs capture
      - name: auth build
        run: node tools/bouw-powerhouse-auth.mjs
      - name: knowledge index
        run: node tools/bouw-kennisindex.mjs
      - name: v18 production
        run: node tools/bouw-v18-production.mjs
      - name: tabs
        run: node tools/apply-tabbladen.mjs
      - name: views
        run: node tools/bouw-v18-views.mjs
      - name: chrome
        run: node tools/bouw-v18-chrome-alles.mjs
      - name: pricing homepage
        run: node tools/prijzen-uit-de-homepage.mjs
      - name: normalize UI
        run: node tools/normaliseer-site-ui.mjs
      - name: pricing integrity restore
        run: node tools/site-shell/pricing-build-integrity.mjs restore
      - name: bedrijfslek integrity restore
        run: node tools/site-shell/bedrijfslek-build-integrity.mjs restore
      - name: apply i18n
        run: node tools/site-shell/apply-i18n.mjs
      - name: localized routes
        run: node tools/site-shell/build-localized-routes.mjs
      - name: sitemap
        run: node tools/genereer-sitemap.mjs
      - name: release evidence
        run: node tools/bouw-release-evidence.mjs
