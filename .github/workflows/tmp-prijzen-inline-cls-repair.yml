name: tmp prijzen inline CLS repair

on:
  push:
    branches:
      - fix/prijzen-mobile-whitebar-guard

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'chore: apply inline prijzen CLS repair')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/prijzen-mobile-whitebar-guard
          fetch-depth: 0
      - name: Patch inline canonical CSS and remove late external override
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/site-shell/apply-shell.mjs')
          s = p.read_text()
          old = '@media(max-width:768px){.paginakop{padding:104px 0 46px}.held .bgkruim{padding-bottom:14px!important}}'
          new = '''@media(max-width:768px){.paginakop{padding:104px 0 46px}.held .bgkruim{padding-bottom:14px!important}\nbody:has(.held .heldknoppen) .held .bgkruim,body:has(.held .heldknoppen) .held .pil,body:has(.held .heldknoppen) .held h1,body:has(.held .heldknoppen) .held .ondertitel,body:has(.held .heldknoppen) .held .payoff,body:has(.held .heldknoppen) .held .intro,body:has(.held .heldknoppen) .held .heldknoppen,body:has(.held .heldknoppen) .held .bovenop{font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important}}'''
          if old not in s:
              raise SystemExit('expected PAGE_SHELL_CSS mobile rule not found')
          p.write_text(s.replace(old, new, 1))

          c = Path('assets/kop.css')
          css = c.read_text()
          marker = '/* /prijzen mobile: stabilize the native source hero before the canonical'
          i = css.find(marker)
          if i < 0:
              raise SystemExit('expected late external prijzen override not found')
          c.write_text(css[:i].rstrip() + '\n')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/tmp-prijzen-inline-cls-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/site-shell/apply-shell.mjs assets/kop.css .github/workflows/tmp-prijzen-inline-cls-repair.yml
          git commit -m 'chore: apply inline prijzen CLS repair'
          git push origin HEAD:fix/prijzen-mobile-whitebar-guard
