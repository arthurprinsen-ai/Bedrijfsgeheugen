name: Blog bijwerken
# Werkt bestaande artikelen bij wanneer zoekwoord, meta-omschrijving of interne links
# in Notion zijn gewijzigd. AI mag uitsluitend contentbestanden voorbereiden;
# validatie, staging, commit en push zijn deterministische workflowverantwoordelijkheid.
on:
  schedule:
    - cron: '30 6 * * 1,2,3,4,5'
  push:
    paths:
      - '.github/triggers/bijwerken/**'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optioneel: forceer een specifieke slug'
        required: false
        default: ''
      delivery_mode:
        description: 'Maak uitsluitend een gecontroleerde BRAIN v2 candidate PR'
        type: choice
        required: true
        default: candidate-pr
        options:
          - candidate-pr
      verification_mode:
        description: 'Gebruik uitsluitend een lokale operationele fixture; nooit Notion of betaalde AI'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: repo-schrijven
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exacte basis vastleggen
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bij te werken artikel ophalen uit Notion
        id: kalender
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_BLOG_DB }}
          FORCE_SLUG: ${{ github.event.inputs.slug }}
          VERIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode || false }}
          DELIVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_mode || 'candidate-pr' }}
        run: |
          set -euo pipefail
          if [ "$VERIFICATION_MODE" = "true" ]; then
            if [ "$DELIVERY_MODE" != "candidate-pr" ]; then
              echo "::error::VERIFICATION_REQUIRES_CANDIDATE_PR"
              exit 1
            fi
            slug="writer-verification-blog-update"
            target="blog/$slug/index.html"
            mkdir -p "$(dirname "$target")"
            cat > "$target" <<'HTML'
          <!doctype html>
          <html lang="nl">
          <head>
            <meta charset="utf-8">
            <title>Writer verification blog update</title>
            <link rel="canonical" href="https://www.bedrijfsgeheugen.nl/blog/writer-verification-blog-update/">
            <script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"Writer verification blog update","datePublished":"2026-01-01","dateModified":"2026-08-30"}</script>
          </head>
          <body><h1>Writer verification blog update</h1><h2>Writer verification blog update</h2><p>Lokale operationele verificatie; nooit publiceren.</p></body>
          </html>
          HTML
            printf '\n<!-- writer-verification-blog-update -->\n' >> sitemap.xml
            {
              echo "gevonden=true"
              echo "page_id="
              echo "slug=$slug"
              echo "titel=Writer verification blog update"
              echo "zoekwoord=writer verification blog update"
              echo "meta=Lokale operationele verificatie"
              echo "interne_links="
              echo "seo_blok="
              echo "paginatype=verification"
              echo "cluster=verification"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import json, os, urllib.request, pathlib, uuid

          token = os.environ.get("NOTION_TOKEN", "")
          db    = os.environ.get("NOTION_DB", "")
          force = (os.environ.get("FORCE_SLUG") or "").strip()
          out   = pathlib.Path(os.environ["GITHUB_OUTPUT"])

          if not (token and db):
              out.open("a").write("gevonden=false\n")
              print("Geen NOTION_TOKEN/NOTION_BLOG_DB ingesteld.")
              raise SystemExit(0)

          def tekst(props, naam):
              v = props.get(naam) or {}
              arr = v.get("rich_text") or v.get("title") or []
              return "".join(x.get("plain_text", "") for x in arr).strip()

          def keuze(props, naam):
              v = props.get(naam) or {}
              return ((v.get("select") or {}) or {}).get("name", "")

          def rollup_keuze(props, naam):
              v = props.get(naam) or {}
              for item in ((v.get("rollup") or {}).get("array") or []):
                  s = item.get("select") or {}
                  if s.get("name"):
                      return s["name"]
              return ""

          def schrijf(f, sleutel, waarde):
              waarde = waarde or ""
              if "\n" in waarde:
                  d = "EOF_" + uuid.uuid4().hex
                  f.write("%s<<%s\n%s\n%s\n" % (sleutel, d, waarde, d))
              else:
                  f.write("%s=%s\n" % (sleutel, waarde))

          req = urllib.request.Request(
              "https://api.notion.com/v1/databases/%s/query" % db,
              data=json.dumps({
                  "filter": {"and": [
                      {"property": "Status",  "select": {"equals": "Gepubliceerd"}},
                      {"property": "Herzien", "select": {"equals": "Voorstel klaar"}},
                  ]},
                  "page_size": 25,
              }).encode(),
              headers={
                  "Authorization": "Bearer " + token,
                  "Notion-Version": "2022-06-28",
                  "Content-Type": "application/json",
              },
              method="POST")

          gekozen = None
          for r in json.load(urllib.request.urlopen(req))["results"]:
              p = r["properties"]
              slug = tekst(p, "Slug")
              if not slug:
                  continue
              if force and slug != force:
                  continue
              if not pathlib.Path("blog", slug, "index.html").exists():
                  print("overslaan (artikel bestaat niet in de repo):", slug)
                  continue
              gekozen = {
                  "page_id": r["id"],
                  "slug": slug,
                  "titel": tekst(p, "Titel"),
                  "zoekwoord": tekst(p, "Focus-zoekwoord"),
                  "meta": tekst(p, "Meta-omschrijving"),
                  "interne_links": tekst(p, "Interne links"),
                  "seo_blok": tekst(p, "SEO-blok"),
                  "paginatype": keuze(p, "Paginatype"),
                  "cluster": rollup_keuze(p, "Cluster"),
              }
              break

          with out.open("a") as f:
              if not gekozen:
                  print("Niets te herzien.")
                  f.write("gevonden=false\n")
              else:
                  print("Bij te werken:", gekozen["slug"])
                  f.write("gevonden=true\n")
                  for k, v in gekozen.items():
                      schrijf(f, k, v)
          PY

      - name: Bestaande slugs verzamelen
        id: slugs
        if: steps.kalender.outputs.gevonden == 'true'
        run: |
          echo "lijst=$(ls -d blog/*/ 2>/dev/null | sed 's|blog/||;s|/||' | paste -sd', ')" >> "$GITHUB_OUTPUT"

      - name: Artikel bijwerken
        if: steps.kalender.outputs.gevonden == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.verification_mode)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-5 --max-turns 40 --allowedTools Read,Write,Edit,Glob,Grep"
          prompt: |
            Werk één BESTAAND blogartikel bij op www.bedrijfsgeheugen.nl. Je schrijft geen nieuw
            artikel: je past een bestaand bestand aan omdat de zoekwoordstrategie is gewijzigd.

            BESTAND: blog/${{ steps.kalender.outputs.slug }}/index.html

            WAT ER NU GELDT
            - Focus-zoekwoord: ${{ steps.kalender.outputs.zoekwoord }}
            - Titel in de kalender: ${{ steps.kalender.outputs.titel }}
            - Cluster: ${{ steps.kalender.outputs.cluster }}
            - Paginatype: ${{ steps.kalender.outputs.paginatype }}

            VOORGESCHREVEN META-OMSCHRIJVING
            ${{ steps.kalender.outputs.meta }}

            VOORGESCHREVEN INTERNE LINKS
            ${{ steps.kalender.outputs.interne_links }}

            SEO-BLOK UIT DE ZOEKWOORDENSTRATEGIE
            ${{ steps.kalender.outputs.seo_blok }}

            BESTAANDE ARTIKELEN OM NAAR TE LINKEN
            ${{ steps.slugs.outputs.lijst }}

            DE BELANGRIJKSTE REGEL
            Je herschrijft het artikel NIET. Pas alleen aan wat door de nieuwe zoekwoordkeuze niet
            meer klopt. Elke alinea die niets met het zoekwoord of de links te maken heeft blijft
            woord voor woord staan. Bij twijfel: laat staan.

            WAT JE WEL AANPAST
            1. De <title> als het nieuwe zoekwoord er niet in staat, maximaal 60 tekens.
            2. Meta description en og:description: gebruik voorgeschreven tekst letterlijk; is die
               leeg, pas minimaal aan zodat het zoekwoord erin staat.
            3. H1 en eerste honderd woorden: laat het zoekwoord exact en natuurlijk voorkomen;
               herschrijf hooguit twee zinnen.
            4. Minstens één H2 bevat het zoekwoord; pas een bestaande kop aan.
            5. Voeg voorgeschreven interne links toe met de opgegeven anchortekst. Bestaat een slug
               niet in de lijst, sla die link over en meld dat.
            6. dateModified in JSON-LD wordt vandaag; datePublished blijft ongewijzigd.
            7. sitemap.xml: lastmod van deze URL wordt vandaag.

            WAT JE NOOIT AANPAST
            - Slug, canonical-URL of bestandsnaam.
            - datePublished, auteur, prijzen of FAQ-antwoorden.
            - Andere artikelen, behalve maximaal één pijlerpagina van dit cluster als daar een
              teruglink naar dit artikel bij moet.
            - Huisstijl, head-structuur, topbalk, navigatie of footer.

            CONTROLE VOOR OPLEVERING: precies één h1, geldige JSON-LD, canonical ongewijzigd,
            geen interne link die op .html eindigt en geen link naar een niet-bestaande slug.

            Lever uitsluitend de benodigde bestandswijzigingen op. De workflow valideert daarna
            zelfstandig de changed-file allowlist en verzorgt staging, commit, conflictbehandeling
            en publicatie. Wijzig niets buiten het doelartikel, sitemap.xml en eventueel één
            bestaande cluster-pijlerpagina.

      - name: Deterministic update contract checks
        if: steps.kalender.outputs.gevonden == 'true'
        env:
          SLUG: ${{ steps.kalender.outputs.slug }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess

          slug = os.environ['SLUG']
          target = f'blog/{slug}/index.html'
          tracked = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          untracked = subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
          changed = sorted(set(tracked + untracked))
          assert changed, 'AI leverde geen bestandswijziging op'
          assert target in changed, f'doelartikel ontbreekt in wijzigingen: {changed}'
          assert 'sitemap.xml' in changed, f'sitemap.xml moet lastmod bijwerken: {changed}'

          optional_blog = [p for p in changed if re.fullmatch(r'blog/[a-z0-9-]+/index\.html', p) and p != target]
          assert len(optional_blog) <= 1, f'hooguit één pijlerpagina mag aanvullend wijzigen: {optional_blog}'
          allowed = {target, 'sitemap.xml', *optional_blog}
          unexpected = [p for p in changed if p not in allowed]
          assert not unexpected, f'onverwachte bestanden gewijzigd: {unexpected}'

          text = pathlib.Path(target).read_text(encoding='utf-8')
          assert len(re.findall(r'<h1(?:\s|>)', text)) == 1, 'exact één h1 vereist'
          canonical = re.search(r'<link rel="canonical" href="([^"]+)">', text)
          assert canonical and canonical.group(1).endswith(f'/blog/{slug}/'), 'canonical mag niet wijzigen'
          assert '.html' not in canonical.group(1), 'canonical mag geen .html bevatten'
          ld = re.search(r'<script type="application/ld\+json">(.*?)</script>', text, re.S)
          assert ld, 'JSON-LD ontbreekt'
          json.loads(ld.group(1))

          pathlib.Path('/tmp/validated-blog-update-files').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print('UPDATE_CONTRACT_OK', changed)
          PY

      - name: Commit validated changes
        id: commit
        if: steps.kalender.outputs.gevonden == 'true'
        env:
          SLUG: ${{ steps.kalender.outputs.slug }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          DELIVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_mode || 'candidate-pr' }}
        run: |
          set -euo pipefail
          mapfile -t changed < /tmp/validated-blog-update-files
          git config user.name "Bedrijfsgeheugen Publisher"
          git config user.email "actions@users.noreply.github.com"
          for path in "${changed[@]}"; do
            [ -n "$path" ] && git add -- "$path"
          done
          git commit -m "blog bijgewerkt: $SLUG"

          if [ "$DELIVERY_MODE" = "candidate-pr" ]; then
            export CHANGED_FILES="$(printf '%s\n' "${changed[@]}")"
            CANDIDATE_BRANCH=$(node --input-type=module - <<'NODE'
          import { createWriterCandidate, validateWriterCandidate } from './scripts/ci/repo-writer-candidate.mjs';
          const files = String(process.env.CHANGED_FILES || '').split('\n').filter(Boolean).sort();
          const candidate = createWriterCandidate({
            writer: 'blog-bijwerken',
            baseSha: process.env.BASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            changedFiles: files,
            allowedFiles: files,
            rollbackSha: process.env.BASE_SHA,
          });
          validateWriterCandidate(candidate);
          console.log(candidate.branch);
          NODE
            )
            echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "delivery=candidate-pr" >> "$GITHUB_OUTPUT"
          else
            echo "::error::DIRECT_DELIVERY_DISABLED_BY_BRAIN_V2"; exit 64
          fi

      - name: Candidate branch publiceren
        if: steps.kalender.outputs.gevonden == 'true' && steps.commit.outputs.delivery == 'candidate-pr'
        env:
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$CANDIDATE_BRANCH"

      - name: Candidate PR openen
        if: steps.kalender.outputs.gevonden == 'true' && steps.commit.outputs.delivery == 'candidate-pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SLUG: ${{ steps.kalender.outputs.slug }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$CANDIDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Candidate PR bestaat al: #$existing"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$CANDIDATE_BRANCH" \
            --title "Blog update candidate: $SLUG" \
            --body "Gecontroleerde candidate uit blog-bijwerken. Base SHA: $BASE_SHA. Notion blijft op Voorstel klaar totdat de wijziging werkelijk is gepromoveerd. Deze workflow merge't zichzelf niet."

      - name: Niets te doen
        if: steps.kalender.outputs.gevonden != 'true'
        run: echo "Geen gepubliceerd artikel met Herzien = Voorstel klaar."
