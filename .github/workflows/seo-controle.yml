name: Nieuwe pagina aanmelden (sitemap, 301, zoekwoord)

# Aanvulling op paginacontrole.yml, die de inhoudelijke SEO al doet.
# Deze workflow doet alleen wat daar niet in zit:
#   1. een nieuwe pagina in sitemap.xml zetten
#   2. de 301 van /pagina.html naar /pagina aanmaken in netlify.toml
#   3. melden als een pagina geen focus-zoekwoord declareert of er een
#      van een andere pagina afpakt
# De melding komt als regel in het dagplan via Make BG 53.
on:
  push:
    branches: [main]
    paths: ['*.html']
  workflow_dispatch:
    inputs:
      alles:
        description: 'Alle paginas nalopen in plaats van alleen de gewijzigde'
        type: boolean
        default: false
      delivery_mode:
        description: 'Publiceer direct of maak alleen een gecontroleerde candidate PR'
        type: choice
        required: true
        default: direct
        options:
          - direct
          - candidate-pr

# GEDEELD SLOT. Deze workflow schrijft sitemap.xml terug naar main, en dat doen
# seo-controle.yml, blog-bijwerken.yml en weekblog.yml alle drie. Draaien er twee
# tegelijk, dan slaagt de eerste push en wordt de tweede geweigerd: exit code 1.
# Daarom delen ze EEN groepsnaam. Een slot met een eigen naam per workflow houdt
# alleen zichzelf tegen en is dus geen slot. Wijzig deze naam nooit los.
concurrency:
  group: repo-schrijven
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Exacte basis vastleggen
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Zoekwoord en sitemap nalopen
        id: controle
        env:
          BG_SEO_WEBHOOK: ${{ secrets.BG_SEO_WEBHOOK }}
        continue-on-error: true
        run: |
          if [ "${{ inputs.alles }}" = "true" ]; then
            python3 tools/seo-controle.py --alles | tee uitkomst.txt
          else
            python3 tools/seo-controle.py | tee uitkomst.txt
          fi

      - name: Sitemap en redirects valideren en committen
        id: commit
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          DELIVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_mode || 'direct' }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- sitemap.xml netlify.toml)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Niets te herstellen."
            exit 0
          fi

          mapfile -t all_changed < <(git diff --name-only)
          for f in "${all_changed[@]}"; do
            case "$f" in
              sitemap.xml|netlify.toml) ;;
              *) echo "::error::UNAPPROVED_CHANGED_FILE:$f"; exit 1 ;;
            esac
          done

          git config user.name "SEO-poortwachter"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml netlify.toml
          git commit -m "SEO-poortwachter: sitemap en redirects bijgewerkt"

          if [ "$DELIVERY_MODE" = "candidate-pr" ]; then
            export CHANGED_FILES="$(printf '%s\n' "${changed[@]}")"
            CANDIDATE_BRANCH=$(node --input-type=module - <<'NODE'
          import { createWriterCandidate, validateWriterCandidate } from './scripts/ci/repo-writer-candidate.mjs';
          const files = String(process.env.CHANGED_FILES || '').split('\n').filter(Boolean).sort();
          const candidate = createWriterCandidate({
            writer: 'seo-controle',
            baseSha: process.env.BASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            changedFiles: files,
            allowedFiles: ['netlify.toml', 'sitemap.xml'],
            rollbackSha: process.env.BASE_SHA,
          });
          validateWriterCandidate(candidate);
          console.log(candidate.branch);
          NODE
            )
            echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "delivery=candidate-pr" >> "$GITHUB_OUTPUT"
          else
            echo "delivery=direct" >> "$GITHUB_OUTPUT"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Direct publiceren op huidige veilige pad
        if: steps.commit.outputs.changed == 'true' && steps.commit.outputs.delivery == 'direct'
        run: |
          set -euo pipefail
          for poging in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Gepusht bij poging $poging."
              exit 0
            fi
            echo "Push geweigerd, iemand was ons voor. Rebasen en opnieuw."
            git pull --rebase origin main || { echo "::error::Rebasen op main mislukte. Los het handmatig op: de sitemap of een 301 is niet weggeschreven."; exit 1; }
            sleep 3
          done
          echo "::error::Na drie pogingen kon de bijgewerkte sitemap/301 niet worden gepusht. Er is dus niets vastgelegd; draai deze workflow opnieuw."
          exit 1

      - name: Candidate branch publiceren
        if: steps.commit.outputs.changed == 'true' && steps.commit.outputs.delivery == 'candidate-pr'
        env:
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$CANDIDATE_BRANCH"

      - name: Candidate PR openen
        if: steps.commit.outputs.changed == 'true' && steps.commit.outputs.delivery == 'candidate-pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$CANDIDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Candidate PR bestaat al: #$existing"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$CANDIDATE_BRANCH" \
            --title "SEO candidate $GITHUB_RUN_ID" \
            --body "Gecontroleerde candidate uit seo-controle. Base SHA: $BASE_SHA. Deze workflow merge't zichzelf niet; normale repositorygates beslissen over promotie."

      - name: Uitkomst in de samenvatting
        run: cat uitkomst.txt >> $GITHUB_STEP_SUMMARY

      - name: Falen bij een echte fout
        run: exit ${{ steps.controle.outcome == 'failure' && 1 || 0 }}
