name: Nieuwe pagina aanmelden (sitemap, 301, zoekwoord)

# Aanvulling op paginacontrole.yml. Onder BRAIN v2 levert deze writer uitsluitend
# een gecontroleerde candidate PR; productiepromotie loopt via BG169.
on:
  push:
    branches: [main]
    paths: ['*.html']
  workflow_dispatch:
    inputs:
      alles:
        description: 'Alle paginas nalopen in plaats van alleen de gewijzigde'
        type: boolean
        default: false
      delivery_mode:
        description: 'BRAIN v2 staat alleen gecontroleerde candidate PR delivery toe'
        type: choice
        required: true
        default: candidate-pr
        options:
          - candidate-pr

concurrency:
  group: repo-schrijven
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Exacte basis vastleggen
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Zoekwoord en sitemap nalopen
        id: controle
        env:
          BG_SEO_WEBHOOK: ${{ secrets.BG_SEO_WEBHOOK }}
        continue-on-error: true
        run: |
          if [ "${{ inputs.alles }}" = "true" ]; then
            python3 tools/seo-controle.py --alles | tee uitkomst.txt
          else
            python3 tools/seo-controle.py | tee uitkomst.txt
          fi

      - name: Sitemap en redirects valideren en committen
        id: commit
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- sitemap.xml netlify.toml)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Niets te herstellen."
            exit 0
          fi

          mapfile -t all_changed < <(git diff --name-only)
          for f in "${all_changed[@]}"; do
            case "$f" in
              sitemap.xml|netlify.toml) ;;
              *) echo "::error::UNAPPROVED_CHANGED_FILE:$f"; exit 1 ;;
            esac
          done

          git config user.name "SEO-poortwachter"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml netlify.toml
          git commit -m "SEO-poortwachter: sitemap en redirects bijgewerkt"

          export CHANGED_FILES="$(printf '%s\n' "${changed[@]}")"
          CANDIDATE_BRANCH=$(node --input-type=module - <<'NODE'
          import { createWriterCandidate, validateWriterCandidate } from './scripts/ci/repo-writer-candidate.mjs';
          const files = String(process.env.CHANGED_FILES || '').split('\n').filter(Boolean).sort();
          const candidate = createWriterCandidate({
            writer: 'seo-controle',
            baseSha: process.env.BASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            changedFiles: files,
            allowedFiles: ['netlify.toml', 'sitemap.xml'],
            rollbackSha: process.env.BASE_SHA,
          });
          validateWriterCandidate(candidate);
          console.log(candidate.branch);
          NODE
          )
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Candidate branch publiceren
        if: steps.commit.outputs.changed == 'true'
        env:
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$CANDIDATE_BRANCH"

      - name: Candidate PR openen
        id: candidate
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --head "$CANDIDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            pr_url=$(gh pr create \
              --base main \
              --head "$CANDIDATE_BRANCH" \
              --title "SEO candidate $GITHUB_RUN_ID" \
              --body "BRAIN-DELIVERY-v2 candidate uit seo-controle. Base SHA: $BASE_SHA. Deze workflow pusht of merge't nooit rechtstreeks naar main; BG169 is productieautoriteit.")
            pr_number="${pr_url##*/}"
          else
            echo "Candidate PR bestaat al: #$pr_number"
          fi
          pr_base_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.base.sha')
          pr_head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')
          pr_head_ref=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.ref')
          [ "$pr_head_ref" = "$CANDIDATE_BRANCH" ] || { echo "::error::PR_HEAD_REF_DRIFT:$CANDIDATE_BRANCH:$pr_head_ref"; exit 1; }
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "base_sha=$pr_base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$pr_head_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Dispatch read-only shadow verification
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          gh workflow run repo-writer-candidate-shadow.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f base_sha="$BASE_SHA" \
            -f head_sha="$HEAD_SHA" \
            -f candidate_branch="$CANDIDATE_BRANCH"

      - name: Uitkomst in de samenvatting
        run: cat uitkomst.txt >> $GITHUB_STEP_SUMMARY

      - name: BRAIN v2 handoff evidence
        if: steps.commit.outputs.changed == 'true'
        run: |
          echo "production_authority=BG169"
          echo "direct_main_push=false"

      - name: Falen bij een echte fout
        run: exit ${{ steps.controle.outcome == 'failure' && 1 || 0 }}
