name: Powerhouse CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/powerhouse-codeql.yml'
  schedule:
    - cron: '41 4 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  pull-requests: read

concurrency:
  group: powerhouse-codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  scope:
    name: CodeQL scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_javascript: ${{ steps.scope.outputs.run_javascript }}
      run_python: ${{ steps.scope.outputs.run_python }}
    steps:
      - id: scope
        name: Decide applicable CodeQL languages
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_javascript=true" >> "$GITHUB_OUTPUT"
            echo "run_python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          if grep -Eq '\.(js|mjs|cjs|ts|tsx)$|^(package\.json|package-lock\.json|\.github/workflows/powerhouse-codeql\.yml)$' <<< "$files"; then
            echo "run_javascript=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_javascript=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '\.py$|^\.github/workflows/(codeql|powerhouse-codeql)\.yml$' <<< "$files"; then
            echo "run_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_python=false" >> "$GITHUB_OUTPUT"
          fi

  javascript:
    name: CodeQL javascript-typescript
    needs: scope
    if: needs.scope.outputs.run_javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  python:
    name: CodeQL python
    needs: scope
    if: needs.scope.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:python'
