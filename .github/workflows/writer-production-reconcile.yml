name: Writer production reconcile

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: writer-production-reconcile-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.body, 'Writer-Lease-State: TERMINAL_DELIVERY')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify BRAIN v2 production contains terminal merge
        id: production-proof
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 10 \
              https://www.bedrijfsgeheugen.nl/release.json -o /tmp/release.json; then
              observed="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const evidence=JSON.parse(readFileSync('/tmp/release.json','utf8'));
          if(evidence.contract!=='BRAIN-DELIVERY-v2') process.exit(2);
          if(evidence.production_authority!=='BG169') process.exit(3);
          const observed=String(evidence.commit_ref||'').trim();
          if(!/^[0-9a-f]{40}$/.test(observed)) process.exit(4);
          process.stdout.write(observed);
          NODE
              )" || observed=""
              if [ -n "$observed" ]; then
                git fetch --no-tags origin "$MERGE_SHA" "$observed" >/dev/null 2>&1 || true
                if git merge-base --is-ancestor "$MERGE_SHA" "$observed"; then
                  echo "observed_production_sha=$observed" >> "$GITHUB_OUTPUT"
                  echo "PRODUCTION_CONTAINS_WRITER_MERGE merge=$MERGE_SHA observed_production_sha=$observed"
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "::error::production commit must contain writer merge $MERGE_SHA"
          exit 1

      - name: Verify canonical learning and skill projection after production proof
        run: |
          set -euo pipefail
          node scripts/brain/powerhouse-skill-projection.mjs
          node scripts/brain/chat-learning-preflight.mjs
          node --test tests/brain-powerhouse-universal-agent-learning-writeback.test.mjs

      - name: Reconcile Notion only after exact production proof
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_BLOG_DB }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          writer=$(printf '%s' "$HEAD_REF" | cut -d/ -f2)
          case "$writer" in
            blog-bijwerken)
              slug="${PR_TITLE#Blog update candidate: }"
              action=reviewed
              ;;
            weekblog)
              slug="${PR_TITLE#Weekblog candidate: }"
              action=published
              ;;
            approved-central-blog)
              mapfile -t slugs < <(git diff --name-only "${MERGE_SHA}^1" "$MERGE_SHA" | sed -nE 's#^blog/([^/]+)/index\.html$#\1#p' | sort -u)
              if [ "${#slugs[@]}" -ne 1 ] || [ -z "${slugs[0]:-}" ]; then
                echo "::error::approved-central-blog requires exactly one merged blog/*/index.html path; found=${#slugs[@]}"
                exit 1
              fi
              slug="${slugs[0]}"
              action=published
              ;;
            *)
              echo "Geen Notion-publicatiestatus nodig voor writer=$writer"
              exit 0
              ;;
          esac
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_DB" ]; then
            echo "::error::NOTION_TOKEN/NOTION_BLOG_DB ontbreekt; production outcome blijft open"
            exit 1
          fi
          SLUG="$slug" ACTION="$action" python3 - <<'PY'
          import datetime, json, os, urllib.request
          token=os.environ['NOTION_TOKEN']; db=os.environ['NOTION_DB']; slug=os.environ['SLUG']; action=os.environ['ACTION']
          query={"filter":{"property":"Slug","rich_text":{"equals":slug}},"page_size":2}
          req=urllib.request.Request(
              f"https://api.notion.com/v1/databases/{db}/query",
              data=json.dumps(query).encode(),
              headers={"Authorization":"Bearer "+token,"Notion-Version":"2022-06-28","Content-Type":"application/json"},
              method="POST")
          rows=json.load(urllib.request.urlopen(req)).get('results',[])
          if len(rows)!=1:
              raise RuntimeError(f'exact één Notion-record vereist voor slug={slug}; gevonden={len(rows)}')
          today=datetime.date.today().isoformat()
          if action=='reviewed':
              props={"Herzien":{"select":{"name":"Goedgekeurd"}},"SEO bijgewerkt":{"date":{"start":today}}}
          else:
              props={"Status":{"select":{"name":"Gepubliceerd"}},"Publicatiedatum":{"date":{"start":today}},"URL":{"url":f"https://www.bedrijfsgeheugen.nl/blog/{slug}/"}}
          patch=urllib.request.Request(
              f"https://api.notion.com/v1/pages/{rows[0]['id']}",
              data=json.dumps({"properties":props}).encode(),
              headers={"Authorization":"Bearer "+token,"Notion-Version":"2022-06-28","Content-Type":"application/json"},
              method="PATCH")
          urllib.request.urlopen(patch).read()
          print('NOTION_PRODUCTION_RECONCILED', action, slug, os.environ['MERGE_SHA'])
          PY

      - name: Materialize terminal obligation closure evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          OBSERVED_PRODUCTION_SHA: ${{ steps.production-proof.outputs.observed_production_sha }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          obligation_id="$(printf '%s\n' "$PR_BODY" | sed -nE 's/^Obligation-ID:[[:space:]]*(.+)$/\1/ip' | head -n1)"
          delivery_lane="$(printf '%s\n' "$PR_BODY" | sed -nE 's/^Delivery-Lane:[[:space:]]*(.+)$/\1/ip' | head -n1)"
          candidate_type="$(printf '%s\n' "$PR_BODY" | sed -nE 's/^Candidate-Type:[[:space:]]*(.+)$/\1/ip' | head -n1)"
          test -n "$obligation_id"
          jq -n \
            --arg obligation_id "$obligation_id" \
            --arg delivery_lane "$delivery_lane" \
            --arg candidate_type "$candidate_type" \
            --argjson pr_number "$PR_NUMBER" \
            --arg merge_sha "$MERGE_SHA" \
            --arg observed_production_sha "$OBSERVED_PRODUCTION_SHA" \
            '{contract:"POWERHOUSE-GITHUB-DELIVERY-STATE-MACHINE-v1",terminal_state:"LIVE_BEWEZEN",obligation_id:$obligation_id,delivery_lane:$delivery_lane,candidate_type:$candidate_type,pr_number:$pr_number,merge_sha:$merge_sha,observed_production_sha:$observed_production_sha,main_readback:true,runtime_readback:true,outcome_evidence:true,learning_projection:true,skill_projection:true}' \
            > .artifacts/terminal-obligation-closure.json

      - name: Upload terminal closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: terminal-obligation-closure-${{ github.event.pull_request.number }}
          path: .artifacts/terminal-obligation-closure.json
          if-no-files-found: error
          retention-days: 90

      - name: BRAIN v2 production outcome evidence
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### BRAIN terminal delivery outcome'
            echo "- contract: BRAIN-DELIVERY-v2"
            echo "- production_authority: BG169"
            echo "- candidate: $HEAD_REF"
            echo "- PR: $PR"
            echo "- terminal_merge_sha: $MERGE_SHA"
            echo "- observed_production_sha: ${{ steps.production-proof.outputs.observed_production_sha }}"
            echo '- external_state_reconciled_after_exact_production: true'
            echo '- terminal_state: LIVE_BEWEZEN'
          } >> "$GITHUB_STEP_SUMMARY"
