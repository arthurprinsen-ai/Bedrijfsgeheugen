name: Writer production reconcile

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: writer-production-reconcile-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'writer/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1

      - name: Verify exact BRAIN v2 production identity
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 10 \
              https://www.bedrijfsgeheugen.nl/release.json -o /tmp/release.json; then
              if node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const evidence=JSON.parse(readFileSync('/tmp/release.json','utf8'));
          const expected=process.env.MERGE_SHA;
          if(evidence.contract!=='BRAIN-DELIVERY-v2') process.exit(2);
          if(evidence.production_authority!=='BG169') process.exit(3);
          if(evidence.commit_ref!==expected) process.exit(4);
          console.log('EXACT_PRODUCTION_GREEN', expected, evidence.deploy_id || '');
          NODE
              then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Exact merge SHA is not proven live in /release.json"
          exit 1

      - name: Reconcile Notion only after exact production proof
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_BLOG_DB }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          writer=$(printf '%s' "$HEAD_REF" | cut -d/ -f2)
          case "$writer" in
            blog-bijwerken)
              slug="${PR_TITLE#Blog update candidate: }"
              action=reviewed
              ;;
            weekblog)
              slug="${PR_TITLE#Weekblog candidate: }"
              action=published
              ;;
            *)
              echo "Geen Notion-publicatiestatus nodig voor writer=$writer"
              exit 0
              ;;
          esac
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_DB" ]; then
            echo "::error::NOTION_TOKEN/NOTION_BLOG_DB ontbreekt; production outcome blijft open"
            exit 1
          fi
          SLUG="$slug" ACTION="$action" python3 - <<'PY'
          import datetime, json, os, urllib.request
          token=os.environ['NOTION_TOKEN']; db=os.environ['NOTION_DB']; slug=os.environ['SLUG']; action=os.environ['ACTION']
          query={"filter":{"property":"Slug","rich_text":{"equals":slug}},"page_size":2}
          req=urllib.request.Request(
              f"https://api.notion.com/v1/databases/{db}/query",
              data=json.dumps(query).encode(),
              headers={"Authorization":"Bearer "+token,"Notion-Version":"2022-06-28","Content-Type":"application/json"},
              method="POST")
          rows=json.load(urllib.request.urlopen(req)).get('results',[])
          if len(rows)!=1:
              raise RuntimeError(f'exact één Notion-record vereist voor slug={slug}; gevonden={len(rows)}')
          today=datetime.date.today().isoformat()
          if action=='reviewed':
              props={"Herzien":{"select":{"name":"Goedgekeurd"}},"SEO bijgewerkt":{"date":{"start":today}}}
          else:
              props={"Status":{"select":{"name":"Gepubliceerd"}},"Publicatiedatum":{"date":{"start":today}},"URL":{"url":f"https://www.bedrijfsgeheugen.nl/blog/{slug}/"}}
          patch=urllib.request.Request(
              f"https://api.notion.com/v1/pages/{rows[0]['id']}",
              data=json.dumps({"properties":props}).encode(),
              headers={"Authorization":"Bearer "+token,"Notion-Version":"2022-06-28","Content-Type":"application/json"},
              method="PATCH")
          urllib.request.urlopen(patch).read()
          print('NOTION_PRODUCTION_RECONCILED', action, slug, os.environ['MERGE_SHA'])
          PY

      - name: BRAIN v2 production outcome evidence
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### BRAIN writer production outcome'
            echo "- contract: BRAIN-DELIVERY-v2"
            echo "- production_authority: BG169"
            echo "- candidate: $HEAD_REF"
            echo "- PR: $PR"
            echo "- exact_production_sha: $MERGE_SHA"
            echo '- external_state_reconciled_after_exact_production: true'
          } >> "$GITHUB_STEP_SUMMARY"
