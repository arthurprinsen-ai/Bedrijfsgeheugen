name: Writer production reconcile
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  reconcile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: node --test tests/production-promotion-controller.test.mjs tests/production-promotion-guardian.test.mjs tests/repository-writer-structural-parity.test.mjs
