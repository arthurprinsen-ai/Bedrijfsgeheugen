name: Automation release lane

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify automation delivery contracts
        run: >-
          node --test
          tests/delivery-*.test.mjs
          tests/brain-delivery-system.test.mjs
          tests/make-agent-learning-promotion-contract.test.mjs
          tests/chat-learning-completeness-addendum.test.mjs
          tests/brain-learning-contract-delivery-classification.test.mjs
          tests/brain-component-memory-registry.test.mjs
          tests/brain-knowledge-index-architecture.test.mjs
