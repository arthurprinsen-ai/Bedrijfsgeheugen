name: V18 Production Promotion

on:
  push:
    branches:
      - automation/v18-production-promotion
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify promotion, accepted baseline, and complete route catalog
        run: |
          node --test tests/v18-production-promotion.test.mjs tests/site-baseline-guardian.test.mjs tests/website-catalog.test.mjs
          node tools/audit-website-catalog.mjs
