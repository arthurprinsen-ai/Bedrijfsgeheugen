name: Verify approved central blog
on:
  workflow_dispatch:
    inputs:
      slug: {required: true, type: string}
      expected_title: {required: false, type: string}
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node --test tests/approved-blog-verifier-contract.test.mjs
