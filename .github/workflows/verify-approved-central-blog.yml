name: Verify approved central blog

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Exact approved article slug'
        required: true
        type: string
      queue_page:
        description: 'Exact SEO queue page id'
        required: true
        type: string
      central_page:
        description: 'Exact central media calendar page id'
        required: true
        type: string
      content_id:
        description: 'Exact central Content ID'
        required: true
        type: string
      expected_title:
        description: 'Exact approved article title'
        required: true
        type: string
      dispatch_attempt:
        description: 'Already completed publish dispatch attempt'
        required: true
        type: string
      verification_attempt:
        description: 'Previous verification attempt count'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: approved-blog-verify-${{ inputs.content_id }}-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate immutable verification identity
        env:
          SLUG: ${{ inputs.slug }}
          QUEUE_PAGE: ${{ inputs.queue_page }}
          CENTRAL_PAGE: ${{ inputs.central_page }}
          CONTENT_ID: ${{ inputs.content_id }}
          EXPECTED_TITLE: ${{ inputs.expected_title }}
          DISPATCH_ATTEMPT: ${{ inputs.dispatch_attempt }}
          VERIFICATION_ATTEMPT: ${{ inputs.verification_attempt }}
        run: |
          set -euo pipefail
          [[ "$SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo '::error::INVALID_SLUG'; exit 1; }
          [[ "$QUEUE_PAGE" =~ ^[0-9a-fA-F-]{32,36}$ ]] || { echo '::error::INVALID_QUEUE_PAGE'; exit 1; }
          [[ "$CENTRAL_PAGE" =~ ^[0-9a-fA-F-]{32,36}$ ]] || { echo '::error::INVALID_CENTRAL_PAGE'; exit 1; }
          [[ "$CONTENT_ID" =~ ^BG-[0-9]+$ ]] || { echo '::error::INVALID_CONTENT_ID'; exit 1; }
          [ -n "$EXPECTED_TITLE" ] || { echo '::error::EXPECTED_TITLE_EMPTY'; exit 1; }
          [[ "$DISPATCH_ATTEMPT" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_DISPATCH_ATTEMPT'; exit 1; }
          [[ "$VERIFICATION_ATTEMPT" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_VERIFICATION_ATTEMPT'; exit 1; }

      - name: Verify exact public outcome with bounded deployment-lag retry
        id: public
        env:
          SLUG: ${{ inputs.slug }}
          EXPECTED_TITLE: ${{ inputs.expected_title }}
          PREVIOUS_VERIFICATION_ATTEMPT: ${{ inputs.verification_attempt }}
        run: |
          set -euo pipefail
          EXPECTED_URL="https://www.bedrijfsgeheugen.nl/blog/${SLUG}/"
          printf '%s' "$EXPECTED_TITLE" > /tmp/expected-title.txt
          success=false
          HTTP_CODE=0
          reason=PUBLIC_PROOF_MISSING
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl --silent --show-error --location --max-time 20 \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              --output /tmp/article.html \
              --write-out '%{http_code}' \
              "${EXPECTED_URL}?verify=${GITHUB_RUN_ID}-${attempt}" || printf '0')
            if [ "$HTTP_CODE" = "200" ]; then
              if python3 - <<'PY'
          import html, os, pathlib, re, sys
          body = pathlib.Path('/tmp/article.html').read_text(encoding='utf-8', errors='replace')
          expected_title = pathlib.Path('/tmp/expected-title.txt').read_text(encoding='utf-8')
          slug = os.environ['SLUG']
          expected_url = f'https://www.bedrijfsgeheugen.nl/blog/{slug}/'
          title_match = re.search(r'<title[^>]*>(.*?)</title>', body, re.I | re.S)
          title = html.unescape(re.sub(r'<[^>]+>', '', title_match.group(1))).strip() if title_match else ''
          canonical_match = re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)["\']|<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']', body, re.I)
          canonical = next((x for x in canonical_match.groups() if x), '') if canonical_match else ''
          if title != expected_title:
              print(f'TITLE_MISMATCH expected={expected_title!r} actual={title!r}', file=sys.stderr)
              raise SystemExit(2)
          if canonical != expected_url:
              print(f'CANONICAL_MISMATCH expected={expected_url!r} actual={canonical!r}', file=sys.stderr)
              raise SystemExit(3)
          PY
              then
                success=true
                reason=PUBLIC_PROOF_OK
                break
              else
                rc=$?
                if [ "$rc" = "2" ]; then
                  reason=TITLE_MISMATCH
                else
                  reason=CANONICAL_MISMATCH
                fi
              fi
            else
              reason="HTTP_${HTTP_CODE}"
            fi
            sleep $((attempt * 2))
          done
          verification_attempt=$((PREVIOUS_VERIFICATION_ATTEMPT + 1))
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "url=$EXPECTED_URL" >> "$GITHUB_OUTPUT"
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "verification_attempt=$verification_attempt" >> "$GITHUB_OUTPUT"
          echo "verified_at=$verified_at" >> "$GITHUB_OUTPUT"
          echo "success=$success" >> "$GITHUB_OUTPUT"
          if [ "$success" != "true" ]; then
            echo "::error::$reason"
            exit 1
          fi
          echo "PUBLIC_PROOF_OK $EXPECTED_URL"

      - name: Write exact verified outcome to Notion
        if: steps.public.outputs.success == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          QUEUE_PAGE: ${{ inputs.queue_page }}
          CENTRAL_PAGE: ${{ inputs.central_page }}
          CONTENT_ID: ${{ inputs.content_id }}
          SLUG: ${{ inputs.slug }}
          PUBLIC_URL: ${{ steps.public.outputs.url }}
          VERIFIED_AT: ${{ steps.public.outputs.verified_at }}
          VERIFICATION_ATTEMPT: ${{ steps.public.outputs.verification_attempt }}
          DISPATCH_ATTEMPT: ${{ inputs.dispatch_attempt }}
        run: |
          set -euo pipefail
          [ -n "$NOTION_TOKEN" ] || { echo '::error::NOTION_TOKEN_MISSING'; exit 1; }
          python3 - <<'PY' >/tmp/queue.json
          import json, os
          print(json.dumps({'properties': {
            'Status': {'select': {'name': 'Gepubliceerd'}},
            'Dispatch status': {'select': {'name': 'Published'}},
            'Verified At': {'date': {'start': os.environ['VERIFIED_AT']}},
            'Last verification': {'date': {'start': os.environ['VERIFIED_AT']}},
            'Verification attempt': {'number': int(os.environ['VERIFICATION_ATTEMPT'])},
            'Failure fingerprint': {'rich_text': []},
            'URL': {'url': os.environ['PUBLIC_URL']},
          }}))
          PY
          python3 - <<'PY' >/tmp/central.json
          import json, os
          print(json.dumps({'properties': {
            'Make status': {'select': {'name': 'Gepubliceerd'}},
            'Publicatielink': {'url': os.environ['PUBLIC_URL']},
            'Publish Attempt': {'number': int(os.environ['DISPATCH_ATTEMPT'])},
            'Publish Verified At': {'date': {'start': os.environ['VERIFIED_AT']}},
            'Foutmelding': {'rich_text': []},
          }}))
          PY
          curl --fail-with-body --silent --show-error --request PATCH \
            --url "https://api.notion.com/v1/pages/$QUEUE_PAGE" \
            --header "Authorization: Bearer $NOTION_TOKEN" \
            --header 'Notion-Version: 2025-09-03' \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/queue.json >/tmp/queue-response.json
          curl --fail-with-body --silent --show-error --request PATCH \
            --url "https://api.notion.com/v1/pages/$CENTRAL_PAGE" \
            --header "Authorization: Bearer $NOTION_TOKEN" \
            --header 'Notion-Version: 2025-09-03' \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/central.json >/tmp/central-response.json
          echo "PUBLIC_PROOF_OK content_id=$CONTENT_ID slug=$SLUG url=$PUBLIC_URL verification attempt=$VERIFICATION_ATTEMPT"
