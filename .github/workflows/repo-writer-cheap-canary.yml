name: Repository Writer Cheap Canary
on:
  workflow_dispatch:
    inputs:
      writer:
        type: choice
        required: true
        options: [regelgeving-bijwerken, seo-controle, weekblog]
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: node --test tests/repo-writer-candidate.test.mjs tests/repo-writer-shadow.test.mjs tests/repository-writer-structural-parity.test.mjs
