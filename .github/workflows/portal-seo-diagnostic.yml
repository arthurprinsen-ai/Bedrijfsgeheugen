name: Portal SEO diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  seo-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run SEO control and preserve exit code
        shell: bash
        run: |
          set +e
          python .github/scripts/seocontrole.py
          rc=$?
          echo "SEO_EXIT_CODE=$rc"
          cat seo-rapport.md 2>/dev/null || true
          exit $rc
      - name: Upload SEO diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-seo-diagnostic
          path: seo-rapport.md
          if-no-files-found: warn
          retention-days: 1

  page-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium
      - name: Hypothesis test - remove vertical re-centering from due-diligence hero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('due-diligence.html')
          s = p.read_text(encoding='utf-8')
          old = '.p-hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center}'
          new = '.p-hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:start}'
          if old not in s:
              raise SystemExit('hypothesis selector not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run browser page control with hypothesis patch
        shell: bash
        run: |
          set +e
          python .github/scripts/paginacontrole.py
          rc=$?
          echo "PAGE_EXIT_CODE=$rc"
          cat rapport.md 2>/dev/null || true
          exit $rc
      - name: Upload page diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-page-diagnostic
          path: rapport.md
          if-no-files-found: warn
          retention-days: 1
