name: Portal SEO diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  seo-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run SEO control
        run: python .github/scripts/seocontrole.py
      - name: Upload SEO diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-seo-diagnostic
          path: seo-rapport.md
          if-no-files-found: warn
          retention-days: 1

  page-diagnostic-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/klantenportaal-brain-powerhouse-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply proven due-diligence CLS fix in candidate workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('due-diligence.html')
          s = p.read_text(encoding='utf-8')
          old = '.p-hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center}'
          new = '.p-hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:start}'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          elif new not in s:
              raise SystemExit('expected due-diligence hero selector not found')
          PY
      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium
      - name: Verify full page control
        run: python .github/scripts/paginacontrole.py
      - name: Commit only after green verification
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- due-diligence.html; then
            echo 'due-diligence fix already present'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- due-diligence.html
          git commit -m "fix: stabilize due-diligence hero layout"
          git push origin HEAD:feature/klantenportaal-brain-powerhouse-v1
      - name: Upload page diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-page-diagnostic
          path: rapport.md
          if-no-files-found: warn
          retention-days: 1
