name: Portal Auth Evidence Freshness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-auth-evidence-freshness:
    name: Portal Auth Evidence Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Reject stale authenticated Portal production claims
        run: node tools/ci/portal-auth-evidence-freshness.mjs
      - name: Run freshness regression tests
        run: node --test tests/portal-auth-evidence-freshness.test.mjs
