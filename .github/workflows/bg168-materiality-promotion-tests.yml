name: BG168 Materiality Promotion Tests

on:
  push:
    branches:
      - 'automation/make-agent-learning-policy'
      - 'automation/brain-core-registry'
      - 'automation/brain-knowledge-config'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: |
          node --test tests/make-agent-learning-promotion-contract.test.mjs
          node --test tests/chat-learning-completeness-addendum.test.mjs
          node --test tests/brain-component-memory-registry.test.mjs
          node --test tests/brain-knowledge-index-architecture.test.mjs
