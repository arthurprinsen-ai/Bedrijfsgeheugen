name: Powerhouse Obligation Terminalizer

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: obligation-terminalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  terminalize:
    if: "${{ github.event.pull_request.merged == true && contains(github.event.pull_request.body, 'Writer-Lease-State: TERMINAL_DELIVERY') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate canonical merged lineage
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          git fetch origin main --no-tags
          git fetch origin "$CANDIDATE_SHA" --no-tags || true
          lineage_mode=""
          if git cat-file -e "$CANDIDATE_SHA^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$CANDIDATE_SHA" "$MERGE_SHA"; then
              lineage_mode="ancestor"
            elif [ "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$(git rev-parse "$MERGE_SHA^{tree}")" ]; then
              lineage_mode="squash_tree_equivalent"
            fi
          fi
          if [ -z "$lineage_mode" ]; then
            echo "::error::POST_MERGE_CANDIDATE_NOT_CONTAINED_OR_TREE_EQUIVALENT:$CANDIDATE_SHA:$MERGE_SHA"
            exit 78
          fi
          echo "LINEAGE_MODE=$lineage_mode" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$MERGE_SHA" origin/main
          PR_BODY="$PR_BODY" CANDIDATE_SHA="$CANDIDATE_SHA" MERGE_SHA="$MERGE_SHA" PR_NUMBER="$PR_NUMBER" LINEAGE_MODE="$lineage_mode" node --input-type=module - <<'NODE'
          import { writeFileSync, readFileSync } from 'node:fs';
          import { validateMachineReadablePrBody } from './tools/delivery/github-delivery-state-machine.mjs';
          const policy=JSON.parse(readFileSync('config/powerhouse-delivery-hygiene-v1.json','utf8'));
          const result=validateMachineReadablePrBody({body:process.env.PR_BODY||'',candidateHeadSha:process.env.CANDIDATE_SHA,policy});
          if(!result.ok || !result.terminal){
            console.error(JSON.stringify({state:'POST_MERGE_LINEAGE_INVALID',...result},null,2));
            process.exit(78);
          }
          writeFileSync('.artifacts/terminal-lineage.json',JSON.stringify({
            state:'MERGED_LINEAGE_VERIFIED',
            obligation_id:result.metadata.obligationId,
            candidate_head_sha:process.env.CANDIDATE_SHA,
            merge_sha:process.env.MERGE_SHA,
            lineage_mode:process.env.LINEAGE_MODE||'unknown',
            pr_number:Number(process.env.PR_NUMBER),
            writer_lease:result.lease
          },null,2));
          NODE

      - name: Verify production promotion and runtime readback
        id: production
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          changed_paths="$(git diff --name-only "${MERGE_SHA}^1" "$MERGE_SHA" || true)"

          verifier_only_paths="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const contract=JSON.parse(readFileSync('brain/contracts/production-readback-v1.json','utf8'));
          for (const path of contract?.productionTruth?.verifierOnlyPaths || []) console.log(String(path));
          NODE
          )"

          is_governance_path() {
            case "$1" in
              docs/*|.agents/*|tests/*|.github/*|brain/learning/*|brain/policies/*|tools/delivery/*|AGENTS.md|platform/system-map/canonical-system-map.mjs|tools/brain-delivery-system.mjs|config/powerhouse-agent-delivery-scheduler-v1.json|config/brain-delivery-system.json)
                return 0
                ;;
            esac
            grep -Fxq -- "$1" <<< "$verifier_only_paths"
          }

          observed="$(git rev-parse origin/main)"
          prove_main_containment() {
            git merge-base --is-ancestor "$MERGE_SHA" "$observed" || {
              echo "::error::POST_MERGE_MAIN_CONTAINMENT_FAILED:$MERGE_SHA:$observed"
              exit 78
            }
            echo "production_sha=$observed" >> "$GITHUB_OUTPUT"
          }

          governance_only=true
          non_governance_paths=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if is_governance_path "$path"; then
              continue
            fi
            governance_only=false
            non_governance_paths="${non_governance_paths}${path}"$'\n'
          done <<< "$changed_paths"

          if [ "$governance_only" = true ]; then
            prove_main_containment
            echo "readback_mode=non_runtime" >> "$GITHUB_OUTPUT"
            echo "PRODUCTION_READBACK_NOT_APPLICABLE_NON_RUNTIME:MAIN_CONTAINMENT_NON_RUNTIME:$MERGE_SHA:$observed"
            exit 0
          fi

          parity_recovery=false
          if grep -q '^Candidate-Type: recovery$' <<< "$PR_BODY" \
             && grep -Eq '^Obligation-ID: supabase-migration-history-(parity|canonical)-' <<< "$PR_BODY"; then
            parity_recovery=true
          fi

          if [ "$parity_recovery" = true ]; then
            invalid_recovery_path=false
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                supabase/migrations/*|supabase/migration-history/*|supabase/migration-history.lock.json|supabase/production-baseline/*|scripts/brain/check_powerhouse_supabase_security.py|scripts/brain/quality/*|config/powerhouse-quality-surface-contracts.json)
                  ;;
                *)
                  invalid_recovery_path=true
                  echo "::error::SUPABASE_PARITY_RECOVERY_CONTAINS_RUNTIME_PATH:$path"
                  ;;
              esac
            done <<< "$non_governance_paths"
            [ "$invalid_recovery_path" = false ] || exit 78
            prove_main_containment
            echo "readback_mode=supabase_history_parity_recovery" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_HISTORY_PARITY_RECOVERY_RUNTIME_NOT_APPLICABLE:$MERGE_SHA:$observed"
            exit 0
          fi

          runtime_classes="$(NON_GOVERNANCE_PATHS="$non_governance_paths" node --input-type=module - <<'NODE'
          import { isNetlifyRuntimePath } from './tools/site-shell/production-supersession.mjs';
          const paths=String(process.env.NON_GOVERNANCE_PATHS||'').split(/\r?\n/).filter(Boolean);
          const supabase=paths.filter(path=>/^supabase\/functions\/[^/]+\//.test(path));
          const netlify=paths.filter(path=>isNetlifyRuntimePath(path));
          const unknown=paths.filter(path=>!supabase.includes(path)&&!netlify.includes(path));
          process.stdout.write(JSON.stringify({supabase,netlify,unknown}));
          NODE
          )"
          unknown_runtime_paths="$(jq -r '.unknown[]?' <<<"$runtime_classes")"
          if [ -n "$unknown_runtime_paths" ]; then
            echo "::error::UNWIRED_NON_NETLIFY_RUNTIME_READBACK"
            printf '%s\n' "$unknown_runtime_paths"
            exit 78
          fi

          mapfile -t changed_functions < <(jq -r '.supabase[]?' <<<"$runtime_classes" | sed -nE 's#^supabase/functions/([^/]+)/.*#\1#p' | sort -u)
          supabase_required=false
          printf '[]\n' > .artifacts/supabase-provider-readbacks.json
          if [ "${#changed_functions[@]}" -gt 0 ]; then
            supabase_required=true
            provider_lines="$(printf '%s\n' "$PR_BODY" | sed -n 's/^Terminal-Supabase-Provider-Readback:[[:space:]]*//p')"
            if [ -z "$provider_lines" ]; then
              echo "::error::SUPABASE_PROVIDER_READBACK_MISSING"
              exit 78
            fi
            readbacks='[]'
            for fn in "${changed_functions[@]}"; do
              line="$(printf '%s\n' "$provider_lines" | grep -E "^function=${fn};version=[1-9][0-9]*;runtime_sha256=[0-9a-fA-F]{64}$" | tail -n1 || true)"
              if [ -z "$line" ]; then
                echo "::error::SUPABASE_PROVIDER_READBACK_INCOMPLETE:${fn}"
                exit 78
              fi
              version="$(sed -nE 's/.*;version=([1-9][0-9]*);.*/\1/p' <<<"$line")"
              runtime_sha256="$(sed -nE 's/.*;runtime_sha256=([0-9a-fA-F]{64})$/\1/p' <<<"$line" | tr '[:upper:]' '[:lower:]')"
              readbacks="$(jq -c --arg fn "$fn" --argjson version "$version" --arg runtime_sha256 "$runtime_sha256" '. + [{function:$fn,version:$version,runtime_sha256:$runtime_sha256,state:"ACTIVE"}]' <<<"$readbacks")"
              echo "SUPABASE_PROVIDER_READBACK_PROVEN:${line}"
            done
            printf '%s\n' "$readbacks" > .artifacts/supabase-provider-readbacks.json
          fi

          netlify_required="$(jq -r '(.netlify|length)>0' <<<"$runtime_classes")"
          if [ "$netlify_required" != true ]; then
            [ "$supabase_required" = true ] || {
              echo "::error::UNWIRED_NON_NETLIFY_RUNTIME_READBACK"
              printf '%s' "$non_governance_paths"
              exit 78
            }
            prove_main_containment
            echo "readback_mode=supabase_edge_provider" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_EDGE_PROVIDER_READBACK_PROVEN:functions=${changed_functions[*]} merge=$MERGE_SHA"
            exit 0
          fi

          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 10 https://www.bedrijfsgeheugen.nl/release.json -o /tmp/release.json \
              && curl --fail --silent --show-error --max-time 10 https://www.bedrijfsgeheugen.nl/ -o /tmp/runtime.html; then
              observed="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const release=JSON.parse(readFileSync('/tmp/release.json','utf8'));
          if(release.contract!=='BRAIN-DELIVERY-v2') process.exit(2);
          if(release.production_authority!=='BG169') process.exit(3);
          const sha=String(release.commit_ref||'').trim();
          if(!/^[0-9a-f]{40}$/i.test(sha)) process.exit(4);
          process.stdout.write(sha);
          NODE
              )" || observed=""
              if [ -n "$observed" ]; then
                git fetch --no-tags origin "$observed" >/dev/null 2>&1 || true
                if git merge-base --is-ancestor "$MERGE_SHA" "$observed" && [ -s /tmp/runtime.html ]; then
                  echo "production_sha=$observed" >> "$GITHUB_OUTPUT"
                  if [ "$supabase_required" = true ]; then
                    echo "readback_mode=netlify_runtime_supabase_provider" >> "$GITHUB_OUTPUT"
                  else
                    echo "readback_mode=netlify_runtime" >> "$GITHUB_OUTPUT"
                  fi
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "::error::POST_MERGE_PRODUCTION_READBACK_FAILED:$MERGE_SHA"
          exit 1

      - name: Verify learning and skill projection
        run: |
          set -euo pipefail
          node scripts/brain/powerhouse-skill-projection.mjs
          node scripts/brain/chat-learning-preflight.mjs >/tmp/chat-learning-preflight.json

      - name: Materialize terminal outcome evidence
        env:
          PRODUCTION_SHA: ${{ steps.production.outputs.production_sha }}
          READBACK_MODE: ${{ steps.production.outputs.readback_mode }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module - <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          const lineage=JSON.parse(readFileSync('.artifacts/terminal-lineage.json','utf8'));
          const preflight=JSON.parse(readFileSync('/tmp/chat-learning-preflight.json','utf8'));
          const providerReadbacks=existsSync('.artifacts/supabase-provider-readbacks.json')
            ? JSON.parse(readFileSync('.artifacts/supabase-provider-readbacks.json','utf8'))
            : [];
          const runtimeReadbackModes=['netlify_runtime','supabase_edge_provider','netlify_runtime_supabase_provider'];
          const evidence={
            contract:'POWERHOUSE-GITHUB-DELIVERY-STATE-MACHINE-v1',
            fingerprint:'github|delivery-state-machine|parallel-build-serialized-landing|v1',
            terminal_status:'LIVE_BEWEZEN',
            obligation_id:lineage.obligation_id,
            pr_number:Number(process.env.PR_NUMBER),
            candidate_head_sha:process.env.CANDIDATE_SHA,
            merge_sha:process.env.MERGE_SHA,
            production_sha:process.env.PRODUCTION_SHA,
            readback_mode:process.env.READBACK_MODE,
            checks:{
              merged_lineage_verified:['ancestor','squash_tree_equivalent'].includes(lineage.lineage_mode),
              deploy_promotion_readback:runtimeReadbackModes.includes(process.env.READBACK_MODE),
              runtime_function_readback:runtimeReadbackModes.includes(process.env.READBACK_MODE),
              production_readback_not_applicable:['non_runtime','supabase_history_parity_recovery'].includes(process.env.READBACK_MODE),
              supabase_provider_readback:['supabase_edge_provider','netlify_runtime_supabase_provider'].includes(process.env.READBACK_MODE),
              outcome_evidence:true,
              learning_projection:preflight?.status==='READY',
              skill_projection:true
            },
            supabase_provider_readbacks:providerReadbacks
          };
          if(!evidence.checks.merged_lineage_verified) throw new Error('MERGED_LINEAGE_NOT_VERIFIED');
          if(!evidence.checks.learning_projection) throw new Error('LEARNING_PROJECTION_NOT_READY');
          if(!evidence.checks.deploy_promotion_readback && !evidence.checks.production_readback_not_applicable) {
            throw new Error('TERMINAL_PRODUCTION_READBACK_MODE_UNPROVEN');
          }
          if(evidence.checks.supabase_provider_readback && providerReadbacks.length===0) {
            throw new Error('TERMINAL_SUPABASE_PROVIDER_READBACK_EVIDENCE_MISSING');
          }
          writeFileSync('.artifacts/obligation-terminal-evidence.json',JSON.stringify(evidence,null,2));
          console.log(JSON.stringify(evidence,null,2));
          NODE

      - name: Upload terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: obligation-terminal-evidence-${{ github.event.pull_request.number }}
          path: |
            .artifacts/terminal-lineage.json
            .artifacts/obligation-terminal-evidence.json
          if-no-files-found: error
          retention-days: 90
