name: Powerhouse Daily Self Evolution

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      execution_scope:
        description: 'Full daily learning or bounded recovery of ORIGINAL innovation intake only'
        required: true
        type: choice
        default: daily
        options:
          - daily
          - original_intake_recovery
permissions:
  contents: read
  actions: read

concurrency:
  group: powerhouse-daily-self-evolution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Single shared admission for both independent daily jobs. The scheduled
  # GitHub event may arrive hours after a manual recovery: do not run twice.
  daily-admission:
    # The one daily fence remains mandatory for the normal daily route.
    # A scoped recovery must never repeat full daily learning/freshness work.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.execution_scope != 'original_intake_recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prove first daily GitHub workflow run before any learning or catalog audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/delivery/daily-learning-run-admission.mjs

  improve:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.execution_scope != 'original_intake_recovery' }}
    needs: daily-admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify portal explanation source freshness
        run: |
          node scripts/brain/portal-explanation-inventory.mjs --check
          node --test tests/brain-portal-explanation-autosync-v1.test.mjs tests/brain-powerhouse-live-system-map-v1.test.mjs tests/brain-powerhouse-system-map-governance-v1.test.mjs
      - name: Enforce unified Brain Heartbeat skill and revenue learning contract
        run: | 
          node scripts/brain/validate-unified-learning-contract.mjs
          node --test tests/brain-unified-learning-contract.test.mjs
      - name: Mandatory chat-learning preflight
        run: node scripts/brain/chat-learning-preflight.mjs
      - name: Verify canonical incident learning and portal relevance
        run: |
          node scripts/brain/validate-universal-closed-loop-learning.mjs
          node --test tests/brain-universal-closed-loop-learning.test.mjs portal-v2/tests/relevance-learning-closed-loop.test.mjs
      - name: Verify self-evolution contract
        run: node --test tests/powerhouse-daily-self-evolution.test.mjs
      - name: Verify Powerhouse self-improvement layer
        run: node --test tests/brain-self-improvement-layer-v1.test.mjs
      - name: Verify every registered agent inherits the bounded autonomous innovation duty
        run: node --test tests/brain-all-agent-innovation-duty-20261030.test.mjs
      - name: Verify innovation candidates are handed off to the original ONE BRAIN duty registry
        run: node --test tests/brain-innovation-canonical-handoff-20261114.test.mjs
      - name: Verify original innovation engineer and CRO consumer intakes never silently disappear
        run: node --test tests/brain-innovation-original-consumer-intake-20261114.test.mjs
      - name: Verify original 3-stage innovation agent readback cannot hide unclaimed work
        run: node --test tests/brain-innovation-live-agent-owner-handoff-20261114.test.mjs
      - name: Capture trusted GitHub-run skill byte audit (NOT application proof)
        run: node scripts/brain/skill-byte-audit.mjs
      - name: Build universal chat-agent-skill snapshot
        run: node scripts/brain/daily-self-evolution.mjs
      - name: Run canonical autonomous improvement probe
        run: node scripts/brain/continuous-improvement/run-autonomous-improvement.mjs
      - name: Run capability inventory
        run: node scripts/brain/continuous-improvement/capability-inventory.mjs
      - name: Verify improvement evidence and record missing capability data
        run: |
          node --test tests/powerhouse-daily-self-evolution-improvement-evidence.test.mjs
          node scripts/brain/continuous-improvement/improvement-evidence-inventory.mjs
      - name: Run Engineering OS self-test
        run: node scripts/brain/powerhouse-engineering-closed-loop.mjs --self-test
      - name: Verify autonomous engineering fabric v3
        run: node scripts/brain/autonomous-engineering-fabric-v3.mjs --check
      - name: Read all original innovation owner intakes from ONE BRAIN without fake ACK
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.BG_PORTAL_EU_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BG_PORTAL_EU_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/brain/innovation-original-owner-readback.mjs
      - name: Existing original agents source-bound reversible pre-review with native CAS and independent readback
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.BG_PORTAL_EU_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BG_PORTAL_EU_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --test tests/brain-innovation-original-agent-pre-review-20261115.test.mjs
          node scripts/brain/innovation-original-agent-pre-review.mjs --writeback
      - name: Route original engineering and CRO source decisions into existing Brain operations with native CAS
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.BG_PORTAL_EU_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BG_PORTAL_EU_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --test tests/brain-innovation-original-owner-decision-20261115.test.mjs
          node scripts/brain/innovation-original-owner-decision.mjs --writeback
      - name: Persist exact-run daily agent-learning checkpoint even after a failed step
        if: always()
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts/quality
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const snapshot={
            contract:'powerhouse-daily-learning-execution-checkpoint-v1',
            observed_at:new Date().toISOString(),
            run_id:process.env.GITHUB_RUN_ID,
            run_attempt:process.env.GITHUB_RUN_ATTEMPT,
            head_sha:process.env.GITHUB_SHA,
            job:'improve',
            job_status:process.env.DAILY_JOB_STATUS||'unknown',
            provider_catalog_authority:'independent model-freshness job',
            terminal_proof:false,
            next_safe_action:'Inspect exact failed step and resume the existing canonical learning obligation; never infer success from the checkpoint alone'
          };
          fs.writeFileSync('artifacts/quality/daily-learning-execution-checkpoint.json',JSON.stringify(snapshot,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powerhouse-daily-self-evolution-${{ github.run_id }}
          path: artifacts/quality/
          if-no-files-found: error
          retention-days: 30

  # Strictly bounded resume within the SAME original daily workflow and
  # concurrency/permission boundary. Reuses the original intake code, never a
  # second publisher, cron, job queue, autonomous agent or content executor.
  original-intake-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_scope == 'original_intake_recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate original source-bound intake review and duplicate-safe CAS
        run: |
          node --test tests/brain-innovation-original-agent-pre-review-20261115.test.mjs
          node --test tests/brain-innovation-original-owner-readback-20261115.test.mjs
      - name: Independently audit ORIGINAL intake before recovery (not consumer acknowledgement)
        env:
          SUPABASE_URL: ${{ secrets.BG_PORTAL_EU_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BG_PORTAL_EU_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/brain/innovation-original-owner-readback.mjs
      - name: Resume only original PLANNED source-bound intake review with existing native Brain CAS
        env:
          SUPABASE_URL: ${{ secrets.BG_PORTAL_EU_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BG_PORTAL_EU_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/brain/innovation-original-agent-pre-review.mjs --writeback
      - name: Resume original engineering/CRO source decision on SAME previously registered intakes only
        env:
          SUPABASE_URL: ${{ secrets.BG_PORTAL_EU_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BG_PORTAL_EU_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --test tests/brain-innovation-original-owner-decision-20261115.test.mjs
          node scripts/brain/innovation-original-owner-decision.mjs --writeback
      - name: Upload sanitized exact-run review evidence without candidate payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-innovation-pre-review-recovery-${{ github.run_id }}
          path: |
            artifacts/quality/original-innovation-owner-readback.json
            artifacts/quality/original-innovation-owner-pre-review.json
            artifacts/quality/original-innovation-owner-decision.json
          if-no-files-found: warn
          retention-days: 30

  # The catalog remains fail-closed, but a stale supplier receipt must not
  # suppress independent daily chat/agent/skill/engineering learning tasks.
  # Both jobs are part of this SAME scheduled workflow: no second scheduler.
  model-freshness:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.execution_scope != 'original_intake_recovery' }}
    needs: daily-admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify AI model intelligence contract and source-backed freshness
        run: |
          node --test tests/ai-model-intelligence-freshness-v1.test.mjs
          node scripts/brain/ai-model-intelligence-audit.mjs
      - name: Preserve AI model freshness failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerhouse-model-freshness-${{ github.run_id }}
          path: artifacts/quality/ai-model-intelligence-audit.json
          if-no-files-found: warn
          retention-days: 30
