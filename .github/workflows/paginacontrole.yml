name: Pagina- en SEO-controle

# Loopt elke publieke pagina langs in een echte browser en kijkt of er iets stuk is.
# Daarnaast draait de SEO-controle tegen de zoekwoordstrategie.
# Bekende, eenduidig herstelbare SEO-metadatafouten worden eerst automatisch hersteld.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'assets/**'
      - '_redirects'
  pull_request:
    paths:
      - '**.html'
      - 'assets/**'
      - '_redirects'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: write
  issues: write

# PR-controles mogen niet meer door een gelijktijdige main-run worden geannuleerd.
# Runs voor dezelfde PR/ref vervangen elkaar nog steeds om verspilling te voorkomen.
concurrency:
  group: paginacontrole-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Bekende SEO-bronfouten automatisch herstellen
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def set_bg_keyword(path, value):
              text = read(path)
              new, n = re.subn(
                  r'<meta name="bg-zoekwoord" content="[^"]*">',
                  f'<meta name="bg-zoekwoord" content="{value}">',
                  text,
                  count=1,
              )
              if n != 1:
                  raise RuntimeError(f'bg-zoekwoord niet exact eenmaal gevonden in {path}')
              write(path, new)

          set_bg_keyword('afmaakindex.html', 'afmaakindex')
          set_bg_keyword('ai-implementeren.html', 'ai implementeren mkb')
          set_bg_keyword('bedrijfsgeheugen.html', 'bedrijfsgeheugen')
          set_bg_keyword('blog/wat-is-een-bedrijfsgeheugen/index.html', 'kennisverlies mkb')
          set_bg_keyword('data-soevereiniteit.html', 'data soevereiniteit; chatgpt bedrijfsgegevens beleid')

          # Deze pagina is eigenaar van twee sterk verwante zoekopdrachten.
          # Titel en H1 benoemen daarom beide onderwerpen expliciet.
          p = 'data-soevereiniteit.html'
          text = read(p)
          title = 'Data-soevereiniteit: ChatGPT, bedrijfsgegevens en beleid | Bedrijfsgeheugen'
          text, n1 = re.subn(r'<title>.*?</title>', f'<title>{title}</title>', text, count=1, flags=re.S)
          text, n2 = re.subn(
              r'(<h1[^>]*>).*?(</h1>)',
              r'\1Data-soevereiniteit: ChatGPT, bedrijfsgegevens en beleid\2',
              text,
              count=1,
              flags=re.S,
          )
          if n1 != 1 or n2 != 1:
              raise RuntimeError('title/h1 data-soevereiniteit niet eenduidig gevonden')
          write(p, text)

          # Relevante derde interne verwijzing naar /excel-als-crm.
          p = 'blog/offertes-opvolgen-zonder-crm/index.html'
          text = read(p)
          hoofd = text[text.find('<main'):text.find('</main>')] if '<main' in text and '</main>' in text else text
          if 'href="/excel-als-crm"' not in hoofd:
              toevoeging = ('\n<p class="bron">Lees ook: <a href="/excel-als-crm">'
                            'Excel als CRM: wanneer het begint te knellen</a>.</p>\n')
              if '</main>' not in text:
                  raise RuntimeError('geen </main> in offertes-opvolgen-zonder-crm')
              text = text.replace('</main>', toevoeging + '</main>', 1)
              write(p, text)

          # Meta-omschrijving binnen de afgesproken 110-165 tekens.
          p = 'blog/afas-api/index.html'
          text = read(p)
          desc = ('Wat kan de AFAS API wel en niet? Wanneer volstaan GetConnectors, '
                  'wanneer zijn UpdateConnectors nodig en wie houdt eigenaarschap over de koppeling?')
          text, n = re.subn(
              r'<meta name="description" content="[^"]*">',
              f'<meta name="description" content="{desc}">',
              text,
              count=1,
          )
          if n != 1:
              raise RuntimeError('meta description afas-api niet gevonden')
          write(p, text)
          PY

          if [ -n "$(git status --porcelain -- '*.html')" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add afmaakindex.html ai-implementeren.html bedrijfsgeheugen.html data-soevereiniteit.html \
              blog/wat-is-een-bedrijfsgeheugen/index.html \
              blog/offertes-opvolgen-zonder-crm/index.html \
              blog/afas-api/index.html
            git commit -m "Herstel SEO-bronfouten uit paginacontrole"
            git pull --rebase origin main
            git push
          else
            echo "Geen bekende SEO-bronfouten meer te herstellen."
          fi

      - name: Playwright installeren
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Pagina's controleren
        id: controle
        run: python .github/scripts/paginacontrole.py
        continue-on-error: true

      - name: SEO en interne links controleren
        id: seo
        run: python .github/scripts/seocontrole.py
        continue-on-error: true

      - name: seo-status.json publiceren als hij is veranderd
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain seo-status.json)" ]; then
            echo "seo-status.json ongewijzigd"
            exit 0
          fi

          cp seo-status.json /tmp/seo-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Publiceer uitsluitend het afgeleide statusbestand bovenop de nieuwste main.
          # Zo kan een parallelle productie-/agentpush geen rebase van de volledige
          # oude workflow-worktree laten mislukken.
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/seo-status.json seo-status.json

          if git diff --quiet -- seo-status.json; then
            echo "seo-status.json is al door een parallelle run gepubliceerd"
            exit 0
          fi

          git add seo-status.json
          git commit -m "seo-status.json bijgewerkt door de SEO-controle"
          git push origin HEAD:main

      - name: Rapporten samenvoegen
        if: always()
        run: |
          : > rapport-samen.md
          cat rapport.md >> rapport-samen.md 2>/dev/null || true
          echo "" >> rapport-samen.md
          cat seo-rapport.md >> rapport-samen.md 2>/dev/null || true
          mv rapport-samen.md rapport.md

      - name: Rapport tonen
        if: always()
        run: cat rapport.md || echo "geen rapport"

      - name: Melding maken bij problemen
        if: (steps.controle.outcome == 'failure' || steps.seo.outcome == 'failure') && github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('rapport.md', 'utf8');
            const titel = 'Paginacontrole: problemen gevonden';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'paginacontrole'
            });
            if (open.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titel, body, labels: ['paginacontrole']
              });
            }

      - name: Melding sluiten als alles goed is
        if: steps.controle.outcome == 'success' && steps.seo.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'paginacontrole'
            });
            for (const i of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, body: 'Opgelost — de controle liep zonder problemen door.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed'
              });
            }

      - name: Falen doorgeven
        if: steps.controle.outcome == 'failure' || steps.seo.outcome == 'failure'
        run: |
          echo "Er staat een melding open met label paginacontrole. Daarin staat wat er mis is."
          exit 1
