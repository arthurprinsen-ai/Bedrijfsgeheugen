name: Pagina- en SEO-controle
on:
  push:
    branches: [main]
    paths: ['**.html','assets/**','_redirects']
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
permissions: {contents: read}
jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install --quiet playwright
      - run: playwright install --with-deps chromium
      - run: python .github/scripts/paginacontrole.py
      - run: python .github/scripts/seocontrole.py
