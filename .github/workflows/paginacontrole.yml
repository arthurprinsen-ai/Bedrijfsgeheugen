name: Pagina- en SEO-controle

# Loopt elke publieke pagina langs in een echte browser en kijkt of er iets stuk is.
# Aanleiding: bij het gelijktrekken van de site-chrome (commit 4fb892b) is de voettekst
# midden in een JavaScript-tekenreeks geplakt. Daardoor deed de Frisse blik het maandenlang
# niet, zonder dat iemand het merkte. Deze controle vindt zoiets meteen.
#
# Wat er wordt gecontroleerd, per pagina:
#   1. JavaScript-fouten bij het laden
#   2. Precies één header (.bgkop) en één voettekst (footer.bgvoet)
#   3. Precies één <h1>
#   4. Geen horizontale overloop op een telefoonscherm
#   5. Interne links die nergens heen gaan
#   6. Ontbrekende title, meta-omschrijving of canonical
#
# Daarnaast draait de SEO-controle, die de site tegen de zoekwoordstrategie legt:
# de ijzeren regel (één zoekwoord, één pagina), de clusterstructuur (elke
# clusterpagina linkt naar zijn pijler en terug) en ankerteksten die iets zeggen.
#
# Faalt de controle, dan blokkeert dat niets — de site staat er al. Het is een melding.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'assets/**'
      - '_redirects'
  # Ook op elke pull request, zodat een halve pagina niet gemerged kan worden.
  # Op main is de controle een melding achteraf; op een PR is het een rem vooraf.
  pull_request:
    paths:
      - '**.html'
      - 'assets/**'
      - '_redirects'
  workflow_dispatch:
  schedule:
    # elke maandag 07:00 Nederlandse tijd, ook als er niets gepusht is
    - cron: '0 5 * * 1'

permissions:
  contents: write
  issues: write

concurrency:
  group: paginacontrole
  cancel-in-progress: true

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Playwright installeren
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Pagina's controleren
        id: controle
        run: python .github/scripts/paginacontrole.py
        continue-on-error: true

      - name: SEO en interne links controleren
        id: seo
        run: python .github/scripts/seocontrole.py
        continue-on-error: true

      - name: seo-status.json terugzetten als hij is veranderd
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain seo-status.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seo-status.json
            git commit -m "seo-status.json bijgewerkt door de SEO-controle"
            git push
          else
            echo "seo-status.json ongewijzigd"
          fi

      - name: Rapporten samenvoegen
        if: always()
        run: |
          : > rapport-samen.md
          cat rapport.md >> rapport-samen.md 2>/dev/null || true
          echo "" >> rapport-samen.md
          cat seo-rapport.md >> rapport-samen.md 2>/dev/null || true
          mv rapport-samen.md rapport.md

      - name: Rapport tonen
        if: always()
        run: cat rapport.md || echo "geen rapport"

      - name: Melding maken bij problemen
        if: (steps.controle.outcome == 'failure' || steps.seo.outcome == 'failure') && github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('rapport.md', 'utf8');
            const titel = 'Paginacontrole: problemen gevonden';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'paginacontrole'
            });
            if (open.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titel, body, labels: ['paginacontrole']
              });
            }

      - name: Melding sluiten als alles goed is
        if: steps.controle.outcome == 'success' && steps.seo.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'paginacontrole'
            });
            for (const i of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, body: 'Opgelost — de controle liep zonder problemen door.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed'
              });
            }

      # De uitslag van de workflow volgt precies de melding: is er een melding
      # met label paginacontrole, dan is de run rood; is die er niet, dan groen.
      # Reden (20 aug 2026): een tussenversie liet de run falen op een regel uit
      # het rapport terwijl er geen melding werd aangemaakt. Je kreeg dan een
      # faalmail zonder dat ergens stond wat er aan de hand was - het slechtste
      # van twee werelden. Een alarm zonder inhoud wordt weggeklikt, en dan mis
      # je het alarm dat er wel toe doet.
      - name: Falen doorgeven
        if: steps.controle.outcome == 'failure' || steps.seo.outcome == 'failure'
        run: |
          echo "Er staat een melding open met label paginacontrole. Daarin staat wat er mis is."
          exit 1
