name: AI model official source audit
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  provider-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check catalog provider documentation reachability (not verification)
        run: node scripts/brain/audit-ai-model-provider-sources.mjs
      - name: Preserve factual audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-model-official-source-probe
          path: .artifacts/ai-model-provider-source-audit.json
          if-no-files-found: warn
          retention-days: 30
