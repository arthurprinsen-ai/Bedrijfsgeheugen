name: OpenArt iPhone Preview Verify

on:
  push:
    branches:
      - automation/openart-iphone-runtime-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts=false
      - run: node tools/bouw-v18-preview.mjs
      - run: node tools/test-v18-preview.mjs
      - name: Print exact candidate identity
        run: cat assets/hero-openart-source.json
      - uses: actions/upload-artifact@v4
        with:
          name: openart-iphone-preview-manifest
          path: assets/hero-openart-source.json
          retention-days: 7
