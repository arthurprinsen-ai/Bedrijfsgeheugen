name: Backend release lane

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install backend contract dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify backend Brain and runtime contracts
        run: >-
          node --test
          tests/brain-adapter-conformance.test.mjs
          tests/brain-platform-adapters.test.mjs
          tests/universal-event-envelope.test.mjs
          tests/event-retention-policy.test.mjs
          tests/event-retention-expiry.test.mjs
          tests/universal-event-contract-check.test.mjs
          tests/universal-event-adapters.test.mjs
          tests/universal-failure-learning.test.mjs
          tests/make-cost-governor-policy.test.mjs
          tests/make-cost-governance-contract.test.mjs
      - name: Verify shared agent memory and governance contracts
        run: >-
          node --test
          tests/development-doc-contract.test.mjs
          tests/delivery-chat-*.test.mjs
          tests/team-learning-event.test.mjs
          tests/team-memory-fingerprint.test.mjs
          tests/opportunity-scout.test.mjs
          tests/production-promotion-controller.test.mjs
          tests/production-promotion-guardian.test.mjs
          tests/hero-media-normalizer.test.mjs
          tests/hero-media-executor.test.mjs
          tests/paginacontrole-concurrent-push.test.mjs
          tests/paginacontrole-concurrency.test.mjs
          tests/repo-writeback-safety.test.mjs
          tests/repo-writer-governance.test.mjs
          tests/repo-writer-candidate.test.mjs
          tests/menu-writer-candidate-mode.test.mjs
          tests/regulation-writer-candidate-mode.test.mjs
          tests/seo-writer-candidate-mode.test.mjs
          tests/approved-central-blog-candidate-mode.test.mjs
          tests/blog-update-writer-candidate-mode.test.mjs
          tests/weekblog-writer-candidate-mode.test.mjs
          tests/paginacontrole-writer-candidate-mode.test.mjs
          tests/repository-protection-readiness.test.mjs
          tests/repository-writer-structural-parity.test.mjs
          tests/repo-writer-shadow.test.mjs
          tests/repo-writer-operational-harness.test.mjs
          tests/content-writer-operational-fixture.test.mjs
          tests/whole-brain-obligation-contract.test.mjs
          tests/agent-fabric.test.mjs
          tests/agent-fabric-gateway.test.mjs
          tests/agent-fabric-team-memory.test.mjs
          tests/brain-chat-learning-complete.test.mjs
          tests/instagram-chat-learning-contract.test.mjs
          tests/chat-learning-completeness-addendum.test.mjs
          tests/brain-chat-learning-canonical-closure.test.mjs
          tests/brain-chat-learning-completeness.test.mjs
          tests/*guard*.test.mjs
          tests/delivery-preflight-completion.test.mjs
          tests/live-preview-trigger-scope.test.mjs
      - name: Verify Brain cost membership
        run: node --test tests/brain-cost-membership.test.mjs tests/cost-component-catalog.test.mjs
      - name: Verify Brain foundation
        run: node scripts/brain/test-all.mjs
      - name: Verify SEO growth contracts
        run: node --test tests/seo-growth-*.test.mjs tests/seo-order-money-v2.test.mjs tests/seo-order-blog-v2.test.mjs tests/seo-order-measurement.test.mjs
