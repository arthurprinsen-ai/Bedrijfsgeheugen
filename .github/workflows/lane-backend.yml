name: Backend release lane

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install runtime dependencies for backend contracts
        timeout-minutes: 8
        env:
          npm_config_fetch_retries: '2'
          npm_config_fetch_retry_maxtimeout: '20000'
          npm_config_fetch_retry_mintimeout: '5000'
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Verify backend Brain runtime and Quality Intelligence contracts
        run: >-
          node --test
          tests/brain-adapter-conformance.test.mjs
          tests/brain-platform-adapters.test.mjs
          tests/brain-error-learning-contract.test.mjs
          tests/brain-powerhouse-universal-agent-learning-writeback.test.mjs
          tests/brain-control-plane-terminal-descendant-recovery-v1.test.mjs
          tests/universal-event-envelope.test.mjs
          tests/event-retention-policy.test.mjs
          tests/event-retention-expiry.test.mjs
          tests/universal-event-contract-check.test.mjs
          tests/universal-event-adapters.test.mjs
          tests/universal-failure-learning.test.mjs
          tests/make-cost-governor-policy.test.mjs
          tests/make-cost-governance-contract.test.mjs
          tests/growth-intelligence-engine.test.mjs
          tests/growth-intelligence-daily.test.mjs
          tests/brain-ai-usage-attribution.test.mjs
          tests/brain-resource-business-value-contract.test.mjs
          tests/brain-resource-business-value-service-role-grants.test.mjs
          tests/powerhouse-resource-intelligence-contract.test.mjs
          tests/powerhouse-quality-resource-intelligence-surfaces.test.mjs
          tests/powerhouse-resource-intelligence-portal-telemetry.test.mjs
          tests/brain-quality-intelligence.test.mjs
          tests/brain-quality-intelligence-v2.test.mjs
          tests/brain-quality-exploration.test.mjs
          tests/brain-quality-adversarial.test.mjs
          tests/brain-quality-production-shadow.test.mjs
          tests/brain-quality-economics.test.mjs
          tests/supabase-powerhouse-content-edge-surface-contract.test.mjs
          tests/revenue-content-cockpit-outcome-loop-contract.test.mjs
          tests/powerhouse-revenue-calibration-persistence-contract.test.mjs
          tests/supabase-instagram-media-job-materializer-v1.test.mjs
          tests/supabase-bg-opdrachtenradar-v1.test.mjs
          tests/regulatory-organism-feed.test.mjs
          tests/saas-pricing-entitlements.test.mjs
      - name: Verify deterministic Quality Intelligence contract
        run: node scripts/brain/powerhouse-quality-intelligence.mjs --check