name: Backend release lane

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install runtime dependencies for backend contracts
        timeout-minutes: 8
        env:
          npm_config_fetch_retries: '2'
          npm_config_fetch_retry_maxtimeout: '20000'
          npm_config_fetch_retry_mintimeout: '5000'
        # The backend lane tests source/contract behavior, never invokes the
        # root ffmpeg-static executable. HTTP 504 from its unrelated npm
        # postinstall blocked all migration-guard PRs (run #42056751095).
        # Install real JS dependencies and retain every backend test. Scripts
        # needed for production media remain protected by their own runtime lane.
        run: |
          set -euo pipefail
          install_log="$(mktemp)"
          trap 'rm -f "$install_log"' EXIT
          if npm install --ignore-scripts --prefer-offline --no-audit --no-fund --loglevel=error >"$install_log" 2>&1; then
            echo "NPM_INSTALL_SUCCEEDED"
          else
            install_status=$?
            # An observed ETARGET can be caused by stale cached registry metadata.
            # Retry once with revalidation; no changed pins, registry, or lifecycle policy.
            if grep -Eq '^(npm error|npm ERR!) code ETARGET[[:space:]]*$' "$install_log"; then
              echo "NPM_INSTALL_ETARGET_REVALIDATE_ONCE"
              if npm install --ignore-scripts --prefer-online --no-audit --no-fund --loglevel=error >"$install_log" 2>&1; then
                echo "NPM_INSTALL_SUCCEEDED_AFTER_REVALIDATION"
                exit 0
              else
                install_status=$?
              fi
            fi
            # Never print raw npm output: only allowlisted, bounded error codes.
            node --input-type=module - "$install_log" <<'NODE'
          import { readFileSync } from 'node:fs';
          const log=readFileSync(process.argv[2],'utf8').slice(0,262144);
          const allowed=new Set(['EAI_AGAIN','ENOTFOUND','ECONNRESET','ECONNREFUSED','ETIMEDOUT','E401','E403','E404','E429','E500','E502','E503','E504','ETARGET','ERESOLVE','EINTEGRITY','EBADENGINE','EACCES','EPERM','ENOSPC','ELOCKVERIFY','EJSONPARSE','ENOTEMPTY','ENOENT','EEXIST','ERR_INVALID_URL','ERR_INVALID_ARG_TYPE']);
          const codes=[...new Set(Array.from(log.matchAll(/^(?:npm error|npm ERR!) code ([A-Z][A-Z0-9_]{1,31})\s*$/gm),m=>m[1]).filter(code=>allowed.has(code)))].slice(0,5);
          console.log('NPM_INSTALL_ERROR_CODES:'+(codes.join(',')||'UNCLASSIFIED'));
          NODE
            exit "$install_status"
          fi
      - name: Verify backend Brain runtime and Quality Intelligence contracts
        run: >-
          node --test
          tests/brain-adapter-conformance.test.mjs
          tests/brain-platform-adapters.test.mjs
          tests/brain-error-learning-contract.test.mjs
          tests/brain-p0-4198-resilience-owned-watchdog-proof-20261025.test.mjs
          tests/brain-powerhouse-universal-agent-learning-writeback.test.mjs
          tests/brain-intent-skill-preflight-20261025.test.mjs
          tests/brain-social-metrics-verified-binding-20261019.test.mjs
          tests/brain-control-plane-terminal-descendant-recovery-v1.test.mjs
          tests/universal-event-envelope.test.mjs
          tests/event-retention-policy.test.mjs
          tests/event-retention-expiry.test.mjs
          tests/universal-event-contract-check.test.mjs
          tests/universal-event-adapters.test.mjs
          tests/universal-failure-learning.test.mjs
          tests/make-cost-governor-policy.test.mjs
          tests/make-cost-governance-contract.test.mjs
          tests/growth-intelligence-engine.test.mjs
          tests/growth-intelligence-daily.test.mjs
          tests/brain-ai-usage-attribution.test.mjs
          tests/cost-dashboard-security.test.mjs
          tests/brain-resource-business-value-contract.test.mjs
          tests/brain-resource-business-value-service-role-grants.test.mjs
          tests/powerhouse-resource-intelligence-contract.test.mjs
          tests/powerhouse-quality-resource-intelligence-surfaces.test.mjs
          tests/powerhouse-resource-intelligence-portal-telemetry.test.mjs
          tests/brain-quality-intelligence.test.mjs
          tests/brain-quality-intelligence-v2.test.mjs
          tests/brain-quality-exploration.test.mjs
          tests/brain-quality-adversarial.test.mjs
          tests/brain-quality-production-shadow.test.mjs
          tests/brain-quality-economics.test.mjs
          tests/supabase-powerhouse-content-edge-surface-contract.test.mjs
          tests/revenue-content-cockpit-outcome-loop-contract.test.mjs
          tests/powerhouse-revenue-calibration-persistence-contract.test.mjs
          tests/supabase-instagram-media-job-materializer-v1.test.mjs
          tests/supabase-bg-opdrachtenradar-v1.test.mjs
          tests/regulatory-organism-feed.test.mjs
          tests/saas-pricing-entitlements.test.mjs
      - name: Verify deterministic Quality Intelligence contract
        run: node scripts/brain/powerhouse-quality-intelligence.mjs --check