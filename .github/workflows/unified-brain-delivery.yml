name: Unified Brain Delivery
run-name: "BRAIN delivery PR #${{ inputs.pr_number || github.event.pull_request.number }} ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Candidate PR number'
        required: false
        type: string
      base_sha:
        description: 'Immutable PR base SHA'
        required: false
        type: string
      head_sha:
        description: 'Immutable candidate head SHA'
        required: false
        type: string
      candidate_branch:
        description: 'Immutable candidate branch'
        required: false
        type: string
      verification_only:
        description: 'Run full delivery verification but never hand candidate to production authority'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: unified-brain-delivery-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}-${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  candidate-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicitly dispatched PR identity
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA" && test -n "$HEAD_SHA" && test -n "$CANDIDATE_BRANCH"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          actual_base="$(jq -r '.base.sha' <<<"$pr")"
          actual_head="$(jq -r '.head.sha' <<<"$pr")"
          actual_ref="$(jq -r '.head.ref' <<<"$pr")"
          [ "$actual_base" = "$BASE_SHA" ] || { echo "::error::PR_BASE_SHA_DRIFT:$BASE_SHA:$actual_base"; exit 1; }
          [ "$actual_head" = "$HEAD_SHA" ] || { echo "::error::PR_HEAD_SHA_DRIFT:$HEAD_SHA:$actual_head"; exit 1; }
          [ "$actual_ref" = "$CANDIDATE_BRANCH" ] || { echo "::error::PR_HEAD_REF_DRIFT:$CANDIDATE_BRANCH:$actual_ref"; exit 1; }

  plan:
    needs: candidate-identity
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      trace_id: ${{ steps.plan.outputs.trace_id }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      has_lanes: ${{ steps.plan.outputs.has_lanes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Reuse proven delivery lessons before expensive work
        run: |
          node --test tests/delivery-learning.test.mjs tests/delivery-preflight.test.mjs
          node tools/delivery-preflight.mjs shared
      - id: plan
        name: Discover changed lanes and Brain membership
        shell: bash
        run: |
          node tools/brain-delivery-system.mjs membership
          node tools/brain-delivery-system.mjs plan --base "${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}" --head "${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}"
          node --input-type=module - <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          const plan = JSON.parse(await readFile('.artifacts/brain-delivery-plan.json', 'utf8'));
          await appendFile(process.env.GITHUB_OUTPUT, `has_lanes=${plan.lanes.length > 0}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: brain-delivery-plan
          path: .artifacts/

  lanes:
    needs: plan
    if: needs.plan.outputs.has_lanes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ matrix.candidate_identity || inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify exact changed lane
        shell: bash
        run: |
          mkdir -p .artifacts
          expected="${{ matrix.candidate_identity || inputs.head_sha || github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          set +e
          case "${{ matrix.id }}" in
            backend)
              (npm install --ignore-scripts --no-audit --no-fund && node scripts/brain/test-all.mjs && node --test tests/canonical-*.test.mjs tests/agent-fabric*.test.mjs tests/brain-*.test.mjs tests/supabase-*.test.mjs tests/cost-*.test.mjs) 2>&1 | tee .artifacts/lane-${{ matrix.id }}.log
              ;;
            portal)
              node --test tests/portal-*.test.mjs tests/customer-portal-routing.test.mjs tests/portal-production-contract.test.mjs 2>&1 | tee .artifacts/lane-${{ matrix.id }}.log
              ;;
            website)
              node --test tests/components/*.test.mjs tests/site-baseline-guardian.test.mjs tests/page-composition.test.mjs 2>&1 | tee .artifacts/lane-${{ matrix.id }}.log
              ;;
            automation)
              (node scripts/brain/test-all.mjs && node --test tests/delivery-*.test.mjs tests/brain-delivery-system.test.mjs) 2>&1 | tee .artifacts/lane-${{ matrix.id }}.log
              ;;
            *)
              echo "Unknown delivery lane: ${{ matrix.id }}" | tee .artifacts/lane-${{ matrix.id }}.log
              exit 64
              ;;
          esac
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp .artifacts/lane-${{ matrix.id }}.log .artifacts/lane-${{ matrix.id }}-failure.txt
            exit "$status"
          fi
      - name: Capture failed lane as Brain learning evidence
        if: failure()
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createObservedFailure } from './tools/delivery-learning.mjs';
          let reason = 'GitHub lane verification failed';
          try {
            const log = await readFile(`.artifacts/lane-${process.env.LANE}-failure.txt`, 'utf8');
            const lines = log.split(/\r?\n/);
            const failedAt = lines.findIndex(line => /^not ok\s+\d+\s+-\s+/.test(line.trim()));
            reason = failedAt >= 0 ? lines.slice(Math.max(0, failedAt - 2), Math.min(lines.length, failedAt + 18)).join('\n').trim() : lines.slice(-120).join('\n').trim();
          } catch {}
          const event = createObservedFailure({ stage: 'PIPELINE', reason, component: process.env.LANE, headSha: process.env.HEAD_SHA, evidenceRef: `github-run:${process.env.RUN_ID}` });
          await writeFile(`.artifacts/delivery-failure-${process.env.LANE}.json`, JSON.stringify(event, null, 2));
          NODE
        env:
          LANE: ${{ matrix.id }}
          HEAD_SHA: ${{ matrix.candidate_identity || inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
      - name: Publish failed lane evidence for BG168/BG167 writeback
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brain-delivery-failure-${{ matrix.id }}
          path: |
            .artifacts/delivery-failure-${{ matrix.id }}.json
            .artifacts/lane-${{ matrix.id }}-failure.txt

  handoff:
    needs: [plan, lanes]
    if: always() && needs.plan.result == 'success' && (needs.lanes.result == 'success' || needs.lanes.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Enforce current-main file and contract conflict index
        if: needs.plan.outputs.has_lanes == 'true'
        shell: bash
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          node tools/brain-delivery-system.mjs branch-drift \
            --base "${{ needs.plan.outputs.base_sha }}" \
            --head "${{ needs.plan.outputs.head_sha }}" \
            --current-main "$current_main"
      - name: Publish moving-main evidence
        if: needs.plan.outputs.has_lanes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brain-branch-drift
          path: .artifacts/brain-branch-drift.json
          if-no-files-found: ignore
      - name: Record successful ignored-only no-op
        if: needs.plan.outputs.has_lanes != 'true'
        run: echo "No executable delivery lanes; ignored-only change is a successful no-op."
      - name: Record verification-only non-promotion evidence
        if: needs.plan.outputs.has_lanes == 'true' && github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && startsWith(inputs.candidate_branch, 'writer/') && inputs.verification_only == true
        run: |
          echo "Verification-only delivery: production authority handoff intentionally skipped."
      - name: BG169 primary Make transport with GitHub-native failover
        if: needs.plan.outputs.has_lanes == 'true' && github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && startsWith(inputs.candidate_branch, 'writer/') && inputs.verification_only != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BG169_HANDOFF_URL: ${{ vars.BG169_HANDOFF_URL }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
          TRACE_ID: ${{ needs.plan.outputs.trace_id }}
          UNIFIED_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          test -n "$PR_NUMBER" && test -n "$BASE_SHA" && test -n "$HEAD_SHA" && test -n "$CANDIDATE_BRANCH"

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          actual_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr")"
          actual_base_ref="$(jq -r '.base.ref // ""' <<<"$pr")"
          actual_head="$(jq -r '.head.sha // ""' <<<"$pr")"
          actual_ref="$(jq -r '.head.ref // ""' <<<"$pr")"
          actual_state="$(jq -r '.state // ""' <<<"$pr")"
          actual_draft="$(jq -r '.draft // false' <<<"$pr")"
          [ "$actual_repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::BG169_SAME_REPOSITORY_REQUIRED:$actual_repo"; exit 1; }
          [ "$actual_base_ref" = "main" ] || { echo "::error::BG169_MAIN_BASE_REQUIRED:$actual_base_ref"; exit 1; }
          [ "$actual_head" = "$HEAD_SHA" ] || { echo "::error::BG169_HEAD_SHA_DRIFT:$HEAD_SHA:$actual_head"; exit 1; }
          [ "$actual_ref" = "$CANDIDATE_BRANCH" ] || { echo "::error::BG169_HEAD_REF_DRIFT:$CANDIDATE_BRANCH:$actual_ref"; exit 1; }
          [ "$actual_state" = "open" ] || { echo "::error::BG169_PR_NOT_OPEN:$actual_state"; exit 1; }
          [ "$actual_draft" = "false" ] || { echo "::error::BG169_DRAFT_BLOCKED"; exit 1; }

          git fetch origin main --no-tags
          rollback_identity="$(git rev-parse origin/main)"
          transport=""
          make_accepted=false
          payload="$(jq -cn \
            --argjson pr_number "$PR_NUMBER" \
            --arg base_sha "$BASE_SHA" \
            --arg candidate_sha "$HEAD_SHA" \
            --arg expected_head_sha "$HEAD_SHA" \
            --arg tested_head_sha "$HEAD_SHA" \
            --arg candidate_branch "$CANDIDATE_BRANCH" \
            --arg lane_id "writer|${HEAD_SHA:0:12}" \
            --arg trace_id "$TRACE_ID" \
            --argjson unified_run_id "$UNIFIED_RUN_ID" \
            '{authority:"BG169",pr_number:$pr_number,base_sha:$base_sha,candidate_sha:$candidate_sha,expected_head_sha:$expected_head_sha,tested_head_sha:$tested_head_sha,candidate_branch:$candidate_branch,lane_id:$lane_id,trace_id:$trace_id,unified_run_id:$unified_run_id}')"

          if [ -n "$BG169_HANDOFF_URL" ]; then
            set +e
            curl --silent --show-error --max-time 20 \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$BG169_HANDOFF_URL" >/tmp/bg169-handoff-response.json
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && jq -e '.accepted == true and .production_authority == "BG169"' /tmp/bg169-handoff-response.json >/dev/null 2>&1; then
              make_accepted=true
              for attempt in 1 2 3 4 5 6; do
                current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
                if [ "$(jq -r '.merged // false' <<<"$current_pr")" = "true" ]; then
                  git fetch origin main --no-tags
                  if git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
                    transport="make"
                    break
                  fi
                fi
                sleep 5
              done
            else
              echo "::warning::BG169_HANDOFF_NOT_ACCEPTED:primary Make transport unavailable or acknowledgement lacked execution authority evidence"
            fi
          else
            echo "::warning::BG169_HANDOFF_NOT_ACCEPTED:BG169_HANDOFF_URL_MISSING"
          fi

          if [ -z "$transport" ]; then
            if [ "$make_accepted" = "true" ]; then
              echo "::warning::BG169_HANDOFF_NOT_ACCEPTED:Make acknowledgement did not become verified production execution"
            fi
            echo "BG169 GitHub-native failover: invoking the same authority contract for exact candidate $HEAD_SHA"
            pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            [ "$(jq -r '.head.repo.full_name // ""' <<<"$pr")" = "$GITHUB_REPOSITORY" ] || { echo "::error::BG169_FAILOVER_REPO_DRIFT"; exit 1; }
            [ "$(jq -r '.head.sha // ""' <<<"$pr")" = "$HEAD_SHA" ] || { echo "::error::BG169_FAILOVER_HEAD_DRIFT"; exit 1; }
            merge_response="$(gh api \
              --method PUT \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
              -f commit_title="BG169: promote exact candidate ${HEAD_SHA:0:12}" \
              -f commit_message="BRAIN-DELIVERY-v2 BG169 GitHub-native failover; trace=${TRACE_ID}; candidate_sha=${HEAD_SHA}; expected_head_sha=${HEAD_SHA}; rollback_identity=${rollback_identity}" \
              -f sha="$HEAD_SHA" \
              -f merge_method="merge")"
            [ "$(jq -r '.merged // false' <<<"$merge_response")" = "true" ] || { echo "::error::BG169_GITHUB_NATIVE_MERGE_REJECTED:$(jq -r '.message // "unknown"' <<<"$merge_response")"; exit 1; }
            transport="github-native"
          fi

          git fetch origin main --no-tags
          production_sha="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$HEAD_SHA" origin/main || { echo "::error::BG169_PROMOTION_NOT_VERIFIED:$HEAD_SHA"; exit 1; }
          current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          [ "$(jq -r '.merged // false' <<<"$current_pr")" = "true" ] || { echo "::error::BG169_PROMOTION_NOT_VERIFIED:PR_NOT_MERGED"; exit 1; }

          jq -n \
            --arg authority "BG169" \
            --arg transport "$transport" \
            --argjson pr_number "$PR_NUMBER" \
            --arg base_sha "$BASE_SHA" \
            --arg candidate_sha "$HEAD_SHA" \
            --arg expected_head_sha "$HEAD_SHA" \
            --arg production_sha "$production_sha" \
            --arg rollback_identity "$rollback_identity" \
            --arg trace_id "$TRACE_ID" \
            --argjson unified_run_id "$UNIFIED_RUN_ID" \
            '{authority:$authority,transport:$transport,pr_number:$pr_number,base_sha:$base_sha,candidate_sha:$candidate_sha,expected_head_sha:$expected_head_sha,production_sha:$production_sha,rollback_identity:$rollback_identity,trace_id:$trace_id,unified_run_id:$unified_run_id,execution_proof:true,verified:true}' \
            > .artifacts/bg169-production-evidence.json
          echo "BRAIN-DELIVERY-v2 trace $TRACE_ID promoted and verified exact candidate $HEAD_SHA via BG169 transport $transport."
      - name: Publish BG169 production evidence
        if: always() && needs.plan.outputs.has_lanes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bg169-production-evidence
          path: .artifacts/bg169-production-evidence.json
          if-no-files-found: ignore
