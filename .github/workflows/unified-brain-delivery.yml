name: Unified Brain Delivery
run-name: "BRAIN delivery dispatch PR #${{ inputs.pr_number }} ${{ inputs.head_sha }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Candidate PR number'
        required: true
        type: string
      base_sha:
        description: 'Immutable PR base SHA'
        required: true
        type: string
      head_sha:
        description: 'Immutable candidate head SHA'
        required: true
        type: string
      candidate_branch:
        description: 'Immutable candidate branch'
        required: true
        type: string
      verification_only:
        description: 'Verify identity without production promotion'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: unified-brain-delivery-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate immutable candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          [ "$(jq -r '.base.sha' <<<"$pr")" = "$BASE_SHA" ] || { echo "::error::PR_BASE_SHA_DRIFT"; exit 1; }
          [ "$(jq -r '.head.sha' <<<"$pr")" = "$HEAD_SHA" ] || { echo "::error::PR_HEAD_SHA_DRIFT"; exit 1; }
          [ "$(jq -r '.head.ref' <<<"$pr")" = "$CANDIDATE_BRANCH" ] || { echo "::error::PR_HEAD_REF_DRIFT"; exit 1; }
          [ "$(jq -r '.state' <<<"$pr")" = "open" ] || { echo "::error::PR_NOT_OPEN"; exit 1; }
          [ "$(jq -r '.draft // false' <<<"$pr")" = "false" ] || { echo "::error::DRAFT_BLOCKED"; exit 1; }
      - name: Verify delivery policy and exact tested head
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          node scripts/brain/chat-learning-preflight.mjs
          node tools/ci/single-flight-release-kernel.mjs plan --base "$BASE_SHA" --head "$HEAD_SHA" --pr "$PR_NUMBER"
      - name: Verification-only handoff
        if: inputs.verification_only == true
        run: echo "Verification-only delivery: production authority handoff intentionally skipped."
      - name: Promote exact green candidate through branch protection
        if: inputs.verification_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          response="$(gh api --method PUT -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" -f sha="$HEAD_SHA" -f merge_method="merge" -f commit_title="BG169: promote exact candidate ${HEAD_SHA:0:12}")"
          [ "$(jq -r '.merged // false' <<<"$response")" = "true" ] || { echo "::error::BG169_MERGE_REJECTED:$(jq -r '.message // "unknown"' <<<"$response")"; exit 1; }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$HEAD_SHA" origin/main || { echo "::error::BG169_PROMOTION_NOT_VERIFIED"; exit 1; }
          echo "BG169 exact candidate $HEAD_SHA promoted through protected main."
