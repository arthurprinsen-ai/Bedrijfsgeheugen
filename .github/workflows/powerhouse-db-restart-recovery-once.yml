name: Powerhouse Database Recovery Once

on:
  push:
    branches:
      - ops/powerhouse-db-restart-20261007
    paths:
      - .github/workflows/powerhouse-db-restart-recovery-once.yml

permissions:
  contents: read

concurrency:
  group: powerhouse-database-recovery-once
  cancel-in-progress: false

jobs:
  restart-postgres:
    if: contains(github.event.head_commit.message, '[restart-db-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PROJECT_REF: adhjwmvyoixzjtmiroln
      EXPECTED_MAIN_SHA: 80cbbc27920227c21e9a7c1fef686d67c4eb93c2
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact main lineage and one-file recovery scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::RECOVERY_MAIN_DRIFT expected=$EXPECTED_MAIN_SHA actual=$current_main"
            exit 78
          }
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$GITHUB_SHA" || {
            echo "::error::RECOVERY_NOT_DESCENDANT_OF_EXPECTED_MAIN"
            exit 78
          }
          changed="$(git diff --name-only "$EXPECTED_MAIN_SHA" "$GITHUB_SHA")"
          test "$changed" = ".github/workflows/powerhouse-db-restart-recovery-once.yml" || {
            echo "::error::RECOVERY_SCOPE_DRIFT"
            printf '%s\n' "$changed"
            exit 78
          }

      - name: Validate recovery authority
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::SUPABASE_ACCESS_TOKEN_NOT_CONFIGURED"
            exit 78
          }

      - name: Restart production Postgres through supported Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(
            curl --silent --show-error               --connect-timeout 10               --max-time 90               --output /tmp/restart-response.json               --write-out '%{http_code}'               --request PUT               --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"               --header 'Content-Type: application/json'               --data '{"restart_database":true}'               "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/database/postgres"
          )"
          test "$code" = "200" || {
            echo "::error::SUPABASE_RESTART_FAILED_HTTP_$code"
            jq -r '.message // .error // "no diagnostic"' /tmp/restart-response.json 2>/dev/null || true
            exit 1
          }
          echo "Supabase accepted restart request."

      - name: Prove database readiness without mutation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg query "select now() as observed_at, current_setting('max_connections') as max_connections;"             '{query:$query,read_only:true}' > /tmp/readiness-request.json
          ready=0
          for attempt in $(seq 1 18); do
            code="$(
              curl --silent --show-error                 --connect-timeout 10                 --max-time 20                 --output /tmp/readiness-response.json                 --write-out '%{http_code}'                 --request POST                 --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"                 --header 'Content-Type: application/json'                 --data-binary @/tmp/readiness-request.json                 "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" || true
            )"
            if [ "$code" = "201" ]; then
              ready=1
              echo "Production Postgres readback succeeded on attempt $attempt."
              jq -c '.[]? // .' /tmp/readiness-response.json 2>/dev/null || true
              break
            fi
            echo "Readiness attempt $attempt/18 returned HTTP ${code:-000}."
            sleep 5
          done
          test "$ready" = "1" || {
            echo "::error::DATABASE_NOT_READY_AFTER_SUPPORTED_RESTART"
            exit 1
          }
