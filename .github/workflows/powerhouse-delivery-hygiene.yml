name: Powerhouse Delivery Hygiene

on:
  workflow_call:
    inputs:
      pr_number:
        description: Optional exact PR number for non-PR callers
        required: false
        type: string
        default: ''
      head_sha:
        description: Optional exact candidate head SHA for non-PR callers
        required: false
        type: string
        default: ''
    outputs:
      state:
        description: Canonical delivery-hygiene state
        value: ${{ jobs.admission.outputs.state }}
      admitted:
        description: Whether the candidate is admitted
        value: ${{ jobs.admission.outputs.admitted }}
      obligation_id:
        description: Canonical obligation id
        value: ${{ jobs.admission.outputs.obligation_id }}
      candidate_head_sha:
        description: Exact candidate head SHA
        value: ${{ jobs.admission.outputs.candidate_head_sha }}
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  admission:
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.admit.outputs.state }}
      admitted: ${{ steps.admit.outputs.admitted }}
      obligation_id: ${{ steps.admit.outputs.obligation_id }}
      candidate_head_sha: ${{ steps.admit.outputs.candidate_head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - id: admit
        name: Admit one canonical candidate before expensive CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          if [ "$EVENT_NAME" = "merge_group" ]; then
            printf 'state=MERGE_GROUP_PREVALIDATED\nadmitted=true\nobligation_id=merge-group\ncandidate_head_sha=%s\n' "${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            printf '{"state":"MERGE_GROUP_PREVALIDATED","admitted":true,"head_sha":"%s"}\n' "$GITHUB_SHA" > .artifacts/powerhouse-delivery-hygiene.json
            exit 0
          fi
          if [ -z "${PR_NUMBER:-}" ]; then
            printf 'state=MANUAL_DIAGNOSTIC\nadmitted=true\nobligation_id=manual\ncandidate_head_sha=%s\n' "${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            printf '{"state":"MANUAL_DIAGNOSTIC","admitted":true,"head_sha":"%s"}\n' "$GITHUB_SHA" > .artifacts/powerhouse-delivery-hygiene.json
            exit 0
          fi
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, writeFile, appendFile } from 'node:fs/promises';
          import { setTimeout as sleep } from 'node:timers/promises';
          import { parseDeliveryMetadata, parseWriterLease, classifyCandidate, evaluateAdmission, validateDeliveryMetadata, deriveHygieneConflictContracts, evaluateWriterLease } from './tools/delivery/delivery-hygiene.mjs';
          import { validateMachineReadablePrBody, scanStaticSecurity, evaluateBranchHygiene, evaluateTestWorkflowCoverage } from './tools/delivery/github-delivery-state-machine.mjs';
          import { createDeliveryPlan } from './tools/brain-delivery-system.mjs';

          const LOCAL_COMMAND_MAX_BUFFER = 64 * 1024 * 1024;
          const sh = (...args) => execFileSync(args[0], args.slice(1), {encoding:'utf8',maxBuffer:LOCAL_COMMAND_MAX_BUFFER}).trim();
          const transientApiFailure = error => /HTTP\s+(?:502|503|504)\b|upstream connect error|connection (?:refused|reset)|ECONNRESET|ETIMEDOUT|socket hang up/i.test(`${error?.message || ''}\n${error?.stderr || ''}\n${error?.stdout || ''}`);
          const GH_MAX_BUFFER = LOCAL_COMMAND_MAX_BUFFER;
          const gh = async path => {
            const delays = [250, 500, 1000];
            for (let attempt = 0; attempt <= delays.length; attempt += 1) {
              try {
                return JSON.parse(execFileSync('gh',['api',path],{encoding:'utf8',maxBuffer:GH_MAX_BUFFER}));
              } catch (error) {
                if (!transientApiFailure(error) || attempt === delays.length) throw error;
                console.warn(`Transient GitHub API failure for ${path}; retry ${attempt + 1}/${delays.length}`);
                await sleep(delays[attempt]);
              }
            }
            throw new Error(`GITHUB_API_RETRY_EXHAUSTED:${path}`);
          };
          const ghAll = async path => {
            const delays = [250, 500, 1000];
            for (let attempt = 0; attempt <= delays.length; attempt += 1) {
              try {
                const pages = JSON.parse(execFileSync('gh',['api','--paginate','--slurp',path],{encoding:'utf8',maxBuffer:GH_MAX_BUFFER}));
                return Array.isArray(pages) ? pages.flat() : [];
              } catch (error) {
                if (!transientApiFailure(error) || attempt === delays.length) throw error;
                console.warn(`Transient paginated GitHub API failure for ${path}; retry ${attempt + 1}/${delays.length}`);
                await sleep(delays[attempt]);
              }
            }
            throw new Error(`GITHUB_API_PAGINATION_RETRY_EXHAUSTED:${path}`);
          };
          const errorSummary = error => String(error?.stderr || error?.stdout || error?.message || error).replace(/\s+/g, ' ').trim().slice(0, 1200);
          const policy = JSON.parse(await readFile('config/powerhouse-delivery-hygiene-v1.json','utf8'));
          const brainPolicy = JSON.parse(await readFile('config/brain-delivery-system.json','utf8'));
          const prNumber = Number(process.env.PR_NUMBER);
          const headSha = sh('git','rev-parse','HEAD');
          let currentMainSha = '';
          let immutableBaseSha = '';
          let changedPaths = [];
          let currentContracts = [];

          const writeFailureEvidence = async (state, error) => {
            const evidence = {
              version: policy.version,
              observed_at: new Date().toISOString(),
              repository: process.env.GITHUB_REPOSITORY,
              pr_number: prNumber,
              immutable_base_sha: immutableBaseSha,
              current_main_sha: currentMainSha,
              candidate_head_sha: headSha,
              changed_paths: changedPaths,
              conflict_contracts: currentContracts,
              state,
              ok: false,
              admitted: false,
              failure_fingerprint: transientApiFailure(error) ? 'github-api-transient-unavailable-v1' : 'delivery-hygiene-admission-error-v1',
              error: errorSummary(error),
            };
            await writeFile('.artifacts/powerhouse-delivery-hygiene.json', `${JSON.stringify(evidence,null,2)}\n`);
            await appendFile(process.env.GITHUB_OUTPUT, `state=${state}\nadmitted=false\nobligation_id=\ncandidate_head_sha=${headSha}\n`);
            console.error(JSON.stringify(evidence,null,2));
          };

          try {
            if (process.env.EXPECTED_HEAD_SHA && headSha !== process.env.EXPECTED_HEAD_SHA) {
              throw new Error(`CANDIDATE_HEAD_SHA_MISMATCH:${process.env.EXPECTED_HEAD_SHA}:${headSha}`);
            }
            let pr = await gh(`repos/${process.env.GITHUB_REPOSITORY}/pulls/${prNumber}`);
            if (String(pr.head?.sha || '') !== headSha) {
              throw new Error(`PR_HEAD_SHA_DRIFT:${headSha}:${pr.head?.sha || ''}`);
            }
            const rerun = Number(process.env.RUN_ATTEMPT || '1') > 1;
            const synchronize = process.env.EVENT_NAME === 'pull_request'
              && process.env.EVENT_ACTION === 'synchronize';
            let livePrBody = String(pr.body || process.env.EVENT_PR_BODY || '');
            let eventLease = parseWriterLease(livePrBody);
            if (synchronize && !rerun && eventLease.state === 'TERMINAL_DELIVERY'
              && String(eventLease.headSha || '').toLowerCase() !== String(headSha || '').toLowerCase()) {
              const leaseWaitMs = [750, 1250, 2000, 3000, 5000];
              for (const delayMs of leaseWaitMs) {
                await new Promise(resolve => setTimeout(resolve, delayMs));
                pr = await gh(`repos/${process.env.GITHUB_REPOSITORY}/pulls/${prNumber}`);
                if (String(pr.head?.sha || '') !== headSha) {
                  throw new Error(`PR_HEAD_SHA_DRIFT:${headSha}:${pr.head?.sha || ''}`);
                }
                livePrBody = String(pr.body || process.env.EVENT_PR_BODY || '');
                eventLease = parseWriterLease(livePrBody);
                if (String(eventLease.headSha || '').toLowerCase() === String(headSha || '').toLowerCase()) {
                  console.log(`TERMINAL_LIVE_LEASE_CAUGHT_UP:${headSha}`);
                  break;
                }
              }
            }
            if (synchronize && !rerun && eventLease.state === 'TERMINAL_DELIVERY'
              && String(eventLease.headSha || '').toLowerCase() !== String(headSha || '').toLowerCase()) {
              const expectedTerminalHead = String(eventLease.headSha || '').toLowerCase();
              let identityOnlyRefresh = false;
              if (/^[0-9a-f]{40}$/.test(expectedTerminalHead) && /^[0-9a-f]{40}$/.test(headSha)) {
                const currentCommit = await gh(`repos/${process.env.GITHUB_REPOSITORY}/git/commits/${headSha}`);
                const previousCommit = await gh(`repos/${process.env.GITHUB_REPOSITORY}/git/commits/${expectedTerminalHead}`);
                const parents = (currentCommit?.parents || []).map(parent => String(parent?.sha || '').toLowerCase());
                const currentTree = String(currentCommit?.tree?.sha || '').toLowerCase();
                const previousTree = String(previousCommit?.tree?.sha || '').toLowerCase();
                identityOnlyRefresh = parents.length === 1
                  && parents[0] === expectedTerminalHead
                  && /^[0-9a-f]{40}$/.test(currentTree)
                  && currentTree === previousTree;
              }
              if (identityOnlyRefresh) {
                console.log(`TERMINAL_IDENTITY_REFRESH_ALLOWED:${expectedTerminalHead}:${headSha}`);
              } else {
                throw new Error(`TERMINAL_CANDIDATE_MUTATED_WITHOUT_LEASE_TRANSITION:${eventLease.headSha || 'missing'}:${headSha}`);
              }
            }
            if (synchronize && !rerun && eventLease.state === 'MAIN_SYNC') {
              const syncCommit = await gh(`repos/${process.env.GITHUB_REPOSITORY}/git/commits/${headSha}`);
              const syncParents = (syncCommit?.parents || []).map(parent => String(parent?.sha || '').toLowerCase());
              const expectedPreviousHead = String(eventLease.headSha || '').toLowerCase();
              const expectedMainTarget = String(eventLease.mainEpochSha || '').toLowerCase();
              const validMainSync = /^[0-9a-f]{40}$/.test(expectedPreviousHead)
                && /^[0-9a-f]{40}$/.test(expectedMainTarget)
                && syncParents.length >= 2
                && syncParents.includes(expectedPreviousHead)
                && syncParents.includes(expectedMainTarget);
              if (!validMainSync) {
                throw new Error(`INVALID_MAIN_SYNC_COMMIT:${expectedPreviousHead || 'missing'}:${expectedMainTarget || 'missing'}:${headSha}`);
              }
            }
            const open = await ghAll(`repos/${process.env.GITHUB_REPOSITORY}/pulls?state=open&per_page=100`);
            const mainRef = await gh(`repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`);
            currentMainSha = String(mainRef?.object?.sha || '').trim();
            if (!/^[0-9a-f]{40}$/i.test(currentMainSha)) throw new Error('CURRENT_MAIN_SHA_INVALID');
            const compare = await gh(`repos/${process.env.GITHUB_REPOSITORY}/compare/${currentMainSha}...${headSha}`);
            immutableBaseSha = String(compare?.merge_base_commit?.sha || pr.base?.sha || '').trim();
            if (!/^[0-9a-f]{40}$/i.test(immutableBaseSha)) throw new Error('IMMUTABLE_BASE_SHA_INVALID');
            const prFiles = await ghAll(`repos/${process.env.GITHUB_REPOSITORY}/pulls/${prNumber}/files?per_page=100`);
            changedPaths = [...new Set(prFiles.map(file => String(file?.filename || '').trim()).filter(Boolean))].sort();
            currentContracts = deriveHygieneConflictContracts(changedPaths, brainPolicy, policy);
            if (pr.head?.sha !== headSha) {
              throw new Error(`PR_HEAD_SHA_DRIFT:${headSha}:${pr.head?.sha || ''}`);
            }

            const candidateMetadata = parseDeliveryMetadata(pr.body || '');
            const machineContract = validateMachineReadablePrBody({
              body: pr.body || '',
              candidateHeadSha: headSha,
              currentMainSha,
              policy,
            });
            if (!machineContract.ok) {
              throw new Error(`PR_MACHINE_METADATA_INVALID:${machineContract.errors.join(',')}`);
            }

            const branchGate = evaluateBranchHygiene({ headRef: pr.head?.ref || '', baseRef: pr.base?.ref || '' });
            if (!branchGate.ok) throw new Error(`BRANCH_HYGIENE_FAILED:${branchGate.reasons.join(',')}`);

            const plan = createDeliveryPlan({ changedPaths, headSha, policy: brainPolicy });
            const classifiedLanes = plan.lanes.map(lane => lane.id);
            const coverageGate = evaluateTestWorkflowCoverage({ changedPaths, classifiedLanes });
            if (!coverageGate.ok) throw new Error(`TEST_WORKFLOW_COVERAGE_FAILED:${coverageGate.reasons.join(',')}`);

            const patch = execFileSync('gh',['pr','diff',String(prNumber),'--repo',process.env.GITHUB_REPOSITORY,'--patch'],{encoding:'utf8',maxBuffer:GH_MAX_BUFFER});
            const securityGate = scanStaticSecurity(patch);
            if (!securityGate.ok) throw new Error(`SECURITY_STATIC_FAILED:${securityGate.findings.join(',')}`);

            const lease = evaluateWriterLease({
              body: pr.body || '',
              candidateHeadSha: headSha,
              currentMainSha,
              obligationId: candidateMetadata.obligationId,
              enforceCurrentMainEpoch: false,
            });
            if (!lease.ok) {
              const evidence = {
                version: policy.version,
                observed_at: new Date().toISOString(),
                repository: process.env.GITHUB_REPOSITORY,
                pr_number: prNumber,
                immutable_base_sha: immutableBaseSha,
                current_main_sha: currentMainSha,
                candidate_head_sha: headSha,
                changed_paths: changedPaths,
                conflict_contracts: currentContracts,
                writer_lease: lease,
                state: lease.state,
                ok: false,
                admitted: false,
              };
              await writeFile('.artifacts/powerhouse-delivery-hygiene.json', `${JSON.stringify(evidence,null,2)}\n`);
              await appendFile(process.env.GITHUB_OUTPUT, `state=${lease.state}\nadmitted=false\nobligation_id=\ncandidate_head_sha=${headSha}\n`);
              console.error(JSON.stringify(evidence,null,2));
              process.exit(78);
            }

            const candidatePool = [...open];
            if (candidateMetadata.supersedes !== null && !candidatePool.some(item => Number(item.number) === Number(candidateMetadata.supersedes))) {
              const predecessor = await gh(`repos/${process.env.GITHUB_REPOSITORY}/pulls/${candidateMetadata.supersedes}`);
              candidatePool.push(predecessor);
            }

            const normalized = [];
            for (const item of candidatePool) {
              const metadata = parseDeliveryMetadata(item.body || '');
              let conflictContracts = [];
              const needsConflictFiles = Number(item.number) !== prNumber && metadata.candidateType === 'promotion';
              if (validateDeliveryMetadata(metadata, policy).ok && needsConflictFiles) {
                const files = await gh(`repos/${process.env.GITHUB_REPOSITORY}/pulls/${item.number}/files?per_page=100`);
                conflictContracts = deriveHygieneConflictContracts(files.map(file => file.filename), brainPolicy, policy);
              }
              normalized.push(classifyCandidate({
                number: item.number,
                state: item.state,
                body: item.body || '',
                baseSha: item.number === prNumber ? immutableBaseSha : (metadata.baseSha || item.base?.sha || ''),
                headSha: item.head?.sha || '',
                conflictContracts,
              }, policy));
            }

            const candidate = classifyCandidate({
              number: prNumber,
              state: pr.state,
              body: pr.body || '',
              baseSha: immutableBaseSha,
              headSha,
              conflictContracts: currentContracts,
            }, policy);
            const result = evaluateAdmission({candidate,openCandidates:normalized,policy,currentMainSha});
            const evidence = {
              version: policy.version,
              observed_at: new Date().toISOString(),
              repository: process.env.GITHUB_REPOSITORY,
              pr_number: prNumber,
              immutable_base_sha: immutableBaseSha,
              current_main_sha: currentMainSha,
              changed_paths: changedPaths,
              conflict_contracts: currentContracts,
              legacy_unclassified_open_prs: normalized.filter(item => !item.metadata?.obligationId).map(item => item.number),
              cheap_gates: {
                metadata_schema: machineContract.ok,
                branch_hygiene: branchGate.ok,
                classifier_completeness: true,
                test_workflow_coverage: coverageGate.ok,
                security_static: securityGate.ok,
                writer_lease: lease.ok,
              },
              classified_lanes: classifiedLanes,
              writer_lease: lease,
              ...result,
            };
            await writeFile('.artifacts/powerhouse-delivery-hygiene.json', `${JSON.stringify(evidence,null,2)}\n`);
            await appendFile(process.env.GITHUB_OUTPUT, `state=${result.state}\nadmitted=${result.ok}\nobligation_id=${candidate.metadata.obligationId || ''}\ncandidate_head_sha=${headSha}\n`);
            console.log(JSON.stringify(evidence,null,2));
            if (!result.ok) process.exitCode = 78;
          } catch (error) {
            const state = transientApiFailure(error) ? 'CONTROL_PLANE_API_UNAVAILABLE' : 'CONTROL_PLANE_ADMISSION_ERROR';
            await writeFailureEvidence(state, error);
            process.exitCode = 1;
          }
          NODE
      # This is one of the two branch-protection-required jobs. Keep canonical
      # learning validation here too: Required test/preflight is not currently
      # a required branch protection context and must not be its sole guard.
      - name: Require canonical learning evidence at protected admission
        if: steps.admit.outputs.admitted == 'true'
        run: |
          set -euo pipefail
          evidence=.artifacts/powerhouse-delivery-hygiene.json
          test -s "$evidence"
          if ! grep -q '"brain/learning/' "$evidence"; then
            echo NO_CHANGED_BRAIN_LEARNING
            exit 0
          fi
          base_sha="$(node -e "const x=require('./.artifacts/powerhouse-delivery-hygiene.json');const s=x.immutable_base_sha||'';if(!/^[0-9a-f]{40}$/.test(s))process.exit(1);process.stdout.write(s)")"
          git fetch --no-tags --depth=1 origin "$base_sha"
          if ! POWERHOUSE_BASE_SHA="$base_sha" POWERHOUSE_HEAD_SHA="$(git rev-parse HEAD)" node scripts/brain/learning-canonicalization-gate.mjs; then
            node -e "const fs=require('fs');const p='.artifacts/powerhouse-delivery-hygiene.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));x.state='LEARNING_CANONICALIZATION_BLOCKED';x.ok=false;x.admitted=false;fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');"
            exit 1
          fi
      # Enforce the existing material closure invariant inside the required check.
      - name: Enforce canonical integration closure at protected admission
        if: steps.admit.outputs.admitted == 'true'
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { compileClosurePlan } from './tools/delivery/integration-bundle-compiler.mjs';
          const file='.artifacts/powerhouse-delivery-hygiene.json';
          const evidence=JSON.parse(await readFile(file,'utf8'));
          const policy=JSON.parse(await readFile('config/powerhouse-integration-bundle-v1.json','utf8'));
          const closure=compileClosurePlan({
            changedPaths:evidence.changed_paths||[],
            policy,
            obligationId:evidence.obligation_id||''
          });
          if(!closure.ready){
            evidence.state='INTEGRATION_BUNDLE_CLOSURE_INCOMPLETE';
            evidence.ok=false;
            evidence.admitted=false;
            evidence.missing_closure_evidence=closure.missing;
            await writeFile(file,JSON.stringify(evidence,null,2)+'\n');
            throw new Error('INTEGRATION_BUNDLE_CLOSURE_INCOMPLETE:'+closure.missing.join(','));
          }
          console.log(JSON.stringify({status:'CANONICAL_INTEGRATION_CLOSURE_COMPLETE',material:closure.material,authority:closure.authority}));
          NODE
      - name: Upload admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerhouse-delivery-hygiene-${{ github.run_id }}
          path: .artifacts/powerhouse-delivery-hygiene.json
          if-no-files-found: error
