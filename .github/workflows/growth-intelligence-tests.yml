name: Growth Intelligence module tests
on:
  pull_request:
    paths:
      - 'tools/growth-intelligence/**'
      - '.github/workflows/growth-intelligence-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/growth-intelligence/*.test.mjs
