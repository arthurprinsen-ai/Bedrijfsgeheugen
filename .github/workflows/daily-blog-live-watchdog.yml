name: Native daily blog live watchdog

on:
  push:
    branches: [main]
    paths:
      - 'data/content-publication-ledger.json'
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      business_date:
        description: 'Optionele Europe/Amsterdam business date'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: native-daily-blog-live-watchdog
  cancel-in-progress: false

env:
  BUSINESS_TIME_ZONE: Europe/Amsterdam

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce no public proof write regression
        run: node --test tests/brain-daily-blog-watchdog-no-public-private-proof.test.mjs

      - name: Resolve exact daily ledger record
        id: record
        env:
          REQUESTED_DATE: ${{ github.event.inputs.business_date }}
        run: |
          set -euo pipefail
          date="${REQUESTED_DATE:-}"
          if [ -z "$date" ]; then
            today="$(node --input-type=module -e "import {businessDate} from './tools/content-growth/daily-blog.mjs'; console.log(businessDate(new Date(),'Europe/Amsterdam'))")"
            date="$(node - "$today" <<'NODE'
          const ledger=require('./data/content-publication-ledger.json');
          const today=process.argv[2];
          const days=ledger.days||{};
          if (days[today] && days[today].state !== 'live') { console.log(today); process.exit(0); }
          const dates=Object.keys(days).filter(d=>d<=today && days[d]?.state !== 'live').sort();
          if (!dates.length) process.exit(2);
          console.log(dates.at(-1));
          NODE
            )"
          fi
          json="$(node -e "const x=require('./data/content-publication-ledger.json'); const r=x.days?.[process.argv[1]]; if(!r) process.exit(2); console.log(JSON.stringify(r))" "$date")"
          slug="$(node -e "console.log(JSON.parse(process.argv[1]).slug)" "$json")"
          content_id="$(node -e "console.log(JSON.parse(process.argv[1]).content_id)" "$json")"
          state="$(node -e "console.log(JSON.parse(process.argv[1]).state)" "$json")"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "content_id=$content_id" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Exact production live-readback
        id: proof
        env:
          SLUG: ${{ steps.record.outputs.slug }}
          CONTENT_ID: ${{ steps.record.outputs.content_id }}
        run: |
          set -euo pipefail
          url="https://www.bedrijfsgeheugen.nl/blog/$SLUG/"
          for attempt in $(seq 1 8); do
            if node tools/content-growth/live-readback.mjs "$url" "$CONTENT_ID" "$SLUG" > /tmp/daily-live-proof.json; then
              cat /tmp/daily-live-proof.json
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "::error::DAILY_BLOG_NOT_LIVE:${{ steps.record.outputs.date }}:$CONTENT_ID:$url"
          exit 1

      - name: Stop when ledger already records live proof
        if: steps.record.outputs.state == 'live'
        run: node tools/content-growth/assert-live-ledger.mjs data/content-publication-ledger.json "${{ steps.record.outputs.date }}"

      - name: Reconcile proof in canonical publisher only
        if: steps.proof.outputs.ok == 'true'
        env:
          BUSINESS_DATE: ${{ steps.record.outputs.date }}
        run: |
          set -euo pipefail
          # Legacy watchdog only reads external public HTML; no PR, Git writes,
          # Brain/ledger materialization or alternative publication authority.
          # Supabase canonical Powerhouse daily publisher retains all closure.
          echo "LEGACY_BLOG_WATCHDOG_READ_ONLY:${BUSINESS_DATE}:HTTP_READBACK_VERIFIED"
          echo "PROOF_WRITER:EXISTING_CANONICAL_POWERHOUSE_BLOG"
