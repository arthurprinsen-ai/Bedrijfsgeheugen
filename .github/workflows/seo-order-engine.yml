name: SEO order engine

on:
  push:
    branches:
      - main
      - feat/seo-order-engine-20260905
      - feat/seo-to-order-intelligence-loop-final-20260905
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: SEO order contracts
        run: node --test tests/seo-order-*.test.mjs
      - name: SEO growth contracts
        run: node --test tests/seo-growth-*.test.mjs
