name: Shared Agent Memory Tests

on:
  push:
    branches:
      - 'automation/**'
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/development-doc-contract.test.mjs tests/delivery-chat-regressions.test.mjs tests/team-learning-event.test.mjs tests/team-memory-fingerprint.test.mjs tests/opportunity-scout.test.mjs tests/production-promotion-controller.test.mjs tests/production-promotion-guardian.test.mjs tests/hero-media-normalizer.test.mjs tests/hero-media-executor.test.mjs tests/paginacontrole-concurrent-push.test.mjs tests/paginacontrole-concurrency.test.mjs tests/repo-writeback-safety.test.mjs tests/repo-writer-governance.test.mjs tests/repo-writer-candidate.test.mjs tests/menu-writer-candidate-mode.test.mjs tests/regulation-writer-candidate-mode.test.mjs tests/seo-writer-candidate-mode.test.mjs tests/approved-central-blog-candidate-mode.test.mjs tests/blog-update-writer-candidate-mode.test.mjs tests/weekblog-writer-candidate-mode.test.mjs tests/paginacontrole-writer-candidate-mode.test.mjs tests/repository-protection-readiness.test.mjs tests/repository-writer-structural-parity.test.mjs tests/repo-writer-shadow.test.mjs tests/repo-writer-operational-harness.test.mjs tests/content-writer-operational-fixture.test.mjs tests/whole-brain-obligation-contract.test.mjs tests/agent-fabric.test.mjs tests/agent-fabric-gateway.test.mjs tests/agent-fabric-team-memory.test.mjs tests/brain-chat-learning-complete.test.mjs tests/instagram-chat-learning-contract.test.mjs tests/chat-learning-completeness-addendum.test.mjs tests/brain-chat-learning-canonical-closure.test.mjs tests/brain-chat-learning-completeness.test.mjs tests/branch-delivery-ownership-guard.test.mjs tests/branch-delivery-guard-discovery.test.mjs tests/delivery-preflight-completion.test.mjs
      - name: Verify Brain cost membership
        run: node --test tests/brain-cost-membership.test.mjs tests/cost-component-catalog.test.mjs
