name: Shared Agent Memory Tests

on:
  push:
    branches:
      - 'automation/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/development-doc-contract.test.mjs tests/team-learning-event.test.mjs tests/team-memory-fingerprint.test.mjs tests/opportunity-scout.test.mjs tests/production-promotion-controller.test.mjs tests/hero-media-normalizer.test.mjs tests/hero-media-executor.test.mjs
