name: Draft 6165 migration filename generation
on:
  push:
    branches:
      - review/original-linkedin-founder-gate-alignment-20261124
    paths:
      - '.github/workflows/draft-6165-migration-name-generation.yml'
permissions:
  contents: read
concurrency:
  group: draft-6165-migration-filename
  cancel-in-progress: false
jobs:
  generate-name:
    if: github.repository == 'arthurprinsen-ai/Bedrijfsgeheugen' && github.ref == 'refs/heads/review/original-linkedin-founder-gate-alignment-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.119.0
      - name: Generate a migration filename in an empty scratch directory only
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          cd "$scratch"
          supabase --version
          supabase migration new --help
          supabase init
          supabase migration new original_linkedin_founder_identity_gate_alignment
          find supabase/migrations -maxdepth 1 -type f -name '*_original_linkedin_founder_identity_gate_alignment.sql' -printf 'GENERATED_MIGRATION_PATH=%p\n'
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*_original_linkedin_founder_identity_gate_alignment.sql' | wc -l)" -eq 1
