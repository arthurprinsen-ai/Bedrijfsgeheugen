name: Security Operations Proof

on:
  push:
    branches: [main]
    paths:
      - 'scripts/security-operations-proof.mjs'
      - 'tests/security-operations-proof.test.mjs'
      - 'powerhouse/assurance/security-operations-closure.json'
      - 'docs/powerhouse/POWERHOUSE_SECURITY_OPERATIONS_CLOSURE.md'
      - '.github/workflows/security-operations-proof.yml'
      - '_redirects'
      - '_headers'
      - 'netlify.toml'
      - 'tests/brain-site-security-source-exposure-20261120.test.mjs'
      - 'tests/brain-security-live-headers-monitor-20261120.test.mjs'
      - 'tools/security/verify-public-security-headers.mjs'
      - 'tests/brain-security-live-guard-contract-20261120.test.mjs'
      - 'tools/security/site-guardian.mjs'
      - 'tools/security/security-guardian-incidents.mjs'
      - 'config/security-managed-sites.json'
      - 'tests/brain-security-guardian-continuous-20261120.test.mjs'
      - 'netlify/functions/_security-guardian-oidc.mjs'
      - 'netlify/functions/security-guardian-ingest.mjs'
      - 'portal-v2/modules/security-trust-workspace.js'
      - 'portal-v2/security-trust-workspace.css'
  schedule:
    # Frequent checks reuse the EXISTING Security Operations owner, not a new agent.
    - cron: '7,22,37,52 * * * *'
    - cron: '17 5 * * 1'
    # Frequent lightweight live guard for both original Netlify sites.
    - cron: '47 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      require_live:
        description: 'Fail unless the full security/operations closure is LIVE & BEWEZEN'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    # Preserve the original weekly DR and four-daily header proof; the new guardian has its own cadence in this same workflow.
    if: github.event_name != 'schedule' || github.event.schedule == '17 5 * * 1' || github.event.schedule == '47 1,7,13,19 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contract tests
        run: node --test tests/security-operations-proof.test.mjs tests/brain-site-security-source-exposure-20261120.test.mjs tests/brain-security-live-guard-contract-20261120.test.mjs
      - name: Verify continuous guardian and authenticated heartbeat ingestion
        run: node --test tests/brain-security-guardian-continuous-20261120.test.mjs
      - name: HTTP browser defense regression tests
        run: node --test tests/brain-security-csp-web-boundary-20261120.test.mjs tests/brain-security-live-headers-monitor-20261120.test.mjs
      - name: Structural fail-closed validation
        run: node scripts/security-operations-proof.mjs --check
      - name: Detect publicly exposed internal source in actual production
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          base='https://www.bedrijfsgeheugen.nl'
          public_status="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "$base/" )"
          test "$public_status" = 200 || { echo "::error::Homepage unavailable ($public_status)"; exit 1; }
          for path in \
            /supabase/migrations/20261014124402_scoped_external_reconcile_auth_retry_20261014.sql \
            /scripts/security-operations-proof.mjs \
            /package.json \
            /config/brain-delivery-system.json \
            /netlify.toml \
            /.gitignore \
            /.git/config \
            /.bg-prebuilt-manifest.json \
            /.vscode/settings.json; do
            status="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "$base$path")"
            if [ "$status" != 404 ]; then
              echo "::error::PRIVATE_SOURCE_EXPOSURE: route returned HTTP $status (must 404)"
              exit 1
            fi
          done
          echo "Private source routes verified HTTP 404; public homepage remains HTTP 200."
      - name: Independent recurring production HTTP security proof
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.require_live) }}
        run: node tools/security/verify-public-security-headers.mjs
      - name: Full closure gate when explicitly required
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 5 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.require_live) }}
        run: node scripts/security-operations-proof.mjs --require-live

  guardian:
    name: Security Guardian — 16 managed sites and platform proof
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'schedule' && github.event.schedule == '7,22,37,52 * * * *') || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify authentic security monitor, OIDC and fail-closed portal contracts
        run: node --test tests/brain-security-guardian-continuous-20261120.test.mjs
      - name: Probe all registered sites read-only with bounded retries
        id: probe
        run: node tools/security/site-guardian.mjs --output "$RUNNER_TEMP/security-guardian-report.json"
      - name: Publish independently verified heartbeat to tenant-isolated EU Trust Center
        id: ingest
        env:
          REPORT_FILE: ${{ runner.temp }}/security-guardian-report.json
        shell: bash
        run: |
          set -euo pipefail
          audience='https%3A%2F%2Fwww.bedrijfsgeheugen.nl%2Fapi%2Fsecurity-guardian-ingest'
          jwt="$(curl -fsS --max-time 15 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r '.value // empty')"
          test -n "$jwt" || { echo "::error::OIDC_UNAVAILABLE"; exit 1; }
          echo "::add-mask::$jwt"
          curl -fsS --max-time 35 -X POST 'https://www.bedrijfsgeheugen.nl/api/security-guardian-ingest' \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $jwt" \
            --data-binary @"$REPORT_FILE" -o "$RUNNER_TEMP/security-guardian-ack.json"
          jq -e '.stored==true and .readback==true' "$RUNNER_TEMP/security-guardian-ack.json" >/dev/null ||
            { echo "::error::SECURITY_TELEMETRY_READBACK_MISSING"; exit 1; }
          echo "Security heartbeat acknowledged by existing tenant-secured EU service."
      - name: Create deduplicated sanitized incidents and request original Engineering agent
        if: always() && steps.probe.outcome == 'success'
        run: node tools/security/security-guardian-incidents.mjs "$RUNNER_TEMP/security-guardian-report.json"
      - name: Fail closed if any managed site or source exposure is not verified
        if: always() && steps.probe.outcome == 'success'
        run: |
          node --input-type=module -e "
            import{readFileSync}from'node:fs';
            const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/security-guardian-report.json','utf8'));
            if(r.status!=='VERIFIED'){console.error('SECURITY_GUARDIAN_ACTION_REQUIRED: '+r.failed+' high, '+r.warning+' review');process.exit(1)}
          "

