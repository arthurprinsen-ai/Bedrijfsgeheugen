name: Blog Technical SEO Gate
on:
  push:
    branches: [main]
    paths: ['blog/**','sitemap.xml','robots.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: npm install
      - name: Technical SEO contracts
        run: node --test tests/technical-seo-gate.test.mjs
      - name: SEO and internal links
        run: python3 .github/scripts/seocontrole.py
