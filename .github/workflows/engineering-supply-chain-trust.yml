name: Engineering Supply Chain Trust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies for SBOM generation
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Generate SPDX SBOM
        run: npm sbom --sbom-format spdx > sbom.spdx.json
      - name: Build provenance subject
        run: tar --exclude=.git -czf powerhouse-source.tgz .
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: powerhouse-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-trust-${{ github.sha }}
          path: |
            powerhouse-source.tgz
            sbom.spdx.json
