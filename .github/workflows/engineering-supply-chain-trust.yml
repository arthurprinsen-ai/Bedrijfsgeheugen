name: Engineering Supply Chain Trust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: github_dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Fail-closed local dependency audit fallback
        if: steps.github_dependency_review.outcome != 'success'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --package-lock-only --audit-level=high

  provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve immutable SBOM input without installing runtime files
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate SPDX SBOM
        run: npm sbom --package-lock-only --sbom-format spdx > sbom.spdx.json
      - name: Build provenance subject
        run: tar --exclude=.git --exclude=powerhouse-source.tgz -czf powerhouse-source.tgz .
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: powerhouse-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-trust-${{ github.sha }}
          path: |
            powerhouse-source.tgz
            sbom.spdx.json
