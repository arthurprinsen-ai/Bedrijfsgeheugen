name: Engineering Supply Chain Trust

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - '.github/workflows/engineering-supply-chain-trust.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineering-supply-chain-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: github_dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
      - name: Fail-closed local dependency audit fallback
        if: steps.github_dependency_review.outcome != 'success'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --package-lock-only --audit-level=high

  provenance:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve immutable SBOM input without installing runtime files
        run: |
          node --input-type=module - <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const root = JSON.parse(await readFile('package.json', 'utf8'));
          const manifest = {
            name: 'bedrijfsgeheugen',
            version: '0.0.0',
            private: true,
            dependencies: root.dependencies || {},
            optionalDependencies: root.optionalDependencies || {}
          };
          await mkdir('.sbom', { recursive: true });
          await writeFile('.sbom/package.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          npm install --prefix .sbom --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate SPDX SBOM
        run: |
          cd .sbom
          npm sbom --package-lock-only --sbom-format spdx > ../sbom.spdx.json
      - name: Build provenance subject outside source tree
        run: tar --exclude=.git --exclude=.sbom -czf "$RUNNER_TEMP/powerhouse-source.tgz" .
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/powerhouse-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-trust-${{ github.sha }}
          path: |
            ${{ runner.temp }}/powerhouse-source.tgz
            sbom.spdx.json
