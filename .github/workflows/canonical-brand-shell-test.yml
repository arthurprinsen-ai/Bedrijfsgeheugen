name: Canonical brand shell contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/**'
      - 'assets/**'
      - 'pages/**'
      - 'site/**'
      - 'blog/**'
      - 'kennis/**'
      - '*.html'
      - 'styles.css'
      - 'script.js'
      - 'tools/site-shell/**'
      - 'tests/site-shell-*.test.mjs'
      - '.github/workflows/canonical-brand-shell-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/site-shell/test-shell-components.mjs
      - run: node --test tests/site-shell-compare-slider-physical-edges.test.mjs
