name: Universal Closed-loop Learning

on:
  schedule:
    - cron: '37 4 * * *'
  push:
    branches: [main]
    paths:
      - 'config/universal-closed-loop-learning.json'
      - 'scripts/brain/validate-universal-closed-loop-learning.mjs'
      - 'tests/brain-universal-closed-loop-learning.test.mjs'
      - 'tools/portal/customer-production-acceptance.mjs'
      - 'tests/portal-independent-customer-production-acceptance-v1.test.mjs'
      - '.github/workflows/universal-closed-loop-learning.yml'

jobs:
  universal-closed-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate contract
        run: node scripts/brain/validate-universal-closed-loop-learning.mjs
      - name: Regression tests
        run: node --test tests/brain-universal-closed-loop-learning.test.mjs
      - name: Verify tenant relevance UI projection
        run: node --test portal-v2/tests/relevance-learning-closed-loop.test.mjs
      - name: Verify false-green control-plane obligation guard
        run: node --test portal-v2/tests/control-plane-cockpit.test.mjs
      - name: Verify signed independent customer production acceptance contract
        run: node --test tests/portal-independent-customer-production-acceptance-v1.test.mjs
      - name: Compound learning integration regression
        run: node --test tests/brain-powerhouse-daily-compound-learning-v1.test.mjs
