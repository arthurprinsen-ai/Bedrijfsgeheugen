name: Universal Closed-loop Learning
on:
  push:
    branches: [main]
    paths: ['config/universal-closed-loop-learning.json','scripts/brain/validate-universal-closed-loop-learning.mjs','tests/brain-universal-closed-loop-learning.test.mjs']
  workflow_dispatch:
jobs:
  universal-closed-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/brain/validate-universal-closed-loop-learning.mjs
      - run: node --test tests/brain-universal-closed-loop-learning.test.mjs
