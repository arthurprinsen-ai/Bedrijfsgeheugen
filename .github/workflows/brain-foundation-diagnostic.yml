name: Brain foundation diagnostic

on:
  push:
    branches:
      - feat/whole-brain-canonical-loop-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run every Brain test independently
        shell: bash
        run: |
          set +e
          failed=0
          mapfile -t files < <(
            { find scripts/brain -maxdepth 1 -type f -name 'test-*.mjs' ! -name 'test-all.mjs'; \
              find tests -maxdepth 1 -type f \( -name 'chat-to-brain-*.test.mjs' -o -name 'whole-brain-*.test.mjs' \); } | sort
          )
          echo "Running ${#files[@]} Brain tests"
          for file in "${files[@]}"; do
            echo "### $file"
            node --test "$file"
            status=$?
            if [ $status -ne 0 ]; then
              echo "::error file=$file,title=FAILED_BRAIN_TEST::$file failed with exit code $status"
              failed=$((failed+1))
            fi
          done
          echo "failed=$failed"
          test "$failed" -eq 0
