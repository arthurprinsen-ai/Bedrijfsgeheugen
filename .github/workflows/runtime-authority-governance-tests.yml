name: Runtime Authority Governance Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-authority-governance-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  runtime-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Enforce runtime authority and retired adapter invariants
        run: node --test tests/brain-runtime-authority-governance.test.mjs tests/brain-adapter-conformance.test.mjs
