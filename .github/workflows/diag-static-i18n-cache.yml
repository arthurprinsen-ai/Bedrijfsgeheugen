name: Diagnostic static i18n cache
on:
  push:
    branches:
      - diag/i18n-cache-20260925
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Validate static English cache
        env:
          STATIC_I18N_NETWORK: "0"
          STATIC_I18N_REQUIRE_CACHE: "1"
        run: node tools/site-shell/build-localized-routes.mjs --validate-cache
      - name: Reproduce Netlify production build
        env:
          NETLIFY: "true"
          CONTEXT: "production"
          BRANCH: "main"
          COMMIT_REF: ${{ github.event.before }}
          STATIC_I18N_NETWORK: "0"
          STATIC_I18N_REQUIRE_CACHE: "1"
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: node tools/site-shell/pricing-build-integrity.mjs capture && node tools/bouw-powerhouse-auth.mjs && node tools/bouw-kennisindex.mjs && node tools/bouw-v18-production.mjs && node tools/apply-tabbladen.mjs && node tools/bouw-v18-views.mjs && node tools/bouw-v18-chrome-alles.mjs && node tools/prijzen-uit-de-homepage.mjs && node tools/site-shell/pricing-build-integrity.mjs restore && node tools/site-shell/apply-i18n.mjs && node tools/site-shell/build-localized-routes.mjs && node tools/genereer-sitemap.mjs && node tools/bouw-release-evidence.mjs
