name: Main Write Integrity

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Classify main write provenance
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFile, writeFile } from 'node:fs/promises';
          import { classifyMainWrite } from './tools/main-write-integrity.mjs';
          const sha = process.env.GITHUB_SHA;
          const parentLine = execFileSync('git', ['rev-list', '--parents', '-n', '1', sha], { encoding: 'utf8' }).trim();
          const parentCount = Math.max(0, parentLine.split(/\s+/).length - 1);
          const changedPaths = execFileSync('git', ['diff-tree', '--no-commit-id', '--name-only', '-r', sha], { encoding: 'utf8' }).split(/\r?\n/).map(v => v.trim()).filter(Boolean);
          const result = classifyMainWrite({ branch: process.env.GITHUB_REF_NAME, parentCount, changedPaths, headSha: sha });
          const evidence = { observedAt: new Date().toISOString(), repository: process.env.GITHUB_REPOSITORY, runId: process.env.GITHUB_RUN_ID, changedPaths, ...result };
          await writeFile('.artifacts/main-write-integrity.json', `${JSON.stringify(evidence, null, 2)}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `status=${result.status}\nrecoveryRequired=${String(result.recoveryRequired)}\nfingerprint=${result.fingerprint ?? ''}\n`);
          console.log(JSON.stringify(evidence));
          NODE
      - name: Create or update stateful recovery incident
        if: steps.classify.outputs.recoveryRequired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: delivery|main-write|material-single-parent-bypass-v1
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}"
          issue_number="$(gh api "${api}/issues?state=open&per_page=100" --paginate | jq --arg fingerprint "$FINGERPRINT" -r '.[] | select(.pull_request == null) | select((.body // "") | contains($fingerprint)) | .number' | head -n1)"
          body=$(cat <<EOF
          Status: \`RECOVERING\`

          fingerprint: \`${FINGERPRINT}\`
          recoveryRequired: true
          last_seen_sha: \`${HEAD_SHA}\`
          last_seen_run: \`${RUN_ID}\`

          A material single-parent write reached \`main\` outside the governed candidate/PR merge path. Do not blind-revert: inspect the actual change, preserve valid content, route any repair through a fresh candidate from current main, and keep production promotion non-green until provenance/recovery is independently verified. Native branch protection remains the preventative hard boundary; this issue is the stateful post-write recovery record.
          EOF
          )
          if [ -n "$issue_number" ]; then
            gh api --method PATCH "${api}/issues/${issue_number}" -f body="$body" >/dev/null
            echo "updated recovery issue #${issue_number}"
          else
            gh api --method POST "${api}/issues" -f title='Recovery: direct main write integrity incident' -f body="$body" >/dev/null
            echo "created recovery issue"
          fi
      - name: Upload immutable integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-write-integrity-${{ github.run_id }}
          path: .artifacts/main-write-integrity.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed on ungoverned main write
        if: steps.classify.outputs.recoveryRequired == 'true'
        run: exit 42
