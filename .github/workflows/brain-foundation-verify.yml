name: Brain foundation verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'brain/**'
      - 'config/brain-*.json'
      - 'platform/api/brain-operating-*.mjs'
      - 'netlify/functions/brain-operating-*.mjs'
      - 'scripts/brain/**'
      - 'tests/brain/**'
      - 'tests/chat-to-brain-*.test.mjs'
      - 'tests/whole-brain-*.test.mjs'
      - 'supabase/migrations/**'
      - 'docs/brain/**'
      - '.github/workflows/brain-foundation-verify.yml'

permissions:
  contents: read

concurrency:
  group: brain-foundation-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run Brain foundation regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          node scripts/brain/test-all.mjs 2>&1 | tee .artifacts/brain-foundation-verification.log
      - name: Preserve independent BRAIN proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-foundation-verification-${{ github.sha }}
          path: .artifacts/brain-foundation-verification.log
          if-no-files-found: warn
