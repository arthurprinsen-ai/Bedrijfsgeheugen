name: Materialize accepted OpenArt hero

on:
  push:
    branches:
      - automation/openart-hero-production-promotion
    paths:
      - .github/workflows/materialize-openart-hero.yml
      - tools/build-openart-hero-production.mjs
      - package.json

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/openart-hero-production-promotion
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts=false
      - run: node tools/build-openart-hero-production.mjs
      - name: Commit exact accepted binary
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/openart-hero-iphone-safe-v1.mp4 assets/openart-hero-production.json
          git diff --cached --quiet && exit 0
          git commit -m "assets: materialize accepted OpenArt hero binary"
          git push origin HEAD:automation/openart-hero-production-promotion
