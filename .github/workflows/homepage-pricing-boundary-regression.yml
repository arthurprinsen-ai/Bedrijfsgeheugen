name: Homepage pricing boundary regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/homepage-pricing-boundary-readback.test.mjs'
      - 'tools/seo-order-engine/**'
      - '.github/workflows/homepage-pricing-boundary-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify homepage pricing boundary
        run: node --test tests/homepage-pricing-boundary-readback.test.mjs
