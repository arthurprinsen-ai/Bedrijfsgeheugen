name: CodeQL

on:
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

# Stable single-flight identity: newer work for the same PR/ref supersedes stale work.
# Never key concurrency by github.run_id; that defeats cancellation.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
