name: Powerhouse CodeQL

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '41 4 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  pull-requests: read

concurrency:
  group: powerhouse-codeql-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
