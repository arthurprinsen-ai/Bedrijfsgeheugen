name: Supabase PR Preview Contract

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'portal/**'
      - 'portal-next/**'
      - 'portal-v2/**'
      - 'netlify/functions/**'
      - '.github/workflows/supabase-pr-preview.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: supabase-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Prove isolated clean replay from zero
        run: |
          set -euo pipefail
          supabase --version
          test -f supabase/config.toml
          test -d supabase/migrations
          echo "PR=${{ github.event.pull_request.number }} SHA=${{ github.event.pull_request.head.sha }}"
          supabase start
          trap 'supabase stop --no-backup || true' EXIT
          supabase db reset --local
          supabase migration list --local
      - name: Contract evidence
        run: node --test tests/candidate-environment.test.mjs
