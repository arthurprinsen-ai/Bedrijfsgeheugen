name: Supabase PR Preview Contract

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'portal/**'
      - 'portal-next/**'
      - 'portal-v2/**'
      - 'netlify/functions/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  preview-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated preview credentials exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate config then migrations against PR-scoped preview
        run: |
          supabase --version
          test -d supabase/migrations
          echo "PR=${{ github.event.pull_request.number }} SHA=${{ github.event.pull_request.head.sha }}"
      - name: Contract evidence
        run: node --test tests/candidate-environment.test.mjs
