name: Prijzen hero SEO regression

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: prijzen-hero-seo-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  regression:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pricing hero and technical SEO contracts
        run: node --test tests/prijzen-hero-seo.test.mjs tests/technical-seo-gate.test.mjs
