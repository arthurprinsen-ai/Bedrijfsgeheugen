name: Prijzen hero SEO regression

on:
  push:
    branches:
      - fix/prijzen-hero-seo-gate-20260905
  pull_request:
    paths:
      - 'tools/site-shell/**'
      - 'tools/*seo*.mjs'
      - 'tools/prijzen-uit-de-homepage.mjs'
      - 'tests/prijzen-hero-seo.test.mjs'
      - 'tests/technical-seo-gate.test.mjs'
      - '.github/workflows/prijzen-hero-seo-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pricing hero and technical SEO contracts
        run: node --test tests/prijzen-hero-seo.test.mjs tests/technical-seo-gate.test.mjs
