name: Portal parity gate

on:
  pull_request:
    paths:
      - 'klantportaal.html'
      - '.github/scripts/portal_parity.py'
      - 'docs/parity/portal-parity-ledger.md'
  push:
    branches: [main]
    paths:
      - 'klantportaal.html'
      - '.github/scripts/portal_parity.py'
      - 'docs/parity/portal-parity-ledger.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify protected portal baseline
        run: python .github/scripts/portal_parity.py
