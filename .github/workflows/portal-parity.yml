name: Portal parity gate

on:
  pull_request:
    paths:
      - 'klantportaal.html'
      - 'portal/**'
      - 'portal-v2/**'
      - '.github/scripts/portal_parity.py'
      - 'portal-v2/legacy-functional-inventory.js'
      - 'portal-v2/parity-manifest.js'
      - 'portal-v2/parity-gate.js'
      - 'portal-v2/modular-legacy-capability-map.js'
      - 'portal-v2/page-registry.js'
      - 'portal-v2/tests/legacy-functional-inventory.test.mjs'
      - 'portal-v2/tests/parity-gate.test.mjs'
      - 'tests/portal-parity-source-contract.py'
      - 'tests/portal-modular-legacy-capability-parity.test.mjs'
      - '.github/workflows/portal-parity.yml'
      - 'docs/parity/portal-parity-ledger.md'
  push:
    branches: [main]
    paths:
      - 'klantportaal.html'
      - 'portal/**'
      - 'portal-v2/**'
      - '.github/scripts/portal_parity.py'
      - 'portal-v2/legacy-functional-inventory.js'
      - 'portal-v2/parity-manifest.js'
      - 'portal-v2/parity-gate.js'
      - 'portal-v2/modular-legacy-capability-map.js'
      - 'portal-v2/page-registry.js'
      - 'portal-v2/tests/legacy-functional-inventory.test.mjs'
      - 'portal-v2/tests/parity-gate.test.mjs'
      - 'tests/portal-parity-source-contract.py'
      - 'tests/portal-modular-legacy-capability-parity.test.mjs'
      - '.github/workflows/portal-parity.yml'
      - 'docs/parity/portal-parity-ledger.md'
  workflow_dispatch:

concurrency:
  group: portal-parity-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-derived parity guard self-tests
        run: python -m unittest tests/portal-parity-source-contract.py -v
      - name: Verify protected legacy and V2 functional baseline
        run: python .github/scripts/portal_parity.py
      - name: Verify modular legacy capability destinations
        run: node --test tests/portal-modular-legacy-capability-parity.test.mjs
