name: Portal parity gate
on:
  push:
    branches: [main]
    paths: ['klantportaal.html','.github/scripts/portal_parity.py','docs/parity/portal-parity-ledger.md']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python .github/scripts/portal_parity.py
