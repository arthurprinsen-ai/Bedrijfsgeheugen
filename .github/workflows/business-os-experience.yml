name: Business OS Experience
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  experience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: node --test tests/portal-next-shell.test.mjs tests/intelligence-agent-runtime.test.mjs tests/policy-engine.test.mjs tests/trust-*.test.mjs tests/canonical-*.test.mjs tests/source-adapters.test.mjs tests/read-models.test.mjs tests/foundation-registry-eventstore.test.mjs
      - run: python3 .github/scripts/portal_parity.py
