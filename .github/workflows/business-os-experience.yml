name: Business OS Experience

on:
  pull_request:
    paths:
      - 'portal-next/**'
      - 'tests/portal-next-shell.test.mjs'
      - '.github/workflows/business-os-experience.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Portal next shell contract
        run: node --test tests/portal-next-shell.test.mjs
      - name: Intelligence layer remains green
        run: node --test tests/intelligence-agent-runtime.test.mjs
      - name: Trust layer remains green
        run: node --test tests/policy-engine.test.mjs tests/trust-*.test.mjs
      - name: Foundation remains green
        run: node --test tests/canonical-*.test.mjs tests/source-adapters.test.mjs tests/read-models.test.mjs tests/foundation-registry-eventstore.test.mjs
      - name: Legacy portal parity remains green
        run: python3 .github/scripts/portal_parity.py
