name: Repository Writer Gate Dispatch

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Candidate PR number'
        required: true
        type: string
      base_sha:
        description: 'Immutable PR base SHA'
        required: true
        type: string
      head_sha:
        description: 'Immutable candidate head SHA'
        required: true
        type: string
      candidate_branch:
        description: 'Immutable candidate branch'
        required: true
        type: string
      verification_only:
        description: 'Preserve non-production verification mode through Unified Brain'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  actions: write
  checks: read

concurrency:
  group: repo-writer-gates-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable PR identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          actual_base="$(jq -r '.base.sha' <<<"$pr")"
          actual_head="$(jq -r '.head.sha' <<<"$pr")"
          actual_ref="$(jq -r '.head.ref' <<<"$pr")"
          [ "$actual_base" = "$BASE_SHA" ] || { echo "::error::PR_BASE_SHA_DRIFT:$BASE_SHA:$actual_base"; exit 1; }
          [ "$actual_head" = "$HEAD_SHA" ] || { echo "::error::PR_HEAD_SHA_DRIFT:$HEAD_SHA:$actual_head"; exit 1; }
          [ "$actual_ref" = "$CANDIDATE_BRANCH" ] || { echo "::error::PR_HEAD_REF_DRIFT:$CANDIDATE_BRANCH:$actual_ref"; exit 1; }

  shared-memory:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Shared memory and writer contract regressions
        run: |
          node --test tests/shared-agent-*.test.mjs tests/repo-writer-*.test.mjs tests/brain-writer-event-driven-gates.test.mjs

  brain-foundation:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Brain foundation verification
        run: node scripts/brain/test-all.mjs

  v18-and-writer-operational:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: V18 authoritative promotion verification
        run: >-
          node --test
          tests/v18-production-promotion.test.mjs
          tests/v18-seo-layer.test.mjs
          tests/site-baseline-guardian.test.mjs
          tests/portal-server-state.test.mjs
          tests/portal-projection-layers.test.mjs
          tests/canonical-portal-projector.test.mjs
          tests/portal-question-handler.test.mjs
          tests/portal-production-contract.test.mjs
          tests/portal-data-adapter.test.mjs
          tests/portal-legacy-state.test.mjs
          tests/portal-native-legacy-batch-1.test.mjs
          tests/portal-native-legacy-batch-2.test.mjs
          tests/portal-native-legacy-batch-3.test.mjs
      - name: Writer operational regressions
        run: node --test tests/repo-writer-operational-harness.test.mjs tests/repo-writer-shadow.test.mjs

  required-test:
    needs: [validate, shared-memory, brain-foundation, v18-and-writer-operational]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch and prove canonical Required test on exact writer head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
        run: |
          set -euo pipefail
          gh workflow run required-test.yml --repo "$GITHUB_REPOSITORY" --ref "$CANDIDATE_BRANCH"

          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow required-test.yml \
              --branch "$CANDIDATE_BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" \
              | head -n 1)"
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo "::error::REQUIRED_TEST_RUN_NOT_FOUND:$HEAD_SHA:$CANDIDATE_BRANCH"; exit 1; }

          actual_head="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          [ "$actual_head" = "$HEAD_SHA" ] || { echo "::error::REQUIRED_TEST_HEAD_SHA_DRIFT:$HEAD_SHA:$actual_head"; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

          for attempt in $(seq 1 12); do
            if gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/$HEAD_SHA/check-runs" \
              --jq '.check_runs | any(.name == "test" and .conclusion == "success")' \
              | grep -qx true; then
              echo "REQUIRED_TEST_GREEN:$run_id:$HEAD_SHA"
              exit 0
            fi
            sleep 2
          done
          echo "::error::REQUIRED_TEST_CHECK_MISSING_OR_RED:$HEAD_SHA:$run_id"
          exit 1

  dispatch-unified:
    needs: [validate, shared-memory, brain-foundation, v18-and-writer-operational, required-test]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact candidate to Unified Brain Delivery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
          VERIFICATION_ONLY: ${{ inputs.verification_only }}
        run: |
          set -euo pipefail
          gh workflow run unified-brain-delivery.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f base_sha="$BASE_SHA" \
            -f head_sha="$HEAD_SHA" \
            -f candidate_branch="$CANDIDATE_BRANCH" \
            -f verification_only="$VERIFICATION_ONLY"
