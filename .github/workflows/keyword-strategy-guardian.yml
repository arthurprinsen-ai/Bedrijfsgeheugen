name: Keyword Strategy Guardian

on:
  pull_request:
    paths:
      - 'seo/keyword-strategy.json'
      - 'sitemap.xml'
      - 'scripts/ci/keyword_strategy_guardian.py'
      - '.github/workflows/keyword-strategy-guardian.yml'
  push:
    branches: [main]
    paths:
      - 'seo/keyword-strategy.json'
      - 'sitemap.xml'
      - 'scripts/ci/keyword_strategy_guardian.py'
      - '.github/workflows/keyword-strategy-guardian.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy:
    name: Keyword ownership and funnel contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate strategy manifest
        run: python scripts/ci/keyword_strategy_guardian.py
