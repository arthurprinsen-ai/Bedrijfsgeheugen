name: Unified Content Operations

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260914100133_unified_content_publication_operations.sql'
      - 'supabase/migrations/20260914100150_content_publication_state_truthful_timestamps.sql'
      - 'supabase/migrations/20260914100205_content_publication_reconciliation.sql'
      - 'supabase/migrations/20260914084630_powerhouse_social_delivery_reconciliation_v1.sql'
      - 'supabase/migrations/20260915082029_content_publication_daily_watchdog_20260915101500.sql'
      - 'supabase/functions/content-operations/**'
      - 'supabase/functions/bg-dagoverzicht/**'
      - 'intern/vandaag/**'
      - 'scripts/publish_approved_blog_v2.py'
      - '.github/workflows/approved-central-blog.yml'
      - 'tests/content-growth-unified-content-operations.test.mjs'
      - '.github/workflows/unified-content-operations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260914100133_unified_content_publication_operations.sql'
      - 'supabase/migrations/20260914100150_content_publication_state_truthful_timestamps.sql'
      - 'supabase/migrations/20260914100205_content_publication_reconciliation.sql'
      - 'supabase/migrations/20260914084630_powerhouse_social_delivery_reconciliation_v1.sql'
      - 'supabase/migrations/20260915082029_content_publication_daily_watchdog_20260915101500.sql'
      - 'supabase/functions/content-operations/**'
      - 'supabase/functions/bg-dagoverzicht/**'
      - 'intern/vandaag/**'
      - 'scripts/publish_approved_blog_v2.py'
      - '.github/workflows/approved-central-blog.yml'
      - 'tests/content-growth-unified-content-operations.test.mjs'
      - '.github/workflows/unified-content-operations.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Unified calendar and publication contract
        run: node --test tests/content-growth-unified-content-operations.test.mjs
      - name: Python publisher syntax
        run: python3 -m py_compile scripts/publish_approved_blog_v2.py
