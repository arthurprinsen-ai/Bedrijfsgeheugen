name: Buffer Social Learning

on:
  pull_request:
    paths:
      - 'netlify/functions/_buffer-social-collector.mjs'
      - 'netlify/functions/buffer-social-collect.mjs'
      - 'platform/social-channel-identity-gate.mjs'
      - 'config/social-channel-identity-contract.json'
      - 'supabase/migrations/*content_calendar_learning_chain.sql'
      - 'supabase/functions/powerhouse-social-publisher/index.ts'
      - 'tests/social-learning-buffer-*.test.mjs'
      - '.github/workflows/buffer-social-learning.yml'
  push:
    branches: [main]
    paths:
      - 'netlify/functions/_buffer-social-collector.mjs'
      - 'netlify/functions/buffer-social-collect.mjs'
      - 'platform/social-channel-identity-gate.mjs'
      - 'config/social-channel-identity-contract.json'
      - 'supabase/migrations/*content_calendar_learning_chain.sql'
      - 'supabase/functions/powerhouse-social-publisher/index.ts'
      - 'tests/social-learning-buffer-*.test.mjs'
      - '.github/workflows/buffer-social-learning.yml'

permissions:
  contents: read

jobs:
  buffer-social-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify Buffer-first collector and publish identity contracts
        run: node --test tests/social-learning-buffer-collector.test.mjs tests/social-learning-buffer-schedule.test.mjs tests/social-learning-buffer-content-chain.test.mjs tests/social-learning-buffer-channel-identity-gate.test.mjs tests/social-learning-buffer-instagram-media-gate.test.mjs tests/social-learning-buffer-delivery-guarantee-regression.test.mjs tests/social-learning-buffer-rate-limit-regression.test.mjs
