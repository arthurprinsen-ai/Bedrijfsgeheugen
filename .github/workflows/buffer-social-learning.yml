name: Buffer Social Learning

on:
  pull_request:
    paths:
      - 'netlify/functions/_buffer-social-collector.mjs'
      - 'netlify/functions/buffer-social-collect.mjs'
      - 'tests/social-learning-buffer-*.test.mjs'
      - '.github/workflows/buffer-social-learning.yml'
  push:
    branches: [main]
    paths:
      - 'netlify/functions/_buffer-social-collector.mjs'
      - 'netlify/functions/buffer-social-collect.mjs'
      - 'tests/social-learning-buffer-*.test.mjs'
      - '.github/workflows/buffer-social-learning.yml'

permissions:
  contents: read

jobs:
  buffer-social-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify Buffer-first collector contracts
        run: node --test tests/social-learning-buffer-collector.test.mjs tests/social-learning-buffer-schedule.test.mjs
