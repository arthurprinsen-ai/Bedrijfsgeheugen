name: Portal release lane

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string

jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify portal production contracts
        run: node --test tests/portal-*.test.mjs tests/connector-*.test.mjs tests/customer-portal-routing.test.mjs tests/portal-production-contract.test.mjs tests/canonical-portal-projector.test.mjs
      - name: Verify protected portal parity baseline
        run: python .github/scripts/portal_parity.py
