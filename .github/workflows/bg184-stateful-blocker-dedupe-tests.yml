name: BG184 Stateful Blocker Dedupe Tests

on:
  push:
    branches: [main]
    paths:
      - 'tests/brain-bg184-stateful-blocker-dedupe.test.mjs'
      - 'config/bg184-stateful-blocker-dedupe.json'
      - 'brain/learning/incidents/bg184-repeated-known-blocker-dispatch-2026-08-30.json'
      - '.github/workflows/bg184-stateful-blocker-dedupe-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stateful-blocker-dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/brain-bg184-stateful-blocker-dedupe.test.mjs
