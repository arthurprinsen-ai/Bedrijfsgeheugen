name: Supabase Production Baseline Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-production-baseline-capture.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: supabase-production-baseline-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
      TARGET_PR: '3757'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fail closed unless production CLI credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::SUPABASE_ACCESS_TOKEN missing"; exit 78; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "::error::PRODUCTION_DB_PASSWORD missing"; exit 78; }
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "::error::PRODUCTION_PROJECT_ID missing"; exit 78; }
          test "$SUPABASE_PROJECT_ID" = "adhjwmvyoixzjtmiroln" || {
            echo "::error::Unexpected production project ref: $SUPABASE_PROJECT_ID"
            exit 78
          }

      - name: Resolve live recovery candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          state="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.state||""))' "$pr_json")"
          merged="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(Boolean(x.merged)))' "$pr_json")"
          head_ref="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.head?.ref||""))' "$pr_json")"
          head_sha="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.head?.sha||""))' "$pr_json")"
          test "$state" = "open" || { echo "::error::PR #$TARGET_PR is not open"; exit 78; }
          test "$merged" = "false" || { echo "::error::PR #$TARGET_PR is already merged"; exit 78; }
          test "$head_ref" = "fix/supabase-migration-history-parity-v3" || {
            echo "::error::Unexpected recovery branch: $head_ref"
            exit 78
          }
          test -n "$head_sha"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Capture official production baseline with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bg3742-baseline
          mkdir -p /tmp/bg3742-baseline

          supabase link --project-ref "$SUPABASE_PROJECT_ID"

          supabase db dump --linked -f /tmp/bg3742-baseline/schema.sql
          supabase db dump --linked -f /tmp/bg3742-baseline/roles.sql --role-only
          supabase db dump --linked -f /tmp/bg3742-baseline/history-schema.sql --schema supabase_migrations
          supabase db dump --linked -f /tmp/bg3742-baseline/history-data.sql --use-copy --data-only --schema supabase_migrations
          supabase migration list --linked > /tmp/bg3742-baseline/migration-list.txt

          test -s /tmp/bg3742-baseline/schema.sql
          test -s /tmp/bg3742-baseline/history-schema.sql
          test -s /tmp/bg3742-baseline/history-data.sql
          test -s /tmp/bg3742-baseline/migration-list.txt

          sha256sum /tmp/bg3742-baseline/schema.sql                     /tmp/bg3742-baseline/roles.sql                     /tmp/bg3742-baseline/history-schema.sql                     /tmp/bg3742-baseline/history-data.sql                     /tmp/bg3742-baseline/migration-list.txt             > /tmp/bg3742-baseline/SHA256SUMS

          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const sums=(await readFile('/tmp/bg3742-baseline/SHA256SUMS','utf8'))
            .trim().split(/\r?\n/).filter(Boolean)
            .map(line => {
              const [sha256, file] = line.trim().split(/\s+/, 2);
              return { sha256, file: file.replace('/tmp/bg3742-baseline/','') };
            });
          const manifest={
            contract:'supabase-production-baseline-v1',
            obligation_issue:3742,
            source:'official-supabase-cli',
            project_ref:process.env.SUPABASE_PROJECT_ID,
            captured_from_main_sha:process.env.GITHUB_SHA,
            candidate_pr:Number(process.env.TARGET_PR),
            candidate_head_sha:process.env.CANDIDATE_HEAD_SHA,
            captured_at:new Date().toISOString(),
            files:sums,
            commands:[
              'supabase db dump --linked',
              'supabase db dump --linked --role-only',
              'supabase db dump --linked --schema supabase_migrations',
              'supabase db dump --linked --data-only --schema supabase_migrations',
              'supabase migration list --linked'
            ],
            hand_built_catalog_dump:false,
            production_write:false
          };
          await writeFile('/tmp/bg3742-baseline/manifest.json', JSON.stringify(manifest,null,2)+'\n');
          NODE
        env:
          CANDIDATE_HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}

      - name: Write immutable baseline to exact recovery branch head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.candidate.outputs.head_ref }}
          EXPECTED_HEAD: ${{ steps.candidate.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$TARGET_BRANCH"
          observed="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$observed" = "$EXPECTED_HEAD" || {
            echo "::error::Recovery branch moved before baseline write: expected=$EXPECTED_HEAD observed=$observed"
            exit 78
          }

          git checkout -B "$TARGET_BRANCH" "$EXPECTED_HEAD"
          mkdir -p supabase/production-baseline
          cp /tmp/bg3742-baseline/schema.sql supabase/production-baseline/schema.sql
          cp /tmp/bg3742-baseline/roles.sql supabase/production-baseline/roles.sql
          cp /tmp/bg3742-baseline/history-schema.sql supabase/production-baseline/history-schema.sql
          cp /tmp/bg3742-baseline/history-data.sql supabase/production-baseline/history-data.sql
          cp /tmp/bg3742-baseline/migration-list.txt supabase/production-baseline/migration-list.txt
          cp /tmp/bg3742-baseline/SHA256SUMS supabase/production-baseline/SHA256SUMS
          cp /tmp/bg3742-baseline/manifest.json supabase/production-baseline/manifest.json

          git add supabase/production-baseline
          git diff --cached --quiet && {
            echo "::error::Official baseline produced no repository delta"
            exit 78
          }
          git commit -m "Capture official Supabase production baseline for #3742"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Record provider evidence on recovery PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          new_head="$(git rev-parse HEAD)"
          schema_sha="$(sha256sum supabase/production-baseline/schema.sql | awk '{print $1}')"
          history_sha="$(sha256sum supabase/production-baseline/history-data.sql | awk '{print $1}')"
          gh pr comment "$TARGET_PR" --body "Official production baseline captured by trusted default-branch workflow. Source: Supabase CLI db dump + migration list. Candidate advanced from \`${{ steps.candidate.outputs.head_sha }}\` to \`$new_head\`. schema.sql SHA-256: \`$schema_sha\`; migration-history data SHA-256: \`$history_sha\`. This is baseline evidence only: #3742 remains fail-closed until fresh replay, exact-head gates, protected merge, and post-merge production readback are green."
