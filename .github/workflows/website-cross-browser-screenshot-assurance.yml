name: Website Cross-Browser Screenshot Assurance

on:
  pull_request:
    paths:
      - '*.html'
      - 'netlify.toml'
      - '_redirects'
      - '_headers'
      - 'assets/**'
      - 'blog/**'
      - 'en/**'
      - 'kennis/**'
      - 'site/**'
      - 'config/powerhouse-website-cross-browser-assurance-v1.json'
      - 'tools/site-shell/**'
      - '.github/workflows/website-cross-browser-screenshot-assurance.yml'
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Contract regression
        run: node --test tests/brain-website-cross-browser-screenshot-assurance-v1.test.mjs
      - name: Install Playwright engines
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Resolve candidate browser target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base_url=https://deploy-preview-${PR_NUMBER}--bedrijfsgeheugen.netlify.app" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://www.bedrijfsgeheugen.nl" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for exact candidate preview
        if: github.event_name == 'pull_request'
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 60); do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' "$BASE_URL/" || true)"
            release="$(curl -L -sS "$BASE_URL/release.json" || true)"
            actual_sha="$(printf '%s' "$release" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);process.stdout.write(j.commit_ref||j.commit||j.sha||'')}catch{}})")"
            if [ "$code" = "200" ] && [ "$actual_sha" = "$EXPECTED_SHA" ]; then
              echo "Exact candidate preview is reachable: $actual_sha"
              exit 0
            fi
            echo "Waiting for exact candidate: http=$code actual=$actual_sha expected=$EXPECTED_SHA"
            sleep 5
          done
          echo "::error::Exact candidate preview SHA did not become reachable."
          exit 1
      - name: Run cross-browser screenshot assurance
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          WEBSITE_ASSURANCE_CONTRACT: config/powerhouse-website-cross-browser-assurance-v1.json
          OUT_DIR: .artifacts/website-cross-browser-assurance
          ASSURANCE_MODE: ${{ github.event_name == 'schedule' && 'daily' || 'pr' }}
        run: node tools/site-shell/website-cross-browser-assurance.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-cross-browser-assurance-${{ github.run_id }}
          path: .artifacts/website-cross-browser-assurance
          if-no-files-found: error
          retention-days: 30
