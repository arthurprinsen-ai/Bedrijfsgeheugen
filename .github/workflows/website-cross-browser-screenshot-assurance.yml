name: Website Cross-Browser Screenshot Assurance

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser-screenshots:
    runs-on: ubuntu-24.04 # Trusted site browser assurance on existing original GitHub lane
    # Official version-pinned Playwright image already includes chromium firefox webkit
    # browser executables AND OS packages. Do not apt-install 181 packages each run.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 30
    # GitHub jobs.container defaults to POSIX sh; original installer uses
    # set -euo pipefail and therefore requires bash. Incident run #42060526184.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Contract regression
        run: |
          node --test tests/brain-website-cross-browser-screenshot-assurance-v1.test.mjs tests/brain-mobile-cls-repeatability-20261023.test.mjs
      - name: Install Playwright engines
        id: install
        run: |
          set -euo pipefail
          # Exact Playwright v1.55.0 Noble container includes all three browsers
          # and OS dependencies. Run #42054614527 spent 30m apt-installing 181
          # packages and was cancelled; do not repeat that unbounded network job.
          # This screenshot-only workflow never invokes root ffmpeg-static.
          npm install --no-save --ignore-scripts playwright@1.55.0
          # Fail closed unless all three real browser executables are present.
          node --input-type=module -e "import { chromium, firefox, webkit } from 'playwright'; import { existsSync } from 'node:fs'; for(const engine of [chromium,firefox,webkit]) { const path=engine.executablePath(); if(!existsSync(path)) throw new Error('BROWSER_BINARY_MISSING:'+engine.name()); console.log('BROWSER_BINARY_PRESENT:'+engine.name()); }"
      - name: Preserve browser installer incident evidence
        if: failure() && steps.install.outcome == 'failure'
        run: |
          mkdir -p .artifacts/website-cross-browser-assurance
          printf '%s\n' '{"fingerprint":"ci|cross-browser|ffmpeg-static-postinstall-http-504|20261105-v1","status":"INSTALL_FAILED","owner":"existing website cross-browser assurance","run_id":"${{ github.run_id }}","release_claim":"NOT_VERIFIED","evidence":"GitHub Actions installer log"}' > .artifacts/website-cross-browser-assurance/ci-install-error.json
          echo "::error::CROSS_BROWSER_DEPENDENCY_INSTALL_FAILED: browser proof unavailable; original job failed, no green claim"
          echo "Browser installation failed; original production/PR acceptance is not verified. Incident: https://github.com/arthurprinsen-ai/Bedrijfsgeheugen/issues/4447" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve candidate browser target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base_url=https://deploy-preview-${PR_NUMBER}--bedrijfsgeheugen.netlify.app" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://www.bedrijfsgeheugen.nl" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for exact candidate preview
        if: github.event_name == 'pull_request'
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          for attempt in $(seq 1 48); do
            ready=1
            for route in / /sitemap.xml /afmaakindex /ai-adoptie /ai-modelwijzer; do
              code="$(curl -L -sS -o /dev/null -w '%{http_code}' "$BASE_URL$route" || true)"
              if [ "$code" != "200" ]; then ready=0; break; fi
            done
            if [ "$ready" = "1" ]; then
              echo "Exact candidate preview, sitemap and representative generated routes are reachable."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Exact candidate preview did not become fully route-ready."
          exit 1
      - name: Run cross-browser screenshot assurance
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          WEBSITE_ASSURANCE_CONTRACT: config/powerhouse-website-cross-browser-assurance-v1.json
          OUT_DIR: .artifacts/website-cross-browser-assurance
          ASSURANCE_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'daily' || 'pr' }}
        run: node tools/site-shell/website-cross-browser-assurance.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-cross-browser-assurance-${{ github.run_id }}
          path: .artifacts/website-cross-browser-assurance
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
