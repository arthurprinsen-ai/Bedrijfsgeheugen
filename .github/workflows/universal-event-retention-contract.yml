name: Universal Event Retention Contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Universal event, failure learning, retention, adapter and producer-contract tests
        run: node --test tests/universal-event-envelope.test.mjs tests/universal-failure-learning.test.mjs tests/event-retention-policy.test.mjs tests/event-retention-expiry.test.mjs tests/universal-event-contract-check.test.mjs tests/universal-event-adapters.test.mjs
