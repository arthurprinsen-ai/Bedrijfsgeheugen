name: Chat learning preflight PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'config/brain-chat-learning-contract.json'
      - 'config/chat-learning-completeness-guard.json'
      - 'scripts/brain/chat-learning-preflight.mjs'
      - 'tests/chat-learning-*.test.mjs'
      - 'tests/chat-to-brain-*.test.mjs'
      - '.github/workflows/chat-learning-preflight-pr.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Mandatory chat-learning preflight
        run: node scripts/brain/chat-learning-preflight.mjs
