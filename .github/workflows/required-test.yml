name: Required test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: required-test-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  statuses: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      portal: ${{ steps.scope.outputs.portal }}
      website: ${{ steps.scope.outputs.website }}
      automation: ${{ steps.scope.outputs.automation }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      pr_number: ${{ steps.scope.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Block unjustified moving-main successor rebuilds
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/brain/moving-main-successor-guard.mjs
      - name: Mandatory chat-learning preflight
        run: node scripts/brain/chat-learning-preflight.mjs
      - id: scope
        name: Classify independent delivery lanes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, appendFile } from 'node:fs/promises';
          import { createDeliveryPlan } from './tools/brain-delivery-system.mjs';
          import { deriveRequiredTestSuites } from './tools/delivery-required-test-suites.mjs';
          const head=process.env.HEAD_SHA || execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const base=process.env.BASE_SHA || execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changedPaths=execFileSync('git',['diff','--name-only',`${base}...${head}`],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean);
          const policy=JSON.parse(await readFile('config/brain-delivery-system.json','utf8'));
          const plan=createDeliveryPlan({changedPaths,headSha:head,policy});
          const suites=deriveRequiredTestSuites({lanes:plan.lanes.map(lane=>lane.id)});
          for(const lane of ['backend','portal','website','automation']) await appendFile(process.env.GITHUB_OUTPUT,`${lane}=${suites[lane]}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`base_sha=${base}\nhead_sha=${head}\npr_number=${process.env.PR_NUMBER || process.env.GITHUB_RUN_ID || '0'}\n`);
          console.log(JSON.stringify({changedPaths,lanes:plan.lanes.map(lane=>lane.id),suites},null,2));
          NODE
      - name: Verify composable release control plane
        run: >-
          node --test
          tests/brain-change-scoped-release-lanes.test.mjs
          tests/brain-moving-main-successor-guard.test.mjs
          tests/brain-composable-release-control-plane.test.mjs
          tests/ci-workflow-topology.test.mjs
          tests/ci-learning-gate-routing.test.mjs
          tests/ci-website-gate-routing.test.mjs
          tests/ci-v18-promotion-routing.test.mjs
          tests/ci-required-status-contract.test.mjs
          tests/ci-queue-health.test.mjs

  backend:
    needs: preflight
    if: needs.preflight.outputs.backend == 'true'
    uses: ./.github/workflows/lane-backend.yml
    with:
      head_sha: ${{ needs.preflight.outputs.head_sha }}

  portal:
    needs: preflight
    if: needs.preflight.outputs.portal == 'true'
    uses: ./.github/workflows/lane-portal.yml
    with:
      head_sha: ${{ needs.preflight.outputs.head_sha }}

  automation:
    needs: preflight
    if: needs.preflight.outputs.automation == 'true'
    uses: ./.github/workflows/lane-automation.yml
    with:
      head_sha: ${{ needs.preflight.outputs.head_sha }}

  website:
    needs: preflight
    if: needs.preflight.outputs.website == 'true'
    uses: ./.github/workflows/lane-website.yml
    with:
      base_sha: ${{ needs.preflight.outputs.base_sha }}
      head_sha: ${{ needs.preflight.outputs.head_sha }}
      pr_number: ${{ needs.preflight.outputs.pr_number }}

  test:
    name: test
    if: always()
    needs: [preflight, backend, portal, automation, website]
    runs-on: ubuntu-latest
    env:
      PREFLIGHT: ${{ needs.preflight.result }}
      SELECT_BACKEND: ${{ needs.preflight.outputs.backend }}
      SELECT_PORTAL: ${{ needs.preflight.outputs.portal }}
      SELECT_AUTOMATION: ${{ needs.preflight.outputs.automation }}
      SELECT_WEBSITE: ${{ needs.preflight.outputs.website }}
      BACKEND: ${{ needs.backend.result }}
      PORTAL: ${{ needs.portal.result }}
      AUTOMATION: ${{ needs.automation.result }}
      WEBSITE: ${{ needs.website.result }}
    steps:
      - name: Aggregate only selected lane results
        run: |
          set -euo pipefail
          test "$PREFLIGHT" = success
          [ "$SELECT_BACKEND" != true ] || [ "$BACKEND" = success ]
          [ "$SELECT_PORTAL" != true ] || [ "$PORTAL" = success ]
          [ "$SELECT_AUTOMATION" != true ] || [ "$AUTOMATION" = success ]
          [ "$SELECT_WEBSITE" != true ] || [ "$WEBSITE" = success ]
          echo "Selected release lanes are green."
