name: Required test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run required Brain, delivery and UI regression contracts
        run: >-
          node --test
          tests/brain-adapter-conformance.test.mjs
          tests/brain-platform-adapters.test.mjs
          tests/universal-event-envelope.test.mjs
          tests/event-retention-policy.test.mjs
          tests/event-retention-expiry.test.mjs
          tests/universal-event-contract-check.test.mjs
          tests/universal-event-adapters.test.mjs
          tests/universal-failure-learning.test.mjs
          tests/make-cost-governor-policy.test.mjs
          tests/make-cost-governance-contract.test.mjs
          tests/v18-vergelijker.test.mjs
      - name: Run required interaction static contracts
        run: >-
          node --test
          tests/interaction-contract-registry.test.mjs
          tests/interaction-final-build-wiring.test.mjs
          tests/interaction-browser-helpers.test.mjs
          tests/interaction-quality-workflow.test.mjs
          tests/interaction-production-readback-workflow.test.mjs
          tests/interaction-required-gate-contract.test.mjs
          tests/seo-homepage-scroll-story-interaction.test.mjs
          tests/seo-homepage-platform-expertise-toggle.test.mjs
      - name: Wait for Netlify deploy preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 36); do
            json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status")
            state=$(printf '%s' "$json" | jq -r '.statuses[] | select(.context == "netlify/bedrijfsgeheugen/deploy-preview") | .state' | head -n1)
            if [ "$state" = "success" ]; then exit 0; fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "::error::Netlify preview failed for $HEAD_SHA: $state"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Netlify deploy preview for $HEAD_SHA"
          exit 1
      - name: Install Playwright runtime and Chromium
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run required interaction browser contracts
        if: github.event_name == 'pull_request'
        env:
          BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: npx playwright test tests/integration/interaction-quality-gate.spec.js --workers=1 --reporter=line
      - name: Upload required interaction diagnostics
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: required-interaction-test-artifacts
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: warn
