name: Required test

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: required-test-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: classify release scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      portal: ${{ steps.scope.outputs.portal }}
      website: ${{ steps.scope.outputs.website }}
      automation: ${{ steps.scope.outputs.automation }}
      tested_base: ${{ steps.scope.outputs.tested_base }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      browser_profile: ${{ steps.scope.outputs.browser_profile }}
      browser_required: ${{ steps.scope.outputs.browser_required }}
      menu_browser: ${{ steps.scope.outputs.menu_browser }}
      targeted_browser: ${{ steps.scope.outputs.targeted_browser }}
      full_browser: ${{ steps.scope.outputs.full_browser }}
      routes_json: ${{ steps.scope.outputs.routes_json }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Block unjustified moving-main successor rebuilds
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/brain/moving-main-successor-guard.mjs
      - id: scope
        name: Classify lanes and browser depth
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, appendFile } from 'node:fs/promises';
          import { createDeliveryPlan } from './tools/brain-delivery-system.mjs';
          import { deriveRequiredTestSuites } from './tools/delivery-required-test-suites.mjs';
          import { classifyWebsiteReleaseRisk } from './tools/website-release-risk.mjs';
          const head=process.env.PR_HEAD_SHA||execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const base=process.env.PR_BASE_SHA||execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changedPaths=execFileSync('git',['diff','--name-only',`${base}...${head}`],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean);
          const deliveryPolicy=JSON.parse(await readFile('config/brain-delivery-system.json','utf8'));
          const riskPolicy=JSON.parse(await readFile('config/website-release-risk.json','utf8'));
          const plan=createDeliveryPlan({changedPaths,headSha:head,policy:deliveryPolicy});
          const suites=deriveRequiredTestSuites({lanes:plan.lanes.map(lane=>lane.id)});
          const risk=classifyWebsiteReleaseRisk({changedPaths,policy:riskPolicy});
          for(const [key,value] of Object.entries(suites)) await appendFile(process.env.GITHUB_OUTPUT,`${key}=${value}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`tested_base=${base}\nhead_sha=${head}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`browser_profile=${risk.profile}\nbrowser_required=${risk.requiresBrowser}\nmenu_browser=${risk.requiresMenuBrowser}\ntargeted_browser=${risk.requiresTargetedBrowser}\nfull_browser=${risk.requiresFullBrowser}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`routes_json=${JSON.stringify(risk.affectedRoutes||[])}\n`);
          console.log(JSON.stringify({changedPaths,lanes:plan.lanes.map(lane=>lane.id),suites,risk,testedBase:base,headSha:head}));
          NODE

  static:
    name: static contracts
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify shared release contracts
        run: node --test tests/brain-change-scoped-release-lanes.test.mjs tests/brain-moving-main-successor-guard.test.mjs tests/website-release-risk.test.mjs tests/release-base-guard.test.mjs tests/brain-production-release-readback.test.mjs
      - name: Verify backend contracts
        if: needs.scope.outputs.backend == 'true'
        run: node --test tests/brain-adapter-conformance.test.mjs tests/brain-platform-adapters.test.mjs tests/universal-event-envelope.test.mjs tests/universal-event-contract-check.test.mjs tests/make-cost-governance-contract.test.mjs
      - name: Verify portal contracts
        if: needs.scope.outputs.portal == 'true'
        run: node --test tests/portal-*.test.mjs tests/customer-portal-routing.test.mjs tests/portal-production-contract.test.mjs
      - name: Verify automation contracts
        if: needs.scope.outputs.automation == 'true'
        run: node --test tests/delivery-*.test.mjs tests/brain-delivery-system.test.mjs
      - name: Verify website static contracts
        if: needs.scope.outputs.website == 'true'
        run: node --test tests/v18-vergelijker.test.mjs tests/site-shell-v18-view-integrity.test.mjs tests/site-shell-public-route-inventory.test.mjs tests/seo-native-money-presentation.test.mjs tests/seo-homepage-platform-expertise-toggle.test.mjs tests/standalone-content-page-router-isolation.test.mjs tests/v18-megamenu-heading-contract.test.mjs tests/seo-homepage-context-slider-readability.test.mjs
      - name: Verify full-risk geometry contracts
        if: needs.scope.outputs.full_browser == 'true'
        run: node --test tests/seo-ui-visual-regression-contract.test.mjs tests/seo-ui-visual-regression-geometry.test.mjs

  browser:
    name: browser verification
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.browser_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Wait for exact deploy preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module - <<'NODE'
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const endpoint=`https://api.github.com/repos/${process.env.REPOSITORY}/commits/${process.env.HEAD_SHA}/status`;
          const deadline=Date.now()+6*60*1000;
          while(Date.now()<deadline){
            const response=await fetch(endpoint,{headers});
            if(!response.ok) throw new Error(`GitHub status API ${response.status}`);
            const body=await response.json();
            const status=(body.statuses||[]).find(item=>item.context==='netlify/bedrijfsgeheugen/deploy-preview');
            if(status?.state==='success') process.exit(0);
            if(['failure','error'].includes(status?.state)) throw new Error(`Netlify preview ${status.state}: ${status.description||''}`);
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          throw new Error('Timed out waiting for exact deploy preview');
          NODE
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install browser only when required
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify affected routes on desktop and mobile
        if: needs.scope.outputs.targeted_browser == 'true'
        env:
          BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
          ROUTES_JSON: ${{ needs.scope.outputs.routes_json }}
        run: node tools/verify-targeted-website-routes.mjs
      - name: Verify focused megamenu
        if: needs.scope.outputs.menu_browser == 'true' && needs.scope.outputs.full_browser != 'true'
        env:
          UI_VR_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: node tools/site-shell/v18-megamenu-browser-check.mjs
      - name: Run full website browser regression
        if: needs.scope.outputs.full_browser == 'true'
        env:
          UI_VR_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
          EXPECTED_COMMIT: ${{ needs.scope.outputs.head_sha }}
        run: |
          node --test tests/seo-ui-visual-regression-browser.test.mjs
          node tools/site-shell/v18-megamenu-browser-check.mjs
          node tools/site-shell/ui-visual-regression/browser-check.mjs
          node tools/site-shell/homepage-context-slider-browser-check.mjs
          node tools/site-shell/homepage-toggle-browser-check.mjs
          node tools/site-shell/standalone-visibility-check.mjs
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-test-browser-${{ github.event.pull_request.number }}
          path: artifacts/ui-visual-regression/
          if-no-files-found: ignore

  test:
    name: test
    needs: [scope, static, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Require selected suites to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BROWSER_REQUIRED: ${{ needs.scope.outputs.browser_required }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$STATIC_RESULT" = success
          if [ "$BROWSER_REQUIRED" = true ]; then test "$BROWSER_RESULT" = success; fi
      - name: Keep green evidence only across non-overlapping main drift
        if: github.event_name == 'pull_request'
        env:
          TESTED_BASE_SHA: ${{ needs.scope.outputs.tested_base }}
          HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
        run: |
          git fetch origin main --no-tags
          export CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { deriveConflictContracts, evaluateBranchDrift } from './tools/brain-delivery-system.mjs';
          import { evaluateReleaseBase } from './tools/release-base-guard.mjs';
          const base=process.env.TESTED_BASE_SHA;
          const head=process.env.HEAD_SHA;
          const current=process.env.CURRENT_MAIN_SHA;
          let drift={action:'KEEP_TESTED_FEATURE',reason:'main-unchanged',overlap:[],contractOverlap:[]};
          if(base!==current){
            const featurePaths=execFileSync('git',['diff','--name-only',`${base}...${head}`],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean);
            const mainDriftPaths=execFileSync('git',['diff','--name-only',`${base}..${current}`],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean);
            const policy=JSON.parse(readFileSync('config/brain-delivery-system.json','utf8'));
            drift=evaluateBranchDrift({featurePaths,mainDriftPaths,featureContracts:deriveConflictContracts(featurePaths,policy),mainDriftContracts:deriveConflictContracts(mainDriftPaths,policy),mergeable:true});
          }
          const release=evaluateReleaseBase({testedBaseSha:base,currentMainSha:current,headSha:head,driftAction:drift.action});
          console.log(JSON.stringify({release,drift}));
          if(!release.ok) process.exit(1);
          NODE
      - name: Release evidence summary
        run: |
          echo "head=${{ needs.scope.outputs.head_sha }}"
          echo "tested_base=${{ needs.scope.outputs.tested_base }}"
          echo "browser_profile=${{ needs.scope.outputs.browser_profile }}"
