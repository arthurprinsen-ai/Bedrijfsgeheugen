      - name: Verify Autonomous Engineering Fabric v3 authority contract
        if: steps.integration.outputs.full_shared_suite == 'true'
        run: node scripts/brain/autonomous-engineering-fabric-v3.mjs --check


  merge_specialist:
    name: Merge specialist assurance
    needs: preflight
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
