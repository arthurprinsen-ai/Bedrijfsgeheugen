  merge_specialist_node24:
    if: github.event_name == 'merge_group'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run Node 24 specialist assurance
        run: |
          node tools/site-shell/test-shell-components.mjs
          node --test tests/site-shell-compare-slider-physical-edges.test.mjs
          node --test tests/content-growth-*.test.mjs
          node --test tests/portal-native-legacy-batch-*.test.mjs
          node tools/content-growth/validate-policy.mjs
          node --test tests/brain-linkedin-company-growth-engine-v1.test.mjs
          node --test tests/seo-growth-*.test.mjs tests/seo-order-*.test.mjs tests/seo-locale-revenue-*.test.mjs
          node --test tests/revenue-content-intelligence.test.mjs
          node -e "for (const p of ['brain/creative/learning-dimensions.json','brain/contracts/revenue-content-experiment.schema.json','config/social-learning-engine.json','data/revenue-content-experiment-policy.json']) JSON.parse(require('fs').readFileSync(p,'utf8'));"
          node tools/content-growth/seed-revenue-content-experiments.mjs /tmp/revenue-content-experiment-calendar.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/revenue-content-experiment-calendar.json')); if(x.count!==111||x.calendar.at(-1).date!=='2026-12-31') process.exit(1);"


  netlify_build_parity:
    needs: preflight
    if: needs.preflight.outputs.netlify_build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install exact Netlify build dependencies
        run: npm install --prefer-offline --no-audit --no-fund --silent
      - name: Run exact Netlify production build command once
        env:
          COMMIT_REF: ${{ needs.preflight.outputs.change_head_sha }}
          CONTEXT: production
          DEPLOY_ID: required-netlify-build-parity
          STATIC_I18N_NETWORK: '0'
          STATIC_I18N_REQUIRE_CACHE: '1'
          STATIC_I18N_CONCURRENCY: '1'
        run: |
          set -euo pipefail
          node tools/site-shell/pricing-build-integrity.mjs capture
          node tools/site-shell/bedrijfslek-build-integrity.mjs capture
          node tools/bouw-powerhouse-auth.mjs
          node tools/bouw-kennisindex.mjs
          node tools/bouw-v18-production.mjs
          node tools/site-shell/apply-product-led-home.mjs
          node tools/apply-tabbladen.mjs
          node tools/bouw-v18-views.mjs
          node tools/bouw-v18-chrome-alles.mjs
          node tools/prijzen-uit-de-homepage.mjs
          node tools/normaliseer-site-ui.mjs
          node tools/site-shell/pricing-build-integrity.mjs restore
          node tools/site-shell/bedrijfslek-build-integrity.mjs restore
          node tools/seo-order-engine/apply.mjs
          node tools/seo-order-engine/validate.mjs
          node tools/site-shell/apply-i18n.mjs
          node tools/site-shell/build-localized-routes.mjs
          node tools/site-shell/apply-commercial-pricing-v1.mjs
          node tools/seo-order-engine/apply-revenue-links.mjs
          node tools/site-shell/finalize-website-coherence-v1.mjs
          node tools/site-shell/apply-cms-runtime.mjs
          node tools/genereer-sitemap.mjs
          node tools/seo-order-engine/validate-locales.mjs
          node tools/bouw-release-evidence.mjs
      - name: Verify built artifact contracts
        run: node --test tests/tabbladen.test.mjs tests/brain-bedrijfslek-product-led-acquisition-v1.test.mjs


  supabase_preview:
    needs: preflight
    if: needs.preflight.outputs.supabase_preview_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Validate canonical Supabase source and migration security contract
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          HEAD_SHA: ${{ needs.preflight.outputs.change_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/config.toml
          test -d supabase/migrations
          python3 - <<'PY'
          from pathlib import Path
          import re, tomllib
          root=Path('supabase')
          config=tomllib.loads((root/'config.toml').read_text(encoding='utf-8'))
          assert str(config.get('project_id','')).strip(), 'supabase/config.toml project_id is required'
          for name,function in sorted((config.get('functions') or {}).items()):
              assert isinstance(function,dict), f'functions.{name} must be a table'
              entrypoint=function.get('entrypoint')
              if entrypoint:
                  target=root/str(entrypoint).removeprefix('./')
                  assert target.is_file(), f'functions.{name}.entrypoint does not exist: {target}'
          versions={}; malformed=[]; empty=[]
          for path in sorted((root/'migrations').glob('*.sql')):
              match=re.match(r'^(\d{14})_(.+)\.sql        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.preflight.outputs.change_head_sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          stable_provider_success_id=""
          for attempt in $(seq 1 48); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              > /tmp/supabase-preview-check-runs.json

            state="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload=JSON.parse(readFileSync('/tmp/supabase-preview-check-runs.json','utf8'));
          const checks=Array.isArray(payload.check_runs)?payload.check_runs:[];
          const provider=checks.filter(c => c?.name==='Supabase Preview' && c?.app?.slug==='supabase');
          if(provider.length===0){ process.stdout.write('missing'); process.exit(0); }
          provider.sort((a,b)=>(Number(b.id||0)-Number(a.id||0)) || String(b.started_at||'').localeCompare(String(a.started_at||'')));
          const check=provider[0];
          const id=String(check.id||'unknown');
          if(check.status!=='completed'){ process.stdout.write(`pending:${id}`); process.exit(0); }
          process.stdout.write(`${String(check.conclusion||'unknown')}:${id}`);
          NODE
            )"

            case "$state" in
              success:*)
                provider_id="${state#success:}"
                if [ "$stable_provider_success_id" = "$provider_id" ]; then
                  echo "SUPABASE_PREVIEW_PROVIDER_VERIFIED:$HEAD_SHA:$provider_id"
                  exit 0
                fi
                stable_provider_success_id="$provider_id"
                sleep 5
                ;;
              failure:*|cancelled:*|timed_out:*|action_required:*|stale:*|startup_failure:*|skipped:*|neutral:*)
                echo "::error::SUPABASE_PREVIEW_PROVIDER_NON_SUCCESS:$state:$HEAD_SHA"
                exit 1
                ;;
              missing|pending:*)
                stable_provider_success_id=""
                sleep 5
                ;;
              *)
                echo "::error::SUPABASE_PREVIEW_PROVIDER_UNKNOWN_STATE:$state:$HEAD_SHA"
                exit 1
                ;;
            esac
          done
          echo "::error::SUPABASE_PREVIEW_PROVIDER_TIMEOUT:$HEAD_SHA"
          exit 1

