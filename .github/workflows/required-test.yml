name: Required test

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Candidate PR number'
        required: false
        type: string
      base_sha:
        description: 'Immutable PR base SHA'
        required: false
        type: string
      head_sha:
        description: 'Immutable candidate head SHA'
        required: false
        type: string
      candidate_branch:
        description: 'Immutable candidate branch'
        required: false
        type: string
      pr_body:
        description: 'Immutable PR delivery metadata for recovery dispatch'
        required: false
        type: string
      pr_labels_json:
        description: 'PR labels JSON for recovery dispatch'
        required: false
        type: string

permissions:
  actions: read
  contents: read
  statuses: read
  pull-requests: read

concurrency:
  # Native PR and recovery dispatch for the same PR are one logical flight.
  group: required-test-${{ inputs.pr_number || github.event.pull_request.number || github.event.merge_group.head_sha || github.ref_name }}
  # Single-flight is PR-scoped; exact candidate identity remains enforced inside the gates below.
  cancel-in-progress: true

jobs:
  hygiene:
    uses: ./.github/workflows/powerhouse-delivery-hygiene.yml
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      head_sha: ${{ inputs.head_sha || '' }}

  preflight:
    needs: hygiene
    if: needs.hygiene.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      portal: ${{ steps.scope.outputs.portal }}
      website: ${{ steps.scope.outputs.website }}
      automation: ${{ steps.scope.outputs.automation }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      change_head_sha: ${{ steps.scope.outputs.change_head_sha }}
      candidate_sha: ${{ steps.scope.outputs.candidate_sha }}
      pr_number: ${{ steps.scope.outputs.pr_number }}
      risk_level: ${{ steps.integration.outputs.risk }}
      full_shared_suite: ${{ steps.integration.outputs.full_shared_suite }}
      affected_capabilities: ${{ steps.integration.outputs.capabilities_json }}
      netlify_build_required: ${{ steps.scope.outputs.netlify_build_required }}
      supabase_preview_required: ${{ steps.scope.outputs.supabase_preview_required }}
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Enforce control-plane growth ratchets
        run: |
          node tools/ci/check-control-plane-budget.mjs
          node tools/ci/check-pr-trigger-ratchet.mjs
      - name: Verify immutable release artifact identity regression
        run: node --test tests/release-artifact-identity.test.mjs
      - id: artifact
        name: Compute immutable artifact identity
        run: echo "artifact_id=$(node tools/build/artifact-id.mjs)" >> "$GITHUB_OUTPUT"
      - name: Run canonical security operations contracts
        run: |
          node --test tests/brain-security-operations-closure-v1.test.mjs tests/security-operations-proof.test.mjs
          node scripts/security-operations-proof.mjs --check
      - name: Run consolidated merge-group specialist assurance
        if: github.event_name == 'merge_group'
        run: >-
          node --test
          tests/compliance-status-page.test.mjs
          tests/brain-error-learning-contract.test.mjs
          tests/brain-runtime-authority-governance.test.mjs
          tests/brain-adapter-conformance.test.mjs
          tests/brain-bg184-stateful-blocker-dedupe.test.mjs
          tests/homepage-pricing-boundary-readback.test.mjs
          tests/main-write-integrity-squash-pr.test.mjs
          tests/universal-event-envelope.test.mjs
          tests/universal-failure-learning.test.mjs
          tests/event-retention-policy.test.mjs
          tests/event-retention-expiry.test.mjs
          tests/universal-event-contract-check.test.mjs
          tests/universal-event-adapters.test.mjs
          tests/parallel-ownership.test.mjs
          tests/change-classes.test.mjs
          tests/page-composition.test.mjs
          tests/component-preview-composition.test.mjs
          tests/component-boundaries.test.mjs
          tests/change-scope.test.mjs
          tests/component-hash-protection.test.mjs
          tests/detect-changed-components.test.mjs
          tests/component-preview-workflow-contract.test.mjs
          tests/supabase-public-rls-regression-guard.test.mjs
          tests/linkedin-revenue-cockpit.test.mjs
          tests/linkedin-revenue-runtime.test.mjs
          tests/linkedin-revenue-engagement-cockpit.test.mjs
          tests/build/artifact-id.test.mjs
          tests/brain-powerhouse-engineering-closed-loop.test.mjs
      - name: Verify engineering learning self-test
        if: github.event_name == 'merge_group'
        run: node scripts/brain/powerhouse-engineering-closed-loop.mjs --self-test

      - name: Verify hero production media contract
        if: github.event_name == 'merge_group'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const expected = 'a261792e9b0058802ab5b30ce107c7ac14e8b2291a3bd7ee78fdb5968bbe97fd';
          const mediaPath = 'assets/openart-hero-iphone-safe-v1.mp4';
          if (!fs.existsSync(mediaPath)) throw new Error('accepted hero binary missing');
          const bytes = fs.readFileSync(mediaPath);
          const sha = crypto.createHash('sha256').update(bytes).digest('hex');
          if (sha !== expected) throw new Error(`hero binary hash mismatch: ${sha}`);
          const manifest = JSON.parse(fs.readFileSync('assets/openart-hero-production.json','utf8'));
          if (manifest.derivative_sha256 !== expected) throw new Error('manifest derivative hash mismatch');
          if (manifest.physical_iphone_runtime !== 'PASS') throw new Error('physical iPhone acceptance missing');
          if (manifest.promotion_state !== 'MEDIA_READY') throw new Error('media is not MEDIA_READY');
          const p = manifest.derivative_probe || {};
          const exact = p.width === 1920 && p.height === 1080 && p.fps === 30 && p.codec === 'h264' && p.pixel_format === 'yuv420p' && p.has_audio === false && p.faststart === true;
          if (!exact) throw new Error(`manifest media profile mismatch: ${JSON.stringify(p)}`);
          console.log(`Hero static media contract PASS: ${sha}; bytes=${bytes.length}`);
          NODE

      - name: Run intelligence, chat and regulation merge assurance
        if: github.event_name == 'merge_group'
        run: |
          node --test tests/brain-chat-learning-fast-development-v2.test.mjs
          node scripts/brain/test-chat-learning-preflight-compiler.mjs
          node scripts/brain/chat-learning-preflight.mjs
          node --test tests/delivery-regelgeving-actueel.test.mjs
          node scripts/brain/continuous-improvement/run-autonomous-improvement.mjs
          node --test \
            tests/brain-autonomous-improvement-runtime.test.mjs \
            tests/brain-autonomous-improvement-production-cycle.test.mjs \
            tests/brain-autonomous-backlog-intake.test.mjs \
            tests/brain-github-backlog-source.test.mjs
          node --test tests/agent-fabric.test.mjs
          if [ -f tests/agent-fabric-gateway.test.mjs ]; then node --test tests/agent-fabric-gateway.test.mjs; fi
          node --test \
            tests/brain-acceptance.test.mjs \
            tests/brain-api-gateway.test.mjs \
            tests/brain-production-ai.test.mjs \
            tests/brain-storage-port.test.mjs

      - name: Run consolidated business and portal merge assurance
        if: github.event_name == 'merge_group'
        run: |
          node --test \
            tests/portal-next-shell.test.mjs \
            tests/intelligence-agent-runtime.test.mjs \
            tests/policy-engine.test.mjs \
            tests/trust-*.test.mjs \
            tests/canonical-*.test.mjs \
            tests/source-adapters.test.mjs \
            tests/read-models.test.mjs \
            tests/foundation-registry-eventstore.test.mjs \
            tests/monitor-brain-ingest.test.mjs
          python3 .github/scripts/portal_parity.py
          node tests/homepage-hero-video.test.mjs
          npm --prefix portal-v2 test
          test -f portal-v2/index.html
          test -f portal-v2/app.css
          test -f portal-v2/app.js
          test -f portal-v2/page-shell.js
          test -f portal-v2/interaction.css
          test -f portal-v2/brain.svg
          grep -q "./brain.svg" portal-v2/app.js
          grep -q "enhancePortalShell" portal-v2/app.js
          grep -q "openPortalPage" portal-v2/app.js
      - name: Run consolidated sixth specialist assurance
        if: github.event_name == 'merge_group'
        run: |
          node --test tests/ai-model-advisor-v1.test.mjs tests/ai-model-production-hotfix-v1.test.mjs tests/ai-model-seo-cluster-v1.test.mjs
          node --test tests/brain-autonomous-improvement-runtime-completion.test.mjs tests/brain-autonomous-improvement-recovery-proof.test.mjs
          ! grep -RniE 'new_persistent_authority[[:space:]]*[:=][[:space:]]*true|make\.com|hook\.eu[0-9]+\.make\.com' \
            scripts/brain/continuous-improvement \
            supabase/migrations/*autonomous_improvement* || {
              echo '::error::Parallel authority or retired Make dependency detected.'
              exit 1
            }
          npm install --ignore-scripts --no-audit --no-fund
          node --test \
            tests/social-learning-buffer-collector.test.mjs \
            tests/social-learning-buffer-schedule.test.mjs \
            tests/social-learning-buffer-content-chain.test.mjs \
            tests/social-learning-buffer-channel-identity-gate.test.mjs \
            tests/social-learning-buffer-instagram-media-gate.test.mjs \
            tests/social-learning-instagram-media-provider-routing-v1.test.mjs \
            tests/social-learning-instagram-video-frame-proof-worker-v1.test.mjs \
            tests/social-learning-buffer-delivery-guarantee-regression.test.mjs \
            tests/social-learning-buffer-rate-limit-regression.test.mjs
          python3 tools/config-wacht.py
          python3 -m unittest tests/portal-parity-source-contract.py -v
          python3 .github/scripts/portal_parity.py
          node --test tests/portal-modular-legacy-capability-parity.test.mjs
          node --test tests/brain-repository-hygiene.test.mjs
          node --test \
            tests/revenue-learning-*.test.mjs \
            tests/powerhouse-revenue-calibration-persistence-contract.test.mjs \
            tests/growth-intelligence-engine.test.mjs \
            tests/growth-intelligence-daily.test.mjs \
            tests/supabase-migration-history-integrity.test.mjs \
            tests/notion-synced-posts-migration-reproducibility.test.mjs
          node --test tests/content-growth-unified-content-operations.test.mjs
          python3 -m py_compile scripts/publish_approved_blog_v2.py
          node scripts/brain/validate-universal-closed-loop-learning.mjs
          node --test tests/brain-universal-closed-loop-learning.test.mjs tests/brain-powerhouse-daily-compound-learning-v1.test.mjs
          node --test tests/approved-blog-verifier-contract.test.mjs
          node --test \
            tests/powerhouse-assurance.test.mjs \
            tests/powerhouse-assurance-delivery-classification.test.mjs \
            tests/brain-powerhouse-loop-assurance-v2.test.mjs \
            tests/brain-quality-intelligence.test.mjs \
            tests/brain-quality-intelligence-v2.test.mjs \
            tests/brain-quality-exploration.test.mjs \
            tests/brain-quality-adversarial.test.mjs \
            tests/brain-quality-production-shadow.test.mjs \
            tests/brain-quality-economics.test.mjs
          node scripts/powerhouse-assurance-check.mjs --check
          node scripts/brain/powerhouse-loop-assurance-contract.mjs --check
          node scripts/brain/powerhouse-quality-intelligence.mjs --check
          node --test tests/powerhouse-foresight-autonomy.test.mjs tests/brain-powerhouse-foresight-prediction-intelligence-v2.test.mjs
          grep -q "benchmark_required: true" scripts/brain/continuous-improvement/technology-discovery.mjs
          grep -q "auto_adopt: false" scripts/brain/continuous-improvement/technology-discovery.mjs
          test -f .github/workflows/shared-agent-memory-tests.yml
          test -f .github/workflows/engineering-os-learning.yml
          test -f config/powerhouse-daily-self-evolution.json
          node scripts/brain/foresight-autonomy.mjs > /tmp/foresight.json
          node --test tests/components/*.test.mjs
          node --test \
            tests/brain-powerhouse-closure-a-f.test.mjs \
            tests/supabase-powerhouse-closure-db-contract.test.mjs \
            tests/portal-v2-bcg.test.mjs \
            tests/portal-v2-parity-integration.test.mjs \
            tests/brain-quality-powerhouse-closure-intelligence.test.mjs
          node --test tests/powerhouse-daily-self-evolution.test.mjs tests/brain-self-improvement-layer-v1.test.mjs tests/ai-model-intelligence-freshness-v1.test.mjs
          node scripts/brain/ai-model-intelligence-audit.mjs
          node scripts/brain/daily-self-evolution.mjs
          node scripts/brain/continuous-improvement/capability-inventory.mjs
          node --test tests/brain-autonomous-engineering-fabric-v3.test.mjs
          node scripts/brain/autonomous-engineering-fabric-v3.mjs --check
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - id: scope
        name: Classify independent delivery lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PR_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          PR_BODY_INPUT: ${{ inputs.pr_body || '' }}
          GH_TOKEN: ${{ github.token }}
          PR_LABELS_JSON: ${{ inputs.pr_labels_json || toJson(github.event.pull_request.labels.*.name) }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, appendFile } from 'node:fs/promises';
          import { createDeliveryPlan } from './tools/brain-delivery-system.mjs';
          import { deriveRequiredTestSuites } from './tools/delivery-required-test-suites.mjs';
          import { deriveNetlifyDeploymentApplicability } from './tools/delivery/netlify-deployment-applicability.mjs';
          import { normalizeGitHubDeliveryEvent } from './tools/delivery-github-event-context.mjs';
          import { evaluateBranchHygiene } from './tools/delivery-branch-hygiene-guard.mjs';
          import { resolveDeliveryMetadataAuthority } from './tools/delivery/delivery-metadata-authority.mjs';
          const fallbackBaseSha=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const context=normalizeGitHubDeliveryEvent({
            eventName: process.env.EVENT_NAME,
            githubSha: process.env.GITHUB_SHA_VALUE,
            runId: process.env.RUN_ID,
            fallbackBaseSha,
            event: {
              pull_request: process.env.PR_NUMBER ? {
                number: process.env.PR_NUMBER,
                base: { sha: process.env.PR_BASE_SHA },
                head: { sha: process.env.PR_HEAD_SHA },
              } : undefined,
              merge_group: process.env.EVENT_NAME === 'merge_group' ? {
                base_sha: process.env.MERGE_GROUP_BASE_SHA,
                head_sha: process.env.MERGE_GROUP_HEAD_SHA,
              } : undefined,
            },
          });
          const livePrBody = process.env.PR_BODY_INPUT || (context.prNumber
            ? JSON.parse(execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/pulls/${context.prNumber}`],{encoding:'utf8'})).body || ''
            : '');
          const oneLoopPolicy=JSON.parse(await readFile('config/powerhouse-one-loop-v1.json','utf8'));
          const metadataAuthority=resolveDeliveryMetadataAuthority({
            prBody: livePrBody,
            manifest: oneLoopPolicy.deliveryCandidate,
          });
          const comparisonBaseSha=metadataAuthority.source === 'versioned-manifest'
            ? metadataAuthority.delivery.baseSha
            : context.baseSha;
          if(metadataAuthority.source === 'versioned-manifest' && metadataAuthority.delivery.baseSha !== context.baseSha) {
            console.log(`VERSIONED_BASE_SHA_MISMATCH drift-only manifest=${metadataAuthority.delivery.baseSha} event=${context.baseSha}`);
          }
          try {
            execFileSync('git',['cat-file','-e',`${comparisonBaseSha}^{commit}`],{stdio:'ignore'});
          } catch {
            console.log(`TARGETED_BASE_FETCH:${comparisonBaseSha}`);
            execFileSync('git',['fetch','--no-tags','--depth=1','origin',comparisonBaseSha],{stdio:'inherit'});
          }
          const changedPaths=execFileSync('git',['diff','--name-only',comparisonBaseSha,context.changeHeadSha],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean);
          const labels=JSON.parse(process.env.PR_LABELS_JSON || '[]');
          const metadata={expectedPaths:metadataAuthority.expectedPaths,maxFiles:metadataAuthority.maxFiles,delivery:metadataAuthority.delivery};
          const databaseRelevantSupabase=changedPaths.some(path =>
            path.startsWith('supabase/') &&
            !path.startsWith('supabase/functions/') &&
            path !== 'supabase/config.toml'
          );
          let supabaseConfigDatabaseRelevant=false;
          if(changedPaths.includes('supabase/config.toml')){
            const probe="import subprocess,sys,tomllib; base,head=sys.argv[1:3]; load=lambda ref: tomllib.loads(subprocess.check_output(['git','show',f'{ref}:supabase/config.toml']).decode('utf-8')); norm=lambda config:{k:v for k,v in config.items() if k!='functions'}; raise_code=0 if norm(load(base))==norm(load(head)) else 1; sys.exit(raise_code)";
            try {
              execFileSync('python3',['-c',probe,comparisonBaseSha,context.changeHeadSha],{stdio:'pipe'});
              supabaseConfigDatabaseRelevant=false;
            } catch {
              supabaseConfigDatabaseRelevant=true;
            }
          }
          const supabasePreviewRequired=databaseRelevantSupabase || supabaseConfigDatabaseRelevant;
          const hygiene=evaluateBranchHygiene({changedPaths,metadata,labels});
          if(!hygiene.ok) throw new Error(`Branch hygiene blocked delivery: ${JSON.stringify(hygiene)}`);
          const policy=JSON.parse(await readFile('config/brain-delivery-system.json','utf8'));
          const netlifyApplicability=deriveNetlifyDeploymentApplicability({changedPaths,headSha:context.candidateSha,policy});
          const netlifyBuildRequired=netlifyApplicability.deploymentRequired;
          const plan=createDeliveryPlan({changedPaths,headSha:context.candidateSha,policy});
          const suites=deriveRequiredTestSuites({lanes:plan.lanes.map(lane=>lane.id)});
          for(const lane of ['backend','portal','website','automation']) await appendFile(process.env.GITHUB_OUTPUT,`${lane}=${suites[lane]}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`base_sha=${comparisonBaseSha}\nchange_head_sha=${context.changeHeadSha}\ncandidate_sha=${context.candidateSha}\npr_number=${context.prNumber}\nnetlify_build_required=${netlifyBuildRequired}\nsupabase_preview_required=${supabasePreviewRequired}\n`);
          console.log(JSON.stringify({context,metadataAuthority,comparisonBaseSha,changedPaths,hygiene,lanes:plan.lanes.map(lane=>lane.id),suites,netlifyApplicability},null,2));
          NODE
      - id: integration
        name: Compile one-write integration bundle
        env:
          PR_BODY: ${{ inputs.pr_body || github.event.pull_request.body || '' }}
          PR_NUMBER: ${{ steps.scope.outputs.pr_number }}
        run: node tools/delivery/integration-bundle-compiler.mjs --base "${{ steps.scope.outputs.base_sha }}" --head "${{ steps.scope.outputs.change_head_sha }}"
      - name: Verify adaptive and integration compiler regressions
        run: node --test tests/brain-adaptive-delivery-engine-v1.test.mjs tests/brain-integration-bundle-compiler-v1.test.mjs
      - name: Enforce Powerhouse one-loop runtime invariants
        run: node --test tests/brain-powerhouse-one-loop-terminal-lineage-v1.test.mjs
      - name: Fail fast on incomplete integration closure
        if: steps.integration.outputs.closure_ready != 'true'
        run: |
          echo "::error::INTEGRATION_BUNDLE_CLOSURE_INCOMPLETE"
          exit 78
      - name: Execute fast impact quality gate
        if: steps.integration.outputs.full_shared_suite == 'false'
        env:
          TESTS_JSON: ${{ steps.integration.outputs.tests_json }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          const tests = JSON.parse(process.env.TESTS_JSON || '[]');
          if (!tests.length) process.exit(0);
          execFileSync('node', ['--test', ...tests], { stdio: 'inherit' });
          NODE
      - name: Enforce material writeback closure
        if: steps.integration.outputs.closure_authority != 'canonical-runtime-obligation'
        run: node scripts/brain/material-writeback-closure-guard.mjs "${{ steps.scope.outputs.base_sha }}" "${{ steps.scope.outputs.change_head_sha }}"
      - name: Verify material writeback closure regression
        run: node --test tests/brain-material-writeback-closure-guard.test.mjs
      - name: Install runtime dependencies for the unwired contracts
        if: steps.integration.outputs.full_shared_suite == 'true'
        run: npm install --prefer-offline --no-audit --no-fund --silent
      - name: Validate fail-closed static English cache before merge
        if: steps.integration.outputs.full_shared_suite == 'true'
        env:
          STATIC_I18N_NETWORK: '0'
          STATIC_I18N_REQUIRE_CACHE: '1'
        run: node tools/site-shell/build-localized-routes.mjs --validate-cache
      - name: Verify previously unwired test contracts
        if: steps.integration.outputs.full_shared_suite == 'true'
        run: >-
          node --test
          tests/agents-delivery-contract.test.mjs
          tests/ai-token-usage.test.mjs
          tests/ai-usage-store.test.mjs
          tests/api-gateways.test.mjs
          tests/brain-production-release-readback-scope.test.mjs
          tests/brain-production-promotion-observability.test.mjs
          tests/control-plane-supabase-terminal-readback-v1.test.mjs
          tests/delivery-test-coverage-guard.test.mjs
          tests/brain-ci-admission-single-flight.test.mjs
          tests/brain-ci-critical-path-acceleration-v1.test.mjs
          tests/brain-autonomous-engineering-fabric-v3.test.mjs
          tests/brain-standalone-visibility-boundedness-v1.test.mjs
          tests/customer-portal-auth-race.test.mjs
          tests/cms-website-portal-v1.test.mjs
          tests/daily-cost-optimizer.test.mjs
          tests/data-ai-passport.test.mjs
          tests/eu-ai-act-audit-report.test.mjs
          tests/eu-ai-act-controls.test.mjs
          tests/eu-ai-act-passport-ui.test.mjs
          tests/final-site-navigation-contract.test.mjs
          tests/powerhouse-runtime-action-learning-api.test.mjs
          tests/internal-auth-scan-boundary.test.mjs
          tests/klantportaal-cockpit-contract.test.mjs
          tests/klantportaal-release-gates.test.mjs
          tests/klantportaal-v2-flow.test.mjs
          tests/klantportaal-v2-pages.test.mjs
          tests/money-page-conversion-contract.test.mjs
          tests/money-page-shared-loader.test.mjs
          tests/commercial-intent-pages-v1.test.mjs
          tests/netlify-identity-recovery-build.test.mjs
          tests/netlify-identity-recovery-flow.test.mjs
          tests/seo-homepage-context-slider-contract.test.mjs
          tests/product-led-home-v1.test.mjs
          tests/delivery-een-portaal.test.mjs
          tests/klantportaal-demostand.test.mjs
          tests/klantportaal-tekenen-via-supabase.test.mjs
          tests/platform-promotion-activation-gate.test.mjs
          tests/delivery-required-exact-head-critical-gates-v1.test.mjs
          tests/seo-v18-canonical-header.test.mjs
          tests/seo-homepage-scroll-story-interaction.test.mjs
          tests/seo-homepage-process-progress.test.mjs
          tests/seo-search-console-revenue-sprint.test.mjs
          tests/brain-seo-cro-execute-or-explain-v1.test.mjs
          tests/brain-i18n-production-navigation-readback-v2.test.mjs
          tests/brain-i18n-runtime-cache-bust-v1.test.mjs
          tests/brain-netlify-static-i18n-cache-terminal-v1.test.mjs
          tests/ai-model-seo-cluster-v1.test.mjs
          tests/ai-model-production-hotfix-v1.test.mjs
