name: Required test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install visual regression browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run required Brain, delivery and UI regression contracts
        run: >-
          node --test
          tests/brain-adapter-conformance.test.mjs
          tests/brain-platform-adapters.test.mjs
          tests/universal-event-envelope.test.mjs
          tests/event-retention-policy.test.mjs
          tests/event-retention-expiry.test.mjs
          tests/universal-event-contract-check.test.mjs
          tests/universal-event-adapters.test.mjs
          tests/universal-failure-learning.test.mjs
          tests/make-cost-governor-policy.test.mjs
          tests/make-cost-governance-contract.test.mjs
          tests/v18-vergelijker.test.mjs
          tests/seo-ui-visual-regression-contract.test.mjs
          tests/seo-ui-visual-regression-geometry.test.mjs
          tests/seo-ui-visual-regression-browser.test.mjs
          tests/site-shell-v18-view-integrity.test.mjs
          tests/seo-native-money-presentation.test.mjs
          tests/seo-homepage-platform-expertise-toggle.test.mjs
          tests/standalone-content-page-router-isolation.test.mjs
          tests/v18-megamenu-heading-contract.test.mjs
      - name: Fail closed on real deploy-preview visual regressions
        if: github.event_name == 'pull_request'
        env:
          UI_VR_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: node tools/site-shell/ui-visual-regression/browser-check.mjs
      - name: Click Platform and Expertise on the real deploy preview
        if: github.event_name == 'pull_request'
        env:
          UI_VR_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: node tools/site-shell/homepage-toggle-browser-check.mjs
      - name: Verify AI Act and benchmark are visibly rendered
        if: github.event_name == 'pull_request'
        env:
          UI_VR_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: node tools/site-shell/standalone-visibility-check.mjs
      - name: Verify real megamenu headings are black and bold
        if: github.event_name == 'pull_request'
        env:
          UI_VR_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: node tools/site-shell/v18-megamenu-browser-check.mjs
      - name: Upload visual regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-regression-required-test
          path: artifacts/ui-visual-regression/
          if-no-files-found: ignore
