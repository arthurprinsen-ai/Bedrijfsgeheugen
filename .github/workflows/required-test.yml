      - name: Verify config watch
        run: python3 tools/config-wacht.py
      - name: Run intelligence, chat and regulation merge assurance
        run: node --test tests/brain-acceptance.test.mjs tests/agent-fabric.test.mjs tests/delivery-regelgeving-actueel.test.mjs tests/brain-chat-learning-fast-development-v2.test.mjs
      - name: Verify hero production media contract
        run: node --test tests/homepage-hero-video.test.mjs
      - name: Verify engineering learning self-test
        run: node --test tests/brain-powerhouse-engineering-closed-loop.test.mjs
      - name: Verify universal closed-loop learning
        run: node scripts/brain/validate-universal-closed-loop-learning.mjs
      - name: Verify Powerhouse assurance
        run: |
          node scripts/powerhouse-assurance-check.mjs
          node scripts/brain/powerhouse-loop-assurance-contract.mjs
          node scripts/brain/powerhouse-quality-intelligence.mjs
      - name: Verify foresight autonomy
        run: node scripts/brain/foresight-autonomy.mjs
      - name: Verify security operations
        run: |
          node scripts/security-operations-proof.mjs --check
          python3 scripts/brain/check_powerhouse_supabase_security.py
      - name: Verify portal-v2 package assurance
        working-directory: portal-v2
        run: npm test
      - name: Verify portal shell enhancement contract
        run: grep -R "enhancePortalShell" -n portal-v2 platform tools tests >/dev/null

  merge_specialist_node24:
    name: MERGE_SPECIALIST_NODE24
    needs: preflight
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify canonical brand shell
        run: |
          node tools/site-shell/test-shell-components.mjs
          node --test tests/site-shell-compare-slider-physical-edges.test.mjs
      - name: Verify content growth policy and contracts
        run: |
          node tools/content-growth/validate-policy.mjs
          node --test tests/content-growth-*.test.mjs


  netlify_build_parity:
    needs: preflight
    if: needs.preflight.outputs.netlify_build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Restore and extend content-addressed static i18n render cache
        uses: actions/cache@v4
        with:
          path: .cache/bg-static-i18n-v1
          key: static-i18n-render-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            static-i18n-render-v1-${{ runner.os }}-
      - name: Install exact Netlify build dependencies
        run: npm install --prefer-offline --no-audit --no-fund --silent
      - name: Run exact Netlify production build command once
        env:
          COMMIT_REF: ${{ needs.preflight.outputs.change_head_sha }}
          CONTEXT: production
          DEPLOY_ID: required-netlify-build-parity
          STATIC_I18N_NETWORK: '0'
          STATIC_I18N_REQUIRE_CACHE: '1'
          STATIC_I18N_BUILD_CACHE_DIR: .cache/bg-static-i18n-v1
          STATIC_I18N_ROUTE_WORKERS: '2'
          NETLIFY_BUILD_PROFILE_PATH: .artifacts/netlify-build-profile.json
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          node tools/ci/netlify-build-entry.mjs
      - name: Verify built artifact contracts
        run: node --test tests/tabbladen.test.mjs tests/brain-bedrijfslek-product-led-acquisition-v1.test.mjs tests/brain-netlify-prebuilt-artifact-reuse-v1.test.mjs
      - id: prebuilt
        name: Package immutable tree-addressed Netlify prebuilt artifact
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          source_tree_sha="$(git rev-parse "${CANDIDATE_SHA}^{tree}")"
          stage="$(mktemp -d)"
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.cache/' \
            --exclude='.artifacts/' \
            --exclude='netlify-prebuilt.zip' \
            ./ "$stage/"
          rm -f "$stage/.bg-prebuilt-deploy.json" "$stage/.bg-prebuilt-manifest.json"
          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/netlify-prebuilt.zip" .)
          archive_sha256="$(sha256sum netlify-prebuilt.zip | awk '{print $1}')"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > .artifacts/netlify-prebuilt-manifest.json <<JSON
          {
            "contract": "NETLIFY_PREBUILT_ARTIFACT_V1",
            "source_head_sha": "${CANDIDATE_SHA}",
            "source_tree_sha": "${source_tree_sha}",
            "archive_sha256": "${archive_sha256}",
            "generated_at": "${generated_at}"
          }
          JSON
          echo "source_tree_sha=${source_tree_sha}" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=${archive_sha256}" >> "$GITHUB_OUTPUT"
          echo "NETLIFY_PREBUILT_PACKAGED tree=${source_tree_sha} sha256=${archive_sha256}"
      - name: Upload immutable Netlify prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-prebuilt-tree-${{ steps.prebuilt.outputs.source_tree_sha }}
          path: |
            netlify-prebuilt.zip
            .artifacts/netlify-prebuilt-manifest.json
            .artifacts/netlify-build-profile.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3


  supabase_source_contract:
    needs: preflight
    if: needs.preflight.outputs.supabase_preview_required == 'true'
    uses: ./.github/workflows/supabase-pr-preview.yml
    with:
      base_sha: ${{ needs.preflight.outputs.base_sha }}
      head_sha: ${{ needs.preflight.outputs.change_head_sha }}

  supabase_preview:
    needs: [preflight, supabase_source_contract]
    if: needs.preflight.outputs.supabase_preview_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      # The provider-check parser is a repository file; a fresh Actions runner
      # has no checkout by default. Pin checkout to the exact validated PR head.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.change_head_sha }}
          persist-credentials: false
      - name: Verify provider-owned Supabase Preview on exact candidate head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.preflight.outputs.change_head_sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          stable_provider_success_id=""
          skipped_provider_id=""
          skipped_grace_count=0
          for attempt in $(seq 1 48); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              > /tmp/supabase-preview-check-runs.json

            state="$(node tools/ci/supabase-preview-diagnosis.mjs /tmp/supabase-preview-check-runs.json)"

            case "$state" in
              success:*)
                provider_id="${state#success:}"
                if [ "$stable_provider_success_id" = "$provider_id" ]; then
                  echo "SUPABASE_PREVIEW_PROVIDER_VERIFIED:$HEAD_SHA:$provider_id"
                  exit 0
                fi
                stable_provider_success_id="$provider_id"
                sleep 5
                ;;
              skipped:*)
                # A Supabase-owned skipped placeholder can be superseded by a later
                # provider check on the SAME candidate SHA. Never treat it as green.
                provider_id="${state#skipped:}"
                if [ "$skipped_provider_id" = "$provider_id" ]; then
                  skipped_grace_count=$((skipped_grace_count + 1))
                else
                  skipped_provider_id="$provider_id"
                  skipped_grace_count=1
                fi
                if [ "$skipped_grace_count" -le 2 ]; then
                  echo "SUPABASE_PREVIEW_SKIPPED_GRACE:$HEAD_SHA:$provider_id:$skipped_grace_count"
                  sleep 5
                  continue
                fi
                echo "::error::SUPABASE_PREVIEW_PROVIDER_NON_SUCCESS:$state:$HEAD_SHA"
                exit 1
                ;;
              failure:*|cancelled:*|timed_out:*|action_required:*|stale:*|startup_failure:*|neutral:*)
                echo "::error::SUPABASE_PREVIEW_PROVIDER_NON_SUCCESS:$state:$HEAD_SHA"
                exit 1
                ;;
              missing|pending:*)
                stable_provider_success_id=""
                sleep 5
                ;;
              *)
                echo "::error::SUPABASE_PREVIEW_PROVIDER_UNKNOWN_STATE:$state:$HEAD_SHA"
                exit 1
                ;;
            esac
          done
          echo "::error::SUPABASE_PREVIEW_PROVIDER_TIMEOUT:$HEAD_SHA"
          exit 1

  backend:
    needs: preflight
    if: needs.preflight.outputs.backend == 'true'
    uses: ./.github/workflows/lane-backend.yml
    with:
      head_sha: ${{ needs.preflight.outputs.candidate_sha }}

  portal:
    needs: preflight
    if: needs.preflight.outputs.portal == 'true'
    uses: ./.github/workflows/lane-portal.yml
    with:
      head_sha: ${{ needs.preflight.outputs.candidate_sha }}

  automation:
    needs: preflight
    if: needs.preflight.outputs.automation == 'true'
    uses: ./.github/workflows/lane-automation.yml
    with:
      head_sha: ${{ needs.preflight.outputs.candidate_sha }}

  website:
    needs: preflight
    if: needs.preflight.outputs.website == 'true'
    uses: ./.github/workflows/lane-website.yml
    with:
      base_sha: ${{ needs.preflight.outputs.base_sha }}
      change_head_sha: ${{ needs.preflight.outputs.change_head_sha }}
      candidate_sha: ${{ needs.preflight.outputs.candidate_sha }}
      pr_number: ${{ needs.preflight.outputs.pr_number }}

  test:
    name: test
    if: always()
    needs: [hygiene, preflight, merge_specialist, merge_specialist_node24, netlify_build_parity, supabase_source_contract, supabase_preview, backend, portal, automation, website]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVENT_NAME: ${{ github.event_name }}
      HYGIENE: ${{ needs.hygiene.result }}
      ADMITTED: ${{ needs.hygiene.outputs.admitted }}
      PREFLIGHT: ${{ needs.preflight.result }}
      MERGE_SPECIALIST: ${{ needs.merge_specialist.result }}
      MERGE_SPECIALIST_NODE24: ${{ needs.merge_specialist_node24.result }}
      SELECT_SUPABASE_PREVIEW: ${{ needs.preflight.outputs.supabase_preview_required }}
      SUPABASE_SOURCE_CONTRACT: ${{ needs.supabase_source_contract.result }}
      SUPABASE_PREVIEW: ${{ needs.supabase_preview.result }}
      SELECT_BACKEND: ${{ needs.preflight.outputs.backend }}
      SELECT_PORTAL: ${{ needs.preflight.outputs.portal }}
      SELECT_AUTOMATION: ${{ needs.preflight.outputs.automation }}
      SELECT_WEBSITE: ${{ needs.preflight.outputs.website }}
      NETLIFY_BUILD_REQUIRED: ${{ needs.preflight.outputs.netlify_build_required }}
      NETLIFY_BUILD: ${{ needs.netlify_build_parity.result }}
      BACKEND: ${{ needs.backend.result }}
      PORTAL: ${{ needs.portal.result }}
      AUTOMATION: ${{ needs.automation.result }}
      WEBSITE: ${{ needs.website.result }}
    steps:
      - name: Confirm canonical single-flight aggregate gate
        run: |
          echo "Required test is the canonical PR gate; selected lanes are evaluated below without polling sibling workflows."

      - name: Aggregate admission and selected lane results
        run: |
          set -euo pipefail
          test "$HYGIENE" = success
          test "$ADMITTED" = true
          test "$PREFLIGHT" = success
          [ "$EVENT_NAME" != merge_group ] || [ "$MERGE_SPECIALIST" = success ]
          [ "$EVENT_NAME" != merge_group ] || [ "$MERGE_SPECIALIST_NODE24" = success ]
          [ "$NETLIFY_BUILD_REQUIRED" != true ] || [ "$NETLIFY_BUILD" = success ]
          [ "$SELECT_SUPABASE_PREVIEW" != true ] || [ "$SUPABASE_SOURCE_CONTRACT" = success ]
          [ "$SELECT_SUPABASE_PREVIEW" != true ] || [ "$SUPABASE_PREVIEW" = success ]
          [ "$SELECT_BACKEND" != true ] || [ "$BACKEND" = success ]
          [ "$SELECT_PORTAL" != true ] || [ "$PORTAL" = success ]
          [ "$SELECT_AUTOMATION" != true ] || [ "$AUTOMATION" = success ]
          [ "$SELECT_WEBSITE" != true ] || [ "$WEBSITE" = success ]
          echo "Delivery hygiene and selected release lanes are green."
