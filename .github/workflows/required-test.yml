name: Required test

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: required-test-${{ github.repository }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      portal: ${{ steps.scope.outputs.portal }}
      website: ${{ steps.scope.outputs.website }}
      automation: ${{ steps.scope.outputs.automation }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      pr_number: ${{ steps.scope.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Block unjustified moving-main successor rebuilds
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/brain/moving-main-successor-guard.mjs
      - name: Enforce CI capacity topology contract
        run: node --test tests/ci-workflow-topology.test.mjs
      - name: Enforce mandatory chat-learning preflight
        if: github.event_name == 'pull_request'
        run: node scripts/brain/chat-learning-preflight.mjs
      - id: scope
        name: Classify independent delivery lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, appendFile } from 'node:fs/promises';
          import { createDeliveryPlan } from './tools/brain-delivery-system.mjs';
          import { deriveRequiredTestSuites } from './tools/delivery-required-test-suites.mjs';
          import { normalizeGitHubDeliveryEvent } from './tools/delivery-github-event-context.mjs';
          import { parseScopeMetadata, evaluateBranchHygiene } from './tools/delivery-branch-hygiene-guard.mjs';
          const fallbackBaseSha=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const context=normalizeGitHubDeliveryEvent({eventName:process.env.EVENT_NAME,githubSha:process.env.GITHUB_SHA_VALUE,runId:process.env.RUN_ID,fallbackBaseSha,event:{pull_request:process.env.EVENT_NAME==='pull_request'?{number:process.env.PR_NUMBER,base:{sha:process.env.PR_BASE_SHA},head:{sha:process.env.PR_HEAD_SHA}}:undefined,merge_group:process.env.EVENT_NAME==='merge_group'?{base_sha:process.env.MERGE_GROUP_BASE_SHA,head_sha:process.env.MERGE_GROUP_HEAD_SHA}:undefined}});
          const changedPaths=execFileSync('git',['diff','--name-only',`${context.baseSha}...${context.headSha}`],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean);
          const labels=JSON.parse(process.env.PR_LABELS_JSON || '[]');
          const metadata=parseScopeMetadata(process.env.PR_BODY || '');
          const hygiene=evaluateBranchHygiene({changedPaths,metadata,labels});
          if(!hygiene.ok) throw new Error(`Branch hygiene blocked delivery: ${JSON.stringify(hygiene)}`);
          const policy=JSON.parse(await readFile('config/brain-delivery-system.json','utf8'));
          const plan=createDeliveryPlan({changedPaths,headSha:context.headSha,policy});
          const suites=deriveRequiredTestSuites({lanes:plan.lanes.map(lane=>lane.id)});
          for(const lane of ['backend','portal','website','automation']) await appendFile(process.env.GITHUB_OUTPUT,`${lane}=${suites[lane]}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`base_sha=${context.baseSha}\nhead_sha=${context.headSha}\npr_number=${context.prNumber}\n`);
          console.log(JSON.stringify({context,changedPaths,hygiene,lanes:plan.lanes.map(lane=>lane.id),suites},null,2));
          NODE
      - name: Verify composable release control plane and agent completion contract
        run: node --test tests/delivery-github-event-context.test.mjs tests/delivery-branch-hygiene-guard.test.mjs tests/delivery-required-branch-hygiene-wiring.test.mjs tests/brain-change-scoped-release-lanes.test.mjs tests/brain-moving-main-successor-guard.test.mjs tests/brain-composable-release-control-plane.test.mjs tests/brain-agents-delivery-contract.test.mjs tests/footer-global-links.test.mjs

  backend:
    needs: preflight
    if: needs.preflight.outputs.backend == 'true'
    uses: ./.github/workflows/lane-backend.yml
    with:
      head_sha: ${{ needs.preflight.outputs.head_sha }}

  portal:
    needs: preflight
    if: needs.preflight.outputs.portal == 'true'
    uses: ./.github/workflows/lane-portal.yml
    with:
      head_sha: ${{ needs.preflight.outputs.head_sha }}
      pr_number: ${{ needs.preflight.outputs.pr_number }}

  automation:
    needs: preflight
    if: needs.preflight.outputs.automation == 'true'
    uses: ./.github/workflows/lane-automation.yml
    with:
      head_sha: ${{ needs.preflight.outputs.head_sha }}

  website:
    needs: preflight
    if: needs.preflight.outputs.website == 'true'
    uses: ./.github/workflows/lane-website.yml
    with:
      base_sha: ${{ needs.preflight.outputs.base_sha }}
      head_sha: ${{ needs.preflight.outputs.head_sha }}
      pr_number: ${{ needs.preflight.outputs.pr_number }}

  test:
    name: test
    if: always()
    needs: [preflight, backend, portal, automation, website]
    runs-on: ubuntu-latest
    env:
      PREFLIGHT: ${{ needs.preflight.result }}
      SELECT_BACKEND: ${{ needs.preflight.outputs.backend }}
      SELECT_PORTAL: ${{ needs.preflight.outputs.portal }}
      SELECT_AUTOMATION: ${{ needs.preflight.outputs.automation }}
      SELECT_WEBSITE: ${{ needs.preflight.outputs.website }}
      BACKEND: ${{ needs.backend.result }}
      PORTAL: ${{ needs.portal.result }}
      AUTOMATION: ${{ needs.automation.result }}
      WEBSITE: ${{ needs.website.result }}
    steps:
      - name: Aggregate only selected lane results
        run: |
          set -euo pipefail
          test "$PREFLIGHT" = success
          [ "$SELECT_BACKEND" != true ] || [ "$BACKEND" = success ]
          [ "$SELECT_PORTAL" != true ] || [ "$PORTAL" = success ]
          [ "$SELECT_AUTOMATION" != true ] || [ "$AUTOMATION" = success ]
          [ "$SELECT_WEBSITE" != true ] || [ "$WEBSITE" = success ]
          echo "Selected release lanes are green."
