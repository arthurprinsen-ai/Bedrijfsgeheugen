name: Required test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Block unjustified moving-main successor rebuilds
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/brain/moving-main-successor-guard.mjs
      - id: scope
        name: Classify blocking suites and website risk depth
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, appendFile } from 'node:fs/promises';
          import { createDeliveryPlan } from './tools/brain-delivery-system.mjs';
          import { deriveRequiredTestSuites } from './tools/delivery-required-test-suites.mjs';
          import { classifyWebsiteRelease } from './tools/website-release-risk.mjs';
          const head = process.env.HEAD_SHA || execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const base = process.env.BASE_SHA || execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changedPaths = execFileSync('git',['diff','--name-only',`${base}...${head}`],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean);
          const policy = JSON.parse(await readFile('config/brain-delivery-system.json','utf8'));
          const plan = createDeliveryPlan({ changedPaths, headSha:head, policy });
          const suites = deriveRequiredTestSuites({ lanes:plan.lanes.map(lane => lane.id) });
          for (const [key,value] of Object.entries(suites)) await appendFile(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          let websiteRisk={lane:'none',affected_routes:[],required_test_sets:[]};
          if(suites.website){
            const riskConfig=JSON.parse(await readFile('config/website-release-risk.json','utf8'));
            const acceptedBaseline=JSON.parse(await readFile('site/accepted-baseline.json','utf8'));
            websiteRisk=classifyWebsiteRelease({changedPaths,riskConfig,acceptedBaseline});
            let routes=[...websiteRisk.affected_routes];
            if(routes.length===0 && websiteRisk.lane==='high-risk') routes=['/','/ai-act','/benchmark'];
            if(routes.length===0) routes=['/'];
            await appendFile(process.env.GITHUB_OUTPUT, `risk_lane=${websiteRisk.lane}\n`);
            await appendFile(process.env.GITHUB_OUTPUT, `risk_routes=${JSON.stringify(routes)}\n`);
            await appendFile(process.env.GITHUB_OUTPUT, `risk_required=${JSON.stringify(websiteRisk.required_test_sets)}\n`);
          }
          console.log(JSON.stringify({ changedPaths, lanes:plan.lanes.map(lane => lane.id), suites, websiteRisk }));
          NODE
      - name: Verify shared release-lane contract
        run: node --test tests/brain-change-scoped-release-lanes.test.mjs tests/brain-moving-main-successor-guard.test.mjs
      - name: Verify backend Brain and runtime contracts
        if: steps.scope.outputs.backend == 'true'
        run: >-
          node --test
          tests/brain-adapter-conformance.test.mjs
          tests/brain-platform-adapters.test.mjs
          tests/universal-event-envelope.test.mjs
          tests/event-retention-policy.test.mjs
          tests/event-retention-expiry.test.mjs
          tests/universal-event-contract-check.test.mjs
          tests/universal-event-adapters.test.mjs
          tests/universal-failure-learning.test.mjs
          tests/make-cost-governor-policy.test.mjs
          tests/make-cost-governance-contract.test.mjs
      - name: Verify portal production contracts
        if: steps.scope.outputs.portal == 'true'
        run: node --test tests/portal-*.test.mjs tests/customer-portal-routing.test.mjs tests/portal-production-contract.test.mjs
      - name: Verify automation delivery contracts
        if: steps.scope.outputs.automation == 'true'
        run: node --test tests/delivery-*.test.mjs tests/brain-delivery-system.test.mjs
      - name: Verify mandatory website baseline and risk contracts
        if: steps.scope.outputs.website == 'true'
        run: node --test tests/site-baseline-guardian.test.mjs tests/website-release-risk.test.mjs tests/website-targeted-route-contract.test.mjs tests/release-gate-contract.test.mjs tests/production-release-readback.test.mjs
      - name: Verify normal/high-risk website static contracts
        if: steps.scope.outputs.website == 'true' && steps.scope.outputs.risk_lane != 'fast-fix'
        run: >-
          node --test
          tests/v18-vergelijker.test.mjs
          tests/site-shell-v18-view-integrity.test.mjs
          tests/site-shell-public-route-inventory.test.mjs
          tests/seo-native-money-presentation.test.mjs
          tests/seo-homepage-platform-expertise-toggle.test.mjs
          tests/standalone-content-page-router-isolation.test.mjs
          tests/v18-megamenu-heading-contract.test.mjs
          tests/seo-homepage-context-slider-readability.test.mjs
      - name: Verify high-risk full website regression contracts
        if: steps.scope.outputs.website == 'true' && steps.scope.outputs.risk_lane == 'high-risk'
        run: >-
          node --test
          tests/seo-ui-visual-regression-contract.test.mjs
          tests/seo-ui-visual-regression-geometry.test.mjs
          tests/seo-ui-visual-regression-browser.test.mjs
      - name: Wait for exact deploy preview
        if: github.event_name == 'pull_request' && steps.scope.outputs.website == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module - <<'NODE'
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const endpoint=`https://api.github.com/repos/${process.env.REPOSITORY}/commits/${process.env.HEAD_SHA}/status`;
          const deadline=Date.now()+10*60*1000;
          while(Date.now()<deadline){
            const response=await fetch(endpoint,{headers});
            if(!response.ok) throw new Error(`GitHub status API ${response.status}`);
            const body=await response.json();
            const status=(body.statuses||[]).find(item=>item.context==='netlify/bedrijfsgeheugen/deploy-preview');
            if(status?.state==='success') process.exit(0);
            if(['failure','error'].includes(status?.state)) throw new Error(`Netlify preview ${status.state}: ${status.description||''}`);
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          throw new Error('Timed out waiting for exact deploy preview');
          NODE
      - name: Install browser for selected website verification
        if: github.event_name == 'pull_request' && steps.scope.outputs.website == 'true'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify affected routes on desktop and mobile
        if: github.event_name == 'pull_request' && steps.scope.outputs.website == 'true'
        env:
          BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
          ROUTES_JSON: ${{ steps.scope.outputs.risk_routes }}
        run: node tools/verify-targeted-website-routes.mjs
      - name: Run broad real-preview website checks only for high-risk changes
        if: github.event_name == 'pull_request' && steps.scope.outputs.website == 'true' && steps.scope.outputs.risk_lane == 'high-risk'
        env:
          UI_VR_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          node tools/site-shell/v18-megamenu-browser-check.mjs
          node tools/site-shell/ui-visual-regression/browser-check.mjs
          node tools/site-shell/homepage-context-slider-browser-check.mjs
          node tools/site-shell/homepage-toggle-browser-check.mjs
          node tools/site-shell/standalone-visibility-check.mjs
      - name: Upload visual regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-regression-required-test
          path: |
            artifacts/ui-visual-regression/
            .artifacts/targeted-route-verification.json
          if-no-files-found: ignore
