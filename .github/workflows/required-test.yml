name: Required test

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Exact open PR number for recovery dispatch'
        required: false
        type: string
      base_sha:
        description: 'Immutable PR base SHA for recovery dispatch'
        required: false
        type: string
      head_sha:
        description: 'Immutable candidate head SHA for recovery dispatch'
        required: false
        type: string
      candidate_branch:
        description: 'Exact candidate branch for recovery dispatch'
        required: false
        type: string

permissions:
  contents: read
  statuses: read
  pull-requests: read

concurrency:
  group: required-test-${{ github.event_name }}-${{ inputs.pr_number || github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  # Single-flight is PR-scoped; exact candidate identity remains enforced inside the gates below.
  cancel-in-progress: true

jobs:
  hygiene:
    uses: ./.github/workflows/powerhouse-delivery-hygiene.yml
    with:
      pr_number: ${{ inputs.pr_number || github.event.pull_request.number || '' }}
      head_sha: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}

  preflight:
    needs: hygiene
    if: needs.hygiene.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      portal: ${{ steps.scope.outputs.portal }}
      website: ${{ steps.scope.outputs.website }}
      automation: ${{ steps.scope.outputs.automation }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      change_head_sha: ${{ steps.scope.outputs.change_head_sha }}
      candidate_sha: ${{ steps.scope.outputs.candidate_sha }}
      pr_number: ${{ steps.scope.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - id: scope
        name: Classify independent delivery lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ inputs.head_sha || github.sha }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch || github.event.pull_request.head.ref || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          PR_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, appendFile } from 'node:fs/promises';
          import { createDeliveryPlan } from './tools/brain-delivery-system.mjs';
          import { deriveRequiredTestSuites } from './tools/delivery-required-test-suites.mjs';
          import { normalizeGitHubDeliveryEvent } from './tools/delivery-github-event-context.mjs';
          import { evaluateBranchHygiene } from './tools/delivery-branch-hygiene-guard.mjs';
          import { resolveDeliveryMetadataAuthority } from './tools/delivery/delivery-metadata-authority.mjs';
          const fallbackBaseSha=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const dispatched = process.env.EVENT_NAME === 'workflow_dispatch' && Boolean(process.env.PR_NUMBER);
          let prBody = process.env.PR_BODY || '';
          let labels = JSON.parse(process.env.PR_LABELS_JSON || '[]');
          if (dispatched) {
            const pr=JSON.parse(execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}`],{encoding:'utf8'}));
            if(pr.state!=='open') throw new Error(`PR_NOT_OPEN:${pr.state}`);
            if(pr.base?.sha!==process.env.PR_BASE_SHA) throw new Error(`PR_BASE_SHA_DRIFT:${process.env.PR_BASE_SHA}:${pr.base?.sha}`);
            if(pr.head?.sha!==process.env.PR_HEAD_SHA) throw new Error(`PR_HEAD_SHA_DRIFT:${process.env.PR_HEAD_SHA}:${pr.head?.sha}`);
            if(process.env.CANDIDATE_BRANCH && pr.head?.ref!==process.env.CANDIDATE_BRANCH) throw new Error(`PR_HEAD_REF_DRIFT:${process.env.CANDIDATE_BRANCH}:${pr.head?.ref}`);
            prBody=pr.body||'';
            labels=(pr.labels||[]).map(label=>label.name);
          }
          const normalizedEventName=dispatched ? 'pull_request' : process.env.EVENT_NAME;
          const context=normalizeGitHubDeliveryEvent({
            eventName: normalizedEventName,
            githubSha: process.env.GITHUB_SHA_VALUE,
            runId: process.env.RUN_ID,
            fallbackBaseSha,
            event: {
              pull_request: normalizedEventName === 'pull_request' ? {
                number: process.env.PR_NUMBER,
                base: { sha: process.env.PR_BASE_SHA },
                head: { sha: process.env.PR_HEAD_SHA },
              } : undefined,
              merge_group: process.env.EVENT_NAME === 'merge_group' ? {
                base_sha: process.env.MERGE_GROUP_BASE_SHA,
                head_sha: process.env.MERGE_GROUP_HEAD_SHA,
              } : undefined,
            },
          });
          const oneLoopPolicy=JSON.parse(await readFile('config/powerhouse-one-loop-v1.json','utf8'));
          const metadataAuthority=resolveDeliveryMetadataAuthority({
            prBody,
            manifest: oneLoopPolicy.deliveryCandidate,
          });
          const comparisonBaseSha=metadataAuthority.source === 'versioned-manifest'
            ? metadataAuthority.delivery.baseSha
            : context.baseSha;
          if(metadataAuthority.source === 'versioned-manifest' && metadataAuthority.delivery.baseSha !== context.baseSha) {
            console.log(`VERSIONED_BASE_SHA_MISMATCH drift-only manifest=${metadataAuthority.delivery.baseSha} event=${context.baseSha}`);
          }
          const changedPaths=execFileSync('git',['diff','--name-only',`${comparisonBaseSha}...${context.changeHeadSha}`],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean);
          const metadata={expectedPaths:metadataAuthority.expectedPaths,maxFiles:metadataAuthority.maxFiles};
          const hygiene=evaluateBranchHygiene({changedPaths,metadata,labels});
          if(!hygiene.ok) throw new Error(`Branch hygiene blocked delivery: ${JSON.stringify(hygiene)}`);
          const policy=JSON.parse(await readFile('config/brain-delivery-system.json','utf8'));
          const plan=createDeliveryPlan({changedPaths,headSha:context.candidateSha,policy});
          const suites=deriveRequiredTestSuites({lanes:plan.lanes.map(lane=>lane.id)});
          for(const lane of ['backend','portal','website','automation']) await appendFile(process.env.GITHUB_OUTPUT,`${lane}=${suites[lane]}\n`);
          await appendFile(process.env.GITHUB_OUTPUT,`base_sha=${comparisonBaseSha}\nchange_head_sha=${context.changeHeadSha}\ncandidate_sha=${context.candidateSha}\npr_number=${context.prNumber}\n`);
          console.log(JSON.stringify({context,metadataAuthority,comparisonBaseSha,changedPaths,hygiene,lanes:plan.lanes.map(lane=>lane.id),suites},null,2));
          NODE
      - name: Prove Supabase security gate blocks known unsafe patterns
        run: python3 scripts/brain/check_powerhouse_supabase_security.py --self-test
      - name: Enforce Supabase migration security contract
        run: python3 scripts/brain/check_powerhouse_supabase_security.py "${{ steps.scope.outputs.base_sha }}" "${{ steps.scope.outputs.change_head_sha }}"
      - name: Verify Portal V2 suite
        run: node --test portal-v2/tests/*.test.mjs
      - name: Install runtime dependencies for the unwired contracts
        run: npm install --no-audit --no-fund --silent
      - name: Verify previously unwired test contracts
        run: >-
          node --test
          tests/agents-delivery-contract.test.mjs
          tests/ai-token-usage.test.mjs
          tests/ai-usage-store.test.mjs
          tests/api-gateways.test.mjs
          tests/brain-production-release-readback-scope.test.mjs
          tests/brain-production-promotion-observability.test.mjs
          tests/delivery-test-coverage-guard.test.mjs
          tests/customer-portal-auth-race.test.mjs
          tests/daily-cost-optimizer.test.mjs
          tests/data-ai-passport.test.mjs
          tests/eu-ai-act-audit-report.test.mjs
          tests/eu-ai-act-controls.test.mjs
          tests/eu-ai-act-passport-ui.test.mjs
          tests/final-site-navigation-contract.test.mjs
          tests/internal-auth-scan-boundary.test.mjs
          tests/klantportaal-cockpit-contract.test.mjs
          tests/klantportaal-release-gates.test.mjs
          tests/klantportaal-v2-flow.test.mjs
          tests/klantportaal-v2-pages.test.mjs
          tests/money-page-conversion-contract.test.mjs
          tests/money-page-shared-loader.test.mjs
          tests/commercial-intent-pages-v1.test.mjs
          tests/netlify-identity-recovery-build.test.mjs
          tests/netlify-identity-recovery-flow.test.mjs
          tests/seo-homepage-context-slider-contract.test.mjs
          tests/delivery-een-portaal.test.mjs
          tests/klantportaal-demostand.test.mjs
          tests/klantportaal-tekenen-via-supabase.test.mjs
          tests/platform-promotion-activation-gate.test.mjs
          tests/seo-v18-canonical-header.test.mjs
          tests/seo-homepage-scroll-story-interaction.test.mjs
          tests/seo-homepage-process-progress.test.mjs
          tests/seo-search-console-revenue-sprint.test.mjs
          tests/single-obligation-owner-learning.test.mjs
          tests/site-shell-homepage-context-slider-navigation-resilience.test.mjs
          tests/social-learning-compatibility.test.mjs
          tests/social-learning-context.test.mjs
          tests/social-learning-e2e.test.mjs
          tests/social-learning-model.test.mjs
          tests/social-learning-schedule-contract.test.mjs
          tests/social-learning-store.test.mjs
          tests/social-outcome-ingest.test.mjs
          tests/supabase-production-schema-replay-parity-v1.test.mjs
          tests/unified-brain-production-handoff.test.mjs
          tests/v18-chrome-scoper.test.mjs
          tests/v18-standalone-compositor-safety.test.mjs
          tests/website-release-risk.test.mjs
      - name: Verify composable release control plane and agent completion contract
        run: >-
          node --test --test-concurrency=1
          tests/brain-fast-development-protocol-v2.test.mjs
          tests/brain-fast-execution.test.mjs
          tests/brain-powerhouse-engineering-os-contract.test.mjs
          tests/brain-powerhouse-autonomous-completion-authority.test.mjs
          tests/brain-autonomous-improvement-runtime.test.mjs
          tests/completion-supervisor.test.mjs
          tests/completion-supervisor-evidence.test.mjs
          tests/completion-supervisor-backfill.test.mjs
          tests/brain-parallel-engineering-fabric.test.mjs
          tests/delivery-github-event-context.test.mjs
          tests/delivery-driftless-merge-candidate.test.mjs
          tests/delivery-branch-hygiene-guard.test.mjs
          tests/delivery-required-branch-hygiene-wiring.test.mjs
          tests/delivery-hygiene-policy.test.mjs
          tests/brain-change-scoped-release-lanes.test.mjs
          tests/brain-moving-main-successor-guard.test.mjs
          tests/brain-composable-release-control-plane.test.mjs
          tests/brain-agents-delivery-contract.test.mjs
          tests/portal-v2-release-identity-invariant.test.mjs
          tests/website-static-syntax-preflight.test.mjs
      - name: Verify Fast Development Protocol v2 authority contract
        run: node scripts/brain/powerhouse-fast-development-protocol-v2.mjs --check

  backend:
    needs: preflight
    if: needs.preflight.outputs.backend == 'true'
    uses: ./.github/workflows/lane-backend.yml
    with:
      head_sha: ${{ needs.preflight.outputs.candidate_sha }}

  portal:
    needs: preflight
    if: needs.preflight.outputs.portal == 'true'
    uses: ./.github/workflows/lane-portal.yml
    with:
      head_sha: ${{ needs.preflight.outputs.candidate_sha }}

  automation:
    needs: preflight
    if: needs.preflight.outputs.automation == 'true'
    uses: ./.github/workflows/lane-automation.yml
    with:
      head_sha: ${{ needs.preflight.outputs.candidate_sha }}

  website:
    needs: preflight
    if: needs.preflight.outputs.website == 'true'
    uses: ./.github/workflows/lane-website.yml
    with:
      base_sha: ${{ needs.preflight.outputs.base_sha }}
      change_head_sha: ${{ needs.preflight.outputs.change_head_sha }}
      candidate_sha: ${{ needs.preflight.outputs.candidate_sha }}
      pr_number: ${{ needs.preflight.outputs.pr_number }}

  test:
    name: test
    if: always()
    needs: [hygiene, preflight, backend, portal, automation, website]
    runs-on: ubuntu-latest
    env:
      HYGIENE: ${{ needs.hygiene.result }}
      ADMITTED: ${{ needs.hygiene.outputs.admitted }}
      PREFLIGHT: ${{ needs.preflight.result }}
      SELECT_BACKEND: ${{ needs.preflight.outputs.backend }}
      SELECT_PORTAL: ${{ needs.preflight.outputs.portal }}
      SELECT_AUTOMATION: ${{ needs.preflight.outputs.automation }}
      SELECT_WEBSITE: ${{ needs.preflight.outputs.website }}
      BACKEND: ${{ needs.backend.result }}
      PORTAL: ${{ needs.portal.result }}
      AUTOMATION: ${{ needs.automation.result }}
      WEBSITE: ${{ needs.website.result }}
    steps:
      - name: Aggregate admission and selected lane results
        run: |
          set -euo pipefail
          test "$HYGIENE" = success
          test "$ADMITTED" = true
          test "$PREFLIGHT" = success
          [ "$SELECT_BACKEND" != true ] || [ "$BACKEND" = success ]
          [ "$SELECT_PORTAL" != true ] || [ "$PORTAL" = success ]
          [ "$SELECT_AUTOMATION" != true ] || [ "$AUTOMATION" = success ]
          [ "$SELECT_WEBSITE" != true ] || [ "$WEBSITE" = success ]
          echo "Delivery hygiene and selected release lanes are green."
