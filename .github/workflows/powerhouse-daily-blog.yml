name: Powerhouse daily blog from Supabase
# Canonical Supabase-first publisher. Protected PR metadata is the delivery authority.
# Reconcile hourly and after executor changes; idempotent per Europe/Amsterdam business date.

on:
  schedule:
    # Hourly reconciliation avoids a single missed GitHub schedule becoming a daily publication gap.
    # Minute 11 avoids the top-of-hour scheduler peak.
    - cron: '11 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/powerhouse-daily-blog.yml'
      - 'supabase/functions/powerhouse-blog-queue/**'
      - 'supabase/functions/powerhouse-blog-export/**'
  workflow_dispatch:
    inputs:
      business_date:
        description: 'Europe/Amsterdam business date (YYYY-MM-DD); empty=today'
        required: false
        default: ''

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: powerhouse-daily-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve Europe/Amsterdam business date
        id: day
        env:
          REQUESTED_DATE: ${{ github.event.inputs.business_date || '' }}
        run: |
          set -euo pipefail
          date="${REQUESTED_DATE:-$(TZ=Europe/Amsterdam date +%F)}"
          node -e "if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(process.argv[1])) process.exit(1)" "$date"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Deny any public draft exporter or internal PR evidence regression
        run: |
          set -euo pipefail
          node --test tests/brain-powerhouse-blog-export-security-contract.test.mjs

      - name: Reuse the existing writer for this obligation
        if: steps.day.outputs.run == 'true'
        id: writer
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.day.outputs.date }}
        run: |
          set -euo pipefail
          branch="automation/powerhouse-blog-$DATE"
          pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            # A tracked same-date candidate already owns this blog obligation.
            # Check it out BEFORE rendering: never reset it from main or discard
            # approved EN translations, BRAIN evidence and human review.
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            echo "existing_pr=$pr" >> "$GITHUB_OUTPUT"
            echo "SAME_OBLIGATION_CANDIDATE_PRESERVED:$DATE:$pr"
            echo "SAME_OBLIGATION_WRITER_ACTIVE:$DATE:$pr"
          fi
          # The canonical same-date blog was already protected-merged. Do not
          # re-render it and create a second publication candidate on an hourly retry.
          merged_pr="$(gh pr list --head "$branch" --base main --state merged --json number --jq '.[0].number // empty')"
          if [ -n "$merged_pr" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SAME_DATE_BLOG_PROTECTED_MERGE_PRESENT:$DATE:$merged_pr"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Authorize same-draft canonical quality repair
        if: steps.writer.outputs.existing_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.day.outputs.date }}
          PR: ${{ steps.writer.outputs.existing_pr }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:tools/content-growth/reviewed-blog-refresh.mjs" > /tmp/reviewed-blog-refresh.mjs
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > /tmp/blog-refresh-pr.json
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || { echo "::error::BLOG_EXPORT_SERVICE_AUTH_NOT_CONFIGURED"; exit 1; }
          curl --fail --silent --show-error -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" "https://adhjwmvyoixzjtmiroln.supabase.co/functions/v1/powerhouse-blog-export?date=$DATE" > /tmp/blog-refresh-source.json
          expected_head="$(git rev-parse HEAD)"
          decision="$(node /tmp/reviewed-blog-refresh.mjs /tmp/blog-refresh-pr.json /tmp/blog-refresh-source.json "brain/learning/powerhouse-blog-$DATE.json" "$DATE" "$GITHUB_REPOSITORY" "$expected_head")"
          if [ "$decision" = AUTHORIZED ]; then
            git config user.name "Powerhouse Daily Publisher"
            git config user.email "actions@users.noreply.github.com"
            git fetch origin main --no-tags
            git merge --no-edit origin/main
            echo "POWERHOUSE_BLOG_FORCE_REGENERATE=1" >> "$GITHUB_ENV"
            echo "POWERHOUSE_BLOG_SOURCE_SNAPSHOT=/tmp/blog-refresh-source.json" >> "$GITHUB_ENV"
            echo "QUALITY_REFRESH=true" >> "$GITHUB_ENV"
            echo "BLOG_EXPECTED_HEAD=$expected_head" >> "$GITHUB_ENV"
          fi

      - name: Render canonical Powerhouse artifact
        if: steps.day.outputs.run == 'true' && steps.writer.outputs.available == 'true'
        id: render
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 tools/site-shell/publish_powerhouse_blog_artifact.py "${{ steps.day.outputs.date }}" | tee /tmp/powerhouse-blog.json
          if grep -q '^NO_ACTION:' /tmp/powerhouse-blog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          slug="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/powerhouse-blog.json'))['slug'])
          PY
          )"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Persist one Brain evidence bundle with the daily candidate
        if: steps.render.outputs.changed == 'true'
        env:
          DATE: ${{ steps.day.outputs.date }}
        run: node tools/content-growth/daily-blog-proof-bundle.mjs "$DATE" /tmp/powerhouse-blog.json

      - name: Create exactly one protected candidate
        id: candidate
        if: steps.render.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.day.outputs.date }}
          SLUG: ${{ steps.render.outputs.slug }}
          EXISTING_PR: ${{ steps.writer.outputs.existing_pr || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # OpenAI is the sole approved translation provider for this publisher.
        run: |
          set -euo pipefail
          branch="automation/powerhouse-blog-$DATE"
          if [ -n "${EXISTING_PR:-}" ]; then
            # Do not reset a reviewed candidate when approved source changed.
            # Its original writer must apply an exact-diff in-place recovery.
            if [ "${QUALITY_REFRESH:-false}" != true ]; then
              echo "::error::EXISTING_DAILY_BLOG_REQUIRES_IN_PLACE_REFRESH:$DATE:$EXISTING_PR"
              exit 1
            fi
            git add "blog/$SLUG/index.html" blog/index.html blog/rss.xml sitemap.xml
            git diff --cached --quiet || git commit -m "blog: repair rejected canonical content $DATE"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$EXISTING_PR" > /tmp/blog-refresh-pr-write.json
            git show "$GITHUB_SHA:tools/content-growth/reviewed-blog-refresh.mjs" > /tmp/reviewed-blog-refresh.mjs
            [ "$(node /tmp/reviewed-blog-refresh.mjs /tmp/blog-refresh-pr-write.json /tmp/blog-refresh-source.json "brain/learning/powerhouse-blog-$DATE.json" "$DATE" "$GITHUB_REPOSITORY" "$BLOG_EXPECTED_HEAD")" = AUTHORIZED ] || { echo "::error::BLOG_REFRESH_WRITE_AUTHORITY_CHANGED"; exit 1; }
            git push --force-with-lease="refs/heads/$branch:$BLOG_EXPECTED_HEAD" origin "HEAD:$branch"
            echo "BLOG_REFRESHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "CANONICAL_DRAFT_REPAIRED:$DATE:$EXISTING_PR"
            exit 0
          fi
          git config user.name "Powerhouse Daily Publisher"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$branch" || true
          git checkout -B "$branch"
          git add "blog/$SLUG/index.html" blog/index.html blog/rss.xml sitemap.xml
          # The public GitHub repository is an EXTERNAL destination, not a private draft vault.
          # Keep Brain/learning, development ledger and change evidence OUT of public PR commits.
          # The canonical private Brain database owns those records (SEC-2026-10-29-TWINFIELD-EXPOSURE).
          git commit -m "blog: publish Powerhouse daily artifact $DATE"

          # Before creating the PR, replay the exact production transforms,
          # generate all missing English translations, and validate fail-closed.
          # Only the scoped JSON patch is added to the publication commit;
          # generated build output must never be committed accidentally.
          npm install --prefer-offline --no-audit --no-fund --silent
          STATIC_I18N_NETWORK=1 node tools/ci/netlify-build-entry.mjs \
            --prepare-i18n-cache="powerhouse-blog-$DATE.json"
          STATIC_I18N_NETWORK=0 STATIC_I18N_REQUIRE_CACHE=1 \
            node tools/site-shell/build-localized-routes.mjs --validate-cache
          patch="config/bg-static-i18n-en.d/powerhouse-blog-$DATE.json"
          if [ -f "$patch" ]; then
            git add -- "$patch"
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          fi
          git reset --hard HEAD
          git push --force-with-lease origin "HEAD:$branch"

          pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            base_sha="$(git rev-parse origin/main)"
            body="$(printf '%s\n\n%s\n%s\n%s\n%s\n%s\n' \
              'Canonical Supabase-first daily blog. Source: powerhouse_content_artifacts. One candidate per business date. Required checks, protected merge, Netlify and public readback remain authoritative.' \
              "Obligation-ID: content-publication:$DATE:blog" \
              'Delivery-Lane: website' \
              'Candidate-Type: implementation' \
              "Base-SHA: $base_sha" \
              'Supersedes: none')"
            gh pr create --base main --head "$branch" \
              --title "Powerhouse daily blog $DATE" \
              --body "$body"
            pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$pr" --auto --squash
          echo "PR=$pr slug=$SLUG auto-merge enabled"

      - name: Persist English cache before protected CI
        id: i18n
        # Runs for new and existing candidates. Never relaxes the required cache gate.
        if: always() && steps.day.outputs.run == 'true' && (env.QUALITY_REFRESH != 'true' || steps.candidate.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.day.outputs.date }}
          EXISTING_PR: ${{ steps.writer.outputs.existing_pr || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # OpenAI is the sole approved translation provider for this publisher.
        run: |
          set -euo pipefail
          branch="automation/powerhouse-blog-$DATE"
          pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "NO_OPEN_DAILY_CANDIDATE:$DATE"
            exit 0
          fi

          # Always derive this read/write from the current canonical candidate.
          # Discard uncommitted build output from a failed prior step first.
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$branch"
          if [ "${QUALITY_REFRESH:-false}" = true ]; then
            [ -n "${BLOG_REFRESHED_HEAD:-}" ] && [ "$(git rev-parse "origin/$branch")" = "$BLOG_REFRESHED_HEAD" ] || { echo "::error::BLOG_REFRESH_HEAD_DRIFT"; exit 1; }
          fi
          git checkout -B "$branch" "origin/$branch"
          npm install --prefer-offline --no-audit --no-fund --silent
          patch="config/bg-static-i18n-en.d/powerhouse-blog-$DATE.json"
          if [ -n "${EXISTING_PR:-}" ] && [ -f "$patch" ]; then
            # Existing candidate content can change after review. The stored
            # patch is an append-only translation authority, not evidence that
            # every current source phrase is translated. Never skip full
            # transformed-source validation because the patch file exists.
            echo "CANONICAL_EXISTING_CANDIDATE_I18N_RECONCILE:$pr:$DATE"
          fi

          # Replay exact production SEO/site transforms before extracting Dutch copy.
          # An absent provider credential is an explicit, retryable blocker,
          # never permission to publish a partly translated /en route.
          STATIC_I18N_NETWORK=1 node tools/ci/netlify-build-entry.mjs \
            --prepare-i18n-cache="powerhouse-blog-$DATE.json"
          STATIC_I18N_NETWORK=0 STATIC_I18N_REQUIRE_CACHE=1 \
            node tools/site-shell/build-localized-routes.mjs --validate-cache

          patch="config/bg-static-i18n-en.d/powerhouse-blog-$DATE.json"
          if [ -f "$patch" ]; then
            git add -- "$patch"
          fi
          if ! git diff --cached --quiet; then
            git config user.name "Powerhouse Daily Publisher"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "i18n: complete English cache for Powerhouse blog $DATE"
            git push origin "HEAD:$branch"
            echo "CANONICAL_I18N_CACHE_UPDATED:$pr:$DATE"
          else
            echo "CANONICAL_I18N_CACHE_ALREADY_COMPLETE:$pr:$DATE"
          fi
          if [ "${QUALITY_REFRESH:-false}" = true ]; then
            echo "BLOG_VERIFIED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Self-heal required checks for the canonical daily candidate
        if: always() && steps.day.outputs.run == 'true' && steps.i18n.outcome == 'success' && (env.QUALITY_REFRESH != 'true' || steps.candidate.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.day.outputs.date }}
        run: |
          set -euo pipefail
          branch="automation/powerhouse-blog-$DATE"
          pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "No open daily candidate remains; publication either completed or produced no action."
            exit 0
          fi
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")"
          base_sha="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.base.sha)' "$pr_json")"
          head_sha="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.head.sha)' "$pr_json")"
          # BEGIN BLOG_REFRESH_RELEASE_FENCE
          if [ "${QUALITY_REFRESH:-false}" = true ]; then
            [ -n "${BLOG_REFRESHED_HEAD:-}" ] && [ -n "${BLOG_VERIFIED_HEAD:-}" ] && [ "$head_sha" = "$BLOG_VERIFIED_HEAD" ] || { echo "::error::BLOG_REFRESH_RELEASE_IDENTITY_UNPROVEN"; exit 1; }
          fi
          # END BLOG_REFRESH_RELEASE_FENCE
          body="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.body||"")' "$pr_json")"
          labels="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(JSON.stringify((x.labels||[]).map(v=>v.name)))' "$pr_json")"
          if [ "${QUALITY_REFRESH:-false}" = true ]; then
            PR_BODY="$body" BASE_SHA="$base_sha" node -e 'const fs=require("fs");fs.writeFileSync("/tmp/blog-refresh-body.md",process.env.PR_BODY.replace(/^Base-SHA:.*$/m,"Base-SHA: "+process.env.BASE_SHA));'
            gh pr edit "$pr" --body-file /tmp/blog-refresh-body.md
            body="$(cat /tmp/blog-refresh-body.md)"
          fi
          test_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs" --jq '[.check_runs[] | select(.name=="test")] | sort_by(.started_at) | last | (.conclusion // .status // "missing")' 2>/dev/null || echo missing)"
          case "$test_state" in
            success)
              echo "REQUIRED_TEST_ALREADY_GREEN:$pr:$head_sha"
              ;;
            queued|in_progress)
              echo "REQUIRED_TEST_ACTIVE:$pr:$head_sha:$test_state"
              ;;
            *)
              echo "REQUIRED_TEST_SELF_HEAL_DISPATCH:$pr:$head_sha:from=$test_state"
              gh workflow run required-test.yml --ref "$branch"                 -f pr_number="$pr"                 -f base_sha="$base_sha"                 -f head_sha="$head_sha"                 -f candidate_branch="$branch"                 -f pr_body="$body"                 -f pr_labels_json="$labels"
              ;;
          esac
          if [ "${QUALITY_REFRESH:-false}" = true ]; then
            expected_title="BRAIN delivery PR #$pr $head_sha"
            brain_query="repos/$GITHUB_REPOSITORY/actions/workflows/unified-brain-delivery.yml/runs?branch=main&event=workflow_dispatch&per_page=100"
            run="$(gh api "$brain_query" --jq ".workflow_runs | map(select(.display_title == \"$expected_title\")) | sort_by(.created_at) | last | .id // empty")"
            if [ -z "$run" ]; then
              gh workflow run unified-brain-delivery.yml --ref main -f pr_number="$pr" -f base_sha="$base_sha" -f head_sha="$head_sha" -f candidate_branch="$branch" -f verification_only=true
            fi
            brain_ok=false
            for attempt in $(seq 1 72); do
              state="$(gh api "$brain_query" --jq ".workflow_runs | map(select(.display_title == \"$expected_title\")) | sort_by(.created_at) | last | (.conclusion // .status // \"missing\")")"
              case "$state" in
                success) brain_ok=true; break ;;
                failure|cancelled|timed_out|action_required) echo "::error::BLOG_REPAIR_BRAIN_FAILED:$state:$head_sha"; exit 1 ;;
                *) sleep 5 ;;
              esac
            done
            [ "$brain_ok" = true ] || { echo "::error::BLOG_REPAIR_BRAIN_PENDING:$head_sha"; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > /tmp/blog-refresh-pr-ready.json
            [ "$(node /tmp/reviewed-blog-refresh.mjs /tmp/blog-refresh-pr-ready.json /tmp/blog-refresh-source.json "brain/learning/powerhouse-blog-$DATE.json" "$DATE" "$GITHUB_REPOSITORY" "$head_sha")" = AUTHORIZED ] || { echo "::error::BLOG_REFRESH_READY_AUTHORITY_CHANGED"; exit 1; }
            gh pr ready "$pr"
          fi
          gh pr merge "$pr" --auto --squash

      - name: Reconcile merged daily blog only after production HTTP and immutable release proof
        if: always() && steps.day.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUSINESS_DATE: ${{ steps.day.outputs.date }}
        run: |
          node --test tests/brain-daily-blog-production-closure-v1.test.mjs
          node tools/content-growth/reconcile-merged-blog-live.mjs "$BUSINESS_DATE"
