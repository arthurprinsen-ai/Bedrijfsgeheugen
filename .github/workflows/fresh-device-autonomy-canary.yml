name: Fresh Device Autonomy Canary
on:
  workflow_dispatch:
permissions: {contents: read, pull-requests: read}
jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: node --test tests/brain-fresh-device-canary.test.mjs
      - run: node scripts/brain/device-certify.mjs
