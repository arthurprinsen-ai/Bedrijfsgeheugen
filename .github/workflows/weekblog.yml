name: Weekblog
# Draait maandag, woensdag en vrijdag. Haalt het eerstvolgende artikel met
# status "Gepland" EN een publicatiedatum van vandaag of eerder uit de Notion-kalender,
# laat Claude het schrijven, valideert deterministisch en publiceert daarna veilig.
# Pas na aantoonbaar succesvolle repository-publicatie wordt Notion bijgewerkt.
#
# Haalt ook Meta-omschrijving, Interne links, SEO-blok, Paginatype en Cluster op.
# De interne links worden daardoor niet door Claude bedacht maar voorgeschreven
# vanuit de zoekwoordenstrategie in Notion.
on:
  schedule:
    - cron: '0 5 * * 1,3,5'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optioneel: forceer een specifieke slug uit de kalender'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

# GEDEELD SLOT. Alle workflows die main kunnen muteren gebruiken dezelfde groep.
# Een actieve writeback wordt nooit geannuleerd en kan niet parallel lopen met
# een andere bekende repo-schrijver.
concurrency:
  group: repo-schrijven
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Volgend artikel ophalen uit Notion
        id: kalender
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_BLOG_DB }}
          FORCE_SLUG: ${{ github.event.inputs.slug }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, pathlib, uuid, datetime

          token = os.environ.get("NOTION_TOKEN", "")
          db    = os.environ.get("NOTION_DB", "")
          force = (os.environ.get("FORCE_SLUG") or "").strip()
          out   = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          vandaag = datetime.date.today().isoformat()

          def tekst(props, naam):
              v = props.get(naam) or {}
              arr = v.get("rich_text") or v.get("title") or []
              return "".join(x.get("plain_text", "") for x in arr).strip()

          def keuze(props, naam):
              v = props.get(naam) or {}
              return ((v.get("select") or {}) or {}).get("name", "")

          def rollup_keuze(props, naam):
              v = props.get(naam) or {}
              r = v.get("rollup") or {}
              for item in (r.get("array") or []):
                  s = item.get("select") or {}
                  if s.get("name"):
                      return s["name"]
              return ""

          def schrijf(f, sleutel, waarde):
              waarde = waarde or ""
              if "\n" in waarde:
                  d = "EOF_" + uuid.uuid4().hex
                  f.write("%s<<%s\n%s\n%s\n" % (sleutel, d, waarde, d))
              else:
                  f.write("%s=%s\n" % (sleutel, waarde))

          kandidaten = []

          if token and db:
              print("Bron: Notion-kalender")
              req = urllib.request.Request(
                  "https://api.notion.com/v1/databases/%s/query" % db,
                  data=json.dumps({
                      "filter": {"and": [
                          {"property": "Status", "select": {"equals": "Gepland"}},
                          {"property": "Publicatiedatum", "date": {"on_or_before": vandaag}},
                      ]},
                      "sorts": [{"property": "Publicatiedatum", "direction": "ascending"}],
                      "page_size": 50,
                  }).encode(),
                  headers={
                      "Authorization": "Bearer " + token,
                      "Notion-Version": "2022-06-28",
                      "Content-Type": "application/json",
                  },
                  method="POST")
              for r in json.load(urllib.request.urlopen(req))["results"]:
                  p = r["properties"]
                  kandidaten.append({
                      "page_id": r["id"],
                      "slug": tekst(p, "Slug"),
                      "titel": tekst(p, "Titel"),
                      "zoekwoord": tekst(p, "Focus-zoekwoord"),
                      "pijler": keuze(p, "Pijler"),
                      "meta": tekst(p, "Meta-omschrijving"),
                      "interne_links": tekst(p, "Interne links"),
                      "seo_blok": tekst(p, "SEO-blok"),
                      "paginatype": keuze(p, "Paginatype"),
                      "cluster": rollup_keuze(p, "Cluster"),
                  })
          else:
              print("Bron: blog/kalender.json (geen NOTION_TOKEN/NOTION_BLOG_DB ingesteld)")
              data = json.loads(pathlib.Path("blog/kalender.json").read_text(encoding="utf-8"))
              for a in data["artikelen"]:
                  kandidaten.append({
                      "page_id": "",
                      "slug": a["slug"],
                      "titel": a["titel"],
                      "zoekwoord": a.get("zoekwoord", ""),
                      "pijler": a.get("pijler", ""),
                      "meta": "",
                      "interne_links": "",
                      "seo_blok": "",
                      "paginatype": "",
                      "cluster": "",
                  })

          gekozen = None
          for k in kandidaten:
              if not k["slug"]:
                  continue
              if force and k["slug"] != force:
                  continue
              if pathlib.Path("blog", k["slug"]).exists():
                  print("overslaan (bestaat al):", k["slug"])
                  continue
              gekozen = k
              break

          with out.open("a") as f:
              if not gekozen:
                  print("Geen gepland artikel gevonden dat nog niet bestaat.")
                  f.write("gevonden=false\n")
              else:
                  print("Te schrijven:", gekozen["slug"])
                  f.write("gevonden=true\n")
                  for k, v in gekozen.items():
                      schrijf(f, k, v)
          PY

      - name: Bestaande slugs verzamelen
        id: slugs
        if: steps.kalender.outputs.gevonden == 'true'
        run: |
          echo "lijst=$(ls -d blog/*/ 2>/dev/null | sed 's|blog/||;s|/||' | paste -sd', ')" >> "$GITHUB_OUTPUT"

      - name: Sleutel controleren
        if: steps.kalender.outputs.gevonden == 'true'
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is leeg of bestaat niet in de repo-secrets."
            exit 1
          fi
          echo "Sleutel aanwezig, lengte ${#KEY}, begint met ${KEY:0:7}"
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" https://api.anthropic.com/v1/messages \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
            -d '{"model":"claude-sonnet-5","max_tokens":16,"messages":[{"role":"user","content":"ok"}]}')
          echo "Antwoord van de API: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::De API antwoordde met HTTP $code. Zie hieronder."
            cat /tmp/resp.json
            echo "Let op: is dit 'model not found', dan bestaat het modelnummer niet meer."
            echo "Werkende namen zijn onder meer claude-sonnet-5 en claude-opus-5."
            exit 1
          fi

      - name: Artikel schrijven
        if: steps.kalender.outputs.gevonden == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-5 --max-turns 60 --allowedTools Read,Write,Edit,Glob,Grep,WebSearch"
          prompt: |
            Schrijf één blogartikel voor www.bedrijfsgeheugen.nl (statische HTML-site, Nederlands).

            OPDRACHT UIT DE KALENDER
            - Titel: ${{ steps.kalender.outputs.titel }}
            - Slug: ${{ steps.kalender.outputs.slug }}
            - Focus-zoekwoord: ${{ steps.kalender.outputs.zoekwoord }}
            - Pijler: ${{ steps.kalender.outputs.pijler }}
            - Cluster: ${{ steps.kalender.outputs.cluster }}
            - Paginatype: ${{ steps.kalender.outputs.paginatype }}
            Wijk niet af van deze slug. De titel mag je aanscherpen als dat de zoekvraag beter dekt.

            VOORGESCHREVEN META-OMSCHRIJVING
            ${{ steps.kalender.outputs.meta }}
            Staat hier iets, gebruik het dan letterlijk als meta description en og:description.
            Is dit leeg, schrijf er dan zelf een van 140 tot 155 tekens.

            VOORGESCHREVEN INTERNE LINKS
            ${{ steps.kalender.outputs.interne_links }}

            SEO-BLOK UIT DE ZOEKWOORDENSTRATEGIE
            ${{ steps.kalender.outputs.seo_blok }}

            Staat er iets bij interne links of in het SEO-blok, dan is dat GEEN suggestie maar een
            opdracht. Neem die links op met de opgegeven anchortekst, in de opgegeven alinea. Wijkt
            een genoemde slug af van wat er echt onder blog/ staat, controleer dan met Glob en gebruik
            de bestaande slug; verzin er nooit een bij. Is beide leeg, val dan terug op regel 6 hieronder.

            BESTAANDE ARTIKELEN OM NAAR TE LINKEN
            ${{ steps.slugs.outputs.lijst }}

            CLUSTERREGEL
            - Ben je een Clusterblog: link naar de pijlerpagina van je cluster, naar twee andere
              artikelen uit hetzelfde cluster, en naar één dienstpagina.
            - Ben je een Pijlerpagina: link naar minimaal vier artikelen uit je eigen cluster.
            - Anchortekst beschrijft altijd waar je heen gaat. Nooit "lees meer" of "klik hier".

            BEDRIJF
            Bedrijfsgeheugen helpt mkb-bedrijven (3-250 medewerkers) met digitalisering zonder groot
            nieuw systeem: koppelingen tussen AFAS, Exact Online en Microsoft 365, één klantoverzicht,
            offerte-opvolging, dashboards en AI-trainingen (Copilot, ChatGPT, Claude).
            Payoff: "Strak geregeld. Zonder traject." De vijand in de positionering is het IT-project:
            maanden doorlooptijd, uitloop, uurtje-factuurtje, een systeem dat niemand gebruikt.
            Bedrijfsgeheugen verkoopt zelf geen software en verdient niets aan licenties.

            AANSPREEKVORM: "je", niet "u". Toon: praktische adviseur, gewone taal, droge humor mag,
            geen jargon en geen verkooppraat.

            PRIJZEN
            - Gratis zelfscan: /zelfscan
            - Bedrijfsscan: EUR 2.900 excl. btw, één dag op locatie, rapport binnen een week,
              volledig verrekend bij vervolg
            - AFAS/Exact-koppeling: EUR 3.500 tot EUR 12.000, vaste prijs vooraf
            - Connect (beheer en monitoring): vanaf EUR 29 per maand

            URL'S: gebruik schone URL's zonder .html: /zelfscan, /expertises, /afas-koppeling,
            /over-ons, /connect, /data-ai-cockpit en /blog/<slug>/.

            SCHRIJFREGELS
            1. Beantwoord de vraag uit de titel in de eerste twee zinnen.
            2. Het focus-zoekwoord staat exact in titel, eerste honderd woorden, minstens één H2 en meta description.
            3. Gebruik concrete getallen en navolgbare rekensommen.
            4. Noem relevante systemen bij naam.
            5. 900 tot 1400 woorden; volledigheid gaat voor lengte.
            6. Structuur: H1, lead, 4 tot 6 H2-secties, concreet stappenplan of tabel, FAQ met 4 tot 5 vragen, CTA.
            7. Eén geverifieerde externe bron; bij twijfel geen externe link.
            8. Voorkom dubbel werk en link naar bestaande artikelen als die dezelfde vraag al beantwoorden.

            TERUGLINKEN
            Voeg in de pijlerpagina van dit cluster een relevante link naar het nieuwe artikel toe.
            Bestaat die pijlerpagina niet, sla dit over en meld dat in je samenvatting.

            BOUWEN
            Maak blog/${{ steps.kalender.outputs.slug }}/index.html in exact de huisstijl van de site.
            Neem een bestaand artikel onder blog/ als template en vervang alleen de inhoud van <main>.
            Precies één <h1> per pagina.

            HEAD: title max 60 tekens, meta description 140-155 tekens, canonical
            https://www.bedrijfsgeheugen.nl/blog/${{ steps.kalender.outputs.slug }}/, og:title,
            og:description en og:url. Zet direct onder de canonical:
            <meta name="bg-zoekwoord" content="${{ steps.kalender.outputs.zoekwoord }}">
            Voeg geldige JSON-LD toe met BlogPosting, FAQPage en BreadcrumbList.

            BEELD — FOTO: als er een Beeld URL is, plaats die direct onder de h1 met alt, width,
            height en decoding. Geen loading="lazy" op dit beeld. Neem hem ook op in JSON-LD.

            BEELD — FIGUREN: elk artikel krijgt twee tot vier inhoudelijke inline SVG-figuren in
            de huisstijl, toegankelijk met role="img" en title, responsief en mobiel leesbaar.

            BIJWERKEN: blog/index.html, blog/rss.xml en sitemap.xml. Wijzig verder niets aan bestaande
            pagina's behalve hooguit de relevante pijlerpagina. Verwijder nooit bestaande artikelen.

            CONTROLE VOOR OPLEVERING: precies één h1, geldige JSON-LD, canonical zonder .html,
            bg-zoekwoord exact gelijk aan het focus-zoekwoord, geldige figuren en interne links.

            PUBLICATIEGRENS
            Wijzig uitsluitend de inhoudelijke bestanden die hierboven zijn toegestaan. Voer zelf
            geen versiebeheer- of publicatiehandelingen uit. Een deterministische vervolgstap
            controleert exact welke bestanden zijn gewijzigd en verzorgt pas daarna de publicatie.
            Meld in je samenvatting alleen welke inhoud je hebt aangepast.

      - name: Deterministic publication contract checks
        if: steps.kalender.outputs.gevonden == 'true'
        env:
          SLUG: ${{ steps.kalender.outputs.slug }}
          FOCUS_KEYWORD: ${{ steps.kalender.outputs.zoekwoord }}
        run: python3 scripts/ci/validate_blog_writeback.py publish "$SLUG" "$FOCUS_KEYWORD"

      - name: Commit and push validated changes
        if: steps.kalender.outputs.gevonden == 'true'
        env:
          COMMIT_MESSAGE: 'blog: ${{ steps.kalender.outputs.slug }}'
        run: bash scripts/ci/commit_validated_main.sh "$COMMIT_MESSAGE"

      - name: Notion bijwerken
        if: steps.kalender.outputs.gevonden == 'true' && steps.kalender.outputs.page_id != ''
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_ID: ${{ steps.kalender.outputs.page_id }}
          SLUG: ${{ steps.kalender.outputs.slug }}
        run: |
          python3 - <<'PY'
          import json, os, datetime, urllib.request

          vandaag = datetime.date.today().isoformat()
          body = {"properties": {
              "Status": {"select": {"name": "Gepubliceerd"}},
              "Publicatiedatum": {"date": {"start": vandaag}},
              "URL": {"url": "https://www.bedrijfsgeheugen.nl/blog/%s/" % os.environ["SLUG"]},
          }}
          req = urllib.request.Request(
              "https://api.notion.com/v1/pages/" + os.environ["PAGE_ID"],
              data=json.dumps(body).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["NOTION_TOKEN"],
                  "Notion-Version": "2022-06-28",
                  "Content-Type": "application/json",
              },
              method="PATCH")
          urllib.request.urlopen(req)
          print("Notion bijgewerkt:", os.environ["SLUG"])
          PY

      - name: Niets te doen
        if: steps.kalender.outputs.gevonden != 'true'
        run: echo "Geen artikel met status Gepland in de kalender. Vul de Notion-kalender aan."
