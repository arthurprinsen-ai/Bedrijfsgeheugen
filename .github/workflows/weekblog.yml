name: Weekblog
# Draait maandag, woensdag en vrijdag. Haalt het eerstvolgende geplande artikel
# uit de Notion-kalender. AI bereidt uitsluitend contentbestanden voor; de workflow
# valideert, staged, commit en pusht daarna deterministisch onder het gedeelde schrijverslot.
on:
  schedule:
    - cron: '0 5 * * 1,3,5'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optioneel: forceer een specifieke slug uit de kalender'
        required: false
        default: ''
      delivery_mode:
        description: 'Maak uitsluitend een gecontroleerde BRAIN v2 candidate PR'
        type: choice
        required: true
        default: candidate-pr
        options:
          - candidate-pr

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: repo-schrijven
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Exacte basis vastleggen
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Volgend artikel ophalen uit Notion
        id: kalender
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_BLOG_DB }}
          FORCE_SLUG: ${{ github.event.inputs.slug }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, pathlib, uuid, datetime

          token = os.environ.get("NOTION_TOKEN", "")
          db    = os.environ.get("NOTION_DB", "")
          force = (os.environ.get("FORCE_SLUG") or "").strip()
          out   = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          vandaag = datetime.date.today().isoformat()

          def tekst(props, naam):
              v = props.get(naam) or {}
              arr = v.get("rich_text") or v.get("title") or []
              return "".join(x.get("plain_text", "") for x in arr).strip()

          def keuze(props, naam):
              v = props.get(naam) or {}
              return ((v.get("select") or {}) or {}).get("name", "")

          def rollup_keuze(props, naam):
              v = props.get(naam) or {}
              r = v.get("rollup") or {}
              for item in (r.get("array") or []):
                  s = item.get("select") or {}
                  if s.get("name"):
                      return s["name"]
              return ""

          def schrijf(f, sleutel, waarde):
              waarde = waarde or ""
              if "\n" in waarde:
                  d = "EOF_" + uuid.uuid4().hex
                  f.write("%s<<%s\n%s\n%s\n" % (sleutel, d, waarde, d))
              else:
                  f.write("%s=%s\n" % (sleutel, waarde))

          kandidaten = []
          if token and db:
              print("Bron: Notion-kalender")
              req = urllib.request.Request(
                  "https://api.notion.com/v1/databases/%s/query" % db,
                  data=json.dumps({
                      "filter": {"and": [
                          {"property": "Status", "select": {"equals": "Gepland"}},
                          {"property": "Publicatiedatum", "date": {"on_or_before": vandaag}},
                      ]},
                      "sorts": [{"property": "Publicatiedatum", "direction": "ascending"}],
                      "page_size": 50,
                  }).encode(),
                  headers={
                      "Authorization": "Bearer " + token,
                      "Notion-Version": "2022-06-28",
                      "Content-Type": "application/json",
                  },
                  method="POST")
              for r in json.load(urllib.request.urlopen(req))["results"]:
                  p = r["properties"]
                  kandidaten.append({
                      "page_id": r["id"],
                      "slug": tekst(p, "Slug"),
                      "titel": tekst(p, "Titel"),
                      "zoekwoord": tekst(p, "Focus-zoekwoord"),
                      "pijler": keuze(p, "Pijler"),
                      "meta": tekst(p, "Meta-omschrijving"),
                      "interne_links": tekst(p, "Interne links"),
                      "seo_blok": tekst(p, "SEO-blok"),
                      "paginatype": keuze(p, "Paginatype"),
                      "cluster": rollup_keuze(p, "Cluster"),
                  })
          else:
              print("Bron: blog/kalender.json (geen NOTION_TOKEN/NOTION_BLOG_DB ingesteld)")
              data = json.loads(pathlib.Path("blog/kalender.json").read_text(encoding="utf-8"))
              for a in data["artikelen"]:
                  kandidaten.append({
                      "page_id": "",
                      "slug": a["slug"],
                      "titel": a["titel"],
                      "zoekwoord": a.get("zoekwoord", ""),
                      "pijler": a.get("pijler", ""),
                      "meta": "",
                      "interne_links": "",
                      "seo_blok": "",
                      "paginatype": "",
                      "cluster": "",
                  })

          gekozen = None
          for k in kandidaten:
              if not k["slug"]:
                  continue
              if force and k["slug"] != force:
                  continue
              if pathlib.Path("blog", k["slug"]).exists():
                  print("overslaan (bestaat al):", k["slug"])
                  continue
              gekozen = k
              break

          with out.open("a") as f:
              if not gekozen:
                  print("Geen gepland artikel gevonden dat nog niet bestaat.")
                  f.write("gevonden=false\n")
              else:
                  print("Te schrijven:", gekozen["slug"])
                  f.write("gevonden=true\n")
                  for k, v in gekozen.items():
                      schrijf(f, k, v)
          PY

      - name: Bestaande slugs verzamelen
        id: slugs
        if: steps.kalender.outputs.gevonden == 'true'
        run: |
          echo "lijst=$(ls -d blog/*/ 2>/dev/null | sed 's|blog/||;s|/||' | paste -sd', ')" >> "$GITHUB_OUTPUT"

      - name: Sleutel controleren
        if: steps.kalender.outputs.gevonden == 'true'
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is leeg of bestaat niet in de repo-secrets."
            exit 1
          fi
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" https://api.anthropic.com/v1/messages \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
            -d '{"model":"claude-sonnet-5","max_tokens":16,"messages":[{"role":"user","content":"ok"}]}')
          echo "Antwoord van de API: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::De API antwoordde met HTTP $code."
            cat /tmp/resp.json
            exit 1
          fi

      - name: Artikel schrijven
        if: steps.kalender.outputs.gevonden == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-5 --max-turns 60 --allowedTools Read,Write,Edit,Glob,Grep,WebSearch"
          prompt: |
            Schrijf één blogartikel voor www.bedrijfsgeheugen.nl (statische HTML-site, Nederlands).

            OPDRACHT UIT DE KALENDER
            - Titel: ${{ steps.kalender.outputs.titel }}
            - Slug: ${{ steps.kalender.outputs.slug }}
            - Focus-zoekwoord: ${{ steps.kalender.outputs.zoekwoord }}
            - Pijler: ${{ steps.kalender.outputs.pijler }}
            - Cluster: ${{ steps.kalender.outputs.cluster }}
            - Paginatype: ${{ steps.kalender.outputs.paginatype }}
            Wijk niet af van deze slug. De titel mag je aanscherpen als dat de zoekvraag beter dekt.

            VOORGESCHREVEN META-OMSCHRIJVING
            ${{ steps.kalender.outputs.meta }}
            Staat hier iets, gebruik het dan letterlijk als meta description en og:description.
            Is dit leeg, schrijf er dan zelf een van 140 tot 155 tekens.

            VOORGESCHREVEN INTERNE LINKS
            ${{ steps.kalender.outputs.interne_links }}

            SEO-BLOK UIT DE ZOEKWOORDENSTRATEGIE
            ${{ steps.kalender.outputs.seo_blok }}

            Staat er iets bij interne links of in het SEO-blok, dan is dat een opdracht. Neem die
            links op met de opgegeven anchortekst en in de opgegeven alinea. Wijkt een genoemde slug
            af van wat echt onder blog/ staat, gebruik dan de bestaande slug; verzin er nooit een bij.

            BESTAANDE ARTIKELEN OM NAAR TE LINKEN
            ${{ steps.slugs.outputs.lijst }}

            CLUSTERREGEL
            - Clusterblog: link naar de pijlerpagina, twee andere artikelen uit hetzelfde cluster
              en één dienstpagina.
            - Pijlerpagina: link naar minimaal vier artikelen uit het eigen cluster.
            - Gebruik beschrijvende anchortekst, nooit "lees meer" of "klik hier".

            BEDRIJF EN TOON
            Bedrijfsgeheugen helpt mkb-bedrijven (3-250 medewerkers) met digitalisering zonder groot
            nieuw systeem: koppelingen tussen AFAS, Exact Online en Microsoft 365, één klantoverzicht,
            offerte-opvolging, dashboards en AI-trainingen (Copilot, ChatGPT, Claude).
            Payoff: "Strak geregeld. Zonder traject." Spreek aan met "je". Schrijf praktisch,
            concreet, in gewone taal en zonder verkooppraat of consultancyjargon.

            PRIJZEN — gebruik exact deze, verzin nooit andere prijzen
            - Gratis zelfscan: /zelfscan
            - Bedrijfsscan: EUR 2.900 excl. btw, één dag op locatie, rapport binnen een week,
              volledig verrekend bij vervolg
            - AFAS/Exact-koppeling: EUR 3.500 tot EUR 12.000, vaste prijs vooraf
            - Connect: vanaf EUR 29 per maand

            URL'S
            Gebruik schone URL's zonder .html: /zelfscan, /expertises, /afas-koppeling, /over-ons,
            /connect, /data-ai-cockpit en /blog/<slug>/.

            SCHRIJFREGELS
            1. Beantwoord de titelvraag in de eerste twee zinnen.
            2. Focus-zoekwoord exact in titel, eerste 100 woorden, minstens één H2 en meta description.
            3. Gebruik concrete getallen en navolgbare rekensommen waar relevant.
            4. Noem systemen bij naam wanneer relevant.
            5. 900 tot 1400 woorden; volledigheid is belangrijker dan lengte.
            6. H1, lead, 4-6 vraaggerichte H2's, concreet stappenplan of tabel, FAQ 4-5 vragen en CTA.
            7. Eén geverifieerde externe bron van CBS, KVK, Rijksoverheid of Europese Commissie; bij
               twijfel geen externe link.
            8. Voorkom dubbel werk en link naar bestaande artikelen die dezelfde deelvraag behandelen.

            TERUGLINKEN
            Voeg in maximaal één bestaande pijlerpagina van dit cluster een beschrijvende teruglink
            naar het nieuwe artikel toe. Bestaat die pijlerpagina niet, sla dit over.

            BOUWEN
            Maak blog/${{ steps.kalender.outputs.slug }}/index.html in exact de bestaande huisstijl.
            Neem een bestaand artikel als template en vervang alleen de inhoud van <main>. Precies één h1.
            Head: title max 60 tekens, meta description 140-155 tekens, canonical
            https://www.bedrijfsgeheugen.nl/blog/${{ steps.kalender.outputs.slug }}/, og:title,
            og:description en og:url. Zet direct onder canonical:
            <meta name="bg-zoekwoord" content="${{ steps.kalender.outputs.zoekwoord }}">
            Voeg één geldige application/ld+json @graph toe met BlogPosting, FAQPage en BreadcrumbList;
            datePublished en dateModified zijn vandaag, auteur Arthur Prinsen, taal nl-NL.

            FIGUREN
            Voeg minstens twee en hoogstens vier functionele inline SVG-figuren toe in de huisstijl.
            Elke figuur krijgt figure/figcaption, role="img", title, viewBox, width="100%",
            height="auto", max-width 720px en minimaal 14px tekst. Geen decoratieve figuren.

            BIJWERKEN
            Werk blog/index.html bij met een nieuwe kaart bovenaan, blog/rss.xml met een item bovenaan
            en sitemap.xml met de nieuwe schone URL en lastmod vandaag. Wijzig verder niets aan bestaande
            pagina's behalve eventueel die ene cluster-pijlerpagina. Verwijder nooit bestaande artikelen.

            CONTROLE VOOR OPLEVERING
            Precies één h1, geldige JSON-LD, canonical zonder .html, exact focus-zoekwoord in
            bg-zoekwoord, minstens twee figuren met figcaption, interne links zonder .html, geen link
            naar een niet-bestaande slug en minimaal drie interne links naar blog- of dienstpagina's.

            Lever uitsluitend de benodigde bestandswijzigingen op. De workflow valideert zelfstandig
            de changed-file allowlist en verzorgt staging, commit, conflictbehandeling en publicatie.
            Wijzig alleen het nieuwe artikel, blog/index.html, blog/rss.xml, sitemap.xml en eventueel
            één bestaande cluster-pijlerpagina.

      - name: Deterministic publication contract checks
        if: steps.kalender.outputs.gevonden == 'true'
        env:
          SLUG: ${{ steps.kalender.outputs.slug }}
          ZOEKWOORD: ${{ steps.kalender.outputs.zoekwoord }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess

          slug = os.environ['SLUG']
          zoekwoord = os.environ['ZOEKWOORD']
          article = f'blog/{slug}/index.html'
          tracked = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          untracked = subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
          changed = sorted(set(tracked + untracked))

          required = {article, 'blog/index.html', 'blog/rss.xml', 'sitemap.xml'}
          missing = sorted(required - set(changed))
          assert not missing, f'verplichte publicatiebestanden ontbreken: {missing}; changed={changed}'
          optional_blog = [p for p in changed if re.fullmatch(r'blog/[a-z0-9-]+/index\.html', p) and p != article]
          assert len(optional_blog) <= 1, f'hooguit één pijlerpagina mag aanvullend wijzigen: {optional_blog}'
          allowed = required | set(optional_blog)
          unexpected = [p for p in changed if p not in allowed]
          assert not unexpected, f'onverwachte bestanden gewijzigd: {unexpected}'

          text = pathlib.Path(article).read_text(encoding='utf-8')
          assert len(re.findall(r'<h1(?:\s|>)', text)) == 1, 'exact één h1 vereist'
          canonical = re.search(r'<link rel="canonical" href="([^"]+)">', text)
          assert canonical and canonical.group(1) == f'https://www.bedrijfsgeheugen.nl/blog/{slug}/', 'canonical onjuist'
          meta_keyword = re.search(r'<meta name="bg-zoekwoord" content="([^"]*)">', text)
          assert meta_keyword and meta_keyword.group(1) == zoekwoord, 'bg-zoekwoord wijkt af van kalender'
          ld = re.search(r'<script type="application/ld\+json">(.*?)</script>', text, re.S)
          assert ld, 'JSON-LD ontbreekt'
          json.loads(ld.group(1))
          assert len(re.findall(r'<figure\b', text)) >= 2, 'minstens twee figuren vereist'

          pathlib.Path('/tmp/validated-weekblog-files').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print('PUBLICATION_CONTRACT_OK', changed)
          PY

      - name: Commit validated changes
        id: commit
        if: steps.kalender.outputs.gevonden == 'true'
        env:
          SLUG: ${{ steps.kalender.outputs.slug }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          DELIVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_mode || 'candidate-pr' }}
        run: |
          set -euo pipefail
          mapfile -t changed < /tmp/validated-weekblog-files
          git config user.name "Bedrijfsgeheugen Publisher"
          git config user.email "actions@users.noreply.github.com"
          for path in "${changed[@]}"; do
            [ -n "$path" ] && git add -- "$path"
          done
          git commit -m "blog: $SLUG"

          if [ "$DELIVERY_MODE" = "candidate-pr" ]; then
            export CHANGED_FILES="$(printf '%s\n' "${changed[@]}")"
            CANDIDATE_BRANCH=$(node --input-type=module - <<'NODE'
          import { createWriterCandidate, validateWriterCandidate } from './scripts/ci/repo-writer-candidate.mjs';
          const files = String(process.env.CHANGED_FILES || '').split('\n').filter(Boolean).sort();
          const candidate = createWriterCandidate({
            writer: 'weekblog',
            baseSha: process.env.BASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            changedFiles: files,
            allowedFiles: files,
            rollbackSha: process.env.BASE_SHA,
          });
          validateWriterCandidate(candidate);
          console.log(candidate.branch);
          NODE
            )
            echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "delivery=candidate-pr" >> "$GITHUB_OUTPUT"
          else
            echo "::error::DIRECT_DELIVERY_DISABLED_BY_BRAIN_V2"; exit 64
          fi

      - name: Candidate branch publiceren
        if: steps.kalender.outputs.gevonden == 'true' && steps.commit.outputs.delivery == 'candidate-pr'
        env:
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$CANDIDATE_BRANCH"

      - name: Candidate PR openen
        if: steps.kalender.outputs.gevonden == 'true' && steps.commit.outputs.delivery == 'candidate-pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.commit.outputs.candidate_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SLUG: ${{ steps.kalender.outputs.slug }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$CANDIDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Candidate PR bestaat al: #$existing"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$CANDIDATE_BRANCH" \
            --title "Weekblog candidate: $SLUG" \
            --body "Gecontroleerde candidate uit weekblog. Base SHA: $BASE_SHA. Notion blijft Gepland totdat de wijziging werkelijk is gepromoveerd. Deze workflow merge't zichzelf niet."

      - name: Niets te doen
        if: steps.kalender.outputs.gevonden != 'true'
        run: echo "Geen artikel met status Gepland in de kalender. Vul de Notion-kalender aan."
