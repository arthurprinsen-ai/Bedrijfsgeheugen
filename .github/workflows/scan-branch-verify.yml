name: Scan Branch Verify

on:
  push:
    branches: [bg-scan-prod-proof-v2]
    paths:
      - 'netlify/functions/powerhouse-scan-ingest.mjs'
      - 'tests/brain-canonical-scan.test.mjs'
      - '.github/workflows/scan-branch-verify.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/brain-canonical-scan.test.mjs
