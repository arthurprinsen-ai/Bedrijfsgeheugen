# Queue-storm guard v1: bounded recovery, repository backpressure, no main-push fan-out
name: Powerhouse Delivery Recovery Supervisor

on:
  # Recovery is scheduled/manual only. A main push must never fan out into
  # another repository-wide recovery scan.
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: powerhouse-delivery-recovery-supervisor
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify recovery controller
        run: node --test tests/delivery-powerhouse-supervisor.test.mjs
      - name: Recover exact-head critical delivery workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVE_RUN_CIRCUIT_BREAKER: '20'
          RECOVERY_PR_BUDGET: '1'
          STALE_QUEUE_MIN_AGE_SECONDS: '21600'
          STALE_QUEUE_CANCEL_BUDGET: '20'
          STALE_IN_PROGRESS_MIN_AGE_SECONDS: '1800'
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          # Reap proven zombie Actions runs before evaluating the circuit breaker.
          # Cancellation is allowed only when the run is stale AND its delivery
          # identity is no longer authoritative: terminal PR, superseded head SHA,
          # missing non-main branch, or old main SHA after main has advanced.
          now_epoch="$(date -u +%s)"
          stale_cancelled=0
          current_main_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"

          is_run_obsolete() {
            local run_json="$1"
            local head_branch head_sha pr_number current_branch_sha pr_state pr_head_sha
            head_branch="$(jq -r '.head_branch // ""' <<<"$run_json")"
            head_sha="$(jq -r '.head_sha // ""' <<<"$run_json")"
            pr_number="$(jq -r '.pull_requests[0].number // empty' <<<"$run_json")"
            [ -n "$head_branch" ] && [ -n "$head_sha" ] || return 1

            if [ "$head_branch" = "main" ]; then
              [ "$head_sha" != "$current_main_sha" ] && return 0
              return 1
            fi

            encoded_branch="$(jq -rn --arg v "$head_branch" '$v|@uri')"
            current_branch_sha="$(gh api "repos/$repo/git/ref/heads/$encoded_branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$current_branch_sha" ]; then
              return 0
            fi
            if [ "$current_branch_sha" != "$head_sha" ]; then
              return 0
            fi

            if [ -n "$pr_number" ]; then
              pr_state="$(gh api "repos/$repo/pulls/$pr_number" --jq '.state' 2>/dev/null || true)"
              pr_head_sha="$(gh api "repos/$repo/pulls/$pr_number" --jq '.head.sha' 2>/dev/null || true)"
              if [ "$pr_state" = "closed" ] || { [ -n "$pr_head_sha" ] && [ "$pr_head_sha" != "$head_sha" ]; }; then
                return 0
              fi
            fi
            return 1
          }

          cancel_obsolete_run() {
            local run_id="$1"
            if gh api --method POST "repos/$repo/actions/runs/$run_id/cancel" >/dev/null 2>&1; then
              echo "normal-cancel"
              return 0
            fi
            if gh api --method POST "repos/$repo/actions/runs/$run_id/force-cancel" >/dev/null 2>&1; then
              echo "force-cancel"
              return 0
            fi
            latest_status="$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo unknown)"
            case "$latest_status" in completed|cancelled) echo "already-terminal"; return 0 ;; esac
            if gh api --method DELETE "repos/$repo/actions/runs/$run_id" >/dev/null 2>&1; then
              echo "delete-fallback"
              return 0
            fi
            latest_status="$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo unknown)"
            case "$latest_status" in queued|in_progress|pending|waiting|requested) return 1 ;; *) echo "not-active"; return 0 ;; esac
          }

          cancel_stale_runs() {
            local status="$1"
            local min_age="$2"
            gh api --paginate "repos/$repo/actions/runs?status=$status&per_page=100" > "/tmp/$status-runs.json"
            while read -r run_json; do
              [ "$stale_cancelled" -lt "$STALE_QUEUE_CANCEL_BUDGET" ] || {
                echo "::notice::STALE_RUN_CANCEL_BUDGET_EXHAUSTED:$STALE_QUEUE_CANCEL_BUDGET"
                break
              }
              run_id="$(jq -r '.id' <<<"$run_json")"
              created_at="$(jq -r '.created_at // ""' <<<"$run_json")"
              updated_at="$(jq -r '.updated_at // .created_at // ""' <<<"$run_json")"
              head_branch="$(jq -r '.head_branch // ""' <<<"$run_json")"
              [ -n "$run_id" ] && [ -n "$created_at" ] && [ -n "$head_branch" ] || continue
              age_source="$created_at"
              [ "$status" = "in_progress" ] && age_source="$updated_at"
              run_epoch="$(date -u -d "$age_source" +%s 2>/dev/null || echo "$now_epoch")"
              age_seconds=$((now_epoch - run_epoch))
              [ "$age_seconds" -ge "$min_age" ] || continue
              is_run_obsolete "$run_json" || continue
              if cancel_mode="$(cancel_obsolete_run "$run_id")"; then
                stale_cancelled=$((stale_cancelled + 1))
                echo "::notice::STALE_ACTIONS_RUN_CANCELLED:$run_id status:$status branch:$head_branch age_seconds:$age_seconds mode:$cancel_mode"
              else
                echo "::warning::STALE_ACTIONS_RUN_CANCEL_FAILED:$run_id status:$status branch:$head_branch"
              fi
            done < <(jq -c '.workflow_runs[]?' "/tmp/$status-runs.json")
          }

          cancel_stale_runs queued "$STALE_QUEUE_MIN_AGE_SECONDS"
          cancel_stale_runs in_progress "$STALE_IN_PROGRESS_MIN_AGE_SECONDS"
          echo "::notice::STALE_ACTIONS_RUN_CANCEL_TOTAL:$stale_cancelled"

          active_runs="$(gh api "repos/$repo/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')"
          echo "::notice::ACTIONS_ACTIVE_RUNS:$active_runs circuit_breaker:$ACTIVE_RUN_CIRCUIT_BREAKER"
          if [ "$active_runs" -ge "$ACTIVE_RUN_CIRCUIT_BREAKER" ]; then
            echo "::warning::ACTIONS_QUEUE_CIRCUIT_OPEN:$active_runs; recovery dispatch suppressed until backlog drains."
            exit 0
          fi
          gh api --paginate "repos/$repo/pulls?state=open&per_page=100" > /tmp/open-prs.json
          recovered_prs=0
          while read -r pr; do
            if [ "$recovered_prs" -ge "$RECOVERY_PR_BUDGET" ]; then
              echo "::notice::RECOVERY_PR_BUDGET_EXHAUSTED:$RECOVERY_PR_BUDGET"
              break
            fi
            number="$(jq -r '.number' <<<"$pr")"
            head="$(jq -r '.head.sha' <<<"$pr")"
            branch="$(jq -r '.head.ref' <<<"$pr")"
            base="$(jq -r '.base.sha' <<<"$pr")"
            updated="$(jq -r '.updated_at' <<<"$pr")"
            body="$(jq -r '.body // ""' <<<"$pr")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr")"
            mergeable="$(gh api "repos/$repo/pulls/$number" --jq '.mergeable')"
            runs="$(gh api "repos/$repo/actions/runs?head_sha=$head&per_page=100" --jq '.workflow_runs | map({id,name,status,conclusion,created_at,updated_at,run_started_at})')"
            decision="$(node --input-type=module - "$mergeable" "$updated" "$runs" <<'NODE'
          import { classifyRecovery } from './tools/delivery/predictive-controller.mjs';
          const [mergeableRaw,updated,runsRaw]=process.argv.slice(2);
          const mergeable=mergeableRaw==='true'?true:mergeableRaw==='false'?false:null;
          process.stdout.write(JSON.stringify(classifyRecovery({mergeable,workflowRuns:JSON.parse(runsRaw||'[]'),headUpdatedAt:updated})));
          NODE
            )"
            state="$(jq -r '.state' <<<"$decision")"
            echo "PR#$number $head $state"
            active_for_pr(){
              workflow="$1"
              gh api "repos/$repo/actions/workflows/$workflow/runs?per_page=100" --jq "[.workflow_runs[] | select((.status==\"queued\" or .status==\"in_progress\" or .status==\"pending\" or .status==\"waiting\" or .status==\"requested\") and ((.display_title // \"\") | contains(\"PR #$number\")))] | length"
            }
            dispatch_required(){
              active="$(active_for_pr required-test.yml)"
              if [ "$active" -gt 0 ]; then
                echo "::notice::PR#$number Required test already active; duplicate dispatch suppressed."
                return 0
              fi
              gh workflow run required-test.yml --ref main -f pr_number="$number" -f base_sha="$base" -f head_sha="$head" -f candidate_branch="$branch"
            }
            dispatch_brain(){
              active="$(active_for_pr unified-brain-delivery.yml)"
              if [ "$active" -gt 0 ]; then
                echo "::notice::PR#$number Unified Brain Delivery already active; duplicate dispatch suppressed."
                return 0
              fi
              gh workflow run unified-brain-delivery.yml --ref main -f pr_number="$number" -f base_sha="$base" -f head_sha="$head" -f candidate_branch="$branch"
            }
            case "$state" in
              ZERO_RUN_RECOVERY)
                dispatch_required || true
                dispatch_brain || true
                ;;
              PARTIAL_START_RECOVERY)
                jq -e '.coverage.missing | index("required-test.yml")' <<<"$decision" >/dev/null && dispatch_required || true
                jq -e '.coverage.missing | index("unified-brain-delivery.yml")' <<<"$decision" >/dev/null && dispatch_brain || true
                ;;
              STALE_QUEUE_RECOVERY)
                jq -r '.staleRunIds[]?' <<<"$decision" |
                while read -r run_id; do
                  [ -n "$run_id" ] && gh api --method POST "repos/$repo/actions/runs/$run_id/cancel" || true
                done
                dispatch_required || true
                dispatch_brain || true
                ;;
              LONG_RUNNING_OBSERVE)
                echo "::notice::PR#$number current-head workflow is long-running but still in progress; do not cancel without concrete stalled-job evidence."
                ;;
              MERGE_CONFLICT_RECOVERY)
                echo "::warning::PR#$number requires same-lineage main refresh; duplicate recovery PR forbidden."
                if [ "$head_repo" != "$repo" ]; then
                  echo "::warning::PR#$number is not a same-repository branch; automatic refresh forbidden."
                  continue
                fi
                if ! grep -qx 'Writer-Lease-State: TERMINAL_DELIVERY' <<<"$body" || ! grep -qx 'Writer-Lease-Owner: powerhouse-terminal-delivery' <<<"$body"; then
                  echo "::warning::PR#$number has no active canonical terminal writer lease; automatic refresh forbidden."
                  continue
                fi
                default_branch="$(gh api "repos/$repo" --jq '.default_branch')"
                if gh api --method POST "repos/$repo/merges" -f base="$branch" -f head="$default_branch" -f commit_message="delivery: refresh PR #$number from $default_branch" >/tmp/merge-refresh.json 2>/tmp/merge-refresh.err; then
                  new_head="$(gh api "repos/$repo/branches/$branch" --jq '.commit.sha')"
                  echo "::notice::PR#$number refreshed on same leased lineage $head -> $new_head; exact-head gates will restart."
                else
                  echo "::warning::PR#$number could not be refreshed automatically; preserving same lineage fail-closed."
                  cat /tmp/merge-refresh.err || true
                fi
                ;;
            esac
            case "$state" in
              ZERO_RUN_RECOVERY|PARTIAL_START_RECOVERY|STALE_QUEUE_RECOVERY)
                recovered_prs=$((recovered_prs + 1))
                echo "::notice::RECOVERY_PR_BUDGET_USED:$recovered_prs/$RECOVERY_PR_BUDGET"
                ;;
            esac
          done < <(jq -c '.[]' /tmp/open-prs.json)

      - name: Recover merged obligations missing terminal closure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          cutoff_epoch="$(date -u -d '24 hours ago' +%s)"
          closed="$(gh api "repos/$repo/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100")"
          terminal_runs="$(gh api "repos/$repo/actions/workflows/obligation-terminal-closure.yml/runs?per_page=100")"
          active_terminal_count="$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="pending")] | length' <<<"$terminal_runs")"
          if [ "$active_terminal_count" -gt 0 ]; then
            echo "::notice::Terminal closure recovery already active globally; serial recovery prevents duplicate dispatch storms."
            exit 0
          fi

          while read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            merged_at="$(jq -r '.merged_at' <<<"$pr")"
            body="$(jq -r '.body // ""' <<<"$pr")"
            merged_epoch="$(date -u -d "$merged_at" +%s 2>/dev/null || echo 0)"
            [ "$merged_epoch" -ge "$cutoff_epoch" ] || continue

            grep -Eq '^Obligation-ID: .+' <<<"$body" || continue
            grep -Eq '^Delivery-Lane: .+' <<<"$body" || continue
            grep -Eq '^Candidate-Type: (implementation|recovery|security|dependency|docs|promotion)$' <<<"$body" || continue
            grep -Eq '^Base-SHA: [0-9a-f]{40}$' <<<"$body" || continue
            grep -Eq '^Terminal-State: LIVE_BEWEZEN$' <<<"$body" && continue

            title="Obligation Terminal Closure PR #$number"
            active="$(jq --arg title "$title" '[.workflow_runs[] | select(.display_title==$title and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length' <<<"$terminal_runs")"
            [ "$active" -eq 0 ] || {
              echo "::notice::PR#$number terminal closure already active; duplicate recovery dispatch suppressed."
              continue
            }

            echo "::notice::PR#$number is merged but nonterminal; dispatching one canonical terminal closure recovery."
            gh workflow run obligation-terminal-closure.yml --ref main -f pr_number="$number"
            echo "::notice::Serialized recovery: one terminal closure dispatched; remaining obligations wait for the next supervisor cycle."
            break
          done < <(jq -c '.[] | select(.merged_at != null)' <<<"$closed")
