name: Powerhouse Delivery Recovery Supervisor

on:
  # Feature-branch pushes must never spawn a repository-wide recovery scan.
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: powerhouse-delivery-recovery-supervisor
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify recovery controller
        run: node --test tests/delivery-powerhouse-supervisor.test.mjs
      - name: Recover exact-head critical delivery workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api --paginate "repos/$repo/pulls?state=open&per_page=100" > /tmp/open-prs.json
          jq -c '.[]' /tmp/open-prs.json | while read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            head="$(jq -r '.head.sha' <<<"$pr")"
            branch="$(jq -r '.head.ref' <<<"$pr")"
            base="$(jq -r '.base.sha' <<<"$pr")"
            updated="$(jq -r '.updated_at' <<<"$pr")"
            body="$(jq -r '.body // ""' <<<"$pr")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr")"
            mergeable="$(gh api "repos/$repo/pulls/$number" --jq '.mergeable')"
            runs="$(gh api "repos/$repo/actions/runs?head_sha=$head&per_page=100" --jq '.workflow_runs | map({id,name,status,conclusion,created_at,updated_at,run_started_at})')"
            decision="$(node --input-type=module - "$mergeable" "$updated" "$runs" <<'NODE'
          import { classifyRecovery } from './tools/delivery/predictive-controller.mjs';
          const [mergeableRaw,updated,runsRaw]=process.argv.slice(2);
          const mergeable=mergeableRaw==='true'?true:mergeableRaw==='false'?false:null;
          process.stdout.write(JSON.stringify(classifyRecovery({mergeable,workflowRuns:JSON.parse(runsRaw||'[]'),headUpdatedAt:updated})));
          NODE
            )"
            state="$(jq -r '.state' <<<"$decision")"
            echo "PR#$number $head $state"
            dispatch_required(){
              gh workflow run required-test.yml --ref main -f pr_number="$number" -f base_sha="$base" -f head_sha="$head" -f candidate_branch="$branch"
            }
            dispatch_brain(){
              gh workflow run unified-brain-delivery.yml --ref main -f pr_number="$number" -f base_sha="$base" -f head_sha="$head" -f candidate_branch="$branch"
            }
            case "$state" in
              ZERO_RUN_RECOVERY)
                dispatch_required || true
                dispatch_brain || true
                ;;
              PARTIAL_START_RECOVERY)
                jq -e '.coverage.missing | index("required-test.yml")' <<<"$decision" >/dev/null && dispatch_required || true
                jq -e '.coverage.missing | index("unified-brain-delivery.yml")' <<<"$decision" >/dev/null && dispatch_brain || true
                ;;
              STALE_QUEUE_RECOVERY)
                jq -r '.staleRunIds[]?' <<<"$decision" |
                while read -r run_id; do
                  [ -n "$run_id" ] && gh api --method POST "repos/$repo/actions/runs/$run_id/cancel" || true
                done
                dispatch_required || true
                dispatch_brain || true
                ;;
              LONG_RUNNING_OBSERVE)
                echo "::notice::PR#$number current-head workflow is long-running but still in progress; do not cancel without concrete stalled-job evidence."
                ;;
              MERGE_CONFLICT_RECOVERY)
                echo "::warning::PR#$number requires same-lineage main refresh; duplicate recovery PR forbidden."
                if [ "$head_repo" != "$repo" ]; then
                  echo "::warning::PR#$number is not a same-repository branch; automatic refresh forbidden."
                  continue
                fi
                if ! grep -qx 'Writer-Lease-State: TERMINAL_DELIVERY' <<<"$body" || ! grep -qx 'Writer-Lease-Owner: powerhouse-terminal-delivery' <<<"$body"; then
                  echo "::warning::PR#$number has no active canonical terminal writer lease; automatic refresh forbidden."
                  continue
                fi
                default_branch="$(gh api "repos/$repo" --jq '.default_branch')"
                if gh api --method POST "repos/$repo/merges" -f base="$branch" -f head="$default_branch" -f commit_message="delivery: refresh PR #$number from $default_branch" >/tmp/merge-refresh.json 2>/tmp/merge-refresh.err; then
                  new_head="$(gh api "repos/$repo/branches/$branch" --jq '.commit.sha')"
                  echo "::notice::PR#$number refreshed on same leased lineage $head -> $new_head; exact-head gates will restart."
                else
                  echo "::warning::PR#$number could not be refreshed automatically; preserving same lineage fail-closed."
                  cat /tmp/merge-refresh.err || true
                fi
                ;;
            esac
          done

      - name: Recover merged obligations missing terminal closure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          cutoff_epoch="$(date -u -d '24 hours ago' +%s)"
          closed="$(gh api "repos/$repo/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100")"
          terminal_runs="$(gh api "repos/$repo/actions/workflows/obligation-terminal-closure.yml/runs?per_page=100")"
          active_terminal_count="$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="pending")] | length' <<<"$terminal_runs")"
          if [ "$active_terminal_count" -gt 0 ]; then
            echo "::notice::Terminal closure recovery already active globally; serial recovery prevents duplicate dispatch storms."
            exit 0
          fi

          while read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            merged_at="$(jq -r '.merged_at' <<<"$pr")"
            body="$(jq -r '.body // ""' <<<"$pr")"
            merged_epoch="$(date -u -d "$merged_at" +%s 2>/dev/null || echo 0)"
            [ "$merged_epoch" -ge "$cutoff_epoch" ] || continue

            grep -Eq '^Obligation-ID: .+' <<<"$body" || continue
            grep -Eq '^Delivery-Lane: .+' <<<"$body" || continue
            grep -Eq '^Candidate-Type: (implementation|recovery|security|dependency|docs|promotion)$' <<<"$body" || continue
            grep -Eq '^Base-SHA: [0-9a-f]{40}$' <<<"$body" || continue
            grep -Eq '^Terminal-State: LIVE_BEWEZEN$' <<<"$body" && continue

            title="Obligation Terminal Closure PR #$number"
            active="$(jq --arg title "$title" '[.workflow_runs[] | select(.display_title==$title and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length' <<<"$terminal_runs")"
            [ "$active" -eq 0 ] || {
              echo "::notice::PR#$number terminal closure already active; duplicate recovery dispatch suppressed."
              continue
            }

            echo "::notice::PR#$number is merged but nonterminal; dispatching one canonical terminal closure recovery."
            gh workflow run obligation-terminal-closure.yml --ref main -f pr_number="$number"
            echo "::notice::Serialized recovery: one terminal closure dispatched; remaining obligations wait for the next supervisor cycle."
            break
          done < <(jq -c '.[] | select(.merged_at != null)' <<<"$closed")
