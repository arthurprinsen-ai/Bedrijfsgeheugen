# Queue-storm guard v1: bounded recovery, repository backpressure, no main-push fan-out
name: Powerhouse Delivery Recovery Supervisor

on:
  # Recovery is scheduled/manual only. A main push must never fan out into
  # another repository-wide recovery scan.
  workflow_dispatch:
  # Shift identical five-minute cadence off the hour's overloaded minute zero.
  # One existing owner: do not introduce a second scheduler or workflow.
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: powerhouse-delivery-recovery-supervisor
  # Do not interrupt a branch-sync writer during its CAS/readback.
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify recovery controller
        run: node --test tests/delivery-powerhouse-supervisor.test.mjs tests/delivery-recovery-pr-prioritizer.test.mjs
      - name: Recover exact-head canonical Required gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVE_RUN_CIRCUIT_BREAKER: '12'
          RECOVERY_PR_BUDGET: '1'
          MAX_MAIN_DRIFT_REFRESHES: '2'
          STALE_QUEUE_MIN_AGE_SECONDS: '60'
          STALE_QUEUE_CANCEL_BUDGET: '100'
          STALE_IN_PROGRESS_MIN_AGE_SECONDS: '300'
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          metrics_file="$(mktemp)"
          : > "$metrics_file"
          emit_metric() {
            printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$metrics_file"
          }
          finalize_metrics() {
            code="$1"
            trap - EXIT
            if ! RECOVERY_METRICS_TSV="$metrics_file" RECOVERY_METRICS_EXIT_CODE="$code" node tools/delivery/recovery-supervisor-metrics.mjs; then
              echo "::error::RECOVERY_DRIFT_METRICS_WRITE_FAILED"
              exit 1
            fi
            exit "$code"
          }
          trap 'finalize_metrics "$?"' EXIT

          # Reap proven zombie Actions runs before evaluating the circuit breaker.
          # Cancellation is allowed only when the run is stale AND its delivery
          # identity is no longer authoritative: terminal PR, superseded head SHA,
          # missing non-main branch, or old main SHA after main has advanced.
          now_epoch="$(date -u +%s)"
          stale_cancelled=0
          obsolete_uncancellable=0
          current_main_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"

          is_run_obsolete() {
            local run_json="$1"
            local head_branch head_sha pr_number current_branch_sha pr_state pr_head_sha
            head_branch="$(jq -r '.head_branch // ""' <<<"$run_json")"
            head_sha="$(jq -r '.head_sha // ""' <<<"$run_json")"
            pr_number="$(jq -r '.pull_requests[0].number // empty' <<<"$run_json")"
            [ -n "$head_branch" ] && [ -n "$head_sha" ] || return 1

            if [ "$head_branch" = "main" ]; then
              [ "$head_sha" != "$current_main_sha" ] && return 0
              return 1
            fi

            encoded_branch="$(jq -rn --arg v "$head_branch" '$v|@uri')"
            current_branch_sha="$(gh api "repos/$repo/git/ref/heads/$encoded_branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$current_branch_sha" ]; then
              return 0
            fi
            if [ "$current_branch_sha" != "$head_sha" ]; then
              return 0
            fi

            if [ -n "$pr_number" ]; then
              pr_state="$(gh api "repos/$repo/pulls/$pr_number" --jq '.state' 2>/dev/null || true)"
              pr_head_sha="$(gh api "repos/$repo/pulls/$pr_number" --jq '.head.sha' 2>/dev/null || true)"
              if [ "$pr_state" = "closed" ] || { [ -n "$pr_head_sha" ] && [ "$pr_head_sha" != "$head_sha" ]; }; then
                return 0
              fi
            fi
            return 1
          }

          cancel_obsolete_run() {
            local run_id="$1"
            # A GitHub backend run that remains queued with zero jobs and an unchanged
            # timestamp after 24h must be handled by the existing hourly Repository
            # Janitor's durable provider-ghost reconciler, not retried every five minutes.
            local run_state started updated run_epoch jobs_count
            run_state="$(gh api "repos/$repo/actions/runs/$run_id" 2>/dev/null || echo '{}')"
            started="$(jq -r '.created_at // ""' <<<"$run_state")"
            updated="$(jq -r '.updated_at // ""' <<<"$run_state")"
            if [ "$(jq -r '.status // ""' <<<"$run_state")" = queued ] && [ -n "$started" ] && [ "$started" = "$updated" ]; then
              run_epoch="$(date -u -d "$started" +%s 2>/dev/null || echo 0)"
              if [ "$run_epoch" -gt 0 ] && [ $((now_epoch-run_epoch)) -ge 86400 ]; then
                jobs_count="$(gh api "repos/$repo/actions/runs/$run_id/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo UNPROVEN)"
                if [ "$jobs_count" = 0 ]; then
                  echo "::notice::GITHUB_PROVIDER_GHOST_RECONCILER_OWNS:$run_id" >&2
                  return 1
                fi
              fi
            fi
            if gh api --method POST "repos/$repo/actions/runs/$run_id/cancel" >/dev/null 2>&1; then
              echo "normal-cancel"
              return 0
            fi
            if gh api --method POST "repos/$repo/actions/runs/$run_id/force-cancel" >/dev/null 2>&1; then
              echo "force-cancel"
              return 0
            fi
            latest_status="$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo unknown)"
            case "$latest_status" in completed|cancelled) echo "already-terminal"; return 0 ;; esac
            if gh api --method DELETE "repos/$repo/actions/runs/$run_id" >/dev/null 2>&1; then
              echo "delete-fallback"
              return 0
            fi
            latest_status="$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo unknown)"
            case "$latest_status" in queued|in_progress|pending|waiting|requested) return 1 ;; *) echo "not-active"; return 0 ;; esac
          }

          cancel_stale_runs() {
            local status="$1"
            local min_age="$2"
            gh api --paginate "repos/$repo/actions/runs?status=$status&per_page=100" > "/tmp/$status-runs.json"
            while read -r run_json; do
              [ "$stale_cancelled" -lt "$STALE_QUEUE_CANCEL_BUDGET" ] || {
                echo "::notice::STALE_RUN_CANCEL_BUDGET_EXHAUSTED:$STALE_QUEUE_CANCEL_BUDGET"
                break
              }
              run_id="$(jq -r '.id' <<<"$run_json")"
              created_at="$(jq -r '.created_at // ""' <<<"$run_json")"
              updated_at="$(jq -r '.updated_at // .created_at // ""' <<<"$run_json")"
              head_branch="$(jq -r '.head_branch // ""' <<<"$run_json")"
              [ -n "$run_id" ] && [ -n "$created_at" ] && [ -n "$head_branch" ] || continue
              age_source="$created_at"
              [ "$status" = "in_progress" ] && age_source="$updated_at"
              run_epoch="$(date -u -d "$age_source" +%s 2>/dev/null || echo "$now_epoch")"
              age_seconds=$((now_epoch - run_epoch))
              [ "$age_seconds" -ge "$min_age" ] || continue
              is_run_obsolete "$run_json" || continue
              if cancel_mode="$(cancel_obsolete_run "$run_id")"; then
                stale_cancelled=$((stale_cancelled + 1))
                echo "::notice::STALE_ACTIONS_RUN_CANCELLED:$run_id status:$status branch:$head_branch age_seconds:$age_seconds mode:$cancel_mode"
              else
                obsolete_uncancellable=$((obsolete_uncancellable + 1))
                echo "::warning::STALE_ACTIONS_RUN_CANCEL_FAILED:$run_id status:$status branch:$head_branch classified:PROVIDER_CONTROL_PLANE_ZOMBIE"
              fi
            done < <(jq -c '.workflow_runs[]?' "/tmp/$status-runs.json")
          }

          cancel_stale_runs queued "$STALE_QUEUE_MIN_AGE_SECONDS"
          cancel_stale_runs in_progress "$STALE_IN_PROGRESS_MIN_AGE_SECONDS"
          echo "::notice::STALE_ACTIONS_RUN_CANCEL_TOTAL:$stale_cancelled"

          active_runs=0
          for active_status in queued in_progress pending waiting requested; do
            status_count="$(gh api --paginate "repos/$repo/actions/runs?status=$active_status&per_page=100" --jq '.workflow_runs[] | .id' | wc -l | tr -d ' ')"
            active_runs=$((active_runs + status_count))
          done
          effective_active_runs=$((active_runs - obsolete_uncancellable))
          [ "$effective_active_runs" -ge 0 ] || effective_active_runs=0
          echo "::notice::ACTIONS_ACTIVE_RUNS_RAW:$active_runs effective:$effective_active_runs provider_zombies:$obsolete_uncancellable circuit_breaker:$ACTIVE_RUN_CIRCUIT_BREAKER"
          if [ "$effective_active_runs" -ge "$ACTIVE_RUN_CIRCUIT_BREAKER" ]; then
            emit_metric 0 CIRCUIT_OPEN 0
            echo "::warning::ACTIONS_QUEUE_CIRCUIT_OPEN:$effective_active_runs effective active runs; recovery dispatch suppressed until authoritative backlog drains."
            exit 0
          fi
          gh api --paginate "repos/$repo/pulls?state=open&per_page=100" > /tmp/open-prs.json
          # One bounded evidence read; sorting is advisory only. Every PR still
          # traverses the original live merge, lease, overlap and GitHub CAS gates.
          # On provider failure or malformed evidence retain the original order.
          if gh api "repos/$repo/actions/workflows/required-test.yml/runs?per_page=100" > /tmp/recovery-required-runs.json; then
            if node tools/delivery/recovery-pr-prioritizer.mjs \
                /tmp/open-prs.json /tmp/recovery-required-runs.json \
                "$current_main_sha" /tmp/open-prs-ranked.json; then
              mv /tmp/open-prs-ranked.json /tmp/open-prs.json
              echo "::notice::RECOVERY_PR_ORDERED_BY_BOUNDED_REQUIRED_EVIDENCE"
            else
              echo "::warning::RECOVERY_PRIORITY_EVIDENCE_UNAVAILABLE:original-provider-order-preserved"
            fi
          else
            echo "::warning::RECOVERY_PRIORITY_PROVIDER_READ_FAILED:original-provider-order-preserved"
          fi
          recovered_prs=0
          while read -r pr; do
            if [ "$recovered_prs" -ge "$RECOVERY_PR_BUDGET" ]; then
              echo "::notice::RECOVERY_PR_BUDGET_EXHAUSTED:$RECOVERY_PR_BUDGET"
              break
            fi
            number="$(jq -r '.number' <<<"$pr")"
            head="$(jq -r '.head.sha' <<<"$pr")"
            branch="$(jq -r '.head.ref' <<<"$pr")"
            base="$(jq -r '.base.sha' <<<"$pr")"
            updated="$(jq -r '.updated_at' <<<"$pr")"
            body="$(jq -r '.body // ""' <<<"$pr")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr")"
            # Reconcile only the same native CAS writer; never create a second update.
            early_state="$(sed -n 's/^Writer-Lease-State: //p' <<<"$body" | tail -n1)"
            if [ "$early_state" = MAIN_SYNC ] && grep -Eq '^Writer-Lease-Drift-Refreshes: [0-9]+$' <<<"$body"; then
              old_head="$(sed -n 's/^Writer-Lease-Head: //p' <<<"$body" | tail -n1)"
              sync_epoch="$(sed -n 's/^Writer-Lease-Main-Epoch: //p' <<<"$body" | tail -n1)"
              if [ "$head" = "$old_head" ]; then
                updated_epoch="$(date -u -d "$updated" +%s 2>/dev/null || echo 0)"
                if [ "$updated_epoch" -gt 0 ] && [ $((now_epoch - updated_epoch)) -ge 600 ]; then
                  live_pr="$(gh api "repos/$repo/pulls/$number")"
                  live_body="$(jq -r '.body // ""' <<<"$live_pr")"
                  if [ "$(jq -r '.head.sha' <<<"$live_pr")" = "$head" ] && [ "$live_body" = "$body" ]; then
                    restore_body="$(sed 's/^Writer-Lease-State: MAIN_SYNC$/Writer-Lease-State: TERMINAL_DELIVERY/' <<<"$body")"
                    gh api --method PATCH "repos/$repo/pulls/$number" -f body="$restore_body" >/dev/null
                    emit_metric "$number" SYNC_TIMEOUT 0
                    echo "::warning::MAIN_DRIFT_SYNC_TIMED_OUT:PR#$number; preserved attempt budget."
                  fi
                else
                  echo "::notice::MAIN_DRIFT_SYNC_PENDING:PR#$number; no duplicate update."
                fi
                continue
              fi
              if ! [[ "$old_head" =~ ^[0-9a-f]{40}$ && "$sync_epoch" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::warning::MAIN_DRIFT_SYNC_UNVERIFIED:PR#$number invalid ancestry inputs."; continue
              fi
              old_proof="$(gh api "repos/$repo/compare/$old_head...$head" 2>/dev/null || echo '{}')"
              base_proof="$(gh api "repos/$repo/compare/$sync_epoch...$head" 2>/dev/null || echo '{}')"
              if [ "$(jq -r '.status // ""' <<<"$old_proof")" != ahead ] ||
                 [ "$(jq -r '.behind_by // -1' <<<"$old_proof")" != 0 ] ||
                 [ "$(jq -r '.status // ""' <<<"$base_proof")" != ahead ] ||
                 [ "$(jq -r '.behind_by // -1' <<<"$base_proof")" != 0 ]; then
                echo "::warning::MAIN_DRIFT_SYNC_UNVERIFIED:PR#$number ancestry not proven."; continue
              fi
              live_pr="$(gh api "repos/$repo/pulls/$number")"
              live_body="$(jq -r '.body // ""' <<<"$live_pr")"
              if [ "$(jq -r '.head.sha' <<<"$live_pr")" != "$head" ] ||
                 [ "$(jq -r '.head.ref' <<<"$live_pr")" != "$branch" ] ||
                 [ "$live_body" != "$body" ]; then
                emit_metric "$number" SYNC_RACE 0
                echo "::warning::MAIN_DRIFT_SYNC_RACE:PR#$number metadata changed; no mutation."; continue
              fi
              updated_body="$(printf '%s\n' "$live_body" | awk -v h="$head" -v b="$sync_epoch" '
                BEGIN {s=0;hd=0;bs=0;e=0}
                /^Writer-Lease-State:/ {print "Writer-Lease-State: TERMINAL_DELIVERY";s++;next}
                /^Writer-Lease-Head:/ {print "Writer-Lease-Head: " h;hd++;next}
                /^Base-SHA:/ {print "Base-SHA: " b;bs++;next}
                /^Writer-Lease-Main-Epoch:/ {print "Writer-Lease-Main-Epoch: " b;e++;next}
                {print}
                END {if(s!=1||hd!=1||bs!=1||e!=1)exit 42}
              ')"
              gh api --method PATCH "repos/$repo/pulls/$number" -f body="$updated_body" >/dev/null
              emit_metric "$number" SYNC_RECONCILED 0
              echo "::notice::MAIN_DRIFT_SYNC_RECONCILED:PR#$number; new exact-head Required and CodeQL still mandatory."
              recovered_prs=$((recovered_prs + 1))
              continue
            fi
            mergeable="$(gh api "repos/$repo/pulls/$number" --jq '.mergeable')"
            refresh_main_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
            compare_json="$(gh api "repos/$repo/compare/$refresh_main_sha...$head" 2>/dev/null || echo '{}')"
            behind_by="$(jq -r '.behind_by // 0' <<<"$compare_json")"
            merge_base="$(jq -r '.merge_base_commit.sha // empty' <<<"$compare_json")"
            runs="$(gh api "repos/$repo/actions/runs?head_sha=$head&per_page=100" --jq '.workflow_runs | map({id,name,status,conclusion,created_at,updated_at,run_started_at})')"
            decision="$(node --input-type=module - "$mergeable" "$behind_by" "$updated" "$runs" <<'NODE'
          import { classifyRecovery } from './tools/delivery/predictive-controller.mjs';
          const [mergeableRaw,behindByRaw,updated,runsRaw]=process.argv.slice(2);
          const mergeable=mergeableRaw==='true'?true:mergeableRaw==='false'?false:null;
          const behindBy=Number(behindByRaw||0);
          process.stdout.write(JSON.stringify(classifyRecovery({mergeable,behindBy,workflowRuns:JSON.parse(runsRaw||'[]'),headUpdatedAt:updated})));
          NODE
            )"
            state="$(jq -r '.state' <<<"$decision")"
            echo "PR#$number $head $state"
            did_recover=0
            active_for_pr(){
              local workflow="$1"
              # Native PR runs carry the candidate head SHA. Recovery dispatches
              # carry immutable PR number + head SHA in their run-name.
              gh api "repos/$repo/actions/workflows/$workflow/runs?per_page=100" |
                jq --arg head "$head" --arg pr "$number" '
                  [.workflow_runs[] |
                    select(.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="waiting" or .status=="requested") |
                    select(
                      (.head_sha==$head and .event=="pull_request") or
                      ((.display_title // "") | contains("PR #"+$pr+" "+$head))
                    )
                  ] | length'
            }
            dispatch_required(){
              local active
              active="$(active_for_pr required-test.yml)"
              if [ "$active" -gt 0 ]; then
                echo "::notice::PR#$number exact-head Required test already active; duplicate dispatch suppressed."
                return 1
              fi
              gh workflow run required-test.yml --ref main -f pr_number="$number" -f base_sha="$base" -f head_sha="$head" -f candidate_branch="$branch"
            }
            # Required test is the canonical open-PR recovery heartbeat.
            # Unified Brain Delivery is terminal/promotion evidence and is intentionally
            # not auto-dispatched here; doing so duplicates expensive lane work.
            case "$state" in
              ZERO_RUN_RECOVERY)
                if dispatch_required; then did_recover=1; fi
                ;;
              PARTIAL_START_RECOVERY)
                if jq -e '.coverage.missing | index("required-test.yml")' <<<"$decision" >/dev/null; then
                  if dispatch_required; then did_recover=1; fi
                fi
                ;;
              STALE_QUEUE_RECOVERY)
                # Never create a second BRAIN or Required flight. A stale queued
                # exact-head run is cancelled once; the next scheduled pass
                # dispatches only when the provider confirms it is no longer active.
                while read -r run_id; do
                  [ -n "$run_id" ] || continue
                  if gh api --method POST "repos/$repo/actions/runs/$run_id/cancel" >/dev/null; then
                    did_recover=1
                    echo "::notice::PR#$number stale exact-head queued run cancel requested:$run_id"
                  else
                    echo "::warning::PR#$number queued run cancellation failed:$run_id"
                  fi
                done < <(jq -r '.staleRunIds[]?' <<<"$decision")
                if dispatch_required; then did_recover=1; fi
                ;;
              FAILED_GATE_RECOVERY)
                latest_required_id="$(jq -r '[.[] | select((.name // "") | test("required test"; "i"))] | sort_by(.updated_at // .created_at // "") | last | .id // empty' <<<"$runs")"
                latest_required_updated="$(jq -r '[.[] | select((.name // "") | test("required test"; "i"))] | sort_by(.updated_at // .created_at // "") | last | (.updated_at // .created_at // "")' <<<"$runs")"
                lease_state="$(sed -n 's/^Writer-Lease-State: //p' <<<"$body" | tail -n1)"
                lease_head="$(sed -n 's/^Writer-Lease-Head: //p' <<<"$body" | tail -n1)"
                if [ "$lease_state" != "TERMINAL_DELIVERY" ] || [ "$lease_head" != "$head" ]; then
                  echo "::notice::PR#$number failed gate remains fail-closed; current metadata is not an exact terminal lease."
                  continue
                fi
                admission_failed=0
                if [ -n "$latest_required_id" ]; then
                  admission_failed="$(gh api "repos/$repo/actions/runs/$latest_required_id/jobs?filter=latest&per_page=100" --jq '[.jobs[] | select(.name=="hygiene / admission" and .conclusion=="failure")] | length' 2>/dev/null || echo 0)"
                fi
                pr_updated_epoch="$(date -u -d "$updated" +%s 2>/dev/null || echo 0)"
                required_updated_epoch="$(date -u -d "$latest_required_updated" +%s 2>/dev/null || echo 0)"
                if [ "$admission_failed" -gt 0 ] && [ "$pr_updated_epoch" -gt "$required_updated_epoch" ]; then
                  active="$(active_for_pr required-test.yml)"
                  if [ "$active" -eq 0 ]; then
                    echo "::notice::PR#$number metadata changed after failed admission; redispatching exact-head Required once."
                    if dispatch_required; then
                      recovered_prs=$((recovered_prs + 1))
                      echo "::notice::RECOVERY_PR_BUDGET_USED:$recovered_prs/$RECOVERY_PR_BUDGET"
                    fi
                  else
                    echo "::notice::PR#$number corrected metadata already has an active Required; duplicate redispatch suppressed."
                  fi
                else
                  echo "::notice::PR#$number failed gate has no newer metadata-only correction; no automatic retry."
                fi
                ;;
              LONG_RUNNING_OBSERVE)
                echo "::notice::PR#$number current-head workflow is long-running but still in progress; do not cancel without concrete stalled-job evidence."
                ;;
              MERGE_CONFLICT_RECOVERY|MAIN_DRIFT_RECOVERY)
                if [ "$state" = MAIN_DRIFT_RECOVERY ]; then emit_metric "$number" DRIFT_DETECTED 0; fi
                echo "::warning::PR#$number requires same-lineage main refresh; duplicate recovery PR forbidden."
                if [ "$head_repo" != "$repo" ]; then
                  echo "::warning::PR#$number is not a same-repository branch; automatic refresh forbidden."
                  continue
                fi
                lease_state="$(sed -n 's/^Writer-Lease-State: //p' <<<"$body" | tail -n1)"
                lease_owner="$(sed -n 's/^Writer-Lease-Owner: //p' <<<"$body" | tail -n1)"
                lease_head="$(sed -n 's/^Writer-Lease-Head: //p' <<<"$body" | tail -n1)"
                lease_obligation="$(sed -n 's/^Writer-Lease-Obligation: //p' <<<"$body" | tail -n1)"
                if [ "$lease_state" != "TERMINAL_DELIVERY" ] || [ -z "$lease_owner" ] || [ "$lease_head" != "$head" ] || [ -z "$lease_obligation" ]; then
                  emit_metric "$number" LEASE_DENIED 0
                  echo "::warning::PR#$number has no exact active terminal writer lease; automatic refresh forbidden."
                  continue
                fi
                drift_count="$(sed -n 's/^Writer-Lease-Drift-Refreshes: //p' <<<"$body" | tail -n1)"
                if [ -n "$drift_count" ] && ! [[ "$drift_count" =~ ^[0-9]+$ ]]; then
                  echo "::warning::MAIN_DRIFT_COUNTER_INVALID:PR#$number"; continue
                fi
                [ -n "$drift_count" ] || drift_count=0
                if [ "$drift_count" -ge 1 ]; then emit_metric "$number" REPEATED_DRIFT "$drift_count"; fi
                if [ "$drift_count" -ge "$MAX_MAIN_DRIFT_REFRESHES" ]; then
                  emit_metric "$number" BUDGET_EXHAUSTED "$drift_count"
                  echo "::warning::MAIN_DRIFT_REFRESH_BUDGET_EXHAUSTED:PR#$number"; continue
                fi
                default_branch="$(gh api "repos/$repo" --jq '.default_branch')"
                if [ -z "$merge_base" ]; then
                  echo "::warning::PR#$number main refresh compare could not prove a merge base; automatic refresh forbidden."
                  continue
                fi
                main_paths="$(gh api "repos/$repo/compare/$merge_base...$refresh_main_sha" --jq '.files[]?.filename' 2>/dev/null || true)"
                candidate_paths="$(gh api "repos/$repo/compare/$merge_base...$head" --jq '.files[]?.filename' 2>/dev/null || true)"
                path_overlap="$(comm -12 <(printf '%s\n' "$main_paths" | sed '/^$/d' | sort -u) <(printf '%s\n' "$candidate_paths" | sed '/^$/d' | sort -u) || true)"
                if [ -n "$path_overlap" ]; then
                  echo "::warning::PR#$number main refresh has path overlap and requires reconciliation; automatic refresh forbidden."
                  printf '%s\n' "$path_overlap"
                  continue
                fi
                fresh_pr="$(gh api "repos/$repo/pulls/$number")"
                fresh_main="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
                if [ "$(jq -r '.head.sha' <<<"$fresh_pr")" != "$head" ] ||
                   [ "$(jq -r '.head.ref' <<<"$fresh_pr")" != "$branch" ] ||
                   [ "$fresh_main" != "$refresh_main_sha" ]; then
                  echo "::warning::MAIN_DRIFT_PREFLIGHT_CHANGED:PR#$number"; continue
                fi
                current_body="$(jq -r '.body // ""' <<<"$fresh_pr")"
                if [ "$current_body" != "$body" ]; then
                  echo "::warning::MAIN_DRIFT_LEASE_BODY_CHANGED:PR#$number"; continue
                fi
                pre_sync_body="$(printf '%s\n' "$current_body" | awk -v sync_main="$refresh_main_sha" '
          BEGIN { state_count=0; epoch_count=0 }
          {
            if ($0 ~ /^Writer-Lease-State:/) {
              print "Writer-Lease-State: MAIN_SYNC"
              state_count++
              next
            }
            if ($0 ~ /^Writer-Lease-Main-Epoch:/) {
              print "Writer-Lease-Main-Epoch: " sync_main
              epoch_count++
              next
            }
            print
          }
          END {
            if (state_count != 1 || epoch_count != 1) exit 42
          }
          ')"
                next_drift_count=$((drift_count + 1))
                if grep -q '^Writer-Lease-Drift-Refreshes:' <<<"$pre_sync_body"; then
                  pre_sync_body="$(sed -E "s/^Writer-Lease-Drift-Refreshes: .*/Writer-Lease-Drift-Refreshes: $next_drift_count/" <<<"$pre_sync_body")"
                else
                  pre_sync_body="$(printf '%s\nWriter-Lease-Drift-Refreshes: %s\n' "$pre_sync_body" "$next_drift_count")"
                fi
                gh api --method PATCH "repos/$repo/pulls/$number" -f body="$pre_sync_body" >/dev/null
                sync_body="$(gh api "repos/$repo/pulls/$number" --jq '.body // ""')"
                sync_state="$(sed -n 's/^Writer-Lease-State: //p' <<<"$sync_body" | tail -n1)"
                sync_head="$(sed -n 's/^Writer-Lease-Head: //p' <<<"$sync_body" | tail -n1)"
                sync_epoch="$(sed -n 's/^Writer-Lease-Main-Epoch: //p' <<<"$sync_body" | tail -n1)"
                if [ "$sync_state" != "MAIN_SYNC" ] || [ "$sync_head" != "$head" ] || [ "$sync_epoch" != "$refresh_main_sha" ]; then
                  echo "::warning::PR#$number MAIN_SYNC transition readback failed; restoring terminal lease."
                  gh api --method PATCH "repos/$repo/pulls/$number" -f body="$current_body" >/dev/null || true
                  continue
                fi
                emit_metric "$number" CAS_REQUEST "$next_drift_count"
                if gh api --method PUT "repos/$repo/pulls/$number/update-branch" -f expected_head_sha="$head" >/tmp/merge-refresh.json 2>/tmp/merge-refresh.err; then
                  emit_metric "$number" CAS_ACCEPTED "$next_drift_count"
                  new_head="$head"
                  for readback_attempt in 1 2 3 4 5 6 7 8; do
                    new_head="$(gh api "repos/$repo/pulls/$number" --jq '.head.sha')"
                    [ "$new_head" != "$head" ] && break
                    sleep 2
                  done
                  if [ "$new_head" = "$head" ]; then
                    emit_metric "$number" CAS_ASYNC_PENDING "$next_drift_count"
                    echo "::warning::MAIN_DRIFT_ASYNC_PENDING:PR#$number; held for reconciliation."
                    continue
                  fi
                  head_proof="$(gh api "repos/$repo/compare/$head...$new_head" 2>/dev/null || echo '{}')"
                  main_proof="$(gh api "repos/$repo/compare/$refresh_main_sha...$new_head" 2>/dev/null || echo '{}')"
                  if [ "$(jq -r '.status // ""' <<<"$head_proof")" != ahead ] ||
                     [ "$(jq -r '.behind_by // -1' <<<"$head_proof")" != 0 ] ||
                     [ "$(jq -r '.status // ""' <<<"$main_proof")" != ahead ] ||
                     [ "$(jq -r '.behind_by // -1' <<<"$main_proof")" != 0 ]; then
                    echo "::warning::MAIN_DRIFT_UPDATE_UNVERIFIED:PR#$number; held for provenance."
                    continue
                  fi
                  new_main="$refresh_main_sha"
                  current_body="$(gh api "repos/$repo/pulls/$number" --jq '.body // ""')"
                  updated_body="$(PR_BODY="$current_body" NEW_HEAD="$new_head" NEW_MAIN="$new_main" node --input-type=module - <<'NODE'
          const body=String(process.env.PR_BODY||'');
          const replaceOne=(text,label,value)=>{
            const re=new RegExp(`^${label}:.*$`,'m');
            if(!re.test(text)) throw new Error(`MISSING_${label.replaceAll('-','_').toUpperCase()}`);
            return text.replace(re,`${label}: ${value}`);
          };
          let next=replaceOne(body,'Writer-Lease-State','TERMINAL_DELIVERY');
          next=replaceOne(next,'Base-SHA',process.env.NEW_MAIN);
          next=replaceOne(next,'Writer-Lease-Head',process.env.NEW_HEAD);
          next=replaceOne(next,'Writer-Lease-Main-Epoch',process.env.NEW_MAIN);
          process.stdout.write(next);
          NODE
                  )"
                  gh api --method PATCH "repos/$repo/pulls/$number" -f body="$updated_body" >/dev/null
                  emit_metric "$number" CAS_PROVEN "$next_drift_count"
                  echo "::notice::PR#$number refreshed on same leased lineage $head -> $new_head at main $new_main; MAIN_SYNC lease returned to exact TERMINAL_DELIVERY."
                  recovered_prs=$((recovered_prs + 1))
                  echo "::notice::RECOVERY_PR_BUDGET_USED:$recovered_prs/$RECOVERY_PR_BUDGET"
                else
                  emit_metric "$number" CAS_REJECTED "$next_drift_count"
                  echo "::warning::PR#$number could not be refreshed automatically; restoring terminal lease fail-closed."
                  rejected_head="$(gh api "repos/$repo/pulls/$number" --jq '.head.sha' 2>/dev/null || echo unknown)"
                  rejected_body="$(gh api "repos/$repo/pulls/$number" --jq '.body // ""' 2>/dev/null || echo '')"
                  if [ "$rejected_head" = "$head" ] &&
                     [ "$(sed -n 's/^Writer-Lease-State: //p' <<<"$rejected_body" | tail -n1)" = MAIN_SYNC ]; then
                    restored="$(sed 's/^Writer-Lease-State: MAIN_SYNC$/Writer-Lease-State: TERMINAL_DELIVERY/' <<<"$rejected_body")"
                    gh api --method PATCH "repos/$repo/pulls/$number" -f body="$restored" >/dev/null || true
                  fi
                  # Classification is diagnostic only; the rejected native CAS remains fail-closed.
                  rejection_http="$(grep -Eo 'HTTP [0-9]{3}' /tmp/merge-refresh.err | tail -n1 | awk '{print $2}' || true)"
                  rejection_class="$(node --input-type=module - "$rejection_http" "$head" "$rejected_head" <<'NODE'
          import {classifyCasReadback} from './tools/delivery/recovery-supervisor-telemetry.mjs';
          const [rawStatus,expectedHead,observedHead]=process.argv.slice(2);
          const httpStatus=/^[0-9]{3}$/.test(rawStatus)?Number(rawStatus):null;
          process.stdout.write(classifyCasReadback({httpStatus,expectedHead,observedHead}));
          NODE
                  )"
                  echo "::warning::MAIN_DRIFT_UPDATE_REJECTED:PR#$number class:$rejection_class http:${rejection_http:-UNKNOWN}"
                  cat /tmp/merge-refresh.err || true
                fi
                ;;
            esac
            if [ "$did_recover" -eq 1 ]; then
              recovered_prs=$((recovered_prs + 1))
              echo "::notice::RECOVERY_PR_BUDGET_USED:$recovered_prs/$RECOVERY_PR_BUDGET"
            fi
          done < <(jq -c '.[]' /tmp/open-prs.json)

      - name: Upload source-observed Recovery Supervisor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerhouse-recovery-drift-evidence
          path: .artifacts/powerhouse-recovery-drift-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Recover merged obligations missing terminal closure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          cutoff_epoch="$(date -u -d '7 days ago' +%s)"
          closed="$(gh api "repos/$repo/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100")"
          terminal_runs="$(gh api "repos/$repo/actions/workflows/obligation-terminal-closure.yml/runs?per_page=100")"
          active_terminal_count="$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="pending")] | length' <<<"$terminal_runs")"
          if [ "$active_terminal_count" -gt 0 ]; then
            echo "::notice::Terminal closure recovery already active globally; serial recovery prevents duplicate dispatch storms."
            exit 0
          fi

          while read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            merged_at="$(jq -r '.merged_at' <<<"$pr")"
            body="$(jq -r '.body // ""' <<<"$pr")"
            merged_epoch="$(date -u -d "$merged_at" +%s 2>/dev/null || echo 0)"
            [ "$merged_epoch" -ge "$cutoff_epoch" ] || continue

            grep -Eq '^Obligation-ID: .+' <<<"$body" || continue
            grep -Eq '^Delivery-Lane: .+' <<<"$body" || continue
            grep -Eq '^Candidate-Type: (implementation|recovery|security|dependency|docs|promotion)$' <<<"$body" || continue
            grep -Eq '^Base-SHA: [0-9a-f]{40}$' <<<"$body" || continue
            grep -Eq '^Terminal-State: LIVE_BEWEZEN$' <<<"$body" && continue

            title="Obligation Terminal Closure PR #$number"
            active="$(jq --arg title "$title" '[.workflow_runs[] | select(.display_title==$title and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length' <<<"$terminal_runs")"
            [ "$active" -eq 0 ] || {
              echo "::notice::PR#$number terminal closure already active; duplicate recovery dispatch suppressed."
              continue
            }

            # Bounded retry: no five-minute re-dispatch loop for a deterministic
            # production/proof failure. Leave the obligation nonterminal with
            # inspectable GitHub evidence instead of manufacturing green.
            prior="$(jq --arg title "$title" '[.workflow_runs[] | select(.display_title==$title)] | sort_by(.created_at) | reverse' <<<"$terminal_runs")"
            prior_count="$(jq 'length' <<<"$prior")"
            last_created="$(jq -r '.[0].created_at // ""' <<<"$prior")"
            if [ "$prior_count" -ge 3 ]; then
              echo "::warning::PR#$number terminal closure exhausted 3 attempts; deterministic failure requires targeted repair."
              continue
            fi
            if [ -n "$last_created" ]; then
              last_epoch="$(date -u -d "$last_created" +%s 2>/dev/null || echo 0)"
              now_epoch="$(date -u +%s)"
              if [ "$((now_epoch - last_epoch))" -lt 5400 ]; then
                echo "::notice::PR#$number terminal closure under 90-minute retry cooldown; preserving current evidence."
                continue
              fi
            fi
            echo "::notice::PR#$number is merged but nonterminal; dispatching one canonical terminal closure recovery."
            gh workflow run obligation-terminal-closure.yml --ref main -f pr_number="$number"
            echo "::notice::Serialized recovery: one terminal closure dispatched; remaining obligations wait for the next supervisor cycle."
            break
          done < <(jq -c '.[] | select(.merged_at != null)' <<<"$closed")
