name: Temporary canonical header repair

on:
  push:
    branches:
      - fix/product-prijzen-canonical-view-integrity

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/product-prijzen-canonical-view-integrity
      - name: Replace stale headers with the canonical header
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          canonical = Path('.github/canoniek/kop.html').read_text(encoding='utf-8').strip()
          paths = [
              Path('ai-automatisering-mkb.html'),
              Path('microsoft-365-koppeling.html'),
              Path('power-bi-implementatie.html'),
          ]
          pattern = re.compile(r'<nav class="bgkop"[\s\S]*?</nav>')
          for path in paths:
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(canonical, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one bgkop nav, found {count}')
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Verify SEO gate locally
        run: python .github/scripts/seocontrole.py
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/tmp-repair-stale-canonical-headers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-automatisering-mkb.html microsoft-365-koppeling.html power-bi-implementatie.html .github/workflows/tmp-repair-stale-canonical-headers.yml seo-status.json
          git commit -m "fix: synchronize stale money-page headers"
          git push origin HEAD:fix/product-prijzen-canonical-view-integrity
