name: SEO Baseline Fixer

on:
  push:
    branches: [seo-growth-gates-2026-08-31]
    paths:
      - 'scripts/ci/fix_seo_baseline.py'
      - '.github/workflows/seo-baseline-fixer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-baseline-fixer
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-growth-gates-2026-08-31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow idempotent repairs
        run: python scripts/ci/fix_seo_baseline.py
      - name: Commit repairs if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml zelfscan.html
          git commit -m 'fix(seo): repair baseline metadata and sitemap'
          git push origin HEAD:seo-growth-gates-2026-08-31
