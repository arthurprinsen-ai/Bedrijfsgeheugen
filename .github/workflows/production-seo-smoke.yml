name: Production SEO Smoke

on:
  push:
    branches: [main]
    paths:
      - 'v18-full/**'
      - 'tools/bouw-v18-production*.mjs'
      - 'tools/apply-v18-seo.mjs'
      - 'site/seo-baseline.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/production-seo-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Wait until the exact SEO build is visible on production
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS --max-time 20 'https://www.bedrijfsgeheugen.nl/' -o /tmp/index.html \
              && grep -Fq 'BG_PERSISTENT_SEO_V1' /tmp/index.html; then
              exit 0
            fi
            sleep 10
          done
          echo '::error::Persistent SEO did not reach production within six minutes'
          exit 1

      - name: Verify real production V18 and SEO head
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/index.html','utf8');
          const head = (html.match(/<head\b[^>]*>[\s\S]*?<\/head>/i) || [''])[0];
          const cfg = JSON.parse(fs.readFileSync('site/seo-baseline.json','utf8')).home;
          const need = [
            'view-home','view-product','id="heroBackgroundVideo"','BG_PERSISTENT_SEO_V1',
            `<title>${cfg.title}</title>`,
            `<meta name="description" content="${cfg.description}">`,
            `<meta name="bg-zoekwoord" content="${cfg.primaryKeyword}">`,
            `<link rel="canonical" href="${cfg.canonical}">`,
            `<meta name="robots" content="${cfg.robots}">`,
            'property="og:title"','property="og:description"','property="og:url"','property="og:image"',
            'name="twitter:card" content="summary_large_image"','id="bg-seo-schema"'
          ];
          for (const marker of need) if (!html.includes(marker)) throw new Error(`production marker missing: ${marker}`);
          if (/noindex|nofollow/i.test(head)) throw new Error('production is blocking crawlers');
          if ((head.match(/<title>/g)||[]).length !== 1) throw new Error('production title is not unique');
          if ((head.match(/rel="canonical"/g)||[]).length !== 1) throw new Error('production canonical is not unique');
          if (html.includes('__BG_PRODUCTION_VERSION__') || html.includes('bgMobileNav')) throw new Error('later V18 overlay returned');
          console.log('Real production V18 + SEO head OK');
          NODE

      - name: Verify robots and sitemap on production
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 'https://www.bedrijfsgeheugen.nl/robots.txt' -o /tmp/robots.txt
          curl -fsS --max-time 20 'https://www.bedrijfsgeheugen.nl/sitemap.xml' -o /tmp/sitemap.xml
          grep -Fq 'Sitemap: https://www.bedrijfsgeheugen.nl/sitemap.xml' /tmp/robots.txt
          grep -Fq '<urlset' /tmp/sitemap.xml
          grep -Fq '<loc>https://www.bedrijfsgeheugen.nl/</loc>' /tmp/sitemap.xml
          node <<'NODE'
          const fs=require('node:fs');
          const xml=fs.readFileSync('/tmp/sitemap.xml','utf8');
          const locs=[...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]);
          if (!locs.length) throw new Error('sitemap has no URLs');
          if (new Set(locs).size !== locs.length) throw new Error('sitemap contains duplicate URLs');
          if (locs.some(x=>!x.startsWith('https://www.bedrijfsgeheugen.nl/'))) throw new Error('sitemap contains non-canonical host');
          console.log(`Production sitemap OK: ${locs.length} unique URLs`);
          NODE
