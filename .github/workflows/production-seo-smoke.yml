name: Production SEO and Footer Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/canoniek/voet.html'
      - 'site/footer-contract.json'
      - 'site/seo-baseline.json'
      - 'tools/apply-canonical-footer.mjs'
      - 'tools/validate-footer-seo.mjs'
      - 'tools/verify-public-footer.mjs'
      - '.github/workflows/production-seo-smoke.yml'
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read

jobs:
  preview-footer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Wait for exact Netlify deploy-preview SHA
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 42); do
            json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status")
            state=$(printf '%s' "$json" | jq -r '.statuses[] | select(.context == "netlify/bedrijfsgeheugen/deploy-preview") | .state' | head -n1)
            if [ "$state" = success ]; then exit 0; fi
            if [ "$state" = failure ] || [ "$state" = error ]; then exit 1; fi
            sleep 10
          done
          echo "::error::No successful Netlify deploy-preview for exact SHA $HEAD_SHA"
          exit 1
      - name: Verify canonical public preview footer
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bedrijfsgeheugen.netlify.app
        run: node tools/verify-public-footer.mjs "$PREVIEW_URL"

  production-footer:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Netlify production status on exact github.sha
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 42); do
            json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")
            state=$(printf '%s' "$json" | jq -r '[.statuses[] | select((.context | contains("netlify/bedrijfsgeheugen")) and (.context | contains("deploy-preview") | not))][0].state // empty')
            if [ "$state" = success ]; then exit 0; fi
            if [ "$state" = failure ] || [ "$state" = error ]; then exit 1; fi
            sleep 10
          done
          echo "::error::No successful Netlify production status for exact commit $GITHUB_SHA"
          exit 1
      - name: Verify canonical footer on production
        run: node tools/verify-public-footer.mjs https://www.bedrijfsgeheugen.nl
