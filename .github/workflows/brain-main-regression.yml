name: BRAIN Main Regression (verification only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-main-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-regression:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Assert immutable verification identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "BRAIN verification-only main SHA ${GITHUB_SHA}"
      - name: Run full BRAIN tests without release or mutation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/brain/test-all.mjs 2>&1 | tee .artifacts/brain-main-regression.log
      - name: Upload immutable result log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-main-regression-${{ github.sha }}
          path: .artifacts/brain-main-regression.log
          if-no-files-found: warn
