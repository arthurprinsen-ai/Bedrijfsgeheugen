name: Business OS Intelligence

on:
  pull_request:
    paths:
      - 'platform/intelligence/**'
      - 'platform/agents/**'
      - 'platform/brain/**'
      - 'platform/api/brain-gateway.mjs'
      - 'platform/api/agent-fabric-gateway.mjs'
      - 'netlify/functions/**'
      - 'tests/intelligence-agent-runtime.test.mjs'
      - 'tests/brain-acceptance.test.mjs'
      - 'tests/brain-api-gateway.test.mjs'
      - 'tests/brain-production-ai.test.mjs'
      - 'tests/brain-storage-port.test.mjs'
      - 'tests/agent-fabric.test.mjs'
      - 'tests/agent-fabric-gateway.test.mjs'
      - '.github/workflows/business-os-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Shared Agent Fabric contracts
        run: node --test tests/agent-fabric.test.mjs
      - name: Agent Fabric API boundary
        if: ${{ hashFiles('tests/agent-fabric-gateway.test.mjs') != '' }}
        run: node --test tests/agent-fabric-gateway.test.mjs
      - name: Intelligence and agent runtime contracts
        run: node --test tests/intelligence-agent-runtime.test.mjs
      - name: End-to-end Brain Acceptance Gate
        run: node --test tests/brain-acceptance.test.mjs
      - name: Single governed Brain API boundary
        run: node --test tests/brain-api-gateway.test.mjs
      - name: Governed production AI adapter
        run: node --test tests/brain-production-ai.test.mjs
      - name: Injectable Brain storage port
        run: node --test tests/brain-storage-port.test.mjs
      - name: Trust contracts remain green
        run: node --test tests/policy-engine.test.mjs tests/trust-*.test.mjs
      - name: Foundation contracts remain green
        run: node --test tests/canonical-*.test.mjs tests/source-adapters.test.mjs tests/read-models.test.mjs tests/foundation-registry-eventstore.test.mjs
      - name: Protected portal baseline remains green
        run: python3 .github/scripts/portal_parity.py
