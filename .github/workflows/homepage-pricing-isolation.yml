name: Homepage pricing isolation

on:
  pull_request:
    paths:
      - 'tools/prijzen-uit-de-homepage.mjs'
      - 'tools/homepage-pricing-isolation.mjs'
      - 'tools/seo-order-engine/live-readback.mjs'
      - 'tests/homepage-pricing-isolation.test.mjs'
      - '.github/workflows/homepage-pricing-isolation.yml'
  push:
    branches: [main]
    paths:
      - 'tools/prijzen-uit-de-homepage.mjs'
      - 'tools/homepage-pricing-isolation.mjs'
      - 'tools/seo-order-engine/live-readback.mjs'
      - 'tests/homepage-pricing-isolation.test.mjs'
      - '.github/workflows/homepage-pricing-isolation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/homepage-pricing-isolation.test.mjs
