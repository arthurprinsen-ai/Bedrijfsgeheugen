name: Supabase Preview Applicability
# Required branch-protection producer for conditional hosted Supabase preview.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: supabase-preview-applicability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  applicability:
    name: Supabase Preview Applicability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Classify Supabase applicability
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          if grep -Eq '^supabase/' <<<"$files"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_PREVIEW_APPLICABLE=true"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_PREVIEW_APPLICABLE=false"
          fi

      - name: Non-Supabase change is not applicable
        if: steps.scope.outputs.required != 'true'
        run: |
          echo "No supabase/** changes; provider preview is correctly not applicable."

      - name: Require successful provider Supabase Preview
        if: steps.scope.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100")"
            provider="$(jq -c '[.check_runs[] | select(.name=="Supabase Preview" and .app.id==330661)] | sort_by(.started_at) | last // empty' <<<"$checks")"

            if [ -z "$provider" ]; then
              echo "Provider Supabase Preview not registered yet; attempt $attempt/60"
              sleep 10
              continue
            fi

            status="$(jq -r '.status' <<<"$provider")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$provider")"
            details="$(jq -r '.details_url // ""' <<<"$provider")"
            echo "Provider Supabase Preview status=$status conclusion=$conclusion details=$details"

            if [ "$status" != "completed" ]; then
              sleep 10
              continue
            fi

            if [ "$conclusion" = "success" ]; then
              echo "SUPABASE_PREVIEW_PROVIDER_PROVEN=true"
              exit 0
            fi

            echo "::error::Supabase Preview is required for supabase/** changes but completed with conclusion=$conclusion"
            exit 78
          done

          echo "::error::Supabase Preview did not reach terminal success within bounded wait"
          exit 78
