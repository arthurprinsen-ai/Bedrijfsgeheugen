name: Supabase Preview Applicability

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: supabase-preview-applicability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  applicability:
    name: Supabase Preview Applicability
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - id: scope
        name: Detect Supabase source changes without checkout
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          if grep -q '^supabase/' <<< "$files"; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_PREVIEW_NOT_APPLICABLE: no supabase/** changes on this PR"
          fi
      - uses: actions/checkout@v5
        if: steps.scope.outputs.applicable == 'true'
        with:
          fetch-depth: 0
      - name: Decide applicability and verify provider-owned preview
        if: steps.scope.outputs.applicable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" "$HEAD_SHA" --no-tags
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if ! grep -q '^supabase/' <<< "$changed"; then
            echo "SUPABASE_PREVIEW_NOT_APPLICABLE: no supabase/** changes on exact head $HEAD_SHA"
            exit 0
          fi

          database_relevant_supabase="$(grep '^supabase/' <<< "$changed" | grep -v '^supabase/functions/' | grep -v '^supabase/config.toml$' || true)"
          function_config_only=true
          if grep -qx 'supabase/config.toml' <<< "$changed"; then
            if ! BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" python3 - <<'PY'
          import os
          import subprocess
          import tomllib

          def load(ref):
              raw = subprocess.check_output(['git', 'show', f'{ref}:supabase/config.toml'])
              return tomllib.loads(raw.decode('utf-8'))

          def without_functions(config):
              normalized = dict(config)
              normalized.pop('functions', None)
              return normalized

          base = load(os.environ['BASE_SHA'])
          head = load(os.environ['HEAD_SHA'])
          raise SystemExit(0 if without_functions(base) == without_functions(head) else 1)
          PY
            then
              function_config_only=false
            fi
          fi

          if [ -z "$database_relevant_supabase" ] && [ "$function_config_only" = true ]; then
            echo "SUPABASE_PREVIEW_NOT_APPLICABLE: Edge Function-only Supabase changes, including function-only config.toml metadata, on exact head $HEAD_SHA; provider database preview does not evaluate this surface"
            exit 0
          fi

          echo "Database-relevant Supabase source changed; waiting for the provider-owned Supabase Preview check on exact head $HEAD_SHA."
          stable_provider_success_id=""
          for attempt in $(seq 1 48); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              > /tmp/supabase-preview-check-runs.json

            state="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload=JSON.parse(readFileSync('/tmp/supabase-preview-check-runs.json','utf8'));
          const checks=Array.isArray(payload.check_runs)?payload.check_runs:[];
          const provider=checks.filter(c => c?.name==='Supabase Preview' && c?.app?.slug==='supabase');
          if(provider.length===0){ process.stdout.write('missing'); process.exit(0); }
          provider.sort((a,b)=>(Number(b.id||0)-Number(a.id||0)) || String(b.started_at||'').localeCompare(String(a.started_at||'')));
          const check=provider[0];
          const id=String(check.id||'unknown');
          if(check.status!=='completed'){ process.stdout.write(`pending:${id}`); process.exit(0); }
          process.stdout.write(`${String(check.conclusion||'unknown')}:${id}`);
          NODE
            )"

            case "$state" in
              success:*)
                provider_id="${state#success:}"
                if [ "$stable_provider_success_id" = "$provider_id" ]; then
                  echo "SUPABASE_PREVIEW_PROVIDER_VERIFIED:$HEAD_SHA:$provider_id"
                  exit 0
                fi
                stable_provider_success_id="$provider_id"
                echo "Provider success observed once; requiring a second stable observation for check $provider_id."
                sleep 10
                ;;
              failure:*|cancelled:*|timed_out:*|action_required:*|stale:*|startup_failure:*)
                echo "::error::SUPABASE_PREVIEW_PROVIDER_FAILED:$state:$HEAD_SHA"
                exit 1
                ;;
              skipped:*|neutral:*)
                echo "::error::SUPABASE_PREVIEW_PROVIDER_NON_PROOF:$state:$HEAD_SHA"
                exit 1
                ;;
              missing|pending:*)
                stable_provider_success_id=""
                sleep 10
                ;;
              *)
                echo "::error::SUPABASE_PREVIEW_PROVIDER_UNKNOWN_STATE:$state:$HEAD_SHA"
                exit 1
                ;;
            esac
          done

          echo "::error::SUPABASE_PREVIEW_PROVIDER_TIMEOUT:$HEAD_SHA"
          exit 1
