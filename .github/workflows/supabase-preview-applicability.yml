name: Supabase Preview Applicability

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: supabase-preview-applicability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  applicability:
    name: Supabase Preview Applicability
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decide applicability and verify provider-owned preview
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" "$HEAD_SHA" --no-tags
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if ! grep -q '^supabase/' <<< "$changed"; then
            echo "SUPABASE_PREVIEW_NOT_APPLICABLE: no supabase/** changes on exact head $HEAD_SHA"
            exit 0
          fi

          database_relevant_supabase="$(grep '^supabase/' <<< "$changed" | grep -v '^supabase/functions/' | grep -v '^supabase/config.toml
          # Historical production migrations restored into repository history are already
          # applied. Treat them as preview-non-applicable only when every database-relevant
          # path is a migration whose current Git blob exactly matches the immutable reviewed
          # production-mirror allowlist used by the fail-closed Supabase security gate.
          if [ -n "$database_relevant_supabase" ] && DATABASE_RELEVANT_SUPABASE="$database_relevant_supabase" python3 - <<'PY'
          import ast
          import os
          import pathlib
          import subprocess

          paths = [line.strip() for line in os.environ['DATABASE_RELEVANT_SUPABASE'].splitlines() if line.strip()]
          if not paths or any(not (p.startswith('supabase/migrations/') and p.endswith('.sql')) for p in paths):
              raise SystemExit(1)

          checker = pathlib.Path('scripts/brain/check_powerhouse_supabase_security.py')
          tree = ast.parse(checker.read_text(encoding='utf-8'))
          reviewed = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'HISTORICAL_PRODUCTION_MIRROR_BLOBS' for t in node.targets):
                  reviewed = ast.literal_eval(node.value)
                  break
          if not isinstance(reviewed, dict):
              raise SystemExit(1)

          for path in paths:
              expected = reviewed.get(path)
              if not expected:
                  raise SystemExit(1)
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != expected:
                  raise SystemExit(1)
          PY
          then
            echo "SUPABASE_PREVIEW_NOT_APPLICABLE: immutable reviewed production migration mirrors on exact head $HEAD_SHA"
            exit 0
          fi

          function_config_only=true
          if grep -qx 'supabase/config.toml' <<< "$changed"; then
            if ! BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" python3 - <<'PY'
          import os
          import subprocess
          import tomllib

          def load(ref):
              raw = subprocess.check_output(['git', 'show', f'{ref}:supabase/config.toml'])
              return tomllib.loads(raw.decode('utf-8'))

          def without_functions(config):
              normalized = dict(config)
              normalized.pop('functions', None)
              return normalized

          base = load(os.environ['BASE_SHA'])
          head = load(os.environ['HEAD_SHA'])
          raise SystemExit(0 if without_functions(base) == without_functions(head) else 1)
          PY
            then
              function_config_only=false
            fi
          fi

          if [ -z "$database_relevant_supabase" ] && [ "$function_config_only" = true ]; then
            echo "SUPABASE_PREVIEW_NOT_APPLICABLE: Edge Function-only Supabase changes, including function-only config.toml metadata, on exact head $HEAD_SHA; provider database preview does not evaluate this surface"
            exit 0
          fi

          echo "Database-relevant Supabase source changed; waiting for the provider-owned Supabase Preview check on exact head $HEAD_SHA."
          for attempt in $(seq 1 48); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              > /tmp/supabase-preview-check-runs.json

            state="$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload=JSON.parse(readFileSync('/tmp/supabase-preview-check-runs.json','utf8'));
          const checks=Array.isArray(payload.check_runs)?payload.check_runs:[];
          const provider=checks.filter(c => c?.name==='Supabase Preview' && c?.app?.slug==='supabase');
          if(provider.length===0){ process.stdout.write('missing'); process.exit(0); }
          provider.sort((a,b)=>String(b.completed_at||b.started_at||'').localeCompare(String(a.completed_at||a.started_at||'')));
          const check=provider[0];
          if(check.status!=='completed'){ process.stdout.write('pending'); process.exit(0); }
          process.stdout.write(String(check.conclusion||'unknown'));
          NODE
            )"

            case "$state" in
              success)
                echo "SUPABASE_PREVIEW_PROVIDER_VERIFIED:$HEAD_SHA"
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|stale|startup_failure)
                echo "::error::SUPABASE_PREVIEW_PROVIDER_FAILED:$state:$HEAD_SHA"
                exit 1
                ;;
              skipped|neutral)
                echo "::error::SUPABASE_PREVIEW_PROVIDER_NON_PROOF:$state:$HEAD_SHA"
                exit 1
                ;;
              missing|pending)
                sleep 10
                ;;
              *)
                echo "::error::SUPABASE_PREVIEW_PROVIDER_UNKNOWN_STATE:$state:$HEAD_SHA"
                exit 1
                ;;
            esac
          done

          echo "::error::SUPABASE_PREVIEW_PROVIDER_TIMEOUT:$HEAD_SHA"
          exit 1
 | grep -v '^supabase/migration-history\.lock\.json
          function_config_only=true
          if grep -qx 'supabase/config.toml' <<< "$changed"; then
            if ! BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" python3 - <<'PY'
          import os
          import subprocess
          import tomllib

