name: Production Source Snapshot
# Operational snapshot refresh: 2026-09-22 business-journey-goal-forecast
# Operational snapshot refresh: 2026-09-22 business-context-feedback-workspace
# Operational snapshot refresh: 2026-09-22 portal-lifecycle-context-scale
# Operational snapshot refresh: 2026-09-22 pricing-mobile-billing-controls
# operational refresh: 2026-09-22 composio runtime
# Operational snapshot refresh: 2026-09-22 pricing-production-deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-source-snapshot.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this exact source to Netlify production
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify exact source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Stamp exact API-source identity
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > .bg-source-commit

      - name: Package production source
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          git archive "$GITHUB_SHA" | tar -x -C "$tmpdir"
          printf '%s\n' "$GITHUB_SHA" > "$tmpdir/.bg-source-commit"
          (cd "$tmpdir" && zip -qr "$GITHUB_WORKSPACE/production-source.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: production-source-${{ github.sha }}
          path: production-source.zip
          if-no-files-found: error
          retention-days: 1
 
      - name: Acquire Netlify deploy transport through GitHub OIDC
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || github.event_name == 'push'
        env:
          OIDC_AUDIENCE: bedrijfsgeheugen-netlify-deploy-bridge
          BRIDGE_URL: https://adhjwmvyoixzjtmiroln.supabase.co/functions/v1/netlify-deploy-bridge
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
          token_json="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$request_url")"
          oidc_token="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.value||""))' "$token_json")"
          test -n "$oidc_token"
          bridge_json="$(curl -fsSL --max-time 20 -X POST -H "Authorization: Bearer $oidc_token" -H 'Content-Type: application/json' "$BRIDGE_URL")"
          proxy="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.proxy||""))' "$bridge_json")"
          test -n "$proxy"
          echo "::add-mask::$proxy"
          printf 'NETLIFY_MCP_PROXY_PATH=%s\n' "$proxy" >> "$GITHUB_ENV"

      - name: Deploy exact source through authorized Netlify transport
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 3); do
            current="$(curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/release.json?predeploy=${EXPECTED_SHA}-${attempt}" || true)"
            observed="$(node -e 'try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.commit_ref||""))}catch{}' "$current")"
            if [ "$observed" = "$EXPECTED_SHA" ]; then
              echo "Exact SHA is already live via Git-linked Netlify deploy; no transport side effect required."
              exit 0
            fi
            sleep 10
          done
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=bedrijfsgeheugen-netlify-deploy-bridge"
          token_json="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$request_url")"
          oidc_token="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.value||""))' "$token_json")"
          if [ -n "$oidc_token" ]; then
            trigger_json="$(curl -sS --max-time 25 -X POST \
              -H "Authorization: Bearer $oidc_token" \
              -H 'Content-Type: application/json' \
              --data "$(node -e 'process.stdout.write(JSON.stringify({action:"trigger_build",expected_sha:process.env.EXPECTED_SHA}))')" \
              "https://adhjwmvyoixzjtmiroln.supabase.co/functions/v1/netlify-deploy-bridge" || true)"
            build_ok="$(node -e 'try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.ok===true))}catch{process.stdout.write("false")}' "$trigger_json")"
            linked_build_id="$(node -e 'try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.build_id||""))}catch{}' "$trigger_json")"
            linked_deploy_id="$(node -e 'try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.deploy_id||""))}catch{}' "$trigger_json")"
            echo "NETLIFY_LINKED_BUILD_TRIGGER ok=$build_ok build=${linked_build_id:-none} deploy=${linked_deploy_id:-none}"
            if [ "$build_ok" = "true" ] && [ -n "$linked_deploy_id" ]; then
              for attempt in $(seq 1 120); do
                deploy_json="$(curl -fsSL "$NETLIFY_MCP_PROXY_PATH/api/v1/deploys/$linked_deploy_id" || true)"
                state="$(node -e 'try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.state||""))}catch{}' "$deploy_json")"
                if [ "$state" = "error" ]; then
                  build_json=""
                  if [ -n "$linked_build_id" ]; then
                    build_json="$(curl -fsSL "$NETLIFY_MCP_PROXY_PATH/api/v1/builds/$linked_build_id" || true)"
                  fi
                  node -e '
                    const safe=(raw,kind)=>{try{const x=JSON.parse(raw||"{}");return {
                      kind,id:x.id||null,state:x.state||null,done:x.done??null,error:x.error||null,
                      error_message:x.error_message||null,deploy_id:x.deploy_id||null,
                      created_at:x.created_at||null,updated_at:x.updated_at||null
                    }}catch{return {kind,parse_error:true}}};
                    console.error("NETLIFY_LINKED_DEPLOY_ERROR",JSON.stringify(safe(process.argv[1],"deploy")));
                    console.error("NETLIFY_LINKED_BUILD_ERROR",JSON.stringify(safe(process.argv[2],"build")));
                  ' "$deploy_json" "$build_json"
                  echo "::error::Netlify linked production build failed for deploy $linked_deploy_id"
                  exit 78
                fi
                current="$(curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/release.json?linked_build=${EXPECTED_SHA}-${attempt}" || true)"
                observed="$(node -e 'try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.commit_ref||""))}catch{}' "$current")"
                if [ "$observed" = "$EXPECTED_SHA" ]; then
                  echo "Exact SHA reached production through linked-repository Netlify build."
                  exit 0
                fi
                if [ "$state" = "ready" ]; then
                  sleep 5
                else
                  sleep 5
                fi
              done
              echo "::error::Linked Netlify build did not expose exact SHA ${EXPECTED_SHA} within bounded readback"
              exit 78
            fi
          fi

          if [ -z "${NETLIFY_MCP_PROXY_PATH:-}" ]; then
            echo "::error::Netlify Git deploy did not reach ${EXPECTED_SHA} and OIDC deploy transport was unavailable"
            exit 78
          fi
          deploy_log="$(mktemp)"
          npx -y @netlify/mcp@latest --site-id fd527056-493a-4d8a-8125-d00370104fa3 --proxy-path "$NETLIFY_MCP_PROXY_PATH" 2>&1 | tee "$deploy_log"
          deploy_id="$(node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8");const m=s.match(/"deployId":"([^"]+)"/);process.stdout.write(m?m[1]:"")' "$deploy_log")"
          build_id="$(node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8");const m=s.match(/"buildId":"([^"]+)"/);process.stdout.write(m?m[1]:"")' "$deploy_log")"
          if [ -n "$deploy_id" ]; then printf 'NETLIFY_DEPLOY_ID=%s\n' "$deploy_id" >> "$GITHUB_ENV"; fi
          if [ -n "$build_id" ]; then printf 'NETLIFY_BUILD_ID=%s\n' "$build_id" >> "$GITHUB_ENV"; fi

      - name: Fail fast on Netlify provider build error
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_DEPLOY_ID:-}" ]; then
            echo "No explicit Netlify deploy id: Git-linked production may already be current."
            exit 0
          fi
          for attempt in $(seq 1 120); do
            deploy_json="$(curl -fsSL "$NETLIFY_MCP_PROXY_PATH/api/v1/deploys/$NETLIFY_DEPLOY_ID" || true)"
            state="$(node -e 'try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.state||""))}catch{}' "$deploy_json")"
            if [ "$state" = "ready" ]; then
              echo "NETLIFY_PROVIDER_BUILD_READY deploy=$NETLIFY_DEPLOY_ID build=${NETLIFY_BUILD_ID:-unknown}"
              exit 0
            fi
            if [ "$state" = "error" ]; then
              build_json=""
              if [ -n "${NETLIFY_BUILD_ID:-}" ]; then
                build_json="$(curl -fsSL "$NETLIFY_MCP_PROXY_PATH/api/v1/builds/$NETLIFY_BUILD_ID" || true)"
              fi
              node -e '
                const safe=(raw,kind)=>{try{const x=JSON.parse(raw||"{}");return {
                  kind,
                  id:x.id||null,
                  state:x.state||null,
                  done:x.done??null,
                  error:x.error||null,
                  error_message:x.error_message||null,
                  deploy_id:x.deploy_id||null,
                  created_at:x.created_at||null,
                  updated_at:x.updated_at||null
                }}catch{return {kind,parse_error:true}}};
                console.error("NETLIFY_PROVIDER_DEPLOY_ERROR",JSON.stringify(safe(process.argv[1],"deploy")));
                console.error("NETLIFY_PROVIDER_BUILD_ERROR",JSON.stringify(safe(process.argv[2],"build")));
              ' "$deploy_json" "$build_json"
              echo "::error::Netlify provider build failed for deploy $NETLIFY_DEPLOY_ID"
              exit 78
            fi
            sleep 5
          done
          echo "::error::Netlify provider deploy did not reach ready/error within bounded provider watch"
          exit 78

      - name: Prove exact production identity
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/release.json?deploy_proof=${EXPECTED_SHA}-${attempt}" -o /tmp/release.json; then
              observed="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/release.json","utf8"));process.stdout.write(String(x.commit_ref||""))')"
              context="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/release.json","utf8"));process.stdout.write(String(x.context||""))')"
              deploy_id="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/release.json","utf8"));process.stdout.write(String(x.deploy_id||""))')"
              if [ "$observed" = "$EXPECTED_SHA" ] && [ "$context" = "production" ] && [ -n "$deploy_id" ]; then
                echo "NETLIFY_EXACT_PRODUCTION_PROVEN sha=$observed deploy=$deploy_id"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Netlify production did not expose exact SHA ${EXPECTED_SHA} within bounded readback"
          exit 78

      - name: Prove pricing production content
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || github.event_name == 'push'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/prijzen?pricing_proof=${GITHUB_SHA}-${attempt}" -o /tmp/prijzen.html; then
              if grep -q 'data-bg-billing="monthly"' /tmp/prijzen.html \
                && grep -q 'data-bg-billing="yearly"' /tmp/prijzen.html \
                && grep -q 'data-bg-price-tab="start"' /tmp/prijzen.html \
                && grep -q 'data-bg-price-tab="run"' /tmp/prijzen.html \
                && grep -q 'data-bg-stage="grow"' /tmp/prijzen.html \
                && grep -q 'data-bg-stage="loss"' /tmp/prijzen.html \
                && grep -q 'data-bg-stage="crisis"' /tmp/prijzen.html \
                && grep -q 'data-bg-stage="buy"' /tmp/prijzen.html \
                && grep -q 'data-bg-stage="sell"' /tmp/prijzen.html \
                && grep -q 'data-bg-stage="portfolio"' /tmp/prijzen.html \
                && grep -q 'pricing-interactions-rescue-v1.js?v=20260924-0750' /tmp/prijzen.html; then
                echo "PRICING_PRODUCTION_CONTENT_PROVEN sha=${GITHUB_SHA}"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Live pricing page does not match canonical responsive billing/tab/lifecycle contract"
          exit 78

      - name: Install production interaction browser
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || github.event_name == 'push'
        run: PLAYWRIGHT_PACKAGE=playwright@1.55.0 bash tools/ci/install-chromium.sh

      - name: Prove pricing toggles and English switch in production browser
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || github.event_name == 'push'
        env:
          BASE_URL: https://www.bedrijfsgeheugen.nl
        run: node tools/site-shell/verify-pricing-i18n-production.mjs
