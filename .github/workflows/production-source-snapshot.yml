name: Production Source Snapshot
# Operational snapshot refresh: 2026-09-22 business-journey-goal-forecast
# Operational snapshot refresh: 2026-09-22 business-context-feedback-workspace
# Operational snapshot refresh: 2026-09-22 portal-lifecycle-context-scale
# Operational snapshot refresh: 2026-09-22 pricing-mobile-billing-controls
# operational refresh: 2026-09-22 composio runtime
# Operational snapshot refresh: 2026-09-22 pricing-production-deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-source-snapshot.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this exact source to Netlify production
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Stamp exact API-source identity
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > .bg-source-commit

      - name: Package production source
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          git archive "$GITHUB_SHA" | tar -x -C "$tmpdir"
          printf '%s\n' "$GITHUB_SHA" > "$tmpdir/.bg-source-commit"
          (cd "$tmpdir" && zip -qr "$GITHUB_WORKSPACE/production-source.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: production-source-${{ github.sha }}
          path: production-source.zip
          if-no-files-found: error
          retention-days: 1
 
      - name: Deploy exact source through authorized Netlify transport
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || github.event_name == 'push'
        env:
          NETLIFY_MCP_PROXY_PATH: ${{ secrets.NETLIFY_MCP_PROXY_PATH_TEMP }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            current="$(curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/release.json?predeploy=${EXPECTED_SHA}-${attempt}" || true)"
            observed="$(node -e 'try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.commit_ref||""))}catch{}' "$current")"
            if [ "$observed" = "$EXPECTED_SHA" ]; then
              echo "Exact SHA is already live via Git-linked Netlify deploy; no transport side effect required."
              exit 0
            fi
            sleep 10
          done
          if [ -z "${NETLIFY_MCP_PROXY_PATH:-}" ]; then
            echo "::error::Netlify Git deploy did not reach ${EXPECTED_SHA} and NETLIFY_MCP_PROXY_PATH_TEMP is missing"
            exit 78
          fi
          npx -y @netlify/mcp@latest --site-id fd527056-493a-4d8a-8125-d00370104fa3 --no-wait --proxy-path "$NETLIFY_MCP_PROXY_PATH"

      - name: Prove exact production identity
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/release.json?deploy_proof=${EXPECTED_SHA}-${attempt}" -o /tmp/release.json; then
              observed="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/release.json","utf8"));process.stdout.write(String(x.commit_ref||""))')"
              context="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/release.json","utf8"));process.stdout.write(String(x.context||""))')"
              deploy_id="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/release.json","utf8"));process.stdout.write(String(x.deploy_id||""))')"
              if [ "$observed" = "$EXPECTED_SHA" ] && [ "$context" = "production" ] && [ -n "$deploy_id" ]; then
                echo "NETLIFY_EXACT_PRODUCTION_PROVEN sha=$observed deploy=$deploy_id"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Netlify production did not expose exact SHA ${EXPECTED_SHA} within bounded readback"
          exit 78

      - name: Prove pricing production content
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || github.event_name == 'push'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsSL -H 'Cache-Control: no-cache' "https://www.bedrijfsgeheugen.nl/prijzen?pricing_proof=${GITHUB_SHA}-${attempt}" -o /tmp/prijzen.html; then
              if grep -q '<h3>Build</h3>' /tmp/prijzen.html \
                && grep -q 'Wat moet het opleveren om zichzelf terug te verdienen?' /tmp/prijzen.html \
                && ! grep -q '<h3>Transform</h3>' /tmp/prijzen.html \
                && ! grep -q 'Per jaar' /tmp/prijzen.html \
                && ! grep -q '2 maanden gratis' /tmp/prijzen.html; then
                echo "PRICING_PRODUCTION_CONTENT_PROVEN sha=${GITHUB_SHA}"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Live pricing page does not match canonical Build/value-proof/no-annual-toggle contract"
          exit 78
