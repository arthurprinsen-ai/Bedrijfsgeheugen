name: Required Gate Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: required-gate-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Recover missing gates and route failed gates to existing agent owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/required-gate-watchdog.mjs
      - name: Preserve denied handoff evidence for the existing owner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-gate-owner-handoff-${{ github.run_id }}
          path: .artifacts/required-gate-owner-handoff.json
          if-no-files-found: ignore
          retention-days: 30
