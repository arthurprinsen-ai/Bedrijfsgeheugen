name: Required Gate Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: required-gate-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify fail-closed watchdog owner routing before GitHub writes
        run: node --test tests/brain-required-gate-watchdog-403-resilience-v1.test.mjs tests/brain-required-failed-gate-owner-routing-v1.test.mjs
      - name: Recover missing gates and route failed gates to existing agent owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/required-gate-watchdog.mjs
