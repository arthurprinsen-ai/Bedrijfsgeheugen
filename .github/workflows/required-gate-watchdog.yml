name: Required Gate Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  # PR issue-comment API accepts Pull requests:write; Issues:write alone was denied in production.
  pull-requests: write
  issues: write

concurrency:
  group: required-gate-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Recover missing gates and route failed gates to existing agent owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/required-gate-watchdog.mjs
