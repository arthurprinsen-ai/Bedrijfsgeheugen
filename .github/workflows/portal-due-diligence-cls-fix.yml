name: Temporary due-diligence CLS fix

on:
  push:
    branches:
      - feature/klantenportaal-brain-powerhouse-v1
    paths:
      - .github/workflows/portal-due-diligence-cls-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/klantenportaal-brain-powerhouse-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply minimal verified CLS fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('due-diligence.html')
          s = p.read_text(encoding='utf-8')
          old = '.p-hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center}'
          new = '.p-hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:start}'
          if old not in s:
              raise SystemExit('expected due-diligence hero selector not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium
      - name: Verify full page control
        run: python .github/scripts/paginacontrole.py
      - name: Commit only verified page fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- due-diligence.html
          git commit -m "fix: stabilize due-diligence hero layout"
          git push origin HEAD:feature/klantenportaal-brain-powerhouse-v1
