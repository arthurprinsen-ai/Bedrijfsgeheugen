name: Pagina- en SEO-controle diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installeer Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Pagina's controleren
        run: python tools/paginacontrole.py
      - name: SEO en interne links controleren
        run: python tools/seo_controle.py
