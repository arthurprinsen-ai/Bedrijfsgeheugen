name: Debug Netlify build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm install --ignore-scripts
      - name: Run Netlify build command and capture log
        shell: bash
        run: |
          set +e
          export STATIC_I18N_NETWORK=0
          export STATIC_I18N_REQUIRE_CACHE=1
          export NODE_OPTIONS=--max-old-space-size=2048
          CMD="node tools/site-shell/pricing-build-integrity.mjs capture && node tools/site-shell/bedrijfslek-build-integrity.mjs capture && node tools/bouw-powerhouse-auth.mjs && node tools/bouw-kennisindex.mjs && node tools/bouw-v18-production.mjs && node tools/site-shell/apply-product-led-home.mjs && node tools/apply-tabbladen.mjs && node tools/bouw-v18-views.mjs && node tools/bouw-v18-chrome-alles.mjs && node tools/prijzen-uit-de-homepage.mjs && node tools/site-shell/pricing-build-integrity.mjs restore && node tools/site-shell/bedrijfslek-build-integrity.mjs restore && node tools/normaliseer-site-ui.mjs && node tools/seo-order-engine/apply.mjs && node tools/seo-order-engine/validate.mjs && node tools/site-shell/apply-i18n.mjs && node tools/site-shell/build-localized-routes.mjs && node tools/site-shell/apply-commercial-pricing-v1.mjs && node tools/seo-order-engine/apply-revenue-links.mjs && node tools/site-shell/finalize-website-coherence-v1.mjs && node tools/genereer-sitemap.mjs && node tools/seo-order-engine/validate-locales.mjs && node tools/bouw-release-evidence.mjs"
          bash -lc "$CMD" > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> build.log
          cat build.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: netlify-build-log
          path: build.log
