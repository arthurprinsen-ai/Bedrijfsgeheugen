name: Configuratiewacht
on:
  push:
    branches: [main]
    paths: ['netlify.toml','_redirects','sitemap.xml','tools/seo-controle.py','tools/config-wacht.py','.github/workflows/*.yml']
  workflow_dispatch:
  schedule:
    - cron: '10 5 * * 1-5'
permissions:
  contents: read
jobs:
  wacht:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python3 tools/config-wacht.py
