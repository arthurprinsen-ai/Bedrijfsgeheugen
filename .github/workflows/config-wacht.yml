name: Configuratiewacht

# Kijkt bij elke wijziging of netlify.toml, _redirects en sitemap.xml nog
# leesbaar zijn. Aanleiding: op 20 augustus 2026 stond de inhoud van _redirects
# twee keer in netlify.toml. Netlify kwam niet verder dan "Reading and parsing
# configuration files" en elke build faalde - urenlang, terwijl de commits
# gewoon doorliepen en de site op de oude versie bleef staan.
#
# Op een pull request is dit een rem: de fout kan niet gemerged worden.
# Op main is het een melding: de fout staat er dan al, en je wilt hem meteen zien.

on:
  push:
    branches: [main]
    paths:
      - 'netlify.toml'
      - '_redirects'
      - 'sitemap.xml'
      - 'tools/seo-controle.py'
      - '.github/workflows/config-wacht.yml'
  pull_request:
    paths:
      - 'netlify.toml'
      - '_redirects'
      - 'sitemap.xml'
  workflow_dispatch:
  schedule:
    # elke werkdag 07:10 Nederlandse tijd, ook als er niets gepusht is
    - cron: '10 5 * * 1-5'

permissions:
  contents: read
  issues: write

concurrency:
  group: config-wacht
  cancel-in-progress: true

jobs:
  wacht:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configuratie nalopen
        id: wacht
        continue-on-error: true
        run: |
          python3 tools/config-wacht.py | tee config-rapport.md
          echo "code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Uitkomst in de samenvatting
        if: always()
        run: cat config-rapport.md >> $GITHUB_STEP_SUMMARY

      - name: Melding maken als er iets mis is
        if: steps.wacht.outputs.code != '0' && github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('config-rapport.md', 'utf8')
              + '\n\nZolang dit niet is opgelost, komt geen enkele wijziging live.'
              + ' De site blijft op de laatste geslaagde build staan.';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'configuratiewacht'
            });
            if (open.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Configuratiewacht: de site kan niet gebouwd worden',
                body, labels: ['configuratiewacht']
              });
            }

      - name: Melding sluiten als alles goed is
        if: steps.wacht.outputs.code == '0' && github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'configuratiewacht'
            });
            for (const i of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, body: 'Opgelost - de configuratie is weer leesbaar.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed'
              });
            }

      - name: Falen doorgeven
        if: steps.wacht.outputs.code != '0'
        run: exit 1
