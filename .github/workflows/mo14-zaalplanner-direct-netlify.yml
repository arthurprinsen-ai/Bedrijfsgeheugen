# PW Enschede bordeaux crest, seven editable dates; direct independent Netlify site, no Make.
# PR #5875 app-menu v4: repeat canonical release after correcting test regex (no Make).
# V4 app-style menus, five real tabs and native startup hub; release rechecked on exact MO14 site.
# MO14 PWA mobile-app v3 production release: 2026-11-15 18:xx NL
# Renewed Netlify deployment authority for MO14 app experience, 2026-11-15
name: MO14-1 zaalplanner direct Netlify deploy
on:
  push:
    branches: ['feature/mo14-zaalplanner-20261115']
    paths: ['.github/workflows/mo14-zaalplanner-direct-netlify.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mo14-zaalplanner-direct-netlify-production
  cancel-in-progress: false
jobs:
  deploy-mo14:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-mo14]')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      MO14_SITE_ID: 1c4fa5ce-45ae-45dc-b3e2-11f90587c474
      MO14_DOMAIN: https://pw-mo14-1.netlify.app
      MO14_NETLIFY_PROXY_PATH: ${{ secrets.MO14_NETLIFY_PROXY_TEMP }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify planner and independent website source
        run: |
          set -euo pipefail
          node --test tests/brain-mo14-zaalplanner-direct-netlify-delivery-20261115.test.mjs tests/brain-mo14-zaalcoach-pwa-20261115.test.mjs
          test -s pw-mo14-1/zaalplanner/index.html
      - name: Preserve existing MO14 homepage and assets before deploy
        run: |
          set -euo pipefail
          mkdir -p .mo14-stage/zaalplanner/icons .mo14-backup
          for f in index.html style.css data.js player.js team.js sync.js; do
            curl -fLsS --retry 3 --connect-timeout 10 --max-time 40 "${MO14_DOMAIN}/${f}?preserve=${GITHUB_SHA}" -o ".mo14-stage/${f}"
            test -s ".mo14-stage/${f}"
            if grep -Eiq '<!doctype html>|<html[ >]' ".mo14-stage/${f}" && test "${f}" != index.html; then
              echo "Old site asset ${f} returned HTML; abort." >&2
              exit 1
            fi
            cp ".mo14-stage/${f}" ".mo14-backup/${f}"
          done
          test "$(wc -c < .mo14-stage/index.html)" -gt 300
          cp pw-mo14-1/zaalplanner/index.html .mo14-stage/zaalplanner/index.html
          cp pw-mo14-1/zaalplanner/manifest.webmanifest .mo14-stage/zaalplanner/manifest.webmanifest
          cp pw-mo14-1/zaalplanner/sw.js .mo14-stage/zaalplanner/sw.js
          mkdir -p .mo14-stage/zaalplanner/icons
          cp pw-mo14-1/zaalplanner/icons/icon-*.png .mo14-stage/zaalplanner/icons/
          # PW Enschede crest as used in the existing PW Hockey app; fail closed if source fails.
          if ! curl -fLsS --retry 2 --connect-timeout 10 --max-time 35 "https://cdn.aptoide.com/imgs/f/7/8/f783f40b61eb7a802a6c325305bc825a_icon.png" -o .mo14-stage/zaalplanner/pw-logo.png; then
            curl -fLsS --retry 2 --connect-timeout 10 --max-time 35 "https://lirp.cdn-website.com/dcf7ef47/dms3rep/multi/opt/logolustrum-B-1920w.png" -o .mo14-stage/zaalplanner/pw-logo.png
          fi
          file .mo14-stage/zaalplanner/pw-logo.png | grep -q 'PNG image data'
          test "$(wc -c < .mo14-stage/zaalplanner/pw-logo.png)" -gt 1200
          if command -v magick >/dev/null 2>&1; then
            magick .mo14-stage/zaalplanner/pw-logo.png -resize 192x192 -background white -gravity center -extent 192x192 .mo14-stage/zaalplanner/icons/icon-192.png
            magick .mo14-stage/zaalplanner/pw-logo.png -resize 512x512 -background white -gravity center -extent 512x512 .mo14-stage/zaalplanner/icons/icon-512.png
          elif command -v convert >/dev/null 2>&1; then
            convert .mo14-stage/zaalplanner/pw-logo.png -resize 192x192 -background white -gravity center -extent 192x192 .mo14-stage/zaalplanner/icons/icon-192.png
            convert .mo14-stage/zaalplanner/pw-logo.png -resize 512x512 -background white -gravity center -extent 512x512 .mo14-stage/zaalplanner/icons/icon-512.png
          elif python3 -c 'from PIL import Image' >/dev/null 2>&1; then
            python3 - <<'PYICON'
          from PIL import Image
          img=Image.open('.mo14-stage/zaalplanner/pw-logo.png').convert('RGBA')
          for size in (192,512):
              icon=img.copy()
              icon.thumbnail((size,size))
              bg=Image.new('RGBA',(size,size),'white')
              bg.alpha_composite(icon,((size-icon.width)//2,(size-icon.height)//2))
              bg.convert('RGB').save(f'.mo14-stage/zaalplanner/icons/icon-{size}.png')
          PYICON
          else
            echo 'No PNG icon resizer available, aborting production upload' >&2
            exit 1
          fi
          for size in 192 512; do
            file ".mo14-stage/zaalplanner/icons/icon-${size}.png" | grep -q 'PNG image data'
          done
          sha256sum .mo14-stage/index.html .mo14-stage/zaalplanner/index.html > .mo14-backup/manifest.sha256
          echo "Original files backed up and planner staged."
      - name: Save original MO14 site artifact
        uses: actions/upload-artifact@v4
        with:
          name: mo14-predeploy-${{ github.sha }}
          path: .mo14-backup/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
      - name: Direct Netlify production upload (no Make)
        run: |
          set -euo pipefail
          if [[ -z "${MO14_NETLIFY_PROXY_PATH}" || "${MO14_NETLIFY_PROXY_PATH}" != https://netlify-mcp.netlify.app/proxy/* ]]; then
            echo 'MO14 Netlify credential absent or invalid; no upload.' >&2
            exit 1
          fi
          cd .mo14-stage
          npx -y @netlify/mcp@latest --site-id "${MO14_SITE_ID}" --proxy-path "${MO14_NETLIFY_PROXY_PATH}"
      - name: Independent live readback of planner and preserved homepage
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fLsS --max-time 25 "${MO14_DOMAIN}/zaalplanner/?sha=${GITHUB_SHA}" -o /tmp/mo14-new.html && grep -q 'id="keeper"' /tmp/mo14-new.html
          grep -q 'data-view-panel="home"' /tmp/mo14-new.html
          grep -q 'id="appDrawer"' /tmp/mo14-new.html
          grep -q 'data-go="settings"' /tmp/mo14-new.html
          grep -q 'Clublogo PW Hockey Enschede' /tmp/mo14-new.html
          grep -q 'data-match-date=' /tmp/mo14-new.html
          grep -q 'formatMatchDate(i)' /tmp/mo14-new.html && grep -q 'id="pdfAll"' /tmp/mo14-new.html; then break; fi
            sleep 10
          done
          grep -q 'id="keeper"' /tmp/mo14-new.html
          curl -fLsS --max-time 25 "${MO14_DOMAIN}/zaalplanner/manifest.webmanifest?sha=${GITHUB_SHA}" -o /tmp/mo14-manifest.json
          node -e "const m=require('/tmp/mo14-manifest.json'); if(m.display!=='standalone'||m.scope!=='./'||m.icons.length<2||m.shortcuts?.length<3||m.theme_color!=='#59222d')process.exit(1)"
          curl -fLsS --max-time 25 "${MO14_DOMAIN}/zaalplanner/sw.js?sha=${GITHUB_SHA}" | grep -q 'mo14-zaalcoach-v5-pw'
          curl -fLsS --max-time 25 "${MO14_DOMAIN}/zaalplanner/pw-logo.png?sha=${GITHUB_SHA}" -o /tmp/mo14-pw-crest.png
          file /tmp/mo14-pw-crest.png | grep -q 'PNG image data'
          cmp -s .mo14-stage/zaalplanner/pw-logo.png /tmp/mo14-pw-crest.png || { echo 'PW crest differs on production' >&2; exit 1; }
          for size in 192 512; do
            curl -fLsS --max-time 25 "${MO14_DOMAIN}/zaalplanner/icons/icon-${size}.png?sha=${GITHUB_SHA}" -o "/tmp/mo14-icon-${size}.png"
            file "/tmp/mo14-icon-${size}.png" | grep -q 'PNG image data'
          done
          curl -fLsS --max-time 25 "${MO14_DOMAIN}/?sha=${GITHUB_SHA}" -o /tmp/mo14-home.html
          cmp -s .mo14-backup/index.html /tmp/mo14-home.html || { echo 'Original homepage not preserved' >&2; exit 1; }
          echo "MO14 production planner verified at ${MO14_DOMAIN}/zaalplanner/"
