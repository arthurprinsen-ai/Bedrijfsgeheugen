name: Portal V2 Production DOM Readback

on:
  push:
    branches: [main]
    paths:
      - 'portal-v2/**'
  workflow_dispatch:
    inputs:
      approved_pr_number:
        description: 'Merged Portal V2 PR whose exact approved head must be visually compared with current production'
        type: string
        required: true
      production_sha:
        description: 'Previously published main SHA; only allowed if later commits are CI/evidence-only'
        type: string
        required: false

concurrency:
  group: portal-v2-production-dom-readback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  production-dom-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Chromium verifier
        run: |
          PLAYWRIGHT_PACKAGE=@playwright/test@1.55.0 bash tools/ci/install-chromium.sh
      - name: Resolve exact readback alias
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRODUCTION_SHA_OVERRIDE: ${{ inputs.production_sha || '' }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "PORTAL_ALIAS_URL=https://deploy-preview-${PR_NUMBER}--bedrijfsgeheugen.netlify.app" >> "$GITHUB_ENV"
            echo "PORTAL_EXPECTED_SHA=${PR_HEAD_SHA}" >> "$GITHUB_ENV"
            echo "PORTAL_BASE_SHA=${PR_BASE_SHA}" >> "$GITHUB_ENV"
          else
            echo "PORTAL_ALIAS_URL=https://www.bedrijfsgeheugen.nl" >> "$GITHUB_ENV"
            echo "PORTAL_EXPECTED_SHA=${PRODUCTION_SHA_OVERRIDE:-$GITHUB_SHA}" >> "$GITHUB_ENV"
          fi
      - name: Verify published SHA override is strictly scoped to CI and evidence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$PORTAL_EXPECTED_SHA" = "$GITHUB_SHA" ]; then
            echo "EXACT_MAIN_PRODUCTION_TARGET:$GITHUB_SHA"
            exit 0
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/main" ] || ! [[ "$PORTAL_EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Production SHA override requires main workflow_dispatch with valid commit SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PORTAL_EXPECTED_SHA" "$GITHUB_SHA"; then
            echo "::error::Selected published revision is not an ancestor of current main."
            exit 1
          fi
          changed="$(git diff --name-only "$PORTAL_EXPECTED_SHA" "$GITHUB_SHA")"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              .github/workflows/*|tests/*|docs/*|brain/learning/*|tools/ci/*) ;;
              *)
                echo "::error::Runtime source changed after selected production SHA: $file"
                exit 1
                ;;
            esac
          done <<< "$changed"
          echo "SCOPE_ONLY_PRODUCTION_TARGET:deployed=$PORTAL_EXPECTED_SHA:workflow_main=$GITHUB_SHA"
      - name: Classify visual baseline impact fail-closed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APPROVED_PR_NUMBER: ${{ inputs.approved_pr_number }}
        run: |
          set -euo pipefail
          visual_required=true
          resolved_pr="$PR_NUMBER"
          if [ "$EVENT_NAME" = "push" ]; then
            pr_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
            resolved_pr="$(jq -r '[.[] | select(.merged_at != null)] | first | .number // empty' <<<"$pr_json")"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ ! "$APPROVED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::An exact merged approved_pr_number is required for manual production visual readback."
              exit 1
            fi
            resolved_pr="$APPROVED_PR_NUMBER"
            meta="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${resolved_pr}")"
            merged_at="$(jq -r '.merged_at // empty' <<<"$meta")"
            merge_sha="$(jq -r '.merge_commit_sha // empty' <<<"$meta")"
            if [ -z "$merged_at" ] || [[ ! "$merge_sha" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::Manual visual baseline must derive from an already protected-merged PR."
              exit 1
            fi
            comparison="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/compare/${merge_sha}...${PORTAL_EXPECTED_SHA}")"
            relation="$(jq -r '.status // empty' <<<"$comparison")"
            if [ "$relation" != "identical" ] && [ "$relation" != "ahead" ]; then
              echo "::error::Source PR merge is not in the verified published production ancestry."
              exit 1
            fi
            echo "APPROVED_VISUAL_PR=${resolved_pr}" >> "$GITHUB_ENV"
          fi
          if [ -n "$resolved_pr" ]; then
            files="$(gh api --paginate -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${resolved_pr}/files?per_page=100" --jq '.[].filename')"
            visual_required=false
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                portal-v2/domain-state.js|portal-v2/portal-state.js|portal-v2/business-input-store.js|portal-next/portal-business-input-store.js|tests/portal-business-input.test.mjs|tests/portal-business-input-browser-boundary.test.mjs|.github/workflows/business-os-live-preview.yml|.github/workflows/portal-v2-production-dom-readback.yml)
                  ;;
                portal-v2/*|tests/integration/portal-v2-production-visual-regression.spec.js)
                  visual_required=true
                  break
                  ;;
              esac
            done <<< "$files"
          fi
          echo "VISUAL_BASELINE_REQUIRED=$visual_required" >> "$GITHUB_ENV"
          echo "Visual baseline required: $visual_required"
      - name: Wait for exact deployed SHA and pin immutable deploy
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            payload="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${PORTAL_ALIAS_URL}/release.json?sha=${PORTAL_EXPECTED_SHA}&attempt=${attempt}" || true)"
            deployed_sha="$(node -e 'try { const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.commit_ref||"")); } catch {}' "$payload")"
            deploy_id="$(node -e 'try { const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.deploy_id||"")); } catch {}' "$payload")"
            if [ "$deployed_sha" = "$PORTAL_EXPECTED_SHA" ] && [ -n "$deploy_id" ]; then
              immutable="https://${deploy_id}--bedrijfsgeheugen.netlify.app"
              immutable_payload="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${immutable}/release.json?sha=${PORTAL_EXPECTED_SHA}" || true)"
              immutable_sha="$(node -e 'try { const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.commit_ref||"")); } catch {}' "$immutable_payload")"
              if [ "$immutable_sha" = "$PORTAL_EXPECTED_SHA" ]; then
                echo "PORTAL_READBACK_URL=${immutable}" >> "$GITHUB_ENV"
                echo "NETLIFY_DEPLOY_ID=${deploy_id}" >> "$GITHUB_ENV"
                echo "Exact immutable deploy ready: ${deploy_id} / ${deployed_sha}"
                break
              fi
            fi
            echo "Waiting for exact deploy ${PORTAL_EXPECTED_SHA}; observed ${deployed_sha:-none}, deploy ${deploy_id:-none} (attempt ${attempt}/90)"
            if [ "$attempt" -eq 90 ]; then
              echo "::error::Exact immutable Netlify deploy did not become ready. Expected ${PORTAL_EXPECTED_SHA}, observed ${deployed_sha:-none}."
              exit 1
            fi
            sleep 4
          done
      - name: Wait for exact readback target
        env:
          CACHEBUST: bg_preview_ready
        run: bash tools/ci/wait-for-url.sh "${PORTAL_READBACK_URL}/portal-v2/"
      - name: Read back Portal V2 DOM, standalone routing and CSRD assets
        env:
          PRODUCTION_URL: ${{ env.PORTAL_READBACK_URL }}
        run: npx playwright test tests/integration/portal-v2-production-*.spec.js --workers=1
      - name: Read back hydrated mobile demoAI shell
        env:
          PREVIEW_URL: ${{ env.PORTAL_READBACK_URL }}
        run: npx playwright test tests/integration/portal-v2-mobile-shell.spec.js --workers=1
      - name: Capture exact-head PR visual baseline
        if: github.event_name == 'pull_request' && env.VISUAL_BASELINE_REQUIRED == 'true'
        env:
          PRODUCTION_URL: ${{ env.PORTAL_READBACK_URL }}
          VISUAL_CAPTURE_PATH: artifacts/visual-baseline-pr/portal-v2-canvassen.png
        run: npx playwright test tests/integration/portal-v2-production-visual-regression.spec.js --workers=1
      - name: Upload approved PR visual baseline
        if: github.event_name == 'pull_request' && env.VISUAL_BASELINE_REQUIRED == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/visual-baseline-pr/portal-v2-canvassen.png
          if-no-files-found: error
          retention-days: 30
      - name: Resolve approved visual baseline
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.VISUAL_BASELINE_REQUIRED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${APPROVED_VISUAL_PR:-}" ]; then
            pr_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${APPROVED_VISUAL_PR}")"
            pr_number="$(jq -r '.number // empty' <<<"$pr_json")"
            pr_head_sha="$(jq -r '.head.sha // empty' <<<"$pr_json")"
          else
            pr_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
            pr_number="$(jq -r '[.[] | select(.merged_at != null)] | first | .number // empty' <<<"$pr_json")"
            pr_head_sha="$(jq -r '[.[] | select(.merged_at != null)] | first | .head.sha // empty' <<<"$pr_json")"
          fi
          if [ -z "$pr_number" ] || [ -z "$pr_head_sha" ]; then
            echo "::error::No merged PR provenance found for production SHA ${GITHUB_SHA}; visual release gate fails closed."
            exit 1
          fi
          run_id=""
          for attempt in $(seq 1 8); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/portal-v2-live-preview.yml/runs?event=workflow_run&per_page=100")"
            expected_title="portal-preview-pr-${pr_number}-${pr_head_sha}"
            run_id="$(jq -r --arg title "$expected_title" '[.workflow_runs[] | select(.conclusion == "success" and .display_title == $title)] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            if [ -n "$run_id" ]; then
              break
            fi
            echo "Waiting for successful exact-head PR readback ${pr_head_sha} (attempt ${attempt}/60)"
            sleep 4
          done
          mkdir -p artifacts/visual-baseline-pr
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -n "visual-baseline-pr-${pr_number}-${pr_head_sha}" -D artifacts/visual-baseline-pr
            test -s artifacts/visual-baseline-pr/portal-v2-canvassen.png
            echo "Approved visual baseline resolved from PR #${pr_number}, head ${pr_head_sha}, run ${run_id}."
          else
            # Some workflow_run payloads omit pull_requests[] and cancel their
            # auxiliary PR baseline run. This is NOT grounds to waive visuals:
            # reconstruct the baseline exclusively from that exact, already
            # protected-merged PR head, pinned to Netlify's immutable deploy.
            echo "::notice::Exact-head PR screenshot artifact unavailable; require identical-source immutable preview screenshot."
            statuses="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${pr_head_sha}/status")"
            target="$(jq -r '[.statuses[] | select(.context == "netlify/bedrijfsgeheugen/deploy-preview" and .state == "success")] | first | .target_url // empty' <<<"$statuses")"
            if [ -z "$target" ]; then
              echo "::error::Trusted Netlify preview status missing for protected PR head ${pr_head_sha}; visual readback remains blocked."
              exit 1
            fi
            if [ "$target" = "https://deploy-preview-${pr_number}--bedrijfsgeheugen.netlify.app" ]; then
              # Netlify sometimes returns the exact PR's preview alias rather
              # than a provider deploy dashboard URL. Verify exact SHA there,
              # then pin the returned deploy ID to the immutable host.
              alias_release="$(curl --fail --silent --show-error --max-time 30 -H 'Cache-Control: no-cache' "${target}/release.json?head=${pr_head_sha}")" || {
                echo "::error::Exact numbered Netlify PR alias could not serve release identity."
                exit 1
              }
              alias_sha="$(node -e 'try { const d=JSON.parse(process.argv[1]); process.stdout.write(String(d.commit_ref||"")); } catch {}' "$alias_release")"
              alias_id="$(node -e 'try { const d=JSON.parse(process.argv[1]); process.stdout.write(String(d.deploy_id||"")); } catch {}' "$alias_release")"
              if [ "$alias_sha" != "$pr_head_sha" ] || [[ ! "$alias_id" =~ ^[a-f0-9]{24}$ ]]; then
                echo "::error::Unpinned Netlify PR alias does not match the exact protected head."
                exit 1
              fi
              preview_url="https://${alias_id}--bedrijfsgeheugen.netlify.app"
            else
              preview_url="$(node tools/ci/netlify-immutable-preview-target.mjs "$target")" || {
                echo "::error::Netlify preview target is not an allowed immutable deployment."
                exit 1
              }
            fi
            release="$(curl --fail --silent --show-error --max-time 30 -H 'Cache-Control: no-cache' "${preview_url}/release.json?sha=${pr_head_sha}" || true)"
            verified_sha="$(node -e 'try { const d=JSON.parse(process.argv[1]); process.stdout.write(String(d.commit_ref||"")); } catch {}' "$release")"
            verified_id="$(node -e 'try { const d=JSON.parse(process.argv[1]); process.stdout.write(String(d.deploy_id||"")); } catch {}' "$release")"
            expected_id="$(printf '%s' "$preview_url" | sed -nE 's#^https://([a-f0-9]{24})--bedrijfsgeheugen\.netlify\.app$#\1#p')"
            if [ -n "$release" ]; then
              if [ "$verified_sha" != "$pr_head_sha" ] || [ -z "$expected_id" ] || [ "$verified_id" != "$expected_id" ]; then
                echo "::error::Immutable PR preview SHA/deploy identity mismatch; no visual baseline can be accepted."
                exit 1
              fi
              PRODUCTION_URL="$preview_url" VISUAL_CAPTURE_PATH=artifacts/visual-baseline-pr/portal-v2-canvassen.png \
                npx playwright test tests/integration/portal-v2-production-visual-regression.spec.js --workers=1
              test -s artifacts/visual-baseline-pr/portal-v2-canvassen.png
              echo "Verified immutable PR baseline: merged PR #${pr_number}, head ${pr_head_sha}, deploy ${expected_id}; production will be independently compared."
            else
              # Netlify can legitimately cancel an unchanged deploy-preview build.
              # No screenshot is waived: reproduce the exact protected-merged PR
              # source in an isolated checkout and compare its browser pixels
              # with the independently pinned immutable production deployment.
              echo "::notice::Netlify has no immutable exact-head preview; reconstructing an approved exact-source browser baseline, not substituting an unrelated deploy."
              git fetch --no-tags origin "+refs/pull/${pr_number}/head:refs/remotes/approved-visual-pr/${pr_number}"
              verified_head="$(git rev-parse "refs/remotes/approved-visual-pr/${pr_number}")"
              if [ "$verified_head" != "$pr_head_sha" ]; then
                echo "::error::Fetched approved PR source does not match its protected merged head."
                exit 1
              fi
              source_dir="$(mktemp -d)"
              git worktree add --detach "$source_dir" "$pr_head_sha"
              if [ ! -f "$source_dir/portal-v2/index.html" ] || [ -e "$source_dir/portaal/demo" ] || [ -L "$source_dir/portaal/demo" ]; then
                echo "::error::Approved PR source cannot be safely projected as an isolated demo route."
                exit 1
              fi
              mkdir -p "$source_dir/portaal"
              ln -s ../portal-v2 "$source_dir/portaal/demo"
              ln -s "$GITHUB_WORKSPACE/node_modules" "$source_dir/node_modules"
              (
                cd "$source_dir"
                python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bg-approved-pr-source-server.log 2>&1 &
                server_pid=$!
                trap 'kill "$server_pid" 2>/dev/null || true' EXIT
                for i in $(seq 1 30); do
                  if curl -fsS --max-time 5 "http://127.0.0.1:4173/portaal/demo/" -o /dev/null; then break; fi
                  if [ "$i" -eq 30 ]; then
                    echo "::error::Approved PR source demo did not become reachable."
                    exit 1
                  fi
                  sleep 1
                done
                PRODUCTION_URL=http://127.0.0.1:4173 \
                  VISUAL_CAPTURE_PATH="$GITHUB_WORKSPACE/artifacts/visual-baseline-pr/portal-v2-canvassen.png" \
                  "$GITHUB_WORKSPACE/node_modules/.bin/playwright" test \
                  tests/integration/portal-v2-production-visual-regression.spec.js --workers=1
              )
              test -s artifacts/visual-baseline-pr/portal-v2-canvassen.png
              git worktree remove --force "$source_dir"
              echo "Verified exact-source approved browser baseline: merged PR #${pr_number}, head ${pr_head_sha}; production pixels will still be compared fail-closed."
            fi
          fi
      - name: Visual regression against approved PR baseline
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.VISUAL_BASELINE_REQUIRED == 'true'
        env:
          PRODUCTION_URL: ${{ env.PORTAL_READBACK_URL }}
          VISUAL_BASELINE: artifacts/visual-baseline-pr/portal-v2-canvassen.png
          VISUAL_ACTUAL_PATH: artifacts/visual-production/portal-v2-canvassen.png
        run: npx playwright test tests/integration/portal-v2-production-visual-regression.spec.js --workers=1
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-v2-production-dom-readback-${{ env.PORTAL_EXPECTED_SHA }}
          path: |
            playwright-report/
            test-results/
            artifacts/portal-v2-*.png
            artifacts/visual-current-main/*.png
            artifacts/visual-production/*.png
          if-no-files-found: ignore
          retention-days: 30
