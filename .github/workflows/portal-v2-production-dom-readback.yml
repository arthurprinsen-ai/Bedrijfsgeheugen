name: Portal V2 Production DOM Readback

on:
  pull_request:
    branches: [main]
    paths:
      - 'portal-v2/**'
      - 'tests/integration/portal-v2-production-*.spec.js'
      - 'tests/integration/portal-v2-mobile-shell.spec.js'
      - '.github/workflows/portal-v2-production-dom-readback.yml'
  push:
    branches: [main]
    paths:
      - 'portal-v2/**'
      - 'tests/integration/portal-v2-production-*.spec.js'
      - 'tests/integration/portal-v2-mobile-shell.spec.js'
      - '.github/workflows/portal-v2-production-dom-readback.yml'
  workflow_dispatch:

concurrency:
  group: portal-v2-production-dom-readback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-dom-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Chromium verifier
        run: |
          PLAYWRIGHT_PACKAGE=@playwright/test@1.55.0 bash tools/ci/install-chromium.sh
      - name: Resolve exact readback target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "PORTAL_READBACK_URL=https://deploy-preview-${PR_NUMBER}--bedrijfsgeheugen.netlify.app" >> "$GITHUB_ENV"
            echo "PORTAL_EXPECTED_SHA=${PR_HEAD_SHA}" >> "$GITHUB_ENV"
          else
            echo "PORTAL_READBACK_URL=https://www.bedrijfsgeheugen.nl" >> "$GITHUB_ENV"
            echo "PORTAL_EXPECTED_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi
      - name: Wait for exact deployed SHA
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            payload="$(curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "${PORTAL_READBACK_URL}/deploy-identity.json?sha=${PORTAL_EXPECTED_SHA}&attempt=${attempt}" || true)"
            deployed_sha="$(node -e 'try { const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.commit_ref||"")); } catch {}' "$payload")"
            if [ "$deployed_sha" = "$PORTAL_EXPECTED_SHA" ]; then
              echo "Exact deploy ready: $deployed_sha"
              break
            fi
            echo "Waiting for exact deploy ${PORTAL_EXPECTED_SHA}; observed ${deployed_sha:-none} (attempt ${attempt}/90)"
            if [ "$attempt" -eq 90 ]; then
              echo "::error::Exact Netlify deploy SHA did not become ready. Expected ${PORTAL_EXPECTED_SHA}, observed ${deployed_sha:-none}."
              exit 1
            fi
            sleep 4
          done
      - name: Wait for exact readback target
        env:
          CACHEBUST: bg_preview_ready
        run: bash tools/ci/wait-for-url.sh "${PORTAL_READBACK_URL}/portal-v2/"
      - name: Read back Portal V2 DOM, standalone routing and CSRD assets
        env:
          PRODUCTION_URL: ${{ env.PORTAL_READBACK_URL }}
        run: npx playwright test tests/integration/portal-v2-production-*.spec.js --workers=1
      - name: Read back hydrated mobile demoAI shell
        env:
          PREVIEW_URL: ${{ env.PORTAL_READBACK_URL }}
        run: npx playwright test tests/integration/portal-v2-mobile-shell.spec.js --workers=1
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-v2-production-dom-readback-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            artifacts/portal-v2-*.png
          if-no-files-found: ignore
          retention-days: 30
