name: Portal V2 Production DOM Readback

on:
  pull_request:
    branches: [main]
    paths:
      - 'portal-v2/**'
      - 'tests/integration/portal-v2-production-*.spec.js'
      - '.github/workflows/portal-v2-production-dom-readback.yml'
  push:
    branches: [main]
    paths:
      - 'portal-v2/**'
      - 'tests/integration/portal-v2-production-*.spec.js'
      - '.github/workflows/portal-v2-production-dom-readback.yml'
  workflow_dispatch:

concurrency:
  group: portal-v2-production-dom-readback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-dom-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Chromium verifier
        run: |
          PLAYWRIGHT_PACKAGE=@playwright/test@1.55.0 bash tools/ci/install-chromium.sh
      - name: Resolve exact readback target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "PORTAL_READBACK_URL=https://deploy-preview-${PR_NUMBER}--bedrijfsgeheugen.netlify.app" >> "$GITHUB_ENV"
          else
            echo "PORTAL_READBACK_URL=https://www.bedrijfsgeheugen.nl" >> "$GITHUB_ENV"
          fi
      # Wachtte eerder dertig pogingen van tien seconden: vijf minuten. Een deploy
      # preview van deze repo is soms later klaar, waardoor deze check rood ging
      # met een 404 terwijl er niets mis was. Het gedeelde script hanteert een
      # venster van twaalf minuten en logt hoeveel tijd het werkelijk kostte.
      - name: Wait for exact readback target
        env:
          CACHEBUST: bg_preview_ready
        run: bash tools/ci/wait-for-url.sh "${PORTAL_READBACK_URL}/portal-v2/"
      - name: Read back Portal V2 DOM, standalone routing and CSRD assets
        env:
          PRODUCTION_URL: ${{ env.PORTAL_READBACK_URL }}
        run: npx playwright test tests/integration/portal-v2-production-*.spec.js --workers=1
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-v2-production-dom-readback-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
