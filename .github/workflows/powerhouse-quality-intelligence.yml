name: Powerhouse Quality Intelligence

on:
  pull_request:
    branches: [main]
    paths:
      - 'powerhouse/assurance/**'
      - 'scripts/brain/powerhouse-quality-intelligence.mjs'
      - 'scripts/brain/quality/**'
      - 'tests/brain-quality-intelligence*.test.mjs'
      - 'tests/brain-quality-*.test.mjs'
      - 'tests/brain-quality/**'
      - 'tests/brain-quality-performance/**'
      - 'config/powerhouse-quality-*.json'
      - 'config/powerhouse-vulnerability-baseline.json'
      - 'config/stryker.quality.conf.json'
      - 'contracts/openapi/**'
      - 'site/**'
      - 'portal-v2/**'
      - 'netlify/functions/**'
      - 'supabase/**'
      - '.github/workflows/powerhouse-quality-intelligence.yml'
      - 'docs/powerhouse/POWERHOUSE_QUALITY_INTELLIGENCE.md'
      - 'docs/superpowers/specs/2026-09-16-powerhouse-quality-intelligence*.md'
      - 'docs/superpowers/plans/2026-09-16-powerhouse-quality-*.md'
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: powerhouse-quality-intelligence-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  PLAYWRIGHT_VERSION: '1.63.0'
  AXE_PLAYWRIGHT_VERSION: '4.13.0'
  STRYKER_VERSION: '10.0.0'
  TRIVY_VERSION: '0.74.0'
  K6_VERSION: '2.2.0'
  ZAP_VERSION: '2.17.0'
  SYFT_VERSION: '1.33.0'
  QUALITY_OPENAPI_SPEC: 'contracts/openapi/powerhouse-public-api.yaml'
  QUALITY_INTEGRATION_PROFILE: 'postgres'

jobs:
  quality-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Mandatory chat-learning preflight
        run: node scripts/brain/chat-learning-preflight.mjs
      - name: Deterministic Quality Intelligence v1 v2 and Autopilot contracts
        run: >-
          node --test
          tests/brain-quality-intelligence.test.mjs
          tests/brain-quality-intelligence-v2.test.mjs
          tests/brain-quality-autopilot.test.mjs
          tests/brain-quality-autopilot-closed-loop.test.mjs
          tests/brain-quality-exploration.test.mjs
          tests/brain-quality-adversarial.test.mjs
          tests/brain-quality-production-shadow.test.mjs
          tests/brain-quality-economics.test.mjs
      - name: Canonical quality contract validator
        run: node scripts/brain/powerhouse-quality-intelligence.mjs --check
      - name: Flake probe cannot retry-to-green
        run: node scripts/brain/quality/repeat-flake-check.mjs

  backend-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install property API and real-service test engines
        run: python -m pip install --disable-pip-version-check pytest hypothesis schemathesis testcontainers 'psycopg[binary]'
      - name: Property-based backend invariants
        run: pytest -q tests/brain-quality/test_powerhouse_quality_properties.py
      - name: Registered API contract harness
        run: pytest -q tests/brain-quality/test_powerhouse_api_contract.py
      - name: Registered PostgreSQL Testcontainers integration harness
        run: pytest -q tests/brain-quality/test_powerhouse_integration_profile.py

  supply-chain-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Trivy vulnerability secret and misconfiguration sensor
        id: trivy
        run: |
          mkdir -p artifacts/quality/security
          docker run --rm -v "$PWD:/workspace" -w /workspace aquasec/trivy:${TRIVY_VERSION} fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format json \
            --output artifacts-trivy.json \
            --exit-code 0 .
      - name: Blocking new-vulnerability delta gate
        id: vulnerability_delta
        run: >-
          node scripts/brain/quality/vulnerability-delta.mjs
          --trivy artifacts-trivy.json
          --baseline config/powerhouse-vulnerability-baseline.json
          --output artifacts/quality/security/vulnerability-delta.json
          --check
      - name: Record Trivy/delta evidence
        if: always()
        run: node scripts/brain/quality/sensor-evidence.mjs trivy '${{ steps.vulnerability_delta.outcome }}' artifacts/quality/security/sensor-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-security-${{ github.sha }}
          path: |
            artifacts-trivy.json
            artifacts/quality/security
          retention-days: 90

  deep-frontend:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify bounded exploration policy before browser work
        run: node --test tests/brain-quality-exploration.test.mjs
      - name: Install accepted browser and accessibility engines
        run: npm install --no-save --no-audit --no-fund playwright@${PLAYWRIGHT_VERSION} @axe-core/playwright@${AXE_PLAYWRIGHT_VERSION}
      - name: Install Chromium Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser runtime accessibility responsive and semantic audit
        id: deep_frontend
        env:
          QUALITY_BASE_URL: https://www.bedrijfsgeheugen.nl
        run: node scripts/brain/quality/frontend-deep-audit.mjs
      - name: Record deep frontend evidence
        if: always()
        run: node scripts/brain/quality/sensor-evidence.mjs cross_browser_semantic_visual '${{ steps.deep_frontend.outcome }}' artifacts/quality/frontend/sensor-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-frontend-${{ github.sha }}
          path: artifacts/quality/frontend
          retention-days: 90

  adversarial-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Safe stateful fuzz chaos and security target matrix
        id: fuzz_chaos
        run: node --test tests/brain-quality-adversarial.test.mjs tests/brain-quality-production-shadow.test.mjs
      - name: Record fuzz chaos evidence
        if: always()
        run: node scripts/brain/quality/sensor-evidence.mjs fuzz_chaos '${{ steps.fuzz_chaos.outcome }}' artifacts/quality/adversarial/sensor-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-adversarial-${{ github.sha }}
          path: artifacts/quality/adversarial
          retention-days: 90

  game-days:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Execute safe fault-detection and recovery simulations
        run: node scripts/brain/quality/game-day.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-game-days-${{ github.sha }}
          path: artifacts/quality/game-days
          retention-days: 90

  performance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Public synthetic k6 SLO probe
        id: k6
        run: docker run --rm -v "$PWD:/work" -w /work -e QUALITY_BASE_URL=https://www.bedrijfsgeheugen.nl grafana/k6:${K6_VERSION} run tests/brain-quality-performance/powerhouse-smoke.js
      - name: Record k6 evidence
        if: always()
        run: node scripts/brain/quality/sensor-evidence.mjs k6 '${{ steps.k6.outcome }}' artifacts/quality/performance/sensor-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-performance-${{ github.sha }}
          path: artifacts/quality/performance
          retention-days: 90

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Mutation sensitivity of deterministic quality core
        id: mutation
        run: |
          mkdir -p artifacts/quality
          npx --yes @stryker-mutator/core@${STRYKER_VERSION} run config/stryker.quality.conf.json
      - name: Record mutation evidence
        if: always()
        run: node scripts/brain/quality/sensor-evidence.mjs mutation '${{ steps.mutation.outcome }}' artifacts/quality/mutation/sensor-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-mutation-${{ github.sha }}
          path: artifacts/quality
          retention-days: 90

  passive-dast:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Passive OWASP ZAP baseline
        id: zap
        run: |
          mkdir -p artifacts/quality/zap
          chmod 777 artifacts/quality/zap
          docker run --rm -v "$PWD/artifacts/quality/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:${ZAP_VERSION} \
            zap-baseline.py -t https://www.bedrijfsgeheugen.nl -J report.json -r report.html -I
      - name: Record ZAP evidence
        if: always()
        run: node scripts/brain/quality/sensor-evidence.mjs zap '${{ steps.zap.outcome }}' artifacts/quality/zap/sensor-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-zap-${{ github.sha }}
          path: artifacts/quality/zap
          retention-days: 90

  sbom-provenance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build exact-SHA Quality Intelligence subject artifact
        run: |
          mkdir -p artifacts/quality/provenance
          tar -czf artifacts/quality/provenance/quality-intelligence-${GITHUB_SHA}.tar.gz \
            powerhouse/assurance/quality-intelligence.json \
            powerhouse/assurance/quality-intelligence-v2.json \
            config/powerhouse-quality-autopilot.json \
            scripts/brain/powerhouse-quality-intelligence.mjs \
            scripts/brain/quality \
            config/powerhouse-quality-surfaces.json \
            config/powerhouse-quality-adversarial-matrix.json
      - name: Generate CycloneDX SBOM
        run: |
          docker run --rm -v "$PWD:/work" -w /work anchore/syft:v${SYFT_VERSION} \
            dir:. -o cyclonedx-json=artifacts/quality/provenance/quality-intelligence-${GITHUB_SHA}.cdx.json
      - name: Attest exact-SHA SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: artifacts/quality/provenance/quality-intelligence-${{ github.sha }}.tar.gz
          sbom-path: artifacts/quality/provenance/quality-intelligence-${{ github.sha }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: quality-provenance-${{ github.sha }}
          path: artifacts/quality/provenance
          retention-days: 90

  innovation-scout:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Observe approved primary quality sources
        run: node scripts/brain/quality/innovation-scout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-innovation-scout-${{ github.sha }}
          path: artifacts/quality/innovation-scout.json
          retention-days: 90
