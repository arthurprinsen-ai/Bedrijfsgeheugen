name: Apply homepage hero video integration

on:
  push:
    branches:
      - automation/openart-hero-homepage-integration
    paths:
      - .github/workflows/apply-homepage-hero-video.yml
      - tools/apply-homepage-hero-video.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/openart-hero-homepage-integration
      - name: Apply exact-anchor homepage patch
        run: python tools/apply-homepage-hero-video.py
      - name: Verify patch before commit
        run: node tests/homepage-hero-video.test.mjs
      - name: Commit patch and remove one-time tooling
        run: |
          git rm .github/workflows/apply-homepage-hero-video.yml tools/apply-homepage-hero-video.py
          git add index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --cached --check
          git commit -m "feat: add accepted OpenArt video to homepage hero"
          git push origin HEAD:automation/openart-hero-homepage-integration
