name: Component Foundation TDD

on:
  push:
    branches:
      - automation/component-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test tests/parallel-ownership.test.mjs tests/change-classes.test.mjs tests/page-composition.test.mjs tests/component-preview-composition.test.mjs tests/component-boundaries.test.mjs tests/change-scope.test.mjs tests/component-hash-protection.test.mjs tests/detect-changed-components.test.mjs tests/component-preview-workflow-contract.test.mjs
