name: Component Foundation TDD

on:
  push:
    branches:
      - automation/component-foundation
  pull_request:
    branches:
      - main
    paths:
      - 'config/**'
      - 'components/_schema/**'
      - 'pages/**'
      - 'preview/**'
      - 'tools/compose-site.mjs'
      - 'tools/compose-component-preview.mjs'
      - 'tests/parallel-ownership.test.mjs'
      - 'tests/change-classes.test.mjs'
      - 'tests/page-composition.test.mjs'
      - 'tests/component-preview-composition.test.mjs'
      - '.github/workflows/component-foundation-tdd.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test tests/parallel-ownership.test.mjs tests/change-classes.test.mjs tests/page-composition.test.mjs tests/component-preview-composition.test.mjs
