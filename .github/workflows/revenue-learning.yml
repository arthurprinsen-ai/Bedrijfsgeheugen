name: Revenue Learning

on:
  pull_request:
    paths:
      - 'netlify/functions/_revenue-learning-*.mjs'
      - 'netlify/functions/revenue-learning-*.mjs'
      - 'supabase/functions/revenue-learning-store/**'
      - 'supabase/migrations/*revenue_learning*.sql'
      - 'tests/revenue-learning-*.test.mjs'
      - 'tests/growth-intelligence-*.test.mjs'
      - 'tests/supabase-migration-history-integrity.test.mjs'
      - 'supabase/migration-history.lock.json'
      - 'supabase/migrations/**'
      - 'tests/supabase-migration-history-integrity.test.mjs'
      - 'supabase/migrations/**'
      - 'supabase/migration-history.lock.json'
      - 'platform/growth-intelligence-engine.mjs'
      - 'netlify/functions/growth-intelligence-daily.mjs'
      - '.github/workflows/revenue-learning.yml'
  push:
    branches: [main]
    paths:
      - 'netlify/functions/_revenue-learning-*.mjs'
      - 'netlify/functions/revenue-learning-*.mjs'
      - 'supabase/functions/revenue-learning-store/**'
      - 'supabase/migrations/*revenue_learning*.sql'
      - 'tests/revenue-learning-*.test.mjs'
      - 'tests/growth-intelligence-*.test.mjs'
      - 'tests/supabase-migration-history-integrity.test.mjs'
      - 'supabase/migration-history.lock.json'
      - 'supabase/migrations/**'
      - 'platform/growth-intelligence-engine.mjs'
      - 'netlify/functions/growth-intelligence-daily.mjs'
      - '.github/workflows/revenue-learning.yml'

permissions:
  contents: read

jobs:
  revenue-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Verify unified revenue learning contracts
        run: >-
          node --test
          tests/revenue-learning-*.test.mjs
          tests/growth-intelligence-engine.test.mjs
          tests/growth-intelligence-daily.test.mjs
          tests/supabase-migration-history-integrity.test.mjs
